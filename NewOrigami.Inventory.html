<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Inventory & Card Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #58a6ff;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* GALLERY (LEFT) */
        #gallery-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            align-content: start;
        }

        .inv-card {
            background: rgba(30, 35, 40, 0.9);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 2px 2px 5px rgba(255,255,255,0.05);
        }

        .inv-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(88, 166, 255, 0.2), 0 0 0 2px var(--accent-color);
        }

        .inv-kanji {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            font-family: 'Noto Sans JP', sans-serif;
        }

        .inv-title {
            font-size: 16px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .inv-type {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        /* EDITOR PANEL (RIGHT) */
        #editor-panel {
            width: 450px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .editor-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h2 {
            margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 1px;
        }

        .editor-body {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 700;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* 3D PREVIEW */
        #preview-container {
            width: 100%;
            height: 200px;
            background: radial-gradient(circle at center, #222, #000);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #preview-overlay {
            position: absolute;
            bottom: 10px; right: 10px;
            font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.4);
            pointer-events: none;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-primary:hover { background: #79c0ff; }
        .btn-primary:active { transform: scale(0.98); }

        .btn-export {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            margin-top: 15px;
        }
        .btn-export:hover { background: rgba(88, 166, 255, 0.1); }

    </style>
</head>
<body>

    <div id="gallery-container">
        <!-- Cards will be injected here -->
    </div>

    <div id="editor-panel">
        <div class="editor-header">
            <h2>CARD EDITOR</h2>
            <i class="fa-solid fa-code"></i>
        </div>
        <div class="editor-body">
            
            <div id="preview-container">
                <span id="preview-overlay">3D PREVIEW (Animation Name)</span>
                <!-- WebGL Renderer goes here -->
            </div>

            <form id="card-form">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="edit-name">Card Name</label>
                    <input type="text" id="edit-name" title="Card Name">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-el">Element / Theme</label>
                        <select id="edit-el" title="Element / Theme">
                            <option value="EARTH">EARTH</option>
                            <option value="FIRE">FIRE</option>
                            <option value="WATER">WATER</option>
                            <option value="WIND">WIND</option>
                            <option value="MISSILE">MISSILE</option>
                            <option value="KATANA">KATANA</option>
                            <option value="ITEM">ITEM</option>
                            <option value="SCROLL">SCROLL</option>
                            <option value="ARMOR">ARMOR</option>
                            <option value="GOLD_COIN">GOLD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-kanji">Kanji</label>
                        <input type="text" id="edit-kanji" maxlength="2" title="Kanji">
                    </div>
                </div>

                <div class="form-group">
                    <label for="edit-desc">Description</label>
                    <input type="text" id="edit-desc" title="Description">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-dice">Damage / Effect Dice</label>
                        <input type="number" id="edit-dice" min="0" max="20" title="Damage / Effect Dice">
                    </div>
                    <div class="form-group">
                        <label for="edit-dot">DOT / Bleed Turns</label>
                        <input type="number" id="edit-dot" min="0" max="10" title="DOT / Bleed Turns">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="edit-attr">Status Line (e.g. DMG * 4DICE)</label>
                    <input type="text" id="edit-attr" title="Status Line">
                </div>

                <div class="form-group">
                    <label for="edit-animation">Animation Style</label>
                    <select id="edit-animation" title="Animation Style">
                        <option value="projectile_fireball">Projectile: Fireball</option>
                        <option value="projectile_boulder">Projectile: Boulder</option>
                        <option value="projectile_wind">Projectile: Wind Gale</option>
                        <option value="projectile_surge">Projectile: Water Surge</option>
                        <option value="projectile_shuriken">Projectile: Shuriken</option>
                        <option value="projectile_arrow">Projectile: Arrow</option>
                        <option value="aoe_fissure">AOE: Fissure</option>
                        <option value="aoe_comet">AOE: Comet Strike</option>
                        <option value="aoe_tide">AOE: Tidal Wave</option>
                        <option value="melee_slash">Melee: Slash</option>
                        <option value="melee_thrust">Melee: Thrust</option>
                        <option value="melee_strong">Melee: Hard Attack</option>
                        <option value="effect_heal">Effect: Heal / Green Sparkles</option>
                        <option value="effect_buff">Effect: Buff Aura</option>
                        <option value="effect_defend">Effect: Shield / Defense</option>
                        <option value="effect_equip">Effect: Equip / Flash</option>
                        <option value="effect_gold">Effect: Gold Burst</option>
                    </select>
                </div>

                <button type="button" class="btn-primary" onclick="saveCard()">SAVE CHANGES</button>
                <button type="button" class="btn-primary btn-export" onclick="exportJSON()">COPY JSON TO CLIPBOARD</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.css"></script>
    <script src="js/data/cards.js"></script>
    <script>
        // Use local storage if available, otherwise default to window.OrigamiCards
        let db = [];
        try {
            const stored = localStorage.getItem('OrigamiMasterInventory');
            if (stored) {
                db = JSON.parse(stored);
            } else {
                db = JSON.parse(JSON.stringify(window.OrigamiCards));
            }
        } catch(e) {
            db = window.OrigamiCards;
        }

        const gallery = document.getElementById('gallery-container');

        // Color mapping based on Element
        const elementColors = {
            'FIRE': '#ff4400',
            'WATER': '#00bbff',
            'EARTH': '#88cc44',
            'WIND': '#00ffcc',
            'KATANA': '#ffaa00',
            'MISSILE': '#ccaa88',
            'ITEM': '#ff55aa',
            'SCROLL': '#bb88ff',
            'ARMOR': '#8888aa',
            'GOLD_COIN': '#ffd700'
        };

        function renderGallery() {
            gallery.innerHTML = '';
            db.forEach(card => {
                const el = document.createElement('div');
                el.className = 'inv-card';
                const c = elementColors[card.el] || '#fff';
                el.innerHTML = `
                    <div class="inv-kanji" style="color: ${c}">${card.kanji}</div>
                    <div class="inv-title">${card.name}</div>
                    <div class="inv-type">${card.type} - ${card.el}</div>
                `;
                el.onclick = () => loadEditor(card);
                gallery.appendChild(el);
            });
        }

        function loadEditor(card) {
            document.getElementById('edit-id').value = card.id;
            document.getElementById('edit-name').value = card.name;
            document.getElementById('edit-el').value = card.el;
            document.getElementById('edit-kanji').value = card.kanji;
            document.getElementById('edit-desc').value = card.desc;
            document.getElementById('edit-dice').value = card.dice;
            document.getElementById('edit-dot').value = card.dot;
            document.getElementById('edit-attr').value = card.attr;
            document.getElementById('edit-animation').value = card.animation;
            
            document.getElementById('preview-overlay').textContent = `ANIM: ${card.animation}`;
        }

        function saveCard() {
            const id = document.getElementById('edit-id').value;
            if (!id) return;
            
            const card = db.find(c => c.id === id);
            if (card) {
                card.name = document.getElementById('edit-name').value;
                card.el = document.getElementById('edit-el').value;
                card.kanji = document.getElementById('edit-kanji').value;
                card.desc = document.getElementById('edit-desc').value;
                card.dice = parseInt(document.getElementById('edit-dice').value) || 0;
                card.dot = parseInt(document.getElementById('edit-dot').value) || 0;
                card.attr = document.getElementById('edit-attr').value;
                card.animation = document.getElementById('edit-animation').value;
                
                try {
                    localStorage.setItem('OrigamiMasterInventory', JSON.stringify(db));
                    // Alert feedback
                    const btn = document.querySelector('.btn-primary');
                    const orig = btn.textContent;
                    btn.textContent = 'SAVED!';
                    btn.style.background = '#4caf50';
                    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1500);
                } catch(e) {}
                
                renderGallery();
            }
        }

        function exportJSON() {
            const jsonStr = JSON.stringify(db, null, 4);
            navigator.clipboard.writeText(jsonStr).then(() => {
                const btn = document.querySelector('.btn-export');
                btn.textContent = 'COPIED!';
                setTimeout(() => { btn.textContent = 'COPY JSON TO CLIPBOARD'; }, 2000);
            });
        }

        // Initialize
        renderGallery();
        if (db.length > 0) loadEditor(db[0]);

    </script>
</body>
</html>
