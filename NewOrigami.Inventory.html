<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Inventory & Card Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #58a6ff;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* GALLERY (LEFT) */
        #gallery-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 25px;
            align-content: start;
        }

        .inv-card {
            --card-w: 140px;
            --card-h: 210px;
            -webkit-user-select: none; user-select: none;
            position: relative; width: var(--card-w); height: var(--card-h); 
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; text-align: center; color: #fff; 
            background: #1a1a1a;   
            transition: transform 0.2s, box-shadow 0.2s;
            padding: 0; box-sizing: border-box;
            border: none;
            box-shadow:
                4px 4px 12px rgba(0,0,0,0.8),
                -2px -2px 6px rgba(255,255,255,0.04),
                inset 1px 1px 0px rgba(255,255,255,0.2),
                inset 2px 2px 0px var(--theme-clr, rgba(255,255,255,0.15)),
                inset -2px -2px 0px rgba(0,0,0,0.5),
                0 0 0 1px var(--theme-clr, transparent);
            cursor: pointer;
        }
        
        .inv-card::before {
            content: ''; position: absolute; top: 1px; left: 1px; right: 1px; bottom: 1px; 
            border-radius: inherit; pointer-events: none; z-index: 0;
            border: 1px solid rgba(255,255,255,0.05); background: transparent;
        }

        .inv-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 0 2px var(--theme-clr);
        }

        /* Rigid Vertical Symmetry Zones */
        .card-header { width: 100%; height: 26px; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 4px; flex-shrink: 0; z-index: 1; margin-top: 5px; }
        .card-kanji { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 900; color: var(--theme-clr); font-family: 'Noto Sans JP', sans-serif; text-shadow: 0 0 10px var(--theme-clr); }
        .card-type-pill { background: var(--theme-clr); color: #fff; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.2); }
        
        .card-title { font-weight: 900; font-size: 13px; height: 18px; display: flex; align-items: center; margin: 4px 0 0 0; text-transform: uppercase; flex-shrink: 0; z-index: 1; }
        .card-desc { font-weight: 800; font-size: 8px; height: 12px; display: flex; align-items: center; color: var(--text-muted); margin-bottom: 5px; flex-shrink: 0; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
        
        .card-icon-3d { 
            width: 70px; height: 70px; border-radius: 50%; 
            margin: auto; overflow: hidden; position: relative; flex-shrink: 0; 
            background: #0d0d12; z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 5px 5px 15px rgba(0,0,0,1), inset -3px -3px 8px rgba(255,255,255,0.1), 0 2px 5px rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
        }
        .card-icon-3d i { font-size: 32px; color: var(--theme-clr); opacity: 0.8; }
        
        .card-icon-3d::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%; pointer-events: none; z-index: 10;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 20%, rgba(0,0,0,0) 60%);
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.8), inset 2px 2px 8px rgba(255,255,255,0.4);
        }
        
        .card-attr-fused { 
            width: 100%; 
            height: 25px; 
            margin-top: auto; 
            background: rgba(10, 10, 12, 0.8); 
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #ffffff;
            font-weight: 900; 
            font-size: 9px;
            padding: 0 8px; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
            text-align: center; 
            box-sizing: border-box; 
            border-radius: 0 0 11px 11px;
            z-index: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* EDITOR PANEL (RIGHT) */
        #editor-panel {
            width: 450px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .editor-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h2 {
            margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 1px;
        }

        .editor-body {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 700;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* 3D PREVIEW */
        #preview-container {
            width: 100%;
            height: 200px;
            background: radial-gradient(circle at center, #222, #000);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #preview-overlay {
            position: absolute;
            bottom: 10px; right: 10px;
            font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.4);
            pointer-events: none;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-primary:hover { background: #79c0ff; }
        .btn-primary:active { transform: scale(0.98); }

        .btn-export {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            margin-top: 15px;
        }
        .btn-export:hover { background: rgba(88, 166, 255, 0.1); }

    </style>
</head>
<body>

    <div id="gallery-container">
        <!-- Cards will be injected here -->
    </div>

    <div id="editor-panel">
        <div class="editor-header">
            <h2>CARD EDITOR</h2>
            <i class="fa-solid fa-code"></i>
        </div>
        <div class="editor-body">
            
            <div id="preview-container">
                <span id="preview-overlay">3D PREVIEW (Animation Name)</span>
                <!-- WebGL Renderer goes here -->
            </div>

            <form id="card-form">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="edit-name">Card Name</label>
                    <input type="text" id="edit-name" title="Card Name">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-el">Element / Theme</label>
                        <select id="edit-el" title="Element / Theme">
                            <option value="EARTH">EARTH</option>
                            <option value="FIRE">FIRE</option>
                            <option value="WATER">WATER</option>
                            <option value="WIND">WIND</option>
                            <option value="MISSILE">MISSILE</option>
                            <option value="KATANA">KATANA</option>
                            <option value="ITEM">ITEM</option>
                            <option value="SCROLL">SCROLL</option>
                            <option value="ARMOR">ARMOR</option>
                            <option value="GOLD_COIN">GOLD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-kanji">Kanji</label>
                        <input type="text" id="edit-kanji" maxlength="2" title="Kanji">
                    </div>
                </div>

                <div class="form-group">
                    <label for="edit-desc">Description</label>
                    <input type="text" id="edit-desc" title="Description">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-dice">Damage / Effect Dice</label>
                        <input type="number" id="edit-dice" min="0" max="20" title="Damage / Effect Dice">
                    </div>
                    <div class="form-group">
                        <label for="edit-dot">DOT / Bleed Turns</label>
                        <input type="number" id="edit-dot" min="0" max="10" title="DOT / Bleed Turns">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="edit-attr">Status Line (e.g. DMG * 4DICE)</label>
                    <input type="text" id="edit-attr" title="Status Line">
                </div>

                <div class="form-group">
                    <label for="edit-animation">Animation Style</label>
                    <select id="edit-animation" title="Animation Style">
                        <option value="projectile_fireball">Projectile: Fireball</option>
                        <option value="projectile_boulder">Projectile: Boulder</option>
                        <option value="projectile_wind">Projectile: Wind Gale</option>
                        <option value="projectile_surge">Projectile: Water Surge</option>
                        <option value="projectile_shuriken">Projectile: Shuriken</option>
                        <option value="projectile_arrow">Projectile: Arrow</option>
                        <option value="aoe_fissure">AOE: Fissure</option>
                        <option value="aoe_comet">AOE: Comet Strike</option>
                        <option value="aoe_tide">AOE: Tidal Wave</option>
                        <option value="melee_slash">Melee: Slash</option>
                        <option value="melee_thrust">Melee: Thrust</option>
                        <option value="melee_strong">Melee: Strong Attack</option>
                        <option value="effect_heal">Effect: Heal / Green Sparkles</option>
                        <option value="effect_buff">Effect: Buff Aura</option>
                        <option value="effect_defend">Effect: Shield / Defense</option>
                        <option value="effect_equip">Effect: Equip / Flash</option>
                        <option value="effect_gold">Effect: Gold Burst</option>
                    </select>
                </div>

                <button type="button" class="btn-primary" onclick="saveCard()">SAVE CHANGES</button>
                <button type="button" class="btn-primary btn-export" onclick="exportJSON()">COPY JSON TO CLIPBOARD</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.css"></script>
    <script src="js/data/cards.js"></script>
    <script>
        // Use local storage if available, otherwise default to window.OrigamiCards
        let db = [];
        try {
            const stored = localStorage.getItem('OrigamiMasterInventory');
            if (stored) {
                db = JSON.parse(stored);
            } else {
                db = JSON.parse(JSON.stringify(window.OrigamiCards));
            }
        } catch(e) {
            db = window.OrigamiCards;
        }

        const gallery = document.getElementById('gallery-container');

        // Color mapping based on Element
        const elementColors = {
            'FIRE': '#ff4400',
            'WATER': '#00bbff',
            'EARTH': '#88cc44',
            'WIND': '#00ffcc',
            'KATANA': '#ffaa00',
            'MISSILE': '#ccaa88',
            'ITEM': '#ff55aa',
            'SCROLL': '#bb88ff',
            'ARMOR': '#8888aa',
            'GOLD_COIN': '#ffd700'
        };

        const iconClasses = {
            'FIRE': 'fa-fire',
            'WATER': 'fa-water',
            'EARTH': 'fa-mountain',
            'WIND': 'fa-wind',
            'KATANA': 'fa-burst',
            'MISSILE': 'fa-arrow-up',
            'ITEM': 'fa-flask',
            'SCROLL': 'fa-scroll',
            'ARMOR': 'fa-shield',
            'GOLD_COIN': 'fa-coins'
        };

        const scenes = {};
        const dpr = window.devicePixelRatio || 1;

        function init3DIcons() {
            const elements = ['EARTH', 'WATER', 'FIRE', 'WIND', 'ITEM', 'KATANA', 'SHIELD', 'DICE_EVEN', 'DICE_ODD', 'SCROLL', 'MISSILE', 'ARMOR'];
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            elements.forEach(el => {
                const scene = new THREE.Scene();
                scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const dir = new THREE.DirectionalLight(0xffffff, 2.2);
                dir.position.set(5, 5, 5); scene.add(dir);
                
                const mat = new THREE.MeshStandardMaterial({ 
                    color: { EARTH: 0x5C4033, WATER: 0x0d47a1, FIRE: 0xb71c1c, WIND: 0x37474f, ITEM: 0x1b5e20 }[el] || 0x444444,
                    roughness: 0.15, metalness: 0.4, flatShading: true, side: THREE.DoubleSide 
                });
                
                let group = new THREE.Group(), update = () => {};
                if (el === 'EARTH') {
                    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6, 1), mat); group.add(rock);
                    update = (t) => {
                        const b = Math.abs(Math.sin(t * 1.5)); rock.position.y = (b * 0.7) - 0.35; 
                        rock.rotation.x = t * 1.8; rock.rotation.z = t * 1.2;
                        if (b < 0.2) group.position.set(Math.sin(t * 5) * (0.2-b)*2, Math.cos(t * 6) * (0.1-b/2)*2, 0);
                        else group.position.set(0, 0, 0);
                    };
                } else if (el === 'FIRE') {
                    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), new THREE.MeshStandardMaterial({ color: 0xb71c1c, emissive: 0x4a0000, emissiveIntensity: 5, flatShading: true })); group.add(core);
                    const flames = [];
                    for(let i=0; i<36; i++) {
                        const s = new THREE.Mesh(new THREE.TetrahedronGeometry(0.22, 0), new THREE.MeshStandardMaterial({ color: i % 3 === 0 ? 0xffea00 : (i % 2 === 0 ? 0xff4500 : 0xb71c1c), transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending, flatShading: true }));
                        const ang = (i / 36) * Math.PI * 2, rad = 0.2 + Math.random() * 0.45;
                        s.position.set(Math.cos(ang) * rad, 0.3, Math.sin(ang) * rad); group.add(s);
                        flames.push({ m: s, s: 6 + Math.random() * 10, o: Math.random() * Math.PI, rs: (Math.random() - 0.5) * 5, bx: s.position.x, bz: s.position.z });
                    }
                    update = (t) => {
                        core.rotation.y = t * 1.2; core.scale.setScalar(1 + Math.sin(t * 12) * 0.08);
                        flames.forEach(f => {
                            const w = Math.sin(t * f.s + f.o); f.m.scale.setScalar(0.4 + w * 0.6); f.m.position.y = 0.3 + w * 0.4;
                            f.m.position.x = f.bx + Math.sin(t * 5 + f.o) * 0.1; f.m.position.z = f.bz + Math.cos(t * 5 + f.o) * 0.1; f.m.rotation.x = t * f.rs;
                        });
                    };
                } else if (el === 'WIND') {
                    const tornado = new THREE.Group();
                    for(let i=0; i<10; i++) {
                        const h = i/10, r = (h*1.4)+0.4, pts = [];
                        for(let j=0; j<=12; j++) pts.push(new THREE.Vector3(Math.cos((j/12)*Math.PI*2)*r, 0, Math.sin((j/12)*Math.PI*2)*r));
                        const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x37474f, opacity: 0.8, transparent: true }));
                        line.position.y = (h-0.5)*2.5; tornado.add(line);
                    }
                    group.add(tornado);
                    update = (t) => { tornado.children.forEach((l, idx) => { l.rotation.y = t*(idx+70); l.position.x = Math.sin(t*8 + idx)*0.1; }); tornado.rotation.z = Math.sin(t*4)*0.1; };
                } else if (el === 'WATER') {
                    const geo = new THREE.SphereGeometry(2.8, 32, 24); const mesh = new THREE.Mesh(geo, mat); mesh.position.y = -1.8; group.add(mesh);
                    update = (t) => {
                        const pos = geo.attributes.position;
                        for(let i=0; i<pos.count; i++) {
                            const x = pos.getX(i), z = pos.getZ(i); const w = Math.sin(x * 1.5 + t * 4) * 0.4 + Math.cos(z * 1.5 + t * 3) * 0.3;
                            if(pos.getY(i) > 0.5) pos.setY(i, 1.4 + w);
                        }
                        pos.needsUpdate = true;
                    };
                } else if (el === 'ITEM') {
                    const vial = new THREE.Group();
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 2.8, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, flatShading: true }));
                    const liq = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.0, 12), new THREE.MeshStandardMaterial({ color: 0x1b5e20, emissive: 0x002e03, emissiveIntensity: 0.5 }));
                    liq.position.y = -0.3; vial.add(body, liq);
                    const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
                    cork.position.y = 1.6; vial.add(cork); group.add(vial);
                    update = (t) => { vial.rotation.z = Math.sin(t * 2) * 0.2; liq.scale.y = 0.9 + Math.sin(t * 3) * 0.1; };
                } else if (el === 'KATANA') {
                    const hiltGeo = new THREE.BoxGeometry(0.3, 1.2, 0.3);
                    const hiltMat = new THREE.MeshStandardMaterial({color: 0x222222});
                    const hilt = new THREE.Mesh(hiltGeo, hiltMat);
                    const bladeGeo = new THREE.BoxGeometry(0.1, 3.5, 0.4);
                    const bladeMat = new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 0.8, roughness: 0.2});
                    const blade = new THREE.Mesh(bladeGeo, bladeMat);
                    blade.position.y = 2.0;
                    const guardGeo = new THREE.BoxGeometry(0.8, 0.1, 0.8);
                    const guardMat = new THREE.MeshStandardMaterial({color: 0xaa8800});
                    const guard = new THREE.Mesh(guardGeo, guardMat);
                    guard.position.y = 0.6;
                    group.add(hilt, blade, guard);
                    group.position.y = -1.0;
                    update = (t) => { group.rotation.z = Math.sin(t * 3) * 0.2; group.rotation.y = t * 0.5; };
                } else if (el === 'SHIELD' || el === 'ARMOR') {
                    const shieldGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32);
                    const shieldMat = new THREE.MeshStandardMaterial({color: 0x444444, metalness: 0.6, roughness: 0.4});
                    const shield = new THREE.Mesh(shieldGeo, shieldMat);
                    shield.rotation.x = Math.PI / 2;
                    const bossGeo = new THREE.SphereGeometry(0.4, 16, 16);
                    const bossMat = new THREE.MeshStandardMaterial({color: 0xaa8800});
                    const boss = new THREE.Mesh(bossGeo, bossMat);
                    boss.position.z = 0.1;
                    group.add(shield, boss);
                    update = (t) => { group.rotation.y = t * 1.5; group.rotation.x = Math.sin(t * 2) * 0.2; };
                } else {
                    const boxGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
                    const box = new THREE.Mesh(boxGeo, mat);
                    group.add(box);
                    update = (t) => { box.rotation.x = t * 2.5; box.rotation.y = t * 3.1; };
                }
                
                scene.add(group); scenes[el] = { scene, update };
            });

            const iconCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100); 
            iconCamera.position.set(0, 0, 7.5);
            
            function renderLoop(time) {
                requestAnimationFrame(renderLoop);
                const t = time * 0.001;

                elements.forEach(el => {
                    scenes[el].update(t);
                    const canvases = document.querySelectorAll(`.inv-card .card-icon-3d[data-element="${el}"] canvas`);
                    canvases.forEach(cvs => {
                        const cw = cvs.clientWidth, ch = cvs.clientHeight;
                        if (cw === 0 || ch === 0) return; 
                        const w = Math.round(cw * dpr), h = Math.round(ch * dpr);
                        if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
                        renderer.setSize(cw, ch, false);
                        
                        renderer.render(scenes[el].scene, iconCamera);
                        
                        const ctx = cvs.getContext('2d');
                        if (ctx) { ctx.clearRect(0, 0, w, h); ctx.drawImage(renderer.domElement, 0, 0, w, h); }
                    });
                });
            }
            renderLoop(0);
        }

        function renderGallery() {
            gallery.innerHTML = '';
            db.forEach(card => {
                const el = document.createElement('div');
                el.className = 'inv-card';
                const c = elementColors[card.el] || '#fff';
                el.style.setProperty('--theme-clr', c);
                const iCls = iconClasses[card.el] || 'fa-box';
                el.innerHTML = `
                   <div class="card-header"><span class="card-kanji">${card.kanji}</span> <span class="card-type-pill">${card.type}</span></div>
                   <div class="card-title">${card.name}</div>
                   <div class="card-desc">${card.desc}</div>
                   <div class="card-icon-3d" data-element="${card.el}"><canvas></canvas></div>
                   <div class="card-attr-fused">${card.attr}</div>
                `;
                el.onclick = () => loadEditor(card);
                gallery.appendChild(el);
            });
        }

        function loadEditor(card) {
            document.getElementById('edit-id').value = card.id;
            document.getElementById('edit-name').value = card.name;
            document.getElementById('edit-el').value = card.el;
            document.getElementById('edit-kanji').value = card.kanji;
            document.getElementById('edit-desc').value = card.desc;
            document.getElementById('edit-dice').value = card.dice;
            document.getElementById('edit-dot').value = card.dot;
            document.getElementById('edit-attr').value = card.attr;
            document.getElementById('edit-animation').value = card.animation;
            
            document.getElementById('preview-overlay').textContent = `ANIM: ${card.animation}`;
        }

        function saveCard() {
            const id = document.getElementById('edit-id').value;
            if (!id) return;
            
            const card = db.find(c => c.id === id);
            if (card) {
                card.name = document.getElementById('edit-name').value;
                card.el = document.getElementById('edit-el').value;
                card.kanji = document.getElementById('edit-kanji').value;
                card.desc = document.getElementById('edit-desc').value;
                card.dice = parseInt(document.getElementById('edit-dice').value) || 0;
                card.dot = parseInt(document.getElementById('edit-dot').value) || 0;
                card.attr = document.getElementById('edit-attr').value;
                card.animation = document.getElementById('edit-animation').value;
                
                try {
                    localStorage.setItem('OrigamiMasterInventory', JSON.stringify(db));
                    // Alert feedback
                    const btn = document.querySelector('.btn-primary');
                    const orig = btn.textContent;
                    btn.textContent = 'SAVED!';
                    btn.style.background = '#4caf50';
                    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1500);
                } catch(e) {}
                
                renderGallery();
            }
        }

        function exportJSON() {
            const jsonStr = JSON.stringify(db, null, 4);
            navigator.clipboard.writeText(jsonStr).then(() => {
                const btn = document.querySelector('.btn-export');
                btn.textContent = 'COPIED!';
                setTimeout(() => { btn.textContent = 'COPY JSON TO CLIPBOARD'; }, 2000);
            });
        }

        // Initialize
        renderGallery();
        init3DIcons();
        if (db.length > 0) loadEditor(db[0]);

    </script>
</body>
</html>
