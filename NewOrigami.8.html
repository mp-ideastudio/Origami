  <title>Origami Dungeon — Idea Software Studio</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
    #fpv-viewport{position:absolute;inset:0;z-index:0}
    #fpv-viewport iframe{width:100%;height:100%;border:none}
    #ui-viewport{position:absolute;inset:0;z-index:30;pointer-events:none;background:transparent}
    #ui-viewport iframe{width:100%;height:100%;border:none;background:transparent;pointer-events:auto}
    /* Top-center glowing dungeon header. Replaces the old top-left
       "ORIGAMI v8" badge with a proper title: "ORIGAMI DUNGEON" in big
       glowing letters and the kanji 折り紙 ("origami") underneath in a
       smaller line. Centered above everything else; pointer-events off
       so it never blocks the canvas. The viewport reserves vertical
       space below it via #v8-header-spacer (a body padding-ish offset
       handled by the panels iframe's own top-row CSS). */
    /* Header clipping fix: text was sized via vw + letter-spacing 5px,
       which on a 854-wide tablet pushed "ORIGAMI DUNGEON" past the right
       viewport edge ("DUNGEON" got cut off). Now:
       • max-width: 100vw with 16px side safety padding
       • letter-spacing dropped from 5px → 3px
       • font-size clamp tightened so the natural width fits at every viewport
       • white-space: nowrap + overflow: visible so the title doesn't wrap
         into two lines but also doesn't paint past the safe area */
    #v8-header{
        position:fixed; top:6px; left:50%; transform:translateX(-50%);
        z-index:60; pointer-events:none; text-align:center;
        font-family:'Cinzel','Inter','Helvetica Neue',sans-serif;
        -webkit-user-select:none; user-select:none;
        max-width: calc(100vw - 32px);
        padding: 0 8px;
        box-sizing: border-box;
    }
    #v8-header .title{
        display:block;
        font-size:clamp(12px, 1.7vw, 20px);
        font-weight:900; letter-spacing:3px;
        white-space: nowrap;
        color:#ffd9a3;
        text-shadow:
            0 0 8px rgba(255,200,120,0.85),
            0 0 18px rgba(255,140,40,0.55),
            0 0 36px rgba(255,80,20,0.35),
            0 2px 0 rgba(0,0,0,0.85);
        animation:v8HeaderPulse 4s ease-in-out infinite;
    }
    #v8-header .kanji{
        display:block; margin-top:2px;
        font-family:'Yuji Mai','Noto Serif JP',serif;
        font-size:clamp(8px, 0.9vw, 11px);
        font-weight:600; letter-spacing:5px;
        white-space: nowrap;
        color:rgba(255,210,170,0.75);
        text-shadow:0 0 6px rgba(255,160,80,0.50);
    }
    @keyframes v8HeaderPulse{
        0%,100%{ filter:brightness(1.0); }
        50%   { filter:brightness(1.18); }
    }
    /* Descent fade — covers the engine iframe during floor reload */
    #descent-fade{position:fixed;inset:0;z-index:9999;background:#000;opacity:0;pointer-events:none;transition:opacity .55s ease;display:flex;align-items:center;justify-content:center;color:rgba(200,169,110,.8);font:600 14px monospace;letter-spacing:3px}
    #descent-fade.active{opacity:1;pointer-events:auto}

    /* ── Game Loading Modal ─────────────────────────────────────────────
       Full-screen veil that shows during the engine+panels boot. Lists
       sequenced load steps so the player sees what's happening instead
       of staring at a black void for 2-5s. Each line lights up green
       when the engine reports that subsystem ready. Auto-dismisses on
       BOOT_COMPLETE. */
    #boot-modal{
      position:fixed; inset:0; z-index:99999;
      background: radial-gradient(ellipse at center, #0a0d12 0%, #000 75%);
      display:flex; align-items:center; justify-content:center;
      opacity:1; pointer-events:auto;
      transition: opacity 0.6s ease;
      font-family:'Cinzel','Inter','Helvetica Neue',sans-serif;
    }
    #boot-modal.done{ opacity:0; pointer-events:none; }
    #boot-card{
      width: min(440px, 92vw);
      padding: 28px 30px 24px;
      background: linear-gradient(180deg, rgba(20,22,28,0.96), rgba(10,12,16,0.96));
      border: 1px solid rgba(255,200,120,0.18);
      border-radius: 16px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.85),
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.75);
      color: #d6dadf;
    }
    #boot-title{
      font-size: 22px; font-weight: 900; letter-spacing: 4px;
      color:#ffd9a3; text-align:center;
      text-shadow: 0 0 14px rgba(255,170,80,0.6);
      margin-bottom: 4px;
    }
    #boot-kanji{
      font-family:'Yuji Mai','Noto Serif JP',serif;
      text-align:center; font-size: 12px; letter-spacing: 6px;
      color: rgba(255,210,170,0.55);
      margin-bottom: 22px;
    }
    #boot-bar-track{
      width:100%; height: 6px; border-radius: 4px;
      background: rgba(0,0,0,0.6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), inset 0 -1px 0 rgba(0,0,0,0.6);
      overflow: hidden; margin-bottom: 18px;
    }
    #boot-bar-fill{
      height:100%; width:0%;
      background: linear-gradient(90deg, #00ffc8, #00aaff);
      transition: width 0.35s cubic-bezier(0.2, 0.85, 0.3, 1);
      box-shadow: 0 0 12px rgba(0,200,255,0.55);
    }
    #boot-steps{ list-style:none; padding:0; margin:0; }
    #boot-steps li{
      font-family:'Inter','Helvetica Neue',sans-serif;
      font-size: 12.5px; letter-spacing: 0.5px;
      color: rgba(180,188,196,0.55);
      padding: 5px 0; display:flex; align-items:center; gap:10px;
      transition: color 0.25s ease;
    }
    #boot-steps li::before{
      content:'○'; font-size: 10px; color: rgba(120,130,140,0.5);
      width: 14px; display:inline-block; text-align:center;
    }
    #boot-steps li.done{ color: rgba(220,240,232,0.92); }
    #boot-steps li.done::before{ content:'✓'; color:#7be0b8; text-shadow: 0 0 6px rgba(124,224,184,0.7); }
    #boot-steps li.active{ color: #ffd9a3; }
    #boot-steps li.active::before{ content:'◐'; color:#ffd9a3; animation: bootSpin 1.2s linear infinite; }
    @keyframes bootSpin{ to{ transform: rotate(360deg); } }
    #boot-tagline{
      margin-top: 18px; text-align:center;
      font-size: 10.5px; letter-spacing: 2px;
      color: rgba(160,168,176,0.6);
      font-family:'Inter',sans-serif;
    }
  </style>
</head>
<body>

  <div id="fpv-viewport">
    <iframe id="engine-iframe" src="NewOrigami.Engine8.html?v=38" allow="fullscreen"></iframe>
  </div>

  <div id="ui-viewport">
    <iframe id="panels-iframe" src="NewOrigami.Panels.html?mode=dock&v=23"></iframe>
  </div>

  <div id="v8-header">
    <span class="title">ORIGAMI DUNGEON</span>
    <span class="kanji">折り紙</span>
  </div>
  <div id="descent-fade"></div>

  <!-- Game loading modal — sequenced boot indicator. Dismisses itself
       when the engine reports BOOT_COMPLETE. Each <li data-step="..."> is
       lit up by the message router below as subsystems come online. -->
  <div id="boot-modal">
    <div id="boot-card">
      <div id="boot-title">ORIGAMI DUNGEON</div>
      <div id="boot-kanji">折り紙</div>
      <div id="boot-bar-track"><div id="boot-bar-fill"></div></div>
      <ul id="boot-steps">
        <li data-step="oni">Awakening Oni-Baba</li>
        <li data-step="i18n">Loading Localization</li>
        <li data-step="map">Generating Dungeon</li>
        <li data-step="models">Loading 3D Models</li>
        <li data-step="anims">Wiring Animations</li>
        <li data-step="audio">Decoding Audio</li>
        <li data-step="prewarm">Pre-warming Shaders</li>
        <li data-step="loop">Starting Engine Loop</li>
      </ul>
      <div id="boot-tagline">A roguelike haiku, folded from paper.</div>
    </div>
  </div>
  <script>
    // ── Boot modal driver ────────────────────────────────────────────
    // Steps light up green as engine / panels / OniBaba report their
    // pieces ready. After all steps complete (or 8s timeout) the modal
    // fades out and removes itself from layout.
    (function(){
      const stepsEl = document.getElementById('boot-steps');
      const barFill = document.getElementById('boot-bar-fill');
      const modal   = document.getElementById('boot-modal');
      const steps   = Array.from(stepsEl.querySelectorAll('li'));
      const total   = steps.length;
      const STEP_ORDER = steps.map(li => li.dataset.step);
      let nextIdx = 0;
      // Mark current step active so the user sees motion immediately.
      const markActive = () => {
        steps.forEach((li, i) => {
          li.classList.toggle('active', i === nextIdx);
        });
      };
      const markStep = (name) => {
        const idx = STEP_ORDER.indexOf(name);
        if (idx < 0) return;
        // Mark THIS step + everything before it as done.
        for (let i = 0; i <= idx; i++){
          steps[i].classList.remove('active');
          steps[i].classList.add('done');
        }
        nextIdx = Math.min(total, idx + 1);
        markActive();
        const pct = Math.min(100, Math.round((nextIdx / total) * 100));
        barFill.style.width = pct + '%';
        if (nextIdx >= total) finish();
      };
      const finish = () => {
        barFill.style.width = '100%';
        // Hold a beat so the green sweep registers, then fade.
        setTimeout(() => {
          modal.classList.add('done');
          setTimeout(() => { if (modal.parentNode) modal.parentNode.removeChild(modal); }, 700);
        }, 250);
      };
      window.bootStep = markStep;
      // Initial active mark.
      markActive();
      // Oni-Baba awakens via her own script load — mark immediately.
      // (Her script tag executes right below this block.)
      window.addEventListener('load', () => markStep('oni'));
      // i18n is loaded synchronously before this block runs (script tag
      // order in the body) — mark on next tick.
      setTimeout(() => {
        if (window.tLog) markStep('i18n');
      }, 0);
      // Router: listen for BOOT_PROGRESS messages from the engine iframe.
      window.addEventListener('message', (e) => {
        const d = e.data;
        if (!d) return;
        if (d.type === 'BOOT_PROGRESS' && d.step) markStep(d.step);
        else if (d.type === 'BOOT_COMPLETE')      markStep('loop');
      });
      // Safety: force-dismiss after 12s if some step never fires.
      setTimeout(() => {
        if (!modal.classList.contains('done')) finish();
      }, 12000);
    })();
  </script>

  <!-- i18n must load BEFORE OniBaba8.js so window.tLog is available when
       OniBaba's _t() resolves its first speech line. Without this the raw
       "oni.speech" / "oni.room-flavour-N" keys leak into the event log. -->
  <script src="js/data/i18n.js"></script>
  <script src="NewOrigami.OniBaba.js"></script>
  <script src="js/v8/OniBaba8.js"></script>

  <script>
    const fpv    = document.getElementById('engine-iframe');
    const panels = document.getElementById('panels-iframe');

    function to(frame, msg){ if(frame&&frame.contentWindow) frame.contentWindow.postMessage(msg,'*'); }

    // Key relay
    document.addEventListener('keydown', e=>{
      if(e.repeat||document.activeElement?.tagName==='INPUT') return;
      // TAB is bound to in-game target cycling — block the browser's
      // focus-next-element default so the engine receives the event clean.
      if (e.key === 'Tab') e.preventDefault();
      to(fpv,{type:'KEY_DOWN',key:e.key,code:e.code,shift:e.shiftKey});
    });
    document.addEventListener('keyup', e=>{
      if(document.activeElement?.tagName==='INPUT') return;
      to(fpv,{type:'KEY_UP',key:e.key,code:e.code});
    });

    let cachedInit = null;

    window.addEventListener('message', e=>{
      const d = e.data; if(!d||!d.type) return;

      // Oni-Baba mutation
      let ev = d;
      // OniBaba8 is primary — she owns the mutation bus
      if(window.oniBaba8?.mutateEvent)  ev = window.oniBaba8.mutateEvent(ev)  ?? ev;
      else if(window.goddessAI?.mutateEvent) ev = window.goddessAI.mutateEvent(ev) ?? ev;
      if(!ev || ev.type==='EVENT_CANCELLED') return;

      switch(ev.type){
        // Engine → Panels
        case 'MONSTER_AI_THOUGHT':
        case 'ONIBABA_BOTTLENECK':
        case 'PLAYER_ROT_REALTIME': case 'PLAYER_MOVE': case 'PLAYER_MOVE_STATE':
        case 'RADAR_UPDATE': case 'SYNC_STATS': case 'ADD_CARD': case 'UPDATE_LOOT_CARDS':
        case 'LOOT_CARDS': case 'SHOW_LOOT_UI': case 'SHOW_COMBAT': case 'HIDE_COMBAT':
        case 'HIDE_ALL': case 'COMBAT_STATE_UPDATE': case 'COMBAT_ATTACK': case 'MONSTER_ATTACK':
        case 'SHOW_EXIT': case 'HIDE_EXIT': case 'LCD_EVENT': case 'LOG_EVENT': case 'CAMERA_MODE':
        case 'TOGGLE_INVENTORY': case 'SYNC_INVENTORY': case 'SYNC_UI':
        case 'MISSILE_RECOVERED':
        case 'DEFEAT_BLINK':
        case 'FLOOR_UPDATE':
        case 'SAVE_LIST': case 'SAVE_DONE': case 'INVENTORY_RESTORE':
        case 'MONSTER_HAIKU':
          to(panels, ev); break;
        // Panels → Engine — click on a transparent panels area is forwarded
        // to the engine canvas so click-to-target / click-to-move work
        // despite the panels iframe sitting on top of the engine viewport.
        case 'CANVAS_CLICK_FORWARD':
        case 'CANVAS_DBLCLICK_FORWARD':
          to(fpv, ev); break;
        // Engine → Oni-Baba pipeline (per-monster brain).
        case 'MONSTER_INTEL': case 'MONSTER_SPIRIT_REPORT':
        case 'MONSTER_SOCIAL_DECLARED':
          // Oni-Baba already listens on window directly — no forwarding
          // needed. (The engine posts via window.parent.postMessage which
          // reaches the parent window where both Oni-Baba scripts hook.)
          break;
        // PIP_FRAME carries a transferred ImageBitmap — must re-post with transfer list
        case 'PIP_FRAME':
          if(panels && panels.contentWindow){
            if(ev.bitmap) panels.contentWindow.postMessage(ev,'*',[ev.bitmap]);
            else panels.contentWindow.postMessage(ev,'*');
          }
          break;

        // Entity cache
        case 'INIT_ENTITIES':
          cachedInit = ev;
          to(fpv, ev);
          if(window.goddessAI?.handleMessage) window.goddessAI.handleMessage({data:ev});
          break;

        // AI → both
        case 'AI_UPDATES': case 'AI_DEATH': case 'COMBAT_UPDATE':
        case 'REALITY_SHIFT': case 'KARMA_UPDATE':
          to(fpv, ev); to(panels, ev); break;

        // T0.26 — Oni-Baba's combat brain → Engine
        case 'SYNC_COMBAT_PARAMS':
        // Spirit hauntings — Oni-Baba assigns spirits of fallen goblins to
        // monsters on later floors. Engine boosts the matching monsters.
        case 'HAUNT_ASSIGNMENTS':
        // ── Oni-Baba's hub outputs ──────────────────────────────────────
        // Fog density, monster aggro, spawn pressure, torch flicker —
        // engine applies each per-frame so her mood actually shapes the
        // dungeon instead of just decorating the prognosis HUD.
        case 'ONIBABA_OUTPUTS':
          to(fpv, ev); break;

        // T0.26 — Engine → Oni-Baba (already listens via window message)
        // No forwarding needed — these stay in the parent window where
        // oniBaba8 listens directly.
        case 'COMBAT_RECORD':
        case 'MONSTER_AI_STATE':
        case 'PLAYER_POS':
          break;

        // Panels → Engine
        case 'FPV_ACTION': case 'KEY_DOWN': case 'KEY_UP': case 'EQUIP_CARD':
        case 'WAGER': case 'ATTACK': case 'RETREAT': case 'PARLEY': case 'SPARE':
        case 'EXPLORE_ROOM': case 'AUTO_EXPLORE': case 'APPROACH_MONSTER':
        case 'TEXT_COMMAND': case 'CHAT_SUBMIT': case 'TOGGLE_AUTOPICKUP':
        case 'PIP_TOGGLE': case 'PIP_ZOOM': case 'PIP_ROTATE': case 'PIP_PAN':
        case 'PIP_CLICK': case 'PIP_SYNC_RECT': case 'PIP_PERSPECTIVE': case 'MOON_PHASE':
        case 'OPEN_FULL_MAP':
        case 'SIDEBAR_OPEN': case 'SIDEBAR_CLOSE':
        case 'MAIN_ZOOM':
        // i18n locale broadcast — Panels → Engine so monster names refresh live
        case 'LOCALE_CHANGE':
        // Save / Load — panels → engine
        case 'SAVE_NOW': case 'LOAD_NOW': case 'DELETE_SAVE': case 'LIST_SAVES':
          // Cache sidebar state locally and forward to engine
          try{ window.__panelsSidebarOpen = (ev.type === 'SIDEBAR_OPEN'); }catch(e){}
          to(fpv, ev); break;

        // Engine ready
        case 'ENGINE8_READY':
          if(cachedInit) to(fpv, cachedInit);
          to(panels,{type:'LOG_EVENT',logType:'system',text:'⚡ NewOrigami v8 online.'});
          window.__engineReady = true; // v8 constructor harness signal (G-SMOKE)
          // Fade out the descent overlay if a floor transition just landed
          {
            const fade = document.getElementById('descent-fade');
            if(fade && fade.classList.contains('active')){
              setTimeout(() => { fade.classList.remove('active'); fade.textContent = ''; }, 250);
            }
          }
          break;

        // Descent: fade to black, then reload the engine iframe with ?floor=N.
        // The engine wrote hp/karma/floor to sessionStorage before posting this,
        // and reads them back during boot. L7 has no stairs_down so the floor
        // is clamped on the engine side; here we just respect what was sent.
        case 'DESCEND_REQUEST':
          {
            const floor = Math.max(1, Math.min(7, parseInt(ev.floor || 1, 10)));
            const fade = document.getElementById('descent-fade');
            if(fade){
              fade.textContent = `DESCENDING — FLOOR ${floor}`;
              fade.classList.add('active');
            }
            window.__engineReady = false;
            setTimeout(() => {
              fpv.src = `NewOrigami.Engine8.html?floor=${floor}`;
              cachedInit = null; // engine will re-init entities on the new floor
            }, 600);
          }
          break;

        // Constructor protocol — Oni-Baba narrates build/validation events
        case 'CONSTRUCTOR_EVENT':
          to(panels, ev);
          break;
      }
    });
  </script>
</body>
</html>
