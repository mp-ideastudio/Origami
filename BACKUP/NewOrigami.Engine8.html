// ── Monster AI ────────────────────────────────────────────────────────────────
let _lastCombatVisible = false;
let _lastCombatTargetId = null; // T0.13 — track which monster the combat panel is currently bound to

// ── Monster Alert System ──────────────────────────────────────────────────────
// Alerts fire when a monster is hit, flees, or dies; AND any time one monster
// turns hostile near idle peers (vicinity propagation). Default hearing range
// is 10 tiles, but each monster's `personality.alertRadius` widens or narrows
// it (6-14 tiles) so a "loud" monster pulls in a much bigger reaction wave.
const ALERT_TILES = 10;

// Shared hostile-state pedestal materials — pure red so bloom postprocessing
// reads them as anger, not purple. (Old palette mixed with the dark-plum idle
// caps under bloom and looked magenta.)
const _PED_CORE_MAT_HOSTILE   = new THREE.MeshBasicMaterial({ color: 0xff1100 }); // bright red base
const _PED_CAP_MAT_HOSTILE    = new THREE.MeshBasicMaterial({ color: 0xff4444 }); // brighter red disc
const _PED_BORDER_MAT_HOSTILE = new THREE.MeshBasicMaterial({ color: 0xff6666 }); // hot-red ring
const _PED_ARROW_MAT_HOSTILE  = new THREE.MeshBasicMaterial({ color: 0xfff0f0, side: THREE.DoubleSide });

// ── Haunt application ─────────────────────────────────────────────────────
// Apply a list of HAUNT_ASSIGNMENTS from Oni-Baba to the currently-spawned
// monsters. Each assignment possesses one eligible monster — boosting HP,
// damage scaling, and aggression personality, and dropping a persistent
// red aura on the wrapper so the player can see who's haunted.
function _applyHauntAssignments(assignments){
    if (!Array.isArray(assignments) || !assignments.length) return;

    // Eligible bodies: live, non-imp, non-boss goblins that aren't already
    // haunted. Imp henchmen and the throne boss are exempt — the queen
    // doesn't waste real grudge-spirits on disposable mobs or her own boss.
    const eligible = [];
    for (const w of monsterWrappers){
        const ud = w.userData;
        if (!ud || ud.isDead) continue;
        if (ud.isImp || ud.isBoss) continue;
        if (ud.haunt) continue;
        eligible.push(w);
    }
    if (!eligible.length) return;

    // Shuffle so the same goblins don't get picked when assignments come in
    // identical order on every floor.
    for (let i = eligible.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [eligible[i], eligible[j]] = [eligible[j], eligible[i]];
    }

    const count = Math.min(eligible.length, assignments.length);
    let appliedHaunts = 0;
    for (let i = 0; i < count; i++){
        const w = eligible[i];
        const ud = w.userData;
        const a = assignments[i];
        // Apply boosts. Grudge 1..5 maps to a 1.15..1.75× HP/damage multiplier
        // and a personality.aggression bump that makes them chase harder.
        const g = Math.max(1, Math.min(5, a.grudge|0));
        const mult = 1 + 0.15 * g;
        ud.maxHp = Math.round((ud.maxHp || 50) * mult);
        ud.hp    = Math.max(1, Math.round((ud.hp || ud.maxHp) * mult));
        if (ud.personality){
            ud.personality.aggression = Math.min(1, (ud.personality.aggression || 0.5) + 0.15 * g);
            ud.personality.fleeHpFrac = Math.max(0.10, (ud.personality.fleeHpFrac ?? 0.50) - 0.04 * g);
        }
        // Stash haunt metadata for damage scaling, visuals, future spirit
        // reports (so the chain of grudges can extend further).
        ud.haunt = {
            spiritId: a.spiritId,
            spiritName: a.spiritName,
            archetype: a.archetype,
            grudge: g,
            killedBy: a.killedBy || 'DEFAULT',
        };
        // Red aura point-light parented to the wrapper. Slightly larger
        // than the regular aggro light so haunted monsters stand out.
        if (!ud.hauntLight){
            const hL = new THREE.PointLight(0xff1500, 1.4 + 0.25 * g, 5.5, 2.0);
            hL.position.set(0, 1.05, 0);
            w.add(hL);
            ud.hauntLight = hL;
        }
        // Subtle red emissive tint on the body so it reads at a glance
        // even when the point-light is off-camera.
        if (w.children?.length){
            w.traverse(c => {
                if (c.isMesh && c.material && c.material.emissive){
                    c.material.emissive.set(0xff2010);
                    c.material.emissiveIntensity = Math.max(c.material.emissiveIntensity || 0, 0.55);
                }
            });
        }
        // Name displays as "Spirit of X possessing Y" so the player feels
        // the lineage of grudges.
        ud.name = `Spirit of ${a.spiritName} ▸ ${ud.name}`;
        appliedHaunts++;
    }
    if (appliedHaunts > 0){
        window.parent.postMessage({type:'LOG_EVENT', logType:'flee',
            text:
                `<div class="fl-head">👻 ${appliedHaunts} VENGEFUL SPIRITS RISE</div>` +
                `<div class="fl-cry">"These goblins remember dying to you."</div>` +
                `<div class="fl-sub">Each haunted body hits harder and holds the line longer.</div>`,
        }, '*');
    }
}

function _setMonsterHostile(w){
    if(w.userData.isDead || w.userData.aiState === 'hostile') return;
    // Allies never turn hostile — they fight beside the player.
    if(w.userData.isAlly) return;
    // ── Global aggro cap ──
    // Prevent the entire dungeon from lighting up when one hit cascades
    // hostility (see _applyMonsterDamage's any-hit-aggros-all rule). Count
    // current hostiles + chasers; if we're already at the cap, leave this
    // monster idle. The cascade in _applyMonsterDamage walks peers in
    // priority order (same-room first) so the 6 that DO turn hostile are
    // the ones actually fighting the player.
    let _hostileCount = 0;
    for (const peer of monsterWrappers){
        const pud = peer.userData;
        if (!pud || pud.isDead) continue;
        if (pud.aiState === 'hostile' || pud.aiState === 'chase') _hostileCount++;
    }
    if (_hostileCount >= MAX_AGGRO_MONSTERS) return;
    w.userData.aiState = 'hostile';
    w.userData.isHostile = true;
    // "I see you" cry on the spot-the-player transition. Imps don't shout.
    if (!w.userData.isImp) _playMonsterSfx('FOUND', w);
    // T0.26 — Notify Oni-Baba so she can record the AI-state transition
    window.parent.postMessage({type:'MONSTER_AI_STATE',
        id: w.userData.id, state: 'hostile',
        x: w.position.x/GRID, z: w.position.z/GRID}, '*');
    // Cancel any in-progress bow greeting
    w.userData._bowTimer = 0;
    w.userData._bowPartnerPos = null;
    // T0.11 — Swap disc materials to shared hostile set. Bright red rings instantly
    // read as "this monster is now a threat". Reuses cached materials (no allocs).
    if(w.userData.monBase){
        w.userData.monBase.traverse(c=>{
            if(!c.isMesh) return;
            const geo = c.geometry?.type;
            if(geo === 'TorusGeometry')                                                  c.material = _PED_BORDER_MAT_HOSTILE;
            else if(geo === 'CylinderGeometry' && c.material.color?.getHex() === 0x09070f) c.material = _PED_CORE_MAT_HOSTILE;
            else if(geo === 'CylinderGeometry' && c.material.color?.getHex() === 0x1a0d2e) c.material = _PED_CAP_MAT_HOSTILE;
            else if(geo === 'ShapeGeometry')                                              c.material = _PED_ARROW_MAT_HOSTILE;
        });
    }
    // Anger bloom — a red point-light parented to the wrapper at chest height.
    // Pulses each frame in tickMonsterAI's hostile branch so the rage feels alive.
    // Light is small-radius so it lights the monster + immediate floor without
    // washing the whole room. Removed on death (see _killMonster cleanup).
    if(!w.userData.aggroLight){
        const aL = new THREE.PointLight(0xff2200, 1.6, 4.5, 2.0);
        aL.position.set(0, 1.2, 0);
        w.add(aL);
        w.userData.aggroLight = aL;
    }

    // ── Vicinity propagation ─────────────────────────────────────────────
    // A newly-hostile monster wakes up every idle peer it can be heard by:
    // same-room (no wall blocks) or within ALERT_TILES (10 by default,
    // widened per monster by `personality.alertRadius`) AND with line of
    // sight through doors / open archways. The recursive call is safe
    // because the early-out at the top of this function makes it
    // idempotent — already-hostile peers immediately return.
    if(w.userData.aiRoomId === undefined){
        const mgx = Math.round(w.position.x/GRID);
        const mgz = Math.round(w.position.z/GRID);
        w.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
    }
    const srcRoom = w.userData.aiRoomId;
    const radius  = (w.userData.personality?.alertRadius ?? ALERT_TILES) * GRID;
    const r2      = radius * radius;
    for (const peer of monsterWrappers){
        if (peer === w || peer.userData.isDead) continue;
        if (peer.userData.aiState && peer.userData.aiState !== 'idle') continue;
        if (peer.userData.aiRoomId === undefined){
            const mgx = Math.round(peer.position.x/GRID);
            const mgz = Math.round(peer.position.z/GRID);
            peer.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
        }
        const peerRoom = peer.userData.aiRoomId;
        const sameRoom = (srcRoom !== -1 && peerRoom !== -1 && peerRoom === srcRoom);
        let inHearingRange = false;
        if (!sameRoom){
            const dx = peer.position.x - w.position.x;
            const dz = peer.position.z - w.position.z;
            if (dx*dx + dz*dz <= r2){
                // Cross-room hearing requires an open path (doors / arches).
                // Hallway-to-room and hallway-to-hallway use straight LOS so
                // a goblin in a corridor calls neighbouring rooms through
                // the doorway, but not through solid stone.
                inHearingRange = _hasLineOfSight(
                    w.position.x, w.position.z,
                    peer.position.x, peer.position.z,
                );
            }
        }
        if (sameRoom || inHearingRange) _setMonsterHostile(peer);
    }
}

// _alertRoom: when any monster is hit, ALL monsters in the same room go hostile.
// Falls back to 5-tile radius for hallway monsters (roomId === -1).
function _alertRoom(hitW){
    if(!hitW) return;
    // Ensure aiRoomId is resolved on the hit monster
    if(hitW.userData.aiRoomId === undefined){
        const mgx = Math.round(hitW.position.x/GRID);
        const mgz = Math.round(hitW.position.z/GRID);
        hitW.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
    }
    const roomId = hitW.userData.aiRoomId;
    const hx = hitW.position.x, hz = hitW.position.z;
    for(const w of monsterWrappers){
        if(w.userData.isDead) continue;
        // Ensure peer roomId is resolved
        if(w.userData.aiRoomId === undefined){
            const mgx = Math.round(w.position.x/GRID);
            const mgz = Math.round(w.position.z/GRID);
            w.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
        }
        // Strict room isolation: only alert if peer is in the same room as the
        // hit monster, OR one of them is in a hallway (roomId === -1) and the
        // other is within ALERT_TILES — that way a fight in a room never
        // propagates into a different sealed room, but hallway encounters
        // still ripple sensibly into nearby tiles.
        const peerRoom = w.userData.aiRoomId;
        const sameRoom = roomId !== -1 && peerRoom !== -1 && peerRoom === roomId;
        let hallwayProximity = false;
        if (!sameRoom && (roomId === -1 || peerRoom === -1)){
            const dx = w.position.x - hx, dz = w.position.z - hz;
            hallwayProximity = Math.sqrt(dx*dx + dz*dz) / GRID <= ALERT_TILES;
        }
        if(sameRoom || hallwayProximity) _setMonsterHostile(w);
    }
    // Cross-room alerts are NOT automatic — adjacent rooms only aggro when
    // a fleeing monster physically reaches a doorway and yells "WE ARE
    // BEING ATTACKED!" (see the 'fetch' branch in tickMonsterAI). The old
    // _alertAdjacentRooms setTimeout was waking everyone within hearing
    // range of the floor every fight — user called it out as "every room
    // recruited". Removed.
}

// After a fight breaks out in a room, idle monsters in rooms connected via
// intact shoji doors hear it and walk to investigate. The existing
// _tickShojiDoors handles the visual slide-open when they arrive.
function _alertAdjacentRooms(srcRoomId){
    if (typeof rooms === 'undefined' || typeof shojiDoorPanels === 'undefined') return;
    const srcRoom = rooms.find(r => r.id === srcRoomId);
    if (!srcRoom) return;

    // Scan the perimeter of the source room for shoji_door tiles
    const xMin = Math.max(0, srcRoom.x - 1);
    const xMax = Math.min(MAP_W - 1, srcRoom.x + srcRoom.w);
    const zMin = Math.max(0, srcRoom.y - 1);
    const zMax = Math.min(MAP_H - 1, srcRoom.y + srcRoom.h);

    for (let x = xMin; x <= xMax; x++){
        for (let z = zMin; z <= zMax; z++){
            if (map[x]?.[z]?.type !== 'shoji_door') continue;
            const panel = shojiDoorPanels.find(p => p.cx === x && p.cz === z && !p.broken);
            if (!panel) continue; // already broken — passage already open

            // Find which peer room this door connects to
            let peerRoomId = -1;
            for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
                const c = map[x + dx]?.[z + dz];
                if (c && c.roomId !== undefined && c.roomId >= 0 && c.roomId !== srcRoomId){
                    peerRoomId = c.roomId;
                    break;
                }
            }
            if (peerRoomId < 0) continue;

            const doorWX = x * GRID, doorWZ = z * GRID;
            let investigatorCount = 0;
            for (const w of monsterWrappers){
                const ud = w.userData;
                if (!ud || ud.isDead) continue;
                if (ud.aiState === 'hostile' || ud.aiState === 'flee' || ud.aiState === 'fetch') continue;
                if (ud.aiRoomId === undefined){
                    const mgx = Math.round(w.position.x / GRID);
                    const mgz = Math.round(w.position.z / GRID);
                    ud.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
                }
                if (ud.aiRoomId !== peerRoomId) continue;
                // Send this monster to investigate the door
                ud.aiWalkTarget = { x: doorWX, z: doorWZ };
                ud.aiNextTurn = (performance.now() * 0.001) + 8 + Math.random() * 3;
                investigatorCount++;
            }
            if (investigatorCount > 0){
                window.parent.postMessage({type:'LOG_EVENT', logType:'system',
                    text:`🚪👂 ${investigatorCount} monster${investigatorCount>1?'s':''} heard the commotion — moving to investigate.`},'*');
            }
        }
    }
}

// Backward-compat alias so any remaining callers don't break
function _alertNearby(hitW){ _alertRoom(hitW); }

// ── Room reaction when a shoji door is busted ──────────────────────────────
// Monsters in BOTH rooms touching (cx, cz) turn to face the door. If any
// already-turning monster has LOS to the player FROM their position, the
// whole reacting group goes hostile. Otherwise each one walks toward the
// broken door to investigate. Skips already-hostile/fleeing monsters.
function _reactToDoorBreak(cx, cz){
    if (typeof monsterWrappers === 'undefined' || !monsterWrappers.length) return;
    const doorWX = cx * GRID, doorWZ = cz * GRID;
    // Identify the two adjacent rooms (the door sits between them).
    const adjacentRooms = new Set();
    for (const [dx, dz] of [[1,0], [-1,0], [0,1], [0,-1]]){
        const r = map[cx + dx]?.[cz + dz]?.roomId;
        if (r !== undefined && r !== -1) adjacentRooms.add(r);
    }
    if (adjacentRooms.size === 0) return;
    // Collect reacting monsters
    const reacting = [];
    for (const w of monsterWrappers){
        const ud = w.userData;
        if (!ud || ud.isDead) continue;
        if (ud.aiState === 'hostile' || ud.aiState === 'flee' || ud.aiState === 'fetch') continue;
        if (ud.aiRoomId === undefined){
            const mgx = Math.round(w.position.x/GRID);
            const mgz = Math.round(w.position.z/GRID);
            ud.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
        }
        if (!adjacentRooms.has(ud.aiRoomId)) continue;
        reacting.push(w);
    }
    if (!reacting.length) return;
    // Turn every reactor to face the door + check LOS to player.
    let anySeesPlayer = false;
    for (const w of reacting){
        const ud = w.userData;
        const mb = ud.monBase || w;
        const ang = Math.atan2(doorWX - mb.position.x, doorWZ - mb.position.z);
        mb.rotation.y = ang; w.rotation.y = ang;
        // Cancel any in-progress visit/chat
        ud.aiWalkTarget = null;
        ud._bowPartnerPos = null;
        ud._greetingPlayer = false;
        if (ud.aiState === 'chat' || ud.aiState === 'bow' || ud.aiState === 'watch_player'){
            ud.aiState = 'idle';
        }
        // LOS test from this monster's position to the player
        if (typeof _hasLineOfSight === 'function'
            && _hasLineOfSight(mb.position.x, mb.position.z, px, pz)){
            anySeesPlayer = true;
        }
    }
    if (anySeesPlayer){
        // Player visible from inside the room → entire group goes hostile.
        for (const w of reacting) _setMonsterHostile(w);
        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
            text:`🚪💥 The breach reveals you — ${reacting.length} monster${reacting.length>1?'s':''} turn HOSTILE!`},'*');
    } else {
        // No sight of player → all converge on the broken door to investigate.
        for (const w of reacting){
            const ud = w.userData;
            ud.aiWalkTarget = { x: doorWX, z: doorWZ };
            // Reset the turn-evaluation clock so they start walking immediately
            ud.aiNextTurn = (performance.now() * 0.001) + 8 + Math.random() * 3;
        }
        window.parent.postMessage({type:'LOG_EVENT', logType:'system',
            text:`🚪💨 A door bursts — ${reacting.length} monster${reacting.length>1?'s':''} move to investigate.`},'*');
    }
}

// ── Find a doorway leading to a peer room with idle reinforcements ──────────
// Used by the 'fetch' AI state. Returns {doorX, doorZ, peerRoomId} or null.
// Picks a random matching doorway if multiple peer rooms qualify.
function _findReinforcementDoorway(ud){
    if(ud.aiRoomId === undefined || ud.aiRoomId < 0) return null;
    const room = rooms.find(r => r.id === ud.aiRoomId);
    if(!room) return null;
    const doors = [];
    const xMin = Math.max(0, room.x - 1), xMax = Math.min(MAP_W - 1, room.x + room.w);
    const zMin = Math.max(0, room.y - 1), zMax = Math.min(MAP_H - 1, room.y + room.h);
    for(let x = xMin; x <= xMax; x++){
        for(let z = zMin; z <= zMax; z++){
            if(map[x]?.[z]?.type !== 'shoji_door') continue;
            let peer = -1, touchesUs = false;
            for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
                const c = map[x+dx]?.[z+dz];
                if(!c || c.roomId === undefined) continue;
                if(c.roomId === room.id) touchesUs = true;
                else if(c.roomId >= 0 && c.roomId !== room.id) peer = c.roomId;
            }
            if(!touchesUs || peer < 0) continue;
            doors.push({x, z, peer});
        }
    }
    if(doors.length === 0) return null;
    // Shuffle so multiple wounded monsters don't all pile through the same door
    for(let i = doors.length - 1; i > 0; i--){
        const k = Math.floor(Math.random() * (i + 1));
        [doors[i], doors[k]] = [doors[k], doors[i]];
    }
    for(const d of doors){
        let hasIdle = false;
        for(const mw of monsterWrappers){
            if(mw.userData.isDead) continue;
            if(mw.userData.aiState !== 'idle') continue;
            if(mw.userData.aiRoomId === undefined){
                const mgx = Math.round(mw.position.x/GRID);
                const mgz = Math.round(mw.position.z/GRID);
                mw.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
            }
            if(mw.userData.aiRoomId === d.peer){ hasIdle = true; break; }
        }
        if(hasIdle) return { doorX: d.x, doorZ: d.z, peerRoomId: d.peer };
    }
    return null;
}

// Radius-only alert — used for flee/death events. NEVER alerts the whole
// room; only monsters within `tiles` grid-units of the source go hostile.
// Default 6 tiles (between user's requested 5-8 range).
// Room-isolation gate: even within radius, peer monsters in a *different*
// sealed room are skipped. Only same-room peers (or a hallway monster on
// either side of the event) feel the alert.
function _alertNearbyRadius(hitW, tiles = ALERT_TILES){
    if(!hitW) return;
    if(hitW.userData.aiRoomId === undefined){
        const mgx = Math.round(hitW.position.x/GRID);
        const mgz = Math.round(hitW.position.z/GRID);
        hitW.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
    }
    const srcRoom = hitW.userData.aiRoomId;
    const hx = hitW.position.x, hz = hitW.position.z;
    const r2 = (tiles * GRID) * (tiles * GRID);
    for(const w of monsterWrappers){
        if(w === hitW) continue;
        if(w.userData.isDead) continue;
        if(w.userData.aiRoomId === undefined){
            const mgx = Math.round(w.position.x/GRID);
            const mgz = Math.round(w.position.z/GRID);
            w.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
        }
        const peerRoom = w.userData.aiRoomId;
        // Skip cross-room alerts entirely (both sides in a sealed room and
        // they're different rooms).
        if (srcRoom !== -1 && peerRoom !== -1 && srcRoom !== peerRoom) continue;
        const dx = w.position.x - hx, dz = w.position.z - hz;
        if((dx*dx + dz*dz) <= r2) _setMonsterHostile(w);
    }
}
// aggroRoom: alert all monsters in a room by player position.
// Finds the closest live monster as the "hit" anchor; falls back to
// a synthetic wrapper at the player's position so the radius check works.
function aggroRoom(roomId){
    // Find closest live monster to alert from
    let anchor = null, bestDist = Infinity;
    for(const w of monsterWrappers){
        if(w.userData.isDead) continue;
        const dx = w.position.x - px, dz = w.position.z - pz;
        const d = dx*dx + dz*dz;
        if(d < bestDist){ bestDist=d; anchor=w; }
    }
    if(anchor){
        // Override aiRoomId so same-room logic uses the player's current room
        if(roomId !== undefined && roomId !== null && roomId !== -1)
            anchor.userData.aiRoomId = roomId;
        _alertRoom(anchor);
    }
}

const MON_WANDER_SPD = 1.4; // world-units/sec while wandering idle

function _monSetAnim(ud, key){
    // Allow attack→attack re-trigger so subsequent swings replay the clip.
    // For all other keys, same-key early-exit avoids needless crossfades.
    if(ud._animKey === key && key !== 'attack') return;
    // T0.14 — Don't interrupt an in-flight attack animation. AI calls
    // _monSetAnim(ud,'idle') every frame between cooldown hits; without this
    // guard the attack clip gets crossfaded out mid-swing and never plays
    // visibly. The attack's own timeout (below) clears _animKey to null and
    // THEN transitions to idle — that path is not blocked here.
    if(key === 'idle' && ud._animKey === 'attack') return;
    ud._animKey = key;
    const ia = ud.idleAction, wa = ud.walkAction, ba = ud.bowAction;
    if(key === 'death'){
        // Stop everything hard, crossfade into death clip
        const aa = ud.attackAction || ud.slashAction;
        if(ia) ia.fadeOut(0.15);
        if(wa) wa.fadeOut(0.15);
        if(aa && aa !== ba) aa.fadeOut(0.15);
        if(ba){
            ba.reset();
            ba.setLoop(THREE.LoopOnce, 1);
            ba.clampWhenFinished = true;
            ba.fadeIn(0.15);
            ba.play();
        }
        return;
    }
    if(!ia || !wa) return;
    const aa = ud.attackAction || ud.slashAction;
    if(key === 'bow'){
        const ba2 = ud.bowAction;
        if(ba2){
            ia.fadeOut(0.15); wa.fadeOut(0.15);
            ba2.reset();
            ba2.setLoop(THREE.LoopOnce, 1);
            ba2.clampWhenFinished = true;
            ba2.fadeIn(0.15);
            ba2.play();
            // Return to idle once the clip finishes
            const dur = (ba2.getClip?.()?.duration ?? 1.0) * 1000;
            setTimeout(()=>{ if(ud._animKey==='bow'){ ud._animKey=null; _monSetAnim(ud,'idle'); } }, dur);
        } else {
            // No bow clip — just idle
            ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity); ia.play();
        }
        return;
    }
    if(key === 'attack' && aa){
        ia.stop(); wa.stop();
        aa.reset();
        aa.setLoop(THREE.LoopOnce, 1);
        aa.clampWhenFinished = false;
        // Speed long clips down to a punchy ~1.2s swing. Short clips play natural.
        const clipDur = (aa.getClip?.()?.duration ?? 0.7);
        aa.timeScale = Math.max(1.0, Math.min(4.5, clipDur / 1.2));
        aa.play();
        // Token guards against earlier setTimeouts clearing a fresher attack
        const myAttackT = ud._attackT = (ud._attackT || 0) + 1;
        const realDur = (clipDur / aa.timeScale) * 1000;
        const dur = Math.min(1100, realDur * 0.85);
        setTimeout(()=>{
            if(ud._animKey === 'attack' && ud._attackT === myAttackT){
                ud._animKey = null; _monSetAnim(ud, 'idle');
            }
        }, dur);
        return;
    }
    if(ia === wa){
        // Only one clip — speed it up for walk, normal for idle
        ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity);
        ia.timeScale = (key === 'walk') ? 1.8 : 1.0;
        ia.play();
    } else if(key === 'walk'){
        // Ensure idle is running so crossFadeTo has something to fade FROM
        if(!ia.isRunning()){ ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity); ia.play(); }
        wa.reset(); wa.setLoop(THREE.LoopRepeat, Infinity); wa.timeScale = 1.0;
        ia.crossFadeTo(wa, 0.2, true);
        wa.play();
    } else {
        // Idle: fade walk back to idle
        if(!wa.isRunning()){ wa.reset(); wa.setLoop(THREE.LoopRepeat, Infinity); wa.play(); }
        ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity); ia.timeScale = 1.0;
        wa.crossFadeTo(ia, 0.2, true);
        ia.play();
    }
}

function _pickWanderTarget(monBase, roomId){
    const cx = monBase.position.x/GRID, cz = monBase.position.z/GRID;
    for(let t=0; t<14; t++){
        const dx = (Math.random()-0.5)*6, dz = (Math.random()-0.5)*6;
        const tx = cx+dx, tz = cz+dz;
        const itx = Math.round(tx), itz = Math.round(tz);
        if(itx<0||itx>=MAP_W||itz<0||itz>=MAP_H) continue;
        const cell = map[itx]?.[itz];
        if(!cell || cell.type !== 'floor') continue;
        if(cell.roomId !== roomId) continue;
        if(!canWalk(tx*GRID, tz*GRID)) continue;
        return {x: tx*GRID, z: tz*GRID};
    }
    return null;
}

// ── A* chase pathfinding ─────────────────────────────────────────────────────
// Extracted to js/v8/entities/PathFinder.js (T0.1.A).
// _monAStar is wired up at map-creation time (see T0.1 wire-up near line 690).
// The const declaration below is a fallback no-op guard — in normal flow the
// import at the top of this module provides _monAStar via createPathFinder().

const _atkVec3 = new THREE.Vector3(); // reused in hostile attack — no per-frame alloc

// ── Corner-assassin lookup for flintlock imps ───────────────────────────────
// Finds a (hide, peek) pair within ~2 tiles of the imp where:
//   • `hide` has NO LOS to the player (the corner the imp ducks behind)
//   • `peek` has LOS to the player (the spot the imp pops out to fire from)
// Returns { hide:{x,z}, peek:{x,z} } in world coords, or null if no pair exists.
// Scored to prefer 1-tile hide↔peek transitions close to the imp's current
// position, with a peek at least 1.5 tiles from the player (no point-blank).
// Called rarely (after firing, when (re)finding cover) so the LOS work is OK.
function _impFindCornerPair(w, pPx, pPz){
    const monBase = w.userData.monBase;
    if (!monBase) return null;
    const ix = monBase.position.x, iz = monBase.position.z;
    const OFFS = [];
    for (let d = 1; d <= 2; d++){
        const r = d * GRID;
        for (let i = 0; i < 8; i++){
            const ang = (i / 8) * Math.PI * 2;
            OFFS.push({ x: Math.cos(ang) * r, z: Math.sin(ang) * r, r });
        }
    }
    // Hide candidates: current tile (if already hidden) + nearby walkable
    // tiles with no LOS to the player.
    const hides = [];
    if (!_hasLineOfSight(ix, iz, pPx, pPz)) hides.push({ x: ix, z: iz, dHide: 0 });
    for (const o of OFFS){
        const hx = ix + o.x, hz = iz + o.z;
        if (!_canMonsterStand(hx, hz, w)) continue;
        if (_hasLineOfSight(hx, hz, pPx, pPz)) continue;
        hides.push({ x: hx, z: hz, dHide: o.r });
    }
    if (!hides.length) return null;
    let best = null, bestScore = Infinity;
    for (const h of hides){
        for (const o of OFFS){
            const peekX = h.x + o.x, peekZ = h.z + o.z;
            if (!_canMonsterStand(peekX, peekZ, w)) continue;
            if (!_hasLineOfSight(peekX, peekZ, pPx, pPz)) continue;
            const pToPlayer = Math.hypot(peekX - pPx, peekZ - pPz);
            if (pToPlayer < 1.5 * GRID) continue;          // no point-blank
            if (pToPlayer > 9   * GRID) continue;          // out of pistol range
            // Prefer short hides + short hide→peek hops. Tiny bias toward
            // peeks ~5 tiles away (sweet spot for the imp's pistol routine).
            const idealDist = 5 * GRID;
            const score = h.dHide * 1.0
                        + o.r * 0.7
                        + Math.abs(pToPlayer - idealDist) * 0.1;
            if (score < bestScore){
                bestScore = score;
                best = { hide: { x: h.x, z: h.z }, peek: { x: peekX, z: peekZ } };
            }
        }
    }
    return best;
}

function tickMonsterAI(dt){
    const now = performance.now()*0.001;
    for(const w of monsterWrappers){
        if(w.userData.isDead) continue;
        const ud = w.userData;

        // ── Per-monster brain: observe the player ──
        // Every tick: if this goblin has line-of-sight to the player, log
        // it to its brain. Every ~5s while hostile, report up to Oni-Baba.
        if (ud.brain){
            // Track which room we're in right now
            const _bgx = Math.round(w.position.x/GRID);
            const _bgz = Math.round(w.position.z/GRID);
            const _here = map[_bgx]?.[_bgz]?.roomId;
            if (_here !== undefined && _here !== -1) ud.brain.roomsVisited[_here] = true;

            // Player observation (LOS-gated). Cheap distance prefilter first.
            const _pdx = w.position.x - px, _pdz = w.position.z - pz;
            const _pd2 = _pdx*_pdx + _pdz*_pdz;
            if (_pd2 < (12 * GRID) * (12 * GRID)){
                if (_hasLineOfSight(w.position.x, w.position.z, px, pz)){
                    ud.brain.playerSightings++;
                    ud.brain.lastPlayerHpSeen = playerHp;
                    const _obs = {
                        x: px/GRID, z: pz/GRID, t: now,
                        hp: playerHp, maxHp: playerMaxHp,
                    };
                    ud.brain.lastSeenPlayer = _obs;
                    if (!ud.brain.firstSeenPlayer) ud.brain.firstSeenPlayer = _obs;

                    // ── Greet the player ──
                    // Idle (and ally) monsters that spot the player bow + watch
                    // instead of going hostile. Cooldown so they don't bow
                    // every frame the player walks by.
                    const _isFriendly = (ud.aiState === 'idle' || ud.isAlly === true);
                    const _greetCD    = ud._playerGreetCD || 0;
                    if (_isFriendly && now >= _greetCD && ud.monBase){
                        const mb = ud.monBase;
                        const angToPlayer = Math.atan2(px - mb.position.x, pz - mb.position.z);
                        mb.rotation.y = angToPlayer; w.rotation.y = angToPlayer;
                        ud.aiState = 'bow';
                        ud._bowTimer = (ud.bowAction?.getClip?.()?.duration ?? 1.2) + 0.3;
                        ud._bowPartnerPos = { x: px, z: pz, _isPlayer: true };
                        ud._greetingPlayer = true;
                        ud._playerGreetCD = now + 20;  // 20s before next greet
                        ud.aiWalkTarget   = null;
                        _monSetAnim(ud, 'bow');
                    }
                }
            }

            // Throttled intel report to Oni-Baba (hostile monsters only,
            // every 4-7s depending on personality.aggression).
            if (ud.aiState === 'hostile' || ud.aiState === 'chase'){
                const _reportEvery = 4 + (1 - (ud.personality?.aggression ?? 0.5)) * 3;
                if (now - ud.brain.lastReportT >= _reportEvery && ud.brain.lastSeenPlayer){
                    ud.brain.lastReportT = now;
                    window.parent.postMessage({
                        type: 'MONSTER_INTEL',
                        id: ud.id,
                        name: ud.name || 'Yakuza Goblin',
                        floor: DUNGEON_LEVEL,
                        archetype: ud.personality?.archetype || null,
                        observed: {
                            playerX: ud.brain.lastSeenPlayer.x,
                            playerZ: ud.brain.lastSeenPlayer.z,
                            playerHp: ud.brain.lastSeenPlayer.hp,
                            playerHpFrac: (ud.brain.lastSeenPlayer.hp / (ud.brain.lastSeenPlayer.maxHp || 100)) || 0,
                            sightings: ud.brain.playerSightings,
                            tSinceSeen: now - ud.brain.lastSeenPlayer.t,
                        },
                        myHpFrac: (ud.hp || 1) / (ud.maxHp || 1),
                    }, '*');
                }
            }
        }

        // ── Boulder stun timer countdown ──────────────────────────────────────
        if(ud._stunTimer > 0){
            ud._stunTimer -= dt;
            if(ud._stunTimer <= 0){
                ud._stunTimer = 0;
                ud._boulderStunned = false;
                ud._stunStartTime = 0;
                w.scale.set(1, 1, 1);
            }
            continue; // Stunned monsters can't move or act
        }

        // ── Animate fireball flames (head/shoulder DoT) ──────────────────────
        // Each flame stores its anchor Y on `baseY`; the swirl just adds a
        // small flicker around that. (Older flame clusters without baseY
        // fall back to feet-height for compatibility.)
        if(ud.fireballFlames){
            ud.fireballFlames.forEach(f=>{
                f.m.rotation.x += f.rs*0.05; f.m.rotation.y += f.rs*0.05;
                const yAnchor = (f.baseY !== undefined) ? f.baseY : 0.3;
                f.m.position.y = yAnchor + Math.sin(now*f.spd+f.off) * 0.08;
                f.m.material.opacity = 0.6 + Math.sin(now*3 + f.off) * 0.25;
            });
        }

        if(!ud.aiState) ud.aiState = 'idle';
        if(!ud.aiNextTurn) ud.aiNextTurn = now + 0.5 + Math.random()*2;
        const monBase = ud.monBase;
        if(!monBase) continue;

        // ── Room-entry NOTICE override ──
        // When the player enters a new room, every IDLE monster in that room
        // had `_noticeUntil` + `_noticeStartedAt` stamped (see the "Notice the
        // player" block in the main loop). Behaviour:
        //   1. Snap-turn to face the player (Y-rotation lerp).
        //   2. Overlay a manual bow tilt on wrapper.rotation.x — lean forward
        //      ~30° over 0.35s, hold 0.35s, return upright over 0.35s.
        //   3. Keep the idle anim playing the whole time. We DON'T trigger the
        //      bow-clip path because in this GLB `bowAction === deathAction`,
        //      which clamps the goblin to a face-planted death pose at end.
        //   4. After the notice window expires, restore wrapper.rotation.x = 0
        //      and let normal AI resume.
        if (ud._noticeUntil && performance.now() < ud._noticeUntil){
            const ndx = px - monBase.position.x;
            const ndz = pz - monBase.position.z;
            const wantAng = Math.atan2(ndx, ndz);
            let diff = wantAng - (monBase.rotation.y || 0);
            while (diff >  Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            // Fast turn-to-face so the bow reads as a deliberate greeting
            monBase.rotation.y += diff * Math.min(1, dt * 8);
            w.rotation.y = monBase.rotation.y;
            // Drop any chat / walk side-state
            ud.aiWalkTarget = null;
            ud._bowPartnerPos = null;
            ud._greetingPlayer = false;
            if (ud.aiState === 'walk' || ud.aiState === 'chat'){
                ud.aiState = 'idle';
            }
            // Keep the regular idle clip playing under the bow tilt.
            _monSetAnim(ud, 'idle');
            // Manual bow tilt — three phases (lean → hold → return).
            const bowElapsed = (performance.now() - (ud._noticeStartedAt || 0)) / 1000;
            const BOW_LEAN = -0.55; // ~31° forward
            const T_DOWN = 0.35, T_HOLD = 0.35, T_UP = 0.35;
            let tilt = 0;
            if (bowElapsed < T_DOWN){
                const t = bowElapsed / T_DOWN;
                tilt = BOW_LEAN * (t * t * (3 - 2 * t)); // smoothstep
            } else if (bowElapsed < T_DOWN + T_HOLD){
                tilt = BOW_LEAN;
            } else if (bowElapsed < T_DOWN + T_HOLD + T_UP){
                const t = (bowElapsed - T_DOWN - T_HOLD) / T_UP;
                tilt = BOW_LEAN * (1 - (t * t * (3 - 2 * t)));
            } else {
                tilt = 0; // bow finished; hold facing-player for the rest of notice
            }
            w.rotation.x = tilt;
            continue; // skip the rest of the AI this frame
        } else if (ud._noticeUntil){
            // Timer just expired — clear flags, restore upright pose, and
            // reset the turn-evaluation clock so the idle wander/visit picker
            // fires soon (which gives adjacent goblins a chance to drift
            // together and bow to each other).
            ud._noticeUntil = 0;
            ud._noticeStartedAt = 0;
            ud._noticeBowedAt = 0;
            w.rotation.x = 0;
            ud.aiNextTurn = now + 0.3 + Math.random() * 0.5;
        }

        // ── Flee-bump nod-bow overlay ──
        // Fired when a fleeing monster collides with another monster: the
        // collision code shoves the peer aside, then sets `_fleeBowUntil` on
        // BOTH so they perform a brief mutual nod (~500ms) without changing
        // aiState. This block applies the wrapper-rotation tilt and pauses
        // the rest of this monster's AI for the duration.
        if (ud._fleeBowUntil){
            const _bowNow = performance.now();
            if (_bowNow < ud._fleeBowUntil){
                const _elapsed = (500 - (ud._fleeBowUntil - _bowNow)) / 1000;
                // 0–0.20s lean down, 0.20–0.30s hold, 0.30–0.50s return up
                const LEAN = -0.32; // ~18° — shallower than the formal greet bow
                let _tilt = 0;
                if (_elapsed < 0.20){
                    const t = _elapsed / 0.20;
                    _tilt = LEAN * (t * t * (3 - 2 * t));
                } else if (_elapsed < 0.30){
                    _tilt = LEAN;
                } else if (_elapsed < 0.50){
                    const t = (_elapsed - 0.30) / 0.20;
                    _tilt = LEAN * (1 - (t * t * (3 - 2 * t)));
                }
                w.rotation.x = _tilt;
                continue;   // pause AI during the bow
            } else {
                ud._fleeBowUntil = 0;
                w.rotation.x = 0;
            }
        }

        // ── Knockback impulse (from melee hit) ───────────────────────────────
        if(ud._knockT > 0){
            ud._knockT -= dt;
            const decay = Math.max(0, ud._knockT / 0.22);
            const kx = monBase.position.x + ud._knockImpulseX * dt * (1 + decay*3);
            const kz = monBase.position.z + ud._knockImpulseZ * dt * (1 + decay*3);
            const gkx = Math.round(kx/GRID), gkz = Math.round(kz/GRID);
            if(map[gkx]?.[gkz]?.type !== 'wall'){
                monBase.position.x = kx; monBase.position.z = kz;
            }
            if(ud._knockT <= 0){ ud._knockImpulseX=0; ud._knockImpulseZ=0; }
        }

        if(ud.aiRoomId === undefined){
            const mgx = Math.round(monBase.position.x/GRID);
            const mgz = Math.round(monBase.position.z/GRID);
            ud.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
        }

        if(ud.aiState === 'idle'){
            // ── Wave-at-distance ──
            // GLOBAL throttle: only ONE monster across the whole dungeon
            // attempts a wave scan per 2 seconds. Earlier this ran per
            // monster per AI tick with N² LOS raycasts — during combat
            // (when monsters re-tick fast) it spiked into lock-up. The
            // dungeon-wide gate keeps the social charm without the cost.
            if (!window._lastWaveScanT) window._lastWaveScanT = 0;
            const _waveScanReady = (now - window._lastWaveScanT) >= 2.0;
            if (_waveScanReady && (!ud._waveCooldown || now > ud._waveCooldown) && Math.random() < 0.18){
                window._lastWaveScanT = now;
                const WAVE_MIN = GRID * 4, WAVE_MAX = GRID * 10;
                const WAVE_MAX_SQ = WAVE_MAX * WAVE_MAX;
                const WAVE_MIN_SQ = WAVE_MIN * WAVE_MIN;
                for (const peer of monsterWrappers){
                    if (peer === w || peer.userData.isDead) continue;
                    const ps = peer.userData.aiState;
                    if (ps !== 'idle' && ps !== 'chat') continue;
                    const pdx = peer.userData.monBase.position.x - monBase.position.x;
                    const pdz = peer.userData.monBase.position.z - monBase.position.z;
                    const pdSq = pdx*pdx + pdz*pdz;        // squared — skip sqrt
                    if (pdSq < WAVE_MIN_SQ || pdSq > WAVE_MAX_SQ) continue;
                    // Skip LOS raycast (expensive); cone+distance is enough
                    // for a wave-at-distance gesture. Walls between peers
                    // just means a wave through the wall — harmless visual.
                    const wantAng = Math.atan2(pdx, pdz);
                    monBase.rotation.y = wantAng; w.rotation.y = wantAng;
                    ud._waveUntil    = performance.now() + 600;
                    ud._waveCooldown = now + 14;
                    if ((!peer.userData._waveCooldown || now > peer.userData._waveCooldown)
                        && Math.random() < 0.5){
                        const backAng = Math.atan2(-pdx, -pdz);
                        peer.userData.monBase.rotation.y = backAng;
                        peer.rotation.y = backAng;
                        peer.userData._waveUntil    = performance.now() + 600;
                        peer.userData._waveCooldown = now + 14;
                    }
                    break;
                }
            }
            // Apply the wave overlay if active — tilts wrapper.rotation.z
            // briefly so the body leans like an arm-raise.
            if (ud._waveUntil && performance.now() < ud._waveUntil){
                const remain = ud._waveUntil - performance.now();
                const t = 1 - (remain / 600);                // 0 → 1
                const lean = Math.sin(t * Math.PI) * 0.18;   // peak ~10°
                w.rotation.z = lean;
            } else if (Math.abs(w.rotation.z) > 0.001){
                w.rotation.z *= Math.max(0, 1 - dt * 6);     // ease back to flat
            }

            // ── Bow greeting: idle monster spots a peer within ~1 tile and
            //    initiates a bow. The peer can be IDLE or already in CHAT
            //    (so a third monster walking into an existing conversation
            //    joins the cluster). Two newly-idle peers will bow + chat;
            //    a join-er bows to one of the chatters and adopts their chat
            //    partner so the trio stays facing-aware.
            if(!ud._bowCooldown || now > ud._bowCooldown){
                const BOW_RANGE = GRID * 1.1;
                for(const peer of monsterWrappers){
                    if(peer === w || peer.userData.isDead) continue;
                    const peerState = peer.userData.aiState;
                    if (peerState !== 'idle' && peerState !== 'chat') continue;
                    if(peer.userData._bowCooldown && now < peer.userData._bowCooldown) continue;
                    const pdx = peer.userData.monBase.position.x - monBase.position.x;
                    const pdz = peer.userData.monBase.position.z - monBase.position.z;
                    if(Math.sqrt(pdx*pdx + pdz*pdz) < BOW_RANGE){
                        const BOW_COOLDOWN = 12; // seconds before they'll bow again
                        const BOW_DUR = (ud.bowAction?.getClip?.()?.duration ?? 1.2) + 0.3;
                        // Snap both to face each other
                        const angleToward  = Math.atan2(pdx, pdz);
                        const angleAway    = Math.atan2(-pdx, -pdz);
                        monBase.rotation.y = angleToward;  w.rotation.y = angleToward;
                        // Self enters bow state
                        ud.aiState = 'bow';
                        ud._bowTimer = BOW_DUR;
                        ud._bowPartnerPos = {x: peer.userData.monBase.position.x, z: peer.userData.monBase.position.z};
                        ud._bowCooldown = now + BOW_COOLDOWN;
                        ud.aiWalkTarget = null;
                        _monSetAnim(ud, 'bow');
                        // Peer-side: only nudge into bow if they were idle.
                        // If they're already chatting, let them keep their
                        // current chat partner — but greet the newcomer by
                        // briefly facing them.
                        if (peerState === 'idle'){
                            peer.userData.monBase.rotation.y = angleAway; peer.rotation.y = angleAway;
                            peer.userData.aiState = 'bow';
                            peer.userData._bowTimer = BOW_DUR;
                            peer.userData._bowPartnerPos = {x: monBase.position.x, z: monBase.position.z};
                            peer.userData._bowCooldown = now + BOW_COOLDOWN;
                            peer.userData.aiWalkTarget = null;
                            _monSetAnim(peer.userData, 'bow');
                        } else {
                            // Join-into-chat: peer is mid-chat, just glance back briefly
                            peer.userData._chatGestureUntil = now + 0.8;
                            peer.userData._chatGesture      = 'glance';
                            peer.userData._chatGestureYaw   = angleAway;
                        }
                        break;
                    }
                }
            }
            if(ud.aiState !== 'idle') continue; // bow state set above — skip rest of idle

            if(now >= ud.aiNextTurn || ud.aiWalkTarget === undefined){
                // Living, restless dwellers — re-evaluate every 5-12s.
                // Personality scales it: aggressive monsters re-evaluate
                // faster (more pacing); brave ones range further; sociable
                // ones prefer walking toward peers.
                const restMul = 1.4 - (ud.personality?.aggression ?? 0.5) * 0.7; // 0.7-1.4
                ud.aiNextTurn = now + (5 + Math.random() * 7) * restMul;
                // Most of the time, pick a new walk target. Only ~25% rest.
                const restChance = 0.18 + (1 - (ud.personality?.aggression ?? 0.5)) * 0.18; // 0.18-0.36
                if (Math.random() < restChance){
                    ud.aiWalkTarget = null;
                    // Rest does NOT mean statue — schedule a lookaround yaw
                    // shift so they pivot in place between rests.
                    ud._lookAroundUntil = now + 1.2 + Math.random() * 2.0;
                    ud._lookAroundYaw   = (monBase.rotation.y || 0) + (Math.random() - 0.5) * Math.PI;
                } else {
                    // Visit-a-peer logic — boosted social rate. Same-room peers
                    // get heavily preferred (they're who you'd actually walk
                    // over to greet), and the target is offset to land NEXT TO
                    // the peer, not on top of them, so the bow range triggers.
                    const socialPick = 0.55 + (ud.personality?.sociability ?? 0.5) * 0.35;
                    let target = null;
                    if (Math.random() < socialPick){
                        const sameRoomPeers = [];
                        const otherPeers    = [];
                        for (const p of monsterWrappers){
                            if (p === w || p.userData.isDead) continue;
                            if (p.userData.aiState === 'hostile' || p.userData.aiState === 'flee') continue;
                            (p.userData.aiRoomId === ud.aiRoomId ? sameRoomPeers : otherPeers).push(p);
                        }
                        // ── Cross-room expedition (15%) vs same-room visit ──
                        // 15% of the time, deliberately pick a peer in ANOTHER
                        // room and commit to staying there for 60-120s. Models
                        // the "monsters wander to a neighbour room, hang out,
                        // then come home" behaviour the user described. The
                        // remaining 85% follows the original same-room-biased
                        // pool so dungeon-floor groups still feel chatty.
                        let pool;
                        let isExpedition = false;
                        if (otherPeers.length && Math.random() < 0.15){
                            pool = otherPeers;
                            isExpedition = true;
                        } else {
                            pool = (sameRoomPeers.length && Math.random() < 0.80)
                                ? sameRoomPeers
                                : (sameRoomPeers.length || otherPeers.length ? sameRoomPeers.concat(otherPeers) : []);
                        }
                        if (pool.length){
                            const peer = pool[Math.floor(Math.random() * pool.length)];
                            const pm   = peer.userData.monBase;
                            if (pm){
                                // Aim a stopping point ~0.9 tiles from the peer
                                // (just inside bow range) by walking to a point
                                // along the line FROM peer TO me, offset back.
                                const offDx = monBase.position.x - pm.position.x;
                                const offDz = monBase.position.z - pm.position.z;
                                const offLen = Math.hypot(offDx, offDz) || 1;
                                const STOP_DIST = GRID * 0.9;
                                target = {
                                    x: pm.position.x + (offDx / offLen) * STOP_DIST,
                                    z: pm.position.z + (offDz / offLen) * STOP_DIST,
                                };
                                if (isExpedition){
                                    // Stash the home room + a 60-120s deadline.
                                    // While _visitDeadline > now the AI will stay
                                    // in the visited room (override the social
                                    // picker to keep them there). After expiry,
                                    // wander back toward the home room centre.
                                    ud._homeRoomId  = ud.aiRoomId;
                                    ud._visitRoomId = peer.userData.aiRoomId;
                                    ud._visitDeadline = now + 60 + Math.random() * 60;
                                }
                            }
                        }
                    }
                    // After visit_deadline elapses → schedule a trip back home
                    if (ud._visitDeadline && now > ud._visitDeadline && ud._homeRoomId !== undefined){
                        const home = (typeof rooms !== 'undefined') ? rooms.find(r => r.id === ud._homeRoomId) : null;
                        if (home){
                            target = { x: home.cx * GRID, z: home.cz * GRID };
                        }
                        ud._visitDeadline = 0;
                        ud._homeRoomId    = undefined;
                        ud._visitRoomId   = undefined;
                    }
                    if(!target) target = _pickWanderTarget(monBase, ud.aiRoomId);
                    ud.aiWalkTarget = target;
                    ud._lookAroundUntil = 0;
                }
            }
            // ── Look-around pivot when stationary ──
            // Even with no walk target, rotate slowly toward _lookAroundYaw
            // so monsters glance around their room instead of facing one
            // direction forever. Cycles every 1.2-3.2s to a new yaw.
            if (!ud.aiWalkTarget){
                if (!ud._lookAroundUntil || now >= ud._lookAroundUntil){
                    ud._lookAroundUntil = now + 1.5 + Math.random() * 2.0;
                    ud._lookAroundYaw   = (monBase.rotation.y || 0) + (Math.random() - 0.5) * Math.PI * 0.8;
                }
                if (typeof ud._lookAroundYaw === 'number'){
                    let lDiff = ud._lookAroundYaw - (monBase.rotation.y || 0);
                    while (lDiff >  Math.PI) lDiff -= Math.PI * 2;
                    while (lDiff < -Math.PI) lDiff += Math.PI * 2;
                    monBase.rotation.y += lDiff * Math.min(1, dt * 1.3);
                    w.rotation.y = monBase.rotation.y;
                }
            }
            if(ud.aiWalkTarget){
                const dx = ud.aiWalkTarget.x - monBase.position.x;
                const dz = ud.aiWalkTarget.z - monBase.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if(dist < 0.25){
                    ud.aiWalkTarget = null;
                    _monSetAnim(ud, 'idle');
                } else {
                    const slowMul = (ud.slowUntil && ud.slowUntil > performance.now()) ? 0.5 : 1.0;
                    const step = MON_WANDER_SPD * slowMul * dt;
                    const nx = monBase.position.x + (dx/dist)*step;
                    const nz = monBase.position.z + (dz/dist)*step;
                    if(_canMonsterStand(nx, nz, w)){
                        monBase.position.x = nx; monBase.position.z = nz;
                        w.position.x = nx; w.position.z = nz;
                    } else {
                        ud.aiWalkTarget = null;
                    }
                    const wantAngle = Math.atan2(dx, dz); // face direction of travel
                    let diff = wantAngle - (monBase.rotation.y||0);
                    while(diff > Math.PI) diff -= Math.PI*2;
                    while(diff < -Math.PI) diff += Math.PI*2;
                    monBase.rotation.y += diff * Math.min(1, dt*5);
                    w.rotation.y = monBase.rotation.y;
                    _monSetAnim(ud, 'walk');
                }
            } else {
                _monSetAnim(ud, 'idle');
            }
        } else if(ud.aiState === 'hostile'){
            // Anger bloom pulse — red point-light throbs while hostile
            if(ud.aggroLight){
                ud.aggroLight.intensity = 1.4 + Math.sin(now * 4.5) * 0.55;
            }
            // ── Fetch-reinforcements trigger ─────────────────────────────────
            // Per-personality: social/loud monsters fetch sooner (up to 70%
            // HP) and on shorter cooldowns (down to 8s); lone-wolf monsters
            // only fetch at low HP and rarely. Sociability also stretches
            // the threshold so a "Rallier" archetype starts shouting for
            // backup almost immediately.
            const fetchCooldown = ud.personality?.fetchCooldown ?? 15;
            const fetchFrac     = ud.personality?.fetchHpFrac   ?? 0.40;
            if(!ud._lastFetchAt || (now - ud._lastFetchAt) > fetchCooldown){
                const hpFrac = (ud.hp ?? ud.maxHp ?? 1) / (ud.maxHp || 1);
                if(hpFrac < fetchFrac){
                    const reinf = _findReinforcementDoorway(ud);
                    if(reinf){
                        ud.aiState = 'fetch';
                        ud._fetchTileX = reinf.doorX;
                        ud._fetchTileZ = reinf.doorZ;
                        ud._fetchPeerRoom = reinf.peerRoomId;
                        ud._fetchPath = null;
                        const mName = ud.name || 'Goblin';
                        const arch = ud.personality?.archetype || '';
                        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                            text:`💨 <b>${mName}</b>${arch ? ` <i style="opacity:.7">(${arch})</i>` : ''} bolts to fetch reinforcements!`}, '*');
                        continue;
                    }
                }
            }
            const dxRaw = px - monBase.position.x;
            const dzRaw = pz - monBase.position.z;
            const dist = Math.sqrt(dxRaw*dxRaw + dzRaw*dzRaw);

            // ── A* chase: compute a tile path and follow it around walls ──
            //
            // Recompute when: no path, path stale (>0.6s), player's tile
            // changed by ≥2 from when path was computed, or the next step
            // is blocked.
            const sgx = Math.round(monBase.position.x/GRID);
            const sgz = Math.round(monBase.position.z/GRID);
            const pgx = Math.round(px/GRID);
            const pgz = Math.round(pz/GRID);
            const pathAge = now - (ud.aiPathStamp || 0);
            const goalDrift = ud.aiPathGoalX===undefined ? 99 :
                              (Math.abs(pgx-ud.aiPathGoalX) + Math.abs(pgz-ud.aiPathGoalZ));
            let needPath = !ud.aiPath || pathAge > 0.6 || goalDrift >= 2;
            if(needPath){
                ud.aiPath = _monAStar(sgx, sgz, pgx, pgz);
                ud.aiPathIdx = 0;
                ud.aiPathStamp = now;
                ud.aiPathGoalX = pgx;
                ud.aiPathGoalZ = pgz;
                // Skip the first node — it's the current tile
                if(ud.aiPath && ud.aiPath.length > 1) ud.aiPathIdx = 1;
            }

            // Resolve current path target (or fall back to direct)
            let tgtX = px, tgtZ = pz;
            if(ud.aiPath && ud.aiPathIdx < ud.aiPath.length){
                const [tgx, tgz] = ud.aiPath[ud.aiPathIdx];
                tgtX = tgx * GRID;
                tgtZ = tgz * GRID;
                // Advance index if we've reached this tile
                const adx = tgtX - monBase.position.x;
                const adz = tgtZ - monBase.position.z;
                if(adx*adx + adz*adz < 0.16){ // ~0.4 unit radius
                    ud.aiPathIdx++;
                    if(ud.aiPathIdx >= ud.aiPath.length){
                        // path exhausted — fall through to direct toward player next frame
                        ud.aiPath = null;
                    }
                }
            }

            // Face the immediate target (not the final goal — feels more natural around corners)
            const fdx = tgtX - monBase.position.x;
            const fdz = tgtZ - monBase.position.z;
            const wantAngle = Math.atan2(fdx, fdz);
            let diff = wantAngle - (monBase.rotation.y||0);
            while(diff > Math.PI) diff -= Math.PI*2;
            while(diff < -Math.PI) diff += Math.PI*2;
            monBase.rotation.y += diff * Math.min(1, dt*4);
            w.rotation.y = monBase.rotation.y;

            // ── Imp ranged attack ──
            // Imps STAY back and throw shuriken (1-10 dmg) instead of
            // closing for melee. They engage from up to 8 tiles when LOS
            // is clear; back off when too close so the player can't easily
            // catch and slap them.
            if (ud.isImp){
                // Always-on reload tick. Previously _impPistolCD was only
                // decremented inside the LOS-true branch below, which meant:
                // an imp that fled out of sight would never count down its
                // reload, never re-engage, and effectively retire from combat
                // after one shot. Decrementing here ticks regardless of state
                // — flee, chase, idle — so the imp's next shot is always
                // ~10s after the prior one.
                if (ud.hasFlintlock){
                    ud._impPistolCD = (ud._impPistolCD || 0) - dt;
                }
                // Flintlock-imp flee phase — keeps running regardless of LOS
                // so they actually break sight while reloading. When the flee
                // destination is reached (or invalidated) we drop back into
                // the normal LOS-aim logic below.
                if (ud.hasFlintlock && ud._fleeDest){
                    const _dx = ud._fleeDest.x - monBase.position.x;
                    const _dz = ud._fleeDest.z - monBase.position.z;
                    const _dd = Math.hypot(_dx, _dz);
                    if (_dd < 0.4){
                        ud._fleeDest = null;
                    } else {
                        const slowMul = (ud.slowUntil && ud.slowUntil > performance.now()) ? 0.5 : 1.0;
                        const step = MON_WANDER_SPD * 1.8 * slowMul * dt;
                        const nx = monBase.position.x + (_dx / _dd) * step;
                        const nz = monBase.position.z + (_dz / _dd) * step;
                        if (_canMonsterStand(nx, nz, w)){
                            monBase.position.x = nx; monBase.position.z = nz;
                            w.position.x = nx; w.position.z = nz;
                            const wantAng = Math.atan2(_dx, _dz);
                            let fAng = wantAng - (monBase.rotation.y || 0);
                            while (fAng >  Math.PI) fAng -= Math.PI * 2;
                            while (fAng < -Math.PI) fAng += Math.PI * 2;
                            monBase.rotation.y += fAng * Math.min(1, dt * 6);
                            w.rotation.y = monBase.rotation.y;

                        } else {
                            ud._fleeDest = null;
                        }
                    }
                }
                const _impLOS = _hasLineOfSight(monBase.position.x, monBase.position.z, px, pz);
                if (_impLOS && dist <= 8 * GRID && dist > 1.5){
                    // Face player smoothly

                    let fAng = wantAng - (monBase.rotation.y || 0);
                    while (fAng > Math.PI) fAng -= Math.PI*2;
                    while (fAng < -Math.PI) fAng += Math.PI*2;
                    monBase.rotation.y += fAng * Math.min(1, dt * 6);
                    w.rotation.y = monBase.rotation.y;

                    // Flintlock imps fire one heavy pistol shot, then RUN AWAY
                    // to a far tile (preferably another room) while they
                    // reload (~10s). When reloaded they come back to ambush.
                    // Regular imps keep their fast shuriken loop in place.

                        // is in pistol range, so a fired-then-fled imp won't

                                const nx = monBase.position.x + (_dx / _dd) * step;
                                const nz = monBase.position.z + (_dz / _dd) * step;
                                if (_canMonsterStand(nx, nz, w)){

                const step = MON_WANDER_SPD * 1.6 * slowMul * dt;

                    let yielder = ud._yieldFleer;
                    const stillBlocking = yielder && !yielder.userData.isDead &&
                        yielder.userData.aiState === 'flee' &&
                        ((yielder.position.x - monBase.position.x) ** 2 +
                         (yielder.position.z - monBase.position.z) ** 2) < (GRID * 2.5) * (GRID * 2.5);
                    if (stillBlocking){

                        ];

                        continue;

                const sdz = tgtZ - monBase.position.z;

                        ud._yieldFleer = fleer;

            } else {
                // Melee range — attack player on cooldown
                ud._atkCooldown = (ud._atkCooldown || 0) - dt;
                if(ud._atkCooldown <= 0){
                    ud._atkCooldown = 1.8 + Math.random() * 1.0; // 1.8–2.8s between hits (paced down so swarms aren't overwhelming)
                    // Haunted monsters hit much harder — grudge 1..5 maps to

                    const _g = ud.haunt?.grudge || 0;

        } else if(ud.aiState === 'bow'){

                        : (monBase.rotation.y || 0);

            // Default target yaw: face partner.
