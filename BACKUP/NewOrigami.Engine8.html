// --- Stairways ---
for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
    const cell=map[x][z];
    if(!cell) continue;
    if(cell.type==='stairs_down'){
        const stairGroup=new THREE.Group();
        const pitDepth=1.8, numSteps=8;
        const stepH=pitDepth/numSteps, stepD=GRID/numSteps;
        for(let s=0;s<numSteps;s++){
            const step=new THREE.Mesh(new THREE.BoxGeometry(GRID*0.95,stepH,stepD*1.2),mats.stairDown);
            step.position.set(x*GRID,-(s+0.5)*stepH,z*GRID+((s-(numSteps/2))*stepD));
            worldGroup.add(step);
        }
    }
    if(cell.type==='stairs_up'){
        // ── Double-wide stone stairway — the entrance gate to the dungeon ────
        // Detect if the tile to the right (+x) is stairs_up_r; if so span 2 tiles.
        const isDouble = map[x+1]?.[z]?.type === 'stairs_up_r';
        const stairSpan = isDouble ? GRID * 2 : GRID;     // physical width
        const stairCx   = isDouble ? x*GRID + GRID*0.5 : x*GRID; // centre X of span

        const stairGroup = new THREE.Group();
        const numSteps = 8, riserH = 0.22, treadD = GRID/numSteps;
        const stoneMat = new THREE.MeshStandardMaterial({
            map: wallTopTex, color: 0x686056, roughness: 0.95, metalness: 0.05
        });
        for(let s=0; s<numSteps; s++){
            const step = new THREE.Mesh(
                new THREE.BoxGeometry(stairSpan * 0.97, riserH*(s+1), treadD*1.15),
                stoneMat
            );
            step.position.set(
                stairCx,
                (riserH*(s+1))/2,
                z*GRID + ((s - (numSteps-1)/2)*treadD)
            );
            step.receiveShadow = true; step.castShadow = true;
            stairGroup.add(step);
        }
        // Side stone walls flanking the stairway (outer edges only)
        const sideWallMat = new THREE.MeshStandardMaterial({
            map: wallTex, color: 0x4a4540, roughness: 0.96, metalness: 0.0
        });
        for(const sx of [-1, 1]){
            const sw = new THREE.Mesh(
                new THREE.BoxGeometry(GRID*0.06, WALL_H*0.95, GRID*1.05),
                sideWallMat
            );
            sw.position.set(stairCx + sx*(stairSpan*0.5), WALL_H*0.475, z*GRID);
            stairGroup.add(sw);
        }
        // ── start_door.jpg — double iron-studded gate spanning full 2-tile width
        const doorMat = new THREE.MeshStandardMaterial({
            map: startDoorTex,
            roughness: 0.88, metalness: 0.0,
            emissive: 0x0a0804, emissiveIntensity: 0.12
        });
        const doorH = WALL_H * 0.92, doorW = stairSpan * 0.97;
        const door = new THREE.Mesh(
            new THREE.BoxGeometry(doorW, doorH, 0.10),
            doorMat
        );
        door.position.set(
            stairCx,
            riserH * numSteps + doorH / 2,
            z * GRID + (numSteps / 2) * treadD + 0.06
        );
        door.userData.isExitDoor = true;
        stairGroup.add(door);

        // Stone arch frame
        const archMat = new THREE.MeshStandardMaterial({
            map: wallTex, color: 0x4a4540, roughness: 0.97, metalness: 0.0
        });
        const lintel = new THREE.Mesh(
            new THREE.BoxGeometry(doorW + GRID*0.14, WALL_H*0.10, GRID*0.14),
            archMat
        );
        lintel.position.set(stairCx, riserH*numSteps + doorH + WALL_H*0.05,
            z*GRID + (numSteps/2)*treadD + 0.06);
        stairGroup.add(lintel);
        for(const sx of [-1, 1]){
            const jamb = new THREE.Mesh(
                new THREE.BoxGeometry(GRID*0.10, doorH + WALL_H*0.10, GRID*0.14),
                archMat
            );
            jamb.position.set(
                stairCx + sx*(doorW/2 + GRID*0.05),
                riserH*numSteps + doorH/2,
                z*GRID + (numSteps/2)*treadD + 0.06
            );
            stairGroup.add(jamb);
        }

        // Warm greenish-gold glow leaking around the door (mossy magic)
        const exitLight = new THREE.PointLight(0xb8d4a0, 1.1, GRID * 5, 1.8);
        exitLight.position.set(stairCx, riserH*numSteps + doorH*0.55,
            z*GRID + (numSteps/2)*treadD + 0.6);
        stairGroup.add(exitLight);

        stairGroup.userData.stairsUpGx = x;
        stairGroup.userData.stairsUpGz = z;
        worldGroup.add(stairGroup);
        window._stairsUpGx = x;
        window._stairsUpGz = z;
    }
    if(cell.type==='stairs_up_r'){
        // Right half of a double-wide stair — geometry handled by left tile, skip
    }
}

// --- Top-Corner Spider Webs (ONLY where ceiling meets two walls) ────────────
// For each floor tile, check if it has wall neighbors on two adjacent sides.
// If yes, that's a corner — drape a web in the upper corner using a random
// variant from the 3 precompiled textures. NO floor cobwebs anywhere.
const webPlaneGeo = new THREE.PlaneGeometry(1.6, 1.6);
// Helper: any kind of wall (stone OR shoji panel) blocks corner web placement test
const isWallish = (x,z) => {
    const t = map[x]?.[z]?.type;
    return t === 'wall' || t === 'shoji';
};
// Track variant + size placed per corner so we can ban repeats across
// neighbouring corners. Adjacent corners never share variant OR size.
const placedWebVariant = new Map(); // key: `${x},${z},${cIdx}` -> variantIndex
const placedWebSize    = new Map(); // key: `${x},${z},${cIdx}` -> sizeIndex (0=S, 1=M, 2=L)
const webKey = (x,z,c) => `${x},${z},${c}`;
// Three explicit size buckets — small, medium, large — alternated so no two
// adjacent corners share a size, giving rooms real visual variety.
const WEB_SIZES = [0.55, 0.85, 1.15];

// Batched web placement — collect per-material, merge into single meshes
{
const _webGeos = new Map(); // material → [BufferGeometry]
const corridorWebGeo = new THREE.PlaneGeometry(GRID*0.95, GRID*0.7);
let lastCorridorVariant = -1;
let lastCorridorSize    = -1;
const _tmpObj = new THREE.Object3D();

for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
    const cell=map[x][z];
    if(!cell || cell.type==='wall' || cell.type==='shoji') continue;
    const wN = isWallish(x, z-1), wS = isWallish(x, z+1);
    const wW = isWallish(x-1, z), wE = isWallish(x+1, z);
    // Each corner gets a flipX flag — webs on opposite walls mirror so the
    // cobwebs read as draped from the correct wall (small-left, small-right etc).
    const corners = [
        {n:wN, w:wW, dx:-0.55, dz:-0.55, ry: Math.PI*0.25 + Math.PI, flip:+1},
        {n:wN, w:wE, dx: 0.55, dz:-0.55, ry:-Math.PI*0.25 + Math.PI, flip:-1},
        {n:wS, w:wW, dx:-0.55, dz: 0.55, ry: Math.PI*0.75 + Math.PI, flip:+1},
        {n:wS, w:wE, dx: 0.55, dz: 0.55, ry:-Math.PI*0.75 + Math.PI, flip:-1},
    ];
    const isMandatoryWebCell = cell.roomId === 0 || cell.roomId === 1;
    corners.forEach((c, cIdx)=>{
        if(!(c.n && c.w)) return;
        // Higher density per user request — 80% per eligible corner (was 55%).
        // Rooms 0 and 1 must always show cobwebs where valid.
        if(!isMandatoryWebCell && Math.random() > 0.80) return;

        // Ban variants / sizes used in this tile's other corners + the four
        // neighbour tiles' corners. Guarantees no two adjacent corners share
        // a variant OR a size, so rooms feel hand-decorated.
        const bannedVar = new Set();
        const bannedSize = new Set();
        for(let k=0;k<4;k++){
            if(k===cIdx) continue;
            const v=placedWebVariant.get(webKey(x,z,k)); if(v!==undefined) bannedVar.add(v);
            const s=placedWebSize.get(webKey(x,z,k));    if(s!==undefined) bannedSize.add(s);
        }
        for(const [nx,nz] of [[x-1,z],[x+1,z],[x,z-1],[x,z+1]]){
            for(let k=0;k<4;k++){
                const v=placedWebVariant.get(webKey(nx,nz,k)); if(v!==undefined) bannedVar.add(v);
                const s=placedWebSize.get(webKey(nx,nz,k));    if(s!==undefined) bannedSize.add(s);
            }
        }
        const varPool = []; for(let i=0;i<mats.webs.length;i++) if(!bannedVar.has(i)) varPool.push(i);
        const sizePool = []; for(let i=0;i<WEB_SIZES.length;i++) if(!bannedSize.has(i)) sizePool.push(i);
        const variantIdx = (varPool.length ? varPool : mats.webs.map((_,i)=>i))[Math.floor(Math.random()*(varPool.length||mats.webs.length))];
        const sizeIdx    = (sizePool.length ? sizePool : [0,1,2])[Math.floor(Math.random()*(sizePool.length||3))];
        placedWebVariant.set(webKey(x,z,cIdx), variantIdx);
        placedWebSize.set(   webKey(x,z,cIdx), sizeIdx);

        _tmpObj.position.set(x*GRID + c.dx, WALL_H - 0.95, z*GRID + c.dz);
        _tmpObj.rotation.order='YXZ';
        _tmpObj.rotation.set(-Math.PI/3.6, c.ry, (Math.random()-0.5)*0.25);
        // Size from the chosen bucket + small jitter. flip mirrors X so webs on
        // opposite walls of the same room face inward instead of copy-paste.
        const baseS = WEB_SIZES[sizeIdx] * (0.92 + Math.random()*0.16);
        _tmpObj.scale.set(baseS * c.flip, baseS, 1);
        _tmpObj.updateMatrix();
        const geo = webPlaneGeo.clone().applyMatrix4(_tmpObj.matrix);
        const mat = mats.webs[variantIdx];
        if(!_webGeos.has(mat)) _webGeos.set(mat, []);
        _webGeos.get(mat).push(geo);
    });
    // Corridor webs — alternating variant + size so no two in a row are same
    const ewCorridor = wW && wE && !wN && !wS;
    const nsCorridor = wN && wS && !wW && !wE;
    if((ewCorridor || nsCorridor) && Math.random() <= 0.55){
        let vIdx; do { vIdx = Math.floor(Math.random()*mats.webs.length); } while(vIdx === lastCorridorVariant && mats.webs.length>1);
        let sIdx; do { sIdx = Math.floor(Math.random()*WEB_SIZES.length); } while(sIdx === lastCorridorSize && WEB_SIZES.length>1);
        lastCorridorVariant = vIdx;
        lastCorridorSize    = sIdx;
        _tmpObj.position.set(x*GRID, WALL_H - 0.78, z*GRID);
        _tmpObj.rotation.set((Math.random()-0.5)*0.10, ewCorridor?0:Math.PI/2, (Math.random()-0.5)*0.10);
        const s = WEB_SIZES[sIdx] * (0.88 + Math.random()*0.14);
        _tmpObj.scale.set(s, s, 1);
        _tmpObj.updateMatrix();
        const geo = corridorWebGeo.clone().applyMatrix4(_tmpObj.matrix);
        const mat = mats.webs[vIdx];
        if(!_webGeos.has(mat)) _webGeos.set(mat, []);
        _webGeos.get(mat).push(geo);
    }
}
// Merge all webs per material into single draw-call meshes
for(const [mat, geos] of _webGeos){
    if(!geos.length) continue;
    // T0.12 — normalize index presence so merge never fails on attribute mismatch
    const normalized = geos.map(g => g.index ? g.toNonIndexed() : g);
    const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(normalized, false);
    if(!merged) continue;
    const mesh = new THREE.Mesh(merged, mat);
    mesh.castShadow=false; mesh.receiveShadow=false;
    mesh.layers.set(1); mesh.frustumCulled=false;
    worldGroup.add(mesh);
    geos.forEach(g=>g.dispose());
}
_webGeos.clear();
}

{

// ── Abstract Debris / Rubble ─────────────────────────────────────────────
// Shapeless dark piles along walls — NOT identifiable as vases/cups/dishes,

const debrisMat = new THREE.MeshStandardMaterial({

const debrisDarkMat = new THREE.MeshStandardMaterial({

function makeRubblePile(){
    const g = new THREE.Group();
    // 4-7 jumbled chunks of varying size — boxes and squashed shapes only
    const n = 4 + Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){

        );

        );
        chunk.rotation.set(
            Math.random()*Math.PI*2,
            Math.random()*Math.PI*2,

// ── Shared furniture materials (dark brown + dust sheen) ─────────────────────
const furnitureMat = new THREE.MeshStandardMaterial({

// Dust overlay: near-white transparent sheet settled on horizontal surfaces

});
// Shared low-poly geometries (defined ONCE, instanced via Mesh)
const _fGeos = {

function makeBrokenChair(){

const clutterMakers = [makeRubblePile, makeRubblePile]; // rubble most common
const furnitureMakers = [makeBrokenChair, makeBrokenTable, makeRottenBarrel, makeBrokenShelf];
const allDecorMakers  = [...clutterMakers, ...furnitureMakers];

// ── Batched furniture/rubble: merge ALL decor into a few draw calls ──────────
// Collect geometries per material, bake world transforms, merge once.
{
const _decorGeos = new Map(); // material → [BufferGeometry]
const _dm = new THREE.Matrix4(); // reusable

for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
    const cell = map[x][z];
    if(!cell || cell.type !== 'floor') continue;
    const isRoom = !!cell.room;
    const isHall = !!cell.hall;
    if(!isRoom && !isHall) continue;
    if(cell.roomType === 'temple' || cell.roomType === 'vault') {
        if(Math.random() > 0.06) continue;
    }
    const wN = isWallish(x, z-1), wS = isWallish(x, z+1);
    const wW = isWallish(x-1, z), wE = isWallish(x+1, z);
    if(!(wN||wS||wW||wE)) continue;
    const density = isHall ? 0.12 : 0.15;
    if(Math.random() > density) continue;

    const makers = isHall ? clutterMakers : allDecorMakers;
    const make = makers[Math.floor(Math.random()*makers.length)];
    const piece = make();
    let ox = 0, oz = 0;
    if(wN) oz -= GRID*0.32;
    if(wS) oz += GRID*0.32;
    if(wW) ox -= GRID*0.32;
    if(wE) ox += GRID*0.32;
    if(!ox && !oz){ ox = (Math.random()-0.5)*0.3; oz = (Math.random()-0.5)*0.3; }
    piece.position.set(x*GRID + ox, 0, z*GRID + oz);
    piece.rotation.y = Math.random()*Math.PI*2;
    piece.updateMatrixWorld(true);
    // Extract each child mesh geometry with baked world transform, group by material
    piece.traverse(o=>{
        if(!o.isMesh) return;
        const geo = o.geometry.clone();
        geo.applyMatrix4(o.matrixWorld);
        const mat = o.material;
        if(!_decorGeos.has(mat)) _decorGeos.set(mat, []);
        _decorGeos.get(mat).push(geo);
    });
}
// Merge per-material and add as single meshes
for(const [mat, geos] of _decorGeos){
    if(!geos.length) continue;
    // T0.12 — normalize index presence so merge never fails on attribute mismatch
    const normalized = geos.map(g => g.index ? g.toNonIndexed() : g);
    const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(normalized, false);
    if(!merged) continue;
    const mesh = new THREE.Mesh(merged, mat);
    mesh.castShadow = false; mesh.receiveShadow = true;
    mesh.layers.set(1);
    mesh.frustumCulled = false; // static — always in scene
    mesh.userData = {isDecor:true};
    worldGroup.add(mesh);
    // Free source geometries
    geos.forEach(g=>g.dispose());
}
_decorGeos.clear();
}

// ── Room Floor Decals — unified bloom-glow style ────────────────────────────
rooms.forEach(room=>{
    // The entrance hallway is owned by the moon-phase combo tile — it
    // renders a single cool BEWARE ward (or phase label + kanji) at the
    // hall's center. Skip the auto-decal here so we don't stack two glyphs
    // on the same tile.
    if (room.isEntranceHall) return;

    const dc=document.createElement('canvas'); dc.width=512; dc.height=512;
    const dctx=dc.getContext('2d');
    dctx.textAlign='center'; dctx.textBaseline='middle';

    // Hallway: just the BEWARE kanji centered. Other rooms: room # only, big.
    const isHall = (room.roomType === 'hallway');

    // Helper: draw glowing glyph with multi-layer bloom + shrink-to-fit so the
    // text never overflows the tile-sized decal plane.
    const drawBloomGlyph = (glyph, cx, cy, size, font='serif') => {
        let s = size;
        dctx.font = `900 ${s}px ${font}`;
        while (s > 24 && dctx.measureText(glyph).width > 432){
            s -= 4; dctx.font = `900 ${s}px ${font}`;
        }
        // Outer halo
        dctx.shadowColor = 'rgba(120,255,210,0.85)';
        dctx.shadowBlur = 60;
        dctx.fillStyle = 'rgba(140,255,220,0.55)';
        dctx.fillText(glyph, cx, cy);
        // Mid bloom
        dctx.shadowBlur = 28;
        dctx.fillStyle = 'rgba(180,255,230,0.80)';
        dctx.fillText(glyph, cx, cy);
        // Sharp inner outline
        dctx.shadowBlur = 0;
        dctx.lineWidth = 5;
        dctx.strokeStyle = 'rgba(220,255,240,0.95)';
        dctx.strokeText(glyph, cx, cy);
    };

    if(isHall){
        drawBloomGlyph(room.kanji || '注', 256, 256, 320);
        // English label below BEWARE kanji — small italic, same bloom
        dctx.save();
        dctx.shadowColor = 'rgba(120,255,210,0.7)';
        dctx.shadowBlur = 18;
        dctx.fillStyle = 'rgba(190,255,235,0.72)';
        dctx.font = 'italic 500 56px serif';
        dctx.fillText('Beware', 256, 372);
        dctx.shadowBlur = 0;
        dctx.strokeStyle = 'rgba(220,255,240,0.55)';
        dctx.lineWidth = 2;
        dctx.strokeText('Beware', 256, 372);
        dctx.restore();
    } else {
        // Room number only — large, centered. No kanji name.
        drawBloomGlyph(`#${room.id+1}`, 256, 256, 300, 'Inter, sans-serif');
    }

    const dtex=new THREE.CanvasTexture(dc);
    dtex.generateMipmaps=false; dtex.minFilter=THREE.LinearFilter;
    const decalMat = new THREE.MeshBasicMaterial({
        map:dtex, transparent:true, depthWrite:false,
        blending: THREE.AdditiveBlending  // additive so all decals glow against floor
    });
    // Decal plane capped to a single tile (with a small margin) so text never
    // bleeds past the floor tile. Hallway sigil kept slightly smaller still.
    const decalSize = isHall ? GRID*0.78 : GRID*0.92;
    const dm=new THREE.Mesh(
        new THREE.PlaneGeometry(decalSize, decalSize),
        decalMat
    );
    dm.rotation.x=-Math.PI/2;
    dm.position.set(room.center.x*GRID, 0.05, room.center.y*GRID);
    worldGroup.add(dm);
});

// ── Moon-Phase Floor Decals — placed at start position once MOON_PHASE arrives.
// Two tiles in the entrance hall: English label + kanji. NEW MOON also drops a
// BEWARE tile. Recreated each time MOON_PHASE fires so a re-broadcast refreshes.
const _moonPhaseDecals = [];
// Plane size is capped to ~one tile so the decal never overflows the floor
// tile. The shrink-to-fit budget below is matched to this plane size: text
// occupies at most ~84% of the canvas width, then the plane maps that 1:1
// onto the tile interior with a small breathing margin on all four edges.
const _DECAL_PLANE = GRID * 0.92;
const _DECAL_TEXT_MAX_PX = 432;          // 432/512 ≈ 84% of canvas width
function _buildBloomDecal(text, fontFamily, fontSize, planeSize = _DECAL_PLANE){
    const dc = document.createElement('canvas'); dc.width = 512; dc.height = 512;
    const dctx = dc.getContext('2d');
    dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
    // Shrink-to-fit so long labels like "WANING CRESCENT MOON PHASE" still
    // read on one tile. Stops once the rendered text fits the tile budget.
    let size = fontSize;
    dctx.font = `900 ${size}px ${fontFamily}`;
    while (size > 22 && dctx.measureText(text).width > _DECAL_TEXT_MAX_PX){
        size -= 4; dctx.font = `900 ${size}px ${fontFamily}`;
    }
    // Outer halo
    dctx.shadowColor = 'rgba(120,255,210,0.85)';
    dctx.shadowBlur = 60;
    dctx.fillStyle = 'rgba(140,255,220,0.55)';
    dctx.fillText(text, 256, 256);
    // Mid bloom
    dctx.shadowBlur = 28;
    dctx.fillStyle = 'rgba(180,255,230,0.80)';
    dctx.fillText(text, 256, 256);
    // Sharp inner outline
    dctx.shadowBlur = 0;
    dctx.lineWidth = 5;
    dctx.strokeStyle = 'rgba(220,255,240,0.95)';
    dctx.strokeText(text, 256, 256);

    const tex = new THREE.CanvasTexture(dc);
    tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
    const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(planeSize, planeSize),
        new THREE.MeshBasicMaterial({
            map: tex, transparent: true, depthWrite: false,
            blending: THREE.AdditiveBlending,
        }),
    );
    mesh.rotation.x = -Math.PI / 2;
    return mesh;
}
function _placeMoonPhaseDecals(phaseName){
    // Clear previous moon-phase decals.
    for (const d of _moonPhaseDecals){
        worldGroup.remove(d);
        if (d.material?.map) d.material.map.dispose();
        d.material?.dispose();
        d.geometry?.dispose();
    }
    _moonPhaseDecals.length = 0;
    if (!phaseName) return;
    const kanjiByPhase = {
        'NEW MOON PHASE':'新月',
        'WAXING CRESCENT MOON PHASE':'三日月',
        'FIRST QUARTER MOON PHASE':'上弦の月',
        'WAXING GIBBOUS MOON PHASE':'十三夜月',
        'FULL MOON PHASE':'満月',
        'WANING GIBBOUS MOON PHASE':'居待月',
        'LAST QUARTER MOON PHASE':'下弦の月',
        'WANING CRESCENT MOON PHASE':'有明月',
    };
    const kanji = kanjiByPhase[phaseName] || '月';
    const isNewMoon = phaseName === 'NEW MOON PHASE';

    if (isNewMoon){
        // NEW MOON gets the single combo tile only — banner moon-phase name
        // arched above, BEWARE in the center, kanji below. Skipping the
        // separate label + kanji tiles avoids stacking three redundant
        // decals on top of the hallway's own warning sigil.
        const combo = _buildBewareBannerDecal(phaseName);
        combo.position.set(spawnX * GRID, 0.05, (spawnZ - 1) * GRID);
        worldGroup.add(combo); _moonPhaseDecals.push(combo);
    } else {
        // Other phases: two tiles — English phase label + kanji.
        const label = _buildBloomDecal(phaseName, 'Inter, sans-serif', 78);
        label.position.set(spawnX * GRID, 0.05, (spawnZ - 1) * GRID);
        worldGroup.add(label); _moonPhaseDecals.push(label);

        const kj = _buildBloomDecal(kanji, 'serif', 260);
        kj.position.set(spawnX * GRID, 0.05, (spawnZ - 2) * GRID);
        worldGroup.add(kj); _moonPhaseDecals.push(kj);
    }
}

// Draws moon-phase text on a gentle convex-up arc (a banner curve) at the
// top of the tile, with BEWARE in the bottom-center. The arc geometry is
// tuned so the banner endpoints stay within ~432 canvas-pixels (the same
// width budget as the other decals), so the whole composition stays inside
// one floor tile. Same bloom palette as the other decals so they read as a
// matching set.
function _buildBewareBannerDecal(phaseName){
    const dc = document.createElement('canvas'); dc.width = 512; dc.height = 512;
    const ctx = dc.getContext('2d');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // ── Layer 1 — Faded 注 ward kanji as a watermark backdrop ───────────
    // Sits behind everything; gives the tile a "warning sigil" feel before
    // any text reads. Kept low-opacity green-cyan so it doesn't compete
    // with the danger-tinted BEWARE on top.
    ctx.save();
    ctx.font = `900 380px serif`;
    ctx.shadowColor = 'rgba(120,255,210,0.50)';
    ctx.shadowBlur = 36;
    ctx.fillStyle = 'rgba(140,255,210,0.18)';
    ctx.fillText('注', 256, 268);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(220,255,240,0.35)';
    ctx.strokeText('注', 256, 268);
    ctx.restore();

    // ── Layer 2 — Banner arc with the phase name (top of tile) ─────────
    // Arc center is below the canvas → text curves like ⌒ (smile up).
    const arcCx = 256, arcCy = 700, arcR = 600, arcHalf = 0.35;
    let bSize = 48;
    ctx.font = `900 ${bSize}px Inter, sans-serif`;
    let total = 0;
    for (const ch of phaseName) total += ctx.measureText(ch).width;
    const maxArcLen = arcR * (2 * arcHalf) * 0.95;
    while (total > maxArcLen && bSize > 18){
        bSize -= 2; ctx.font = `900 ${bSize}px Inter, sans-serif`;
        total = 0; for (const ch of phaseName) total += ctx.measureText(ch).width;
    }
    const leftover = (maxArcLen - total);
    let curArc = -arcHalf + (leftover * 0.5) / arcR;

    const drawArcChar = (ch) => {
        const chW = ctx.measureText(ch).width;
        const angle = curArc + (chW * 0.5) / arcR;
        const x = arcCx + Math.sin(angle) * arcR;
        const y = arcCy - Math.cos(angle) * arcR;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.shadowColor = 'rgba(120,255,210,0.85)';
        ctx.shadowBlur = 32;
        ctx.fillStyle = 'rgba(160,255,220,0.65)';
        ctx.fillText(ch, 0, 0);
        ctx.shadowBlur = 14;
        ctx.fillStyle = 'rgba(220,255,235,0.95)';
        ctx.fillText(ch, 0, 0);
        ctx.shadowBlur = 0;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.strokeText(ch, 0, 0);
        ctx.restore();
        curArc += chW / arcR;

    for (const ch of phaseName) drawArcChar(ch);

    // ── Layer 3 — Big BEWARE in DANGER red/amber glow ──────────────────
    // Warm tint instead of the green-cyan ghost palette so the warning
    // actually reads as a warning. Multi-pass shadow → halo, mid bloom,
    // crisp white-amber inner stroke.

    ctx.shadowBlur = 80;
    ctx.fillStyle = 'rgba(255,140,40,0.55)';

    ctx.shadowBlur = 36;
    ctx.fillStyle = 'rgba(255,220,140,0.95)';
    ctx.fillText(bewareText, 256, 296);
    // Crisp warm-white core stroke
    ctx.shadowBlur = 0;
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(255,250,220,0.98)';
    ctx.strokeText(bewareText, 256, 296);

    // ── Layer 4 — Small phase kanji underneath ─────────────────────────
    const kanjiByPhase = {

        'FIRST QUARTER MOON PHASE':'上弦の月',

    ctx.shadowBlur = 26;
    ctx.fillStyle = 'rgba(255,210,140,0.85)';
    ctx.fillText(kanji, 256, 416);
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(255,240,200,0.95)';
    ctx.fillText(kanji, 256, 416);
    ctx.shadowBlur = 0;

// T0.20 — Auto-face attacker. When a monster attacks, the camera smoothly
// rotates to face the attacker so the player can see what's hitting them.
// If a nearer attacker fires while a target is already active, the nearer
// one wins. Manual rotation input (rotL/rotR) cancels it.
let _autoFaceTarget = null; // { x, z, until }
// monBase: any Object3D with .position
// force=true → ALWAYS overrides the current face target (used for player
//              attacks — they're a deliberate choice, never skip).
// force=false → "nearer attacker wins" — used by the monster-hit path so a
//              close goblin keeps the lock even if a farther one swings.
function _autoFaceOnAttack(monBase, force = false){
    if(!monBase || !monBase.position) return;
    if(!force && _autoFaceTarget && performance.now() < _autoFaceTarget.until){
        const dx = monBase.position.x - px;
        const dz = monBase.position.z - pz;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const tdx = _autoFaceTarget.x - px, tdz = _autoFaceTarget.z - pz;
        const tdist = Math.sqrt(tdx*tdx + tdz*tdz);
        if (tdist < dist) return; // closer attacker keeps the lock
    }
    _autoFaceTarget = {
        x: monBase.position.x,
        z: monBase.position.z,
        until: performance.now() + 2000,    // 2s window — covers spell travel
        force,                              // mark so we don't get pre-empted
    };
}

// ── 2-foot "force field" collision ───────────────────────────────────────
// Stops monster models from clipping into walls, each other, or the player.
// Numbers tuned so the existing AI (chase / flee / wander / fetch) still
// closes to melee range, but no two bodies share the same volume any more.
const MON_WALL_BUFFER    = 0.40; // worldunits — ~1.3 ft from wall face
const MON_MIN_SEP        = 0.80; // worldunits — center-to-center between any two monsters
const MON_PLAYER_MIN_SEP = 0.85; // worldunits — monster cannot stand inside the player
const _MMS_SQ  = MON_MIN_SEP * MON_MIN_SEP;
const _MPMS_SQ = MON_PLAYER_MIN_SEP * MON_PLAYER_MIN_SEP;

function _canMonsterStand(nx, nz, selfWrapper){
    if (!canWalk(nx, nz)) return false;
    const gx = Math.round(nx/GRID), gz = Math.round(nz/GRID);
    // Shoji door gate: don't step into a door tile until the panel has
    // slid open enough to clear a monster's silhouette. The panel reaches
    // openT ≈ 0.4 within 2 frames at the fast open speed (dt*22), so this
    // only delays entry by a frame or two — just enough for visual clarity.
    if (typeof shojiDoorPanels !== 'undefined' && map[gx]?.[gz]?.type === 'shoji_door'){
        const _dp = shojiDoorPanels.find(p => p.cx === gx && p.cz === gz && !p.broken);
        if (_dp && (_dp.openT ?? 0) < 0.38) return false;
    }
    const HALF = GRID / 2;
    // 1) Wall buffer — push back from each adjacent wall face.
    if (map[gx+1]?.[gz]?.type === 'wall' && nx > (gx+1)*GRID - HALF - MON_WALL_BUFFER) return false;
    if (map[gx-1]?.[gz]?.type === 'wall' && nx < (gx-1)*GRID + HALF + MON_WALL_BUFFER) return false;
    if (map[gx]?.[gz+1]?.type === 'wall' && nz > (gz+1)*GRID - HALF - MON_WALL_BUFFER) return false;
    if (map[gx]?.[gz-1]?.type === 'wall' && nz < (gz-1)*GRID + HALF + MON_WALL_BUFFER) return false;
    // 2) Monster-monster separation.
    for (const w of monsterWrappers){
        if (w === selfWrapper) continue;
        if (w.userData.isDead) continue;
        const dx = w.position.x - nx, dz = w.position.z - nz;
        if (dx*dx + dz*dz < _MMS_SQ) return false;
    }
    // 3) Don't stand on top of the player.
    const pdx = px - nx, pdz = pz - nz;
    if (pdx*pdx + pdz*pdz < _MPMS_SQ) return false;
    return true;
}
// Politeness helper — if a stepped position is blocked specifically by a
// fleeing monster, return that monster's wrapper. Lets a hostile chaser
// detect "my fleeing peer is in the way" and back up to a wider tile so
// the fleer can pass through, instead of jamming forever in the corridor.
function _findBlockingFleer(nx, nz, selfWrapper){
    for (const w of monsterWrappers){
        if (w === selfWrapper) continue;
        if (w.userData.isDead) continue;
        if (w.userData.aiState !== 'flee') continue;
        const dx = w.position.x - nx, dz = w.position.z - nz;
        if (dx*dx + dz*dz < _MMS_SQ) return w;
    }
    return null;
}

// Player-side: same idea, only blocks the player from walking INTO a
// monster's space (walls already handled by canWalk + the camera WALL_PUSH).
function _canPlayerStand(nx, nz){
    if (!canWalk(nx, nz)) return false;
    for (const w of monsterWrappers){
        if (w.userData.isDead) continue;
        const dx = w.position.x - nx, dz = w.position.z - nz;
        if (dx*dx + dz*dz < _MPMS_SQ) return false;
    }
    return true;
}

// Click anywhere on the fullscreen map to auto-walk there via A*. Yellow

// Reusable yellow textures — built once.
let _footstepTex = null, _footstepXTex = null;
function _ensureFootstepTextures(){
    if (_footstepTex && _footstepXTex) return;
    const make = (isX) => {
        const c = document.createElement('canvas'); c.width = 64; c.height = 64;
        const g = c.getContext('2d');
        g.clearRect(0,0,64,64);
        g.lineCap = 'round'; g.lineJoin = 'round';
        g.shadowColor = 'rgba(255,220,90,0.85)';

            g.strokeStyle = 'rgba(255,220,90,1.0)';
            g.lineWidth = 10;
            g.beginPath();
            g.moveTo(14, 14); g.lineTo(50, 50);
            g.moveTo(50, 14); g.lineTo(14, 50);
            g.stroke();
        } else {
            // Simple shoe-print: oval pad + heel dot
            g.fillStyle = 'rgba(255,220,90,0.95)';
            g.beginPath(); g.ellipse(32, 26, 13, 18, 0, 0, Math.PI*2); g.fill();
            g.beginPath(); g.ellipse(32, 52, 6, 6, 0, 0, Math.PI*2); g.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
        return t;
    };
    _footstepTex  = make(false);
    _footstepXTex = make(true);
}

function _stopClickPath(reason){
    if (!_clickPath.active && _clickPath.decals.length === 0) return;
    _clickPath.active = false;
    for (const d of _clickPath.decals){
        worldGroup.remove(d);
        d.material?.dispose();
        d.geometry?.dispose();
    }
    _clickPath.decals.length = 0;
    _clickPath.path = [];
    _clickPath.idx = 0;
    if (reason && reason !== 'arrived'){
        window.parent.postMessage({type:'LOG_EVENT', logType:'system',
            text: `⏹ Click-to-move halted — ${reason}.`}, '*');
    }
}

function _buildClickPathDecals(path){
    _ensureFootstepTextures();
    // Drop a footprint at every waypoint after the start. Last cell gets the X.
    for (let i = 1; i < path.length; i++){
        const [gx, gz] = path[i];
        const isLast = (i === path.length - 1);
        const tex = isLast ? _footstepXTex : _footstepTex;
        const mat = new THREE.MeshBasicMaterial({
            map: tex, transparent: true, opacity: 0.62,
            depthWrite: false, side: THREE.DoubleSide,
        });
        const planeSize = isLast ? GRID * 0.65 : GRID * 0.42;
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(planeSize, planeSize), mat);
        mesh.rotation.x = -Math.PI/2;
        // Face the next-tile direction so footprints point along the path.
        if (!isLast && i + 1 < path.length){
            const [nx, nz] = path[i+1];
            const dxg = nx - gx, dzg = nz - gz;
            // The default plane has +Y (becomes -Z after rotation.x=-PI/2) as
            // the footprint's "forward". Convert (dxg, dzg) to yaw.
            mesh.rotation.z = -Math.atan2(dxg, -dzg);
        }
        mesh.position.set(gx*GRID, 0.07, gz*GRID);
        mesh.userData.baseOpacity = isLast ? 0.78 : 0.62;
        worldGroup.add(mesh);
        _clickPath.decals.push(mesh);
    }
}

function _startClickToMove(gx, gz){
    const sgx = Math.round(px/GRID), sgz = Math.round(pz/GRID);
    if (sgx === gx && sgz === gz) return;
    const path = _monAStar(sgx, sgz, gx, gz);
    if (!path || path.length < 2){
        window.parent.postMessage({type:'LOG_EVENT', logType:'system',
            text:'⚠ No clear path to that tile.'}, '*');
        return;
    }
    _stopClickPath();           // clear any previous decals
    _clickPath.path = path;
    _clickPath.idx = 1;          // skip the start cell
    _clickPath.active = true;
    _buildClickPathDecals(path);
    window.parent.postMessage({type:'LOG_EVENT', logType:'system',
        text:`👣 Walking ${path.length - 1} steps to destination.`}, '*');
}

function _tickClickPath(dt){
    if (!_clickPath.active) return;
    // Cancel on user interaction OR monster in view.
    if (autoWalkInterrupt){ _stopClickPath('user interaction'); autoWalkInterrupt = false; return; }
    if (_lastCombatVisible){ _stopClickPath('enemy in view'); return; }

    // Advance waypoint(s) we're close to.
    while (_clickPath.idx < _clickPath.path.length){
        const [gx, gz] = _clickPath.path[_clickPath.idx];
        const dxw = gx*GRID - px, dzw = gz*GRID - pz;
        if ((dxw*dxw + dzw*dzw) < (GRID * 0.35) * (GRID * 0.35)){
            _clickPath.idx++;
            continue;
        }
        break;
    }
    if (_clickPath.idx >= _clickPath.path.length){
        _stopClickPath('arrived');
        return;
    }

    // Steer + step toward the current waypoint.
    const [tgx, tgz] = _clickPath.path[_clickPath.idx];
    const tx = tgx * GRID, tz = tgz * GRID;
    const dxw = tx - px, dzw = tz - pz;
    // Compass-bearing yaw to target: rot=0 → -Z, so use atan2(x, -z).
    const wantRot = Math.atan2(dxw, -dzw);
    let diff = wantRot - rot;
    while (diff >  Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    rot += diff * Math.min(1, dt * 7);   // smooth turn

    // Only step forward once roughly aligned (avoids drifting sideways
    // around tight corners).
    const aligned = Math.cos(diff) > 0.55;
    if (aligned){
        const yaw = rot;
        const step = AUTO_SPD * dt;
        const sdx =  Math.sin(yaw) * step;
        const sdz = -Math.cos(yaw) * step;
        const nx = px + sdx, nz = pz + sdz;
        if (_canPlayerStand(nx, nz)){ px = nx; pz = nz; isMoving = true; _pipOnPlayerStep(); }
        else if (_canPlayerStand(nx, pz)){ px = nx; isMoving = true; }
        else if (_canPlayerStand(px, nz)){ pz = nz; isMoving = true; }
        // If completely blocked (e.g., a monster slid into the path), bail
        // out — the player can re-click after combat resolves.
        else { _stopClickPath('path blocked'); return; }
    }

    // Fade each decal as the player nears/passes it.
    for (const d of _clickPath.decals){
        if (!d || !d.material) continue;
        const ddx = d.position.x - px, ddz = d.position.z - pz;
        const dist = Math.hypot(ddx, ddz);
        // Full opacity past 1 tile out → linear ramp to 0 by 0.4 tile out.
        const fade = Math.max(0, Math.min(1, (dist - GRID*0.40) / (GRID*0.85)));
        d.material.opacity = d.userData.baseOpacity * fade;
        if (fade <= 0.01) d.visible = false;
    }
}

// layers and are never touched. Subtle tilt-shift / miniature feel: short

    // perceptible in a dim FPV dungeon. Flip to true in DevTools to compare

    bokehPass.enabled = false;

// Ghostbuster ethereal shader — OPAQUE bluegreen spirit body with Fresnel
// rim glow. Face/body stays solid; rim edges glow cyan-mint.
// Build an unlit holo material — MeshBasicMaterial ignores scene lights, so
// torch flicker / moonlight / fog can't shift the monster's color. We keep
// the spectral bluegreen palette and the translucent body, just without
// any lighting / reflection / specular response.
function makeHoloMaterial(opaque=false){
    return new THREE.MeshBasicMaterial({
        color: 0x6df0c8,
        transparent: !opaque,
        opacity: opaque ? 1.0 : 0.55,
        depthWrite: opaque,
        side: THREE.DoubleSide,
        skinning: true,
        fog: false,                  // fog can't darken the ghost body either
    });
}
// Back-compat shim: a few call sites still pass the old material in. Strip
// every property that would let scene lighting change the rendered color so
// even if the material isn't replaced, it visually stops reacting.
function applyHoloLayer(mat){
    // Hologram shader is disabled — monsters keep their native textures but
    // are rendered at 30% opacity so they read as translucent presences,
    // not full-bodied props. No greenish tint, no Fresnel rim, no wisps.
    mat.transparent = true;
    mat.opacity     = 0.30;
    mat.depthWrite  = false;
    mat.side        = THREE.DoubleSide;
    mat.fog = true;
}
// Eye material — bright reflective white headlights. High emissive + bloom halo.

// ── Studio-quality ectoplasmic apparition shader ───────────────────────────
// Single fragment-shader injection on the body's MeshStandardMaterial that
// reproduces the Ghostbusters / Genshin / Hades phantom look in one pass:
//
//   1.  WIDE SOFT HALO — Fresnel pow 1.6 → cool-white wash around the body
//       that diffuses the silhouette so it doesn't read as a sharp cutout.
//   2.  CRISP EDGE RIM — Fresnel pow 5.5 → bright pure-white highlight that
//       lives only on the extreme grazing angle. This sells the volumetric
//       "energy boundary".
//   3.  BREATH PULSE — sin(uTime · 1.2) ± 10% on the rim brightness so the
//       phantom feels alive instead of statically tinted.
//   4.  INTERNAL WISPS — drifting low-frequency noise (3 orthogonal sines
//       on worldPos + time) modulates the rim emissive across the body
//       surface. Reads as ectoplasmic flow under the "skin".
//   5.  DEPTH-AWARE INNER FOG — back-facing fragments (gl_FrontFacing) get
//       a touch extra cool tint so when the body is rendered DoubleSide the
//       interior layers blend toward a volumetric core.
//
// All driven by a single shared uniform object (`_ghostTimeUniform`) so the
// loop only writes ONE value/frame and every goblin animates in sync.
// Idempotent: `_ghostRimApplied` guards against double-injection on shared
// GLB materials. Zero additional render passes.
// Single thin bright-WHITE silhouette rim per user spec — wide halo dropped.
// Wisp tint stays cool cyan so the internal flow reads through the body
// against the blue-green base color set on the material.
const _GHOST_RIM_HALO  = new THREE.Color(0xffffff); // unused now (kept to avoid breaking refs)
const _GHOST_RIM_EDGE  = new THREE.Color(0x7ae0cc); // saturated teal rim (was pure white — caused white-out)
const _GHOST_WISP_TINT = new THREE.Color(0x6cc6e8);
const _ghostTimeUniform = { value: 0 }; // updated once per frame in loop()
// ── Unified ghost-phantom shader injection ─────────────────────────────────
// Single onBeforeCompile that does BOTH the Fresnel rim AND the unlit hack
// AND samples the diffuse map into the emissive path. Critical perf detail:
//   • `customProgramCacheKey` returns a constant — so Three.js compiles the
//     shader ONCE and every goblin reuses the same WebGLProgram. Without
//     this, every material was compiling its own program (5-15s stall on
//     floor load with 20-30 monsters).
//   • All animated values come through shared uniforms (one write/frame),
//     not per-material recompiles.
//   • We sample `map` directly inside the shader to drive emissive — no
//     `emissiveMap = mat.map` reassignment, which would force a recompile.
// One function `_applyGhostShader` replaces the prior _applyGhostRim +
// _applyUnlit pair (kept as aliases below for any stragglers).
function _applyGhostShader(mat){
    // Hologram disabled per user request — keep only the 30% transparency
    // (applied via applyHoloLayer). No fresnel rim, no wisps, no shader
    // injection. Early-return so any pre-existing call sites still work.
    if (!mat) return;
    mat.transparent = true;
    mat.opacity     = 0.30;
    mat.depthWrite  = false;
    return;
    /* eslint-disable no-unreachable */
    if (!mat || mat._ghostShaderApplied) return;
    mat._ghostShaderApplied = true;
    mat.onBeforeCompile = function(shader){
        shader.uniforms.uTime    = _ghostTimeUniform;
        shader.uniforms.rimEdge  = { value: _GHOST_RIM_EDGE };
        shader.uniforms.wispTint = { value: _GHOST_WISP_TINT };
        shader.vertexShader = shader.vertexShader
            .replace('#include <common>',
                `#include <common>
                varying vec3 vGhostNormalW;
                varying vec3 vGhostWorldPos;`)
            .replace('#include <fog_vertex>',
                `#include <fog_vertex>
                vGhostNormalW  = normalize(mat3(modelMatrix) * objectNormal);
                vGhostWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
        shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>',
                `#include <common>
                uniform float uTime;
                uniform vec3  rimEdge;
                uniform vec3  wispTint;
                varying vec3  vGhostNormalW;
                varying vec3  vGhostWorldPos;`)
            // Add diffuse texture sample → emissive (preserves origami detail
            // in the unlit shader) plus the Fresnel rim + drifting wisps.
            .replace('#include <emissivemap_fragment>',
                `#include <emissivemap_fragment>
                #ifdef USE_MAP
                  // The emissive uniform is already pre-multiplied by
                  // emissiveIntensity on the JS side in Three.js r128, so do
                  // not multiply by emissiveIntensity here (no such uniform
                  // is exposed; referring to it errors at shader compile).
                  vec4 _gDiffSample = texture2D(map, vUv);
                  totalEmissiveRadiance += _gDiffSample.rgb * emissive;
                #endif
                vec3  _gV     = normalize(cameraPosition - vGhostWorldPos);
                float _gDot   = max(dot(normalize(vGhostNormalW), _gV), 0.0);
                float _gFres  = 1.0 - _gDot;
                float _gEdge  = pow(_gFres, 6.5);
                float _gBreath = 1.0 + sin(uTime * 1.2) * 0.10;
                float _gWisp = sin(vGhostWorldPos.x * 3.7 + uTime * 0.9)
                             * sin(vGhostWorldPos.y * 4.3 - uTime * 0.7)
                             * sin(vGhostWorldPos.z * 3.1 + uTime * 1.1);
                _gWisp = (_gWisp * 0.5 + 0.5) * _gFres;
                totalEmissiveRadiance += rimEdge  * _gEdge * 0.50 * _gBreath;
                totalEmissiveRadiance += wispTint * _gWisp * 0.08;
                if (!gl_FrontFacing){
                    totalEmissiveRadiance += wispTint * 0.06;
                }`)
            // Kill every scene-light bounce off the body surface. Only
            // emissive (which includes our texture + rim) reaches output.
            .replace('#include <lights_fragment_end>',
                `#include <lights_fragment_end>
                reflectedLight.directDiffuse    = vec3(0.0);
                reflectedLight.indirectDiffuse  = vec3(0.0);
                reflectedLight.directSpecular   = vec3(0.0);
                reflectedLight.indirectSpecular = vec3(0.0);`);
    };
    // ★ THE PERF FIX ★ — share the compiled WebGLProgram across every monster
    // material. Without this, each material with onBeforeCompile compiles its
    // own unique program (a 100-500ms GPU stall each). Returning a constant
    // string tells Three.js: "all materials that produce this key share one
    // compiled shader." 20 goblins now = 1 compile, not 20.
    mat.customProgramCacheKey = function(){ return 'origami-ghost-shader-v1'; };
    mat.needsUpdate = true;
}
// Back-compat aliases for any leftover call sites.
const _applyGhostRim = _applyGhostShader;
const _applyUnlit    = function(){ /* merged into _applyGhostShader */ };

function scaleToHeight(obj,targetH){
    obj.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(obj);
    const h=Math.max(1e-6,box.max.y-box.min.y);
    obj.scale.multiplyScalar(targetH/h); obj.updateMatrixWorld(true);
}

// Kill mipmaps on every texture inside a GLTF scene — prevents Firefox
// "lazy initialization" warnings on model textures
function _killGltfMipmaps(root){
    root.traverse(child=>{
        if(!child.isMesh) return;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m=>{
            if(!m) return;
            ['map','normalMap','roughnessMap','metalnessMap','emissiveMap','aoMap','bumpMap','alphaMap'].forEach(k=>{
                const t = m[k];
                if(t && t.generateMipmaps !== false){
                    t.generateMipmaps = false;
                    t.minFilter = THREE.LinearFilter;
                    t.needsUpdate = true;
                }
            });
        });
    });
}

function buildMonsterEntity(sp, goblin, animations){
    const wrapper=new THREE.Group();
    wrapper.add(goblin);

    if(animations && animations.length>0){
        const mixer=new THREE.AnimationMixer(goblin);
        mixers.push(mixer);
        wrapper.userData.mixer=mixer;
        // Log available clips ONCE per session — all goblins share the same
        // GLB so re-logging per spawn produces 30+ identical lines.
        if (!window._monsterAnimsLogged) {
            window._monsterAnimsLogged = true;
            console.log('[Monster anims]', animations.map((a,i)=>i+':'+a.name+'('+a.duration?.toFixed(2)+'s)'));
        }
        const _f=(rx)=>animations.find(a=>rx.test(a.name.toLowerCase()));
        // Try semantic names first; fall back to duration heuristic for NlaTrack-named exports.
        // Duration rules tuned per typical character GLBs:
        //   • walk  cycle:  0.5 – 1.6 s (looped foot fall)
        //   • slash / atk:  0.4 – 1.4 s (one swing)
        //   • idle loop:    2.0 – 6.0 s
        //   • death/fall:   longest clip
        // Imps were inheriting the goblin heuristic that picked
        // "shortest = walk", but the imp GLB ships a sub-0.4s hit-react
        // shorter than its real walk cycle. New heuristic skips clips
        // under 0.4s and over 2.5s when looking for walk.
        const _byDuration = ()=>{
            const sorted = [...animations].sort((a,b)=>a.duration-b.duration);
            const walkBand = sorted.find(c => c.duration >= 0.4 && c.duration <= 2.5);
            const idle     = sorted.find(c => c.duration >= 2.0 && c.duration <= 6.0)
                          || sorted[1] || sorted[0];
            const slash    = sorted.find(c => c.duration >= 0.4 && c.duration < 2.5 && c !== walkBand)
                          || sorted[2] || sorted[0];
            return {
                walk:  walkBand || sorted[0],
                idle,
                slash,
                death: sorted[sorted.length-1],
            };
        };
        const _dur = animations.length > 0 ? _byDuration() : {};
        const idleClip =_f(/idle/)                                      || _dur.idle  || animations[1] || animations[0];
        const walkClip =_f(/walk|run|move|trot|jog/)                     || _dur.walk  || animations[2] || animations[0];
        const slashClip=_f(/slash|attack|strike|swing|punch|stab/)       || _dur.slash || animations[3] || animations[2] || animations[0];
        // Death: try broad name patterns first, then duration heuristic (longest clip)
        const deathClip=_f(/death|die|dying|fall|fallen|ko|defeat|hit_react|stagger|knocked/)
                       || _dur.death
                       || animations[animations.length-1]
                       || animations[4] || animations[0];
        wrapper.userData.idleAction  = mixer.clipAction(idleClip);
        wrapper.userData.walkAction  = mixer.clipAction(walkClip);
        wrapper.userData.attackAction= mixer.clipAction(slashClip);
        wrapper.userData.slashAction = wrapper.userData.attackAction;
        wrapper.userData.bowAction   = mixer.clipAction(deathClip);
        wrapper.userData.deathClipDur= deathClip.duration; // expose duration for lie timer
        wrapper.userData._animKey=null;
        const ia=wrapper.userData.idleAction;
        if(ia){ia.reset();ia.setLoop(THREE.LoopRepeat);ia.play();}
        wrapper.userData._animKey='idle';
    }

    // ── Spooky matte goblin material ──
    // The GLB ships with PBR materials whose default metalness/roughness
    // let torch + hit-bloom lights pop bright cyan-teal highlights on the
    // forehead/horns (close-up reference: goblin looked washed out under
    // the silhouette pass). We force the material flat:
    //   • metalness   = 0.0  (no metal sheen — purely diffuse response)
    //   • roughness   = 1.0  (fully scattered light, zero specular lobe)
    //   • envMapInten = 0.0  (don't sample any scene cube/env map)
    //   • a small dark emissive floor keeps them visible in pitch black
    //     without needing bright direct light → they STAY spooky-dark
    //     even after the player's torch passes over them.
    // Also preserve the sRGB flag on the colour texture for proper gamma.
    goblin.traverse(child => {
        if (!child.isMesh || !child.material) return;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        for (const mat of mats){
            if (mat.map){
                if ('colorSpace' in mat.map)      mat.map.colorSpace = THREE.SRGBColorSpace;
                else if ('encoding' in mat.map)   mat.map.encoding   = THREE.sRGBEncoding;
                mat.map.needsUpdate = true;
            }
            if ('metalness' in mat)        mat.metalness        = 0.0;
            if ('roughness' in mat)        mat.roughness        = 1.0;
            if ('envMapIntensity' in mat)  mat.envMapIntensity  = 0.0;
            // Clear-coat / sheen / specular-IoR knobs on MeshPhysicalMaterial
            // — drop them so bright lights don't bounce a glossy lobe off
            // the goblin's forehead / horns / shoulder ridges.
            if ('clearcoat' in mat)        mat.clearcoat        = 0.0;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
            if ('sheen' in mat)            mat.sheen            = 0.0;
            if ('specularIntensity' in mat) mat.specularIntensity = 0.0;
            // ── Flashlight whitewash cap ──
            // The headlamp's spotlights are >3× as bright as the sun light.
            // When the player aims them at a monster, PBR direct diffuse
            // pushes the lit colour toward white. Inject a clamp at the end
            // of the standard lighting fragment so the TOTAL direct
            // contribution can never exceed a moderate level — keeps the
            // monster reading as a flat hologram regardless of beam angle.
            if (!mat._flashClampApplied){
                mat._flashClampApplied = true;
                // Per-mesh head-Y threshold from bind-pose bbox so the body /
                // head transparency split is animation-stable.
                let headYStr = '999999.0';
                if (child.geometry){
                    if (!child.geometry.boundingBox) child.geometry.computeBoundingBox();
                    const bb = child.geometry.boundingBox;
                    if (bb){
                        const headY = bb.min.y + (bb.max.y - bb.min.y) * 0.72;
                        headYStr = headY.toFixed(4);
                    }
                }
                // Per-frame mutable rim uniforms — locked target swings to red.
                mat.userData = mat.userData || {};
                mat.userData.monShaderRef = null;
                const _prevOBC = mat.onBeforeCompile;
                mat.onBeforeCompile = (shader) => {
                    if (typeof _prevOBC === 'function') _prevOBC(shader);
                    shader.uniforms.uRimColor    = { value: new THREE.Color(0.25, 0.85, 1.00) };
                    shader.uniforms.uRimStrength = { value: 1.10 };
                    mat.userData.monShaderRef = shader;
                    // ── VERTEX ── bind-pose local pos + view-space normal/pos
                    shader.vertexShader = shader.vertexShader
                        .replace('#include <common>',
                            `#include <common>
                             varying float vMonsterLocalY;
                             varying vec3  vMonsterLocalP;
                             varying vec3  vMonsterVNormal;
                             varying vec3  vMonsterVPos;`)
                        .replace('#include <begin_vertex>',
                            `#include <begin_vertex>
                             vMonsterLocalY = position.y;
                             vMonsterLocalP = position;`)
                        .replace('#include <project_vertex>',
                            `#include <project_vertex>
                             vMonsterVNormal = normalize(normalMatrix * objectNormal);
                             vMonsterVPos    = -mvPosition.xyz;`);
                    // ── FRAGMENT ──
                    shader.fragmentShader = shader.fragmentShader
                        .replace('#include <common>',
                            `#include <common>
                             varying float vMonsterLocalY;
                             varying vec3  vMonsterLocalP;
                             varying vec3  vMonsterVNormal;
                             varying vec3  vMonsterVPos;
                             uniform vec3  uRimColor;
                             uniform float uRimStrength;
                             float _monHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
                             float _monNoise(vec2 p){
                                 vec2 i = floor(p); vec2 f = fract(p);
                                 f = f*f*(3.0 - 2.0*f);
                                 float a = _monHash(i);
                                 float b = _monHash(i + vec2(1.0,0.0));
                                 float c = _monHash(i + vec2(0.0,1.0));
                                 float d = _monHash(i + vec2(1.0,1.0));
                                 return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
                             }`)
                        // Reflected-light cap — hard limit on every reflective
                        // contribution so torch + lantern + hit-bloom lights
                        // can't pile up into a total-whitewash blowout. Direct
                        // diffuse capped low; specular + indirect specular
                        // killed entirely; indirect diffuse capped so ambient
                        // bounce doesn't add up either.
                        .replace('#include <lights_fragment_end>',
                            `#include <lights_fragment_end>
                             reflectedLight.directDiffuse    = min(reflectedLight.directDiffuse,   vec3(0.20));
                             reflectedLight.indirectDiffuse  = min(reflectedLight.indirectDiffuse, vec3(0.30));
                             reflectedLight.directSpecular   = vec3(0.0);
                             reflectedLight.indirectSpecular = vec3(0.0);`)
                        // Body alpha split + paper grain + ivory tint + fresnel
                        // rim haze — exact restoration of the bright-white
                        // reference state the user asked us to revert to.
                        .replace('#include <dithering_fragment>',
                            `#include <dithering_fragment>
                             // (1) Body 30% transparent, head solid
                             if (vMonsterLocalY < ${headYStr}) {
                                 gl_FragColor.a *= 0.70;
                             }
                             // (2) Origami paper grain — 3-octave FBM + crease lines
                             // anchored in bind-pose local space.
                             vec2 _puv = vec2(vMonsterLocalP.x + vMonsterLocalP.z * 0.5,
                                              vMonsterLocalP.y);
                             float _n0 = _monNoise(_puv *  3.0);
                             float _n1 = _monNoise(_puv *  9.5);
                             float _n2 = _monNoise(_puv * 28.0);
                             float _fbm = _n0 * 0.55 + _n1 * 0.30 + _n2 * 0.15;
                             float _c1 = smoothstep(0.46, 0.48, _n0) * (1.0 - smoothstep(0.50, 0.52, _n0));
                             float _c2 = smoothstep(0.43, 0.45, _n1) * (1.0 - smoothstep(0.47, 0.49, _n1));
                             float _creases = clamp(_c1 + _c2 * 0.65, 0.0, 1.0);
                             float _grain = 0.62 + _fbm * 0.56 - _creases * 0.32;
                             gl_FragColor.rgb *= _grain;
                             // (3) Subtle ivory tint — paper has a faint warm pulp
                             // cast vs sterile screen-white.
                             gl_FragColor.rgb *= vec3(1.00, 0.97, 0.93);
                             // (4) Fresnel rim haze — soft bloom hugging the
                             // silhouette edges. Cyan by default; locked target
                             // swings the rim to RED via uniform mutation below.
                             vec3 _vNorm = normalize(vMonsterVNormal);
                             vec3 _vDir  = normalize(vMonsterVPos);
                             float _fres = 1.0 - clamp(dot(_vNorm, _vDir), 0.0, 1.0);
                             _fres = pow(_fres, 1.8);
                             gl_FragColor.rgb += uRimColor * (_fres * uRimStrength);`);
                };
                mat.needsUpdate = true;
            }
            // Origami emissive baseline — bright-white reference look, but
            // emissive intensity dialled down to 0.45 (was 0.70) so the
            // combined "emissive + capped reflected light" doesn't crank
            // back into total-whitewash territory. Body still reads as the
            // crisp white-paper feel from the reference shot; flashlight
            // crossings no longer push it into blowout.
            mat.transparent = true;
            mat.opacity     = 1.00;
            mat.depthWrite  = true;
            if (mat.emissive){
                mat.emissive.setRGB(1.0, 1.0, 1.0);
                if ('emissiveIntensity' in mat) mat.emissiveIntensity = 0.45;
            }
            mat.needsUpdate = true;
        }
    });

    // Monster height bumped 15% per user spec — 1.53 → 1.76 (≈ 5'9")
    scaleToHeight(goblin, 1.76);
    goblin.updateMatrixWorld(true);
    const bbox=new THREE.Box3().setFromObject(goblin);
    if(bbox.min.y!==0) goblin.position.y-=bbox.min.y;
    goblin.rotation.y=-Math.PI/2;

    // Desynchronize animations slightly so monsters don't move in perfect sync.
    // Randomize mixer time offset and slightly vary action playback speeds.
    if (wrapper.userData && wrapper.userData.mixer) {
        try {
            const mixer = wrapper.userData.mixer;
            // Random time offset within the first second
            if (typeof mixer.setTime === 'function') mixer.setTime(Math.random() * 1.0);
            else mixer.time = (Math.random() * 1.0);
            // Jitter action speeds between 0.92 and 1.08
            ['idleAction','walkAction','attackAction','slashAction','bowAction'].forEach(k => {
                const act = wrapper.userData[k];
                if (act && typeof act.setEffectiveTimeScale === 'function') {
                    const s = 0.92 + Math.random() * 0.16;
                    act.setEffectiveTimeScale(s);
                } else if (act && act.timeScale !== undefined) {
                    const s = 0.92 + Math.random() * 0.16;
                    act.timeScale = s;
                }
            });
        } catch (err) { console.warn('Desync anim failed', err); }
    }

    // Floor marker base — flat platform token, shared geo+mat for perf
    const monBase=new THREE.Group();
    const baseCore  = new THREE.Mesh(_pedCoreGeo,   _pedCoreMat);
    const discCap   = new THREE.Mesh(_pedCapGeo,    _pedCapMat);
    const borderMat = new THREE.MeshBasicMaterial({color:0xffffff}); // per-instance for aggro recolor
    const borderMesh= new THREE.Mesh(_pedBorderGeo, borderMat);
    const arrowMesh = new THREE.Mesh(_pedArrowGeo,  _pedArrowMat);
    discCap.position.y  = PED_H*0.5;
    baseCore.position.y = PED_H/2 + 0.005;
    borderMesh.rotation.x = -Math.PI/2;
    borderMesh.position.y = PED_H;
    arrowMesh.rotation.x  = -Math.PI/2;
    arrowMesh.position.set(0, PED_H + 0.012, 0);
    monBase.add(baseCore, discCap, borderMesh, arrowMesh);
    [baseCore, discCap, borderMesh, arrowMesh].forEach(m=>{
        m.layers.enable(0); m.layers.enable(1); m.layers.enable(3);
    });
    wrapper.userData.pedestalBorder = borderMesh; // expose for aggro recolor

    // ── Per-monster personality ───────────────────────────────────────────
    // Each monster rolls its own traits so the room doesn't feel like one
    // hive-mind. Brave goblins hold ground longer; loud / social ones run
    // for help sooner and at higher HP. Used by the flee, fetch, and
    // hearing-radius logic below.
    const _personality = {
        bravery:     Math.random(),
        aggression:  Math.random(),
        sociability: Math.random(),
        loudness:    Math.random(),
    };
    // Derived thresholds — keep flee/fetch behaviour sensible while letting
    // each monster pick its own line in the sand.
    _personality.fleeHpFrac    = 0.25 + (1 - _personality.bravery)    * 0.50; // 0.25-0.75
    _personality.fetchHpFrac   = 0.30 +       _personality.sociability * 0.40; // 0.30-0.70
    _personality.fetchCooldown = 22   -       _personality.sociability * 14;   // 8-22 s
    _personality.alertRadius   = 6    +       _personality.loudness    * 8;    // 6-14 tiles
    // Pick a flavor label for log messages.
    _personality.archetype =
        _personality.bravery     > 0.75 ? 'Brute'   :
        _personality.bravery     < 0.25 ? 'Coward'  :
        _personality.sociability > 0.70 ? 'Rallier' :
        _personality.aggression  > 0.70 ? 'Hunter'  :
        _personality.loudness    > 0.70 ? 'Crier'   :
                                          'Scout';

    // Resolve the monster's display name through i18n if a nameKey was set
    // (MapGen tags every spawn with one). Falls through to literal name or
    // a sensible default if i18n.js isn't loaded.
    const _resolvedName = (sp.nameKey && typeof tMonster === 'function')
        ? tMonster(sp.nameKey)
        : (sp.name || 'Yakuza Goblin');
    wrapper.userData={
        id:sp.id, name:_resolvedName, nameKey:sp.nameKey, type:'enemy', hp:sp.hp||50, maxHp:sp.maxHp||50,
        isHostile:sp.isHostile!==false, cx:sp.x, cz:sp.z,
        vulnerability: sp.vulnerability || null,
        isBoss: !!sp.isBoss,
        isSupervisor: !!sp.isSupervisor,
        isImp: !!sp.isImp,
        hasFlintlock: !!sp.hasFlintlock,
        personality: _personality,
        // ── Per-monster brain ──
        // Tracks what this goblin has observed: where the player was, how
        // hurt the player looked, how many peers it watched fall, which
        // rooms it's been to. Updated by tickMonsterBrain; reported to
        // Oni-Baba via MONSTER_INTEL every few seconds (live), and as a
        // final MONSTER_SPIRIT_REPORT on death (the monster's "spirit"
        // returning to the queen on level 7 to debrief).
        brain: {
            spawnedAt:        performance.now() / 1000,
            firstSeenPlayer:  null,    // {x,z,t} of first sighting
            lastSeenPlayer:   null,    // {x,z,t,hp,maxHp} of latest
            playerSightings:  0,
            lastPlayerHpSeen: null,
            peersWitnessedDead: 0,
            roomsVisited:     {},      // {[roomId]: true}
            damageTaken:      0,
            attacksObserved:  0,
            lastReportT:      0,
        },
        ...(wrapper.userData)
    };

    // Throne boss: 2.2× scale + golden disc tint to make her presence felt.
    // Scale applies to the wrapper so animations + collision baseline scale too.
    if(sp.isBoss){
        wrapper.scale.setScalar(2.2);
        monBase.scale.setScalar(2.2);
        if(borderMat) borderMat.color.setHex(0xff3322);
    }
    // Yakuza Level Supervisor — 1.3× the regular goblin, gold pedestal ring
    // so the player sees instantly who the boss-lite is.
    else if (sp.isSupervisor){
        wrapper.scale.setScalar(1.3);
        monBase.scale.setScalar(1.3);
        if(borderMat) borderMat.color.setHex(0xffc83a);
    }
    // Imp henchmen — slightly smaller than a goblin (model itself is smaller
    // but a uniform shrink helps them read as "lesser" enemies).
    else if (sp.isImp){
        wrapper.scale.setScalar(0.85);
        monBase.scale.setScalar(0.85);
        if(borderMat) borderMat.color.setHex(0x8a6fff);
    }

    monBase.position.set(sp.x*GRID,0,sp.z*GRID);
    worldGroup.add(monBase); wrapper.userData.monBase=monBase;

    wrapper.position.set(sp.x*GRID,0,sp.z*GRID);
    worldGroup.add(wrapper);
    monsterWrappers.push(wrapper);

    // ── Save-load restore ──
    // If we booted from a Load with a per-monster snapshot, apply it now.
    // Killed monsters are immediately hidden + flagged so they stay dead;
    // wounded monsters keep their saved HP.
    if (_savedMonsterStates && _savedMonsterStates[sp.id]){
        const saved = _savedMonsterStates[sp.id];
        if (typeof saved.hp === 'number') wrapper.userData.hp = Math.max(0, saved.hp);
        if (saved.dead){
            wrapper.userData.isDead = true;
            wrapper.userData.hp = 0;
            wrapper.visible = false;
            if (monBase) monBase.visible = false;
        }
    }
}

// ── Player Avatar (Layer 3 — Map View) ────────────────────────────────────────
const playerAvatar=new THREE.Group(); playerAvatar.layers.set(3);

// Base ring
const pBaseGeo=new THREE.CylinderGeometry(0.75,0.85,0.016,16);
const pBaseMat=new THREE.MeshBasicMaterial({color:0x050505});
const pBaseMesh=new THREE.Mesh(pBaseGeo,pBaseMat); pBaseMesh.position.y=0.008; pBaseMesh.layers.set(3);
const pBorderMesh=new THREE.Mesh(new THREE.TorusGeometry(0.85,0.016,6,24),new THREE.MeshBasicMaterial({color:0xffffff}));
pBorderMesh.rotation.x=-Math.PI/2; pBorderMesh.position.y=0.008; pBorderMesh.layers.set(3);
// Flat white arrow indicator (triangle on the player's pedestal disc)
const _pArrowShape = new THREE.Shape();
_pArrowShape.moveTo(0, -0.38);
_pArrowShape.lineTo(-0.26, -0.04);
_pArrowShape.lineTo(-0.10, -0.04);
_pArrowShape.lineTo(-0.10,  0.20);
_pArrowShape.lineTo( 0.10,  0.20);
_pArrowShape.lineTo( 0.10, -0.04);
_pArrowShape.lineTo( 0.26, -0.04);
_pArrowShape.closePath();
const pNoseMesh = new THREE.Mesh(
    new THREE.ShapeGeometry(_pArrowShape),
    new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide})
);
pNoseMesh.rotation.x = -Math.PI/2;
pNoseMesh.rotation.z = Math.PI; // arrow tip points +Z = south in local space; avatar faces +Z so arrow aligns
pNoseMesh.position.set(0, 0.085, 0);
pNoseMesh.layers.set(3);
const pBaseGroup=new THREE.Group(); pBaseGroup.add(pBaseMesh,pBorderMesh,pNoseMesh);
const avatarLight=new THREE.PointLight(0xffffff,2.5,6.0,1.0); avatarLight.layers.set(3); avatarLight.position.set(0,4,0);
playerAvatar.add(pBaseGroup,avatarLight);
playerAvatar.scale.set(2.0, 2.0, 2.0); // 2× larger in PiP top-down view

let playerMixer=null, playerIdleAction=null, playerWalkAction=null, playerAttackAction=null;
const playerModelUrls=[
    './assets/models/Player.A.Walking.glb',
    '../assets/models/Player.A.Walking.glb',
    'https://www.markpeterson.info/Origami/assets/Player.A.Walking.glb',
];
const tryLoadPlayer=(idx)=>{
    if(idx>=playerModelUrls.length) return;
    gltfLoader.load(playerModelUrls[idx],gltf=>{
        _killGltfMipmaps(gltf.scene);
        const avatarMesh=gltf.scene;
        avatarMesh.scale.set(0.55,0.55,0.55); avatarMesh.position.y+=0.02; avatarMesh.rotation.y=Math.PI;
        avatarMesh.traverse(child=>{
            child.layers.set(3);
            if(child.isMesh&&child.material){
                child.material=child.material.clone();
                child.material.emissive=new THREE.Color(0x888888); child.material.emissiveIntensity=2.0;
                child.castShadow=true; child.receiveShadow=true;
            }
        });
        playerAvatar.add(avatarMesh);
        if(gltf.animations&&gltf.animations.length>0){
            playerMixer=new THREE.AnimationMixer(avatarMesh);
            mixers.push(playerMixer);
            const lc = (c) => (c.name||'').toLowerCase();
            console.log('[Player anims]', gltf.animations.map((a,i)=>i+':'+a.name+'('+a.duration?.toFixed(2)+'s)'));

            // Semantic name match first, then duration heuristic.
            // Walk loops are short (~0.6-1.5s); idle loops are longer (~2-5s);
            // attack clips sit in between with a single big motion.
            const sorted   = [...gltf.animations].sort((a,b)=>a.duration-b.duration);
            const idleClip = gltf.animations.find(c => /idle|stand|rest/.test(lc(c)))
                          || sorted.find(c => c.duration > 1.8)
                          || gltf.animations[0];
            const walkClip = gltf.animations.find(c => /walk|run|move|locomotion/.test(lc(c)))
                          || sorted.find(c => c.duration <= 1.6 && c !== idleClip)
                          || gltf.animations[1]
                          || idleClip;
            const attackClip = gltf.animations.find(c => /attack|slash|strike|swing|punch|stab/.test(lc(c)));

            playerIdleAction = idleClip ? playerMixer.clipAction(idleClip) : null;
            playerWalkAction = playerMixer.clipAction(walkClip);
            // If walk and idle resolved to the same clip (single-anim GLB),
            // speed up the walk action so movement still reads visually.
            if (walkClip === idleClip) playerWalkAction.timeScale = 2.2;
            playerAttackAction = attackClip ? playerMixer.clipAction(attackClip) : null;
            if(playerAttackAction){
                playerAttackAction.setLoop(THREE.LoopOnce, 1);
                playerAttackAction.clampWhenFinished = false;
            }
            // Both clips need weights so crossfade works regardless of which
            // direction we transition first.
            if(playerIdleAction){ playerIdleAction.setLoop(THREE.LoopRepeat, Infinity); playerIdleAction.play(); }
            playerWalkAction.setLoop(THREE.LoopRepeat, Infinity);
            playerWalkAction.weight = 0;
            playerWalkAction.play();
            playerMixer._current = 'idle';
        }
    },undefined,()=>tryLoadPlayer(idx+1));
};
