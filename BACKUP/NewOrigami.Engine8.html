    // Initial velocity — a random direction at full _GALE_SPEED. The vortex
    // bounces off walls and busts through doors, so a fixed-direction launch
    // works better than a destination-and-step model.
    const initAng = Math.random() * Math.PI * 2;

    // Captives Map<wrapper, captiveData>. Initial target seeded only if it
    // survived the burst and wasn't resisted — a dead initial target lets
    // the vortex still spawn and roam, picking up nearby goblins as it goes.
    const captives = new Map();
    if (initialAlive && !initialResisted){
        const now = performance.now();
        captives.set(target, {
            capturedAt: now,
            dropAt:     now + initialCaptiveDur * 1000,
            orbitPhase: Math.random() * Math.PI * 2,
            orbitRadius:0.55 + Math.random() * 0.30,
            orbitVy:    0.20 + Math.random() * 0.20, // vertical bob amplitude
            spinRate:   12 + Math.random() * 8,      // body spin rad/sec
            // Per-captive tumble axis — random tilt that the body spins
            // around, on top of its Y-spin. Reads as "tossed by wind".
            tumbleAxis: new THREE.Vector3(
                Math.random()-0.5, 0, Math.random()-0.5
            ).normalize(),
            tumbleRate: (Math.random()<0.5?-1:1) * (3 + Math.random()*3),
            tumblePhase: 0,
            // Smooth rise: track elapsed seconds since capture so we can
            // lerp from floor → upper-column height (~1.6 wu).
            riseT0:     performance.now() * 0.001,
            lastDmgAt:  0,
            baseY:      target.userData.baseY ?? 0,
        });
    }

    _activeVortexes.push({
        group: vortexGroup, light: vLight,
        cloudSheet, cloudMat, topCapMesh, capMat,
        streamlines, streaks, convStreaks, dustRing, floorPuffs, eye,
        x: impactPos.x, z: impactPos.z,
        vx: Math.cos(initAng) * _GALE_SPEED,
        vz: Math.sin(initAng) * _GALE_SPEED,
        timeLeft: STUN_DUR, totalTime: STUN_DUR,
        repathTimer: _GALE_REPATH_EVERY,
        tickTimer: tickEvery,
        burstDmg: burst,
        captives,
        recentlyHit: new Map(),
        playerHitCd: 0,
        _doorsBust: new Set(),
    });

    const _galeName = ud.name || 'the target';
    const _tF = (typeof window.tLog === 'function') ? window.tLog : null;
    const initMsg = !initialAlive
        ? (_tF ? _tF('gale.no-target') : `🌪 GALE rises from the strike — roaring through the room!`)
        : initialResisted
            ? (_tF ? _tF('gale.shrug', { name: _galeName }) : `🌪 GALE rises but <b>${_galeName}</b> shrugs off the wind!`)
            : (_tF ? _tF('gale.lift',  { name: _galeName, turns, s: turns>1?'s':'' })
                   : `🌪 GALE lifts <b>${_galeName}</b> off the floor — twisting for ${turns} turn${turns>1?'s':''}!`);
    window.parent.postMessage({type:'LOG_EVENT', logType:'combat', text: initMsg}, '*');
}

function tickVortexes(dt){
    const nowMs = performance.now();
    const nowS  = nowMs * 0.001;
    for (let i = _activeVortexes.length - 1; i >= 0; i--){
        const v = _activeVortexes[i];
        v.timeLeft   -= dt;
        v.repathTimer -= dt;
        v.tickTimer   -= dt;
        v.playerHitCd = Math.max(0, v.playerHitCd - dt);

        // ── Motion: velocity-based with wall bounce + door bust ──
        // Periodically pick a fresh random heading at full _GALE_SPEED so the
        // tornado wanders erratically even when it doesn't hit anything.
        if (v.repathTimer <= 0){
            const ang = Math.random() * Math.PI * 2;
            v.vx = Math.cos(ang) * _GALE_SPEED;
            v.vz = Math.sin(ang) * _GALE_SPEED;
            v.repathTimer = _GALE_REPATH_EVERY;
        }

        // Test next position; resolve walls + doors per-axis so a glancing
        // hit only flips the blocked component.
        const tryX = v.x + v.vx * dt;
        const tryZ = v.z + v.vz * dt;
        // Door bust check — any tile we're about to enter that's an unbroken
        // shoji_door gets shattered open (boulder uses the same helper).
        const _tryBustDoor = (gx, gz) => {
            const cell = map[gx]?.[gz];
            if (!cell || cell.type !== 'shoji_door') return false;
            const key = `${gx},${gz}`;
            if (v._doorsBust.has(key)) return false;
            const panel = (typeof shojiDoorPanels !== 'undefined')
                ? shojiDoorPanels.find(p => p.cx === gx && p.cz === gz && !p.broken)
                : null;
            if (!panel) return false;
            _breakShojiPanel(panel);
            addCameraTrauma(0.32);
            v._doorsBust.add(key);
            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                text: (typeof window.tLog === 'function')
                    ? window.tLog('gale.shoji-bust')
                    : '🚪💨 GALE busts through the shoji — keeps roaring forward!'}, '*');
            return true;
        };
        // Per-axis wall sample. Use round-to-tile so the test matches the
        // map grid that canWalk consults.
        const gxNext = Math.round(tryX / GRID), gzNext = Math.round(tryZ / GRID);
        // Try bust BEFORE the wall test so a busted door becomes walkable
        _tryBustDoor(gxNext, gzNext);
        const cellX = map[gxNext]?.[Math.round(v.z / GRID)];
        const cellZ = map[Math.round(v.x / GRID)]?.[gzNext];
        const blockedX = cellX && cellX.type === 'wall';
        const blockedZ = cellZ && cellZ.type === 'wall';
        // Bounce: mirror the blocked component AND add ±0.6 rad random
        // angular jitter so the tornado doesn't just retrace the same line.
        if (blockedX || blockedZ){
            if (blockedX) v.vx *= -1;
            if (blockedZ) v.vz *= -1;
            const jitter = (Math.random() - 0.5) * 1.2;  // ±~35°
            const c = Math.cos(jitter), s = Math.sin(jitter);
            const rvx = v.vx * c - v.vz * s;
            const rvz = v.vx * s + v.vz * c;
            // Keep speed constant — bounces don't drain energy
            const m = Math.hypot(rvx, rvz) || 1;
            v.vx = rvx / m * _GALE_SPEED;
            v.vz = rvz / m * _GALE_SPEED;
            addCameraTrauma(0.10);
        }
        if (!blockedX) v.x = tryX;
        if (!blockedZ) v.z = tryZ;

        // ── Drive visuals ──
        v.group.position.set(v.x, 0, v.z);

        // Cloud-shader uniforms — drive the FBM-noise scroll on the body
        // and the top exhaust cap. uTime is in seconds relative to spawn.
        const shaderT = nowS - v.group.userData.bornAt;
        if (v.cloudMat) v.cloudMat.uniforms.uTime.value = shaderT;
        if (v.capMat)   v.capMat.uniforms.uTime.value   = shaderT;
        // Whole-group slow rotation adds layered swirl (the shader does
        // the heavy lifting; this is just subtle drift).
        v.group.rotation.y += dt * _GALE_SPIN_RPS * 0.12;

        // Helical streamlines — counter-rotate around y at per-tube rates so
        // the visible spiral structure looks like coherent rotating airflow,
        // not parallel wires. The cloud body still occludes/dominates these.
        const radiusAt = v.group.userData.radiusAt
            || (ty => 0.28 + Math.pow(ty, 1.25) * 1.02);
        if (v.streamlines){
            for (const t of v.streamlines) t.rotation.y += t.userData.spinRate * dt;
        }

        // Motion-aligned streak cylinders — advance phase + height, recycle
        // from top → bottom, and orient each cylinder's long axis along the
        // helical tangent at its position (the local air-velocity vector).
        if (v.streaks){
            for (const m of v.streaks){
                const ud = m.userData;
                ud.phase += ud.spin * dt;
                ud.y     += ud.vy * dt;
                if (ud.y > _GALE_HEIGHT){
                    ud.y = -0.05 - Math.random() * 0.10;
                    ud.phase = Math.random() * Math.PI * 2;
                    ud.rJit  = 0.92 + Math.random() * 0.22;
                }
                const ty = Math.max(0, ud.y) / _GALE_HEIGHT;
                const r  = radiusAt(ty) * ud.rJit;
                const cx = Math.cos(ud.phase), sx = Math.sin(ud.phase);
                m.position.x = cx * r;
                m.position.z = sx * r;
                m.position.y = ud.y;
                // Helical tangent: d/dt of (r·cosφ, vy·t, r·sinφ) is
                // (-r·sinφ·dφ, vy, r·cosφ·dφ). Magnitudes don't matter —
                // we only need the direction.
                const tx = -sx * r * ud.spin;
                const tz =  cx * r * ud.spin;
                const ty2 = ud.vy;
                // Orient cylinder's +Y to point along (tx, ty2, tz)
                const len = Math.hypot(tx, ty2, tz) || 1;
                _galeTmpVec.set(tx/len, ty2/len, tz/len);
                m.quaternion.setFromUnitVectors(_galeUp, _galeTmpVec);
                // Fade in at base, hold, fade at top
                let op;
                if (ty < 0.08)      op = ty / 0.08;
                else if (ty > 0.85) op = (1.0 - ty) / 0.15;
                else                op = 1.0;
                m.material.opacity = 0.85 * Math.max(0, op);
            }
        }

        // Boundary-layer convergence — radial bars at the base counter-
        // rotate slowly, suggesting air converging into the low-pressure
        // core (inflow region of the vortex).
        if (v.convStreaks){
            for (const bar of v.convStreaks){
                bar.userData.phase += dt * 1.6;
                const a = bar.userData.phase, r = bar.userData.r;
                bar.position.x = Math.cos(a) * r * 0.55;
                bar.position.z = Math.sin(a) * r * 0.55;
                // Long axis (z) points inward toward center
                bar.rotation.y = Math.atan2(-bar.position.x, -bar.position.z);
                bar.material.opacity = 0.45 + Math.sin(nowMs * 0.009 + a) * 0.18;
            }
        }

        // Floor dust ring — pulse + counter-rotate
        if (v.dustRing){
            v.dustRing.rotation.z -= dt * 1.4;
            const pulse = 1.0 + Math.sin(nowMs * 0.008) * 0.09;
            v.dustRing.scale.set(pulse, pulse, pulse);
            v.dustRing.material.opacity = 0.50 + Math.sin(nowMs * 0.011) * 0.16;
        }
        // Floor kick-up puffs — oblate (flatten via scale.y) so they read as
        // dust plumes, not balls. Lift + drift outward, then recycle.
        if (v.floorPuffs){
            for (const p of v.floorPuffs){
                const ud = p.userData;
                ud.age += dt;
                if (ud.age >= ud.life){
                    ud.age  = 0;
                    ud.life = 0.70 + Math.random() * 0.40;
                    ud.ang  = Math.random() * Math.PI * 2;
                    ud.r0   = 0.28 + Math.random() * 0.15;
                    ud.vr   = 0.55 + Math.random() * 0.40;
                    ud.vy   = 0.18 + Math.random() * 0.22;
                }
                const lt = ud.age / ud.life;
                const r  = ud.r0 + ud.vr * ud.age;
                p.position.x = Math.cos(ud.ang) * r;
                p.position.z = Math.sin(ud.ang) * r;
                p.position.y = 0.08 + ud.vy * ud.age;
                p.material.opacity = 0.55 * (1.0 - lt);
                const grow = 0.7 + lt * 0.9;
                p.scale.set(grow, grow * 0.32, grow); // OBLATE — flattened dust plume
            }
        }
        // Eye column flicker
        if (v.eye){
            v.eye.material.opacity = 0.13 + Math.sin(nowMs * 0.018) * 0.05;
        }
        v.light.position.set(v.x, 1.0, v.z);
        v.light.intensity = 1.6 + Math.sin(nowMs * 0.012) * 0.6;

        // ── Capture sweep ──
        // Any monster in the same tile as the vortex center that isn't already
        // a captive gets a resistance roll; if it fails, they're caught for
        // the rest of the vortex's life (capped at 10s). Initial target was
        // seeded into v.captives in _spawnGaleVortex.
        if (typeof monsterWrappers !== 'undefined'){
            // Catch radius matches the visible vortex funnel a bit better
            // (was strictly 1 tile — easy to skim past). 1.4 tiles ≈ the
            // outer streamline radius and reads as "in the column."
            const captureR = GRID * 1.4;
            const cr2      = captureR * captureR;
            // Minimum hold for any captive — spec is 2 FULL TURNS (5 s).
            const MIN_CAPTIVE_MS = 5000;
            for (const w of monsterWrappers){
                const md = w.userData;
                if (!md || md.isDead) continue;
                if (v.captives.has(w)) continue;
                const dx = w.position.x - v.x, dz = w.position.z - v.z;
                if (dx*dx + dz*dz > cr2) continue;
                // Spell-resistance roll for the new captive
                const wvuln = md.vulnerability?.WIND ?? 1.0;
                const rc    = Math.max(0, Math.min(0.70, (1.0 - wvuln) * 0.70));
                if (Math.random() < rc){
                    spawnDamageText('RESIST', w.position.clone(), false);
                    v.recentlyHit.set(w, 1.0);
                    continue;
                }
                // Capture for at LEAST MIN_CAPTIVE_MS, or longer if the
                // vortex still has more life left. If the captive's hold
                // exceeds the vortex's remaining life, EXTEND the vortex so
                // it lives until the captive is released (no early drop).
                const remainingMs = Math.max(0, v.timeLeft) * 1000;
                const dur = Math.max(MIN_CAPTIVE_MS, remainingMs);
                if (dur > remainingMs){
                    v.timeLeft  = Math.max(v.timeLeft, dur / 1000);
                    v.totalTime = Math.max(v.totalTime, v.timeLeft);
                }
                v.captives.set(w, {
                    capturedAt: nowMs,
                    dropAt:     nowMs + dur,
                    orbitPhase: Math.random() * Math.PI * 2,
                    orbitRadius:0.50 + Math.random() * 0.35,
                    orbitVy:    0.20 + Math.random() * 0.20,
                    spinRate:   12 + Math.random() * 8,
                    tumbleAxis: new THREE.Vector3(
                        Math.random()-0.5, 0, Math.random()-0.5
                    ).normalize(),
                    tumbleRate: (Math.random()<0.5?-1:1) * (3 + Math.random()*3),
                    tumblePhase: 0,
                    riseT0:     nowS,
                    lastDmgAt:  0,
                    baseY:      md.baseY ?? 0,
                });
                md._stunTimer = Math.max(md._stunTimer || 0, dur / 1000);
                md._boulderStunned = true;
                md._stunStartTime = Date.now();
                const _swpSec = Math.round(dur/1000);
                const _swpName = md.name || 'a goblin';
                const _swpTxt = (typeof window.tLog === 'function')
                    ? window.tLog('gale.sweep', { name: _swpName, sec: _swpSec })
                    : `🌪 GALE sweeps up <b>${_swpName}</b> — twisting for ${_swpSec}s!`;
                window.parent.postMessage({type:'LOG_EVENT', logType:'combat', text:_swpTxt}, '*');
            }
            // Decay touch-cooldowns
            for (const [w, cd] of v.recentlyHit){
                const left = cd - dt;
                if (left <= 0) v.recentlyHit.delete(w);
                else v.recentlyHit.set(w, left);
            }
        }

        // ── Captive orbit + lift + tumble + DoT ──
        // Captives ride the vortex: lifted off the floor into the upper part
        // of the funnel, orbited helically, tumbled along a random axis, and
        // hit by DoT every 0.6s. Released on expiry, death, or vortex end.
        // Lift target: monsters float around 60-75% of the vortex's visible
        // height so they're clearly "picked up" inside the column, not
        // standing on the floor next to it.
        const LIFT_PEAK = _GALE_HEIGHT * 0.62;   // ≈ 1.74 wu — mid-upper column
        const RISE_DUR  = 0.45;                  // seconds to ease from floor → peak
        for (const [w, cap] of v.captives){
            if (!w.userData || w.userData.isDead || nowMs >= cap.dropAt){
                // Release — clear stun flag, restore baseY, drop to floor,
                // and zero out tumble so the monster doesn't sit tilted.
                if (w.userData){
                    w.userData._boulderStunned = false;
                    if (cap.baseY !== undefined) w.userData.baseY = cap.baseY;
                }
                w.position.y = cap.baseY ?? 0;
                w.rotation.x = 0;
                w.rotation.z = 0;
                v.captives.delete(w);
                continue;
            }
            cap.orbitPhase  += cap.spinRate * 0.25 * dt + 2.5 * dt; // orbit speed
            cap.tumblePhase += cap.tumbleRate * dt;
            const r = cap.orbitRadius;
            w.position.x = v.x + Math.cos(cap.orbitPhase) * r;
            w.position.z = v.z + Math.sin(cap.orbitPhase) * r;
            // Smooth rise from the floor to the peak height over RISE_DUR
            // seconds (smoothstep), then a small vertical bob so they aren't
            // pinned at a fixed altitude.
            const tSince = Math.max(0, nowS - (cap.riseT0 ?? nowS));
            const rt = Math.min(1, tSince / RISE_DUR);
            const ease = rt * rt * (3 - 2 * rt);
            const lift = LIFT_PEAK * ease
                       + Math.sin(nowS * 3.5 + cap.orbitPhase) * cap.orbitVy;
            w.position.y = lift;
            if (w.userData) w.userData.baseY = lift;
            // Body Y-spin (face whips around) + tumble around a random
            // horizontal axis (pitch/roll so they look CHURNED by the wind).
            w.rotation.y += cap.spinRate * dt;
            const tAng = cap.tumblePhase;
            const ax = cap.tumbleAxis;
            // Apply tumble as a tilt on x/z weighted by the axis direction.
            // sin gives a smooth back-and-forth wobble rather than a runaway
            // accumulation — captives roll forward, back, sideways.
            const tilt = Math.sin(tAng) * 0.9; // ~±50°
            w.rotation.x = ax.z * tilt;
            w.rotation.z = -ax.x * tilt;
            if (w.userData && w.userData.monBase) w.userData.monBase.rotation.y = w.rotation.y;
            // Keep them pinned in stun state every frame so the AI never
            // briefly grabs control between DoT ticks (0.6s vs 0.5s stun
            // refresh left a 0.1s window where they could walk).
            w.userData._boulderStunned = true;
            w.userData._stunTimer = Math.max(w.userData._stunTimer || 0, 0.5);
            // DoT every 0.6s. Damage DECAYS linearly across the capture so
            // captives survive ~30% longer than a flat DoT — gives the
            // player more time to enjoy the visual + chain other spells.
            // Decay curve: tickMul(t) = 1.0 - 0.40 * (t/totalDur). Starts
            // at 1.0× base, ends at 0.6×, average 0.80× → 30%+ extra life.
            // Multiplier bumped to 0.45 since the on-impact burst is now
            // much lighter — the twirl carries the kill instead of the hit.
            if (nowMs - cap.lastDmgAt > 600){
                cap.lastDmgAt = nowMs;
                const totalDur = Math.max(1, cap.dropAt - cap.capturedAt);
                const aliveFrac = Math.min(1, Math.max(0, (nowMs - cap.capturedAt) / totalDur));
                const tickMul   = 1.0 - 0.40 * aliveFrac;
                const tick = Math.max(2, Math.round(v.burstDmg * 0.45 * tickMul));
                _applyMonsterDamage(w, tick, 'WIND');
                w.userData._stunTimer = Math.max(w.userData._stunTimer || 0, 0.5);
            }
        }

        // ── Player damage + shove + WIND SPIN (player is not captured) ──
        const pdx = (typeof px !== 'undefined' ? px : 0) - v.x;
        const pdz = (typeof pz !== 'undefined' ? pz : 0) - v.z;
        const pd  = Math.hypot(pdx, pdz);
        if (pd <= _GALE_RADIUS && v.playerHitCd <= 0 && typeof _applyPlayerDamage === 'function'){
            const pdmg = Math.max(3, Math.round(v.burstDmg * 0.30));
            _applyPlayerDamage(pdmg, 'GALE vortex');
            const shove = 1.1;
            const dir = pd > 0.001 ? { x: pdx/pd, z: pdz/pd } : { x: 1, z: 0 };
            const sx = px + dir.x * shove;
            const sz = pz + dir.z * shove;
            if (typeof _canPlayerStand === 'function' && _canPlayerStand(sx, sz)){
                px = sx; pz = sz;
            }
            v.playerHitCd = _GALE_HIT_CD_PLAYER;
            // Force-spin the player for 1-2 "turns" (2-4s). Direction is the
            // vortex's own swirl direction (CW from above ≈ +rate). Re-hits
            // refresh the timer + speed so a sustained vortex keeps you spun.
            const spinTurns = 1 + Math.floor(Math.random() * 2); // 1 or 2
            const spinDur   = 2.0 + spinTurns * 1.2;             // 3.2-4.4s
            const dirSign   = (Math.random() < 0.5 ? -1 : 1);
            _windSpinRate    = dirSign * (4.8 + Math.random() * 1.6); // ~280-370°/s
            _windSpinUntilT  = performance.now() + spinDur * 1000;
            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                text: (typeof window.tLog === 'function')
                    ? window.tLog('gale.player-spin', { n: spinTurns, s: spinTurns>1?'s':'' })
                    : `🌪 The GALE catches you — spinning for ${spinTurns} turn${spinTurns>1?'s':''}!`}, '*');
        }

        // ── Expiry ──
        if (v.timeLeft <= 0){
            // Drop all remaining captives gently, level them out so they
            // don't land sideways (the tumble was just a visual wrapper tilt).
            for (const [w, cap] of v.captives){
                if (w.userData){
                    w.userData._boulderStunned = false;
                    if (cap.baseY !== undefined) w.userData.baseY = cap.baseY;
                }
                w.position.y = cap?.baseY ?? 0;
                w.rotation.x = 0;
                w.rotation.z = 0;
            }
            v.captives.clear();
            // Lingering dust ring where the vortex died — residue of the
            // disturbance settles on the floor for ~5s.
            _spawnFloorDecal({ x: v.x, z: v.z }, 'dust', { rOuter: 1.40, rInner: 0.30, life: 5.0 });
            v.group.traverse(c => {
                if(c.geometry) c.geometry.dispose();
                if(c.material) c.material.dispose();
            });
            scene.remove(v.group);
            scene.remove(v.light);
            _activeVortexes.splice(i, 1);
        }
    }
}

function _addFireballFlames(target){
    // Clear any prior flame cluster (re-hit before previous ones expired).
    if (target.userData.fireballFlames){
        for (const f of target.userData.fireballFlames){
            if (f.m && f.m.parent) f.m.parent.remove(f.m);
            if (f.m && f.m.geometry) f.m.geometry.dispose();
            if (f.m && f.m.material) f.m.material.dispose();
        }
        target.userData.fireballFlames = null;
    }

    // Measure the monster so flames sit on its head + shoulders regardless
    // of model scale (boss is 2.2× regular). target is the wrapper Group.
    const bbox = new THREE.Box3().setFromObject(target);
    const heightLocal = (bbox.max.y - bbox.min.y) || 1.7;
    const headY     = heightLocal * 0.92;
    const shoulderY = heightLocal * 0.74;
    const shoulderX = heightLocal * 0.18;

    // Three anchor points: head (top), left shoulder, right shoulder.
    const anchors = [
        { x:           0, y: headY,     n: 5 },
        { x: -shoulderX, y: shoulderY,  n: 4 },
        { x:  shoulderX, y: shoulderY,  n: 4 },
    ];

    const flames = [];
    for (const a of anchors){
        for (let i = 0; i < a.n; i++){
            const c = (i % 3 === 0) ? 0xfff2a0
                    : (i % 3 === 1) ? 0xff7a18
                                    : 0xff2200;
            const m = new THREE.Mesh(
                new THREE.TetrahedronGeometry(0.10 + Math.random() * 0.06, 0),
                new THREE.MeshBasicMaterial({
                    color: c, transparent: true, opacity: 0.9,
                    blending: THREE.AdditiveBlending, depthWrite: false,
                }),
            );
            // Cluster around the anchor with small offsets.
            const ang = (i / a.n) * Math.PI * 2 + Math.random() * 0.6;
            const r   = 0.08 + Math.random() * 0.08;
            m.position.set(
                a.x + Math.cos(ang) * r,
                a.y + Math.random() * 0.08,
                Math.sin(ang) * r,
            );
            target.add(m);
            flames.push({
                m,
                baseY: m.position.y,
                spd:  3 + Math.random() * 5,
                off:  Math.random() * Math.PI * 2,
                rs:  (Math.random() - 0.5) * 4,
            });
        }
    }
    // 1-3 second flame burst — per user spec. Stored on userData so the
    // tickMonsterAI animator (see fireballFlames branch) can swirl them.
    target.userData.fireballFlames = flames;
    const lifeMs = 1000 + Math.random() * 2000;
    setTimeout(() => {
        if (target.userData.fireballFlames !== flames) return; // overridden
        for (const f of flames){
            if (f.m && f.m.parent) f.m.parent.remove(f.m);
            if (f.m && f.m.geometry) f.m.geometry.dispose();
            if (f.m && f.m.material) f.m.material.dispose();
        }
        target.userData.fireballFlames = null;
    }, lifeMs);
}

// ── Flame sprite texture ── teardrop shape with multi-stop fire gradient,
// used by both the fireball projectile petals and the impact embers.
const _FB_FLAME_TEX = (() => {
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    g.clearRect(0, 0, 128, 128);
    // Teardrop body — bezier outline, vertical fire-gradient fill.
    const grd = g.createLinearGradient(64, 128, 64, 4);
    grd.addColorStop(0.00, 'rgba(120,30,0,0.00)');
    grd.addColorStop(0.10, 'rgba(220,40,0,0.55)');
    grd.addColorStop(0.30, 'rgba(255,90,20,0.90)');
    grd.addColorStop(0.55, 'rgba(255,180,40,1.00)');
    grd.addColorStop(0.80, 'rgba(255,230,150,0.85)');
    grd.addColorStop(1.00, 'rgba(255,255,210,0.00)');
    g.beginPath();
    g.moveTo(64, 124);
    g.bezierCurveTo(112, 100,  98, 48, 64,  6);
    g.bezierCurveTo(30,  48, 16, 100, 64, 124);
    g.closePath();
    g.fillStyle = grd; g.fill();
    // Bright inner core
    const cgrd = g.createRadialGradient(64, 86, 2, 64, 86, 38);
    cgrd.addColorStop(0.00, 'rgba(255,250,210,0.95)');
    cgrd.addColorStop(0.40, 'rgba(255,200,80,0.55)');
    cgrd.addColorStop(1.00, 'rgba(255,200,80,0.00)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = cgrd; g.fillRect(0, 0, 128, 128);
    g.globalCompositeOperation = 'source-over';
    const t = new THREE.CanvasTexture(c);
    t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
    return t;
})();

// ── Disney-3D-style FIREBALL projectile ──────────────────────────────────
// White-hot core + soft aura + outer halo, surrounded by 7 billboarded
// flame petals that always face the camera and a tall vertical lick on
// top. Animation hook drives waveform-based scale + opacity flicker so
// the fire looks alive even at high travel speed.
function _buildFireballProjectile(){
    const group = new THREE.Group();

    const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 18, 14),
        new THREE.MeshBasicMaterial({
            color: 0xfff8d0, transparent: true, opacity: 0.95,
            blending: THREE.AdditiveBlending, depthWrite: false,
        }),
    );
    group.add(core);
    const aura = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 18, 14),
        new THREE.MeshBasicMaterial({
            color: 0xff8a20, transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false,
        }),
    );
    group.add(aura);
    const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.38, 18, 14),
        new THREE.MeshBasicMaterial({
            color: 0xff3010, transparent: true, opacity: 0.25,
            blending: THREE.AdditiveBlending, depthWrite: false,
        }),
    );
    group.add(halo);

    // Billboarded flame petals — 7 orbit around the core
    const flames = [];
    const PETALS = 7;
    for (let i = 0; i < PETALS; i++){
        const m = new THREE.Mesh(
            new THREE.PlaneGeometry(0.80, 0.80),
            new THREE.MeshBasicMaterial({
                map: _FB_FLAME_TEX,
                color: (i % 2) ? 0xffd060 : 0xff7028,
                transparent: true, opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false, side: THREE.DoubleSide,
            }),
        );
        const ang = (i / PETALS) * Math.PI * 2;
        const r   = 0.20 + Math.random() * 0.08;
        m.position.set(Math.cos(ang) * r, Math.sin(ang) * r * 0.35 - 0.05, 0);
        group.add(m);
        flames.push({
            m, baseR: r, ang,
            spd:   2.0 + Math.random() * 2.4,
            phase: Math.random() * Math.PI * 2,
            sizeJ: 0.85 + Math.random() * 0.30,
        });
    }
    // Tall vertical "lick" on top — bigger flame that pulls upward
    const tongue = new THREE.Mesh(
        new THREE.PlaneGeometry(0.58, 1.00),
        new THREE.MeshBasicMaterial({
            map: _FB_FLAME_TEX, color: 0xffe080,
            transparent: true, opacity: 0.90,
            blending: THREE.AdditiveBlending,
            depthWrite: false, side: THREE.DoubleSide,
        }),
    );
    tongue.position.set(0, 0.35, 0);
    group.add(tongue);

    group.userData.core   = core;
    group.userData.aura   = aura;
    group.userData.halo   = halo;
    group.userData.flames = flames;
    group.userData.tongue = tongue;
    const _camLocal = new THREE.Vector3();
    const _worldPos = new THREE.Vector3();
    group.userData.animUpdate = (t) => {
        // Core / aura / halo subtle breath
        core.scale.setScalar(1 + Math.sin(t * 18) * 0.10);
        aura.scale.setScalar(1 + Math.sin(t * 12 + 1) * 0.08);
        halo.scale.setScalar(1 + Math.sin(t *  8 + 2) * 0.06);

        // Compute camera position in group's local space for billboarding.
        // (lookAt with a world target re-orients the child correctly even
        // when the parent is rotating.)
        group.getWorldPosition(_worldPos);
        for (const f of flames){
            const a = f.ang + t * f.spd * 0.45;
            const r = f.baseR * (0.85 + Math.sin(t * f.spd * 1.2 + f.ang) * 0.18);
            f.m.position.set(
                Math.cos(a) * r,
                Math.sin(a) * r * 0.40 - 0.05 + Math.sin(t * 7 + f.phase) * 0.04,
                Math.sin(t * f.spd + f.ang) * 0.04,
            );
            _camLocal.copy(camera.position).sub(_worldPos).add(f.m.position);
            f.m.lookAt(_camLocal);
            const sx = f.sizeJ * (0.85 + Math.sin(t * 6  + f.phase)     * 0.18);
            const sy = f.sizeJ * (1.00 + Math.sin(t * 9  + f.phase+1.2) * 0.14);
            f.m.scale.set(sx, sy, 1);
            f.m.material.opacity = 0.70 + Math.sin(t * 8 + f.phase) * 0.22;
        }
        // Vertical tongue — taller when the wave peaks
        tongue.position.y = 0.35 + Math.sin(t * 4) * 0.04;
        _camLocal.copy(camera.position).sub(_worldPos).add(tongue.position);
        tongue.lookAt(_camLocal);
        const ty = 1.00 + Math.sin(t * 9) * 0.22;
        tongue.scale.set(1.05 + Math.sin(t * 13) * 0.10, ty, 1);
        tongue.material.opacity = 0.80 + Math.sin(t * 12) * 0.16;
    };
    group.userData.icon  = core;
    group.userData.shell = halo;
    return group;
}

// Glare-streak trail. Each particle is a small additive plane that fades
// over `life` seconds. The spell holds an array of active particles and
// pushes new ones every ~25 ms while in flight; tickSpells advances + culls.
const _FB_TRAIL_TEX = (() => {
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0.00, 'rgba(255,250,210,1.0)');
    grd.addColorStop(0.30, 'rgba(255,170,40,0.85)');
    grd.addColorStop(0.65, 'rgba(220,40,0,0.40)');
    grd.addColorStop(1.00, 'rgba(60,0,0,0.0)');
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(c);
    t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
    return t;
})();

function _spawnFireballTrailPuff(pos){
    const mat = new THREE.MeshBasicMaterial({
        map: _FB_TRAIL_TEX, color: 0xffffff, transparent: true, opacity: 0.85,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    });
    const size = 0.55 + Math.random() * 0.25;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
    m.position.copy(pos);
    // Always face the camera (cheap billboarding).
    m.lookAt(camera.position);
    scene.add(m);
    return {
        mesh: m, life: 0.55,
        startLife: 0.55,
        vy: 0.25 + Math.random() * 0.4,         // gentle smoke-rise
        spin: (Math.random() - 0.5) * 1.6,
    };
}

function _tickFireballTrail(trail, dt){
    for (let i = trail.length - 1; i >= 0; i--){
        const t = trail[i];
        t.life -= dt;
        if (t.life <= 0){
            scene.remove(t.mesh);
            t.mesh.material.dispose();
            t.mesh.geometry.dispose();
            trail.splice(i, 1);
            continue;
        }
        const a = t.life / t.startLife;
        t.mesh.position.y += t.vy * dt;
        t.mesh.material.opacity = 0.85 * a;
        t.mesh.scale.setScalar(0.9 + (1 - a) * 1.6); // grow as it dissipates
        t.mesh.rotation.z += t.spin * dt;
        t.mesh.lookAt(camera.position);              // keep billboarded
    }
}

// ── Lens-flare fireball impact ────────────────────────────────────────────
// Central blown-out flare + horizontal anamorphic streak + two diagonal
// accent streaks + 3 expanding multi-color rings + ground spark shower
// with real gravity + rising embers. Reads as a punchy red/yellow Disney-
// style explosion instead of a flat point-light flash.
// ── STARBURST fireball impact ─────────────────────────────────────────────
// 12 radial flame spikes shoot outward from the impact (the "starburst"),
// 70+ shrapnel sparks fly off with real gravity + trails, a bright central
// bloom flashes, and any monster within 1 tile catches fire (chain DoT) and
// any intact shoji door within 1 tile is blown apart. Plays a loud BOOM
// via _playSpellSound('FIRE').
function _spawnFireballImpact(pos){
    const groundY = Math.max(0.1, pos.y - 0.2);
    const center  = pos.clone();

    // ── Audio: loud explosion ──
    _playSpellSound('FIRE', 1.0);

    // ── Camera punch ──
    addCameraTrauma(0.75);
    triggerHitStop(120);

    // ── Persistent residue: scorch mark on the floor + glowing ember light ──
    _spawnFloorDecal(center, 'scorch', { rOuter: 1.10, rInner: 0.05, life: 10 });

    // ── Burst light ──
    const burst = new THREE.PointLight(0xffba50, 70, 14, 2);
    burst.position.copy(center);
    scene.add(burst);

    // ── Central bloom (bright additive plane facing camera) ──
    const flareMat = new THREE.MeshBasicMaterial({
        map: _FB_FLARE_BURST_TEX, color: 0xffffff,
        transparent: true, opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false, side: THREE.DoubleSide,
    });
    const flare = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), flareMat);
    flare.position.copy(center);
    flare.lookAt(camera.position);
    scene.add(flare);

    // ── 12 starburst spikes ──
    // Each spike is an elongated flame plane (the existing _FB_FLAME_TEX
    // teardrop shape) that scales outward radially from the impact center.
    // Together they form a 12-pointed starburst that punches in then fades.
    const SPIKES = 12;
    const spikes = [];
    for (let i = 0; i < SPIKES; i++){
        const ang = (i / SPIKES) * Math.PI * 2;
        const tilt = (i % 2 === 0) ? 0 : 0.18; // alternate vertical tilt
        // Pivot group anchored at impact; scaling its child outward in +Y
        // makes the flame spike radiate from the center.
        const pivot = new THREE.Group();
        pivot.position.copy(center).setY(groundY + 0.55);
        pivot.rotation.y = ang;
        pivot.rotation.z = tilt * (Math.random() < 0.5 ? -1 : 1);
        const tip = new THREE.Mesh(
            new THREE.PlaneGeometry(0.55, 1.40),
            new THREE.MeshBasicMaterial({
                map: _FB_FLAME_TEX,
                color: (i % 3 === 0) ? 0xfff2a0 : (i % 3 === 1 ? 0xff7a18 : 0xff2a00),
                transparent: true, opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false, side: THREE.DoubleSide,
            }),
        );
        // Place spike so its bottom touches the pivot (radial from center).
        tip.position.set(0.7, 0, 0);     // along local +X
        tip.rotation.z = -Math.PI / 2;   // turn the teardrop tip OUTWARD
        pivot.add(tip);
        scene.add(pivot);
        spikes.push({ pivot, tip, scaleMax: 2.2 + Math.random() * 1.0 });
    }

    // ── 70 spark shrapnel particles ──
    // Sphere meshes with very high initial velocity, real gravity,
    // ground bounce, and a trail color that heat-shifts as they cool.
    const sparks = [];
    for (let k = 0; k < 70; k++){
        const startCol = (k % 4 === 0) ? 0xfff8d0
                       : (k % 4 === 1) ? 0xffc850
                       : (k % 4 === 2) ? 0xff7820 : 0xff2a00;
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(0.055, 6, 6),
            new THREE.MeshBasicMaterial({
                color: startCol, transparent: true, opacity: 0.98,
                blending: THREE.AdditiveBlending, depthWrite: false,
            }),
        );
        m.position.copy(center);
        scene.add(m);
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.random() * Math.PI * 0.65;
        const spd   = 5.5 + Math.random() * 6.0; // very fast shrapnel
        sparks.push({
            mesh: m, life: 0.7 + Math.random() * 0.6,
            startLife: 0.7,
            vx: Math.sin(phi) * Math.cos(theta) * spd,
            vy: Math.cos(phi) * spd + 1.8,
            vz: Math.sin(phi) * Math.sin(theta) * spd,
        });
    }

    // ── Rising embers (long-lived flame sprites that drift up + fade) ──
    const embers = [];
    for (let k = 0; k < 16; k++){
        const m = new THREE.Mesh(
            new THREE.PlaneGeometry(0.22, 0.22),
            new THREE.MeshBasicMaterial({
                map: _FB_FLAME_TEX, color: 0xffa830,
                transparent: true, opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false, side: THREE.DoubleSide,
            }),
        );
        m.position.copy(center).setY(groundY + 0.4 + Math.random() * 0.4);
        m.lookAt(camera.position);
        scene.add(m);
        embers.push({
            mesh: m, life: 1.4 + Math.random() * 0.9,
            startLife: 1.4,
            vx: (Math.random() - 0.5) * 0.7,
            vy: 0.55 + Math.random() * 0.6,
            vz: (Math.random() - 0.5) * 0.7,
        });
    }

    // ── Chain fire: any monster within 1 tile catches fire ──
    // Uses _applyFireDot so the existing DoT pipeline ticks naturally.
    {
        const R2 = (GRID * 1.05) * (GRID * 1.05);
        const chained = [];
        for (const w of monsterWrappers){
            const ud = w.userData;
            if (!ud || ud.isDead) continue;
            const dx = w.position.x - center.x;
            const dz = w.position.z - center.z;
            if (dx*dx + dz*dz <= R2){
                // Light them up — DoT + flame visualizer.
                if (typeof _applyFireDot === 'function')      _applyFireDot(w, 50);
                if (typeof _addFireballFlames === 'function') _addFireballFlames(w);
                chained.push(ud.name || 'Goblin');
            }
        }
        if (chained.length){
            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                text:`🔥 The fire jumps to ${chained.length} more — they're <b>burning</b>!`}, '*');
        }
    }

    // ── Door bust: any intact shoji panel within 1 tile is blown apart ──
    {
        const R2 = (GRID * 1.10) * (GRID * 1.10);
        for (const p of (typeof shojiDoorPanels !== 'undefined' ? shojiDoorPanels : [])){
            if (!p || p.broken || !p.mesh) continue;
            const dx = p.cx * GRID - center.x;
            const dz = p.cz * GRID - center.z;
            if (dx*dx + dz*dz <= R2){
                _breakShojiPanel(p);
                _spawnHitBurst(new THREE.Vector3(p.cx*GRID, 1.0, p.cz*GRID), 'FIRE');
            }
        }
    }

    // ── Drive everything from one rAF loop ──
    const t0 = performance.now();
    const TOTAL = 1.65;
    function frame(){
        const now = performance.now();
        const elapsed = (now - t0) / 1000;
        const dt = 0.016;

        // Burst light — sharp peak (~60 ms) then decay to 0 by 0.7 s.
        const lightT = Math.min(1, elapsed / 0.75);
        const flashShape = (lightT < 0.10) ? (lightT / 0.10) : (1 - (lightT - 0.10) / 0.90);
        burst.intensity = 70 * Math.max(0, flashShape);

        // Central bloom — punch + fade, billboarded to camera.
        const flareT = elapsed / 0.50;
        flare.scale.setScalar(1.0 + Math.min(1, flareT) * 1.4);
        flareMat.opacity = Math.max(0, 1 - flareT);
        flare.lookAt(camera.position);

        // Starburst spikes — scale outward (length stretches up the +X axis
        // of the pivot, making the spike radiate). Fast snap-out (~150 ms)
        // then linear fade.
        const stretchT = Math.min(1, elapsed / 0.18);
        const fadeT    = elapsed / 0.55;
        for (const sp of spikes){
            const sx = 0.4 + (sp.scaleMax - 0.4) * (stretchT * stretchT * (3 - 2 * stretchT)); // smoothstep
            sp.tip.scale.set(sx, 1.0 + 0.4 * stretchT, 1);
            sp.tip.material.opacity = Math.max(0, 0.95 * (1 - fadeT * 0.95));
        }

        // Sparks — gravity + ground bounce + heat-shift color.
        for (let i = sparks.length - 1; i >= 0; i--){
            const s = sparks[i];
            s.life -= dt;
            if (s.life <= 0){
                scene.remove(s.mesh);
                s.mesh.material.dispose();
                s.mesh.geometry.dispose();
                sparks.splice(i, 1);
                continue;
            }
            s.vy -= 9.8 * dt;
            s.mesh.position.x += s.vx * dt;
            s.mesh.position.y += s.vy * dt;
            s.mesh.position.z += s.vz * dt;
            if (s.mesh.position.y < groundY){
                s.mesh.position.y = groundY;
                s.vy = -s.vy * 0.40;
                s.vx *= 0.55; s.vz *= 0.55;
            }
            const k = s.life / s.startLife;
            s.mesh.material.opacity = Math.max(0, k);
            // Heat shift: white-hot → orange → deep red as it cools.
            s.mesh.material.color.setHSL(0.10 - (1 - k) * 0.08, 1.0, 0.55 - (1 - k) * 0.30);
        }
        // Embers — drift up + fade.
        for (let i = embers.length - 1; i >= 0; i--){
            const e = embers[i];
            e.life -= dt;
            if (e.life <= 0){
                scene.remove(e.mesh);
                e.mesh.material.dispose();
                e.mesh.geometry.dispose();
                embers.splice(i, 1);
                continue;
            }
            e.mesh.position.x += e.vx * dt;
            e.mesh.position.y += e.vy * dt;
            e.mesh.position.z += e.vz * dt;
            e.mesh.lookAt(camera.position);
            const k = e.life / e.startLife;
            e.mesh.material.opacity = 0.9 * k;
            e.mesh.scale.setScalar(0.9 + (1 - k) * 0.7);
        }

        if (elapsed < TOTAL || sparks.length || embers.length){
            requestAnimationFrame(frame);
        } else {
            scene.remove(burst);
            scene.remove(flare); flareMat.dispose(); flare.geometry.dispose();
            for (const sp of spikes){
                scene.remove(sp.pivot);
                sp.tip.material.dispose();
                sp.tip.geometry.dispose();
            }
        }
    }
    requestAnimationFrame(frame);
}

function _buildFireballMesh(){
    // Matches the FIRE card icon: icosahedron core + swirling flame tetrahedra
    const group = new THREE.Group();
    const core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.22, 1),
        new THREE.MeshBasicMaterial({color: 0xff4400})
    );
    group.add(core);
    const flames = [];
    for(let i=0; i<20; i++){
        const flameColor = i%3===0 ? 0xffea00 : (i%2===0 ? 0xff4500 : 0xb71c1c);
        const s = new THREE.Mesh(
            new THREE.TetrahedronGeometry(0.09, 0),
            new THREE.MeshBasicMaterial({
                color: flameColor, transparent:true, opacity:0.88,
                blending:THREE.AdditiveBlending, depthWrite:false
            })
        );
        const ang = (i/20)*Math.PI*2, rad = 0.06 + Math.random()*0.14;
        s.position.set(Math.cos(ang)*rad, 0.08, Math.sin(ang)*rad);
        group.add(s);
        flames.push({m:s, spd:3+Math.random()*6, off:Math.random()*Math.PI, rs:(Math.random()-0.5)*2});
    }
    group.userData.flames = flames;
    group.userData.core = core;
    return group;
}

// Unified spell-ball: translucent element-tinted glass orb wrapping the
// EXACT 3D model the loot card's card-icon-3d circle shows. We call
// buildLegacyLootIcon directly (same function used by the playing cards
// in the panels iframe), then scale + park it inside our orb shell —
// guaranteed 1:1 with the card art.
function _buildSpellBall(el, cardName){
    const elCol = EL_COLORS[el] || EL_COLORS.DEFAULT;
    const group = new THREE.Group();

    // 1. Outer translucent glass orb. Normal blending (not additive) so it
    //    stays element-tinted instead of saturating to white.
    const shell = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 28, 18),
        new THREE.MeshBasicMaterial({
            color: elCol.beam,
            transparent: true, opacity: 0.22,
            depthWrite: false, side: THREE.DoubleSide,
        })
    );
    group.add(shell);

    // 2. Inner 3D model — reuse the EXACT icon builder the playing cards use.
    //    Pick the canonical title for this element so the icon matches what
    //    the player just clicked (BOULDER → bouncing dodecahedron, FIREBALL
    //    → swirling flames, TIDE → fluid sphere, etc.).
    const titleByEl = {
        FIRE:  (cardName || 'FIREBALL').toUpperCase(),
        WATER: (cardName || 'TIDE').toUpperCase(),
        EARTH: (cardName || 'BOULDER').toUpperCase(),
        WIND:  (cardName || 'GALE').toUpperCase(),
        VOID:  (cardName || 'SHADOW').toUpperCase(),
    };
    const catByEl = { FIRE:'FIRE', WATER:'WATER', EARTH:'EARTH', WIND:'WIND', VOID:'VOID' };
    let icon = null;
    let animUpdate = null;
    try {
        const built = buildLegacyLootIcon({
            catId:         catByEl[el] || el || 'FIRE',
            elId:          el || 'FIRE',
            originalTitle: titleByEl[el] || (cardName || '').toUpperCase(),
        });
        icon = built.iconMesh;
        // The loot icon is designed for a ~1.6-1.8-unit-radius card canvas;
        // the spell orb is ~0.42 units, so 5× downscale fits cleanly inside.
        icon.scale.setScalar(0.20);
        // Pass-through customUpdate so the icon's native per-frame animation
        // (flame swirl, fluid surface, rock bob, tornado spin, etc.) runs.
        if (typeof built.customUpdate === 'function'){
            animUpdate = (t) => built.customUpdate(t, icon);
        }
    } catch (e) {
        console.warn('[Engine8] buildLegacyLootIcon failed for', el, e);
        icon = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.16, 0),
            new THREE.MeshBasicMaterial({ color: elCol.spark })
        );
        animUpdate = (t) => { icon.rotation.y = t * 1.4; };
    }

    if (icon){
        group.add(icon);
        group.userData.icon = icon;
        group.userData.animUpdate = animUpdate;
        group.userData.animT0 = performance.now() / 1000;
    }

    group.userData.shell = shell;
    return group;
}

function launchCard(cardName, opts = {}){
    const el = _cardElement(cardName);
    if(el === 'EARTH' && /BOULDER/.test(cardName.toUpperCase())) {
        launchBoulder(cardName); return;
    }
    _playPlayerAttackAnim();
    // Cast SFX. FIRE → fireball.mp3, WATER → waves.mp3 — each element with a
    // bundled file shares a recognizable signature sound. Other elements
    // still use the procedural synth (whoosh / chime / thud).
    if (el === 'FIRE'){
        _playSfxFile('./assets/sounds/Player/fireball.mp3', 0.85);
    } else if (el === 'WATER'){
        _playSfxFile('./assets/sounds/Player/waves.mp3', 0.85);
    } else {
        _playSpellSound(el || cardName, 0.6);
    }
    const elCol = EL_COLORS[el] || EL_COLORS.DEFAULT;
    const dmg = (opts && typeof opts.damage === 'number') ? opts.damage : calcDamage(cardName);
    const isFire = (el === 'FIRE');
    // TIDE / SURGE / any WATER card → triggers the wide water-wave spawner on impact.
    const isWaterWave = (el === 'WATER');
    // GALE / any WIND card → on impact, traps the target in a vortex
    // (20-50 base + DOT + spin-stun for 1-3 turns). Wired below.
    const isGale    = (el === 'WIND');
    // CYCLONE: wall-aware seeking vortex. Uses A* waypoints so it navigates
    // corridors instead of slamming into walls. Busts shoji doors with
    // circular spinning debris instead of dissipating.
    const isCyclone = isGale && /CYCLONE/.test(cardName.toUpperCase());

    // Conjure group — every spell uses the unified spell-ball wrapper. The
    // inner geometry comes straight from buildLegacyLootIcon, so the model
    // you see in flight is the SAME model on the playing card's 3D circle.
    // EXCEPTION: FIRE uses a dedicated layered fireball (core/aura/halo +
    // flame swirl) so it actually reads as fire instead of the ghostly orb.
    const conjureGroup = new THREE.Group();
    const ball = isFire
        ? _buildFireballProjectile()
        : _buildSpellBall(el, cardName);
    conjureGroup.add(ball);
    conjureGroup.userData.icon  = ball.userData.icon;
    conjureGroup.userData.shell = ball.userData.shell;
    const innerMesh = ball;

    // Position: 1m in front of camera, slowly rotating
    const fwd = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
    conjureGroup.position.copy(camera.position).addScaledVector(fwd, 1.0);
    conjureGroup.lookAt(camera.position);
    scene.add(conjureGroup);

    // Element-colored bloom outline PointLight (replaces flat torus halo)
    const conjureLight = new THREE.PointLight(elCol.beam, 6, 4);
    conjureLight.position.copy(conjureGroup.position);
    scene.add(conjureLight);

    // Additive bloom torus outline — sized to wrap the ball/fireball
    const outlineRingGeo = new THREE.TorusGeometry(isFire ? 0.28 : 0.40, 0.03, 8, 32);
    const outlineRing = new THREE.Mesh(outlineRingGeo, new THREE.MeshBasicMaterial({
        color: elCol.spark, transparent:true, opacity:0.8,
        blending:THREE.AdditiveBlending, depthWrite:false
    }));
    conjureGroup.add(outlineRing);

    const MAX_DIST = 22;
    const target = opts && opts.target ? opts.target : _obAutoTarget(cardName, dmg);
    // FPV faces the spell's target so the player sees the orb streak away.
    // force=true so the player's deliberate cast always wins the lock.
    if (target && target.position) _autoFaceOnAttack(target, true);
    const dir = target
        ? target.position.clone().sub(camera.position).normalize()
        : fwd.clone();

    const spellObj = {
        group: conjureGroup, ring: innerMesh, sigil: innerMesh, conjureLight, outlineRing,
        dir, dmg, el, elCol, cardName, isFire, isWaterWave, isGale, isCyclone,
        spinRate: 2, travelled: 0, target,
        state: 'conjure', conjureT: 0, streakT: 0,
        // Fire-only: a glare-streak trail spawned each tick during 'streak'.
        fbTrail: isFire ? [] : null,
        fbTrailAcc: 0,
        // CYCLONE: A* waypoints computed at launch so the orb navigates around walls.
        cycloneWaypoints: null,
        cycloneWpIdx: 0,
    };
    activeSpells.push(spellObj);

    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);

    // Pre-compute A* path for CYCLONE so it navigates corridors.
    // _monAStar returns [[gx, gz], ...] tuples — index, not property access.
    if (isCyclone && target && typeof _monAStar === 'function'){
        const tgx = Math.round(target.position.x / GRID);
        const tgz = Math.round(target.position.z / GRID);
        const rawPath = _monAStar(pgx, pgz, tgx, tgz);
        if (rawPath && rawPath.length > 1){
            // Convert grid coords → world-space XZ centres. Skip the first
            // waypoint (player's own tile) so the orb doesn't circle back.
            spellObj.cycloneWaypoints = rawPath.slice(1).map(p => ({
                x: p[0] * GRID, z: p[1] * GRID,
            }));
            spellObj.cycloneWpIdx = 0;
        }
    }

    aggroRoom(map[pgx]?.[pgz]?.roomId);
}

function launchBoulder(cardName){
    _playPlayerAttackAnim();
    _playSpellSound('EARTH', 1.1);
    const TILE_LIMIT = 12; // ≈ 80 ft lumbering distance

    // ── Boulder mesh ──
    // Radius bumped to 0.85 (~5.5 ft) — actually flatten-things-in-a-row
    // sized. Reads as a real heavy boulder instead of a bowling ball.
    const BOULDER_R = 0.85;
    const bGeo = new THREE.DodecahedronGeometry(BOULDER_R, 2);
    const bMat = new THREE.MeshStandardMaterial({
        color: 0x5C4033,
        roughness: 0.92,
        metalness: 0.0,
        flatShading: true,
    });
    const bMesh = new THREE.Mesh(bGeo, bMat);

    // Earth-tinted bloom ring sized to wrap the bigger stone.
    const ringGeo = new THREE.TorusGeometry(1.05, 0.08, 10, 32);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0xccaa55, transparent:true, opacity:0.7,
        blending:THREE.AdditiveBlending, depthWrite:false
    });
    const bloomRing = new THREE.Mesh(ringGeo, ringMat);
    bMesh.add(bloomRing);

    // Conjure orb shell — slightly bigger than the new boulder so it
    // reads as the bubble it bursts out of, but no longer feels enormous
    // because the boulder itself is now big enough to live inside it
    // proportionally.
    const SHELL_R = 1.05;
    const shell = new THREE.Mesh(
        new THREE.SphereGeometry(SHELL_R, 24, 16),
        new THREE.MeshBasicMaterial({
            color: 0xccaa55,
            transparent: true, opacity: 0.30,
            depthWrite: false, side: THREE.DoubleSide,
        })
    );

    // Auto-aim
    const target = _obAutoTarget(cardName, 0);
    if (target && target.position) _autoFaceOnAttack(target, true);
    const camFwd = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
    const aimFwd = (target
        ? target.position.clone().sub(camera.position).setY(0).normalize()
        : camFwd.clone());
    aimFwd.y = 0;
    aimFwd.normalize();

    // Hover slightly higher + further out front so the bigger boulder
    // doesn't fill the entire screen during the windup.
    const startPos = camera.position.clone().addScaledVector(aimFwd, 1.6);
    startPos.y = EYE_HEIGHT * 0.78;
    bMesh.position.copy(startPos);
    // Start the boulder small inside the shell (it's "still forming"),
    // then scale up during the conjure phase. Small enough that the
    // shell isn't crammed full at t=0.
    bMesh.scale.setScalar(0.35);
    shell.position.copy(startPos);
    scene.add(bMesh);
    scene.add(shell);

    const bl = new THREE.PointLight(0xcc8833, 3, 4);
    bl.position.copy(startPos);
    scene.add(bl);

    activeBoulders.push({
        mesh: bMesh, light: bl, bloomRing, shell,
        state: 'conjure',            // 'conjure' → 'lumber'
        conjureT: 0,
        vx: 0, vy: 0, vz: 0,
        aimFwd,                      // direction the boulder pinballs on break-out
        distTravelled: 0,
        timeAlive: 0,                // s since break-free
        maxLifetime: 5.0,            // 5-second pinball window
        hitSet: new Set(),
        playerHitCooldown: 0,
        radius: BOULDER_R,
    });

    window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
        text:`🪨 Boulder conjures — heavy stone bound in an orb. Stand clear when it breaks.`},'*');
    addCameraTrauma(0.15);

    // NO pre-launch aggro broadcast — the boulder should NOT politely warn
    // the room before it starts pinballing through walls. Monsters in its
    // actual path will panic on their own (see tickBoulders below).
}

const _SPELL_MAX_DIST = 22; // world units

// ── TIDE / SURGE — hyper-realistic water-wave system ────────────────────────
// On a WATER spell impact, the orb shatters open and births a curving breaker
// that sweeps forward for ~80 ft. Surface uses a custom GLSL Gerstner-wave
// shader (3-octave traveling waves + Fresnel water tint + foam from height
// curvature) so the silhouette and shading actually behave like water — not
// a textured rectangle. Each enemy struck spawns a 3D splash column, an
// expanding ripple ring on the floor, and a brief water-sheet wrap. Damage
// rolls + slow-debuff are preserved from the original 3d20+23 design.
const activeTideWaves = [];
const _TIDE_WAVE_W       = GRID * 4.0;   // ~25 ft wide front
const _TIDE_WAVE_DEPTH   = GRID * 1.5;   // ~9 ft front-to-back
const _TIDE_WAVE_PEAK    = 2.6;          // crest peak height (world units)
const _TIDE_WAVE_MAX     = GRID * 10;    // 10 tiles travel before evaporating
const _TIDE_WAVE_SPEED   = 14;           // world-units/sec
const _TIDE_HIT_HALFLEN  = 1.05;         // forward catch window (a bit wider so hits land)
const _TIDE_BIRTH_DUR    = 0.30;         // seconds for orb→wave birth
const _TIDE_FADE_DUR     = 0.18;         // photoreal snap evap (was 0.70)
const _TIDE_BLOOM_DUR    = 0.28;         // tight final bloom (was 0.95)

// ── Custom water ShaderMaterial ─────────────────────────────────────────────
// Vertex displaces y by three Gerstner waves modulated by a leading-crest
// envelope (so the wave has a tall front face and a thin trailing tail).
// Fragment blends deep teal trough → bright cyan crest, layers Fresnel
// specular, paints foam wherever |height|+|curvature| crosses a threshold,
// and fades alpha at edges so the wave doesn't show a hard rectangle.
const _WATER_WAVE_VS = `
    varying vec2 vUv;
    varying float vH;          // displaced height in local space
    varying float vCurv;       // local curvature proxy (for foam)
    varying vec3  vWorld;      // world position (for caustic projection)
    uniform float uTime;
    uniform float uBirth;      // 0..1 birth scale
    uniform float uSpread;     // current width scale (1.0+)
    // Gerstner helper — directional traveling wave, returns delta(x,y,z)
    vec3 gerstner(vec2 p, vec2 dir, float wavelength, float steepness, float speed){
        float k = 6.2831853 / wavelength;
        float c = sqrt(9.8 / k);
        float f = k * dot(dir, p) - c * uTime * speed;
        float a = steepness / k;
        return vec3(dir.x * a * cos(f), a * sin(f), dir.y * a * cos(f));
    }
    void main(){
        vUv = uv;
        // Geometry is pre-rotated to lie on the xz plane (see _spawnTideWave),
        // so position.x = across-front, position.z = depth, position.y ≈ 0.
        vec2 p = vec2(position.x, position.z);
        // Three Gerstners — main forward swell + cross-chop + fine ripple
        vec3 g1 = gerstner(p, normalize(vec2(0.0, 1.0)), 3.6, 0.50, 1.6);
        vec3 g2 = gerstner(p, normalize(vec2(0.7, 0.7)), 1.8, 0.30, 2.2);
        vec3 g3 = gerstner(p, normalize(vec2(-0.4, 1.0)), 0.9, 0.18, 3.0);
        vec3 disp = g1 + g2 + g3;
        // Leading-crest envelope: max height near front edge (uv.y ≈ 1),
        // thin trailing tail behind. Squared so the peak is steep.
        float front = smoothstep(0.05, 0.85, uv.y);
        float peak  = pow(front, 1.6);
        // Side fade — edges of the wave taper to zero height
        float side  = 1.0 - pow(abs(uv.x - 0.5) * 2.0, 2.5);
        side = clamp(side, 0.0, 1.0);
        float env = peak * side;
        // Vertical hump (the "wall of water" leading face)
        float hump = sin(uv.y * 3.14159) * env;
        // Sum: gerstner-modulated chop on top of the leading hump
        float h = (hump * 1.55 + disp.y * env * 1.3) * uBirth;
        // Lateral curl: shift z slightly forward at the crest so the breaker
        // tilts (looks like an actual breaking wave from the side)
        float curl = peak * 0.18 * uBirth;
        vec3 displaced = vec3(position.x + disp.x * env, h, position.z + disp.z * env + curl);
        vH = h;
        // Curvature proxy from second derivative of disp (foam where peaks pinch)
        vCurv = abs(disp.y) * env;
        vec4 wp = modelMatrix * vec4(displaced, 1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
    }
`;
const _WATER_WAVE_FS = `
    precision highp float;
    varying vec2 vUv;
    varying float vH;
    varying float vCurv;
    varying vec3  vWorld;
    uniform float uTime;
    uniform float uOpacity;
    uniform vec3  uDeep;     // deep trough color
    uniform vec3  uMid;      // mid-depth tint
    uniform vec3  uShallow;  // crest tint
    uniform vec3  uFoam;     // foam color
    uniform vec3  uCamPos;
    void main(){
        // Height-driven color blend: deep → mid → shallow as h rises
        float hn = clamp((vH / 2.6) * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(uDeep, uMid, smoothstep(0.30, 0.65, hn));
        col = mix(col, uShallow, smoothstep(0.65, 0.92, hn));
        // Fresnel — viewing angle to camera gives the wave a bright rim
        vec3 viewDir = normalize(uCamPos - vWorld);
        float fres = pow(1.0 - max(0.0, viewDir.y), 2.5);
        col += vec3(0.10, 0.18, 0.28) * fres;
        // Foam: where the wave's curvature spikes OR where the crest height
        // is near its max. Animated noise via sin-of-uv keeps the foam alive.
        float crestFoam = smoothstep(0.45, 0.90, hn);
        float curvFoam  = smoothstep(0.15, 0.50, vCurv);
        float noise     = 0.5 + 0.5 * sin((vUv.x + uTime * 0.6) * 42.0)
                              * sin((vUv.y - uTime * 0.45) * 26.0);
        float foam      = clamp((crestFoam + curvFoam * 0.8) * (0.7 + noise * 0.8), 0.0, 1.0);
        col = mix(col, uFoam, foam * 0.95);
        // Edge alpha fade — wave thins at sides AND at the trailing tail so
        // it never reads as a flat rectangle.
        float aSide = 1.0 - pow(abs(vUv.x - 0.5) * 2.0, 3.5);
        float aTail = smoothstep(0.0, 0.30, vUv.y);
        float a = clamp(aSide, 0.0, 1.0) * aTail * uOpacity;
        // Body must stay opaque enough to read; floor it to 0.55 at the crest.
        a = max(a, foam * 0.65 * uOpacity);
        gl_FragColor = vec4(col, a);
    }
`;

function _makeWaterWaveMaterial(camPos){
    return new THREE.ShaderMaterial({
        vertexShader:   _WATER_WAVE_VS,
        fragmentShader: _WATER_WAVE_FS,
        uniforms: {
            uTime:    { value: 0.0 },
            uBirth:   { value: 0.0 },
            uSpread:  { value: 1.0 },
            uOpacity: { value: 0.92 },
            // Photo-realistic ocean palette: deep navy → mid royal-blue →
            // bright sky-cyan crest → pure-white foam.
            uDeep:    { value: new THREE.Color(0x02132a) },
            uMid:     { value: new THREE.Color(0x1860c8) },
            uShallow: { value: new THREE.Color(0x6ec7ff) },
            uFoam:    { value: new THREE.Color(0xffffff) },
            uCamPos:  { value: camPos ? camPos.clone() : new THREE.Vector3() },
        },
        transparent: true,
        depthWrite:  false,
        side:        THREE.DoubleSide,
    });
}

// ── Caustic disc on the floor ───────────────────────────────────────────────
// Soft wet shadow + animated radial ripple under the wave so the floor
// visibly reacts. Pure additive blend, no shader needed.
function _makeCausticDisc(){
    const geo = new THREE.CircleGeometry(_TIDE_WAVE_W * 0.65, 48);
    const mat = new THREE.MeshBasicMaterial({
        color: 0x6bc8ff, transparent: true, opacity: 0.0,
        blending: THREE.AdditiveBlending, depthWrite: false,
        side: THREE.DoubleSide,
    });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.y = 0.02;
    return m;
}

// ── Birth burst: orb shell shatter + radial droplets ────────────────────────
// On impact, the spell ball is removed and we play a 0.35s "birth" — a ring
// of ~18 droplet shards explode outward from the orb's last position, while
// the wave itself ramps from 0 → full height via the uBirth uniform.
function _spawnWaterBirthBurst(originPos){
    const burst = new THREE.Group();
    const drops = [];
    const N = 22;
    for (let i = 0; i < N; i++){
        const ang = (i / N) * Math.PI * 2 + Math.random() * 0.2;
        const s   = 0.05 + Math.random() * 0.08;
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(s, 7, 6),
            new THREE.MeshBasicMaterial({
                color: 0xbfeaff, transparent: true, opacity: 0.95,
                blending: THREE.AdditiveBlending, depthWrite: false,
            })
        );
        m.position.copy(originPos);
        m.userData.vx = Math.cos(ang) * (2.5 + Math.random() * 2.0);
        m.userData.vz = Math.sin(ang) * (2.5 + Math.random() * 2.0);
        m.userData.vy = 1.5 + Math.random() * 2.4;
        m.userData.life = 0.55 + Math.random() * 0.20;
        m.userData.age  = 0;
        burst.add(m); drops.push(m);
    }
    // Central flash sphere — bright pop where the orb was
    const flash = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 16, 12),
        new THREE.MeshBasicMaterial({
            color: 0xeaffff, transparent: true, opacity: 0.95,
            blending: THREE.AdditiveBlending, depthWrite: false,
        })
    );
    flash.position.copy(originPos);
    burst.add(flash);
    scene.add(burst);
    return { group: burst, drops, flash, age: 0, life: 0.18 };
}

function _tickWaterBirthBurst(b, dt){
    b.age += dt;
    // Flash inflates and fades
    const fT = Math.min(1, b.age / 0.30);
    b.flash.scale.setScalar(1 + fT * 2.4);
    b.flash.material.opacity = 0.95 * (1 - fT);
    // Droplets arc out + gravity
    for (const d of b.drops){
        d.userData.age += dt;
        d.position.x += d.userData.vx * dt;
        d.position.z += d.userData.vz * dt;
        d.position.y += d.userData.vy * dt;
        d.userData.vy -= 9.8 * dt;
        const lt = d.userData.age / d.userData.life;
        d.material.opacity = 0.95 * (1 - lt);
    }
    if (b.age >= b.life){
        scene.remove(b.group);
        return true;
    }
    return false;
}

// ── Per-monster splash on hit ───────────────────────────────────────────────
// Monster takes a vertical splash (~12 droplets), an expanding wet ring on
// the floor, and a translucent water sheet briefly wraps the body. The
// splash points outward AWAY from the wave's travel direction so it reads
// as "the wave hit them and water sprayed out".
const _activeSplashes = [];
function _spawnMonsterSplash(monster, waveDir){
    const center = monster.position.clone();
    const group = new THREE.Group();
    // Droplets — biased forward along waveDir + upward
    const drops = [];
    for (let i = 0; i < 14; i++){
        const ang = Math.random() * Math.PI * 2;
        const r   = 0.20 + Math.random() * 0.25;
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(0.07 + Math.random() * 0.05, 6, 5),
            new THREE.MeshBasicMaterial({
                color: 0xcbeeff, transparent: true, opacity: 0.95,
                blending: THREE.AdditiveBlending, depthWrite: false,
            })
        );
        m.position.set(center.x + Math.cos(ang) * r, center.y + 0.6, center.z + Math.sin(ang) * r);
        // Bias direction: 60% along waveDir (the "passthrough" spray), 40% upward
        const fwdBias = 0.55 + Math.random() * 0.40;
        m.userData.vx = waveDir.x * fwdBias * 3.2 + Math.cos(ang) * 1.4;
        m.userData.vz = waveDir.z * fwdBias * 3.2 + Math.sin(ang) * 1.4;
        m.userData.vy = 2.6 + Math.random() * 2.2;
        m.userData.age = 0;
        m.userData.life = 0.55 + Math.random() * 0.25;
        group.add(m); drops.push(m);
    }
    // Expanding wet ring on the floor — additive cyan
    const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.3, 0.42, 32),
        new THREE.MeshBasicMaterial({
            color: 0x88e0ff, transparent: true, opacity: 0.85,
            blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
        })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(center.x, 0.03, center.z);
    group.add(ring);
    // Water sheet wrap — a translucent capsule briefly enveloping the body
    const sheet = new THREE.Mesh(
        new THREE.SphereGeometry(0.85, 18, 14),
        new THREE.MeshBasicMaterial({
            color: 0x6cc6ff, transparent: true, opacity: 0.45,
            depthWrite: false,
        })
    );
    sheet.position.set(center.x, center.y + 0.85, center.z);
    sheet.scale.set(0.7, 1.05, 0.7);
    group.add(sheet);
    scene.add(group);
    _activeSplashes.push({
        group, drops, ring, sheet,
        ringR: 0.36, monster, dir: waveDir.clone(),
        age: 0, life: 0.75,
    });
}

function _tickMonsterSplashes(dt){
    for (let i = _activeSplashes.length - 1; i >= 0; i--){
        const s = _activeSplashes[i];
        s.age += dt;
        const t = s.age / s.life;
        // Droplets arc and fall
        for (const d of s.drops){
            d.userData.age += dt;
            d.position.x += d.userData.vx * dt;
            d.position.z += d.userData.vz * dt;
            d.position.y += d.userData.vy * dt;
            d.userData.vy -= 9.5 * dt;
            const lt = d.userData.age / d.userData.life;
            d.material.opacity = 0.95 * Math.max(0, 1 - lt);
        }
        // Ring expands + fades
        s.ringR += 4.8 * dt;
        s.ring.scale.setScalar(s.ringR / 0.36);
        s.ring.material.opacity = 0.85 * Math.max(0, 1 - t);
        // Sheet follows the monster (it's hit, may be moving), expands + fades
        if (s.monster && !s.monster.userData.isDead){
            s.sheet.position.x = s.monster.position.x;
            s.sheet.position.z = s.monster.position.z;
        }
        s.sheet.scale.setScalar((0.7 + t * 0.45));
        s.sheet.material.opacity = 0.45 * Math.max(0, 1 - t * 1.4);
        if (s.age >= s.life){
            scene.remove(s.group);
            _activeSplashes.splice(i, 1);
        }
    }
}

// ── Spawn ───────────────────────────────────────────────────────────────────
// originPos = where the orb burst (impact point)
// dir       = forward unit vector along travel
function _spawnTideWave(originPos, dir){
    const wave = new THREE.Group();
    // Plane sits on the floor (xz), shader displaces y. uv.x = across front
    // (left↔right), uv.y = depth (0 trailing tail → 1 leading face).
    const geo = new THREE.PlaneGeometry(_TIDE_WAVE_W, _TIDE_WAVE_DEPTH, 96, 32);
    geo.rotateX(Math.PI / 2); // lay flat on xz: x = across-front, z = depth (uv.y=1 → far/leading edge)
    const mat = _makeWaterWaveMaterial(camera ? camera.position : null);
    const surface = new THREE.Mesh(geo, mat);
    wave.add(surface);

    // Floor caustic disc travels with the wave — soft wet shadow underneath
    const caustic = _makeCausticDisc();
    wave.add(caustic);

    // Bright leading light at the front edge — illuminates monsters as it
    // sweeps over them, then trails off as the wave fades.
    const leadLight = new THREE.PointLight(0x88ccff, 9.0, 8.5, 1.8);
    leadLight.position.set(0, 1.3, _TIDE_WAVE_DEPTH * 0.45);
    wave.add(leadLight);
    // Cool ambient fill so the foam glows even outside the leading-light pool
    const fillLight = new THREE.PointLight(0x2a78b8, 2.5, 12.0, 2.0);
    fillLight.position.set(0, 0.6, 0);
    wave.add(fillLight);

    // Forward mist particles — small spheres puffing ahead of the crest
    const mist = [];
    for (let i = 0; i < 14; i++){
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(0.10 + Math.random()*0.06, 6, 5),
            new THREE.MeshBasicMaterial({
                color: 0xddf3ff, transparent: true, opacity: 0.0,
                blending: THREE.AdditiveBlending, depthWrite: false,
            })
        );
        m.userData.seed = Math.random();
        wave.add(m); mist.push(m);
    }

    // Orient: place wave on the floor at the origin, point +z along dir
    wave.position.set(originPos.x, 0.0, originPos.z);
    const yaw = Math.atan2(dir.x, dir.z);
    wave.rotation.y = yaw;
    scene.add(wave);

    // Birth burst at the orb's position
    const birth = _spawnWaterBirthBurst(originPos);

    activeTideWaves.push({
        group: wave, surface, caustic, leadLight, fillLight, mist, birth,
        dir: dir.clone(), travelled: 0,
        damagedSet: new Set(),
        born: performance.now(),
        fading: false, fadeT: 0,
        bloom: null, bloomT: 0, // post-evaporate blue light bloom
    });

    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
        text:'🌊 <b>Tide</b> roars forward — a curling wall of water sweeps the corridor!'},'*');
}

// Post-evaporate blue light bloom — a soft glowing sphere + point-light pair
// at the wave's final position. Inflates fast, then fades over _TIDE_BLOOM_DUR.
function _spawnWaveBloom(atVec3){
    const group = new THREE.Group();
    const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 24, 18),
        new THREE.MeshBasicMaterial({
            color: 0x88ccff, transparent: true, opacity: 0.85,
            blending: THREE.AdditiveBlending, depthWrite: false,
        })
    );
    const halo = new THREE.Mesh(
        new THREE.SphereGeometry(1.1, 20, 14),
        new THREE.MeshBasicMaterial({
            color: 0x3a8fd8, transparent: true, opacity: 0.45,
            blending: THREE.AdditiveBlending, depthWrite: false,
        })
    );
    const light = new THREE.PointLight(0x66ccff, 8.0, 9.5, 1.8);
    group.add(core); group.add(halo); group.add(light);
    group.position.copy(atVec3); group.position.y = 0.9;
    scene.add(group);
    return { group, core, halo, light, age: 0 };
}

function tickTideWaves(dt){
    // Splash effects (independent of wave lifecycle so they can outlive it)
    _tickMonsterSplashes(dt);

    for (let i = activeTideWaves.length - 1; i >= 0; i--){
        const w = activeTideWaves[i];
        const now = performance.now();
        const age = (now - w.born) / 1000;

        // Tick birth burst (if still alive)
        if (w.birth){
            if (_tickWaterBirthBurst(w.birth, dt)) w.birth = null;
        }

        // uBirth ramps 0 → 1 over _TIDE_BIRTH_DUR so the wave "rises" from the
        // floor instead of popping in. Then stays at 1.0 during travel.
        const birthT = Math.min(1, age / _TIDE_BIRTH_DUR);
        const opacBase = w.surface.material.uniforms.uOpacity;
        // Fading state (= evaporating): scale uBirth back down + drop opacity.
        // The wave mesh is removed when uBirth hits 0, but the record sticks
        // around until the post-evaporate blue bloom finishes.
        if (w.fading){
            w.fadeT += dt;
            const fT = Math.min(1, w.fadeT / _TIDE_FADE_DUR);
            w.surface.material.uniforms.uBirth.value = (1 - fT);
            opacBase.value = 0.92 * (1 - fT);
            w.leadLight.intensity = 9.0 * (1 - fT);
            w.fillLight.intensity = 2.5 * (1 - fT);
            w.caustic.material.opacity *= (1 - dt * 2.5);
            // Tick the bloom regardless of whether the wave mesh is still there
            if (w.bloom){
                w.bloomT += dt;
                const bT = Math.min(1, w.bloomT / _TIDE_BLOOM_DUR);
                // Inflate fast, then fade (ease-out cubic)
                const scl = 0.8 + bT * 1.7;
                w.bloom.core.scale.setScalar(scl);
                w.bloom.halo.scale.setScalar(scl * 1.25);
                const fadeBT = 1.0 - bT * bT;
                w.bloom.core.material.opacity = 0.85 * fadeBT;
                w.bloom.halo.material.opacity = 0.45 * fadeBT;
                w.bloom.light.intensity = 8.0 * fadeBT;
            }
            // Once the wave is fully gone AND the bloom is done, remove all.
            if (fT >= 1 && (!w.bloom || w.bloomT >= _TIDE_BLOOM_DUR)){
                scene.remove(w.group);
                if (w.bloom) scene.remove(w.bloom.group);
                activeTideWaves.splice(i, 1);
                continue;
            }
        } else {
            w.surface.material.uniforms.uBirth.value = birthT;
            opacBase.value = 0.92;
        }

        // Advance the wave only after a short birth pause so it visibly rises
        // before sweeping forward.
        if (age > _TIDE_BIRTH_DUR * 0.55 && !w.fading){
            const step = _TIDE_WAVE_SPEED * dt;
            w.group.position.x += w.dir.x * step;
            w.group.position.z += w.dir.z * step;
            w.travelled += step;
            // Wet residue: every ~1.2 tiles travelled, leave a wet floor decal.
            // Lingers ~6s — the player can see the path the wave swept.
            w._lastWetAt = w._lastWetAt || 0;
            if (w.travelled - w._lastWetAt >= GRID * 1.2){
                w._lastWetAt = w.travelled;
                _spawnFloorDecal(w.group.position, 'wet', { rOuter: 1.05, life: 6.0 });
            }
            // Bust any shoji doors the wave-front passes over. Wave leading
            // edge is _TIDE_WAVE_DEPTH/2 ahead of group.position along w.dir.
            w._doorsBust = w._doorsBust || new Set();
            const _fwx = w.group.position.x + w.dir.x * (_TIDE_WAVE_DEPTH * 0.5);
            const _fwz = w.group.position.z + w.dir.z * (_TIDE_WAVE_DEPTH * 0.5);
            const _dgx = Math.round(_fwx / GRID);
            const _dgz = Math.round(_fwz / GRID);
            const _dcell = map[_dgx]?.[_dgz];
            if (_dcell && _dcell.type === 'shoji_door'){
                const _dkey = `${_dgx},${_dgz}`;
                if (!w._doorsBust.has(_dkey) && typeof shojiDoorPanels !== 'undefined'){
                    const _panel = shojiDoorPanels.find(p => p.cx === _dgx && p.cz === _dgz && !p.broken);
                    if (_panel){
                        _breakShojiPanel(_panel);
                        w._doorsBust.add(_dkey);
                        addCameraTrauma(0.22);
                        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                            text:'🌊🚪 The tide blasts the shoji apart!'}, '*');
                    }
                }
            }
        }

        // Shader time tick — drives Gerstner + foam noise
        w.surface.material.uniforms.uTime.value = age;
        if (camera) w.surface.material.uniforms.uCamPos.value.copy(camera.position);

        // Caustic disc: pulse opacity with the wave's heartbeat; floor-only
        w.caustic.material.opacity = 0.18 + 0.10 * Math.sin(age * 5.0);

        // Leading light bob — gives the wave a living "glow on water" feel
        w.leadLight.intensity = (9.0 + Math.sin(age * 7.0) * 1.2)
                              * w.surface.material.uniforms.uBirth.value;

        // Mist particles — re-seed forward of the crest as they expire
