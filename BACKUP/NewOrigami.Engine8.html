// ── Loot Card System ────────────────────────────────────────────────────────────
// getCardThemeColor, getCardEdgeColor, buildLegacyCardCanvas, buildLegacyLootIcon
// → imported from js/v8/entities/LootCardBuilder.js
// _sharedGlassBubbleGeo/_Mat → imported as GLASS_BUBBLE_GEO/MAT
const lootItems = [];

// ── spawnLootCard — full legacy signature ────────────────────────────────────
// (gx, gz, catId, title, desc, kanji, attr, isShopItem?, price?)
function spawnLootCard(gx, gz, catId, inTitle, desc, kanji, attr, isShopItem=false, price=50){
    const originalTitle = inTitle;
    let elId = catId;
    // Magical artefacts get the gunmetal-purple treatment that matches the
    // playing card theme. MAGIC MISSILE is the renamed PISTOL — accept
    // either string so existing spawn sites that still pass "PISTOL"
    // (loot pool, missile recovery) keep working unchanged.
    if (inTitle === 'PISTOL' || inTitle === 'MAGIC MISSILE') elId = 'PISTOL';
    if (inTitle === 'MAGIC LANTERN')  elId = 'MAGIC_LANTERN';
    // Pill label — re-skin a few category IDs to the human-readable name
    // the player expects to see on the card. (MISSILE is the engine bucket;
    // the deck label is "RANGED".)
    const _PILL_LABEL = { MISSILE: 'RANGED', GOLD_COIN: 'GOLD', KATANA: 'MELEE' };
    let displayTypePill = _PILL_LABEL[catId] || catId.toUpperCase();
    let displayKanji = kanji, displayDesc = desc, displayAttr = attr;
    let title = inTitle;

    // ── i18n: localize title/desc/attr for EVERY loot card ─────────────
    // Normalize the title to the i18n.js card id (uppercase ENGLISH name
    // → lowercase + underscore), then look it up in the current locale.
    // Works for starter cards, monster drops, missile-recovery drops —
    // any spawnLootCard call gets localized text automatically.
    if (typeof tCard === 'function'){
        const _normTitle = String(inTitle || '').toUpperCase()
            .replace(/\s+X\d+$/, '')                 // strip "x3" qty suffix
            .replace(/\bMAGIC\s+MISSILE\b/, 'PISTOL')// alias
            .replace(/\s+/g, '_')                    // spaces → underscores
            .toLowerCase();
        const _aliases = {
            'hard_attack':    'strong_attack',  // i18n key spells out the action
            'magic_lantern':  'magic_lantern',
            'gold_coins':     'gold_coins',
        };
        const _cardId = _aliases[_normTitle] || _normTitle;
        const loc = tCard(_cardId);
        if (loc){
            if (loc.name) title = loc.name;
            if (loc.desc) displayDesc = loc.desc;
            if (loc.attr) displayAttr = loc.attr;
        }
    }

    // SHURIKEN gets a random qty x3-x8 (apply AFTER localization so the
    // localized base name still gets the multiplier suffix).
    let qty = 1;
    if(originalTitle === 'SHURIKEN'){
        qty = Math.floor(Math.random()*6) + 3;
        title = `${title} x${qty}`;
    }

    const themeColor = getCardThemeColor(catId, elId);

    // Build canvas card face
    const {canvas, cleanCardURL} = buildLegacyCardCanvas({
        title, displayKanji, displayDesc, displayAttr,
        displayTypePill, catId, themeColor, isShopItem, price
    });
    const tex = new THREE.CanvasTexture(canvas);
    tex.generateMipmaps=false; tex.minFilter=THREE.LinearFilter;

    const cardMat = new THREE.MeshPhysicalMaterial({
        map: tex, transparent: true, alphaTest: 0.5,
        roughness: 0.9, metalness: 0.05,
        clearcoat: 0.0, clearcoatRoughness: 1.0, ior: 1.1
    });

    const cardGroup = new THREE.Group();

    const edgeColor = getCardEdgeColor(elId, catId);
    const edgeMat = new THREE.MeshStandardMaterial({
        color: edgeColor,
        roughness: catId === 'GOLD_COIN' ? 0.2 : 0.5,
        metalness: catId === 'GOLD_COIN' ? 1.0 : 0.0
    });

    // Rounded card shape with circular hole punched (the porthole)
    const shape = new THREE.Shape();
    const r = 0.075, w = 0.8, h = 1.2, sx = -w/2, sy = -h/2;
    shape.moveTo(sx, sy + r);
    shape.lineTo(sx, sy + h - r);
    shape.quadraticCurveTo(sx, sy + h, sx + r, sy + h);
    shape.lineTo(sx + w - r, sy + h);
    shape.quadraticCurveTo(sx + w, sy + h, sx + w, sy + h - r);
    shape.lineTo(sx + w, sy + r);
    shape.quadraticCurveTo(sx + w, sy, sx + w - r, sy);
    shape.lineTo(sx + r, sy);
    shape.quadraticCurveTo(sx, sy, sx, sy + r);
    const holePath = new THREE.Path();
    holePath.absarc(0, -0.096, 0.1875, 0, Math.PI*2, true);
    shape.holes.push(holePath);

    const edgeGeo = new THREE.ExtrudeGeometry(shape, {depth: 0.02, bevelEnabled: false});
    edgeGeo.translate(0, 0, -0.01);
    cardGroup.add(new THREE.Mesh(edgeGeo, edgeMat));

    const front = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.2), cardMat);
    front.position.z = 0.011;
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.2), cardMat);
    back.rotation.y = Math.PI; back.position.z = -0.011;
    cardGroup.add(front, back);

    // Build the 3D icon and embed it in a glass dome
    const iconModel = buildLegacyLootIcon({catId, elId, originalTitle});
    const iconWrapper = new THREE.Group();

    // Legacy scale: 0.07 default, 0.35 for MAGIC LANTERN (flashlight body is bigger)
    let EXACT_SCALE = 0.07;
    if(originalTitle === 'MAGIC LANTERN') EXACT_SCALE = 0.35;

    const frontIcon = iconModel.iconMesh;
    frontIcon.scale.setScalar(EXACT_SCALE);
    frontIcon.position.set(0, -0.096, 0); // dead center in hole
    frontIcon.traverse(child => {
        if(child.isMesh){
            if(child.material && !Array.isArray(child.material)){
                child.material.transparent = true;
                child.material.side = THREE.DoubleSide;
                child.material.needsUpdate = true;
            }
            child.renderOrder = 20;
        }
    });
    iconWrapper.add(frontIcon);

    const glassBubble = new THREE.Mesh(_sharedGlassBubbleGeo, _sharedGlassBubbleMat);
    glassBubble.position.set(0, -0.096, 0);
    glassBubble.scale.set(1, 1, 0.75);
    glassBubble.renderOrder = 10;
    iconWrapper.add(glassBubble);

    cardGroup.add(iconWrapper);

    // ── MAGIC MISSILE (PISTOL alias) ethereal bloom ───────────────────────
    // Arcane projectile card — three layers: violet point-light, soft inner
    // halo sphere, and an outer pulsing additive ring that drifts around it.
    if (originalTitle === 'PISTOL' || originalTitle === 'MAGIC MISSILE'){
        const auraGroup = new THREE.Group();
        // Mystic violet point-light
        const auraLight = new THREE.PointLight(0xb480ff, 2.4, 4.5, 1.8);
        auraLight.position.set(0, 0.05, 0);
        auraGroup.add(auraLight);
        // Inner soft halo (additive sphere)
        const innerHalo = new THREE.Mesh(
            new THREE.SphereGeometry(0.42, 18, 14),
            new THREE.MeshBasicMaterial({
                color: 0x9070ff, transparent: true, opacity: 0.18,
                blending: THREE.AdditiveBlending, depthWrite: false,
            }),
        );
        innerHalo.position.set(0, -0.06, 0);
        auraGroup.add(innerHalo);
        // Outer ring — wider, more transparent, slowly rotates
        const outerHalo = new THREE.Mesh(
            new THREE.SphereGeometry(0.62, 16, 12),
            new THREE.MeshBasicMaterial({
                color: 0xd8b0ff, transparent: true, opacity: 0.10,
                blending: THREE.AdditiveBlending, depthWrite: false,
            }),
        );
        outerHalo.position.set(0, -0.06, 0);
        auraGroup.add(outerHalo);
        // Drifting sparkles — 8 tiny additive specks orbiting the card
        const sparkles = [];
        for (let i = 0; i < 8; i++){
            const sp = new THREE.Mesh(
                new THREE.SphereGeometry(0.022, 6, 4),
                new THREE.MeshBasicMaterial({
                    color: 0xeed8ff, transparent: true, opacity: 0.95,
                    blending: THREE.AdditiveBlending, depthWrite: false,
                }),
            );
            sp.userData.orbitAng    = (i / 8) * Math.PI * 2;
            sp.userData.orbitRadius = 0.45 + Math.random() * 0.10;
            sp.userData.orbitSpeed  = 0.6 + Math.random() * 0.6;
            sp.userData.orbitYAmp   = 0.18 + Math.random() * 0.12;
            sp.userData.orbitYFreq  = 1.4 + Math.random() * 0.8;
            sp.userData.orbitYPhase = Math.random() * Math.PI * 2;
            auraGroup.add(sp);
            sparkles.push(sp);
        }
        cardGroup.add(auraGroup);
        // Hook the per-frame customUpdate to animate the bloom + sparkles.
        const prevUpdate = iconModel.customUpdate;
        iconModel.customUpdate = (t, m) => {
            if (prevUpdate) prevUpdate(t, m);
            // Light pulse
            auraLight.intensity = 2.0 + Math.sin(t * 1.8) * 0.6;
            // Halo breathing
            const pulse = 1.0 + Math.sin(t * 1.4) * 0.10;
            innerHalo.scale.setScalar(pulse);
            outerHalo.scale.setScalar(1.0 + Math.sin(t * 0.9 + 0.7) * 0.08);
            outerHalo.rotation.y = t * 0.45;
            // Sparkle orbits
            for (const sp of sparkles){
                const ang = sp.userData.orbitAng + t * sp.userData.orbitSpeed;
                sp.position.x = Math.cos(ang) * sp.userData.orbitRadius;
                sp.position.z = Math.sin(ang) * sp.userData.orbitRadius;
                sp.position.y = -0.06 + Math.sin(t * sp.userData.orbitYFreq + sp.userData.orbitYPhase) * sp.userData.orbitYAmp;
                sp.material.opacity = 0.65 + Math.sin(t * 2.2 + sp.userData.orbitYPhase) * 0.30;
            }
        };
    }

    cardGroup.position.set(gx*GRID, 1.2, gz*GRID);
    cardGroup.userData = {
        type: 'loot_cards',
        floatTimer: Math.random() * Math.PI * 2,
        basePos: 1.2,
        gridX: gx, gridZ: gz,
        cardDataURL: canvas.toDataURL(),
        cleanCardURL,
        iconMesh: iconWrapper,
        customUpdate: (t) => { if(iconModel.customUpdate) iconModel.customUpdate(t, frontIcon); },
        cardData: {el: catId, name: inTitle, desc, kanji, attr, themeClr: themeColor, qty},
        cardName: title,
        isShopItem, price,
        // Persist the raw spawn args so LOCALE_CHANGE can rebuild this
        // card's face texture in the new language without re-spawning.
        _spawnArgs: { gx, gz, catId, inTitle, desc, kanji, attr, isShopItem, price },
        _cardFront: front,
        _cardBack:  back,
        _cardMat:   cardMat,
    };
    worldGroup.add(cardGroup);
    lootItems.push(cardGroup);
    return cardGroup;
}

// ── Re-bake the canvas face on a live loot card in the current locale ──
// Used by the LOCALE_CHANGE listener so floor cards switch language
// without despawning. Resolves the cardId via the same normalize rules
// spawnLootCard uses, looks up tCard, regenerates the canvas, and swaps
// the texture in place.
function _relocalizeLootCard(card){
    const ud = card && card.userData;
    if (!ud || !ud._spawnArgs || !ud._cardMat) return;
    if (typeof tCard !== 'function') return;
    const a = ud._spawnArgs;
    const _normTitle = String(a.inTitle || '').toUpperCase()
        .replace(/\s+X\d+$/, '')
        .replace(/\bMAGIC\s+MISSILE\b/, 'PISTOL')
        .replace(/\s+/g, '_')
        .toLowerCase();
    const _aliases = { 'hard_attack': 'strong_attack' };
    const _cardId = _aliases[_normTitle] || _normTitle;
    const loc = tCard(_cardId);
    let title = a.inTitle, desc = a.desc, attr = a.attr;
    if (loc){
        if (loc.name) title = loc.name;
        if (loc.desc) desc  = loc.desc;
        if (loc.attr) attr  = loc.attr;
    }
    // Preserve any "x5" qty suffix that was applied at spawn time
    const qtyMatch = String(ud.cardName || '').match(/\s+x(\d+)$/i);
    if (qtyMatch) title = `${title} x${qtyMatch[1]}`;
    const elId = (a.inTitle === 'PISTOL' || a.inTitle === 'MAGIC MISSILE') ? 'PISTOL'
              : (a.inTitle === 'MAGIC LANTERN')                            ? 'MAGIC_LANTERN'
              : a.catId;
    const themeColor = getCardThemeColor(a.catId, elId);
    const _PILL_LABEL = { MISSILE: 'RANGED', GOLD_COIN: 'GOLD', KATANA: 'MELEE' };
    const { canvas } = buildLegacyCardCanvas({
        title,
        displayKanji: a.kanji,
        displayDesc:  desc,
        displayAttr:  attr,
        displayTypePill: _PILL_LABEL[a.catId] || a.catId.toUpperCase(),
        catId: a.catId, themeColor,
        isShopItem: a.isShopItem, price: a.price,
    });
    const newTex = new THREE.CanvasTexture(canvas);
    newTex.generateMipmaps = false;
    newTex.minFilter = THREE.LinearFilter;
    if (ud._cardMat.map) ud._cardMat.map.dispose();
    ud._cardMat.map = newTex;
    ud._cardMat.needsUpdate = true;
    ud.cardName = title;
    ud.cardDataURL = canvas.toDataURL();
}

// Distance² gates so far-away cards skip animation entirely. The pickup
// check still runs (1wu radius) but we don't burn cycles bobbing + spinning
// cards the player can't see. ~12wu is just past PIP view radius.
const _LOOT_ANIM_DIST2 = 12 * 12;
function updateLootCards(dt){
    for(let i = lootItems.length-1; i>=0; i--){
        const c = lootItems[i];
        const _ldx = c.position.x - px, _ldz = c.position.z - pz;
        const _ld2 = _ldx*_ldx + _ldz*_ldz;

        // Far cards: skip the bob/spin/customUpdate work. Animation resumes
        // automatically when the player gets close enough.
        if (_ld2 < _LOOT_ANIM_DIST2){
            c.userData.floatTimer += dt * 2.0;
            const t = c.userData.floatTimer;
            c.position.y = c.userData.basePos + Math.sin(t)*0.18;
            c.rotation.y += dt * (c.userData.cardData.el === 'GOLD_COIN' ? 1.4 : 0.85);
            if(c.userData.customUpdate) c.userData.customUpdate(t);
        }

        // Pickup proximity — uses cached squared distance, branch only if near.
        if(_ld2 < 1.0){
            const name = c.userData.cardName;
            // Audio cue — picks the right synthesized sound based on the
            // item name (lantern click / coin clink / generic chime).
            const _pickupKey = (name && (
                /MAGIC\s*LANTERN/i.test(name) ? 'MAGIC LANTERN' :
                /GOLD/i.test(name)            ? 'GOLD COINS'    :
                                                name
            )) || '';
            _playPickupSound(_pickupKey);
            // Canonical name for the panels deck — keeps "PISTOL" as the
            // internal identifier (every Panels-side `=== 'PISTOL'` check
            // still works) even though the player sees the localized
            // "MAGIC MISSILE" display name.
            const canonicalName = (/MAGIC\s*MISSILE/i.test(name)) ? 'PISTOL' : name;
            window.parent.postMessage({type:'ADD_CARD', card: canonicalName}, '*');
            window.parent.postMessage({type:'LOG_EVENT', logType:'system', text:`Picked up ${name}!`}, '*');
            autoWalkInterrupt = true;
            // MAGIC LANTERN — activate hyper-cinematic flashlight cone
            if(name === 'MAGIC LANTERN') activateMagicLantern();
            c.traverse(o => {
                if(o.geometry) o.geometry.dispose();
                if(o.material){
                    if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
                    else if(o.material !== _sharedGlassBubbleMat) o.material.dispose();
                }
            });
            worldGroup.remove(c);
            lootItems.splice(i, 1);
        }
    }
}

// ── Spawn the 3 starter cards in the entry hallway (legacy black design) ────
// Title/desc/attr are pulled from the localization tables (i18n.js) so any

        def.name  || cardId.toUpperCase().replace(/_/g, ' '),

_loot('ITEM',      spawnX,     spawnZ - 2, 'magic_lantern', '灯');

// ── VFX Helpers ────────────────────────────────────────────────────────────────
// WoW-style themed combat text. `opts`:
//   isPlayerDmg : true  → red, centred screen, BIG (player got hit)
//                 false → green hit on the monster at worldPos
//   crit        : true  → upsized golden CRIT! float
//   element     : 'FIRE'/'WATER'/'EARTH'/'WIND'/'VOID' → tints to that
//                 element's card-deck colour (overrides green)
//   miss        : true  → gray, slower fade ("YOU MISSED" / "DODGED" etc.)
//                 Used by spawnMissText below.
//   label       : optional string to print verbatim (otherwise "-N").
function spawnDamageText(amount, worldPos, isPlayerDmg, opts){
    opts = opts || {};
    const v = worldPos.clone(); v.y += 0.8; v.project(camera);
    let x = (v.x * 0.5 + 0.5) * window.innerWidth;
    let y = (v.y * -0.5 + 0.5) * window.innerHeight;
    const el = document.createElement('div');
    el.className = 'combat-dmg-text';
    if (isPlayerDmg){
        el.classList.add('fct-damage');
        x = window.innerWidth / 2; y = window.innerHeight / 2;
    } else if (opts.miss){
        el.classList.add('fct-miss');
    } else {
        el.classList.add('fct-hit');
        if (opts.crit) el.classList.add('fct-crit');
        if (opts.element) el.classList.add('fct-el-' + opts.element);
    }
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    // Numeric damage gets a minus prefix; pre-formatted strings (DODGED,
    // CRIT!, "🔥12", "🌪20 CRIT") are printed verbatim.
    const n = (typeof amount === 'number') ? amount : Number(amount);
    el.textContent = (typeof opts.label === 'string') ? opts.label
        : (Number.isFinite(n) ? `-${Math.round(n)}` : String(amount));
    document.getElementById('fct-container').appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 1400);
}

// Convenience for whiff / dodge events — gray themed text.
//   kind: 'YOU MISSED' | 'MONSTER MISSED' | 'YOU DODGED' | 'MONSTER DODGED'
//         (or any string — printed verbatim)
//   worldPos: optional. Defaults to player position (centred).
function spawnMissText(kind, worldPos){
    const wp = worldPos || (typeof px === 'number' && typeof pz === 'number'
        ? new THREE.Vector3(px, 1.2, pz)
        : new THREE.Vector3(0, 1.2, 0));
    spawnDamageText(0, wp, false, { miss: true, label: String(kind || 'MISS') });
}
window.spawnMissText = spawnMissText;

// ── Shield state ─────────────────────────────────────────────────────────────
let _shieldActive = false, _shieldTimer = 0;
let _shieldDisc = null; // THREE.Mesh — the in-world shield plane

// ── Monster push-back impulse (collision response on hit) ───────────────────
function _pushMonster(wrapper, strength){
    if(!wrapper) return;
    const dx = wrapper.position.x - camera.position.x;
    const dz = wrapper.position.z - camera.position.z;
    const len = Math.sqrt(dx*dx+dz*dz) || 1;
    // Give the monster's userData an impulse vector; tickMonsterAI drains it
    wrapper.userData._knockImpulseX = (dx/len) * strength;
    wrapper.userData._knockImpulseZ = (dz/len) * strength;
    wrapper.userData._knockT = 0.22; // seconds of knockback
}

// ── 3D WebGL melee VFX — streaking arc planes spawned in world space ─────────
function _spawnMeleeArc(opts){
    // opts: { count, widthFn, heightFn, colorFn, rotFn, ttl, blend, offsetFwdFn }
    const fwd = new THREE.Vector3(Math.sin(rot), 0, -Math.cos(rot));
    const right = new THREE.Vector3(Math.cos(rot), 0, Math.sin(rot));
    const origin = camera.position.clone().addScaledVector(fwd, 0.55);
    origin.y = EYE_HEIGHT * 0.72;
    for(let i=0; i<opts.count; i++){
        const t = opts.count===1 ? 0.5 : i/(opts.count-1);
        const w = opts.widthFn(t), h = opts.heightFn(t);
        const col = opts.colorFn(t);
        const arc = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({
                color:col, transparent:true, opacity:0.88,
                blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
            })
        );
        const sideOffset = opts.sideOffset ? opts.sideOffset(t) : 0;
        arc.position.copy(origin).addScaledVector(right, sideOffset);
        arc.position.addScaledVector(fwd, opts.fwdOffset ? opts.fwdOffset(t) : 0);
        arc.rotation.y = rot + (opts.rotFn ? opts.rotFn(t) : 0);
        arc.rotation.z = opts.tiltFn ? opts.tiltFn(t) : 0;
        scene.add(arc);
        const ttl = opts.ttl || 0.22;
        const delay = (opts.stagger||0)*i;
        let elapsed = -delay;
        const tick = ()=>{
            elapsed += 0.016;
            if(elapsed < 0){ requestAnimationFrame(tick); return; }
            const p = Math.min(1, elapsed/ttl);
            arc.material.opacity = 0.88*(1-p*p);
            arc.position.addScaledVector(fwd, 0.04);
            if(p < 1) requestAnimationFrame(tick);
            else scene.remove(arc);
        };
        requestAnimationFrame(tick);
    }
}

function _spawnMeleeVFX(type){
    const overlay = document.getElementById('slash-overlay');
    const vignette = document.getElementById('blood-vignette');

    if(type === 'SLASH'){
        // Vignette flash
        if(vignette){ vignette.classList.add('active'); setTimeout(()=>vignette.classList.remove('active'),280); }
        // GIANT screen-wide slash — sweeps across the whole viewport so
        // the player sees their swing land even when they're surrounded.
        if (overlay){
            const big = document.createElement('div');
            big.className = 'slash-mark-screen';
            // Random diagonal angle each swing so consecutive hits feel varied
            const angles = ['-22deg', '-14deg', '-30deg', '-18deg', '12deg', '20deg'];
            big.style.setProperty('--r', angles[Math.floor(Math.random()*angles.length)]);
            overlay.appendChild(big);
            setTimeout(() => big.parentNode?.removeChild(big), 500);
        }
        // CSS marks — 3 diagonal slashes
        if(overlay){
            [{r:'-52deg',tx:'-70px',ty:'-55px',h:'175px',d:'0ms'},
             {r:'-38deg',tx:'0px',  ty:'-85px',h:'215px',d:'35ms'},
             {r:'-24deg',tx:'70px', ty:'-55px',h:'175px',d:'70ms'}]
            .forEach(s=>{
                const el=document.createElement('div'); el.className='slash-mark';
                el.style.setProperty('--r',s.r); el.style.setProperty('--tx',s.tx);
                el.style.setProperty('--ty',s.ty); el.style.height=s.h;
                el.style.animationDelay=s.d;
                overlay.appendChild(el); setTimeout(()=>el.parentNode?.removeChild(el),550);
            });
        }
        // 3D WebGL arc fan
        _spawnMeleeArc({
            count:3, ttl:0.20, stagger:0.018,
            widthFn: ()=>0.06,
            heightFn: t=>0.55+t*0.3,
            colorFn:  t=>new THREE.Color().setHSL(0.02, 1.0, 0.75+t*0.2),
            rotFn:    t=>(t-0.5)*0.7,
            tiltFn:   t=>(t-0.5)*0.5,
            sideOffset: t=>(t-0.5)*0.6,
            fwdOffset:  ()=>0.3
        });

    } else if(type === 'THRUST'){
        if(vignette){ vignette.classList.add('active'); setTimeout(()=>vignette.classList.remove('active'),200); }
        if(overlay){
            const el=document.createElement('div'); el.className='thrust-mark';
            el.style.setProperty('--r','0deg'); el.style.setProperty('--tx','0px');
            el.style.setProperty('--ty','-160px'); el.style.setProperty('--h','320px');
            el.style.height='20px';
            overlay.appendChild(el); setTimeout(()=>el.parentNode?.removeChild(el),400);
        }
        // 3D: single elongated forward spike
        _spawnMeleeArc({
            count:1, ttl:0.16, stagger:0,
            widthFn:  ()=>0.045,
            heightFn: ()=>1.1,
            colorFn:  ()=>new THREE.Color(0x99ddff),
            rotFn:    ()=>0,
            tiltFn:   ()=>0,
            fwdOffset: ()=>0.5
        });
        // trailing afterimage
        _spawnMeleeArc({
            count:1, ttl:0.12, stagger:0,
            widthFn:  ()=>0.02,
            heightFn: ()=>0.7,
            colorFn:  ()=>new THREE.Color(0xffffff),
            fwdOffset: ()=>0.6
        });

    } else if(type === 'HEAVY'){
        if(vignette){ vignette.classList.add('active'); setTimeout(()=>vignette.classList.remove('active'),420); }
        // Even bigger sweep for HEAVY — two crossing screen slashes.
        if (overlay){
            for (let i = 0; i < 2; i++){
                const big = document.createElement('div');
                big.className = 'slash-mark-screen';
                big.style.setProperty('--r', i === 0 ? '-28deg' : '18deg');
                big.style.animationDelay = (i * 80) + 'ms';
                big.style.background =
                    'linear-gradient(90deg,' +
                    'rgba(255,255,255,0) 0%,' +
                    'rgba(255,240,200,0.35) 8%,' +

// Keep backward-compat alias
function spawnSlashVFX(){ _spawnMeleeVFX('SLASH'); }

// ── Line-of-sight DDA: returns true if no wall blocks the path a→b ──────────
// Quarter-cell stepping so thin/diagonal walls can't slip between samples.
// Blocks on solid tiles (`wall`), shoji panel walls (`shoji`), and intact
// shoji door panels (an unbroken paper panel is opaque to sight). Broken
// door panels — the player has already smashed through — pass freely.
// DDA grid traversal — visits every cell the ray crosses exactly once, no
// matter how steep or shallow the angle. The previous fixed-step sampler
// (4 samples per grid unit) could skip thin walls on near-diagonal rays,
// which is why monsters in adjacent rooms were "visible" through walls.
// Per-frame LOS memo — same source-cell + dest-cell pair returns the cached
// result instead of re-walking the grid. Cleared once per frame at the top
// of `loop()`. Key is canonicalised (smaller cell first) so LOS(a→b) and
// LOS(b→a) share an entry. With ~30 monsters in a room and several systems
// (targeting, combat visibility, AI brain, spell LOS, monster→player checks)
// each doing per-monster LOS tests, a typical frame computed the same
// (player↔monster) ray 5–10× — this cache deduplicates all of that.
const _losCache = new Map();
function _hasLineOfSight(ax, az, bx, bz){
    const gax = ax/GRID, gaz = az/GRID;
    const gbx = bx/GRID, gbz = bz/GRID;
    let cx = Math.round(gax), cz = Math.round(gaz);
    const endCx = Math.round(gbx), endCz = Math.round(gbz);
    if (cx === endCx && cz === endCz) return true;

    // Cache check — canonical key so direction-agnostic (LOS is symmetric).
    // MAP_W,MAP_H = 128 each → cell coords fit in 7 bits → pack into a Number.
    let _losKey;
    if (cx < endCx || (cx === endCx && cz <= endCz)){
        _losKey = (cx * 0x1000000) + (cz * 0x10000) + (endCx * 0x100) + endCz;
    } else {
        _losKey = (endCx * 0x1000000) + (endCz * 0x10000) + (cx * 0x100) + cz;
    }
    const _losCached = _losCache.get(_losKey);
    if (_losCached !== undefined) return _losCached;

    const ddx = gbx - gax, ddz = gbz - gaz;
    const stepX = ddx > 0 ? 1 : (ddx < 0 ? -1 : 0);
    const stepZ = ddz > 0 ? 1 : (ddz < 0 ? -1 : 0);
    // t-parameter to first cell boundary on each axis. Cell (cx,cz) spans
    // [cx-0.5, cx+0.5] in grid coordinates.
    let tMaxX = (ddx === 0) ? Infinity
              : ((cx + (stepX > 0 ? 0.5 : -0.5)) - gax) / ddx;
    let tMaxZ = (ddz === 0) ? Infinity
              : ((cz + (stepZ > 0 ? 0.5 : -0.5)) - gaz) / ddz;
    const tDeltaX = (ddx === 0) ? Infinity : Math.abs(1 / ddx);
    const tDeltaZ = (ddz === 0) ? Infinity : Math.abs(1 / ddz);

    for (let safety = 0; safety < 400; safety++) {
        if (tMaxX < tMaxZ) { cx += stepX; tMaxX += tDeltaX; }
        else               { cz += stepZ; tMaxZ += tDeltaZ; }
        if (cx === endCx && cz === endCz)              { _losCache.set(_losKey, true);  return true;  }
        if (cx < 0 || cx >= MAP_W || cz < 0 || cz >= MAP_H){ _losCache.set(_losKey, false); return false; }
        const t = map[cx]?.[cz]?.type;
        if (t === 'wall' || t === 'shoji')             { _losCache.set(_losKey, false); return false; }
        if (t === 'shoji_door'){
            const panel = (typeof shojiDoorPanels !== 'undefined')
                ? shojiDoorPanels.find(p => p.cx === cx && p.cz === cz)
                : null;
            if (panel && !panel.broken)                 { _losCache.set(_losKey, false); return false; }
        }
        // Overshot the endpoint — clear line of sight.
        if (Math.min(tMaxX, tMaxZ) > 1 + 0.001)         { _losCache.set(_losKey, true);  return true;  }
    }
    _losCache.set(_losKey, true);
    return true;
}

// ── Melee card executor ───────────────────────────────────────────────────────
// Play the topdown avatar's attack animation once. Falls back to a quick
// crossfade through the walk clip if the GLB doesn't ship an attack track
// (so the avatar still visibly reacts to ANY attack the player fires).
function _playPlayerAttackAnim(){
    if(!playerMixer) return;
    if(playerAttackAction){
        playerAttackAction.reset();
        playerAttackAction.setLoop(THREE.LoopOnce, 1);
        playerAttackAction.clampWhenFinished = false;
        playerAttackAction.timeScale = (() => {
            const dur = playerAttackAction.getClip?.()?.duration ?? 0.7;
            return Math.max(1.0, Math.min(3.0, dur / 0.8));
        })();
        if(playerIdleAction) playerIdleAction.stop();
        if(playerWalkAction) playerWalkAction.stop();
        playerAttackAction.play();
        playerMixer._current = 'attack';
        const realDur = (playerAttackAction.getClip?.()?.duration ?? 0.7)
                       / (playerAttackAction.timeScale || 1);
        const token = (playerMixer._attackT = (playerMixer._attackT||0)+1);
        setTimeout(() => {
            if(playerMixer && playerMixer._current === 'attack' && playerMixer._attackT === token){
                playerMixer._current = null; // next loop tick will crossfade to idle/walk
            }
        }, Math.min(900, realDur * 1000 * 0.85));
        return;
    }
    // No attack clip — flash walk action once as a stand-in body twitch
    if(playerWalkAction){
        playerWalkAction.timeScale = 2.4;
        setTimeout(() => { if(playerWalkAction) playerWalkAction.timeScale = 1.0; }, 200);
    }
}

// ── Procedural elemental SFX (Web Audio) ──────────────────────────────────
// Each card type gets a distinct synthesized sound effect built from
// oscillators + filtered noise so the game doesn't ship audio assets.
// To override with real .wav files later, drop them at /assets/sfx/<EL>.wav
// and replace _playSpellSound with HTMLAudioElement playback.
let _audioCtx = null;
let _audioMuted = false;
function _getAudioCtx(){
    if (!_audioCtx){
        try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            _audioCtx = new Ctx();
        } catch (e){ return null; }
    }
    if (_audioCtx && _audioCtx.state === 'suspended'){
        _audioCtx.resume().catch(()=>{});
    }
    return _audioCtx;
}
// Browsers gate AudioContext until a user gesture — the first KEY_DOWN /
// click resumes the context AND kicks off the ambient music loop.
window.addEventListener('keydown',    () => { _getAudioCtx(); _startBgMusic(); }, { once: true });
window.addEventListener('pointerdown',() => { _getAudioCtx(); _startBgMusic(); }, { once: true });

const _SFX_VOLUME = 0.30;
// ── Ambient dungeon music ─────────────────────────────────────────────────────
// Soft looping bed under everything else. Pinned at half the FX baseline so
// the music sits beneath every action sound — combat / pickups / steps always
// cut through cleanly. Honors _audioMuted via _setBgMusicMuted.
const _BG_MUSIC_VOLUME = _SFX_VOLUME * 0.5;
let _bgMusic = null;
function _startBgMusic(){
    if (_bgMusic || _audioMuted) return;
    try {
        _bgMusic = new Audio('./assets/sounds/Dungeon/spooky-bg-music.mp3');
        _bgMusic.loop = true;
        _bgMusic.volume = _BG_MUSIC_VOLUME;
        const p = _bgMusic.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (_) { _bgMusic = null; }
}
function _setBgMusicMuted(muted){
    if (!_bgMusic) return;
    if (muted) _bgMusic.pause();
    else { const p = _bgMusic.play(); if (p && p.catch) p.catch(()=>{}); }
}
function _whiteNoiseBuffer(ctx, seconds){
    const buf = ctx.createBuffer(1, Math.max(64, ctx.sampleRate * seconds), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
}
// Play a real audio file. Pre-loads on first use and clones the element on
// every play so concurrent fires (multiple missiles in flight) don't cut
// each other off. Silent failure if the user hasn't interacted yet.
const _SFX_FILE_CACHE = new Map();
function _playSfxFile(path, volume){
    if (_audioMuted) return;
    if (!path) return;
    let proto = _SFX_FILE_CACHE.get(path);
    if (!proto){
        proto = new Audio(path);
        proto.preload = 'auto';
        _SFX_FILE_CACHE.set(path, proto);
    }
    try {
        const a = proto.cloneNode();
        a.volume = Math.max(0, Math.min(1, (volume == null ? 0.65 : volume)));
        const p = a.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (_) {}
}
// ── Monster SFX ───────────────────────────────────────────────────────────────
// Spatial falloff (closer monster = louder) + per-monster per-tag throttle so
// a swarm doesn't carpet-bomb the same clip on every cooldown tick.
const _MON_SFX = {
    FOUND:        { path:'./assets/sounds/Monsters/goblin-found.mp3',          baseVol:0.85, throttleMs:1200, globalMs:1200 },
    ATTACK:       { path:'./assets/sounds/Monsters/goblin-attack.mp3',         baseVol:0.70, throttleMs:600,  globalMs:0    },
    ATTACK_QUICK: { path:'./assets/sounds/Monsters/Goblin-attack-quick.mp3',   baseVol:0.75, throttleMs:600,  globalMs:0    },
    IMP_ATTACK:   { path:'./assets/sounds/Monsters/imp-attack.mp3',            baseVol:0.70, throttleMs:600,  globalMs:0    },
    LAUGH:        { path:'./assets/sounds/Monsters/goblin-laugh.mp3',          baseVol:0.65, throttleMs:3500, globalMs:900  },
    CACKLE:       { path:'./assets/sounds/Monsters/Goblin-cackle-with-reverb.mp3', baseVol:0.80, throttleMs:4000, globalMs:1500 },
    DEATH:        { path:'./assets/sounds/Monsters/goblin-death.mp3',          baseVol:0.85, throttleMs:0,    globalMs:450  },
};
const _MON_SFX_GLOBAL_AT = Object.create(null);
function _playMonsterSfx(tag, monBase){
    if (_audioMuted) return;
    const cfg = _MON_SFX[tag]; if (!cfg) return;
    const now = performance.now();
    // Global per-tag cooldown — prevents swarm-overlap (e.g. 5 goblins
    // all shouting FOUND in the same frame when a room alerts together).
    if (cfg.globalMs > 0 && (now - (_MON_SFX_GLOBAL_AT[tag] || 0)) < cfg.globalMs) return;
    const ud = monBase && (monBase.userData || (monBase.parent && monBase.parent.userData));
    // Per-monster per-tag throttle
    if (ud && cfg.throttleMs > 0){
        ud._sfxAt = ud._sfxAt || {};
        if ((now - (ud._sfxAt[tag] || 0)) < cfg.throttleMs) return;
        ud._sfxAt[tag] = now;
    }
    _MON_SFX_GLOBAL_AT[tag] = now;
    // Spatial falloff — more pronounced than a flat near-zone. Closer enemies
    // are LOUDER (boosted up to 1.25× base) and the long-range fade is a
    // smoother squared decay all the way out to 22 tiles. The clamp inside
    // _playSfxFile keeps the final value safely ≤ 1.0.
    //   0-1 tile   → 1.25× base   (in your face)
    //   1-3 tiles  → ease from 1.25 → 1.0
    //   3-22 tiles → squared decay → 0
    //   22+ tiles  → silent (skip the play)
    let vol = cfg.baseVol;
    if (monBase && monBase.position && typeof px === 'number' && typeof pz === 'number'){
        const dx = monBase.position.x - px, dz = monBase.position.z - pz;
        const d  = Math.sqrt(dx*dx + dz*dz) / GRID;
        if (d > 22) return;
        let mul;
        if (d <= 1.0){
            mul = 1.25;
        } else if (d <= 3.0){
            const u = (d - 1.0) / 2.0;       // 0..1 across 1-3 tiles
            mul = 1.25 + (1.00 - 1.25) * u;  // ease 1.25 → 1.0
        } else {
            const u = (d - 3.0) / 19.0;      // 0..1 across 3-22 tiles
            mul = (1 - u) * (1 - u);          // squared decay → 0
        }
        vol *= mul;
    }
    _playSfxFile(cfg.path, vol);
}
function _playSpellSound(element, intensity){
    if (_audioMuted) return;
    const ctx = _getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = _SFX_VOLUME * (intensity || 1);
    master.connect(ctx.destination);
    const el = String(element || '').toUpperCase();

    if (el === 'FIRE' || el === 'FIREBALL' || el === 'PYROBLAST' || el === 'COMET'){
        // Loud BOOM = low sine sweep + bandpass-filtered noise crackle.
        const boom = ctx.createOscillator();
        boom.type = 'sine';
        boom.frequency.setValueAtTime(170, now);
        boom.frequency.exponentialRampToValueAtTime(38, now + 0.65);
        const boomG = ctx.createGain();
        boomG.gain.setValueAtTime(0, now);
        boomG.gain.linearRampToValueAtTime(1.0, now + 0.02);
        boomG.gain.exponentialRampToValueAtTime(0.01, now + 0.75);
        boom.connect(boomG); boomG.connect(master);
        boom.start(now); boom.stop(now + 0.78);

        const noise = ctx.createBufferSource();
        noise.buffer = _whiteNoiseBuffer(ctx, 0.55);
        const filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.value = 1900;
        filt.Q.value = 0.7;
        const nG = ctx.createGain();
        nG.gain.setValueAtTime(0.85, now);
        nG.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        noise.connect(filt); filt.connect(nG); nG.connect(master);
        noise.start(now);
    } else if (el === 'WATER' || el === 'TIDE' || el === 'SURGE'){
        // Splash = a sharp drop "plink" + a hiss of bright ripple noise.
        // 1) the drop: short triangle sweep down (water plop)
        const drop = ctx.createOscillator();
        drop.type = 'triangle';
        drop.frequency.setValueAtTime(900, now);
        drop.frequency.exponentialRampToValueAtTime(180, now + 0.18);
        const dG = ctx.createGain();
        dG.gain.setValueAtTime(0.0, now);
        dG.gain.linearRampToValueAtTime(0.55, now + 0.01);
        dG.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        drop.connect(dG); dG.connect(master);
        drop.start(now); drop.stop(now + 0.24);
        // 2) the spray: highpass-filtered noise bursting out + falling away
        const noise = ctx.createBufferSource();
        noise.buffer = _whiteNoiseBuffer(ctx, 0.85);
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(1200, now);
        hp.frequency.exponentialRampToValueAtTime(4500, now + 0.30);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(8000, now);
        lp.frequency.exponentialRampToValueAtTime(2200, now + 0.7);
        const nG = ctx.createGain();
        nG.gain.setValueAtTime(0.0, now);
        nG.gain.linearRampToValueAtTime(0.85, now + 0.04);
        nG.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
        noise.connect(hp); hp.connect(lp); lp.connect(nG); nG.connect(master);
        noise.start(now);
    } else if (el === 'EARTH' || el === 'BOULDER' || el === 'FISSURE'){
        // Big POUND + sustained rolling rumble.
        // 1) Pound: hard square-wave hit (impact)
        const pound = ctx.createOscillator();
        pound.type = 'square';
        pound.frequency.setValueAtTime(110, now);
        pound.frequency.exponentialRampToValueAtTime(28, now + 0.35);
        const pG = ctx.createGain();
        pG.gain.setValueAtTime(0.0, now);
        pG.gain.linearRampToValueAtTime(1.0, now + 0.005);
        pG.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        pound.connect(pG); pG.connect(master);
        pound.start(now); pound.stop(now + 0.5);
        // 2) Roll: lowpassed brown-ish noise rumbling for 1.4s
        const roll = ctx.createBufferSource();
        roll.buffer = _whiteNoiseBuffer(ctx, 1.5);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 280;
        lp.Q.value = 0.9;
        const rG = ctx.createGain();
        rG.gain.setValueAtTime(0.0, now);
        rG.gain.linearRampToValueAtTime(0.55, now + 0.06);
        rG.gain.exponentialRampToValueAtTime(0.01, now + 1.4);
        roll.connect(lp); lp.connect(rG); rG.connect(master);
        roll.start(now);
        // 3) Sub-thump: very low sine stinger that gives chest-thump
        const sub = ctx.createOscillator();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(48, now);
        sub.frequency.exponentialRampToValueAtTime(28, now + 0.5);
        const sG = ctx.createGain();
        sG.gain.setValueAtTime(0.6, now);
        sG.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        sub.connect(sG); sG.connect(master);
        sub.start(now); sub.stop(now + 0.6);
    } else if (el === 'WIND' || el === 'GALE'){
        // Sustained gushing wind = two layered noise sources, one low rumble
        // (lowpass) and one bright airy howl (bandpass) sweeping pitch up
        // and back down so it really feels like a gust passing.
        // Layer 1 — low rumble
        const low = ctx.createBufferSource();
        low.buffer = _whiteNoiseBuffer(ctx, 1.2);
        const lpL = ctx.createBiquadFilter();
        lpL.type = 'lowpass';
        lpL.frequency.value = 260;
        const lG = ctx.createGain();
        lG.gain.setValueAtTime(0.0, now);
        lG.gain.linearRampToValueAtTime(0.45, now + 0.18);
        lG.gain.linearRampToValueAtTime(0.30, now + 0.85);
        lG.gain.exponentialRampToValueAtTime(0.01, now + 1.20);
        low.connect(lpL); lpL.connect(lG); lG.connect(master);
        low.start(now);
        // Layer 2 — bright airy howl
        const hi = ctx.createBufferSource();
        hi.buffer = _whiteNoiseBuffer(ctx, 1.2);
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(380, now);
        bp.frequency.exponentialRampToValueAtTime(2600, now + 0.55);
        bp.frequency.exponentialRampToValueAtTime(640,  now + 1.10);
        bp.Q.value = 2.4;
        const hG = ctx.createGain();
        hG.gain.setValueAtTime(0.0, now);
        hG.gain.linearRampToValueAtTime(0.65, now + 0.15);
        hG.gain.linearRampToValueAtTime(0.35, now + 0.85);
        hG.gain.exponentialRampToValueAtTime(0.01, now + 1.18);
        hi.connect(bp); bp.connect(hG); hG.connect(master);
        hi.start(now);
    } else if (el === 'KATANA' || el === 'SLASH' || el === 'THRUST' || el === 'HARD ATTACK' || el === 'MELEE'){
        // Metallic ting — triangle slide down.
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(2400, now);
        osc.frequency.exponentialRampToValueAtTime(820, now + 0.16);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.6, now + 0.005);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.20);
        osc.connect(g); g.connect(master);
        osc.start(now); osc.stop(now + 0.22);
    } else if (el === 'SHURIKEN' || el === 'DAGGER'){
        // Spinning thrown-blade whoosh — short filtered noise + tiny ting.
        const noise = ctx.createBufferSource();
        noise.buffer = _whiteNoiseBuffer(ctx, 0.30);
        const filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.value = 1500;
        filt.Q.value = 1.6;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.55, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        noise.connect(filt); filt.connect(g); g.connect(master);
        noise.start(now);
    } else if (el === 'SHORT BOW' || el === 'LONG BOW' || el === 'CROSSBOW' || el === 'ARROW' || el === 'MISSILE'){
        // Arrow in flight — bowstring twang + descending whistle that drops
        // pitch as the arrow speeds away.
        // 1) Twang: short triangle thump (string release)
        const twang = ctx.createOscillator();
        twang.type = 'triangle';
        twang.frequency.setValueAtTime(220, now);
        twang.frequency.exponentialRampToValueAtTime(110, now + 0.10);
        const tG = ctx.createGain();
        tG.gain.setValueAtTime(0.55, now);
        tG.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        twang.connect(tG); tG.connect(master);
        twang.start(now); twang.stop(now + 0.13);
        // 2) Whistle: bandpass-filtered noise + sine sweep down (arrow flight)
        const whistle = ctx.createOscillator();
        whistle.type = 'sine';
        whistle.frequency.setValueAtTime(2400, now + 0.04);
        whistle.frequency.exponentialRampToValueAtTime(700, now + 0.42);
        const wG = ctx.createGain();
        wG.gain.setValueAtTime(0.0, now);
        wG.gain.linearRampToValueAtTime(0.35, now + 0.06);
        wG.gain.exponentialRampToValueAtTime(0.01, now + 0.46);
        whistle.connect(wG); wG.connect(master);
        whistle.start(now + 0.04); whistle.stop(now + 0.48);
        // 3) Air: thin noise behind the whistle for body
        const air = ctx.createBufferSource();
        air.buffer = _whiteNoiseBuffer(ctx, 0.42);
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(1800, now);
        bp.frequency.exponentialRampToValueAtTime(900, now + 0.40);
        bp.Q.value = 1.8;
        const aG = ctx.createGain();
        aG.gain.setValueAtTime(0.32, now);
        aG.gain.exponentialRampToValueAtTime(0.01, now + 0.42);
        air.connect(bp); bp.connect(aG); aG.connect(master);
        air.start(now);
    } else if (el === 'DEFEND' || el === 'SHIELD'){
        // Soft chime — defensive halo.
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.linearRampToValueAtTime(660, now + 0.30);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.40, now + 0.04);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc.connect(g); g.connect(master);
        osc.start(now); osc.stop(now + 0.5);
    } else {
        // Generic spell zap.
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.30);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.30, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(g); g.connect(master);
        osc.start(now); osc.stop(now + 0.35);
    }
}

// ── Pickup sound effects ─────────────────────────────────────────────────
// Short-form synthesized sounds for picking up loot. Same audio context +
// master-volume scaling as _playSpellSound.
function _playPickupSound(itemName){
    if (_audioMuted) return;
    const upper = String(itemName || '').toUpperCase();

    // Real-file pickups: prefer the bundled .mp3s when the asset matches.
    if (upper === 'MAGIC LANTERN'){
        _playSfxFile('./assets/sounds/Dungeon/click.mp3', 0.85);
        return;
    }
    if (upper.includes('GOLD') || upper === 'GOLD COINS' || upper === 'GOLD_COIN'){
        _playSfxFile('./assets/sounds/Dungeon/coins.mp3', 0.80);
        return;
    }
    // PISTOL pickup — racks a fresh magazine so the player hears "loaded".
    // Same file plays again when the card is selected via keyboard so the
    // chk-chk reload is the recognisable signature of this weapon.
    if (upper === 'PISTOL'){
        _playSfxFile('./assets/sounds/Dungeon/reload-pistol.mp3', 0.85);
        return;
    }
    // Default for every other loot card pickup (shuriken, dagger, bow,
    // potion, etc.) — pop.mp3 plays cleanly at moderate volume.
    _playSfxFile('./assets/sounds/Dungeon/pop.mp3', 0.65);
    return;

    // ── Legacy synth fallback below — kept for reference. The early
    // returns above mean it doesn't run any more, but it's left here so
    // a future tweak (e.g. removing pop.mp3) can flip back without the
    // synthesis getting reinvented. ──
    /* eslint-disable no-unreachable */
    const ctx = _getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = _SFX_VOLUME * 0.95;
    master.connect(ctx.destination);

    {
        // Soft bamboo tick — a small wooden tock the player picks up loot
        // with. Three quiet layers stacked: a lowpassed noise transient
        // (the wood impact), a damped triangle body resonance at ~480 Hz
        // (the bamboo "tone"), and a quick higher overtone for the snap.
        // Overall amplitude is well below other SFX so it reads as a
        // relaxing texture, not an alert.
        const SOFT = 0.55; // global soft-multiplier vs other pickup sounds

        // Layer 1 — wood clack (filtered noise burst)
        const clack = ctx.createBufferSource();
        clack.buffer = _whiteNoiseBuffer(ctx, 0.05);
        const clackLP = ctx.createBiquadFilter();
        clackLP.type = 'lowpass';
        clackLP.frequency.value = 1700;
        const clackG = ctx.createGain();
        clackG.gain.setValueAtTime(0.40 * SOFT, now);
        clackG.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        clack.connect(clackLP); clackLP.connect(clackG); clackG.connect(master);
        clack.start(now);

        // Layer 2 — bamboo body resonance (damped triangle)
        const body = ctx.createOscillator();
        body.type = 'triangle';
        body.frequency.setValueAtTime(480, now);
        body.frequency.exponentialRampToValueAtTime(360, now + 0.18);
        const bodyG = ctx.createGain();
        bodyG.gain.setValueAtTime(0.0, now);
        bodyG.gain.linearRampToValueAtTime(0.55 * SOFT, now + 0.006);
        bodyG.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        body.connect(bodyG); bodyG.connect(master);
        body.start(now); body.stop(now + 0.24);

        // Layer 3 — higher overtone for the gentle snap
        const tone = ctx.createOscillator();
        tone.type = 'sine';
        tone.frequency.setValueAtTime(960, now);
        const toneG = ctx.createGain();
        toneG.gain.setValueAtTime(0.0, now);
        toneG.gain.linearRampToValueAtTime(0.20 * SOFT, now + 0.004);
        toneG.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        tone.connect(toneG); toneG.connect(master);
        tone.start(now); tone.stop(now + 0.14);
    }
}

function _executeMeleeCard(cardName, opts = {}){
    const n = (cardName||'').toUpperCase();
    const isHeavy  = /HARD/.test(n);
    const isThrust = /THRUST/.test(n);
    const isDefend = /DEFEND/.test(n);
    const vfxType  = isHeavy ? 'HARD' : isThrust ? 'THRUST' : isDefend ? 'DEFEND' : 'SLASH';
    _playPlayerAttackAnim();
    _playSpellSound(n);
    // Recorded swing on top of the synth thump — only for actual swings.
    if (!isDefend) _playSfxFile('./assets/sounds/Player/player-attack-slash.mp3', 0.75);

    if(isDefend){
        _spawnMeleeVFX('DEFEND');
        addCameraTrauma(0.05);
        window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
            text:'🛡️ Guard raised! Damage reduced by <b>75%</b> for 2 seconds.'},'*');
        return;
    }

    // Track last-used melee action (DEFEND doesn't replace it)
    _lastMeleeAction = cardName;

    // 10-15 ft reach feel. GRID=2 ≈ one tile (~5 ft), so 4.6–5.5 worldunits
    // is the 10-15 ft window. Thrust gets the long end, heavy stays mid.
    const MELEE_RANGE = isHeavy ? 4.6 : isThrust ? 5.5 : 4.8;
    let best=null, bestD=Infinity;

    // If caller provided a target override (auto-aim from panels), prefer it
    const targetOverride = opts && opts.target ? opts.target : null;
    const overrideDmg = (opts && typeof opts.damage === 'number') ? opts.damage : undefined;

    if(targetOverride){
        best = targetOverride;
    } else {
        for(const w of monsterWrappers){
            if(w.userData.isDead) continue;
            const d = camera.position.distanceTo(w.position);
            if(d < MELEE_RANGE && d < bestD){ bestD=d; best=w; }
        }
    }
    // FPV auto-face the target the moment we swing — same easing system the
    // auto-face-attacker code uses, just driven by the player's strike.
    if (best && best.position) _autoFaceOnAttack(best, true);
    // RULE: TAB selector must be on the monster before it can be attacked.
    // Melee picks its own target via the range scan above (doesn't go
    // through _obAutoTarget), so place the lock here once we know who's
    // about to get hit.
    if (best && !best.userData?.isDead) _lockedTarget = best;

    // ── Auto-melee chase ─────────────────────────────────────────────────
    // If the strike is out of melee range, find the nearest live monster
    // within 20 ft (= 4 tiles ≈ 8 world units) and queue an auto-run-and-hit:
    //   • Player auto-turns to face the target
    //   • Walks at AUTO_SPD until within STRIKE_R
    //   • Fires the queued melee card on arrival
    //   • Any player input cancels (movement / turn / escape)
    // Per-frame chase logic lives in the loop block near _autoMeleeChase.
    if (!best && !isDefend) {
        const MELEE_AUTO_REACH = 8.0; // 20 ft (1 tile = 5 ft, GRID = 2 wu)
        let chase = null, chaseD = Infinity;
        for (const w of monsterWrappers) {
            if (w.userData.isDead) continue;
            const d = camera.position.distanceTo(w.position);
            if (d <= MELEE_AUTO_REACH && d < chaseD) { chaseD = d; chase = w; }
        }
        if (chase) {
            _autoMeleeChase = {
                target: chase,
                cardName,
                opts,
                cancelAt: performance.now() + 3500,
            };
            addCameraTrauma(0.06);
            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                text:`⚔ Closing on <b>${chase.userData.name || 'enemy'}</b>… tap any key to stop.`}, '*');
            return; // skip the whiff swing — we'll fire when in range
        }
    }

    _spawnMeleeVFX(vfxType);

    if(isHeavy){
        addCameraTrauma(0.55); triggerHitStop(90);
        for(const w of monsterWrappers){
            if(w.userData.isDead) continue;
            if(camera.position.distanceTo(w.position) < MELEE_RANGE){
                const dmg = overrideDmg !== undefined ? overrideDmg : calcDamage('HARD ATTACK');
                _applyMonsterDamage(w, dmg, 'DEFAULT');
                _pushMonster(w, 4.5);
                _spawnHitBurst(w.position.clone().setY(1.2), 'DEFAULT');
            }
        }
    } else if(best){
        const dmg = overrideDmg !== undefined ? overrideDmg : calcDamage(cardName);
        _applyMonsterDamage(best, dmg, 'DEFAULT');
        _pushMonster(best, isThrust ? 5.5 : 3.0);
        _spawnHitBurst(best.position.clone().setY(1.2), 'DEFAULT');
        addCameraTrauma(isThrust ? 0.28 : 0.22);
        triggerHitStop(isThrust ? 65 : 52);
    } else {
        // Whiff swing — no target in melee range and no chase candidate.
        // Show "YOU MISSED" so the player understands why nothing happened.
        addCameraTrauma(0.08);
        spawnMissText('YOU MISSED');
    }

    // Only post a combat event to Oni-Baba when there's a real target.
    // Auto-shield / whiff swings posted target-less COMBAT_ATTACKs which
    // both Oni-Baba scripts flag with "missing targetId" warnings.
    const tgtId = best?.userData?.id;
    if (tgtId !== undefined && tgtId !== null) {
        window.parent.postMessage({
            type: 'COMBAT_ATTACK',
            action: cardName,
            targetId: tgtId,
            targetHp: best.userData.hp,
        }, '*');
    }
}

function addCameraTrauma(amt){ cameraTrauma=Math.min(cameraTrauma+amt,1.0); }
function triggerHitStop(ms){ hitStopUntil=performance.now()+ms; }

// ── Message Contract ───────────────────────────────────────────────────────────
window.addEventListener('message',e=>{
    if(!e.data) return;
    const d=e.data;
    if(d.type==='KEY_DOWN'){
        keys[d.key]=true;keys[(d.key||'').toLowerCase()]=true;if(d.code)keys[d.code]=true;
        _markPlayerAction();
        // Any keypress while click-to-move is active counts as user
        // interaction → cancel the path. Regular autoWalk (hold-forward)
        // is unaffected by this flag flip since it ticks once and clears.
        if (_clickPath.active) autoWalkInterrupt = true;
        // ESC / M also need to toggle the fullscreen 2D map even when focus is
        // in the panels iframe — direct keydown listener won't fire there.
        if(typeof fsMapOpen !== 'undefined'){
            if(d.key==='Escape' && fsMapOpen){ closeFullMap(); }
            else if(d.key==='m' || d.key==='M'){ fsMapOpen ? closeFullMap() : openFullMap(); }
        }
        // ── TAB cycles target through monsters IN FRONT OF the player.
        //    Forward cone is ±60° (120° total) — anything behind the player
        //    is intentionally skipped. LOS-clear, sorted by distance, locks
        //    a sticky target. Shift+Tab cycles backwards. The lock is the
        //    ONLY source of the on-screen crosshair (no auto-pick).
        if (d.key === 'Tab'){
            const fwdX = Math.sin(rot), fwdZ = -Math.cos(rot);
            const CONE_HALF_RAD = 60 * Math.PI / 180;        // ±60° = 120° cone
            const dotMin        = Math.cos(CONE_HALF_RAD);   // ≈ 0.5
            const eligible = [];
            for (const mw of monsterWrappers){
                if (mw.userData.isDead || !mw.visible) continue;
                const dx = mw.position.x - px, dz = mw.position.z - pz;
                const dist = Math.hypot(dx, dz);
                if (dist < 0.01) continue;
                const dot = (dx/dist)*fwdX + (dz/dist)*fwdZ;
                if (dot < dotMin) continue;                  // skip behind/side
                if (!_hasLineOfSight(px, pz, mw.position.x, mw.position.z)) continue;
                eligible.push(mw);
            }
            if (eligible.length){
                eligible.sort((a, b) => {
                    const da = Math.hypot(a.position.x - px, a.position.z - pz);
                    const db = Math.hypot(b.position.x - px, b.position.z - pz);
                    return da - db;
                });
                let idx = -1;
                if (_lockedTarget){
                    idx = eligible.indexOf(_lockedTarget);
                }
                const dir = d.shift ? -1 : 1;
                idx = (idx + dir + eligible.length) % eligible.length;
                _lockedTarget = eligible[idx];
                // Auto-turn to face the freshly-selected target. force=true
                // so it overrides player rot input until alignment completes.
                if (typeof _autoFaceOnAttack === 'function'){
                    _autoFaceOnAttack(_lockedTarget, true);
                }
                const _ttxt = (typeof window.tLog === 'function')
                    ? window.tLog('target', { name: _lockedTarget.userData.name || 'Goblin' })
                    : `🎯 Target: <b>${_lockedTarget.userData.name || 'Goblin'}</b>`;
                window.parent.postMessage({type:'LOG_EVENT', logType:'system', text:_ttxt}, '*');
            } else if (_lockedTarget){
                // No forward monster + had a lock → release it so the
                // crosshair clears when the player faces away from all enemies.
                _lockedTarget = null;
                const _ntxt = (typeof window.tLog === 'function')
                    ? window.tLog('no-target')
                    : '🎯 No target in view.';
                window.parent.postMessage({type:'LOG_EVENT', logType:'system', text:_ntxt}, '*');
            }
        }
    }
    if(d.type==='KEY_UP'){keys[d.key]=false;keys[(d.key||'').toLowerCase()]=false;if(d.code)keys[d.code]=false;}

    // Panels can inform engine when any sidebar opens/closes — cache locally
    if(d.type==='SIDEBAR_OPEN'){ _sidebarOpen = true; return; }
    if(d.type==='SIDEBAR_CLOSE'){ _sidebarOpen = false; return; }

    // ── Pause toggle ──
    // Panels' ESC handler sends GAME_PAUSE with an explicit `paused` boolean
    // (or no payload for toggle). Engine flips the flag and posts back the
    // current state so panels can keep their overlay in sync. lastT reset
    // so the first un-paused frame doesn't see a stale dt.
    if (d.type === 'GAME_PAUSE'){
        const want = (typeof d.paused === 'boolean') ? d.paused : !_gamePaused;
        if (want !== _gamePaused){
            _gamePaused = want;
            if (!_gamePaused) lastT = performance.now();
            window.parent.postMessage({ type: 'GAME_PAUSE_STATE', paused: _gamePaused }, '*');
        }
        return;
    }

    // ── Haunt assignments from Oni-Baba ──
    // Spirits of goblins killed on prior floors come back to possess the
    // monsters on the current floor. Each assignment boosts HP, aggression
    // and damage scaling on an eligible mob and adds a red aura so the
    // player can see who's haunted.
    if (d.type === 'HAUNT_ASSIGNMENTS'){
        _applyHauntAssignments(d.assignments || []);
        return;
    }

    // ── Save / Load message handlers ──
    if (d.type === 'LIST_SAVES'){
        _broadcastSaveList();
        return;
    }
    if (d.type === 'SAVE_NOW'){
        const ok = _writeSaveSlot(d.name, d.inventory);
        window.parent.postMessage({type:'SAVE_DONE', name: d.name, success: ok}, '*');
        if (ok) _broadcastSaveList();
        return;
    }
    if (d.type === 'DELETE_SAVE'){
        _deleteSaveSlot(d.name);
        _broadcastSaveList();
        return;
    }
    if (d.type === 'LOAD_NOW'){
        const slot = _readSaveSlot(d.name);
        if (!slot){
            window.parent.postMessage({type:'LOG_EVENT', logType:'damage',
                text:`⚠ Save "<b>${d.name}</b>" not found.`}, '*');
            return;
        }
        try {
            sessionStorage.setItem('origami.v8.loadSave', JSON.stringify(slot));
            // Reload the engine iframe on the saved floor — parent owns the
            // reload (same path the descent flow uses) so we just ask.
            window.parent.postMessage({type:'DESCEND_REQUEST', floor: slot.floor}, '*');
            window.parent.postMessage({type:'LOG_EVENT', logType:'system',
                text:`📂 Loading <b>${slot.name}</b> (Floor ${slot.floor})…`}, '*');
        } catch (e){
            console.warn('[save] load-stage failed', e);
            window.parent.postMessage({type:'LOG_EVENT', logType:'damage',
                text:`⚠ Load failed for <b>${d.name}</b>.`}, '*');
        }
        return;
    }

    if(d.type==='PIP_SYNC_RECT'){
        _pipRect={width:d.width,height:d.height,left:d.left,top:d.top,bottom:d.bottom};
        // Position the WRAPPER so both canvases + cinematic overlays follow.
        const pf=document.getElementById('pip-frame');
        if(pf){
            pf.style.display='block';
            pf.style.left=d.left+'px'; pf.style.top=d.top+'px';
            pf.style.width=d.width+'px'; pf.style.height=d.height+'px';
        }
    }
    if(d.type==='PIP_TOGGLE' || (d.type==='FPV_ACTION' && d.action==='MAP')){
        cameraMode = (cameraMode==='fpv') ? 'topdown' : 'fpv';
        modeAlphaTarget = (cameraMode==='topdown') ? 1 : 0;
        window.parent.postMessage({type:'LOG_EVENT',logType:'system',
            text:`🗺 ${cameraMode==='fpv'?'First Person View':'Top-Down View • '+topDownPreset.toUpperCase()}`}, '*');
        _pipPan={x:0,z:0};
        // Slightly increase ambient light when in top-down for better visibility
        try { if (ambientLight) ambientLight.intensity = (cameraMode==='topdown') ? (_baseAmbientIntensity * 1.1) : _baseAmbientIntensity; } catch(e){}
        // Notify parent/UI of camera mode change so Panels can show top-down controls
        try { window.parent.postMessage({ type: 'CAMERA_MODE', mode: cameraMode }, '*'); } catch(e){}
    }
    // OPEN_FULL_MAP message handler REMOVED. Click-to-view is gone from
    // both the PIP canvas and the pip frame. Use the M key or the MAP
    // action button to open/close the fullscreen 2D map.
    if(d.type==='PIP_ZOOM'){_pipLastInteractionTime=Date.now();_pipZoomScale=Math.max(0.4,Math.min(2.0,_pipZoomScale+(d.delta||0)*0.1));_pipSaveState();}
    // T0.23 — Main 3D view zoom via scroll wheel over the FPV area. Adjusts
    // camera.fov within a sane range (35° = narrow telescopic, 100° = wide
    // fish-eye). delta is +1 (wheel down = zoom out) or -1 (wheel up = zoom in).
    if(d.type==='MAIN_ZOOM'){
        const FOV_MIN = 35, FOV_MAX = 100, FOV_STEP = 3;
        camera.fov = Math.max(FOV_MIN, Math.min(FOV_MAX, camera.fov + (d.delta||0) * FOV_STEP));
        camera.updateProjectionMatrix();
    }
    if(d.type==='PIP_ROTATE'){_pipLastInteractionTime=Date.now();_pipRot.theta-=(d.dx||0)*0.01;_pipRot.phi=Math.max(0.1,Math.min(Math.PI/2-0.05,_pipRot.phi-(d.dy||0)*0.01));_pipSaveState();}
    if(d.type==='PIP_PAN'){_pipLastInteractionTime=Date.now();const sp=0.05/(_pipZoomScale||1);_pipPan.x+=-(d.dx||0)*sp*Math.cos(_pipRot.theta)+(d.dy||0)*sp*Math.sin(_pipRot.theta);_pipPan.z+=(d.dx||0)*sp*Math.sin(_pipRot.theta)+(d.dy||0)*sp*Math.cos(_pipRot.theta);_pipSaveState();}
    if(d.type==='PIP_PERSPECTIVE'){
        const p = TOPDOWN_PRESETS[d.preset];
        if(p){
            targetTopDownPitch = p.pitch;
            targetTopDownYaw   = p.yaw;
            topDownPreset = d.preset;
            try { localStorage.setItem('origami.topdownPreset', d.preset); } catch(e){}
            // Picking a preset implicitly switches into top-down view
            if(cameraMode !== 'topdown'){
                cameraMode = 'topdown';
                modeAlphaTarget = 1;
            }
            // Notify parent/UI of camera mode change so Panels can show top-down controls
            try { window.parent.postMessage({ type: 'CAMERA_MODE', mode: cameraMode }, '*'); } catch(e){}
            // Ensure slightly brighter ambient for top-down preset selection
            try { if (ambientLight) ambientLight.intensity = (_baseAmbientIntensity * 1.1); } catch(e){}
            window.parent.postMessage({type:'LOG_EVENT',logType:'system',
                text:`🔭 Camera: ${d.preset.toUpperCase()} angle`}, '*');
        }
    }
    if(d.type==='MOON_PHASE'){
        // Cache for room-event welcome card + Oni-Baba narrative bias.
        window._currentMoonPhase = d.phase || '';
        const ml=document.getElementById('moonphase-label');
        if(ml) ml.textContent=d.phase;
        const mk=document.getElementById('moonphase-kanji');
        if(mk){
            const kanjiByPhase={
                'NEW MOON PHASE':'新月',
                'WAXING CRESCENT MOON PHASE':'三日月',
                'FIRST QUARTER MOON PHASE':'上弦の月',
                'WAXING GIBBOUS MOON PHASE':'十三夜月',
                'FULL MOON PHASE':'満月',
                'WANING GIBBOUS MOON PHASE':'居待月',
                'LAST QUARTER MOON PHASE':'下弦の月',
