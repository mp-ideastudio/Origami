    for (let i = _activeDecals.length - 1; i >= 0; i--){
        const d = _activeDecals[i];
        d.age += dt;
        const t = Math.min(1, d.age / d.life);
        // Hold full opacity for first half, then ease out
        const fade = t < 0.50 ? 1.0 : (1.0 - (t - 0.50) / 0.50);
        d.mesh.material.opacity = d.baseOp * fade;
        if (d.glow) d.glow.intensity = d.glowI0 * fade;
        if (d.age >= d.life){
            scene.remove(d.mesh);
            if (d.glow) scene.remove(d.glow);
            _activeDecals.splice(i, 1);
        }
    }
}

function _spawnHitBurst(pos, el){
    const elCol = EL_COLORS[el] || EL_COLORS.DEFAULT;
    // Burst light — INTENSITY KEPT LOW so it doesn't paint the goblin's
    // PBR material with strong specular reflection. Was 20/6 (looked like
    // the monster was suddenly chrome-plated when struck); now 4/2.4 so
    // the flash registers without blowing out the body texture. Sparks
    // (additive billboards below) provide the bulk of the visual impact.
    const bLight = new THREE.PointLight(elCol.hit, 4, 2.4);
    bLight.position.copy(pos).setY(1.2);
    scene.add(bLight);
    addCameraTrauma(0.35);
    triggerHitStop(80);

    // Particle sparks (cheap instanced planes)
    const SPARKS = 16;
    const spkMat = new THREE.MeshBasicMaterial({
        color: elCol.spark, transparent:true, opacity:0.9,
        blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
    });
    const spkGeo = new THREE.PlaneGeometry(0.12, 0.12);
    const sparks = [];
    for(let k=0; k<SPARKS; k++){
        const m = new THREE.Mesh(spkGeo, spkMat);
        m.position.copy(pos).setY(1.2);
        const theta = Math.random()*Math.PI*2;
        const phi   = Math.random()*Math.PI;
        const spd   = 1.5 + Math.random()*3;
        m._vel = new THREE.Vector3(
            Math.sin(phi)*Math.cos(theta)*spd,
            Math.cos(phi)*spd + 1,
            Math.sin(phi)*Math.sin(theta)*spd
        );
        scene.add(m);
        sparks.push(m);
    }

    // Animate sparks + fade light
    let elapsed = 0;
    const TOTAL = 0.9;
    function animBurst(){
        elapsed += 0.016;
        const t = elapsed / TOTAL;
        bLight.intensity = 20 * (1 - t);
        sparks.forEach(m=>{
            m._vel.y -= 4.5 * 0.016;
            m.position.addScaledVector(m._vel, 0.016);
            m.material.opacity = 0.9 * (1 - t);
        });
        if(elapsed < TOTAL) requestAnimationFrame(animBurst);
        else {
            scene.remove(bLight);
            sparks.forEach(m=>{ scene.remove(m); });
        }
    }
    requestAnimationFrame(animBurst);

    // Water-specific: ripple rings
    if(el === 'WATER'){
        for(let r=0; r<3; r++){
            const rGeo = new THREE.TorusGeometry(0.01, 0.04, 6, 24);
            const rMat = new THREE.MeshBasicMaterial({color:0x00aaff,transparent:true,opacity:0.8,
                blending:THREE.AdditiveBlending,depthWrite:false});
            const rMesh = new THREE.Mesh(rGeo, rMat);
            rMesh.position.copy(pos).setY(0.05);
            rMesh.rotation.x = -Math.PI/2;
            scene.add(rMesh);
            let re = 0;
            const delay = r * 0.12;
            setTimeout(()=>{
                function ripple(){ re+=0.016; const rs=1+re*6; rMesh.scale.setScalar(rs);
                    rMat.opacity=0.8*(1-re/0.6);
                    if(re<0.6) requestAnimationFrame(ripple); else scene.remove(rMesh); }
                requestAnimationFrame(ripple);
            }, delay*1000);
        }
    }

    // Fire-specific: upward flame streaks
    if(el === 'FIRE'){
        for(let f=0; f<6; f++){
            const fGeo = new THREE.PlaneGeometry(0.1, 0.5);
            const fMat = new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:0.8,
                blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
            const fMesh = new THREE.Mesh(fGeo, fMat);
            fMesh.position.copy(pos).setY(0.8);
            fMesh.rotation.y = Math.random()*Math.PI*2;
            scene.add(fMesh);
            let fe=0;
            function flame(){ fe+=0.016; fMesh.position.y+=0.08; fMesh.scale.x*=0.96;
                fMat.opacity=0.8*(1-fe/0.5);
                if(fe<0.5) requestAnimationFrame(flame); else scene.remove(fMesh); }
            setTimeout(()=>requestAnimationFrame(flame), f*30);
        }
    }
}

// ── FPV_ACTION handler: card cast → combat pipeline ──────────────────────
window.addEventListener('message', e=>{
    if(!e.data) return;
    const d = e.data;

    // Aggro room on any attack-type message or combat card
    if(d.type==='PLAYER_ATTACK' || d.type==='COMBAT_ATTACK' ||
       (d.type==='FPV_ACTION' && d.action && !['MAP','BAG','REST','HEAL','VIEW','LOG','WAGER','PARLEY','HIDE','RETREAT','OBSERVE','BET_EVEN','BET_ODD'].includes(d.action))){
        const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
        aggroRoom(map[pgx]?.[pgz]?.roomId);
    }

    // Card names fired as FPV_ACTION → trigger launch pipeline
    if(d.type==='FPV_ACTION' && d.action){
        const action = d.action;
        // Skip non-combat UI actions
        const UI_ONLY = new Set(['MAP','BAG','REST','HEAL','VIEW','LOG','WAGER','PARLEY',
                                  'HIDE','RETREAT','OBSERVE','ATTACK','BET_EVEN','BET_ODD']);
        if(!UI_ONLY.has(action)){
            // Determine melee vs missile vs spell using CardDatabase if available
            let isMelee = false;
            try{
                if(window.CardDatabase && CardDatabase[action] && CardDatabase[action].fx && CardDatabase[action].fx.type){
                    isMelee = CardDatabase[action].fx.type === 'melee';
                } else if(typeof _cardCategory === 'function'){
                    const c = _cardCategory(action);
                    isMelee = (c === 'COMBAT' || c === 'KATANA' || c === 'MELEE');
                } else {
                    const MELEE_FALLBACK = new Set(['SLASH','THRUST','STRONG ATTACK','HEAVY ATTACK','DEFEND']);
                    isMelee = MELEE_FALLBACK.has(action);
                }
            }catch(e){ /* ignore */ }

            const sidebarActive = !!_sidebarOpen;
            if(sidebarActive){
                // When any sidebar is open: always use auto-aim + spell damage
                const overrideDmg = calcSpellDamage(action);
                const target = _obAutoTarget(action, overrideDmg);
                if(isMelee){
                    _executeMeleeCard(action, {target, damage: overrideDmg});
                } else if(_isMissileCard(action)){
                    const recoveryCb = (name) => { window.parent.postMessage({type:'MISSILE_RECOVERED', cardName: name}, '*'); };
                    launchMissile(action, recoveryCb, {damage: overrideDmg, target});
                } else {
                    launchCard(action, {damage: overrideDmg, target});
                }
            } else {
                // Normal behavior
                if(isMelee){
                    _executeMeleeCard(action);
                } else if(_isMissileCard(action)){
                    const recoveryCb = (name) => { window.parent.postMessage({type:'MISSILE_RECOVERED', cardName: name}, '*'); };
                    launchMissile(action, recoveryCb);
                } else {
                    launchCard(action);
                }
            }
        }
        // ATTACK button = repeat the last melee card the player used
        if(action === 'ATTACK'){
            if(_sidebarOpen){
                const overrideDmg = calcSpellDamage(_lastMeleeAction);
                const target = _obAutoTarget(_lastMeleeAction, overrideDmg);
                _executeMeleeCard(_lastMeleeAction, {target, damage: overrideDmg});
            } else {
                _executeMeleeCard(_lastMeleeAction);
            }
        }
    }
});

// ── Game Loop ─────────────────────────────────────────────────────────────────
let lastT=performance.now(), frameCount=0, fpsTimer=0, rollingFt=16.67;
let lastRoomId=-1, lastRoomGx=-1, lastRoomGz=-1;
// One-shot: auto-place the TAB selector on the closest monster within 80 ft
// the very first frame any monster exists. GRID=2wu/tile, 5ft/tile → 80ft
// = 16 tiles = 32 wu. Fires once per session; subsequent locks are user-driven
// (TAB) or the continuous hostile auto-pick further down.
let _didInitialAutoSelect = false;
const _INIT_AUTO_SELECT_R2 = (16 * GRID) * (16 * GRID);   // 80ft in wu²

// Returns true if any live, non-ally monster is in the player's current room.
function _roomHasHostileMonster(){
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    const playerRoom = map[pgx]?.[pgz]?.roomId;
    if(playerRoom === undefined || playerRoom === -1) return false;
    for(const w of monsterWrappers){
        const ud = w.userData;
        if(ud.isDead || ud.isAlly) continue;
        const mgx = Math.round((ud.monBase?.position.x ?? w.position.x)/GRID);
        const mgz = Math.round((ud.monBase?.position.z ?? w.position.z)/GRID);
        const monRoom = ud.aiRoomId ?? map[mgx]?.[mgz]?.roomId;
        if(monRoom === playerRoom) return true;
    }
    return false;
}

// Tame the nearest non-dead, non-ally monster in the player's current room.
function _tamedInRoom(){
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    const playerRoom = map[pgx]?.[pgz]?.roomId;
    if(playerRoom === undefined || playerRoom === -1) return;
    let nearest=null, nearestD=Infinity;
    for(const w of monsterWrappers){
        const ud = w.userData;
        if(ud.isDead || ud.isAlly) continue;
        const monRoom = ud.aiRoomId ?? -1;
        if(monRoom !== playerRoom) continue;
        const d = Math.hypot((ud.monBase?.position.x??w.position.x)-px, (ud.monBase?.position.z??w.position.z)-pz);
        if(d < nearestD){ nearestD=d; nearest=w; }
    }
    if(!nearest) return;
    const ud = nearest.userData;
    ud.isAlly = true;
    ud.isHostile = false;
    ud.aiState = 'idle';
    _monSetAnim(ud, 'idle');
    // Recolour pedestal border blue = ally
    if(ud.pedestalBorder) ud.pedestalBorder.material.color.setHex(0x44aaff);
    window.parent.postMessage({type:'LOG_EVENT',logType:'system',
        text:`🎴 <b>${ud.name||'Monster'}</b> is won over — now your ally!`},'*');
}
let torchPhase=0;
const _tdFwd = new THREE.Vector3(); // reused every frame — avoids allocation
const _tdFwdLookAt = new THREE.Vector3();
const _tdLookAt = new THREE.Vector3();
let _combatCheckTimer = 0;
let _exitShown=false; // tracks whether SHOW_EXIT has been sent
let _descendArmed=false; // edge-trigger: stairs_down → DESCEND_REQUEST once per step-on
let autoMeleeTimer=0; // throttle for bump-attack auto-melee
let _autoMeleeToggle=false; // alternates SLASH ↔ THRUST
let _lastMeleeAction='SLASH'; // tracks last player-fired melee card for ATTACK button
let _autoMeleeChase = null;   // { target, cardName, opts, cancelAt } while chasing
let _lastSentRot=null, _lastSentMoving=null, _rotMsgTimer=0; // postMessage throttle
let _radarMsgTimer = 0;  // radar broadcast throttle (~10 fps)

// Pre-compute the stairs-down tile location (if any) so the radar can
// always point to it without scanning the map every frame.
let _stairsDownPos = null;
for (let _sdx = 0; _sdx < MAP_W && !_stairsDownPos; _sdx++){
    for (let _sdz = 0; _sdz < MAP_H; _sdz++){
        if (map[_sdx]?.[_sdz]?.type === 'stairs_down'){
            _stairsDownPos = { x: _sdx * GRID, z: _sdz * GRID };
            break;
        }
    }
}

// ── Game pause ──
// Toggled by ESC from the panels iframe (AXIOM RULE #1 + pause-on-escape).
// When true, loop() short-circuits after rendering the static scene so
// the world freezes — no AI / spell / mixer / time progression — but the
// frame keeps drawing so the player still sees the dungeon (with the
// PAUSED overlay drawn on top by the panels iframe).
let _gamePaused = false;

function loop(){
    requestAnimationFrame(loop);
    const now=performance.now();
    if(now<hitStopUntil) return; // Hit-stop pause
    const raw=Math.min((now-lastT)/1000,0.05);
    const dt=raw; lastT=now;
    // Hard pause — render the current scene state and bail out before
    // any time-dependent work. `lastT` is updated above so when we
    // resume, the first un-paused frame doesn't see a giant dt.
    if (_gamePaused){
        if (modeAlpha < 0.015){
            const wantComposer = outlinePass.enabled || monOutlinePass.enabled || (bokehPass && bokehPass.enabled);
            if (wantComposer) composer.render(dt);
            else              renderer.render(scene, camera);
        } else {
            renderer.render(scene, topDownCamera);
        }
        return;
    }

    // Reset the per-frame LOS memo — same cell-pair LOS lookups within this
    // frame across different systems (targeting / AI / spells / radar) now
    // hit the cache instead of re-walking the grid.
    _losCache.clear();

    // Advance the ghost-shader clock — one write powers every compiled body
    // shader at once (they share the uniform object reference). Drives the
    // breath pulse + drifting wisps in _applyGhostRim.
    _ghostTimeUniform.value = now * 0.001;

    // Wind-spin override — the GALE vortex catches the player and force-
    // rotates rot for 1-2 turns. Manual input + auto-face are suppressed
    // until the spin expires; camera-roll decays back to level.
    const _spinning = performance.now() < _windSpinUntilT;
    if (_spinning){
        rot += _windSpinRate * dt;
        // Tighten the roll target as the spin nears its end so we land flat.
        const remain = (_windSpinUntilT - performance.now()) / 1000;
        const easeOut = Math.min(1, remain / 0.6);
        _windSpinRoll = Math.sign(_windSpinRate) * 0.16 * easeOut;
    } else {
        // Decay the roll back to neutral whenever the spin is off.
        _windSpinRoll *= Math.max(0, 1 - dt * 5);
    }

    // Rotation — Arrow keys + A/D. Classic FPS layout.
    // Q/E no longer rotate — they strafe (see Movement input below).
    const rotL = keys['ArrowLeft'] ||keys['a']||keys['A']||keys['Numpad4']||keys['4'];
    const rotR = keys['ArrowRight']||keys['d']||keys['D']||keys['Numpad6']||keys['6'];
    if (!_spinning){
        if(rotL) rot-=ROT_SPD*dt;
        if(rotR) rot+=ROT_SPD*dt;
    }

    // T0.20 — Auto-face attacker. Smoothly lerp rot toward the attacker
    // angle when no manual turn input is active. Forward at rot=0 is -Z,
    // so the target rot = atan2(dx, -dz). Auto-face self-cancels after
    // ~0.05 rad alignment or 2s timeout. Player-attack face-targets are
    // marked .force=true — those override player rot input so the FPV
    // actually snaps to the target the player attacked.
    if (_autoFaceTarget && performance.now() < _autoFaceTarget.until && !_spinning){
        const _faceForced = _autoFaceTarget.force === true;
        if ((rotL || rotR) && !_faceForced){
            _autoFaceTarget = null;
        } else {
            const dx = _autoFaceTarget.x - px;
            const dz = _autoFaceTarget.z - pz;
            const wantRot = Math.atan2(dx, -dz);
            let diff = wantRot - rot;
            while (diff >  Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            rot += diff * Math.min(1, dt * 5); // ~0.2s settle
            if (Math.abs(diff) < 0.05) _autoFaceTarget = null;
        }
    } else if (_autoFaceTarget) {
        _autoFaceTarget = null; // expired
    }

    // Movement input — W/S forward/back, A/D strafe left/right.
    const fwd  = keys['ArrowUp']  ||keys['w']||keys['W']||keys['Numpad8']||keys['8'];
    const back = keys['ArrowDown']||keys['s']||keys['S']||keys['Numpad2']||keys['2'];
    const strafeL = keys['a']||keys['A'];
    const strafeR = keys['d']||keys['D'];

    // ── Auto-melee chase ────────────────────────────────────────────────────
    // ATTACK fired out of range → walk toward the target until in range, then
    // swing. Any player input cancels (movement, turn, escape, etc.). Tile-
    // grid canWalk handles wall clipping — we don't carry the player through
    // shoji walls.
    if (_autoMeleeChase){
        const _amc = _autoMeleeChase;
        const _amcUd = _amc.target?.userData;
        const _userInput = fwd || back || rotL || rotR || strafeL || strafeR;
        const _targetDead = !_amcUd || _amcUd.isDead;
        const _timedOut   = performance.now() > _amc.cancelAt;
        if (_userInput || _targetDead || _timedOut){
            _autoMeleeChase = null;
            if (_userInput){
                window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                    text:'⚔ Auto-chase cancelled.'}, '*');
            }
        } else {
            // Steer rot toward the target on the floor plane
            const tdx = _amc.target.position.x - px;
            const tdz = _amc.target.position.z - pz;
            const _dist = Math.sqrt(tdx*tdx + tdz*tdz);
            const wantRot = Math.atan2(tdx, -tdz);
            let diff = wantRot - rot;
            while (diff >  Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            rot += diff * Math.min(1, dt * 7); // snap face quickly
            // Step forward at auto-walk speed unless we're already in range
            const STRIKE_R = 5.0;   // matches longest MELEE_RANGE (THRUST)
            if (_dist > STRIKE_R){
                const yaw = rot;
                const sdx =  Math.sin(yaw) * AUTO_SPD * dt;
                const sdz = -Math.cos(yaw) * AUTO_SPD * dt;
                const nx = px + sdx, nz = pz + sdz;
                if (_canPlayerStand(nx, nz)){ px = nx; pz = nz; isMoving = true; }
                else if (_canPlayerStand(nx, pz)){ px = nx; isMoving = true; }
                else if (_canPlayerStand(px, nz)){ pz = nz; isMoving = true; }
            } else {
                // In range → fire the queued melee strike and clear chase state
                const _queued = _autoMeleeChase;
                _autoMeleeChase = null;
                _executeMeleeCard(_queued.cardName, _queued.opts || {});
            }
        }
    }

    // ── Auto-Walk State Machine ──────────────────────────────────────────────
    // Hold forward >2s → engage auto-walk. Releases or reverse cancels it.
    // BLOCKED entirely while a hostile monster shares the player's room.
    const _monsterBlocking = _roomHasHostileMonster();
    if(_monsterBlocking && autoWalk){
        autoWalk = false;
        window.parent.postMessage({type:'LOG_EVENT',logType:'system',
            text:'⚔️ Auto-walk halted — hostile monster in room!'},'*');
    }
    if(fwd && !_monsterBlocking){
        if(fwdHoldStart === 0) fwdHoldStart = now;
        if(!autoWalk && (now - fwdHoldStart) >= AUTO_WALK_HOLD_MS){
            autoWalk = true;
            window.parent.postMessage({type:'LOG_EVENT',logType:'system',
                text:'⮕ Auto-walk engaged. Tap S/Down or any action to stop.'},'*');
        }
    } else {
        if(_monsterBlocking) fwdHoldStart = 0; // prevent timer accumulating while blocked
        else if(!fwd) fwdHoldStart = 0;
    }
    if(back || autoWalkInterrupt){
        if(autoWalk){
            autoWalk = false;
            window.parent.postMessage({type:'LOG_EVENT',logType:'system',text:'⏹ Auto-walk stopped.'},'*');
        }
        autoWalkInterrupt = false;
    }

    // Step magnitude: faster when auto-walking, normal otherwise
    const moveActive = fwd || back || strafeL || strafeR || autoWalk;
    const speed = (autoWalk && !back) ? AUTO_SPD : MOVE_SPD;
    const step  = speed * dt;
    isMoving = false;

    // ── Click-to-Move tick ────────────────────────────────────────────────────
    // Runs BEFORE the regular movement code so the path-following code can
    // claim the frame's movement (and isMoving). Cancellation conditions are
    // handled inside _tickClickPath (user interaction + monster in view).
    _tickClickPath(dt);

    // ── Smart Collision-Avoiding Move ─────────────────────────────────────────
    // For auto-walk (and ordinary forward), if direct path is blocked, probe
    // small yaw offsets (±18°, ±36°) to slide along walls and gracefully
    // round corners — like a person feeling the wall with their shoulder.
    const tryMove = (sign) => {
        // sign = +1 forward, -1 backward
        const probes = (autoWalk && sign>0)
            ? [0, 0.31, -0.31, 0.63, -0.63]   // straight, ±18°, ±36°
            : [0];                              // manual: only direct path
        for(const off of probes){
            const yaw = rot + off;
            // Compass bearing: forward at rot=0 should be -Z (north).
            const dx =  Math.sin(yaw) * step * sign;
            const dz = -Math.cos(yaw) * step * sign;
            const nx = px + dx, nz = pz + dz;
            // Try diagonal first; fall back to axis-only slide
            if(_canPlayerStand(nx, nz)){ px = nx; pz = nz; isMoving = true; _pipOnPlayerStep(); return true; }
            if(off === 0){ // axis-slide on direct path only
                if(_canPlayerStand(nx, pz)){ px = nx; isMoving = true; }
                if(_canPlayerStand(px, nz)){ pz = nz; isMoving = true; }
                if(isMoving){ _pipOnPlayerStep(); return true; }
            }
        }
        return false;
    };

    if(fwd || autoWalk){
        const moved = tryMove(+1);
        // Auto-walk gives up if it's been blocked for >0.6s straight
        if(autoWalk){
            if(!moved){
                autoWalkBlockedT += dt;
                if(autoWalkBlockedT > 0.6){
                    autoWalk = false;
                    autoWalkBlockedT = 0;
                    window.parent.postMessage({type:'LOG_EVENT',logType:'system',
                        text:'⏹ Auto-walk halted — path blocked.'},'*');
                }
            } else {
                autoWalkBlockedT = 0;
            }
        }
    }
    if(back) tryMove(-1);

    // ── Strafe (A/D) — perpendicular to facing, no probe sliding ───────────
    if(strafeL || strafeR){
        const sign = strafeR ? +1 : -1; // +1 = right, -1 = left
        // Strafe direction: rotate forward vector +90° (CW) for right.
        const yaw = rot + Math.PI/2 * sign;
        const dx =  Math.sin(yaw) * step;
        const dz = -Math.cos(yaw) * step;
        const nx = px + dx, nz = pz + dz;
        if(_canPlayerStand(nx, nz)){ px = nx; pz = nz; isMoving = true; _pipOnPlayerStep(); }
        else {
            // Axis-only slide so you can hug a wall while strafing (or a monster)
            if(_canPlayerStand(nx, pz)){ px = nx; isMoving = true; }
            if(_canPlayerStand(px, nz)){ pz = nz; isMoving = true; }
            if(isMoving) _pipOnPlayerStep();
        }
    }

    // ── Walking cadence ────────────────────────────────────────────────────
    // Phase advances ONLY while moving. When stopped, the phase freezes and
    // we ease the OUTPUT (bobH/bobSway/heelPitch) toward zero so the head
    // doesn't shudder through random sin() values during decay. The old
    // `bobT *= 0.86` path was exactly that bug.
    if(moveActive && isMoving){
        bobT += dt * (2 * Math.PI * STEP_HZ) * (autoWalk ? 1.05 : 1.0);
    }
    const _bobMoving    = moveActive && isMoving;
    const targetBobH    = _bobMoving ? Math.sin(bobT)       * BOB_AMP  : 0;
    const targetBobSway = _bobMoving ? Math.cos(bobT * 0.5) * SWAY_AMP : 0;
    const targetHeel    = _bobMoving ? Math.sin(bobT - 0.4) * 0.010    : 0;
    // Critically-damped ease toward target — crisp during a stride, glassy
    // smooth at the stop, no shudder.
    const _bobEase = Math.min(1, dt * 12);
    bobH    += (targetBobH    - bobH)    * _bobEase;
    bobSway += (targetBobSway - bobSway) * _bobEase;
    bobHeel  = (bobHeel ?? 0) + (targetHeel - (bobHeel ?? 0)) * _bobEase;
    const heelPitch = bobHeel;

    // Camera trauma shake
    let shakeX=0, shakeY=0;
    if(cameraTrauma>0){
        const s=cameraTrauma*cameraTrauma;
        shakeX=(Math.random()-0.5)*s*0.08; shakeY=(Math.random()-0.5)*s*0.06;
        cameraTrauma=Math.max(0,cameraTrauma-dt*3.0);
    }

    // Camera position — push back from walls so the near-plane doesn't clip
    // through and reveal the next room. Doorways get ZERO push (user request:
    // "make all doorways have no collision") — if the player is on a shoji_door
    // tile OR any 8-neighbour of one, wall-push is skipped entirely so nothing
    // grabs the camera as it slides through the threshold.
    let cpx = px + bobSway, cpz = pz;
    const cgxC = Math.round(cpx/GRID), cgzC = Math.round(cpz/GRID);
    let _doorZone = false;
    for(let dx=-1; dx<=1 && !_doorZone; dx++) for(let dz=-1; dz<=1 && !_doorZone; dz++){
        if(map[cgxC+dx]?.[cgzC+dz]?.type === 'shoji_door') _doorZone = true;
    }
    if(!_doorZone){
        // Wall face for an adjacent wall-cell at index k sits at k*GRID ± GRID/2.
        // WALL_PUSH is the safety gap between the camera origin and that face,
        // measured AWAY from the wall. With GRID=2 and camera.near=0.20, a
        // 0.35 gap keeps the near plane comfortably inside the player's tile
        // even at glancing angles — no more peeking through the wall to the
        // next room.
        const WALL_PUSH = 0.35;
        const HALF = GRID / 2;
        if(map[cgxC+1]?.[cgzC]?.type === 'wall') cpx = Math.min(cpx, (cgxC+1)*GRID - HALF - WALL_PUSH);
        if(map[cgxC-1]?.[cgzC]?.type === 'wall') cpx = Math.max(cpx, (cgxC-1)*GRID + HALF + WALL_PUSH);
        if(map[cgxC]?.[cgzC+1]?.type === 'wall') cpz = Math.min(cpz, (cgzC+1)*GRID - HALF - WALL_PUSH);
        if(map[cgxC]?.[cgzC-1]?.type === 'wall') cpz = Math.max(cpz, (cgzC-1)*GRID + HALF + WALL_PUSH);
    }
    camera.position.set(cpx, EYE_HEIGHT - bobH, cpz);
    // Three.js camera default looks down -Z (== NORTH). Compass-bearing rot
    // increases clockwise; three.js Y rotation is CCW. Negate so camera
    // facing matches compass bearing: rot=0→-Z, rot=π/2→+X (east).
    camera.rotation.y = -rot + shakeX;
    // PISTOL recoil tick — spring-damp decay back to zero. dt clamped so a
    // dropped frame can't catapult the camera. Subtracted from pitch so the
    // recoil reads as a barrel kick UP (rotation.x more negative = looking up).
    {
        const _rdt = Math.min(dt, 0.05);
        const accel = -_PISTOL_RECOIL_SPRING * _pistolRecoilPitch
                      -_PISTOL_RECOIL_DAMP   * _pistolRecoilVel;
        _pistolRecoilVel   += accel * _rdt;
        _pistolRecoilPitch += _pistolRecoilVel * _rdt;
        if (Math.abs(_pistolRecoilPitch) < 0.001 && Math.abs(_pistolRecoilVel) < 0.001){
            _pistolRecoilPitch = 0; _pistolRecoilVel = 0;
        }
    }
    camera.rotation.x = -0.04 - heelPitch + shakeY - _pistolRecoilPitch; // step lean + recoil kick
    camera.rotation.z = _windSpinRoll; // banked tilt while spun by GALE; decays to 0

    // Torch flicker — only animate lights within culling distance of camera
    const LANTERN_CULL_DIST = GRID * 9; // ~9 tiles — beyond this, light intensity = 0
    torchPhase += dt * 1.8;
    torchLights.forEach((tl, i) => {
        const lp = tl.parent; // pivot group
        if(lp && lp.position.distanceTo(camera.position) > LANTERN_CULL_DIST){
            if(tl.visible) tl.visible = false; // fully remove from render — saves shader passes
            return;
        }
        if(!tl.visible) tl.visible = true;
        tl.intensity = 2.5
            + Math.sin(torchPhase + i*1.3)   * 0.10
            + Math.sin(torchPhase*1.6 + i)   * 0.05;
    });
    // Magic Lantern — smooth cinematic breathe, no hard random cuts
    if(magicLanternOn){
        const f1 = Math.sin(torchPhase * 0.9)       * 0.04; // very slow swell
        const f2 = Math.sin(torchPhase * 1.7 + 1.1) * 0.02; // tiny second layer
        // Rare ghostly dip: smooth sin trough instead of random cut
        const dipWave = Math.sin(torchPhase * 0.23 + 2.5); // period ~27s
        const dip = dipWave < -0.92 ? (dipWave + 0.92) * 0.18 : 0; // gentle brief dim
        const flick = 1 + f1 + f2 + dip;
        headlamp.intensity       = lanternBaseInt  * flick;
        outerGlow.intensity      = lanternOuterInt * (0.95 + (flick-1)*0.4);
        nearFieldLight.intensity = lanternNearInt  * (0.97 + (flick-1)*0.3);
    }
    // Lantern sway — gentle pendulum from ceiling pivot
    lanterns.forEach(p=>{
        const t=now*0.001*p.userData.swaySpeed + p.userData.swayPhase;
        p.rotation.z=Math.sin(t)*0.08;
        p.rotation.x=Math.cos(t*0.7)*0.05;
    });
    // Loot card float + spin + pickup proximity
    updateLootCards(dt);

    // OniBaba8 integration
    const ob=window.oniBaba8||window.parent?.oniBaba8;
    if(ob){
        if(ob.getFogDensity) scene.fog.density=ob.getFogDensity();
        if(ob.getTorchFlicker){ const f=ob.getTorchFlicker(); if(f!==1){ torchLights.forEach(tl=>{ if(tl.visible && tl.intensity>0) tl.intensity*=f; }); } }
        if(ob.updatePlayerState) ob.updatePlayerState(MAP_W/2,MAP_H/2,px/GRID,pz/GRID,isMoving);
    }

    // Distance-cull monsters beyond 14 tiles — GPU skips their draw calls
    const MONSTER_CULL_DIST = GRID * 14;
    for(const w of monsterWrappers){
        const shouldShow = !w.userData.isDead &&
            Math.hypot(w.position.x - px, w.position.z - pz) < MONSTER_CULL_DIST;
        if(w.visible !== shouldShow) w.visible = shouldShow;
    }

    // Room enter detection
    const cgx=Math.round(px/GRID),cgz=Math.round(pz/GRID);
    if(cgx!==lastRoomGx||cgz!==lastRoomGz){
        lastRoomGx=cgx; lastRoomGz=cgz;
        const cell=map[cgx]?.[cgz];
        if(cell?.roomId!==undefined&&cell.roomId!==lastRoomId){
            lastRoomId=cell.roomId;
            if(ob?.onRoomEnter) ob.onRoomEnter(cell.roomId);
            // ── "Notice the player" reaction ──
            // Every live monster in the room the player just entered stops
            // its current activity for 3 seconds, turns to face the player,
            // and plays its idle anim. Once the timer expires, normal AI
            // resumes — which includes the existing bow-to-peer trigger so
            // adjacent idle goblins bow to each other.
            const _noticeMs = 3000;
            const _noticeAt = performance.now() + _noticeMs;
            let _noticed = 0;
            for (const w of monsterWrappers){
                const ud = w.userData;
                if (!ud || ud.isDead || ud.isAlly) continue;
                // Greeting bow is for peaceful goblins only — hostile, fleeing,
                // chasing or fetching monsters keep doing their thing.
                if (ud.aiState && ud.aiState !== 'idle') continue;
                // Resolve room id lazily if missing
                if (ud.aiRoomId === undefined){
                    const mgx = Math.round(w.position.x/GRID);
                    const mgz = Math.round(w.position.z/GRID);
                    ud.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
                }
                if (ud.aiRoomId !== cell.roomId) continue;
                ud._noticeUntil = _noticeAt;
                ud._noticeStartedAt = performance.now();   // bow-tilt clock
                _noticed++;
            }
            if (_noticed > 0){
                window.parent.postMessage({type:'LOG_EVENT', logType:'system',
                    text:`🙇 ${_noticed} goblin${_noticed===1?'':'s'} turn to face you and bow.`}, '*');
            }
            // Stop auto-walk on room transitions — player should survey new rooms
            if(autoWalk){ autoWalk=false;
                window.parent.postMessage({type:'LOG_EVENT',logType:'system',text:'⏹ Auto-walk paused — new room.'},'*');
            }
            // Log the room entry — room number only, plus the flavor desc.
            const rd = ROOM_DESCRIPTIONS[cell.roomId];
            if(rd){
                window.parent.postMessage({type:'LOG_EVENT',logType:'room',
                    text:`<div class="rm-title">Room ${cell.roomId+1}</div><div class="rm-desc">${rd.desc}</div>`}, '*');
            }
        }
    }

    // ── Exit stairway — show modal only when player is ON the stairs tile ───────
    if(window._stairsUpGx !== undefined){
        const playerTile = map[cgx]?.[cgz]?.type;
        const onStairs = playerTile === 'stairs_up' || playerTile === 'stairs_up_r';
        if(onStairs && !_exitShown){
            _exitShown = true;
            window.parent.postMessage({type:'SHOW_EXIT'},'*');
            window.parent.postMessage({type:'LOG_EVENT', logType:'system',
                text:'🚪 The way out looms before you — iron-bound oak, mossy stone. <b>Exit the dungeon?</b>'},'*');
        } else if(!onStairs && _exitShown){
            _exitShown = false;
            window.parent.postMessage({type:'HIDE_EXIT'},'*');
        }
    }

    // ── Descent — auto-trigger when player steps onto stairs_down ───────────
    // Once per session per stair (stays armed until they leave the tile).
    // Posts DESCEND_REQUEST; the parent fades + reloads the iframe with the
    // new ?floor=N param. L7 has no stairs_down per MapGen, so this only
    // fires on L1-L6.
    {
        const tileNow = map[cgx]?.[cgz]?.type;
        const onDown = tileNow === 'stairs_down';
        if(onDown && !_descendArmed){
            _descendArmed = true;
            const nextFloor = Math.min(7, DUNGEON_LEVEL + 1);
            // Persist HP/karma so they survive the reload
            try {
                sessionStorage.setItem('origami.v8.descent', JSON.stringify({
                    floor: nextFloor,
                    hp: playerHp,
                    maxHp: playerMaxHp,
                    karma: (window.parent?.oniBaba8?.karma ?? window.oniBaba8?.karma ?? 0),
                }));
            } catch(_) {}
            window.parent.postMessage({type:'LOG_EVENT', logType:'karma',
                text:`⬇️ Descending to floor ${nextFloor}...`},'*');
            window.parent.postMessage({type:'DESCEND_REQUEST', floor: nextFloor}, '*');
        } else if(!onDown && _descendArmed){
            _descendArmed = false;
        }
    }

    // Player avatar update (Layer 3)
    // NOTE: playerMixer is in the global `mixers` array and is updated by the
    // forEach loop below — do NOT update it here or the animation runs at 2×.
    // Avatar uses the same compass→three.js flip as the camera (rot is a
    // compass bearing — CW positive; three.js Y rotation is CCW positive).
    // Was `rot` directly, which made the avatar spin OPPOSITE to camera
    // intent in top-down view (pressing right turned the body left).
    playerAvatar.position.set(px,0,pz); playerAvatar.rotation.y=-rot;
    // ── Smooth walk/idle blending (best-practice crossfade) ──────────────
    // Sync walk timeScale to actual ground speed so feet match (no skating).
    if(playerIdleAction && playerWalkAction){
        const FADE = 0.22; // seconds — smooth transition
        // Cycle length tuned for ~1.85 steps/sec at MOVE_SPD; scale linearly
        const refSpeed = MOVE_SPD;
        const curSpeed = isMoving ? (autoWalk ? AUTO_SPD : MOVE_SPD) : 0;
        const targetTS = isMoving ? Math.max(0.6, curSpeed / refSpeed) : 1.0;
        // Smooth timeScale toward target (avoids speed jumps on state change)
        playerWalkAction.timeScale += (targetTS - playerWalkAction.timeScale) * Math.min(1, dt*8);

        // Skip walk/idle blending while attack is mid-flight — its setTimeout
        // resets _current to null when finished, and the next tick picks back up.
        if(playerMixer._current !== 'attack'){
            const wantWalk = isMoving;
            if(wantWalk && playerMixer._current !== 'walk'){
                playerWalkAction.enabled = true;
                playerWalkAction.setLoop(THREE.LoopRepeat, Infinity);
                playerWalkAction.reset();
                playerWalkAction.play();
                if(playerIdleAction.isRunning && playerIdleAction.isRunning()){
                    playerIdleAction.crossFadeTo(playerWalkAction, FADE, true);
                }
                playerMixer._current = 'walk';
            } else if(!wantWalk && playerMixer._current !== 'idle'){
                playerIdleAction.enabled = true;
                playerIdleAction.setLoop(THREE.LoopRepeat, Infinity);
                playerIdleAction.reset();
                playerIdleAction.play();
                if(playerWalkAction.isRunning && playerWalkAction.isRunning()){
                    playerWalkAction.crossFadeTo(playerIdleAction, FADE, true);
                }
                playerMixer._current = 'idle';
            }
        }
    }

    // ── PERF MODE detection ──
    // Tracks heavy-combat frames so the GPU outline pass can collapse to
    // just the locked target (saves N-1 silhouette depth passes). No
    // monsters are hidden — the user found that off-room culling caused
    // stutter + invisible-monster bugs. Aggro count is now CAPPED at 6
    // (see _setMonsterHostile) so the entire dungeon never lights up.
    {
        const _ftBad  = (typeof rollingFt === 'number' && rollingFt > 28);
        const _ftGood = (typeof rollingFt === 'number' && rollingFt < 22);
        const _oniBusy = _oniRenderStress > 0.85;
        let hostileInRoom = 0;
        const _pgx = Math.round(px / GRID), _pgz = Math.round(pz / GRID);
        const _playerRoomId = (map[_pgx]?.[_pgz]?.roomId ?? -1);
        for (const w of monsterWrappers){
            const ud = w.userData;
            if (!ud || ud.isDead) continue;
            if (_playerRoomId !== -1 && ud.aiRoomId === _playerRoomId){
                if (ud.aiState === 'hostile' || ud.aiState === 'chase') hostileInRoom++;
            }
        }
        _perfHostilesInRoom = hostileInRoom;
        if (!_perfMode){
            if (hostileInRoom >= 5 || _ftBad || _oniBusy){
                _perfMode = true;
                _perfGoodFrames = 0;
            }
        } else {
            if (hostileInRoom <= 2 && _ftGood && !_oniBusy){
                _perfGoodFrames++;
                if (_perfGoodFrames > 30) _perfMode = false;
            } else {
                _perfGoodFrames = 0;
            }
        }
    }

    // Mixers update — no per-wrapper skipping any more (off-room cull
    // removed). All mixers tick every frame.
    const mixDt=clock.getDelta();
    mixers.forEach(m=>m.update(mixDt));

    // ── Monster AI + Combat ticks ────────────────────────────────────────────
    tickMonsterAI(dt);
    tickSpells(dt);
    tickTideWaves(dt);
    tickBoulders(dt);
    tickMissiles(dt);
    tickDots(dt);
    tickVortexes(dt);
    _tickDecals(dt);
    _tickBulletHoles(dt);
    _tickBrassCasings(dt);
    _tickDyingMonsters(dt);
    _tickPlayerDeath(dt); // T0.25 — falling-camera death cinematic
    _tickCombatAssist(dt); // T0.27 — auto-shield + auto-melee assist
    _tickShojiDoors(dt);   // breakable shoji panels — shatter when crossed

    // ── Targeting ──
    // Proximity-pick the nearest LOS-clear hostile as the "auto" target.
    // The player's STICKY-LOCKED target (set via TAB) overrides the auto
    // pick, but if another monster is OBVIOUSLY in front of the player —
    // closer AND inside a tight 15° forward cone — that one preempts the
    // lock so the player can react to whoever's actually swinging at them.
    let closestEnemy=null, closestDist=5.0;
    // Track the closest RED (hostile/chase) monster separately — used to
    // auto-acquire a lock when the player has no TAB target yet.
    let closestHostile=null, closestHostileDist=10.0;
    for(const mw of monsterWrappers){
        if(mw.userData.isDead || !mw.visible) continue;
        const ex=mw.position.x/GRID, ez=mw.position.z/GRID;
        const dist=Math.hypot(px/GRID-ex,pz/GRID-ez);
        const losClear = _hasLineOfSight(px, pz, mw.position.x, mw.position.z);
        if (losClear){
            if (dist < closestDist){ closestDist=dist; closestEnemy=mw; }
            const _st = mw.userData.aiState;
            if ((_st === 'hostile' || _st === 'chase') && dist < closestHostileDist){
                closestHostileDist = dist; closestHostile = mw;
            }
        }
    }
    // TAB lock is STICKY — only drop on actual death. Don't drop on
    // !visible (the dying-fade keeps wrapper.visible=true anyway, and a
    // brief hit-stop / push shouldn't unlock the target). The preempt that
    // used to swap the lock to whatever was closest+forward was killing
    // the lock after one hit and is now removed — TAB is the only way to
    // change targets.
    if (_lockedTarget && _lockedTarget.userData.isDead){
        _lockedTarget = null;
    }
    // ── One-shot start-of-game auto-select (80 ft) ──
    // Runs the very first frame any monster wrapper exists. Picks the
    // CLOSEST live monster within 80 ft (16 tiles) regardless of hostile
    // state and locks it so the player starts the game with the TAB
    // selector already on something to fight / face.
    if (!_didInitialAutoSelect && monsterWrappers.length){
        let pick = null, pickD2 = _INIT_AUTO_SELECT_R2;
        for (const mw of monsterWrappers){
            if (mw.userData.isDead || !mw.visible) continue;
            const dx = mw.position.x - px, dz = mw.position.z - pz;
            const d2 = dx*dx + dz*dz;
            if (d2 < pickD2){ pickD2 = d2; pick = mw; }
        }
        if (pick){
            _lockedTarget = pick;
            if (typeof _autoFaceOnAttack === 'function') _autoFaceOnAttack(pick, true);
            const _initTxt = (typeof window.tLog === 'function')
                ? window.tLog('auto-target', { name: pick.userData.name || 'Goblin' })
                : `🎯 Auto-target: <b>${pick.userData.name || 'Goblin'}</b>`;
            window.parent.postMessage({type:'LOG_EVENT', logType:'system', text:_initTxt}, '*');
        }
        _didInitialAutoSelect = true;
    }
    // ── Auto-lock onto red monsters when nothing is locked ──
    // If the player has no current TAB target, automatically lock onto the
    // closest hostile (red) monster within ~10 tiles + clear LOS. The lock
    // is sticky (existing rules), so once acquired it sticks until the
    // monster dies or TAB cycles off. No auto-face here — only TAB triggers
    // the camera snap, since auto-face during exploration would be jarring.
    if (!_lockedTarget && closestHostile){
        _lockedTarget = closestHostile;
        const _atxt = (typeof window.tLog === 'function')
            ? window.tLog('auto-target', { name: _lockedTarget.userData.name || 'Goblin' })
            : `🎯 Auto-target: <b>${_lockedTarget.userData.name || 'Goblin'}</b>`;
        window.parent.postMessage({type:'LOG_EVENT', logType:'system', text:_atxt}, '*');
    }
    const _resolved = _lockedTarget || closestEnemy;
    if(_resolved!==activeTarget){
        activeTarget=_resolved;
        // OutlinePass disabled for monsters — it renders skinned meshes in
        // their BIND POSE (T-pose), not the current animated pose. That was
        // producing the visible cyan double-silhouette wrapped around the
        // real animated body. The red ground reticle + head crosshair are
        // the targeting feedback now; the outline pass was redundant.
        outlinePass.selectedObjects = [];
        outlinePass.enabled = false;
    }
    // Drive the 3D reticle — shows under the TAB-locked target OR, when
    // nothing is locked, softly under the nearest visible enemy so the player
    // always knows which monster will take the next attack.
    // TAB-lock = full red (bright, pulsing fast). Auto-select = amber (dimmer,
    // slower pulse) so the difference reads clearly at a glance.
    if (_targetReticle){
        const reticleTarget  = _lockedTarget || closestEnemy;
        const reticleLocked  = !!_lockedTarget;
        if (reticleTarget && !reticleTarget.userData.isDead){
            _targetReticle.visible = true;
            _targetReticle.position.set(
                reticleTarget.position.x,
                Math.max(0.04, reticleTarget.position.y + 0.04),
                reticleTarget.position.z,
            );
            const rt = performance.now() * 0.001;
            const ud = _targetReticle.userData;
            // Bright white floor-mark for both states — TAB-lock just spins
            // faster + brighter; auto-select is the same shape, dimmer.
            const spinMul  = reticleLocked ? 1.0 : 0.38;
            const opacMul  = reticleLocked ? 1.0 : 0.55;
            if (ud.outer){
                ud.outer.rotation.z =  rt * 0.6 * spinMul;
                ud.outer.material.opacity = 0.95 * opacMul;
            }
            if (ud.inner){
                ud.inner.rotation.z = -rt * 1.4 * spinMul;
                ud.inner.material.opacity = 0.70 * opacMul;
            }
            for (let i = 0; i < ud.ticks.length; i++){
                const a = (i * Math.PI/2) + rt * 0.35 * spinMul;
                const t = ud.ticks[i];
                t.position.set(Math.cos(a) * 1.05, 0.005, Math.sin(a) * 1.05);
                t.rotation.y = -a;
                t.material.opacity = 0.95 * opacMul;
            }
            // Flat crosshair pulse: stays on the ground, no Y bounce
            if (ud.jewel){
                const p = 1 + Math.sin(rt * (reticleLocked ? 4.2 : 1.8)) * 0.10;
                ud.jewel.scale.setScalar(p);
                ud.jewel.position.y = 0.006;
                ud.jewel.rotation.y = rt * 1.0 * spinMul;
                if (ud.jewelBars){
                    for (const b of ud.jewelBars) b.material.opacity = 0.95 * opacMul;
                }
            }
            if (ud.reticleLight){
                ud.reticleLight.intensity = (reticleLocked ? 1.1 : 0.5) + Math.sin(rt * 3.6) * 0.3 * opacMul;
            }
            // Head-crosshair — large red pip floating above the head, always
            // billboarded to the camera. Counter-rotating rings + breathing
            // dot for a "missile-lock" feel.
            if (_headCrosshair){
                _headCrosshair.visible = true;
                _headCrosshair.position.set(
                    reticleTarget.position.x,
                    reticleTarget.position.y + 2.0,
                    reticleTarget.position.z,
                );
                _headCrosshair.lookAt(camera.position);
                const hud = _headCrosshair.userData;
                const hopac = 0.95 * opacMul;
                // Rings counter-rotate around the camera-facing Z axis
                if (hud.ringOuter) hud.ringOuter.rotation.z =  rt * 0.6 * spinMul;
                if (hud.ringInner) hud.ringInner.rotation.z = -rt * 1.4 * spinMul;
                // Slight overall breathing scale so the whole pip pulses
                const breath = 1 + Math.sin(rt * (reticleLocked ? 4.0 : 1.6)) * 0.08;
                _headCrosshair.scale.setScalar(breath);
                // Apply opacity to every child material
                _headCrosshair.children.forEach(c => {
                    if (c.material) c.material.opacity = hopac;
                });
                if (hud.headLight){
                    hud.headLight.intensity = (reticleLocked ? 1.4 : 0.7)
                        + Math.sin(rt * 3.2) * 0.35 * opacMul;
                }
            }
        } else {
            _targetReticle.visible = false;
            if (_headCrosshair) _headCrosshair.visible = false;
        }
    }
    // ── TAB-target rim recolour ──
    // Locked monster's fresnel rim swings to RED at 1.75× strength; all
    // others keep the cyan/teal baseline. Body emissive stays white on
    // every monster so the selector NEVER reads as a color change to the
    // mesh. Edge-triggered via ud._lockHighlight (no per-frame thrash).
    for (const w of monsterWrappers){
        const ud = w.userData;
        if (!ud || ud.isDead) continue;
        const wantLit = (w === _lockedTarget);
        if (ud._lockHighlight === wantLit) continue;
        ud._lockHighlight = wantLit;
        w.traverse(c => {
            if (!c.isMesh || !c.material) return;
            const mats = Array.isArray(c.material) ? c.material : [c.material];
            for (const mat of mats){
                const sh = mat.userData && mat.userData.monShaderRef;
                if (!sh || !sh.uniforms) continue;
                if (wantLit){
                    if (sh.uniforms.uRimColor)    sh.uniforms.uRimColor.value.setRGB(1.00, 0.18, 0.22);
                    if (sh.uniforms.uRimStrength) sh.uniforms.uRimStrength.value = 1.75;
                } else {
                    if (sh.uniforms.uRimColor)    sh.uniforms.uRimColor.value.setRGB(0.25, 0.85, 1.00);
                    if (sh.uniforms.uRimStrength) sh.uniforms.uRimStrength.value = 1.10;
                }
            }
        });
    }
    // Stop auto-walk if any live monster is within 6 world units
    if(autoWalk && closestEnemy && closestDist * GRID < 6){
        autoWalk=false;
        window.parent.postMessage({type:'LOG_EVENT',logType:'system',text:'⏹ Auto-walk stopped — enemy nearby!'},'*');
    }
    // Auto-melee: bump into a monster → alternating SLASH / THRUST.
    // Slowed from 1.2s to 1.8s so each swing reads as a deliberate strike
    // (and so the new big slash VFX has time to fully play out before the
    // next one steps in).
    autoMeleeTimer-=dt;
    if(closestEnemy && closestDist < 1.5/GRID && isMoving && autoMeleeTimer<=0){
        autoMeleeTimer = 1.8;
        const w = monsterWrappers.find(mw=>mw===closestEnemy||mw.userData.monBase===closestEnemy);
        const target = w || closestEnemy;
        if(!target.userData?.isDead){
            // RULE: place the TAB selector on the bump-melee target too.
            _lockedTarget = target;
            _autoMeleeToggle = !_autoMeleeToggle;
            const meleeAction = _autoMeleeToggle ? 'THRUST' : 'SLASH';
            const dmg = calcDamage(meleeAction);
            _applyMonsterDamage(target, dmg, 'DEFAULT');
            _spawnMeleeVFX(meleeAction);
            _pushMonster(target, meleeAction === 'THRUST' ? 5.5 : 3.0);
            _spawnHitBurst(target.position.clone().setY(1.2), 'DEFAULT');
            addCameraTrauma(meleeAction === 'THRUST' ? 0.28 : 0.22);
            triggerHitStop(meleeAction === 'THRUST' ? 65 : 55);
            window.parent.postMessage({
                type:'COMBAT_ATTACK', action:meleeAction, autoMelee:true,
                targetId: target.userData?.id,
                targetHp: target.userData?.hp,
            },'*');
        }
    }

    // ── Visibility check: monster in front of player + clear line-of-sight ──
    // Throttled to ~10fps — LOS raycasting is expensive, doesn't need 60fps.
    // Cone is derived from the camera's live horizontal FOV plus 10° slack on
    // each side (peripheral awareness). At default 75° vfov / 16:9 this works
    // out to ~125° total — anything on or just past screen edges counts as
    // "in front", including when strafing sideways past a monster.
    _combatCheckTimer = (_combatCheckTimer||0) - dt;
    if(_combatCheckTimer <= 0){
    _combatCheckTimer = 0.10; // recheck every 100ms
    {
        const fwdX = Math.sin(rot), fwdZ = -Math.cos(rot);
        const aspect = camera.aspect || (window.innerWidth / window.innerHeight) || (16/9);
        const vfovRad = (camera.fov || 75) * Math.PI / 180;
        const hfovRad = 2 * Math.atan(Math.tan(vfovRad / 2) * aspect);
        const halfConeRad = hfovRad / 2 + (10 * Math.PI / 180); // +10° peripheral slack
        const dotThreshold = Math.cos(halfConeRad); // monster counts if dot >= this
        // Wide 90° persistence cone (±45° of forward) within 14 tiles —
        // any visible monster in this arc keeps the SIDEBAR + EVENT LOG
        // open, no LOS check, no closing on glance-away. Plus a 3-second
        // grace timer: even after the player turns away, the panel stays
        // up until the grace expires so quick spins / camera nudges don't
        // collapse it.
        const persistHalfCone = (90 * Math.PI / 180) / 2;
        const persistDot      = Math.cos(persistHalfCone);
        const persistRange    = 14 * GRID;
        const PERSIST_GRACE_MS = 3000;
        let persistInForward  = false;
        let combatVisible = false;
        let nearestVisible = null;
        let nearestDist = Infinity;
        for(const w of monsterWrappers){
            if(w.userData.isDead || !w.visible) continue;
            const ex = w.position.x - px, ez = w.position.z - pz;
            const dist = Math.sqrt(ex*ex + ez*ez);
            if(dist < 0.01) continue;
            const dot = (ex/dist)*fwdX + (ez/dist)*fwdZ;
            // Narrow 45° persistence: ANY monster forward and close keeps panel
            if (dot >= persistDot && dist <= persistRange) persistInForward = true;
            if(dot >= dotThreshold){
                if(!_hasLineOfSight(px, pz, w.position.x, w.position.z)) continue;
                combatVisible = true;
                if(dist < nearestDist){ nearestDist=dist; nearestVisible=w; }
            }
        }
        // Hold open even on idle when a monster is in the forward cone.
        // We don't promote a "stale" target — just suppress the auto-close.
        if (!combatVisible && persistInForward) combatVisible = true;
        // 3s grace window: if we saw a forward monster recently, keep the
        // sidebar + event log up even if it briefly slipped out of cone
        // (camera nudge, monster step). Tracked on window so the throttle
        // boundary doesn't lose the timestamp.
        const _nowGrace = performance.now();
        if (persistInForward){
            window._lastForwardMonsterT = _nowGrace;
        } else if (!combatVisible && window._lastForwardMonsterT
                   && (_nowGrace - window._lastForwardMonsterT) < PERSIST_GRACE_MS){
            combatVisible = true;
        }
        // T0.13 — Also re-sync the combat panel when the NEAREST target changes
        // (e.g. monster A dies while monster B is still in the player's cone).
        // Previously this `!== _lastCombatVisible` gate suppressed the update,
        // leaving the panel showing the dead monster's stale HP.
        const targetId = nearestVisible ? nearestVisible.userData.id : null;
        if(combatVisible !== _lastCombatVisible || targetId !== _lastCombatTargetId){
            _lastCombatVisible = combatVisible;
            _lastCombatTargetId = targetId;
            if(combatVisible && nearestVisible){
                const ud = nearestVisible.userData;
                window.parent.postMessage({
                    type:'SHOW_COMBAT',
                    health: ud.hp ?? 50,
                    maxHp:  ud.maxHp ?? 50,
                    name:   ud.name ?? 'Yakuza Goblin'
                }, '*');
            } else {
                window.parent.postMessage({type:'HIDE_COMBAT'}, '*');
            }
        }
    }
    } // end throttled combat check

    // Communicate to panels — only when state actually changes (saves ~60-120 postMessage/sec)
    _rotMsgTimer -= dt;
    if(_rotMsgTimer <= 0 && Math.abs(rot - _lastSentRot) > 0.002){
        _rotMsgTimer = 0.033; // cap at ~30fps for compass smoothness
        _lastSentRot = rot;
        window.parent.postMessage({type:'PLAYER_ROT_REALTIME', rot}, '*');
    }
    if(isMoving !== _lastSentMoving){
        _lastSentMoving = isMoving;
        window.parent.postMessage({type:'PLAYER_MOVE_STATE', isMoving}, '*');
    }

    // ── PIP radar ── broadcast monster + stairs blips ~10 fps. Player-relative
    // dx/dz in GRID-units; the panel handler rotates them into player-facing
    // space and clamps to the radar ring.
    _radarMsgTimer -= dt;
    if (_radarMsgTimer <= 0){
        _radarMsgTimer = 0.10;
        const blips = [];
        for (const w of monsterWrappers){
            const ud = w.userData;
            if (!ud || ud.isDead) continue;
            blips.push({
                kind: 'enemy',
                dx: (w.position.x - px) / GRID,
                dz: (w.position.z - pz) / GRID,
            });
        }
        if (_stairsDownPos){
            blips.push({
                kind: 'stairs',
                dx: (_stairsDownPos.x - px) / GRID,
                dz: (_stairsDownPos.z - pz) / GRID,
            });
        }
        window.parent.postMessage({ type: 'RADAR_UPDATE', rot, blips }, '*');
    }

    // ── Top-Down camera animation ───────────────────────────────────────
    // Smoothly ease pitch/yaw toward selected preset, and blend modeAlpha for
    // the FPV↔topdown crossfade. The visible render camera blends position
    // and lookAt from FPV pose to orbital pose using modeAlpha.
    {
        const easeP = Math.min(1, dt * 4.5);
        topDownPitch     += (targetTopDownPitch - topDownPitch) * easeP;
        topDownYaw       += (targetTopDownYaw   - topDownYaw)   * easeP;
        modeAlpha        += (modeAlphaTarget - modeAlpha) * Math.min(1, dt * 3.0);
    }

    // Render — use composer when outline passes OR BokehPass DOF are active,
    // otherwise direct-render to save the extra scene reads.
    if(modeAlpha < 0.015){
        const wantComposer = outlinePass.enabled || monOutlinePass.enabled || (bokehPass && bokehPass.enabled);
        if(wantComposer){
            composer.render(dt);
        } else {
            renderer.render(scene, camera);
        }
    } else {
        // Blended top-down view — lerp pose from FPV cam to orbital pose.
        const t = modeAlpha;
        // Orbital target pose
        const pitchRad = topDownPitch * Math.PI/180;
        const yawRad   = topDownYaw   * Math.PI/180;
        const camY  = TOPDOWN_ORBIT_R * Math.sin(pitchRad);
        const camD  = TOPDOWN_ORBIT_R * Math.cos(pitchRad);
        const tdPosX = px + camD * Math.cos(yawRad);
        const tdPosZ = pz + camD * Math.sin(yawRad);
        // FPV pose
        const fpvPos = camera.position;
        // Blended camera position (smoothstep for nicer ease)
        const ts = t*t*(3-2*t);
        topDownCamera.position.set(
            fpvPos.x + (tdPosX - fpvPos.x) * ts,
            fpvPos.y + (camY   - fpvPos.y) * ts,
            fpvPos.z + (tdPosZ - fpvPos.z) * ts
        );
        // FPV look-at point (1m forward of camera)
        _tdFwd.set(0,0,-1).applyEuler(camera.rotation);
        const fpvLookAt = _tdFwdLookAt.copy(fpvPos).add(_tdFwd);
        _tdLookAt.set(px, 0, pz);
        const lookAt = fpvLookAt.lerp(_tdLookAt, ts);
        topDownCamera.lookAt(lookAt);
        // FOV blend: FPV is 75°, top-down 50° — wide enough that R=45 yields
        // ~10 tiles around the player on the floor. Lerp for buttery feel.
        topDownCamera.fov = 75 + (50 - 75) * ts;
        topDownCamera.updateProjectionMatrix();
        // Hide ceiling once we're meaningfully top-down so rooms read clearly.
        if(t > 0.45) topDownCamera.layers.disable(2);
        else         topDownCamera.layers.enable(2);

        // ── Top-down lighting normalization ──
        // FPV lighting is tuned for a dim dungeon mood — ambient 0.9, fog
        // density 0.0275, dir light low. Viewed from above that becomes a
        // murky black blob: too dark to read room layouts or monster
        // positions. Save current values, lerp them by `ts` toward bright
        // map-friendly numbers, render, then restore. Smoothstep prevents a
        // jarring flash during the FPV↔topdown transition.
        const _fogPrev = scene.fog ? scene.fog.density : 0;
        const _ambPrev = ambientLight ? ambientLight.intensity : 1;
        const _dirPrev = (typeof dirLight !== 'undefined' && dirLight) ? dirLight.intensity : 0;
        if (scene.fog)    scene.fog.density       = _fogPrev * (1 - ts * 0.95);
        if (ambientLight) ambientLight.intensity  = _ambPrev + ts * 1.20;
        if (typeof dirLight !== 'undefined' && dirLight){
            dirLight.intensity = _dirPrev + ts * 0.60;
        }

        renderer.render(scene, topDownCamera);

        // Restore so the next frame's FPV branch (and the PIP send) start
        // from the original mood lighting.
        if (scene.fog)    scene.fog.density      = _fogPrev;
        if (ambientLight) ambientLight.intensity = _ambPrev;
        if (typeof dirLight !== 'undefined' && dirLight) dirLight.intensity = _dirPrev;
    }

    markSeen();
    sendPipFrame(dt); // render topDownCamera → RT → ImageBitmap → Panels
    if(fsMapOpen) drawFullMap();

    // Perf HUD
    frameCount++; fpsTimer+=dt;
    const ft=dt*1000; rollingFt=rollingFt*0.9+ft*0.1;
    if(fpsTimer>=0.5){
        const rt=Math.round(frameCount/fpsTimer), proj=Math.min(999,Math.round(1000/rollingFt));
        const budget=120, pct=Math.min(999,Math.round((rt/budget)*100));
        const rtEl=document.getElementById('hud-rt'),prEl=document.getElementById('hud-proj'),pcEl=document.getElementById('hud-pct'),barEl=document.getElementById('hud-bar');
        if(rtEl) rtEl.textContent=rt; if(prEl) prEl.textContent=proj; if(pcEl) pcEl.textContent=pct;
        const cls=pct>=95?'crit':pct>=75?'warn':'';
        [rtEl,prEl,pcEl].forEach(el=>{if(el)el.className='hud-val '+cls;});
        if(barEl){barEl.style.width=Math.min(100,pct)+'%';barEl.style.background=pct>=95?'linear-gradient(90deg,#ff4455,#ff0022)':pct>=75?'linear-gradient(90deg,#ffcc00,#ff8800)':'linear-gradient(90deg,#00ffc8,#00aaff)';}
        frameCount=0; fpsTimer=0;
        if(ob?.updateRenderStress) ob.updateRenderStress(pct);
        // Mirror Oni-Baba's renderStress sensor back into the engine so the
        // swarm/perf detector can use her judgement (she'd already raised
        // a `render_overload` anomaly at >0.9 — perfMode kicks at 0.85).
        if (ob?.sensors) _oniRenderStress = ob.sensors.renderStress || 0;
        // Surface hostiles-in-room + perfMode for diagnostics / panel HUD.
        window.parent.postMessage({type:'ENGINE8_FRAME', budgetPct:pct,
            perfMode:_perfMode, hostilesInRoom:_perfHostilesInRoom}, '*');
        // T0.26 — Periodic player position emit for Oni-Baba's monitoring
        window.parent.postMessage({
            type: 'PLAYER_POS',
            x: px / GRID, z: pz / GRID, rot,
            isMoving: !!isMoving,
        }, '*');
    }
}

// Signal ready
window.parent.postMessage({type:'ENGINE8_READY',version:8},'*');

// ── Permanent social community declaration ──
// Tell Oni-Baba ONCE at boot that the dungeon's monsters are a living
// community: they wander, bow when they greet, wave at distance, hold
// chat clusters, and pay cross-room visits lasting 1-2 minutes. She uses
// this as a stable assumption when reasoning about the floor's behaviour
// (so spirit reports + haunt assignments respect the social baseline).
window.parent.postMessage({
    type: 'MONSTER_SOCIAL_DECLARED',
    permanent: true,
    features: {
        bowGreetings:        true,
        chatClusters:        true,
        waveAtDistance:      true,
        crossRoomExpeditions:{ enabled: true, durationSec: [60, 120], probability: 0.15 },
        joinExistingChats:   true,
        bowOnRoomEnter:      true,
    },
    floor: (typeof DUNGEON_LEVEL === 'number') ? DUNGEON_LEVEL : 1,
}, '*');

// ── Locale sync ──
// Engine runs in its own iframe so window.currentLang isn't shared with
// Panels. Read the persisted language at boot and listen for changes
// broadcast from Panels (LOCALE_CHANGE postMessage). On change, walk every
// live monster wrapper and refresh ud.name from tMonster(ud.nameKey) so
// the combat panel + log lines show the new language immediately.
try { window.currentLang = localStorage.getItem('origami_lang') || 'en'; } catch (_) { window.currentLang = 'en'; }
window.addEventListener('message', (e) => {
    const d = e.data; if (!d || d.type !== 'LOCALE_CHANGE') return;
    window.currentLang = d.lang || 'en';
    try { localStorage.setItem('origami_lang', window.currentLang); } catch (_){}
    // Re-resolve every monster's display name from its persistent nameKey
    if (typeof monsterWrappers !== 'undefined' && typeof tMonster === 'function'){
        for (const w of monsterWrappers){
            const ud = w.userData;
            if (ud && ud.nameKey) ud.name = tMonster(ud.nameKey);
        }
    }
    // Re-bake every live loot-card face in the new language.
    if (typeof lootItems !== 'undefined' && typeof _relocalizeLootCard === 'function'){
        for (const c of lootItems) _relocalizeLootCard(c);
    }
});
// Tell the panels which floor we're on so the HUD badge can update
window.parent.postMessage({type:'FLOOR_UPDATE',floor:DUNGEON_LEVEL,maxFloor:7},'*');
// T0.25 — Initial player stats sync so the sidebar HP bar reflects starting state
_syncPlayerStats();
// L7 throne arrival — Oni-Baba narrates the moment the player crosses into
// her sanctum. Three lines stagger in (300/900/1500ms) so it reads as a real
// arrival, not a single fire-and-forget log entry. Form is karma-driven:
// dragon (cruel runs), naga (merciful runs), enraged (mid).
if(DUNGEON_LEVEL === 7){
    const ob = window.parent?.oniBaba8 || window.oniBaba8;
    const k  = ob?.karma ?? 0;
    const form = k <= -50 ? 'dragon' : k >= 50 ? 'naga' : 'oni';
    const intro = form === 'dragon'
        ? '🐉 The vault doors slam shut. <b>The Black Dragon coils around her throne.</b>'
        : form === 'naga'
        ? '🐉 White silk pools across the marble. <b>The White Naga rises, smiling.</b>'
        : '🐉 The torches dim. <b>Oni-Baba, the Dragon Princess, sits her throne of bone.</b>';
    const middle = form === 'dragon'
        ? '"You came at last, little murderer. I wondered how long it would take."'
        : form === 'naga'
        ? '"Mercy made flesh. Come closer, child — let me see your spirit."'
        : '"Climb the seven steps. Show me what manner of soul has reached me."';
    const tail = '🏯 You stand at the threshold of the throne. Floor 7. <b>There is no descent from here.</b>';
    setTimeout(() => window.parent.postMessage({type:'LOG_EVENT', logType:'karma',  text: intro },  '*'),  300);
    setTimeout(() => window.parent.postMessage({type:'LOG_EVENT', logType:'karma',  text: middle}, '*'),  900);
    setTimeout(() => window.parent.postMessage({type:'LOG_EVENT', logType:'system', text: tail  }, '*'), 1500);
    if(ob && typeof ob._speak === 'function'){
        ob.lastSpoke = 0; // try her own line too — bonus if it fires
        const speakKey = form === 'dragon' ? 'dragon_chaos' : form === 'naga' ? 'naga_blessed' : 'enraged';
        setTimeout(() => ob._speak(speakKey), 2200);
    }
}
console.log('🎴 Origami Engine v8 — legacy port complete, dungeon built, loop starting');
</script>
