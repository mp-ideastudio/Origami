        for (const m of w.mist){
            // Per-mist phase based on its seed + time so they don't move in lockstep
            const ph = (age * 1.4 + m.userData.seed) % 1.0;
            const x  = (m.userData.seed - 0.5) * _TIDE_WAVE_W * 0.7;
            const z  = _TIDE_WAVE_DEPTH * 0.55 + ph * 1.8;
            const y  = 1.1 + Math.sin(ph * 6.28 + m.userData.seed * 4.0) * 0.35 + ph * 0.6;
            m.position.set(x, y, z);
            m.material.opacity = 0.55 * (1 - ph) * w.surface.material.uniforms.uBirth.value;
        }

        // Per-monster hit check — project monster offset onto the wave's
        // forward axis. World position of the wave is its group origin; the
        // leading face is _TIDE_WAVE_DEPTH/2 ahead of that.
        const frontX = w.group.position.x + w.dir.x * (_TIDE_WAVE_DEPTH * 0.45);
        const frontZ = w.group.position.z + w.dir.z * (_TIDE_WAVE_DEPTH * 0.45);
        for (const mw of monsterWrappers){
            if (mw.userData.isDead) continue;
            if (w.damagedSet.has(mw)) continue;
            const dx = mw.position.x - frontX;
            const dz = mw.position.z - frontZ;
            const along = dx * w.dir.x + dz * w.dir.z;
            const perp  = dx * (-w.dir.z) + dz * w.dir.x;
            if (Math.abs(along) < _TIDE_HIT_HALFLEN && Math.abs(perp) < _TIDE_WAVE_W * 0.48){
                w.damagedSet.add(mw);
                // 4d20 + 38 (range 42-158) — matches BOULDER's slam exactly.
                // Sidestep threshold dropped so the wave reliably connects.
                const d1 = 1 + Math.floor(Math.random()*20);
                const d2 = 1 + Math.floor(Math.random()*20);
                const d3 = 1 + Math.floor(Math.random()*20);
                const d4 = 1 + Math.floor(Math.random()*20);
                const roll = d1 + d2 + d3 + d4 + 38;
                if (roll < 50){
                    spawnMissText('MONSTER DODGED', mw.position.clone());
                    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                        text:`${mw.userData.name||'Goblin'} sidesteps the tide.`},'*');
                } else {
                    _applyMonsterDamage(mw, roll, 'WATER');
                    mw.userData.slowUntil = performance.now() + 4000;
                    _spawnMonsterSplash(mw, w.dir);
                }
            }
        }

        // Trigger fade once we've covered the design distance. Spawn the
        // post-evaporate blue light bloom at the wave's final position so
        // there's a luminous afterglow once the water dissolves.
        if (!w.fading && w.travelled >= _TIDE_WAVE_MAX){
            w.fading = true;
            const bloomAt = w.group.position.clone();
            // Place the bloom forward of the last position so it sits where
            // the leading face was — not where the trailing tail was.
            bloomAt.x += w.dir.x * (_TIDE_WAVE_DEPTH * 0.45);
            bloomAt.z += w.dir.z * (_TIDE_WAVE_DEPTH * 0.45);
            w.bloom = _spawnWaveBloom(bloomAt);
        }
    }
}

// ── Spell wall-impact FX library ────────────────────────────────────────────
// When a spell orb hits a wall (instead of a monster), spawn an element-
// appropriate dissipation effect: sparks for fire, debris for earth, gusts
// for wind, droplets+evap for water. The hit dir is used as the bounce
// surface normal (-dir points back into open space).
function _spawnWallImpactFire(pos, dir){
    // Sparks bursting away from the wall + bright bloom that fades.
    addCameraTrauma(0.18);
    // Scorch the floor at the impact point
    _spawnFloorDecal(pos, 'scorch', { rOuter: 0.75, life: 9 });
    const bloom = new THREE.PointLight(0xff7a30, 14, 6.5, 1.8);
    bloom.position.copy(pos).setY(pos.y || 1.2);
    scene.add(bloom);
    const sparks = [];
    const back = dir.clone().multiplyScalar(-1).normalize();
    for (let i = 0; i < 22; i++){
        const s = new THREE.Mesh(
            new THREE.PlaneGeometry(0.12, 0.12),
            new THREE.MeshBasicMaterial({
                color: 0xffd066, transparent: true, opacity: 0.95,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
            })
        );
        s.position.copy(pos).setY(pos.y || 1.2);
        // Velocity: cone biased away from wall + random scatter + upward
        const v = back.clone().multiplyScalar(2.0 + Math.random() * 2.5);
        v.x += (Math.random() - 0.5) * 2.2;
        v.y += 1.5 + Math.random() * 2.0;
        v.z += (Math.random() - 0.5) * 2.2;
        s.userData.vel = v;
        scene.add(s); sparks.push(s);
    }
    let age = 0; const life = 0.22; // tighter, more "photo-real" snap
    (function tick(){
        const dt2 = 0.016;
        age += dt2;
        const t = age / life;
        bloom.intensity = 14 * Math.max(0, 1 - t);
        for (const s of sparks){
            s.userData.vel.y -= 7.5 * dt2;
            s.position.addScaledVector(s.userData.vel, dt2);
            s.material.opacity = 0.95 * Math.max(0, 1 - t);
        }
        if (age < life) requestAnimationFrame(tick);
        else {
            scene.remove(bloom);
            for (const s of sparks) scene.remove(s);
        }
    })();
}

function _spawnWallImpactEarth(pos, dir){
    // Rock fragments tumble outward from wall, hit floor, settle briefly, fade.
    addCameraTrauma(0.22);
    _spawnFloorDecal(pos, 'crack', { rOuter: 0.65, life: 11 });
    _spawnFloorDecal(pos, 'dust',  { rOuter: 1.0, life: 1.6 });
    const dust = new THREE.PointLight(0x9b8770, 8, 5.5, 2.0);
    dust.position.copy(pos).setY((pos.y || 1.2));
    scene.add(dust);
    const back = dir.clone().multiplyScalar(-1).normalize();
    const rocks = [];
    for (let i = 0; i < 14; i++){
        const sz = 0.08 + Math.random() * 0.08;
        const r = new THREE.Mesh(
            new THREE.IcosahedronGeometry(sz, 0),
            new THREE.MeshLambertMaterial({
                color: new THREE.Color().setHSL(0.08, 0.18, 0.30 + Math.random()*0.10),
                transparent: true, opacity: 1.0,
            })
        );
        r.material.userData.baseOpacity = 1.0;
        r.position.copy(pos).setY((pos.y || 1.2));
        const v = back.clone().multiplyScalar(1.5 + Math.random() * 2.0);
        v.x += (Math.random() - 0.5) * 1.8;
        v.y += 1.0 + Math.random() * 1.8;
        v.z += (Math.random() - 0.5) * 1.8;
        r.userData.vel = v;
        r.userData.spin = new THREE.Vector3(
            (Math.random()-0.5)*8, (Math.random()-0.5)*8, (Math.random()-0.5)*8
        );
        scene.add(r); rocks.push(r);
    }
    let age = 0; const life = 0.50;    // rocks visible (was 1.6 — tightened)
    const fadeT = 0.15;                // last 0.15s = fade
    (function tick(){
        const dt2 = 0.016;
        age += dt2;
        dust.intensity = 8 * Math.max(0, 1 - age / 0.6);
        for (const r of rocks){
            r.userData.vel.y -= 11.5 * dt2;
            r.position.addScaledVector(r.userData.vel, dt2);
            if (r.position.y < 0.10){
                r.position.y = 0.10;
                r.userData.vel.y *= -0.30;   // light bounce
                r.userData.vel.x *= 0.65;
                r.userData.vel.z *= 0.65;
            }
            r.rotation.x += r.userData.spin.x * dt2;
            r.rotation.y += r.userData.spin.y * dt2;
            r.rotation.z += r.userData.spin.z * dt2;
            if (age > life - fadeT){
                const f = (age - (life - fadeT)) / fadeT;
                r.material.opacity = 1.0 * Math.max(0, 1 - f);
            }
        }
        if (age < life) requestAnimationFrame(tick);
        else {
            scene.remove(dust);
            for (const r of rocks) scene.remove(r);
        }
    })();
}

function _spawnWallImpactWind(pos, dir){
    // Wind streaks radiate away from the wall, dispersing in a gust ring.
    addCameraTrauma(0.10);
    _spawnFloorDecal(pos, 'dust', { rOuter: 1.10, life: 2.4 });
    const back = dir.clone().multiplyScalar(-1).normalize();
    // Long thin streak quads — like motion-blur trails of air rushing out
    const streaks = [];
    for (let i = 0; i < 12; i++){
        const cyl = new THREE.Mesh(
            new THREE.CylinderGeometry(0.025, 0.025, 0.55, 5, 1, true),
            new THREE.MeshBasicMaterial({
                color: 0xeef6ff, transparent: true, opacity: 0.85,
                blending: THREE.AdditiveBlending, depthWrite: false,
            })
        );
        cyl.position.copy(pos).setY((pos.y || 1.2));
        // Direction: away from wall + scattered cone
        const v = back.clone().multiplyScalar(4.5 + Math.random() * 3.0);
        v.x += (Math.random() - 0.5) * 4.0;
        v.y += (Math.random() - 0.5) * 2.5;
        v.z += (Math.random() - 0.5) * 4.0;
        cyl.userData.vel = v;
        // Orient cylinder long axis along velocity
        const tangent = v.clone().normalize();
        cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
        scene.add(cyl); streaks.push(cyl);
    }
    // Outward gust ring (additive halo expanding from impact)
    const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.32, 36),
        new THREE.MeshBasicMaterial({
            color: 0xcadfee, transparent: true, opacity: 0.7,
            blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
        })
    );
    ring.position.copy(pos).setY((pos.y || 1.2));
    // Ring's normal aligned with -dir so it faces away from wall
    ring.lookAt(pos.clone().add(back));
    scene.add(ring);
    let age = 0; const life = 0.20; // snap-quick wind dispersal
    (function tick(){
        const dt2 = 0.016;
        age += dt2;
        const t = age / life;
        for (const s of streaks){
            s.position.addScaledVector(s.userData.vel, dt2);
            // Slight upward drift as the gust rises
            s.userData.vel.y += 1.2 * dt2;
            s.material.opacity = 0.85 * Math.max(0, 1 - t * 1.2);
            const grow = 1.0 + t * 1.4;
            s.scale.set(1, grow, 1);
        }
        ring.scale.setScalar(1 + t * 4.0);
        ring.material.opacity = 0.7 * Math.max(0, 1 - t);
        if (age < life) requestAnimationFrame(tick);
        else {
            scene.remove(ring);
            for (const s of streaks) scene.remove(s);
        }
    })();
}

function _spawnWallImpactWater(pos, dir){
    // Liquidy splash: bright droplets arc out + a slow steam/evap fade.
    addCameraTrauma(0.10);
    _spawnFloorDecal(pos, 'wet', { rOuter: 0.85, life: 5.5 });
    const back = dir.clone().multiplyScalar(-1).normalize();
    const splash = new THREE.PointLight(0x66ccff, 9, 5.5, 1.8);
    splash.position.copy(pos).setY((pos.y || 1.2));
    scene.add(splash);
    // Droplets — actual sphere drops with arc + gravity (they're falling water)
    const drops = [];
    for (let i = 0; i < 18; i++){
        const d = new THREE.Mesh(
            new THREE.SphereGeometry(0.06 + Math.random()*0.05, 8, 6),
            new THREE.MeshPhongMaterial({
                color: 0x88ddff,
                emissive: 0x224a6a,
                emissiveIntensity: 0.6,
                specular: 0xffffff,
                shininess: 80,
                transparent: true, opacity: 0.92,
                depthWrite: false,
            })
        );
        d.material.userData.baseOpacity = 0.92;
        d.position.copy(pos).setY((pos.y || 1.2));
        const v = back.clone().multiplyScalar(2.0 + Math.random() * 2.5);
        v.x += (Math.random() - 0.5) * 2.5;
        v.y += 2.0 + Math.random() * 2.0;
        v.z += (Math.random() - 0.5) * 2.5;
        d.userData.vel = v;
        scene.add(d); drops.push(d);
    }
    // Evaporative wisps (additive soft spheres rising slowly)
    const wisps = [];
    for (let i = 0; i < 6; i++){
        const w = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 10, 8),
            new THREE.MeshBasicMaterial({
                color: 0xbfe8ff, transparent: true, opacity: 0.55,
                blending: THREE.AdditiveBlending, depthWrite: false,
            })
        );
        w.position.copy(pos).setY((pos.y || 1.2));
        w.userData.vel = new THREE.Vector3(
            back.x * 0.4 + (Math.random()-0.5) * 0.6,
            0.55 + Math.random() * 0.35,
            back.z * 0.4 + (Math.random()-0.5) * 0.6
        );
        scene.add(w); wisps.push(w);
    }
    let age = 0; const life = 0.28; // photoreal pacing — tight evap
    (function tick(){
        const dt2 = 0.016;
        age += dt2;
        const t = age / life;
        splash.intensity = 9 * Math.max(0, 1 - t * 1.6);
        for (const d of drops){
            d.userData.vel.y -= 11.5 * dt2;
            d.position.addScaledVector(d.userData.vel, dt2);
            if (d.position.y < 0.05){
                // Liquidy evaporative fade — accelerate alpha once it lands
                d.material.opacity *= Math.max(0, 1 - dt2 * 12.0);
                d.position.y = 0.05;
                d.userData.vel.set(0, 0, 0);
                d.scale.multiplyScalar(1.0 + dt2 * 0.8); // gentle puddle spread
            } else {
                d.material.opacity = 0.92 * Math.max(0, 1 - t);
            }
        }
        for (const w of wisps){
            w.position.addScaledVector(w.userData.vel, dt2);
            // Wisps swell + fade — evaporation visual
            const grow = 1.0 + t * 1.6;
            w.scale.setScalar(grow);
            w.material.opacity = 0.55 * Math.max(0, 1 - t);
        }
        if (age < life) requestAnimationFrame(tick);
        else {
            scene.remove(splash);
            for (const d of drops) scene.remove(d);
            for (const w of wisps) scene.remove(w);
        }
    })();
}

// Dispatch by element. dir = spell travel direction at impact.
function _spawnWallImpactByElement(pos, dir, el){
    const E = (el || '').toUpperCase();
    if (E === 'FIRE')      _spawnWallImpactFire(pos, dir);
    else if (E === 'EARTH') _spawnWallImpactEarth(pos, dir);
    else if (E === 'WIND')  _spawnWallImpactWind(pos, dir);
    else if (E === 'WATER') _spawnWallImpactWater(pos, dir);
    else                    _spawnWallImpactWind(pos, dir); // graceful fallback
}

function tickSpells(dt){
    for(let i = activeSpells.length-1; i >= 0; i--){
        const s = activeSpells[i];
        s.conjureT += dt;

        // Drive the inner-icon animation (fluid wave / tornado spin / fire
        // flame swirl / rock bob) via the per-element animUpdate registered
        // by _buildSpellBall. Falls back gracefully if the ball doesn't have one.
        const _ballGroup = s.group.children[0]; // _buildSpellBall returns a group inside conjureGroup
        const _innerAnim = _ballGroup && _ballGroup.userData && _ballGroup.userData.animUpdate;
        const _animT     = performance.now() * 0.001;
        if (_innerAnim) _innerAnim(_animT);

        if(s.state === 'conjure'){
            // Slow, steady rotation — conjuring ball floats in front of player.
            // The inner 3D model self-animates via animUpdate (called above).
            s.spinRate = Math.min(4.5, s.spinRate + dt * 1.8);
            s.group.rotation.y += s.spinRate * dt * 0.4;
            const scl = Math.min(1, s.conjureT * 4);
            s.group.scale.setScalar(scl);
            s.conjureLight.intensity = 4 + Math.sin(s.conjureT * 3) * 1.2;
            if(s.conjureT >= 0.65){ s.state = 'streak'; s.streakT = 0; }

        } else if(s.state === 'streak'){
            s.streakT += dt;
            // WATER orbs travel a short fixed distance then crash to the floor
            // and birth the wave — no homing, no chase. Other spells streak
            // faster the longer they're airborne. CYCLONE travels at a steady
            // pace (no acceleration) so it feels deliberate as it navigates.
            const spd = s.isWaterWave
                ? 14
                : s.isCyclone
                    ? 9
                    : 12 + s.streakT * 20;
            const step = spd * dt;

            // ── CYCLONE: waypoint steering ──────────────────────────────────
            // Navigate A* waypoints instead of homing straight at the target.
            // When no waypoints remain (target is adjacent), fall through to
            // normal target-chase for the final approach.
            if (s.isCyclone && s.cycloneWaypoints && s.cycloneWpIdx < s.cycloneWaypoints.length){
                const wp = s.cycloneWaypoints[s.cycloneWpIdx];
                const toWpX = wp.x - s.group.position.x;
                const toWpZ = wp.z - s.group.position.z;
                const toWpLen = Math.hypot(toWpX, toWpZ) || 1;
                const toWp = new THREE.Vector3(toWpX / toWpLen, 0, toWpZ / toWpLen);
                // Strong steering — cyclone commits hard to its path
                s.dir.lerp(toWp, Math.min(0.55, dt * 14)).normalize();
                // Keep level (wind spell flies at waist height)
                s.dir.y = 0; s.dir.normalize();
                // Advance to next waypoint when close enough
                const dist2d = Math.hypot(toWpX, toWpZ);
                if (dist2d < GRID * 0.45) s.cycloneWpIdx++;
            } else if(s.target && !s.target.userData.isDead){
                // ── Normal homing ───────────────────────────────────────────
                if (s.isWaterWave){
                    const dx = s.target.position.x - s.group.position.x;
                    const dz = s.target.position.z - s.group.position.z;
                    const ln = Math.hypot(dx, dz) || 1;
                    const hd = new THREE.Vector3(dx/ln, 0, dz/ln);
                    s.dir.lerp(hd, Math.min(0.10, dt * 3)).normalize();
                } else {
                    const aimPt = s.target.position.clone().setY(s.target.position.y + 1.0);
                    const toAim = aimPt.sub(s.group.position).normalize();
                    s.dir.lerp(toAim, Math.min(0.20, dt * 6)).normalize();
                }
            }
            s.group.position.addScaledVector(s.dir, step);
            s.travelled += step;
            // WATER arc: ease the orb DOWN to the floor as it travels its
            // single tile. ease-in (t²) so it punches into the ground rather
            // than floating gracefully.
            if (s.isWaterWave){
                const t = Math.min(1, s.travelled / GRID);
                const y0 = s.castY != null ? s.castY : s.group.position.y;
                if (s.castY == null) s.castY = y0;
                s.group.position.y = s.castY + (0.10 - s.castY) * (t * t);
            }

            // Outer orb tumbles a bit during streak; the inner loot icon
            // continues its own self-animation through animUpdate. FIRE
            // uses a much slower roll so the camera-billboarded flame
            // petals don't blur into a spinning carousel.
            s.group.rotation.y += (s.isFire ? 1.5 : 9) * dt;
            s.group.scale.setScalar(1 + s.streakT * 0.3);
            if (s.outlineRing){
                // FIRE: hide the outline ring entirely — the layered flame
                // halos already provide a much richer silhouette.
                if (s.isFire) s.outlineRing.visible = false;
                else          s.outlineRing.rotation.z += 15 * dt;
            }

            s.conjureLight.position.copy(s.group.position);
            s.conjureLight.intensity = s.isFire ? 14 : 8;
            if (s.isFire) s.conjureLight.color.setHex(0xffaa30);

            // ── Fireball trail: spawn a glare puff every ~25 ms, advance & cull
            if (s.isFire && s.fbTrail){
                s.fbTrailAcc += dt;
                while (s.fbTrailAcc >= 0.025){
                    s.fbTrailAcc -= 0.025;
                    s.fbTrail.push(_spawnFireballTrailPuff(s.group.position));
                }
                _tickFireballTrail(s.fbTrail, dt);
            }

            // Hit detection
            let hit = false;
            // Wall hit — spell orbs cannot penetrate walls/shoji. Spawn an
            // element-appropriate dissipation FX and consume the spell with
            // no monster damage. WATER orbs handle 1-tile drop separately;
            // its wave-stage door-bust is handled in tickTideWaves.
            // CYCLONE: A* path avoids solid walls; it blasts through shoji
            // doors with circular debris and keeps going.
            let wallHit = false;
            if (!s.isWaterWave){
                const _sgx = Math.round(s.group.position.x / GRID);
                const _sgz = Math.round(s.group.position.z / GRID);
                const _cell = map[_sgx]?.[_sgz];
                if (_cell && (_cell.type === 'wall' || _cell.type === 'shoji')){
                    if (!s.isCyclone){
                        wallHit = true;
                        hit     = true;
                        s.target = null;
                    } else {
                        // ── CYCLONE bounces off solid walls ──
                        // Was a no-op ("shouldn't happen on a valid A* path"),
                        // which let the orb tunnel deeper into the wall each
                        // frame until _SPELL_MAX_DIST silently consumed it.
                        // Now: detect blocked axis, mirror that component of
                        // s.dir, snap back out of the wall, add random jitter
                        // so parallel walls don't ping-pong forever, and clear
                        // the now-stale A* path so target-homing takes over.
                        const prevX = s.group.position.x - s.dir.x * step;
                        const prevZ = s.group.position.z - s.dir.z * step;
                        const _prevGx = Math.round(prevX / GRID);
                        const _prevGz = Math.round(prevZ / GRID);
                        const xCell = map[_sgx]?.[_prevGz];
                        const zCell = map[_prevGx]?.[_sgz];
                        const xBlocked = xCell && (xCell.type === 'wall' || xCell.type === 'shoji');
                        const zBlocked = zCell && (zCell.type === 'wall' || zCell.type === 'shoji');
                        if (xBlocked) s.dir.x *= -1;
                        if (zBlocked) s.dir.z *= -1;
                        // Diagonal corner-cut where neither cardinal cell is
                        // blocked but the diagonal target is — reverse both.
                        if (!xBlocked && !zBlocked){
                            s.dir.x *= -1;
                            s.dir.z *= -1;
                        }
                        // ±~23° random jitter so back-and-forth bouncing
                        // between parallel walls breaks after a few hops.
                        const _jitter = (Math.random() - 0.5) * 0.8;
                        const _cj = Math.cos(_jitter), _sj = Math.sin(_jitter);
                        const _rdx = s.dir.x * _cj - s.dir.z * _sj;
                        const _rdz = s.dir.x * _sj + s.dir.z * _cj;
                        s.dir.x = _rdx; s.dir.z = _rdz;
                        s.dir.y = 0; s.dir.normalize();
                        // Snap back to the pre-step position — that was the
                        // last cell outside the wall. The reversed s.dir
                        // will carry the orb cleanly away from the wall on
                        // the NEXT step, so no extra push-back needed here.
                        s.group.position.x = prevX;
                        s.group.position.z = prevZ;
                        // Invalidate the A* path — it was computed from the
                        // pre-bounce origin and is no longer valid. The
                        // target-homing fallback below will re-aim the orb
                        // at the original target after each bounce.
                        s.cycloneWaypoints = null;
                        s.cycloneWpIdx = 0;
                        // Small camera nudge so the bounce reads as an event
                        addCameraTrauma(0.10);
                    }
                } else if (_cell && _cell.type === 'shoji_door'){
                    const _panel = (typeof shojiDoorPanels !== 'undefined')
                        ? shojiDoorPanels.find(p => p.cx === _sgx && p.cz === _sgz && !p.broken)
                        : null;
                    if (_panel){
                        if (s.isCyclone){
                            // Cyclone blasts the door apart in a spinning burst and continues.
                            _cycloneShatterShoji(_panel, s.group.position.clone());
                        } else {
                            // All other spells bust the door open on impact then
                            // fizzle — door break plays its standard reaction FX.
                            _breakShojiPanel(_panel);
                            wallHit = true; hit = true; s.target = null;
                        }
                    }
                }
            }
            if (s.isWaterWave){
                // WATER always slams the floor at 1 tile out — no chase, no
                // contact-with-monster trigger. The wave does the killing.
                if (s.travelled >= GRID){
                    hit = true;
                    s.group.position.y = 0;       // lock to floor
                    s.dir.y = 0; s.dir.normalize(); // flatten so wave sweeps horizontally
                    s.target = null;
                }
            } else if (!wallHit && s.target && !s.target.userData.isDead){
                if(s.group.position.distanceTo(s.target.position) < 1.2) hit = true;
            } else if (!wallHit && s.travelled > _SPELL_MAX_DIST){
                hit = true; s.target = null;
            }

            if(hit){
                scene.remove(s.group);
                scene.remove(s.conjureLight);
                if (wallHit){
                    // Spell broke against a wall — element-specific dissipation,
                    // no monster damage, no aoe wave.
                    _spawnWallImpactByElement(s.group.position.clone(), s.dir.clone(), s.el);
                } else if(s.isWaterWave){
                    // TIDE / SURGE — orb impact spawns the photoreal-ish water
                    // wave that sweeps forward through every monster in its
                    // path for ~80 feet. Per-monster damage rolls handle the
                    // dodge / slow logic.
                    _spawnTideWave(s.group.position.clone(), s.dir.clone());
                } else if(s.isGale && s.target){
                    // GALE vortex — 20-50 burst, DoT every 0.6s, locks the
                    // target spinning in a wind column for 1-3 turns (~3-9s).
                    _spawnGaleVortex(s.target);
                    if (typeof _pipTriggerReverseCut === 'function'){
                        _pipTriggerReverseCut(s.target);
                    }
                } else if(s.target){
                    _applyMonsterDamage(s.target, s.dmg, s.el);
                    if(s.isFire){
                        _applyFireDot(s.target, s.dmg);
                        _addFireballFlames(s.target);
                    }
                    // PIP reverse-cut close-up of the monster getting struck
                    if (typeof _pipTriggerReverseCut === 'function'){
                        _pipTriggerReverseCut(s.target);
                    }
                }
                // FIRE gets its photoreal bloom + spark shower; WATER's
                // _spawnTideWave plays its own orb-birth burst so the generic
                // hit burst is suppressed for it. Wall hits get their own
                // dedicated FX above. Everything else uses _spawnHitBurst.
                if (!wallHit){
                    if (s.isFire){
                        _spawnFireballImpact(s.group.position.clone());
                    } else if (!s.isWaterWave){
                        _spawnHitBurst(s.group.position.clone(), s.el);
                    }
                }
                // Let any remaining trail puffs fade naturally — drain them
                // out by leaving them in the scene until their own life ends.
                if (s.fbTrail && s.fbTrail.length){
                    const orphan = s.fbTrail;
                    (function drain(){
                        if (!orphan.length) return;
                        _tickFireballTrail(orphan, 0.016);
                        if (orphan.length) requestAnimationFrame(drain);
                    })();
                }
                activeSpells.splice(i, 1);
            }
        }
    }
}

// T0.17 — Monster-death loot pool, weighted toward SHURIKEN so players have a
// steady stream of throwing stars (the user's stated design goal: "constant
// flow"). Roughly 70% of monster kills drop something; of those drops,
// SHURIKEN takes 55% — far more common than any other weapon.
function _rollMonsterLoot(){
    if(Math.random() > 0.70) return null; // 30% drop nothing
    const r = Math.random();
    if(r < 0.55) return { catId:'MISSILE', title:'SHURIKEN',  desc:'Throwing star', kanji:'投', attr:'(DMG*1DICE)' };
    if(r < 0.68) return { catId:'MISSILE', title:'DAGGER',    desc:'Quick blade',   kanji:'刃', attr:'(DMG*1DICE)' };
    if(r < 0.78) return { catId:'MISSILE', title:'SHORT BOW', desc:'Light bow',     kanji:'弓', attr:'(DMG*2DICE)' };
    if(r < 0.84) return { catId:'MISSILE', title:'LONG BOW',  desc:'Heavy bow',     kanji:'長弓', attr:'(DMG*3DICE)' };
    if(r < 0.90) return { catId:'EARTH',   title:'BOULDER',   desc:'Heavy impact',  kanji:'地', attr:'(STUN*2DICE)' };
    if(r < 0.94) return { catId:'FIRE',    title:'FIREBALL',  desc:'Inferno star',  kanji:'火', attr:'(DMG*4DICE)' };
    if(r < 0.97) return { catId:'WATER',   title:'TIDE',      desc:'Washes away',   kanji:'水', attr:'(SLOW*3DICE)' };
    return                { catId:'WIND',   title:'CYCLONE',   desc:'Seeks & spins', kanji:'旋', attr:'(SPIN*3DICE)' };
}

function _applyMonsterDamage(w, dmg, el){
    const ud = w.userData;
    // ── Aggro cascade: hit monster + adjacent peers (capped at 6) ──
    // User rule: ANY monster attacked in a room goes hostile, AND any
    // adjacent monster (same room OR within ADJ_TILES of the hit monster)
    // goes hostile too. Each hostile monster then chases the player
    // INDEPENDENTLY via tickMonsterAI's per-monster A* — no formation /
    // wait-for-peer behaviour. The cap in _setMonsterHostile (6) prevents
    // the entire floor from lighting up.
    if(!ud.isDead){
        if(ud.aiState !== 'hostile') _setMonsterHostile(w);
        if (typeof _alertRoom === 'function') _alertRoom(w);
        const ADJ_TILES = 4;                                  // "adjacent" = within 4 tiles
        const ADJ_R2    = (ADJ_TILES * GRID) * (ADJ_TILES * GRID);
        const hitRoomId = ud.aiRoomId;
        const candidates = [];
        for (const peer of monsterWrappers){
            if (peer === w) continue;
            const pud = peer.userData;
            if (!pud || pud.isDead || pud.isAlly) continue;
            if (pud.aiState === 'hostile' || pud.aiState === 'chase') continue;
            const dx = peer.position.x - w.position.x;
            const dz = peer.position.z - w.position.z;
            const d2 = dx*dx + dz*dz;
            const sameRoom = (hitRoomId !== undefined && hitRoomId !== -1 &&
                              pud.aiRoomId === hitRoomId);
            const adjacent = (d2 <= ADJ_R2);
            if (!sameRoom && !adjacent) continue;
            candidates.push({ peer, d2 });
        }
        candidates.sort((a, b) => a.d2 - b.d2);
        for (const c of candidates) _setMonsterHostile(c.peer);
    }
    // Element-vs-vulnerability scaling. Spells deal 20-80 base; vuln widens or
    // shrinks that by archetype. Missiles / melee land here too but they use
    // 'DEFAULT' which maps to 1.0× for every archetype.
    const vulnTbl = ud.vulnerability;
    // Resist floor — even a strongly-resisted spell still hits harder than a
    // shuriken's average, so spells never feel underpowered against their
    // weakest matchup. Multiplier clamped to [0.70, 2.00].
    let vulnMod = vulnTbl ? (vulnTbl[el] ?? vulnTbl.DEFAULT ?? 1.0) : 1.0;
    vulnMod = Math.max(0.70, Math.min(2.00, vulnMod));
    const scaledDmg = Math.max(1, Math.round(dmg * vulnMod));
    // T0.26 — Route through Oni-Baba's combat brain
    const resolved = _oniBabaResolveCombat({
        kind: 'player_to_monster',
        baseDmg: scaledDmg,
        cardName: el,
        element: el,
        targetId: ud.id,
        sourceName: 'player',
    });
    if (resolved.dodged){
        spawnMissText('MONSTER DODGED', w.position.clone());
        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
            text:`The Hive anticipated! <b>${ud.name||'Goblin'} dodged</b>.`},'*');
        return;
    }
    const finalDmg = resolved.final;
    const hpBefore = ud.hp ?? 50;
    ud.hp = Math.max(0, hpBefore - finalDmg);
    const maxHp = ud.maxHp ?? 50;
    // Reassign the parameter so the rest of the function uses the resolved value
    dmg = finalDmg;
    // WoW-themed hit text: green by default, element-tinted for spell hits,
    // bigger golden CRIT! float on critical strikes.
    const _elKey = (typeof el === 'string' && /^(FIRE|WATER|EARTH|WIND|VOID)$/.test(el)) ? el : null;
    spawnDamageText(dmg, w.position.clone(), false, {
        crit: !!resolved.isCrit,
        element: _elKey,
    });
    if (resolved.isCrit){
        const critPos = w.position.clone(); critPos.y += 1.6;
        spawnDamageText('CRIT!', critPos, false, { crit: true, label: 'CRIT!' });
    }
    _applyElementalBodyFX(w, el);

    // Persistent slash streak on the body so the player SEES every hit
    // register, even mid-swarm. Random position + angle each call so
    // they layer up nicely on a chained combo.
    if (typeof _spawnHitStreakOnMonster === 'function') _spawnHitStreakOnMonster(w);

    // Lop-off chance — paper-origami goblins shed an arm/limb on hit.
    // Crit doubles the chance. Element matters less than raw force, so
    // SLASH/HEAVY (DEFAULT) are most likely; spell hits keep a baseline.
    if (typeof _maybeLopOffLimb === 'function'){
        const baseChance = (el === 'DEFAULT') ? 0.18 : 0.08;
        const finalChance = resolved.isCrit ? baseChance * 2 : baseChance;
        if (Math.random() < finalChance) _maybeLopOffLimb(w);
    }

    // ── Underworld Haiku — every player attack pulls a haiku from the
    // struck monster. Throttled per-monster to ~2.5s so a rapid hit chain
    // doesn't spam the event log (the panel can't render fast enough to
    // make a 5-haiku burst readable anyway).
    if (!ud.isDead){
        const _now = performance.now();
        ud._lastHaikuT = ud._lastHaikuT || 0;
        if (_now - ud._lastHaikuT > 2500){
            ud._lastHaikuT = _now;
            window.parent.postMessage({
                type: 'MONSTER_HAIKU',
                name: ud.name || 'Yakuza Goblin',
                id: ud.id,
            }, '*');
        }
    }
    // Vulnerability flavour: >1.2 = "WEAK!", <0.8 = "resisted"
    let vulnTag = '';
    if (vulnMod >= 1.2) vulnTag = ' <span style="color:#ff8a00">WEAK!</span>';
    else if (vulnMod <= 0.8) vulnTag = ' <span style="color:#88aaff">resisted</span>';
    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
        text:`${el} hits ${ud.name||'Goblin'} for <b>${dmg}</b> damage!${vulnTag}${resolved.isCrit?' <span style="color:#ffe066">CRIT!</span>':''}`},'*');

    if(ud.hp <= 0){
        ud.isDead = true;
        // Death cry — fire BEFORE the wrapper lookup so we always have position
        const _deathW = monsterWrappers.find(mw => mw.userData === ud);
        if (_deathW) _playMonsterSfx('DEATH', _deathW);
        // Cleanup the anger bloom light if it was attached
        if(ud.aggroLight){
            const w = _deathW || monsterWrappers.find(mw => mw.userData === ud);
            if(w) w.remove(ud.aggroLight);
            ud.aggroLight = null;
        }
        const wasFleeing = ud.aiState === 'flee';
        const cName = ud.name || 'Goblin';
        const karmaHit = wasFleeing ? 2 : 1;
        const karmaMsg = wasFleeing
            ? `💀 <b>${cName}</b> is slain while fleeing. <span style="color:#ff6b7a">−2 Karma</span>`
            : `⚔ <b>${cName}</b> is defeated. <span style="color:#ff9966">−1 Karma</span>`;
        window.parent.postMessage({type:'LOG_EVENT', logType:'loot', text: karmaMsg},'*');
        window.parent.postMessage({type:'SYNC_UI', event:'MONSTER_DEATH', id:ud.id},'*');
        // Notify OniBaba — standard -1; extra -1 for killing a fleeing monster
        window.parent.postMessage({type:'MONSTER_DEATH', id:ud.id},'*');
        if(wasFleeing) window.parent.postMessage({type:'MONSTER_DEATH', id:ud.id, extra:true},'*');

        // ── Spirit report ──
        // The goblin's "spirit" carries everything its brain learned back
        // to Oni-Baba. She accumulates these so the L7 throne fight can
        // dramatize the debrief ("they all saw you weak in the second
        // room" etc.). Includes brain memories + final death context.
        try {
            const _brain = ud.brain || {};
            const _now = performance.now() / 1000;
            window.parent.postMessage({
                type: 'MONSTER_SPIRIT_REPORT',
                id: ud.id,
                name: ud.name || 'Yakuza Goblin',
                archetype: ud.personality?.archetype || null,
                floor: DUNGEON_LEVEL,
                lifespan: _now - (_brain.spawnedAt || _now),
                wasFleeing,
                memories: {
                    playerSightings: _brain.playerSightings || 0,
                    firstSeenPlayer: _brain.firstSeenPlayer,
                    lastSeenPlayer:  _brain.lastSeenPlayer,
                    lastPlayerHpSeen: _brain.lastPlayerHpSeen,
                    peersWitnessedDead: _brain.peersWitnessedDead || 0,
                    roomsVisited: Object.keys(_brain.roomsVisited || {}).map(Number),
                    damageTaken: _brain.damageTaken || 0,
                    attacksObserved: _brain.attacksObserved || 0,
                },
                personality: ud.personality ? {
                    bravery: ud.personality.bravery,
                    aggression: ud.personality.aggression,
                    sociability: ud.personality.sociability,
                    loudness: ud.personality.loudness,
                    archetype: ud.personality.archetype,
                } : null,
                deathContext: {
                    deathX: w.position.x / GRID,
                    deathZ: w.position.z / GRID,
                    roomId: ud.aiRoomId,
                    killedByElement: el || 'DEFAULT',
                },
            }, '*');
        } catch (_) { /* spirit report never blocks death */ }

        // ── Grudge chain ──
        // If this body was haunted by an older spirit, that spirit returns
        // to Oni-Baba too — with a higher grudge level (capped at 5) since
        // it died AGAIN at the player's hand. This is the loop the user
        // wanted: spirits get fiercer with each floor they're killed on.
        try {
            if (ud.haunt && ud.haunt.spiritId){
                const ng = Math.min(5, (ud.haunt.grudge || 1) + 1);
                window.parent.postMessage({
                    type: 'MONSTER_SPIRIT_REPORT',
                    id: ud.haunt.spiritId,        // keep the original spirit's id
                    name: ud.haunt.spiritName || 'Yakuza Goblin',
                    archetype: ud.haunt.archetype || ud.personality?.archetype || null,
                    floor: DUNGEON_LEVEL,
                    lifespan: (ud.brain?.spawnedAt) ? (performance.now()/1000 - ud.brain.spawnedAt) : 0,
                    wasFleeing: wasFleeing,
                    chained: true,
                    grudgeOverride: ng,           // Oni-Baba honours this in _calcGrudgeLevel
                    memories: {
                        playerSightings: (ud.brain?.playerSightings || 0),
                        peersWitnessedDead: (ud.brain?.peersWitnessedDead || 0),
                        lastSeenPlayer: ud.brain?.lastSeenPlayer || null,
                        chainDepth: (ud.haunt.chainDepth || 0) + 1,
                    },
                    personality: ud.personality || null,
                    deathContext: {
                        deathX: w.position.x / GRID,
                        deathZ: w.position.z / GRID,
                        roomId: ud.aiRoomId,
                        killedByElement: el || 'DEFAULT',
                    },
                }, '*');
            }
        } catch (_) {}

        // Bump peer "witnessed death" counters so survivors carry that
        // memory in their own next report.
        for (const peer of monsterWrappers){
            if (peer === w || peer.userData.isDead) continue;
            if (peer.userData.brain){
                const ddx = peer.position.x - w.position.x;
                const ddz = peer.position.z - w.position.z;
                // Only count peers that could plausibly have seen / heard it
                if (Math.hypot(ddx, ddz) <= 10 * GRID){
                    peer.userData.brain.peersWitnessedDead++;
                }
            }
        }

        // ── XP + Gold rewards ────────────────────────────────────────────
        // Every kill awards XP scaled by the monster's max HP (tougher mob =
        // more XP) and the current dungeon depth. Killing a fleer pays
        // double — a deliberate karma-vs-power tradeoff. Gold drops scale
        // similarly so the high-score table actually has numbers to sort.
        _killCount += 1;
        const xpBase = Math.round((ud.maxHp || 50) * 0.30 * DUNGEON_LEVEL);
        const xpGain = wasFleeing ? xpBase * 2 : xpBase;
        // Gold drops scaled so loot prices stay reachable after a handful
        // of kills. Fleeing kills pay extra gold too, mirroring the XP bonus.
        const goldBase = Math.round(xpBase * 1.40);
        const goldGain = wasFleeing ? Math.round(goldBase * 1.5) : goldBase;
        playerXp   += xpGain;
        playerGold += goldGain;
        // Level up: every full playerMaxXp threshold = +1 level, +20 max HP
        while (playerXp >= playerMaxXp){
            playerXp     -= playerMaxXp;
            playerLevel  += 1;
            playerMaxXp   = Math.round(playerMaxXp * 1.35); // cost ramps each tier
            playerMaxHp  += 20;
            playerHp     = playerMaxHp; // full heal on level up
            window.parent.postMessage({type:'LOG_EVENT', logType:'karma',
                text:`✨ <b>LEVEL UP!</b> You are now level <b>${playerLevel}</b>.`}, '*');
        }
        window.parent.postMessage({type:'LOG_EVENT', logType:'loot',
            text:`+${xpGain} XP &nbsp;·&nbsp; +${goldGain} gold`}, '*');
        _syncPlayerStats();

        // DEATH alert — radius alert for hallway monsters, AND every monster
        // in the same room as the kill goes hostile unconditionally. The
        // moment one goblin drops, the rest of the room knows you're in
        // there and turns red.
        _alertNearbyRadius(w, ALERT_TILES);
        if (ud.aiRoomId === undefined){
            const _kgx = Math.round(w.position.x/GRID);
            const _kgz = Math.round(w.position.z/GRID);
            ud.aiRoomId = map[_kgx]?.[_kgz]?.roomId ?? -1;
        }
        const _killRoom = ud.aiRoomId;
        if (_killRoom !== -1 && _killRoom !== undefined){
            let _aggroed = 0;
            for (const peer of monsterWrappers){
                if (peer === w || peer.userData.isDead) continue;
                if (peer.userData.aiState === 'hostile') continue;
                if (peer.userData.aiRoomId === undefined){
                    const _pgx = Math.round(peer.position.x/GRID);
                    const _pgz = Math.round(peer.position.z/GRID);
                    peer.userData.aiRoomId = map[_pgx]?.[_pgz]?.roomId ?? -1;
                }
                if (peer.userData.aiRoomId === _killRoom){
                    _setMonsterHostile(peer); // cascades via vicinity propagation
                    _aggroed++;
                }
            }
            if (_aggroed > 0){
                window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                    text:`💀 The room sees ${ud.name||'their friend'} fall — ${_aggroed} more turn HOSTILE.`}, '*');
            }
        }
        // T0.17 — Roll a loot drop (SHURIKEN-biased pool, ~70% drop rate).
        // Don't spawn it yet — stash on the dying-monster entry and drop it
        // AFTER the body fade completes. Otherwise the card appears behind
        // the still-visible dying body.
        const _pendingLoot = _rollMonsterLoot();
        // ── Cinematic death (rewritten — ALWAYS visible) ────────────────────
        // The user has asked many times to actually SEE the model die instead
        // of popping invisible. The flow is now:
        //   1. STOP every running anim clip so the body holds its current
        //      pose (no GLB death clip face-plant taking over).
        //   2. Force wrapper.visible = true and clone every material with
        //      transparent=true so the fade phase is guaranteed to render.
        //   3. Wait 0.10s "freeze on impact" beat so the hit actually reads.
        //   4. TURN: lerp the wrapper yaw to face the player.
        //   5. BOW:  lean wrapper.rotation.x forward to -0.80 rad (~46°).
        //   6. HOLD: keep the bowing pose so the player sees it clearly.
        //   7. FADE: opacity 1 → 0 over a full second + drift down 0.6u.
        //   8. REMOVE: dispose meshes/materials and cull the wrapper.
        // The wrapper is forced visible every frame as a belt-and-suspenders
        // guard against anything else trying to flip visibility.
        const circle = ud.pedestalCircle || (ud.monBase && ud.monBase.children.find(c=>c.isMesh && c.geometry?.type==='PlaneGeometry'));
        // Hard-stop the animation mixer so bone clips don't fight the wrapper rotation.
        try {
            if (ud.mixer && typeof ud.mixer.stopAllAction === 'function') {
                ud.mixer.stopAllAction();
            }
        } catch (_) { /* ignore */ }
        // Clone every body material RIGHT NOW so the fade-phase opacity
        // writes don't accidentally mutate shared GLB materials and so the
        // alpha channel is enabled when the fade begins.
        w.traverse(c => {
            if (!c.isMesh || !c.material) return;
            if (Array.isArray(c.material)) {
                c.material = c.material.map(m => {
                    const mm = m.clone();
                    mm.transparent = true;
                    mm.depthWrite  = false;
                    return mm;
                });
            } else {
                c.material = c.material.clone();
                c.material.transparent = true;
                c.material.depthWrite  = false;
            }
        });
        // Guarantee visibility — flag the wrapper as a dying entity so the
        // tick loop can keep `visible = true` even if other code sets false.
        w.visible = true;
        ud._dying = true;
        // ── Falling death (replaces the bow / "paralysis" pose) ──
        // Phases:
        //   STAGGER (0.18s): tiny backward lean — absorbs the killing blow
        //   FALL    (0.65s): gravity-driven forward tip-over to face-plant
        //                    (rotation.x → −π/2 + slight overshoot)
        //   SETTLE  (0.30s): body lies on the ground, brief hold
        //   FADE    (1.00s): opacity 1 → 0 + slight sink into floor
        // Falls in a RANDOM lateral direction so a swarm doesn't all drop
        // the same way. Direction is picked once at death and locked.
        const _fallYaw   = (Math.random() - 0.5) * 0.6;  // small ±17° lateral
        _dyingMonsters.push({
            w, ud, circle,
            phase:       'stagger',
            timer:        0.18,
            staggerDur:   0.18,
            fallDur:      0.65,
            settleDur:    0.30,
            fadeDur:      1.00,
            startRotX:    w.rotation.x || 0,
            startRotY:    w.rotation.y || 0,
            startRotZ:    w.rotation.z || 0,
            startY:       w.position.y || 0,
            fallYawDelta: _fallYaw,
            pendingLoot:  _pendingLoot,
        });
    } else {
        // Per-personality flee threshold. Cowards bolt at ~75% HP, brave
        // monsters hold on down to ~25%. Default (no personality) = 50%.
        const fleeFrac = ud.personality?.fleeHpFrac ?? 0.50;
        const fleeHp = maxHp * fleeFrac;
        if(ud.hp < fleeHp && ud.aiState !== 'flee' && ud.aiState !== 'fetch' && !ud._fleeCried){
            ud.aiState = 'flee';
            ud._fleeCried = true;
            // Panicked cackle as it breaks and runs
            if (!ud.isImp) _playMonsterSfx('CACKLE', w);
            // ── Flee → Fetch upgrade ──
            // If a peer-room doorway exists, immediately route through it
            // (the fetch state already alerts that room on arrival). This
            // gives panicked monsters real "go get help" behaviour instead
            // of running in circles around the player.
            const _reinf = (typeof _findReinforcementDoorway === 'function')
                ? _findReinforcementDoorway(ud) : null;
            if (_reinf){
                ud.aiState = 'fetch';
                ud._fetchTileX  = _reinf.doorX;
                ud._fetchTileZ  = _reinf.doorZ;
                ud._fetchPeerRoom = _reinf.peerRoomId;
                ud._fetchPath = null;
                ud._lastFetchAt = performance.now() / 1000; // throttle re-trigger
            }
            // T0.26 — Notify Oni-Baba of the flee transition
            window.parent.postMessage({type:'MONSTER_AI_STATE',
                id: ud.id, state: ud.aiState,
                x: w.position.x/GRID, z: w.position.z/GRID}, '*');
            const cName = ud.name || 'Goblin';
            const cries = [
                'HELP ME, GUYS!',
                'HE\'S TOO STRONG — FALL BACK!',
                'EVERYONE RUN! SAVE YOURSELVES!',
                'I CAN\'T TAKE ANY MORE!',
                'SOMEONE OPEN THE DOOR!',
            ];
            const cry = cries[Math.floor(Math.random()*cries.length)];
            const fleeCard =
                `<div class="fl-head">🏃 ${cName.toUpperCase()} FLEES!</div>` +
                `<div class="fl-cry">"${cry}"</div>` +
                `<div class="fl-sub">Karma penalty doubles if you finish them off.</div>`;
            window.parent.postMessage({type:'LOG_EVENT', logType:'flee', text: fleeCard},'*');
            // FLEE alert — only monsters in a small 5-8 tile radius hear the
            // panicked cry. No more room-wide aggro on a flee event.
            _alertNearbyRadius(w, ALERT_TILES);
            // Among those nearby peers, anyone already below 50% HP starts
            // fleeing themselves (panic contagion). Same room-isolation rule
            // as the alert helpers — cross-room peers don't catch the panic.
            const r2 = (ALERT_TILES * GRID) * (ALERT_TILES * GRID);
            if(ud.aiRoomId === undefined){
                const mgx = Math.round(w.position.x/GRID);
                const mgz = Math.round(w.position.z/GRID);
                ud.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
            }
            const srcRoomId = ud.aiRoomId;
            for(const peer of monsterWrappers){
                if(peer === w || peer.userData.isDead) continue;
                const pud = peer.userData;
                if(pud.aiRoomId === undefined){
                    const mgx = Math.round(peer.position.x/GRID);
                    const mgz = Math.round(peer.position.z/GRID);
                    pud.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
                }
                if(srcRoomId !== -1 && pud.aiRoomId !== -1 && srcRoomId !== pud.aiRoomId) continue;
                const pdx = peer.position.x - w.position.x;
                const pdz = peer.position.z - w.position.z;
                if((pdx*pdx + pdz*pdz) <= r2){
                    const pHalf = (pud.maxHp ?? 50) * 0.5;
                    if((pud.hp ?? 50) < pHalf && pud.aiState !== 'flee' && !pud._fleeCried){
                        pud.aiState = 'flee';
                        pud._fleeCried = true;
                    }
                }
            }
        }
    }
    // Room-wide aggro on damage is RE-ENABLED at the top of this function
    // (see the _alertRoom call). Allies are filtered out inside _setMonsterHostile.
    // Strict room isolation prevents the alert from leaking between sealed rooms.
}

// ── Dying-monster sink/fade list ─────────────────────────────────────────────
const _dyingMonsters = [];

function _tickDyingMonsters(dt){
    for(let i = _dyingMonsters.length - 1; i >= 0; i--){
        const d = _dyingMonsters[i];
        d.timer -= dt;

        // Belt-and-suspenders: keep the wrapper visible every tick. Anything
        // else flipping wrapper.visible = false on a dying monster is wrong.
        d.w.visible = true;

        const _setAllOpacity = (alpha) => {
            d.w.traverse(c => {
                if (!c.isMesh || !c.material) return;
                if (Array.isArray(c.material)){
                    for (const m of c.material) { m.transparent = true; m.opacity = alpha; }
                } else {
                    c.material.transparent = true;
                    c.material.opacity = alpha;
                }
            });
        };

        // ── STAGGER ── tiny backward lean (+0.12 rad) — body absorbs the
        // killing blow before gravity takes over. Fast smoothstep.
        if (d.phase === 'stagger'){
            const t = 1 - Math.max(0, d.timer / d.staggerDur);  // 0 → 1
            const ease = t * t * (3 - 2 * t);
            d.w.rotation.x = d.startRotX + 0.12 * ease;
            _setAllOpacity(1.0);
            if (d.timer <= 0){
                d.phase = 'fall';
                d.timer = d.fallDur;
                d.startRotX = d.w.rotation.x;                   // lock current lean
            }
            continue;
        }

        // ── FALL ── gravity-driven tip-over. rotation.x accelerates from
        // its current backward lean down through -π/2 (face-plant) with a
        // small overshoot for impact, then settles. Also adds a slight
        // lateral yaw twist so the body doesn't fall perfectly straight —
        // makes a swarm of deaths look less robotic.
        if (d.phase === 'fall'){
            const t = 1 - Math.max(0, d.timer / d.fallDur);     // 0 → 1
            // Ease-in cubic for the first 80% (gravity accelerating), then
            // a small back-elastic settle for the final 20% so the body
            // "thuds" into the floor instead of stopping dead.
            const TARGET = -Math.PI / 2 - 0.08;                 // slight past-flat
            let pitch;
            if (t < 0.80){
                const tt = t / 0.80;
                const easeIn = tt * tt * tt;                    // cubic gravity
                pitch = d.startRotX + (TARGET - d.startRotX) * easeIn;
            } else {
                // Settle: small overshoot back toward TARGET from a slight
                // past-bounce position. Reads as "hit the ground, settled."
                const tt = (t - 0.80) / 0.20;
                const settle = 1 - (1 - tt) * (1 - tt);
                const bounceFrom = TARGET - 0.05;               // slight kick-back
                pitch = bounceFrom + (TARGET - bounceFrom) * settle;
            }
            d.w.rotation.x = pitch;
            // Lateral twist: small yaw drift to make falls look natural.
            d.w.rotation.y = d.startRotY + d.fallYawDelta * (t * t * (3 - 2 * t));
            // Pedestal disc dims through the fall
            if (d.circle && d.circle.material){
                d.circle.material.opacity = 0.45 * (1 - t);
            }
            _setAllOpacity(1.0);
            if (d.timer <= 0){
                d.phase = 'settle';
                d.timer = d.settleDur;
                // Detach pedestal — body is on the ground now
                if (d.circle){
                    if (d.circle.parent) d.circle.parent.remove(d.circle);
                    d.circle = null;
                }
            }
            continue;
        }

        // ── SETTLE ── body on the ground, brief beat so the player sees
        // the kill register before the fade begins.
        if (d.phase === 'settle'){
            _setAllOpacity(1.0);
            if (d.timer <= 0){
                d.phase = 'fade';
                d.timer = d.fadeDur;
            }
            continue;
        }

        // ── FADE ── drift down 0.6u (subtle sink, not a teleport) AND
        // ramp opacity 1 → 0. Both end together so the disappearance is
        // smooth, not abrupt. The body keeps its bowing pose throughout.
        if (d.phase === 'fade'){
            const t = d.timer / d.fadeDur;                    // 1 → 0
            const ease = 1 - t;                               // 0 → 1
            const easeIn = ease * ease;
            const sinkY  = easeIn * -0.6;
            const alpha  = Math.max(0, Math.min(1, t));       // straight linear fade
            d.w.position.y = d.startY + sinkY;
            if (d.ud.monBase) d.ud.monBase.position.y = sinkY;
            _setAllOpacity(alpha);
            if (d.timer <= 0){
                // Collect every loot card that should drop here, then spawn
                // them spread around the corpse tile so multiple drops don't
                // clip into each other (the screenshot showed two cards
                // stacked in the same XZ — totally illegible).
                const _lx = Math.round(d.w.position.x / GRID);
                const _lz = Math.round(d.w.position.z / GRID);
                const _drops = [];
                if (d.pendingLoot){
                    _drops.push({
                        catId: d.pendingLoot.catId, title: d.pendingLoot.title,
                        desc:  d.pendingLoot.desc,  kanji: d.pendingLoot.kanji,
                        attr:  d.pendingLoot.attr,
                    });
                    d.pendingLoot = null;
                }
                // T0.22 — Lodged missiles → loot cards (grouped by name).
                if (d.ud.lodgedMissiles && d.ud.lodgedMissiles.length > 0){
                    const tally = {};
                    const totalLeft = d.ud.lodgedMissiles.length;
                    for (const m of d.ud.lodgedMissiles){
                        const name = m.cardName || (m.isShuriken ? 'SHURIKEN' : 'ARROW');
                        tally[name] = (tally[name] || 0) + 1;
                        const par = m.lodgeParent || d.w;
                        if (m.mesh) par.remove(m.mesh);
                        if (m.lodgeLight) par.remove(m.lodgeLight);
                        if (m.bloomRing) par.remove(m.bloomRing);
                        if (m.bloomRing2) par.remove(m.bloomRing2);
                        const ai = activeMissiles.indexOf(m);
                        if (ai >= 0) activeMissiles.splice(ai, 1);
                    }
                    d.ud.lodgedMissiles = [];
                    for (const [name, qty] of Object.entries(tally)){
                        _drops.push({
                            catId: 'MISSILE',
                            title: qty > 1 ? `${name} x${qty}` : name,
                            desc:  'Recovered from body',
                            kanji: '投',
                            attr:  '(DMG*1DICE)',
                        });
                    }
                    if (totalLeft > 0){
                        window.parent.postMessage({type:'LOG_EVENT', logType:'loot',
                            text:`💢 ${totalLeft} missile(s) left in the body.`},'*');
                    }
                }
                // Spawn drops spread around the corpse tile so they don't
                // clip. Single drop sits at the centre; multiple drops are
                // arranged in a ring with a small offset.
                if (_drops.length === 1){
                    const L = _drops[0];
                    try { spawnLootCard(_lx, _lz, L.catId, L.title, L.desc, L.kanji, L.attr); }
                    catch (e) { /* non-fatal */ }
                } else if (_drops.length > 1){
                    const SPREAD = 0.55; // worldunits from tile centre
                    const wxCenter = _lx * GRID, wzCenter = _lz * GRID;
                    for (let _di = 0; _di < _drops.length; _di++){
                        const L = _drops[_di];
                        const ang = (_di / _drops.length) * Math.PI * 2 + Math.random() * 0.20;
                        const offX = Math.cos(ang) * SPREAD;
                        const offZ = Math.sin(ang) * SPREAD;
                        try {
                            const card = spawnLootCard(_lx, _lz, L.catId, L.title, L.desc, L.kanji, L.attr);
                            if (card && card.position){
                                card.position.x = wxCenter + offX;
                                card.position.z = wzCenter + offZ;
                                // Update gridX/gridZ so pickup check still works
                                if (card.userData){
                                    card.userData.gridX = _lx;
                                    card.userData.gridZ = _lz;
                                }
                            }
                        } catch (e) { /* non-fatal */ }
                    }
                }
                // Dispose the per-death cloned materials and the body's geometry
                // so the GPU memory doesn't leak across kills. The bow→sink phase
                // re-assigns `c.material = c.material.clone()` on every body mesh
                // (above), so each kill produces ~3–10 fresh materials that the
                // old cleanup path discarded by reference only.
                d.w.traverse(c=>{
                    if(!c.isMesh) return;
                    if(c.geometry) c.geometry.dispose();
                    const m = c.material;
                    if(!m) return;
                    if(Array.isArray(m)) m.forEach(mm => mm && mm.dispose && mm.dispose());
                    else if(m.dispose) m.dispose();
                });
                scene.remove(d.w);
                if(d.ud.monBase) scene.remove(d.ud.monBase);
                // Reap from the live wrapper list. Until this fix the array only
                // grew (push at spawn, never spliced), so every per-frame loop
                // over monsterWrappers walked every corpse forever — the FPS
                // tank after multi-kills traces back here.
                const _mi = monsterWrappers.indexOf(d.w);
                if(_mi >= 0) monsterWrappers.splice(_mi, 1);
                _pipInvalidateWallCache();
                _dyingMonsters.splice(i, 1);
            }
        }
    }
}

// Red point-light bloom attached at the target's position, fades over ~450ms.
// Universal "I just got hit" feedback for both monsters and the player so we
// don't have to paint the mesh purple/violet on a plain missile or melee hit.
// ── Paper-origami limb-lop ──
// On a slash, there's a chance the goblin sheds an "arm" — either an
// actual arm-named child in the GLB, or (when the model doesn't expose
// one) a torn paper origami fragment that flies from the torso. The
// fragment falls under gravity, spins, fades over ~1.4 s, and is GC'd.
// Already-lopped sides stay lopped (per-monster bookkeeping prevents
// re-cutting the same arm twice).
const _ARM_KEYWORDS = ['arm', 'forearm', 'elbow', 'hand', 'wrist', 'limb'];
function _maybeLopOffLimb(targetWrapper){
    if (!targetWrapper || targetWrapper.userData?.isDead) return;
    const ud = targetWrapper.userData;
    if (!ud._loppedLimbs) ud._loppedLimbs = new Set();

    // Try to find an arm-named child mesh on the wrapper.
    let armMesh = null;
    targetWrapper.traverse(c => {
        if (armMesh || !c.isMesh) return;
        const n = (c.name || '').toLowerCase();
        const mn = (c.material?.name || '').toLowerCase();
        if (ud._loppedLimbs.has(c.uuid)) return;
        if (_ARM_KEYWORDS.some(k => n.includes(k) || mn.includes(k))){
            armMesh = c;
        }
    });

    if (armMesh){
        // Detach + reparent to the scene at its current world transform.
        ud._loppedLimbs.add(armMesh.uuid);
        const worldPos = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        const worldScl = new THREE.Vector3();
        armMesh.getWorldPosition(worldPos);
        armMesh.getWorldQuaternion(worldQuat);
        armMesh.getWorldScale(worldScl);
        armMesh.parent.remove(armMesh);
        armMesh.position.copy(worldPos);
        armMesh.quaternion.copy(worldQuat);
        armMesh.scale.copy(worldScl);
        scene.add(armMesh);
        // Make material semi-transparent so the fade works
        if (armMesh.material){
            armMesh.material = armMesh.material.clone();
            armMesh.material.transparent = true;
            armMesh.material.depthWrite = false;
        }
        const vy = 1.6 + Math.random() * 1.0;
        const ang = Math.random() * Math.PI * 2;
        const sp = 1.4 + Math.random() * 1.0;
        const vx = Math.cos(ang) * sp;
        const vz = Math.sin(ang) * sp;
        const t0 = performance.now();
        const LIFE = 1.6;
        const spinX = (Math.random() - 0.5) * 6;
        const spinZ = (Math.random() - 0.5) * 6;
        let velY = vy;
        function tick(){
            const elapsed = (performance.now() - t0) / 1000;
            if (elapsed >= LIFE){
                if (armMesh.parent) armMesh.parent.remove(armMesh);
                if (armMesh.geometry) armMesh.geometry.dispose();
                if (armMesh.material) armMesh.material.dispose();
                return;
            }
            const dt2 = 0.016;
            velY -= 9.8 * dt2;
            armMesh.position.x += vx * dt2;
            armMesh.position.y += velY * dt2;
            armMesh.position.z += vz * dt2;
            armMesh.rotation.x += spinX * dt2;
            armMesh.rotation.z += spinZ * dt2;
            if (armMesh.material) armMesh.material.opacity = Math.max(0, 1 - elapsed / LIFE);
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
            text:`✂️ Slashed clean — <b>${ud.name||'Goblin'}</b> loses an arm to the cut!`}, '*');
        return;
    }

    // Fallback — model has no arm-named child. Spawn a torn paper origami
    // fragment (small triangle of cream paper) flying off the torso.
    const fragGeo = new THREE.BufferGeometry();
    const verts = new Float32Array([
        0,    0, 0,
        0.30, 0, 0.04,
        0.18, 0.34, 0.02,
    ]);
    fragGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    fragGeo.computeVertexNormals();
    const fragMat = new THREE.MeshBasicMaterial({
        color: 0xffe8c0, transparent: true, opacity: 0.95,
        side: THREE.DoubleSide, depthWrite: false,
    });
    const frag = new THREE.Mesh(fragGeo, fragMat);
    const wp = new THREE.Vector3();
    targetWrapper.getWorldPosition(wp);
    frag.position.set(
        wp.x + (Math.random() - 0.5) * 0.4,
        wp.y + 1.0 + Math.random() * 0.4,
        wp.z + (Math.random() - 0.5) * 0.4,
    );
    scene.add(frag);
    const vy0 = 1.4 + Math.random() * 0.8;
    const ang = Math.random() * Math.PI * 2;
    const sp  = 1.0 + Math.random() * 0.8;
    const vx0 = Math.cos(ang) * sp, vz0 = Math.sin(ang) * sp;
    const spinY = (Math.random() - 0.5) * 6;
    const spinZ = (Math.random() - 0.5) * 5;
    const t0 = performance.now();
    const LIFE = 1.4;
    let vy = vy0;
    function fragTick(){
        const elapsed = (performance.now() - t0) / 1000;
        if (elapsed >= LIFE){
            scene.remove(frag); fragGeo.dispose(); fragMat.dispose();
            return;
        }
        const dt2 = 0.016;
        vy -= 9.8 * dt2;
        frag.position.x += vx0 * dt2;
        frag.position.y += vy   * dt2;
        frag.position.z += vz0 * dt2;
        frag.rotation.y += spinY * dt2;
        frag.rotation.z += spinZ * dt2;
        fragMat.opacity = Math.max(0, 1 - elapsed / LIFE);
        requestAnimationFrame(fragTick);
    }
    requestAnimationFrame(fragTick);
}

// ── Slash-streak texture ──
// Bright white-orange anamorphic streak with soft alpha tails on each end.
// Re-used by every persistent hit-mark slapped onto a monster's body.
const _SLASH_STREAK_TEX = (() => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 256, 0);
    grd.addColorStop(0.00, 'rgba(255,255,255,0.0)');
    grd.addColorStop(0.10, 'rgba(255,200,120,0.35)');
    grd.addColorStop(0.35, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.50, 'rgba(255,255,240,1.0)');
    grd.addColorStop(0.65, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.90, 'rgba(255,140,40,0.35)');
    grd.addColorStop(1.00, 'rgba(180,0,0,0.0)');
    g.fillStyle = grd; g.fillRect(0, 0, 256, 64);
    // Vertical taper so the streak ends are soft on top + bottom
    const v = g.createLinearGradient(0, 0, 0, 64);
    v.addColorStop(0.00, 'rgba(0,0,0,0)');
    v.addColorStop(0.50, 'rgba(0,0,0,1)');
    v.addColorStop(1.00, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'destination-in';
    g.fillStyle = v; g.fillRect(0, 0, 256, 64);
    const t = new THREE.CanvasTexture(c);
    t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
    return t;
})();

// ── Persistent hit-streak on monster body ──
// Spawns a bright additive slash plane at a random body position on the
// monster, parented to the wrapper so it moves with them. Lives ~1.8 s
// then fades away. Random angle each call so consecutive hits don't pile
// onto the same arc.
function _spawnHitStreakOnMonster(targetWrapper){
    if (!targetWrapper || targetWrapper.userData?.isDead) return;
    const w = 0.95 + Math.random() * 0.45;
    const h = 0.18 + Math.random() * 0.10;
    const mat = new THREE.MeshBasicMaterial({
        map: _SLASH_STREAK_TEX,
        color: 0xffffff,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,        // always visible on top of body
        side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    // Random body location matching the lodge code (head 1.7 / torso 0.8-1.4 / legs 0.4)
    const bx = (Math.random() - 0.5) * 0.55;
    const by = 0.55 + Math.random() * 1.10;
    const bz = (Math.random() - 0.5) * 0.45;
    mesh.position.set(bx, by, bz);
    // Random in-plane rotation so the slash arc varies, plus billboard
    // toward the camera each frame in the tick (handled below).
    mesh.rotation.z = (Math.random() - 0.5) * Math.PI;
    mesh.renderOrder = 30;
    targetWrapper.add(mesh);

    // Fade-out animation
    const T_LIFE = 1.8;
    const t0 = performance.now();
    const camLocal = new THREE.Vector3();
    const worldPos = new THREE.Vector3();
    function tick(){
        if (!mesh.parent){ return; }
        const elapsed = (performance.now() - t0) / 1000;
        const t = elapsed / T_LIFE;
        if (t >= 1){
            if (mesh.parent) mesh.parent.remove(mesh);
            mat.dispose();
            mesh.geometry.dispose();
            return;
        }
        // Bright punch first 250 ms, then linear fade
        const k = (elapsed < 0.25)
            ? 1.0
            : Math.max(0, 1 - (elapsed - 0.25) / (T_LIFE - 0.25));
        mat.opacity = k;
        // Slight grow as it fades — feels like an afterimage
        const sc = 1.0 + (1 - k) * 0.20;
        mesh.scale.setScalar(sc);
        // Billboard the slash toward the camera so it always reads
        targetWrapper.getWorldPosition(worldPos);
        camLocal.copy(camera.position).sub(worldPos).add(mesh.position);
        const savedZ = mesh.rotation.z;
        mesh.lookAt(camLocal);
        mesh.rotation.z = savedZ; // preserve slash angle
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

// Reusable radial-gradient texture for the hit-bloom sprite. Built once on
// first use — a soft red disc that fades to transparent at the edge so the
// additive sprite reads as a halo, not a hard disc.
let _HIT_BLOOM_TEX = null;
function _getHitBloomTex(){
    if (_HIT_BLOOM_TEX) return _HIT_BLOOM_TEX;
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(64, 64, 4, 64, 64, 60);
    grd.addColorStop(0.00, 'rgba(255, 60, 70, 1.00)');
    grd.addColorStop(0.40, 'rgba(255, 30, 40, 0.55)');
    grd.addColorStop(1.00, 'rgba(255,  0, 20, 0.00)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
    _HIT_BLOOM_TEX = new THREE.CanvasTexture(c);
    _HIT_BLOOM_TEX.generateMipmaps = false;
    _HIT_BLOOM_TEX.minFilter = THREE.LinearFilter;
    return _HIT_BLOOM_TEX;
}

function _spawnHitBloom(target, hostile){
    if(!target || !target.position) return;
    // RED HIT FLASH — tiny additive billboard. User said hits used to "change
    // the monster's color"; the prior 3.2-wu sprite was overlapping the entire
    // body. Now it's a small bright spark (~0.7 wu) positioned at chest height
    // so it reads as an impact pop near the silhouette edge, not a body
    // recolour. The persistent body emissive (bright white) stays put.
    const ud = target.userData || {};
    const isHostile = hostile !== undefined ? hostile : (ud.aiState === 'hostile' || ud.aiState === 'chase' || ud.isHostile);
    const peakScale = isHostile ? 0.85 : 0.65;   // was 3.2 / 2.4 — much tighter
    const peakOp    = isHostile ? 0.95 : 0.75;
    const DUR       = isHostile ? 260 : 200;     // shorter so it doesn't linger
    const mat = new THREE.SpriteMaterial({
        map:         _getHitBloomTex(),
        color:       0xff2233,
        transparent: true,
        opacity:     peakOp,
        blending:    THREE.AdditiveBlending,
        depthWrite:  false,
        depthTest:   true,
    });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(peakScale, peakScale, 1);
    sp.position.copy(target.position).setY(1.0);
    scene.add(sp);
    const t0 = performance.now();
    (function tick(){
        const t = (performance.now() - t0) / DUR;
        if(t >= 1){
            scene.remove(sp);
            mat.dispose();
            return;
        }
        const k = 1 - t;
        mat.opacity = peakOp * k;
        // Tiny outward expansion so the halo "puffs" as it dies
        const s = peakScale * (1 + (1 - k) * 0.25);
        sp.scale.set(s, s, 1);
        sp.position.copy(target.position).setY(1.0); // track moving target
        requestAnimationFrame(tick);
    })();
}

function _applyElementalBodyFX(w, el){
    // ── Hit feedback — red lightbloom ONLY ──
    // Per user spec: NEVER recolor the goblin mesh on hit. The element-tinted
    // emissive flash (FIRE=red, WATER=blue, EARTH=brown, WIND=green) used to
    // smear the goblin texture for ~1.2s and looked weird/glitchy on every
    // strike. The single source of hit feedback is now the red point-light
    // bloom around the target — brighter and longer if the target is hostile
    // (legacy "hit a red monster" cue). No emissive writes here at all.
    _spawnHitBloom(w);
}

// ── Bullet-hole pulse list — randomly flickering white wounds ──────────────
// PISTOL hits register here. Each wound pulses its disc opacity, halo
// opacity, and point-light intensity on independent phases so a riddled
// monster appears to twinkle with bright bullet wounds. Cleaned up when
// the owning monster dies (filter pass at the top of each tick).
const _activeBulletHoles = [];
function _tickBulletHoles(dt){
    const now = performance.now() * 0.001;
    for (let i = _activeBulletHoles.length - 1; i >= 0; i--){
        const w = _activeBulletHoles[i];
        // Wall holes (owner === null, isWallHole) are permanent — never reaped.
        // Monster wounds drop when the owning monster dies / despawns.
        if (!w.isWallHole){
            if (!w.owner || (w.owner.userData && w.owner.userData.isDead)){
                _activeBulletHoles.splice(i, 1);
                continue;
            }
        }
        // Smooth sine pulse + occasional random twinkle for liveliness
        const s   = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(now * w.rate + w.phase));
        let jitter = 0;
        if (now > w.jitterAt){
            w.jitterAt = now + 0.08 + Math.random() * 0.20;
            jitter = (Math.random() - 0.5) * 0.35;
        }
        const mul = Math.max(0.35, Math.min(1.30, s + jitter));
        if (w.hole) w.hole.material.opacity = w.baseDiscOp * mul;
        if (w.halo) w.halo.material.opacity = w.baseHaloOp * mul;
        if (w.glow) w.glow.intensity         = w.baseGlowI  * mul;
        // Flare sparkles slightly out-of-phase with the bloom so the center
        // pinpoint always reads even when the halo dims. Dark center holds
        // steady — it's the "pierced flesh" and shouldn't twinkle.
        const fmul = Math.max(0.55, Math.min(1.25, s - jitter * 0.6));
        if (w.flare)     w.flare.material.opacity     = 1.00 * fmul;
        if (w.exitFlare) w.exitFlare.material.opacity = 1.00 * fmul;
        if (w.exitCore)  w.exitCore.material.opacity  = w.baseDiscOp * mul;
        if (w.exitHalo)  w.exitHalo.material.opacity  = w.baseHaloOp * mul;
    }
}

// ── Floor decals — persistent residue under spells / boulder bounces ───────
// A floor decal is a small flat ring/disc that sits on the ground and fades
// over its life. Reusable across spell elements so we ship consistent feel.
// Types: 'scorch' (fire), 'wet' (water), 'crack' (earth), 'dust' (wind).
const _activeDecals = [];
function _spawnFloorDecal(pos, type, opts){
    opts = opts || {};
    const cfg = {
        scorch: { color: 0x1c0a04, opacity: 0.85, life: 9.0, rOuter: 0.85, rInner: 0.10, blend: THREE.NormalBlending,    glow: 0x331005, glowI: 0.4 },
        wet:    { color: 0x09314a, opacity: 0.78, life: 6.0, rOuter: 0.95, rInner: 0.05, blend: THREE.NormalBlending,    glow: null,     glowI: 0   },
        crack:  { color: 0x2c2620, opacity: 0.92, life: 12.0,rOuter: 0.70, rInner: 0.04, blend: THREE.NormalBlending,    glow: null,     glowI: 0   },
        dust:   { color: 0xb6c6d4, opacity: 0.45, life: 5.0, rOuter: 1.10, rInner: 0.20, blend: THREE.AdditiveBlending, glow: null,     glowI: 0   },
    }[type] || null;
    if (!cfg) return null;
    const rOut = opts.rOuter || cfg.rOuter;
    const rIn  = opts.rInner ?? cfg.rInner;
    const life = opts.life   || cfg.life;
    const mat  = new THREE.MeshBasicMaterial({
        color: cfg.color, transparent: true, opacity: cfg.opacity,
        blending: cfg.blend, depthWrite: false, side: THREE.DoubleSide,
    });
    const geo = new THREE.RingGeometry(rIn, rOut, 36);
    const m   = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(pos.x, 0.015 + Math.random() * 0.005, pos.z);
    scene.add(m);
    const rec = { mesh: m, age: 0, life, baseOp: cfg.opacity };
    if (cfg.glow){
        const gl = new THREE.PointLight(cfg.glow, cfg.glowI, 2.4, 2.2);
        gl.position.set(pos.x, 0.3, pos.z);
        scene.add(gl);
        rec.glow = gl;
        rec.glowI0 = cfg.glowI;
    }
    _activeDecals.push(rec);
    return rec;
}
function _tickDecals(dt){
