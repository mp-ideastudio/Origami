    (function tick(){
        const dt2 = 0.016;
        let alive = false;
        for (const p of puffs){
            p.userData.age += dt2;
            if (p.userData.age >= p.userData.life){
                if (p.parent) scene.remove(p);
                continue;
            }
            alive = true;
            const t = p.userData.age / p.userData.life;
            p.position.y += p.userData.vy * dt2;
            p.scale.setScalar(1 + t * 1.8);
            p.material.opacity = p.userData.baseOp * Math.max(0, 1 - t);
        }
        if (alive) requestAnimationFrame(tick);
    })();
}

// Pistol-shot file player with procedural fallback. Tags the cache entry as
// "missing" on the first 404 so we don't keep re-fetching every shot.
// Pistol shot SFX — Web Audio buffer playback.
//
// Why not HTMLAudioElement.cloneNode()? The previous implementation cloned a
// shared <audio> element per shot and called .play(). Symptoms:
//   • First shot plays the mp3 cleanly.
//   • Subsequent shots: play() returns a Promise that REJECTS in many
//     browsers — interrupted clones, source not yet decoded on the new node,
//     autoplay quota. The .catch handler then set `_pistolShotFileMissing =
//     true` *permanently*, falling everything through to the 4-layer
//     procedural synth — which uses fresh random noise buffers per call, so
//     every shot after the first sounded different.
//   • Net result: 1 good shot, then random-sounding shots forever.
//
// Web Audio API solves this cleanly: decode the mp3 into an AudioBuffer ONCE,
// then spawn a fresh BufferSource per shot. No clone-state, no rejection,
// no permanent fallback flag.
const _PISTOL_SHOT_PATH = './assets/sounds/Player/pistol-shot.mp3';
let   _pistolShotBuffer = null;
let   _pistolShotLoading = false;
let   _pistolShotLoadFailed = false;

function _loadPistolShotBuffer(){
    if (_pistolShotBuffer || _pistolShotLoading || _pistolShotLoadFailed) return;
    const ctx = (typeof _getAudioCtx === 'function') ? _getAudioCtx() : null;
    if (!ctx) return; // user hasn't interacted yet — try again on next shot
    _pistolShotLoading = true;
    fetch(_PISTOL_SHOT_PATH)
        .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.arrayBuffer();
        })
        .then(buf => ctx.decodeAudioData(buf))
        .then(audioBuf => {
            _pistolShotBuffer = audioBuf;
            _pistolShotLoading = false;
            console.log('[Pistol SFX] mp3 decoded, ' + audioBuf.duration.toFixed(3) + 's');
        })
        .catch(err => {
            _pistolShotLoading = false;
            _pistolShotLoadFailed = true;
            console.warn('[Pistol SFX] load/decode failed, will use synth fallback:', err);
        });
}

function _playPistolShotSfx(volume){
    if (_audioMuted) return;
    const ctx = (typeof _getAudioCtx === 'function') ? _getAudioCtx() : null;
    if (!ctx){
        // Audio context not ready (no user gesture yet) — fall back this once.
        if (typeof _playHeavyPistolShot === 'function') _playHeavyPistolShot(volume || 0.9);
        return;
    }
    if (!_pistolShotBuffer){
        // Kick off decode (no-op if already loading or failed) and play synth
        // for just this one shot. Next shot may use the real file.
        _loadPistolShotBuffer();
        if (typeof _playHeavyPistolShot === 'function') _playHeavyPistolShot(volume || 0.9);
        return;
    }
    try {
        const vol = Math.max(0, Math.min(1, volume == null ? 0.9 : volume));
        const now = ctx.currentTime;
        const src = ctx.createBufferSource();
        src.buffer = _pistolShotBuffer;
        const g = ctx.createGain();
        g.gain.setValueAtTime(vol, now);
        src.connect(g); g.connect(ctx.destination);
        // start() with no arg = "now" on the context clock. The previous
        // src.start(0) targeted absolute time 0 — long past, so the
        // source scheduled but never played. Bug fix for the silent-pistol
        // report after switching from HTMLAudio to Web Audio.
        src.start();
    } catch (err){
        console.warn('[Pistol SFX] play failed, using synth:', err);
        if (typeof _playHeavyPistolShot === 'function') _playHeavyPistolShot(volume || 0.9);
    }
}

// Procedural heavy .45 ACP gunshot — three-layer synth that reads as a
// proper handgun crack rather than a filtered noise puff:
//   1. CRACK   — fast-attack noise burst routed through highpass + presence
//                EQ for the supersonic snap (the "pop").
//   2. BODY    — second filtered noise burst, lowpass + bandpass for the
//                muzzle blast roar / chamber pressure.
//   3. THUMP   — fast sweeping sine (130→32 Hz) for the gut-punch sub.
// All layers run through a master compressor so transients stay loud without
// clipping, then a small reverb-ish delay tap simulates the muzzle reflection.
function _playHeavyPistolShot(vol){
    if (_audioMuted) return;
    try {
        const ctx = _getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const vol_ = Math.max(0, Math.min(1, vol || 0.9));

        // ── Master bus: compressor → destination ──
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-14, now);
        comp.knee.setValueAtTime(20, now);
        comp.ratio.setValueAtTime(8, now);
        comp.attack.setValueAtTime(0.001, now);
        comp.release.setValueAtTime(0.18, now);
        const master = ctx.createGain();
        master.gain.setValueAtTime(vol_ * 0.95, now);
        comp.connect(master); master.connect(ctx.destination);
        // Short delay tap for "muzzle reflection" tail (~70 ms)
        const dly = ctx.createDelay(0.20);
        dly.delayTime.setValueAtTime(0.072, now);
        const dlyGain = ctx.createGain();
        dlyGain.gain.setValueAtTime(0.25, now);
        dly.connect(dlyGain); dlyGain.connect(master);

        // ── Layer 1: CRACK (high-frequency snap) ──
        {
            const len = Math.floor(ctx.sampleRate * 0.10);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++){
                const t = i / len;
                d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 55);
            }
            const src = ctx.createBufferSource(); src.buffer = buf;
            const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
            const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 3400; pk.Q.value = 1.4; pk.gain.value = 7;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(vol_ * 1.0, now + 0.001);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
            src.connect(hp); hp.connect(pk); pk.connect(g);
            g.connect(comp); g.connect(dly);
            src.start(now); src.stop(now + 0.11);
        }

        // ── Layer 2: BODY (muzzle blast roar) ──
        {
            const len = Math.floor(ctx.sampleRate * 0.22);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++){
                const t = i / len;
                d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 16) * (1 - t * 0.7);
            }
            const src = ctx.createBufferSource(); src.buffer = buf;
            const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';  lp.frequency.value = 1200; lp.Q.value = 0.7;
            const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 450;  bp.Q.value = 1.2;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(vol_ * 0.85, now + 0.003);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            src.connect(lp); lp.connect(bp); bp.connect(g);
            g.connect(comp); g.connect(dly);
            src.start(now); src.stop(now + 0.25);
        }

        // ── Layer 3: THUMP (sub-frequency punch) ──
        {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(130, now);
            osc.frequency.exponentialRampToValueAtTime(32, now + 0.14);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(vol_ * 0.75, now + 0.002);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(g); g.connect(comp);
            osc.start(now); osc.stop(now + 0.20);
        }

        // ── Layer 4: METALLIC TING (subtle slide cycling, ~30 ms post-shot) ──
        {
            const start = now + 0.03;
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1850, start);
            osc.frequency.exponentialRampToValueAtTime(2400, start + 0.05);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0, start);
            g.gain.linearRampToValueAtTime(vol_ * 0.12, start + 0.003);
            g.gain.exponentialRampToValueAtTime(0.001, start + 0.06);
            osc.connect(g); g.connect(comp);
            osc.start(start); osc.stop(start + 0.07);
        }
    } catch (_) {}
}

function launchMissile(cardName, recoveryCallback, opts = {}){
    const isBullet   = (String(cardName).toUpperCase() === 'PISTOL');
    // Firearms don't use the throw animation — the gun stays in the player's
    // hand and only the bullet flies. Throwing weapons (shuriken/dagger/bow)
    // still get the wind-up + release animation.
    if (!isBullet) _playPlayerAttackAnim();
    // ALL player missile cards play the bundled missile.mp3 — replaces the
    // synthesized whoosh so shuriken / dagger / bow / crossbow all share
    // the same recognizable launch sound. The WAND uses a sharp pistol bang
    // played from _spawnPlayerMuzzleFlash instead.
    if (!isBullet) _playSfxFile('./assets/sounds/Player/missile.mp3', 0.75);
    if (isBullet) _spawnPlayerMuzzleFlash();
    const isShuriken = _isShuriken(cardName);
    const baseRoll = calcMissileDamage(cardName) || {dmg:0,isCrit:false};
    const baseDmg = baseRoll.dmg, baseCrit = baseRoll.isCrit;
    const dmg = (opts && typeof opts.damage === 'number') ? opts.damage : baseDmg;
    const isCrit = (opts && typeof opts.isCrit === 'boolean') ? opts.isCrit : baseCrit;

    // Build the right model
    const missileGroup = isBullet
        ? _buildBulletModel()
        : (isShuriken ? _buildShurikenModel() : _buildArrowModel());

    // Spawn at camera position, slightly offset right (hand position)
    const spawnOffset = new THREE.Vector3(0.22, -0.12, -0.35);
    spawnOffset.applyEuler(camera.rotation);
    missileGroup.position.copy(camera.position).add(spawnOffset);
    scene.add(missileGroup);

    // Auto-aim via OniBaba — she picks target, logs to hive-mind, triggers retaliate
    // Around-corner aim: if no clean shot, try to route around the corner
    // with a -20% hit penalty. The 20% rolled here decides at *launch* time
    // whether the missile will whiff (target nulled, missile flies straight
    // into the corner) or curve through a via-point and home in.
    let target, viaPoint = null, isBlockedShot = false;
    if (opts && opts.target){
        target = opts.target;
    } else {
        const res = _obAutoTargetWithCorner(cardName, dmg);
        target = res.target;
        if (res.blocked){
            isBlockedShot = true;
            if (Math.random() < 0.20){
                // 20% chance to whiff the corner shot — drop the target,
                // missile flies straight and breaks against the wall.
                window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                    text:'🎯 Around-corner shot missed the angle!'}, '*');
                target = null;
                viaPoint = null;
            } else {
                viaPoint = res.viaPoint;
                window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                    text:'🎯 Lined up an around-corner shot…'}, '*');
            }
        }
    }
    // Snap FPV to face whatever we're throwing at. force=true so this
    // overrides any monster-hit face-target that was just set.
    if (target && target.position) _autoFaceOnAttack(target, true);

    // Compute initial velocity with gravity arc
    // Direction: toward via-point if blocked, otherwise target mid-body,
    // else just straight camera forward.
    const fwd = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
    let aimDir;
    if (viaPoint){
        // Curve through the corner: aim at the via point first.
        const aimPt = new THREE.Vector3(viaPoint.x, EYE_HEIGHT * 0.85, viaPoint.z);
        aimDir = aimPt.sub(missileGroup.position).normalize();
    } else if (target){
        const aimPt = target.position.clone().setY(target.position.y + 1.3); // chest height
        aimDir = aimPt.sub(missileGroup.position).normalize();
    } else {
        aimDir = fwd.clone();
    }

    // Bullets fly flat and fast (no arc, almost no gravity). Shuriken/arrow
    // keep their existing physics.
    // Bullet doubled (36 → 70 wu/s) so the slug reads as supersonic and the
    // muzzle-to-impact arc completes in a single perceptible streak instead
    // of a slow lob. Shuriken / arrow speeds unchanged.
    const SPEED = isBullet ? 70 : (isShuriken ? 14 : 18);
    const vel = aimDir.clone().multiplyScalar(SPEED);
    // Upward arc kick so arrow crests over mid-range, hits torso not feet
    if(!isShuriken && !isBullet) vel.y += 2.2;

    // Orient missile along velocity direction
    missileGroup.lookAt(missileGroup.position.clone().add(vel));
    if(!isShuriken && !isBullet){
        // Arrow model points -Z, lookAt gives +Z → flip
        missileGroup.rotateY(Math.PI);
    }

    activeMissiles.push({
        mesh: missileGroup,
        vel,
        gravity: isBullet ? 0.4 : (isShuriken ? 2.0 : 3.8),
        dmg, isCrit,
        cardName,
        isShuriken,
        isBullet,
        target,
        viaPoint,                  // {x, z} corner waypoint or null
        isBlockedShot,             // whether this was an around-corner shot
        life: 3.5,
        lodged: false,
        spinZ: 0,
        recoveryCallback
    });

    // Camera kick
    addCameraTrauma(0.12);

    // Aggro
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    aggroRoom(map[pgx]?.[pgz]?.roomId);
}

// Any non-ally monster within 1 tile of a player missile impact gets aggroed.
// Allies (isAlly === true, green pedestal) are exempt. Vicinity propagation
// in _setMonsterHostile then cascades the alert to other nearby idlers.
function _aggroMonstersNearImpact(pos){
    const R2 = GRID * GRID;          // 1-tile radius
    let waked = 0;
    let firstName = null;
    for (const w of monsterWrappers){
        const ud = w.userData;
        if (!ud || ud.isDead || ud.isAlly) continue;
        if (ud.aiState === 'hostile')   continue; // already on the hunt
        const dx = w.position.x - pos.x;
        const dz = w.position.z - pos.z;
        if (dx*dx + dz*dz <= R2){
            if (!firstName) firstName = ud.name || 'Goblin';
            _setMonsterHostile(w);
            waked++;
        }
    }
    if (waked > 0){
        const text = waked === 1
            ? `👀 <b>${firstName}</b> hears your missile thud and turns hostile!`
            : `👀 Your missile lands among <b>${waked}</b> goblins — they all turn hostile!`;
        window.parent.postMessage({type:'LOG_EVENT', logType:'combat', text}, '*');
    }
}

function tickMissiles(dt){
    for(let i = activeMissiles.length-1; i >= 0; i--){
        const m = activeMissiles[i];
        if(m.lodged){
            // T0.22 — Lodged missiles persist until monster death (or until
            // thrown back by the monster). No auto-expiry timer. Just keep
            // the bloom subtly pulsing while the monster is alive.
            if(m.lodgeLight){
                m.lodgeLight.intensity = 3 + Math.sin(performance.now()*0.005) * 1.2;
            }
            if(m.bloomRing){
                m.bloomRing.rotation.z += dt * 0.6;
            }
            continue;
        }

        // Stuck-in-wall: missile lodged in a wall. Frozen in place; opacity
        // fades over m.stuckFadeDur, then removed to free up render.
        if (m.stuckInWall){
            m.stuckAge += dt;
            const t = Math.min(1, m.stuckAge / m.stuckFadeDur);
            // Linear fade on every material in the mesh hierarchy
            m.mesh.traverse(c => {
                if (c.material && c.material.transparent){
                    const base = c.material.userData.baseOpacity ?? c.material.opacity;
                    c.material.opacity = base * (1 - t);
                }
            });
            if (m.stuckAge >= m.stuckFadeDur){
                scene.remove(m.mesh);
                activeMissiles.splice(i, 1);
            }
            continue;
        }

        m.life -= dt;
        if(m.life <= 0){
            _aggroMonstersNearImpact(m.mesh.position);
            scene.remove(m.mesh); activeMissiles.splice(i, 1); continue;
        }

        // Apply gravity
        m.vel.y -= m.gravity * dt;

        // Around-corner two-stage homing: when a viaPoint is set, steer
        // toward it first; once we're inside ~1.4 tiles of it, drop the
        // via-point and switch to homing on the target chest. This is what
        // makes the missile visually curve around the corner.
        if (m.viaPoint){
            const dxV = m.viaPoint.x - m.mesh.position.x;
            const dzV = m.viaPoint.z - m.mesh.position.z;
            if (dxV*dxV + dzV*dzV < (GRID * 1.4) * (GRID * 1.4)){
                m.viaPoint = null;
            } else {
                const aimPt = new THREE.Vector3(m.viaPoint.x, m.mesh.position.y, m.viaPoint.z);
                const toAim = aimPt.sub(m.mesh.position).normalize();
                const spd = m.vel.length();
                // Stronger steer toward via-point so the curve is decisive.
                toAim.multiplyScalar(spd);
                m.vel.lerp(toAim, Math.min(0.22, dt * 9));
            }
        }

        // Soft homing correction — steer 8% toward target chest per tick
        // Damage is pre-rolled so this is purely cosmetic trajectory assistance
        if(!m.viaPoint && m.target && !m.target.userData.isDead){
            const chestPt = m.target.position.clone().setY(m.target.position.y + 1.3); // chest height
            const toChest = chestPt.sub(m.mesh.position);
            const distToTarget = toChest.length();
            if(distToTarget > 0.5){
                toChest.normalize().multiplyScalar(m.vel.length());
                m.vel.lerp(toChest, Math.min(0.08, dt * 3));
            }
        }

        // Step position
        m.mesh.position.addScaledVector(m.vel, dt);

        // Orient along velocity direction each frame (realistic flight rotation)
        if(m.vel.lengthSq() > 0.01){
            const lookTarget = m.mesh.position.clone().add(m.vel);
            m.mesh.lookAt(lookTarget);
            if(!m.isShuriken) m.mesh.rotateY(Math.PI); // arrow -Z tip correction
        }

        // Shuriken spins in flight
        if(m.isShuriken){
            m.spinZ += dt * 22;
            m.mesh.rotateZ(dt * 22);
        }

        // Tip glow flicker
        const tg = m.mesh.userData.tipGlow;
        if(tg) tg.material.opacity = 0.6 + Math.sin(performance.now()*0.004)*0.12;
        const tl = m.mesh.userData.trailLight;
        if(tl) tl.intensity = 2.5 + Math.sin(performance.now()*0.008)*0.3;

        // Wall hit
        const gx = Math.round(m.mesh.position.x/GRID);
        const gz = Math.round(m.mesh.position.z/GRID);
        const cell = map[gx]?.[gz];
        // ── BULLET PUNCH-THROUGH on shoji doors ──
        // Pistol rounds bust unbroken shoji panels and KEEP GOING. The bullet
        // logs the door-bust, plays the existing splinter VFX (via the
        // standard panel-break path), and continues its flight without
        // stopping. Non-bullet missiles still hit the door as a wall.
        if (m.isBullet && cell && cell.type === 'shoji_door'){
            const _panel = (typeof shojiDoorPanels !== 'undefined')
                ? shojiDoorPanels.find(p => p.cx === gx && p.cz === gz && !p.broken)
                : null;
            if (_panel){
                _breakShojiPanel(_panel);
                addCameraTrauma(0.18);
                _aggroMonstersNearImpact(m.mesh.position);
                window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                    text:'🚪💥 The bullet punches through the shoji panel!'}, '*');
                // Don't continue — fall through to monster-hit detection in
                // case there's a goblin standing immediately behind the door.
            }
        }
        if(cell && (cell.type==='wall'||cell.type==='shoji')){
            _aggroMonstersNearImpact(m.mesh.position);
            // ── PISTOL bullets PUNCH THROUGH: leave a permanent white bullet
            // hole on the wall (no stick + fade). Disc faces back along the
            // bullet's flight path so it reads as the wound side.
            if (m.isBullet){
                const back = m.vel.clone().multiplyScalar(-1).normalize();
                const impact = m.mesh.position.clone();
                // Impact spark + dust puff — bright orange spark cluster from
                // the impact point + grey dust cloud, both biased away from
                // the wall along the bullet's reverse direction.
                _spawnBulletWallImpactSpark(impact, back);
                const holeMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff, transparent: true, opacity: 0.95,
                    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
                });
                const hole = new THREE.Mesh(new THREE.CircleGeometry(0.12, 18), holeMat);
                hole.position.copy(impact).addScaledVector(back, 0.04); // tiny offset so it sits on the wall surface
                hole.lookAt(impact.clone().add(back));
                scene.add(hole);
                const halo = new THREE.Mesh(
                    new THREE.CircleGeometry(0.32, 18),
                    new THREE.MeshBasicMaterial({
                        color: 0xffffff, transparent: true, opacity: 0.40,
                        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
                    })
                );
                halo.position.copy(hole.position);
                halo.quaternion.copy(hole.quaternion);
                scene.add(halo);
                const glow = new THREE.PointLight(0xffffff, 4.0, 1.2);
                glow.position.copy(impact);
                scene.add(glow);
                // Register with the pulse ticker; owner:null means wall hole.
                _activeBulletHoles.push({
                    hole, halo, glow, bullet: null,
                    owner: null,           // wall-mounted — null owner
                    isWallHole: true,
                    phase:    Math.random() * Math.PI * 2,
                    rate:     2.8 + Math.random() * 3.6,
                    jitterAt: 0,
                    baseDiscOp: 0.95,
                    baseHaloOp: 0.40,
                    baseGlowI:  4.0,
                });
                // FPS guard — cap total wall holes. When over 60, drop the
                // oldest wall hole so the pulse list stays cheap forever.
                let _wallHoleCount = 0;
                for (const _w of _activeBulletHoles) if (_w.isWallHole) _wallHoleCount++;
                if (_wallHoleCount > 60){
                    for (let _k = 0; _k < _activeBulletHoles.length; _k++){
                        if (_activeBulletHoles[_k].isWallHole){
                            const oldest = _activeBulletHoles[_k];
                            scene.remove(oldest.hole);
                            scene.remove(oldest.halo);
                            scene.remove(oldest.glow);
                            _activeBulletHoles.splice(_k, 1);
                            break;
                        }
                    }
                }
                // Bullet itself is consumed — no stuck-fade brass slug needed.
                scene.remove(m.mesh);
                activeMissiles.splice(i, 1);
                continue;
            }
            // Non-bullet missile lodges in the wall + fades over 4s.
            m.stuckInWall   = true;
            m.stuckAge      = 0;
            m.stuckFadeDur  = 4.0;
            m.vel.set(0, 0, 0);
            // Cache + force transparent on every material so the fade works
            m.mesh.traverse(c => {
                if (!c.material) return;
                c.material.transparent = true;
                if (c.material.userData.baseOpacity == null){
                    c.material.userData.baseOpacity = c.material.opacity ?? 1.0;
                }
            });
            // Kill any trail light so it doesn't burn through the wall while fading
            const _tl = m.mesh.userData.trailLight;
            if (_tl){ _tl.intensity = 0; m.mesh.remove(_tl); }
            continue;
        }
        if(m.mesh.position.y < 0 || m.mesh.position.y > WALL_H + 0.5){
            _aggroMonstersNearImpact(m.mesh.position);
            scene.remove(m.mesh); activeMissiles.splice(i,1); continue;
        }

        // Monster hit detection
        let hit = false;
        for(const w of monsterWrappers){
            if(w.userData.isDead) continue;
            const dx = w.position.x - m.mesh.position.x;
            const dy = (w.position.y+0.9) - m.mesh.position.y;
            const dz = w.position.z - m.mesh.position.z;
            if(Math.sqrt(dx*dx+dy*dy+dz*dz) < 0.85){
                hit = true;
                _onMissileHit(m, w, i);
                break;
            }
        }
    }
}

// T0.16 — Spawn a return shuriken thrown by a wounded monster back at the player.
// Removes the lodged shuriken (the one in the monster's body) and creates a
// fresh visual projectile that animates from monster chest to player chest over
// 0.5s. On arrival, emits MONSTER_ATTACK with the same damage value.
// ── Imp shuriken throw ───────────────────────────────────────────────────
// Yakuza Imps fight at range — they hurl a small shuriken instead of
// closing for melee. Damage is 1-10 per shuriken; flight is a short arc
// from the imp's chest to the player's torso. No homing — but the imp
// faces the player before throwing so ~95% land on a moving target.
function _spawnImpShuriken(impWrapper){
    const ud = impWrapper.userData;
    if (!ud || ud.isDead) return;

    const mesh = _buildShurikenModel();
    const startPos = impWrapper.position.clone(); startPos.y = 1.0;
    mesh.position.copy(startPos);
    mesh.scale.setScalar(0.55); // imps throw small ones
    scene.add(mesh);

    // Sound — short whoosh of a thrown blade
    if (typeof _playSpellSound === 'function') _playSpellSound('SHURIKEN', 0.55);

    const FLIGHT_MS = 420;
    const startT = performance.now();
    // Capture player position at throw time + add a small lead so the
    // player can dodge by sprinting sideways.
    const lead = 0.10; // seconds of lead
    const endPos = new THREE.Vector3(px, 1.45, pz);
    const dmg = 1 + Math.floor(Math.random() * 10); // 1-10

    function step(){
        const t = (performance.now() - startT) / FLIGHT_MS;
        if (t >= 1){
            scene.remove(mesh);
            // Distance-cull: only damage if the player is still close to
            // the impact point at the moment of arrival (so a sprint
            // really dodges).
            const ddx = px - endPos.x, ddz = pz - endPos.z;
            if (Math.hypot(ddx, ddz) < 1.2){
                _applyPlayerDamage(dmg, (ud.name || 'Yakuza Imp') + ' (shuriken)');
            }
            return;
        }
        // Lerp + small arc
        const arc = Math.sin(t * Math.PI) * 0.30;
        mesh.position.lerpVectors(startPos, endPos, t);
        mesh.position.y += arc;
        mesh.rotateZ(0.7);
        requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

// ── Flintlock pistol shot — fired by Yakuza Flintlock Imps ─────────────────
// Procedural muzzle-flash + bullet sphere with white trail + smoke puff +
// loud bang via the existing _playSpellSound synth. After firing, the imp
// enters a 10-second reload cooldown (set externally in tickMonsterAI).
function _playFlintlockBang(intensity){
    if (_audioMuted) return;
    const ctx = _getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = _SFX_VOLUME * (intensity || 1.0);
    master.connect(ctx.destination);
    // Sharp pop: hard noise burst + low-frequency thump for the body
    const noise = ctx.createBufferSource();
    noise.buffer = _whiteNoiseBuffer(ctx, 0.18);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.setValueAtTime(900, now);
    hp.frequency.exponentialRampToValueAtTime(2400, now + 0.18);
    const nG = ctx.createGain();
    nG.gain.setValueAtTime(1.0, now);
    nG.gain.exponentialRampToValueAtTime(0.01, now + 0.20);
    noise.connect(hp); hp.connect(nG); nG.connect(master);
    noise.start(now);
    // Thump body (sine sweep down)
    const thump = ctx.createOscillator();
    thump.type = 'sine';
    thump.frequency.setValueAtTime(140, now);
    thump.frequency.exponentialRampToValueAtTime(45, now + 0.20);
    const tG = ctx.createGain();
    tG.gain.setValueAtTime(0.0, now);
    tG.gain.linearRampToValueAtTime(0.9, now + 0.01);
    tG.gain.exponentialRampToValueAtTime(0.01, now + 0.30);
    thump.connect(tG); tG.connect(master);
    thump.start(now); thump.stop(now + 0.32);
}

function _spawnImpPistolShot(impWrapper){
    const ud = impWrapper.userData;
    if (!ud || ud.isDead) return;

    // Muzzle origin — slightly forward + chest-height of the imp
    const muzzleY = 1.05;
    const start = impWrapper.position.clone(); start.y = muzzleY;

    // ── Loud bang with spatial attenuation ──
    // Approximate the monster-sfx falloff curve: close = full, far = quiet.
    let bangVol = 1.0;
    if (typeof px === 'number' && typeof pz === 'number'){
        const dd = Math.hypot(impWrapper.position.x - px, impWrapper.position.z - pz) / GRID;
        if (dd > 22) bangVol = 0;
        else if (dd > 3) bangVol *= Math.pow(1 - (dd - 3) / 19, 2);
        else if (dd <= 1) bangVol *= 1.25;
    }
    if (bangVol > 0.01) _playFlintlockBang(bangVol);

    // ── Photo-real muzzle flash via the shared helper ──
    // Same lens-flare + hot core + flame cone stack as the player pistol.
    // Aimed at the player so the forward flame cone reads as the firing
    // direction. Imp shots get a slightly bigger scale (0.85→1.0) than the
    // player's so the burst stays visible at typical engagement range.
    {
        const _aimDx = px - start.x, _aimDz = pz - start.z;
        const _aimL  = Math.sqrt(_aimDx * _aimDx + _aimDz * _aimDz) || 1;
        const _impFwd = new THREE.Vector3(_aimDx / _aimL, 0, _aimDz / _aimL);
        _spawnMuzzleFlash(start, _impFwd, { scale: 0.95, lifeMs: 100, lightInt: 18, lightRng: 6.0 });
        // Bright forward tracer at fire-time — sells the muzzle velocity even
        // before the bullet model has moved noticeably.
        _spawnBulletTracer(start, _impFwd);
    }

    // ── Bullet — fast straight-line travel toward player position at fire time
    const bullet = new THREE.Group();
    const slug = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 8, 6),
        new THREE.MeshStandardMaterial({
            color: 0x9b8a55, emissive: 0xffb060, emissiveIntensity: 0.5,
            roughness: 0.3, metalness: 0.9,
        })
    );
    bullet.add(slug);
    const tracer = new THREE.Mesh(
        new THREE.SphereGeometry(0.10, 6, 5),
        new THREE.MeshBasicMaterial({
            color: 0xfff0c0, transparent: true, opacity: 0.6,
            blending: THREE.AdditiveBlending, depthWrite: false,
        })
    );
    bullet.add(tracer);
    bullet.position.copy(start);
    scene.add(bullet);

    const endPos = new THREE.Vector3(px, 1.4, pz);
    const totalDist = bullet.position.distanceTo(endPos);
    const FLIGHT_S = totalDist / 55;  // 55 wu/s — flintlock supersonic streak
    const startT = performance.now();
    const dirVec = endPos.clone().sub(bullet.position).normalize();

    // Damage roll — flintlocks hit hard: 3d6 + 5 (range 8-23)
    const d1 = 1 + Math.floor(Math.random() * 6);
    const d2 = 1 + Math.floor(Math.random() * 6);
    const d3 = 1 + Math.floor(Math.random() * 6);
    const dmg = d1 + d2 + d3 + 5;

    function tickBullet(){
        const elapsedS = (performance.now() - startT) / 1000;
        const t = Math.min(1, elapsedS / FLIGHT_S);
        bullet.position.copy(start).lerp(endPos, t);
        // Slight tracer flicker for visual punch
        tracer.material.opacity = 0.6 * (1 - t * 0.4) + 0.1 * Math.random();
        if (t >= 1){
            scene.remove(bullet);
            // Player still close to impact point → connects
            const ddx = px - endPos.x, ddz = pz - endPos.z;
            if (Math.hypot(ddx, ddz) < 1.2){
                _applyPlayerDamage(dmg, (ud.name || 'Yakuza Flintlock Imp') + ' (pistol)');
            }
            // Impact puff at end
            _spawnPistolImpactPuff(endPos);
            return;
        }
        requestAnimationFrame(tickBullet);
    }
    requestAnimationFrame(tickBullet);

    // ── Smoke puff at the muzzle ──
    const smoke = new THREE.Mesh(
        new THREE.SphereGeometry(0.20, 10, 8),
        new THREE.MeshBasicMaterial({
            color: 0x8a8478, transparent: true, opacity: 0.55,
            depthWrite: false,
        })
    );
    smoke.position.copy(start).add(dirVec.clone().multiplyScalar(0.3));
    scene.add(smoke);
    let smokeAge = 0; const smokeLife = 0.85;
    (function tickSmoke(){
        const dt2 = 0.016;
        smokeAge += dt2;
        const t = smokeAge / smokeLife;
        // Rise + expand + fade
        smoke.position.y += 0.25 * dt2;
        smoke.scale.setScalar(1 + t * 2.2);
        smoke.material.opacity = 0.55 * Math.max(0, 1 - t);
        if (smokeAge < smokeLife) requestAnimationFrame(tickSmoke);
        else scene.remove(smoke);
    })();

    // ── Muzzle sparks — 6–8 bright orange particles scatter from the pan ──
    {
        const _sparkCount = 6 + Math.floor(Math.random() * 3);
        const sparkMat = new THREE.MeshBasicMaterial({
            color: 0xff9900, transparent: true, opacity: 0.95,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const sparkGeo = new THREE.SphereGeometry(0.018, 5, 4);
        const sparks = [];
        for (let i = 0; i < _sparkCount; i++){
            const sp = new THREE.Mesh(sparkGeo, sparkMat.clone());
            sp.position.copy(start).add(dirVec.clone().multiplyScalar(0.22));
            const spread = 0.8;
            sp.userData.vel = new THREE.Vector3(
                dirVec.x * (4 + Math.random() * 5) + (Math.random() - 0.5) * spread,
                (Math.random() - 0.5) * spread * 0.8 + 1.5,
                dirVec.z * (4 + Math.random() * 5) + (Math.random() - 0.5) * spread,
            );
            sp.userData.life = 0.18 + Math.random() * 0.14;
            sp.userData.age = 0;
            scene.add(sp);
            sparks.push(sp);
        }
        (function tickSparks(){
            const dt2 = 0.016;
            let any = false;
            for (const sp of sparks){
                sp.userData.age += dt2;
                if (sp.userData.age >= sp.userData.life){ if (sp.parent) scene.remove(sp); continue; }
                any = true;
                sp.userData.vel.y -= 9.8 * dt2;
                sp.position.addScaledVector(sp.userData.vel, dt2);
                const tf = sp.userData.age / sp.userData.life;
                sp.material.opacity = 0.95 * Math.max(0, 1 - tf);
            }
            if (any) requestAnimationFrame(tickSparks);
        })();
    }

    // ── Extended arm + flintlock model — shows briefly while the imp fires ──
    // Parented to the imp wrapper so it tracks movement. Auto-removed after 0.6s.
    {
        const armGroup = new THREE.Group();
        // Forearm cylinder
        const armMat  = new THREE.MeshBasicMaterial({ color: 0xc8a87a });
        const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.48, 8), armMat);
        armMesh.rotation.x = Math.PI / 2;
        armMesh.position.set(0, 0, -0.24);
        armGroup.add(armMesh);
        // Flintlock barrel
        const barrelMat  = new THREE.MeshBasicMaterial({ color: 0x2a2a2a });
        const barrelMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.56, 8), barrelMat);
        barrelMesh.rotation.x = Math.PI / 2;
        barrelMesh.position.set(0.0, 0.04, -0.28 - 0.28);
        armGroup.add(barrelMesh);
        // Stock / grip box
        const stockMat  = new THREE.MeshBasicMaterial({ color: 0x5c3410 });
        const stockMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.26), stockMat);
        stockMesh.position.set(0, -0.04, -0.28);
        armGroup.add(stockMesh);
        // Lock plate on the side
        const lockMesh = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.07, 0.14), barrelMat);
        lockMesh.position.set(0.06, 0.04, -0.30);
        armGroup.add(lockMesh);

        // Position at imp's chest-height, aimed toward player
        const impFacing = Math.atan2(px - impWrapper.position.x, pz - impWrapper.position.z);
        armGroup.position.set(impWrapper.position.x, muzzleY - 0.15, impWrapper.position.z);
        armGroup.rotation.y = impFacing;
        scene.add(armGroup);
        setTimeout(() => { if (armGroup.parent) scene.remove(armGroup); }, 620);
    }

    addCameraTrauma(0.20);
}

function _spawnPistolImpactPuff(pos){
    // Small bullet impact at player end — bright spark + tiny dust ring
    const sp = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 10, 8),
        new THREE.MeshBasicMaterial({
            color: 0xfff2c0, transparent: true, opacity: 0.95,
            blending: THREE.AdditiveBlending, depthWrite: false,
        })
    );
    sp.position.copy(pos);
    scene.add(sp);
    let age = 0; const life = 0.18;
    (function tick(){
        const dt2 = 0.016;
        age += dt2;
        const t = age / life;
        sp.scale.setScalar(1 + t * 1.8);
        sp.material.opacity = 0.95 * Math.max(0, 1 - t);
        if (age < life) requestAnimationFrame(tick);
        else scene.remove(sp);
    })();
}

function _spawnReturnShuriken(monsterWrapper, origMissile){
    const ud = monsterWrapper.userData;
    if(ud.isDead) return; // Dead monsters can't throw

    // T0.21+T0.22 — Yank the lodged missile out and remove it from the
    // monster's lodgedMissiles list so it WON'T be counted in the death loot.
    // (If thrown back, the missile is -1 from final loot count.)
    if(origMissile && origMissile.lodged && origMissile.mesh){
        const par = origMissile.lodgeParent || monsterWrapper;
        par.remove(origMissile.mesh);
        if(origMissile.lodgeLight){ par.remove(origMissile.lodgeLight); origMissile.lodgeLight = null; }
        if(origMissile.bloomRing){ par.remove(origMissile.bloomRing); origMissile.bloomRing = null; }
        if(origMissile.bloomRing2){ par.remove(origMissile.bloomRing2); origMissile.bloomRing2 = null; }
        if (ud.lodgedMissiles){
            const i = ud.lodgedMissiles.indexOf(origMissile);
            if (i >= 0) ud.lodgedMissiles.splice(i, 1);
        }
        // Also splice from activeMissiles so tickMissiles stops touching it
        const ai = activeMissiles.indexOf(origMissile);
        if (ai >= 0) activeMissiles.splice(ai, 1);
        origMissile.lodged = false;
    }

    // Quick "pull out" anim hint — flash on monster + brief slash
    _monSetAnim(ud, 'attack');
    _autoFaceOnAttack(monsterWrapper); // T0.20 — face the returning shuriken thrower
    _playMonsterSfx('ATTACK_QUICK', monsterWrapper);

    // ── Pluck-and-taunt event card ────────────────────────────────────────
    // Fire a boxed log event so the player sees who plucked what and what
    // they said. Missile name comes from the lodged missile (defaults to
    // SHURIKEN since this is the shuriken-return path); taunt line + name
    // both vary so it doesn't read the same every time.
    const _mName  = (ud.name || 'Goblin').toUpperCase();
    const _wName  = ((origMissile && origMissile.cardName) || 'SHURIKEN').toUpperCase();
    const _taunts = [
        `Here, this is yours… catch this fool!`,
        `You dropped this — let me return it!`,
        `Want it back? Take it!`,
        `Thanks for the gift. Now have it back!`,
        `You'll need this where you're going.`,
    ];
    const _line = _taunts[Math.floor(Math.random() * _taunts.length)];
    window.parent.postMessage({ type: 'LOG_EVENT', logType: 'taunt',
        text: `<div class="tt-head">${_mName} PLUCKS THE ${_wName}</div>`
            + `<div class="tt-body">and tosses it back: &ldquo;${_line}&rdquo;</div>`
    }, '*');

    // Build a return shuriken mesh
    const mesh = _buildShurikenModel();
    const startPos = monsterWrapper.position.clone(); startPos.y += 1.2;
    mesh.position.copy(startPos);
    scene.add(mesh);

    const FLIGHT_MS = 500;
    const startT = performance.now();
    const endPos = new THREE.Vector3(px, 1.5, pz);
    const dmg = origMissile?.dmg ?? 8;

    function step(){
        const t = (performance.now() - startT) / FLIGHT_MS;
        if(t >= 1){
            // Hit the player
            scene.remove(mesh);
            // _applyPlayerDamage now spawns its own floating damage text
            // using the post-resolve actual; no need to double-spawn here.
            const _landed = _applyPlayerDamage(dmg, (ud.name||'Goblin') + ' (return)');
            if (_landed) _playMonsterSfx('LAUGH', monsterWrapper);
            return;
        }
        // Lerp toward player with a slight upward arc
        const arc = Math.sin(t * Math.PI) * 0.4;
        mesh.position.lerpVectors(startPos, endPos, t);
        mesh.position.y += arc;
        // Spin
        mesh.rotateZ(0.6);
        requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

function _onMissileHit(m, targetWrapper, idx){
    const ud = targetWrapper.userData;

    // Apply damage — show CRIT! text if critical
    _applyMonsterDamage(targetWrapper, m.dmg, 'DEFAULT');
    if(m.isCrit){
        const critPos = targetWrapper.position.clone(); critPos.y += 1.6;
        spawnDamageText('CRIT!', critPos, false);
    }

    // Camera shake + hitstop
    addCameraTrauma(m.isCrit ? 0.35 : 0.18);
    triggerHitStop(m.isCrit ? 90 : 55);

    // ── PISTOL: ALWAYS lodge as a permanent WHITE GLOWING BULLET HOLE ──
    // Bright additive white disc + point-light + lodged slug. Each hole
    // randomly flickers via _tickBulletHoles so the monster appears riddled
    // with bullet wounds that twinkle. Kept until the monster dies.
    if (m.isBullet){
        // ── Headshot detection ──
        // Use the bullet's ACTUAL world y at impact (m.mesh.position.y is
        // still world-space at this point, before reparenting). Compare to
        // the monster's wrapper y to get a local hit height. A goblin is
        // ~1.5 tall; ≥1.35 = head, mid = torso, low = legs.
        const hitLocalY = (m.mesh.position.y - targetWrapper.position.y);
        const isHeadshot = hitLocalY >= 1.35;
        // ── Flinch — knockback impulse along bullet path + brief scale wobble.
        //    Headshot gets ~2× the kick + a longer wobble for visual impact.
        const flinchStrength = isHeadshot ? 1.5 : 0.6;
        _pushMonster(targetWrapper, flinchStrength);
        const _origScl = targetWrapper.scale.clone();
        targetWrapper.scale.set(_origScl.x * 1.10, _origScl.y * 0.90, _origScl.z * 1.10);
        const _flinchMs = isHeadshot ? 180 : 110;
        setTimeout(() => {
            if (targetWrapper && !targetWrapper.userData.isDead){
                targetWrapper.scale.copy(_origScl);
            }
        }, _flinchMs);
        // Bonus damage: 2× for headshots (applied AFTER the initial damage
        // call up top — we re-fire the damage helper with the bonus delta).
        if (isHeadshot){
            const bonus = Math.max(1, Math.round(m.dmg * 1.0)); // 2× total
            _applyMonsterDamage(targetWrapper, bonus, 'DEFAULT');
            spawnDamageText('HEADSHOT', targetWrapper.position.clone().setY(targetWrapper.position.y + 2.0), false);
            addCameraTrauma(0.45);
            triggerHitStop(120);
            // Distinct high-pitched chime for headshot feedback
            if (typeof _getAudioCtx === 'function'){
                const ctx = _getAudioCtx();
                if (ctx && !_audioMuted){
                    const now = ctx.currentTime;
                    const o = ctx.createOscillator();
                    o.type = 'square';
                    o.frequency.setValueAtTime(2800, now);
                    o.frequency.exponentialRampToValueAtTime(3600, now + 0.07);
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0.18, now);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(now); o.stop(now + 0.13);
                }
            }
            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                text:`🎯 <b>HEADSHOT</b> on ${ud.name || 'Goblin'} — +${bonus} bonus.`}, '*');
            // Hit-marker (panel overlay) with the headshot flag
            window.parent.postMessage({type:'HIT_MARKER', kind:'headshot'}, '*');
        } else {
            // Standard body-shot hit-marker
            window.parent.postMessage({type:'HIT_MARKER', kind:'body'}, '*');
        }
        // ── Damage-aware wound placement ──
        //   • Crit  → random spot on the head (overrides isHeadshot heuristic)
        //   • Med-high (≥ 33% of monster maxHp) → chest cluster
        //   • Low                              → arm or leg (50/50)
        // Each zone has its own X/Y/Z range so multiple bullets spread within
        // the chosen region instead of dotting the whole body randomly.
        const _maxHp = ud.maxHp || 50;
        const _dmgFrac = m.dmg / _maxHp;
        const _critPlacement = !!m.isCrit;
        let bodyX, bodyY, bodyZ, woundZone;
        if (_critPlacement){
            // Head — y 1.50-1.78, narrow XZ
            bodyY = 1.50 + Math.random() * 0.28;
            bodyX = (Math.random() - 0.5) * 0.30;
            bodyZ = (Math.random() - 0.5) * 0.30;
            woundZone = 'head';
        } else if (_dmgFrac >= 0.33){
            // Chest — y 1.05-1.45, mid lateral
            bodyY = 1.05 + Math.random() * 0.40;
            bodyX = (Math.random() - 0.5) * 0.55;
            bodyZ = (Math.random() - 0.5) * 0.45;
            woundZone = 'chest';
        } else if (Math.random() < 0.5){
            // Arm — y 1.00-1.45, wider lateral
            bodyY = 1.00 + Math.random() * 0.45;
            bodyX = (Math.random() < 0.5 ? -1 : 1) * (0.45 + Math.random() * 0.30);
            bodyZ = (Math.random() - 0.5) * 0.35;
            woundZone = 'arm';
        } else {
            // Leg — y 0.20-0.85, lateral within stance width
            bodyY = 0.20 + Math.random() * 0.65;
            bodyX = (Math.random() < 0.5 ? -1 : 1) * (0.20 + Math.random() * 0.25);
            bodyZ = (Math.random() - 0.5) * 0.30;
            woundZone = 'leg';
        }
        scene.remove(m.mesh);
        // Re-parent the tiny lodged slug + shrink
        targetWrapper.add(m.mesh);
        m.mesh.scale.setScalar(0.85);
        m.mesh.position.set(bodyX, bodyY, bodyZ);

        // ── Bullet-hole dome ── small glowing lightbloom hole molded to the
        // body surface. 4cm hole on low-damage limb shots, larger on chest,
        // biggest on crit headshots — all stay permanently until monster dies.
        let woundR, glowI, haloOp;
        if (woundZone === 'head'){
            woundR = 0.12; glowI = 8.5; haloOp = 0.65; // biggest + brightest
        } else if (woundZone === 'chest'){
            woundR = 0.08; glowI = 6.0; haloOp = 0.50;
        } else {
            woundR = 0.04; glowI = 3.8; haloOp = 0.35; // 4cm limb hole
        }

        // Outward normal at the entry point — away from body center on XZ.
        const outward = new THREE.Vector3(bodyX, 0, bodyZ).normalize();
        if (outward.lengthSq() < 0.01) outward.set(0, 0, 1);

        // ── Flat 2D bullet hole — white lightbloom + flare ──
        // Domes were rendering as dots floating outside the model. Replaced
        // with FLAT circular decals pressed against the surface (offset
        // 0.012 wu along the outward normal so they don't z-fight). Three
        // layers per hole:
        //   1. Dark core hole — small dark center sells "pierced flesh"
        //   2. White additive disc — the lightbloom the user asked for
        //   3. Light flare — small bright cross/star on top
        const HOLE_CORE  = 0xffffff;    // pure white bloom
        const HOLE_GLOW  = 0xffffff;    // white halo
        const HOLE_DARK  = 0x100808;    // tiny dark center under the bloom
        const buildDecal = (px_, py_, pz_, out) => {
            // Tiny lookAt target offset along the outward normal — used to
            // orient every disc so it faces away from the body.
            const tgt = new THREE.Vector3(px_, py_, pz_).add(out);
            // Surface offset so layers stack without z-fighting:
            //   dark hole → halo → bloom → flare (each slightly further out)
            const surfOff = (n) => ({
                x: px_ + out.x * n,
                y: py_ + out.y * n,
                z: pz_ + out.z * n,
            });
            // 1. Dark pierced center
            const darkMat = new THREE.MeshBasicMaterial({
                color: HOLE_DARK, transparent: true, opacity: 0.9,
                depthWrite: false, side: THREE.DoubleSide,
            });
            const darkGeo = new THREE.CircleGeometry(woundR * 0.55, 18);
            const dark = new THREE.Mesh(darkGeo, darkMat);
            const dpos = surfOff(0.010);
            dark.position.set(dpos.x, dpos.y, dpos.z);
            dark.lookAt(tgt);
            // 2. Outer halo (soft white bloom)
            const haloMat = new THREE.MeshBasicMaterial({
                color: HOLE_GLOW, transparent: true, opacity: haloOp,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
            });
            const haloGeo = new THREE.CircleGeometry(woundR * 2.4, 24);
            const halo = new THREE.Mesh(haloGeo, haloMat);
            const hpos = surfOff(0.012);
            halo.position.set(hpos.x, hpos.y, hpos.z);
            halo.lookAt(tgt);
            // 3. Bright white bloom disc
            const coreMat = new THREE.MeshBasicMaterial({
                color: HOLE_CORE, transparent: true, opacity: 0.95,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
            });
            const coreGeo = new THREE.CircleGeometry(woundR, 20);
            const core = new THREE.Mesh(coreGeo, coreMat);
            const cpos = surfOff(0.014);
            core.position.set(cpos.x, cpos.y, cpos.z);
            core.lookAt(tgt);
            // 4. Light FLARE — sharp pinpoint star at the hit center
            const flareMat = new THREE.MeshBasicMaterial({
                color: 0xffffff, transparent: true, opacity: 1.0,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
            });
            const flareGeo = new THREE.CircleGeometry(woundR * 0.42, 14);
            const flare = new THREE.Mesh(flareGeo, flareMat);
            const fpos = surfOff(0.016);
            flare.position.set(fpos.x, fpos.y, fpos.z);
            flare.lookAt(tgt);
            return { dark, halo, core, flare };
        };
        const entry = buildDecal(bodyX, bodyY, bodyZ, outward);
        // Exit on the directly opposite side of the body (X/Z mirrored, same Y)
        const exitOut = outward.clone().negate();
        const exit = buildDecal(-bodyX, bodyY, -bodyZ, exitOut);

        // Parent every decal + the entry light to the WRAPPER directly.
        // The earlier bone-parented approach was doing per-shot bone scans,
        // multiple updateMatrixWorld calls, scene.attach → bone.add for
        // every dome — a measurable CPU spike per shot. With rapid pistol
        // fire stacking 5+ wounds per monster the engine could hitch hard
        // enough to read as a combat lock-up. Wrapper-parenting is one
        // matrix per decal, no scans, no scene-graph churn.
        targetWrapper.add(
            entry.dark, entry.halo, entry.core, entry.flare,
            exit.dark,  exit.halo,  exit.core,  exit.flare,
        );
        const holeGlow = new THREE.PointLight(HOLE_GLOW, glowI, 1.2);
        holeGlow.position.set(bodyX, bodyY, bodyZ);
        targetWrapper.add(holeGlow);
        const wound = {
            hole: entry.core, halo: entry.halo,
            dark: entry.dark, flare: entry.flare,
            exitCore: exit.core, exitHalo: exit.halo,
            exitDark: exit.dark, exitFlare: exit.flare,
            glow: holeGlow, bullet: m.mesh,
            owner: targetWrapper,
            phase:    Math.random() * Math.PI * 2,
            rate:     2.8 + Math.random() * 3.6,
            jitterAt: 0,
            baseDiscOp: 0.95,
            baseHaloOp: haloOp,
            baseGlowI:  glowI,
        };
        _activeBulletHoles.push(wound);
        if (!ud.bulletHoles) ud.bulletHoles = [];
        ud.bulletHoles.push(wound);
        if (idx >= 0) activeMissiles.splice(idx, 1);
        return;
    }

    // T0.21+T0.22 — 50% chance to lodge in the monster. The other 50% bounces
    // off and the missile is consumed (no instant ammo recovery — recovery is
    // now via loot drops at monster death).
    const lodges = Math.random() < 0.5;
    if (!lodges){
        scene.remove(m.mesh);
        if (idx >= 0) activeMissiles.splice(idx, 1);
        return;
    }

    // Lodge — missile sticks out of monster, parented so it moves with them
    m.lodged = true;
    m.lodgeTarget = targetWrapper;
    m.lodgeParent = targetWrapper;
    // Persist this missile in the monster's lodged list — converted to loot on death
    if (!ud.lodgedMissiles) ud.lodgedMissiles = [];
    ud.lodgedMissiles.push(m);

    // Detach from scene and re-parent to the monster wrapper
    scene.remove(m.mesh);
    targetWrapper.add(m.mesh);
    // Shurikens lodge at half size (smaller, twirling stars) per user spec.
    // Arrows / bow shafts keep the 0.85 scale.
    m.mesh.scale.setScalar(m.isShuriken ? 0.425 : 0.85);

    // ── Lodge position respects facing ──
    // The arrow plants on the side of the body that FACED the incoming
    // shot. Compute the arrow's incoming direction in the monster's LOCAL
    // frame so a goblin turned sideways gets hit on its side, not its
    // chest. Random Y (height along body) + small tangential jitter give
    // the "various locations" the user asked for, without ever planting
    // on the back of a target that's facing the shooter.
    const _impactDirWorld = m.vel.clone().normalize();
    const _monQuat = new THREE.Quaternion();
    targetWrapper.getWorldQuaternion(_monQuat);
    const _impactDirLocal = _impactDirWorld.clone()
        .applyQuaternion(_monQuat.clone().invert());
    // Body ellipsoid (local space): half-width / half-depth roughly match
    // the goblin proportions. Height handled separately via random Y.
    const BODY_RX = 0.32;
    const BODY_RZ = 0.26;
    // Incoming-surface direction = opposite of where the arrow is heading,
    // projected to the XZ plane (the body is a vertical column — we don't
    // wrap arrows under the chin or up the chest from above).
    let surfDx = -_impactDirLocal.x;
    let surfDz = -_impactDirLocal.z;
    const _surfMag = Math.hypot(surfDx, surfDz);
    if (_surfMag < 0.001){ surfDx = 0; surfDz = 1; }  // straight-down freak case → use front
    else { surfDx /= _surfMag; surfDz /= _surfMag; }
    // Try up to 12 random surface points (Y + tangential offset) and pick
    // the first one ≥ MIN_SPREAD from prior lodges — keeps multi-arrow
    // hits from stacking into one fat shaft.
    const MIN_SPREAD = 0.40;
    const MIN_SPREAD_SQ = MIN_SPREAD * MIN_SPREAD;
    const _priorLodges = (ud.lodgedMissiles || []).filter(lm => lm !== m && lm.mesh);
    let bodyX = 0, bodyY = 0, bodyZ = 0;
    let bestPos = null, bestMinDistSq = -1;
    for (let _try = 0; _try < 12; _try++){
        // Tangential offset along the body's hit-side arc — keeps the
        // lodge ON the side the arrow came from, with ±0.22 lateral spread.
        const tangAng = (Math.random() - 0.5) * 0.9;   // ±~26° around the surface point
        const cosT = Math.cos(tangAng), sinT = Math.sin(tangAng);
        // Rotate (surfDx, surfDz) by tangAng around Y → still on incoming side
        const dx = surfDx * cosT - surfDz * sinT;
        const dz = surfDx * sinT + surfDz * cosT;
        const tx = dx * BODY_RX;
        const tz = dz * BODY_RZ;
        // Random height — chest / shoulder / hip / thigh.
        const ty = 0.55 + Math.random() * 1.25;
        let minDsq = Infinity;
        for (const lm of _priorLodges){
            const ldx = lm.mesh.position.x - tx;
            const ldy = lm.mesh.position.y - ty;
            const ldz = lm.mesh.position.z - tz;
            const dsq = ldx*ldx + ldy*ldy + ldz*ldz;
            if (dsq < minDsq) minDsq = dsq;
        }
        if (!_priorLodges.length || minDsq >= MIN_SPREAD_SQ){
            bodyX = tx; bodyY = ty; bodyZ = tz;
            bestPos = null;
            break;
        }
        if (minDsq > bestMinDistSq){
            bestMinDistSq = minDsq;
            bestPos = { x: tx, y: ty, z: tz };
        }
    }
    if (bestPos){
        bodyX = bestPos.x; bodyY = bestPos.y; bodyZ = bestPos.z;
    }
    m.mesh.position.set(bodyX, bodyY, bodyZ);

    // ── Lodge orientation ──
    // Arrow model has its TIP at local -Z and tail at +Z. We want the tip
    // buried into the monster (along impactDir) with the shaft sticking
    // out behind it. lookAt makes local +Z face the target — so we point
    // local +Z at the OPPOSITE of impactDir (the "out of body" direction),
    // which leaves -Z (the tip) pointing INTO the body.
    const impactDir = m.vel.clone().normalize();
    const monWorldQuat = new THREE.Quaternion();
    targetWrapper.getWorldQuaternion(monWorldQuat);
    impactDir.applyQuaternion(monWorldQuat.invert());
    const arrowFwd = impactDir.clone().negate(); // tail direction (out of body)
    if (arrowFwd.lengthSq() > 0.001){
        const up = Math.abs(arrowFwd.y) > 0.95 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
        const rotMat = new THREE.Matrix4().lookAt(new THREE.Vector3(), arrowFwd, up);
        m.mesh.quaternion.setFromRotationMatrix(rotMat);
        // Origin sits AT the surface — no extra push into the body. Combined
        // with the local-Z fragment discard below, the inside half of the
        // missile is invisible and only the shaft/star outside the body
        // renders.
    }

    // ── Hide the embedded half of the missile ──
    // After the lookAt above, the missile's LOCAL Z axis points outward
    // from the body (tail = +Z, tip = -Z). Inject a fragment-shader discard
    // that culls anything at local z < 0 — i.e. the half buried in the
    // monster. Works regardless of monster position/rotation because it's
    // based purely on the missile's own local geometry coordinates.
    m.mesh.traverse(c => {
        if (!c.isMesh || !c.material) return;
        const apply = (mat) => {
            if (mat._lodgeClipApplied) return;
            mat._lodgeClipApplied = true;
            const prev = mat.onBeforeCompile;
            mat.onBeforeCompile = (shader) => {
                if (typeof prev === 'function') prev(shader);
                shader.vertexShader = shader.vertexShader
                    .replace('#include <common>',
                        '#include <common>\nvarying float vLodgeLocalZ;')
                    .replace('#include <begin_vertex>',
                        '#include <begin_vertex>\nvLodgeLocalZ = position.z;');
                shader.fragmentShader = shader.fragmentShader
                    .replace('#include <common>',
                        '#include <common>\nvarying float vLodgeLocalZ;')
                    .replace('void main() {',
                        'void main() {\n  if (vLodgeLocalZ < 0.0) discard;');
            };
            mat.needsUpdate = true;
        };
        if (Array.isArray(c.material)) c.material.forEach(apply);
        else apply(c.material);
    });

    // Brief impact flash at the lodge point. Intensity kept LOW (was 24
    // — that lit the goblin's PBR material like a flashbulb on every hit,
    // which the user called out as "monsters reflect light when attacked").
    const flash = new THREE.PointLight(0xffffff, 4, 1.6);
    flash.position.set(bodyX, bodyY, bodyZ);
    targetWrapper.add(flash);
    setTimeout(()=>targetWrapper.remove(flash), 130);

    // T0.16/T0.21 — Shuriken return-throw. If a SHURIKEN lodges in a live
    // monster, 60% chance the monster pulls it out 1.0s later and flings it
    // back for the same damage. When this happens the missile is spliced
    // from ud.lodgedMissiles (so it won't be counted in the death loot drop).
    if(m.isShuriken && !m.fromMonster && !ud.isDead && Math.random() < 0.6){
        setTimeout(()=> _spawnReturnShuriken(targetWrapper, m), 1000);
    }

    // ── Persistent bloom light at the lodge point (no auto-removal) ──
    const bloomColor = m.isShuriken ? 0x88ffdd : 0x88bbff;
    const lodgeGlow = new THREE.PointLight(bloomColor, 4, 2.5);
    lodgeGlow.position.set(bodyX, bodyY, bodyZ);
    targetWrapper.add(lodgeGlow);
    m.lodgeLight = lodgeGlow;

    // T0.21 — No more instant 50% ammo recovery. Recovery only happens via
    // loot drops at monster death (see _tickDyingMonsters sink phase).
    // Lean missile into the body for a more violent stick
    m.mesh.rotation.x += (Math.random()-0.5)*0.3;
    m.mesh.rotation.z += (Math.random()-0.5)*0.3;
}

// ── Card Launch VFX system ────────────────────────────────────────────────────
const activeSpells = [];

// ── Fire DOT system ──────────────────────────────────────────────────────────
const activeDots = [];

function _applyFireDot(target, totalDmg){
    // Continuous DOT: 10% of totalDmg every 5 seconds, indefinitely until target dies
    const tickDmg = Math.max(8, Math.round(totalDmg * 0.10));
    const INTERVAL = 5.0; // 5 seconds between ticks
    // Monster materials stay LOCKED to the semi-hologram baseline — no
    // emissive pulse here any more. User spec: "monsters change texture
    // too much. just stick with them being semi holygram". The fire-DOT
    // visual is the persistent flame cluster (_addFireballFlames) +
    // periodic damage text + spawnDamageText; no body recolour.
    const pulseInterval = setInterval(()=>{ /* no-op visual — DOT only */ }, INTERVAL * 1000);
    activeDots.push({
        target, tickDmg, ticks: Infinity, timer: INTERVAL, interval: INTERVAL,
        _clearFx: pulseInterval
    });
}

function tickDots(dt){
    for(let i = activeDots.length-1; i >= 0; i--){
        const d = activeDots[i];
        if(d.target.userData.isDead){ clearInterval(d._clearFx); activeDots.splice(i,1); continue; }
        d.timer -= dt;
        if(d.timer <= 0){
            d.timer = d.interval;
            _applyMonsterDamage(d.target, d.tickDmg, d.el || 'FIRE');
            spawnDamageText(`${d.icon || '🔥'}${d.tickDmg}`, d.target.position.clone(), false);
            if(d.ticks !== Infinity){
                d.ticks--;
                if(d.ticks <= 0){ clearInterval(d._clearFx); activeDots.splice(i,1); }
            }
        }
    }
}

// ── GALE vortex — roaming wind tornado ─────────────────────────────────────
// Initial burst slams the targeted monster, then the vortex DETACHES and
// wanders the room as a free-roaming column for the full duration. Anything
// it sweeps past (monsters AND the player) gets caught: monsters take WIND
// damage + brief stun, the player takes WIND damage + a shove. The column
// picks new wander destinations every ~1.5s and slides at ~3 wu/s.
const _activeVortexes = [];
const _GALE_RADIUS         = 1.35;   // catch radius in world units (≈ 1.3 tiles)
const _GALE_SPEED          = 6.5;    // wu/s while wandering (was 3.0 — faster, more menacing)
const _GALE_REPATH_EVERY   = 0.9;    // seconds between random destinations (was 1.5)
const _GALE_HIT_CD_MONSTER = 0.35;   // per-target re-hit cooldown (was 0.45)
const _GALE_HIT_CD_PLAYER  = 0.55;   // player re-hit cooldown
const _GALE_PLAYER_SAFE    = 0.85;   // < this many tiles = "too close"
const _GALE_SPIN_RPS       = 4.2;    // funnel rotations per second
const _GALE_HEIGHT         = 2.8;    // visual column height (world units)
// Reusable Vector3s for streak orientation (avoid per-frame allocs)
const _galeUp     = new THREE.Vector3(0, 1, 0);
const _galeTmpVec = new THREE.Vector3();

function _galePickWanderTarget(fromX, fromZ){
    // Try up to 16 random offsets within an 8-tile radius; first walkable
    // landing wins. Falls back to the current position if nothing sticks.
    for (let i = 0; i < 16; i++){
        const ang = Math.random() * Math.PI * 2;
        const dist = 3 + Math.random() * 8;
        const nx = fromX + Math.cos(ang) * dist;
        const nz = fromZ + Math.sin(ang) * dist;
        if (typeof canWalk === 'function' && canWalk(nx, nz)) return { x: nx, z: nz };
    }
    return { x: fromX, z: fromZ };
}

function _spawnGaleVortex(target){
    if(!target || !target.userData || target.userData.isDead) return;
    const ud = target.userData;

    // ── Spell resistance roll on the initial target ──
    // Each monster has a WIND vulnerability multiplier (>1 = weak, <1 =
    // resistant). Convert to a resist probability, capped at 70%. Resisted
    // targets still see the vortex spawn — they just shrug off the catch.
    const wvuln = ud.vulnerability?.WIND ?? 1.0;
    const resistChance = Math.max(0, Math.min(0.70, (1.0 - wvuln) * 0.70));
    const initialResisted = Math.random() < resistChance;

    // Spec: a "turn" is 2.5s. Initial target captured for 2-4 turns
    // (= 5–10s), MINIMUM 2 FULL TURNS guaranteed even if RNG rolled low.
    const TURN_SEC = 2.5;
    const MIN_TURNS = 2;
    const turns = MIN_TURNS + Math.floor(Math.random() * 3); // 2, 3, or 4
    const initialCaptiveDur = turns * TURN_SEC;              // 5, 7.5, or 10
    // Vortex life MUST be long enough to honor the longest captive duration,
    // otherwise the captive gets released when the vortex disappears.
    const STUN_DUR  = Math.max(10.0, initialCaptiveDur);
    const tickEvery = 0.6;

    // Burst damage: CYCLONE is a SPIN spell — the burst is light so the
    // captive almost always survives to twirl (DoT carries the kill). Was
    // 20-50, now 8-22 + ~12% crit; resisted hits drop to 0.4× as before.
    // Snapshot the impact position BEFORE damage in case it kills the target
    // and the wrapper gets shoved into the dying-monster pipeline.
    const impactPos = target.position.clone();
    const burst = 8 + Math.floor(Math.random() * 15);
    const isCrit = Math.random() < 0.12;
    let finalBurst = isCrit ? Math.round(burst * 2) : burst;
    if (initialResisted) finalBurst = Math.round(finalBurst * 0.4);
    _applyMonsterDamage(target, finalBurst, 'WIND');
    spawnDamageText(
        `🌪${finalBurst}${isCrit ? ' CRIT' : ''}${initialResisted ? ' RES' : ''}`,
        impactPos.clone(), false
    );
    // Even if the burst killed the initial target we STILL spawn the vortex —
    // it roams the room, sweeping up nearby monsters as captives. Bailing
    // here is what made the user see "no twirl" when the cyclone one-shot
    // its first hit.
    const initialAlive = !ud.isDead;
    if (initialAlive && !initialResisted){
        ud._stunTimer = Math.max(ud._stunTimer || 0, initialCaptiveDur);
        ud._boulderStunned = true;
        ud._stunStartTime = Date.now();
    }

    // ── Hyper-real mini-tornado (aerodynamic model) ──
    // No round particles — round dots look like bubbles, not air. A real
    // vortex reads through:
    //   1. A wispy VAPOR CLOUD SHEET (low-pressure core where air condenses)
    //      — rendered as a tapered open lathe with an FBM-noise GLSL shader
    //      that scrolls horizontally (swirl) and vertically (stack effect).
    //   2. HELICAL STREAMLINES — thin tubes along the actual paths air
    //      parcels would travel (the streamlines of a Rankine vortex).
    //   3. MOTION-ALIGNED STREAKS — thin cylinder segments oriented along
    //      their local velocity tangent. Looks like motion-blur trails of
    //      moving air, never like floating dots.
    //   4. BOUNDARY-LAYER CONVERGENCE at the base — radial inward streaks
    //      on the floor representing air rushing into the low-pressure core.
    //   5. EXHAUST CAP at the top using the same cloud shader (flatter).
    const vortexGroup = new THREE.Group();
    const _galeT0 = performance.now() * 0.001;

    // Funnel profile — narrow base (where the vortex meets the ground), wider
    // top (where the air diverges into the parent cloud). Same shape used by
    // the cloud sheet, the streamlines, and the streak orbits so they read
    // as one coherent column.
    function _galeRadiusAt(ty){
        return 0.28 + Math.pow(ty, 1.25) * 1.02;
    }
    function _galeProfile(segs){
        const pts = [];
        for (let i = 0; i <= segs; i++){
            const ty = i / segs;
            pts.push(new THREE.Vector2(_galeRadiusAt(ty), ty * _GALE_HEIGHT));
        }
        return pts;
    }

    // 1. Vapor cloud sheet (the primary visual). Open lathe (no caps), back-
    //    faced so we see the inner wall when the camera is close. FBM noise
    //    scrolling around-and-up produces wispy condensation bands that
    //    visibly rotate around the axis.
    const cloudGeo = new THREE.LatheGeometry(_galeProfile(20), 64);
    const cloudMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime:    { value: 0 },
            uColDark: { value: new THREE.Color(0x3a4858) },
            uColLite: { value: new THREE.Color(0xc7d6e3) },
            uOpacity: { value: 0.85 },
        },
        transparent: true,
        depthWrite:  false,
        side:        THREE.DoubleSide,
        blending:    THREE.AdditiveBlending,
        vertexShader: `
            varying vec2 vUv;
            void main(){
                vUv = uv;
                gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            precision highp float;
            varying vec2 vUv;
            uniform float uTime;
            uniform vec3  uColDark;
            uniform vec3  uColLite;
            uniform float uOpacity;
            float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
            float noise(vec2 p){
                vec2 i = floor(p); vec2 f = fract(p);
                f = f*f*(3.0-2.0*f);
                float a = hash(i), b = hash(i+vec2(1.0,0.0)),
                      c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
                return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
            }
            float fbm(vec2 p){
                float v = 0.0; float a = 0.5;
                for (int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.07; a *= 0.5; }
                return v;
            }
            void main(){
                // uv.x wraps around the axis (swirl), uv.y is bottom→top
                // (stack effect). Scroll both with time so the cloud bands
                // visibly rotate around the column AND lift upward.
                vec2 p = vec2(vUv.x * 6.0 + uTime * 0.65, vUv.y * 4.5 - uTime * 1.15);
                float n  = fbm(p);
                float n2 = fbm(p * 2.4 + uTime * 0.35);
                // Pinch the noise into thin wispy bands (high contrast)
                float band = smoothstep(0.38, 0.92, n) + n2 * 0.25 - 0.10;
                band = clamp(band, 0.0, 1.0);
                // Vertical edge fade — soft entry at the base, soft outflow at the top
                float topFade = smoothstep(0.0, 0.18, vUv.y) * smoothstep(1.0, 0.82, vUv.y);
                float a = band * topFade * uOpacity;
                vec3 col = mix(uColDark, uColLite, band);
                gl_FragColor = vec4(col, a);
            }
        `,
    });
    const cloudSheet = new THREE.Mesh(cloudGeo, cloudMat);
    vortexGroup.add(cloudSheet);

    // 2. Helical streamlines — 5 very thin tubes (radius 0.014) following
    //    actual helical paths from base to top. Each rotates independently
    //    around y at fast counter-spinning rates, so the visible spiral
    //    structure of the vortex never reads as a static "wire frame".
    const streamlines = [];
    const STREAM_N    = 5;
    for (let s = 0; s < STREAM_N; s++){
        const pts = [];
        const turns = 2.6 + Math.random() * 0.7;
        const phaseOff = (s / STREAM_N) * Math.PI * 2;
        const samples = 64;
        for (let i = 0; i <= samples; i++){
            const ty = i / samples;
            const r  = _galeRadiusAt(ty);
            const a  = phaseOff + ty * Math.PI * 2 * turns;
            pts.push(new THREE.Vector3(Math.cos(a) * r, ty * _GALE_HEIGHT, Math.sin(a) * r));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tubeGeo = new THREE.TubeGeometry(curve, 80, 0.014, 4, false);
        const tubeMat = new THREE.MeshBasicMaterial({
            color: 0xdfeefa, transparent: true, opacity: 0.65,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const tube = new THREE.Mesh(tubeGeo, tubeMat);
        tube.userData.spinRate = (s % 2 === 0 ? 1 : -1) * (3.5 + Math.random() * 2.5);
        vortexGroup.add(tube);
        streamlines.push(tube);
    }

    // 3. Motion-aligned streak cylinders — 36 thin elongated cylinders that
    //    orient along their local helical tangent (the air's velocity vector
    //    at that point). Each is sized to feel like a brief motion trail
    //    rather than a particle. Recycled from top → bottom continuously.
    const streaks = [];
    const STREAK_N = 36;
    for (let i = 0; i < STREAK_N; i++){
        // CylinderGeometry: long axis along +Y by default — perfect for
        // quaternion-from-up-vector orientation in the tick.
        const geo = new THREE.CylinderGeometry(0.018, 0.018, 0.38, 5, 1, true);
        const mat = new THREE.MeshBasicMaterial({
            color: 0xeef6ff, transparent: true, opacity: 0.0,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const m = new THREE.Mesh(geo, mat);
        m.userData.phase  = Math.random() * Math.PI * 2;
        m.userData.spin   = 6.5 + Math.random() * 4.5;
        m.userData.y      = Math.random() * _GALE_HEIGHT;
        m.userData.vy     = 1.6 + Math.random() * 1.8;
        m.userData.rJit   = 0.92 + Math.random() * 0.22;
        vortexGroup.add(m);
        streaks.push(m);
    }

    // 4. Boundary-layer convergence streaks — 8 thin radial bars on the floor
    //    pointing inward, suggesting air rushing into the low-pressure core
    //    (the convergent inflow of a real vortex). Counter-rotate slowly.
    const convStreaks = [];
    for (let i = 0; i < 8; i++){
        // Box geometry, very thin, long, flat on floor
        const geo = new THREE.BoxGeometry(0.04, 0.02, 0.55);
        const mat = new THREE.MeshBasicMaterial({
            color: 0xa3b5c4, transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const bar = new THREE.Mesh(geo, mat);
        bar.userData.phase = (i / 8) * Math.PI * 2;
        bar.userData.r     = 0.95;
        bar.position.y = 0.03;
        vortexGroup.add(bar);
        convStreaks.push(bar);
    }

    // 5. Floor dust ring — thin halo where the funnel meets the ground.
    const dustRing = new THREE.Mesh(
        new THREE.RingGeometry(0.30, 1.05, 56),
        new THREE.MeshBasicMaterial({
            color: 0xa9bccc, transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
        })
    );
    dustRing.rotation.x = -Math.PI / 2;
    dustRing.position.y = 0.02;
    vortexGroup.add(dustRing);

    // 6. Floor kick-up puffs — short-lived OBLATE (flattened) spheres, not
    //    round bubbles. scale.y is 0.32 so they sit like ground-hugging dust
    //    plumes, not balls of foam.
    const floorPuffs = [];
    for (let i = 0; i < 10; i++){
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 10, 7),
            new THREE.MeshBasicMaterial({
                color: 0xb6c6d4, transparent: true, opacity: 0.0,
                blending: THREE.AdditiveBlending, depthWrite: false,
            })
        );
        p.userData.age  = Math.random() * 0.8;
        p.userData.life = 0.70 + Math.random() * 0.40;
        p.userData.ang  = Math.random() * Math.PI * 2;
        p.userData.r0   = 0.28 + Math.random() * 0.15;
        p.userData.vr   = 0.55 + Math.random() * 0.40;
        p.userData.vy   = 0.18 + Math.random() * 0.22;
        vortexGroup.add(p);
        floorPuffs.push(p);
    }

    // 7. Top vapor exhaust — a flat disc with the same cloud shader, oblate
    //    so it reads as the cap where the funnel disperses overhead.
    const capGeo = new THREE.CircleGeometry(_galeRadiusAt(1.0) * 1.10, 48);
    const capMat = cloudMat.clone();
    // Override uniforms on the clone so the cap can have its own opacity
    capMat.uniforms = {
        uTime:    { value: 0 },
        uColDark: { value: new THREE.Color(0x4a5868) },
        uColLite: { value: new THREE.Color(0xdde8f2) },
        uOpacity: { value: 0.70 },
    };
    const topCapMesh = new THREE.Mesh(capGeo, capMat);
    topCapMesh.rotation.x = -Math.PI / 2;
    topCapMesh.position.y = _GALE_HEIGHT - 0.05;
    vortexGroup.add(topCapMesh);

    // 8. Eye column — very faint vertical strip suggesting the low-pressure
    //    heart. Kept thin + faint so it never re-introduces the "solid pipe".
    const eye = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.025, _GALE_HEIGHT * 0.88, 10, 1, true),
        new THREE.MeshBasicMaterial({
            color: 0xeaf4ff, transparent: true, opacity: 0.14,
            blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
        })
    );
    eye.position.y = _GALE_HEIGHT * 0.44;
    vortexGroup.add(eye);

    // Stash helpers on the group so tickVortexes can reuse them
    vortexGroup.userData.radiusAt = _galeRadiusAt;
    vortexGroup.userData.bornAt   = _galeT0;

    vortexGroup.position.copy(impactPos);
    scene.add(vortexGroup);

    // Cool blue-white light
    const vLight = new THREE.PointLight(0xbcdfff, 1.8, 5.0, 1.8);
    vLight.position.copy(impactPos).setY(1.0);
    scene.add(vLight);
