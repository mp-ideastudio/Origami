// ── PiP 3D Top-Down Camera Render ────────────────────────────────────────────
// The PiP is now a real Three.js top-down camera render, not a 2D tile map.
// We render the scene into a WebGLRenderTarget, read the pixels, paint them
// into an offscreen canvas, then postMessage the ImageBitmap to Panels.
// T0.12 — readRenderTargetPixels GPU stall was tanking FPS 120→40. Reducing
// PIP RT size from 320 → 192 cuts readback bytes by 64% (~3.6× faster sync).
// Full fix (replace readback with OffscreenCanvas/dedicated renderer) deferred
// to T3.6. With this mitigation + reduced poll rate (see _pipSendTimer below),
// we get back into 80+ fps territory.
const PIP_RT_SIZE = 192;
const _pipRT = new THREE.WebGLRenderTarget(PIP_RT_SIZE, PIP_RT_SIZE, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    depthBuffer: true,
    stencilBuffer: false,
});
const _pipPixels   = new Uint8Array(PIP_RT_SIZE * PIP_RT_SIZE * 4);
const _pipComposite = document.createElement('canvas');
_pipComposite.width = PIP_RT_SIZE; _pipComposite.height = PIP_RT_SIZE;
const _pipCompCtx   = _pipComposite.getContext('2d');
let   _pipSendTimer = 0;

// Keep pip-canvas for the fullscreen M-key overview only
const pipCanvas = document.getElementById('pip-canvas');
const pipCtx    = pipCanvas ? pipCanvas.getContext('2d') : null;
const PIP_VIEW  = 14; // still used by markSeen fog-of-war

function renderPipFpv(){ /* no-op */ }
function updatePipCrossfade(){ /* no-op */ }

// ── Smart PiP Cinematic Angle System ─────────────────────────────────────────
// Every PIP_ANGLE_TURNS player steps, evaluate 8 evenly-spaced azimuth angles.
// For each candidate, cast 6 sample rays between the camera and the midpoint
// between player and nearest monster — pick the angle with the clearest view.
// The camera switches smoothly (lerp) over ~1.5s so there's no jarring cut.

const _pipRaycaster = new THREE.Raycaster();
let _pipWallCache = null; // cached wall mesh list — rebuilt lazily

function _pipGetSceneWalls(){ return []; } // no-op — top-down needs no wall check
function _pipInvalidateWallCache(){}
function _pipPickBestAngle(){} // no-op — top-down has no angle to pick

// Call this from the move system each step
function _pipOnPlayerStep(){
    _pipTurnCount++;
    if(_pipTurnCount % PIP_ANGLE_TURNS === 0){
        _pipPickBestAngle();
    }
}

// T0.9 — Find nearest hostile monster (returns {x, z, dist} or null).
// Used by the PIP cinematic system to auto-frame combat moments.
function _pipNearestHostile() {
    let best = null;
    for (const w of monsterWrappers) {
        if (w.userData.isDead) continue;
        if (w.userData.aiState !== 'hostile') continue;
        const dx = w.position.x - px, dz = w.position.z - pz;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (!best || d < best.dist) best = { x: w.position.x, z: w.position.z, dist: d };
    }
    return best;
}

// T0.24 — "Animation capture mode" for the PIP cam. Triggers in two cases:
//   1. Active combat (_lastCombatVisible is true — player has a hostile in
//      the forward cone with LOS), OR
//   2. Any hostile within 4 tiles of the player even outside the cone.
// When triggered, the PIP camera tilts dramatically (movie-cam feel),
// tightens onto the action, and frames the midpoint of player + nearest
// hostile. Manual PIP input (zoom/rot/pan) locks out the cinematic for 4s.
// Load-time grace period — suppresses any auto-cinematic / orbit
// transitions for the first few seconds so the game opens at its plain
// top-down framing instead of zooming around the player.
const _engineLoadT = performance.now();
const LOAD_GRACE_MS = 4000;
function _pipUpdateCinematic(dt) {
    const inLoadGrace = (performance.now() - _engineLoadT) < LOAD_GRACE_MS;
    const sinceInteract = (Date.now() - _pipLastInteractionTime) / 1000;
    const allowAuto = !inLoadGrace && sinceInteract > 4.0;
    const near = allowAuto ? _pipNearestHostile() : null;
    const COMBAT_PIP_RANGE = 4.0 * GRID;
    const inCombat = allowAuto && (_lastCombatVisible || (near && near.dist < COMBAT_PIP_RANGE));
    if (inCombat && near) _pipCinematicTarget = near;
    const target = inCombat ? 1 : 0;
    _pipCinematicT += (target - _pipCinematicT) * Math.min(1, dt * 2.5);
    if (_pipCinematicT < 0.01) _pipCinematicTarget = null;
}

// ── PERF MODE ──
// Soft heavy-combat flag. Triggered when 5+ hostile monsters share the
// player's room, OR rollingFt > 28ms, OR Oni-Baba reports renderStress
// > 0.85. While active:
//   • monOutlinePass restricted to the locked target only (drops N-1 depth
//     mask passes — biggest single GPU win, scales with monster count)
//   • PIP cull radius tightens via _pipPerfPin (existing system)
// NO off-room culling — that caused stutter + invisible monster bugs.
// Total aggro is instead CAPPED in _setMonsterHostile (6 max) so the
// engine never has to grind on a whole-dungeon mob.
// Hysteresis: enter at ≥5 hostiles OR FT>28ms; exit when ≤2 hostiles AND
// FT<22ms for 30 consecutive frames. Prevents thrash at the threshold.
let _perfMode        = false;
let _perfGoodFrames  = 0;
let _perfHostilesInRoom = 0;
// OniBaba pushes renderStress here from her own perf telemetry; if she
// reports overload we enter perfMode even before the in-room count hits 5.
let _oniRenderStress = 0;
// Global aggro cap — set in _setMonsterHostile. Hard ceiling so the
// "any-hit cascades hostility" rule never lights up the whole dungeon.
const MAX_AGGRO_MONSTERS = 6;

// ── PIP performance pin ──
// When the engine is hitching (rollingFt > 33ms = under 30 FPS) the PIP
// camera locks to a tight 10-ft overhead view of just the player. This
// dramatically reduces the geometry the PIP needs to draw — the wide
// cinematic framing has the whole dungeon's instanced walls in view (and
// our wall InstancedMesh has frustumCulled=false because Three.js can't
// cull individual instances), so wide PIP = full wall instance draws +
// full shoji panels + full doorframes. Pinning the camera to a tight
// near-far frustum lets the GPU skip far geometry via z-test rejection.
// Releases when frame time recovers below 25ms for ~30 frames.
let _pipPerfPin       = false;
let _pipPerfPinGoodFrames = 0;
function _updatePipPerfPin(){
    if (typeof rollingFt !== 'number') return;
    if (rollingFt > 33){
        _pipPerfPin = true;
        _pipPerfPinGoodFrames = 0;
    } else if (rollingFt < 25){
        _pipPerfPinGoodFrames++;
        if (_pipPerfPinGoodFrames > 30) _pipPerfPin = false;
    } else {
        _pipPerfPinGoodFrames = 0;
    }
}

// Position topDownCamera for the PiP — called every sendPipFrame tick.
// Replaced the prior "gladiator overhead" cinematic with an auto-frame
// algorithm: the camera always sits 20 ft above the player by default and
// dynamically zooms out to fit the bounding sphere of the player + every
// nearby live monster. See the framing block below.
function _positionPipCamera(dt){
    _updatePipPerfPin();
    // ── EMERGENCY PIN: tight 10-ft overhead of player ──
    // Bypass all the cinematic framing when the engine is overloaded.
    // 10 ft = 4 world units above player. FOV 60° gives a ~4.6u-square
    // visible footprint — just the player + immediately adjacent tiles.
    // far clip set tight (8u) so the depth test rejects everything past
    // the player's room. Drastically reduces overdraw in PIP.
    if (_pipPerfPin){
        topDownCamera.position.set(px, 4.0, pz);
        topDownCamera.lookAt(px, 0, pz);
        topDownCamera.up.set(0, 0, -1);
        topDownCamera.fov    = 60;
        topDownCamera.aspect = 1.0;
        topDownCamera.near   = 0.3;
        topDownCamera.far    = 8.0;     // tight far plane → z-cull everything past
        topDownCamera.updateProjectionMatrix();
        topDownCamera.layers.disable(2); // no ceiling
        // Reset the cinematic state so the camera doesn't snap when pin releases
        _pipReverseCutT = 0;
        return;
    }
    // ── Reverse cut blend — fires when a spell hits a monster ──
    // Eases 0 → 1 over the first 25% of _PIP_REVERSE_DUR, holds, then eases
    // back to 0 over the last 25%. Overrides the standard framing when > 0.
    if (_pipReverseTarget && _pipReverseStartedAt > 0){
        const ageS = (performance.now() - _pipReverseStartedAt) / 1000;
        const f = Math.min(1, ageS / _PIP_REVERSE_DUR);
        // Smoothstep ramp + tail decay
        let v;
        if (f < 0.25)      v = (f / 0.25);
        else if (f > 0.75) v = (1.0 - (f - 0.75) / 0.25);
        else               v = 1.0;
        _pipReverseCutT += (v - _pipReverseCutT) * Math.min(1, dt * 6.0);
        if (f >= 1){
            _pipReverseCutT = 0;
            _pipReverseTarget = null;
            _pipReverseStartedAt = 0;
        }
    } else {
        _pipReverseCutT *= Math.max(0, 1 - dt * 4);
    }

    // ── PIP framing: 20ft baseline + auto-frame on monster contact ─────────
    // BASE: 20 feet (4 world units) above the player, looking straight down.
    // GRID = 2 wu/tile = 5 ft/tile, so 4 wu = 20 ft per the user spec.
    //
    // MONSTER PRESENT: compute the bounding sphere of {player, all live
    // monsters within MON_FRAME_RANGE}. Recenter on the centroid and lift
    // the camera high enough that the bounding radius (plus a small margin)
    // fits inside the camera's FOV cone. The result: every fight scene
    // auto-frames so you always see all combatants.
    //
    // USER PAN + ZOOM remain additive on top — they bias the centroid + scale
    // the height. _pipCinematicT (old gladiator mode) and _pipCinematicTarget
    // are no longer consulted here; the auto-frame replaces them.
    const PIP_BASE_H        = 4;          // 20 ft above player when alone
    const MON_FRAME_RANGE   = 18;         // wu — count monsters within 18wu (~9 tiles)
    const MON_FRAME_MARGIN  = 2.4;        // wu — padding around bounding sphere
    const MON_FRAME_MIN_H   = 4;          // wu — never go LOWER than 20ft
    const MON_FRAME_MAX_H   = 22;         // wu — cap so the frame stops scaling
    // Gather (player + nearby live monsters).
    let _sumX = px, _sumZ = pz, _ptN = 1;
    for (const w of monsterWrappers){
        const ud = w.userData;
        if (!ud || ud.isDead || ud.isAlly) continue;
        const _ddx = w.position.x - px;
        const _ddz = w.position.z - pz;
        if (_ddx * _ddx + _ddz * _ddz > MON_FRAME_RANGE * MON_FRAME_RANGE) continue;
        _sumX += w.position.x;
        _sumZ += w.position.z;
        _ptN++;
    }
    const monsterPresent = _ptN > 1;
    // Centroid of the contact group. With no monsters this collapses to the
    // player position. User pan biases it.
    const _cenX = _sumX / _ptN + _pipPan.x;
    const _cenZ = _sumZ / _ptN + _pipPan.z;
    // Bounding radius from centroid to the farthest point in the group.
    let _maxR2 = 0;
    if (monsterPresent){
        const _pcx = _sumX / _ptN, _pcz = _sumZ / _ptN; // un-panned centroid for fit calc
        const _ddP = (px - _pcx)*(px - _pcx) + (pz - _pcz)*(pz - _pcz);
        if (_ddP > _maxR2) _maxR2 = _ddP;
        for (const w of monsterWrappers){
            const ud = w.userData;
            if (!ud || ud.isDead || ud.isAlly) continue;
            const _qdx = w.position.x - px, _qdz = w.position.z - pz;
            if (_qdx*_qdx + _qdz*_qdz > MON_FRAME_RANGE * MON_FRAME_RANGE) continue;
            const _rx = w.position.x - _pcx, _rz = w.position.z - _pcz;
            const _r2 = _rx*_rx + _rz*_rz;
            if (_r2 > _maxR2) _maxR2 = _r2;
        }
    }
    const boundingR = Math.sqrt(_maxR2) + MON_FRAME_MARGIN;
    // Height required to fit the bounding sphere given the current PIP FOV.
    // FOV math: height = radius / tan(halfFov). We use 22° as the design FOV
    // (matches the baseFov constant below) so the framing math stays stable
    // independent of user zoom.
    const _halfFovRad = (22 * Math.PI / 180) / 2;
    const _fitH = boundingR / Math.tan(_halfFovRad);
    let frameH;
    if (monsterPresent){
        frameH = Math.max(MON_FRAME_MIN_H, Math.min(MON_FRAME_MAX_H, _fitH));
    } else {
        frameH = PIP_BASE_H;
    }
    // User zoom scales the height inversely (zoom in = lower camera).
    frameH = frameH / Math.max(0.4, _pipZoomScale);

    // ── Slight obstruction shift ──
    // True top-down can't be wall-occluded (ceiling layer is disabled), but
    // when the centroid sits ON or one tile from a wall, the camera's FOV
    // cone might clip into the wall and steal a tile. Nudge the camera +/-
    // a fraction of a tile so the player is never crammed into the corner of
    // the visible area. Simple heuristic: if the centroid-to-player vector
    // is non-zero, bias the camera 25% of that vector back toward the
    // player so the player is never less than 25% from the frame center.
    let _shiftX = 0, _shiftZ = 0;
    if (monsterPresent){
        const _dpx = px - _cenX, _dpz = pz - _cenZ;
        _shiftX = _dpx * 0.20;
        _shiftZ = _dpz * 0.20;
    }
    const cx = _cenX + _shiftX;
    const cz = _cenZ + _shiftZ;

    let camX = cx;
    let camY = frameH;
    let camZ = cz;
    let lookX = cx, lookY = 0, lookZ = cz;
    let upX = 0, upY = 0, upZ = -1;
    let useFov;

    // ── Reverse-cut framing override (low angle behind monster → player) ──
    if (_pipReverseTarget && _pipReverseCutT > 0.01){
        const m = _pipReverseTarget;
        const mx = m.position.x, mz = m.position.z;
        // Direction monster → player
        const dx = px - mx, dz = pz - mz;
        const dlen = Math.sqrt(dx*dx + dz*dz) || 1;
        const nx = dx / dlen, nz = dz / dlen;
        // Camera sits BEHIND the monster (opposite to player) and slightly
        // above the floor — low cinematic angle looking at the player.
        const behindDist = 2.2;
        const camHeight  = 1.8;
        const revX = mx - nx * behindDist;
        const revZ = mz - nz * behindDist;
        const revY = camHeight;
        // Lerp toward the reverse cam by _pipReverseCutT
        const t = _pipReverseCutT;
        camX = camX + (revX - camX) * t;
        camY = camY + (revY - camY) * t;
        camZ = camZ + (revZ - camZ) * t;
        // Look at the monster's chest (drama: monster in foreground, player past)
        const lookTx = mx, lookTy = 1.0, lookTz = mz;
        lookX = lookX + (lookTx - lookX) * t;
        lookY = lookY + (lookTy - lookY) * t;
        lookZ = lookZ + (lookTz - lookZ) * t;
        // Up direction lerps from world-up to +y (normal camera) so the
        // reverse cut isn't sideways.
        upX = 0; upY = 1; upZ = 0;
    }

    topDownCamera.position.set(camX, camY, camZ);
    topDownCamera.lookAt(lookX, lookY, lookZ);
    topDownCamera.up.set(upX, upY, upZ);
    // FOV: 22° design baseline (height was sized to fit the bounding sphere
    // at exactly this FOV). User zoom widens/tightens it inversely. Reverse
    // cut overrides to a wider 55° dramatic angle when active.
    const baseFov    = 22 / Math.max(0.4, _pipZoomScale);
    const reverseFov = 55;
    topDownCamera.fov = baseFov + (reverseFov - baseFov) * _pipReverseCutT;
    topDownCamera.aspect = 1.0;
    topDownCamera.near = 0.3;
    // Tight far plane — top-down, floor at y=0, no need to draw past the
    // camera's own height + small margin. The wall InstancedMesh skips
    // frustum culling so individual instances always submit, but GPU
    // near/far clipping rejects fragments past the floor cheaply.
    topDownCamera.far  = Math.max(frameH * 1.10, 8);
    topDownCamera.updateProjectionMatrix();
    topDownCamera.layers.disable(2); // no ceiling layer
}

// Public entry point — fired by the spell-impact code when a spell strikes
// a monster wrapper. Kicks off the reverse close-up cinematic.
function _pipTriggerReverseCut(monsterWrapper){
    if (!monsterWrapper || monsterWrapper.userData.isDead) return;
    _pipReverseTarget    = monsterWrapper;
    _pipReverseStartedAt = performance.now();
}

function sendPipFrame(dt){
    _pipSendTimer -= dt;
    if(_pipSendTimer > 0) return;
    // PIP throttle — balanced at 15 fps so the top-down map feels live
    // while keeping the extra render + GPU→CPU readback affordable.
    _pipSendTimer = 0.067;

    // ── Pick the PIP camera based on the main view's current mode ──
    // When the main canvas is showing top-down, the PIP shows the FPV
    // camera (preview of where the player would be facing). When the main
    // canvas is FPV (the default), the PIP shows the top-down map. Click
    // on the PIP canvas swaps them via PIP_TOGGLE (see the handler above).
    const _pipShowFpv = (cameraMode === 'topdown');
    const _pipCam = _pipShowFpv ? camera : topDownCamera;
    if (!_pipShowFpv) _positionPipCamera(dt);

    // Save renderer state
    const prevRT  = renderer.getRenderTarget();
    const prevFog = scene.fog ? scene.fog.density : 0;
    const prevBg  = scene.background;
    const prevAmb = ambientLight ? ambientLight.intensity : 1;
    const prevDir = dirLight ? dirLight.intensity : 0;

    // ── Smart per-frame culling for the top-down PIP ──
    // Skinned monsters + bobbing loot cards far from the player contribute
    // nothing the PIP camera can see (it frames the player), but they DO
    // cost per-frame bone matrix uploads (skinning) + bob/spin updates.
    // Hide them for the PIP render, restore after. Under the perf-pin
    // (heavy load) the radius tightens further so the PIP renders even
    // less geometry while the engine recovers.
    const _pipHidden = [];
    if (!_pipShowFpv){
        const _pipCullR = _pipPerfPin ? (6 * GRID) : (12 * GRID);
        const _pipCullR2 = _pipCullR * _pipCullR;
        if (typeof monsterWrappers !== 'undefined'){
            for (const w of monsterWrappers){
                if (!w.visible || w.userData.isDead) continue;
                const dx = w.position.x - px, dz = w.position.z - pz;
                if (dx*dx + dz*dz > _pipCullR2){
                    w.visible = false;
                    _pipHidden.push(w);
                }
            }
        }
        if (typeof lootItems !== 'undefined'){
            for (const c of lootItems){
                if (!c.visible) continue;
                const dx = c.position.x - px, dz = c.position.z - pz;
                if (dx*dx + dz*dz > _pipCullR2){
                    c.visible = false;
                    _pipHidden.push(c);
                }
            }
        }
    }

    // Top-down readability boost. Skipped when the PIP is showing FPV — we
    // want the FPV preview to look exactly like the live FPV view, fog and
    // torchlight included.
    //
    // Brightness boost +20% for photo-realism per user request: ambient
    // 1.8→2.2, dir 0.5→0.65, background 0x0d0f14→0x1c2230 (≈20% lighter
    // luminance), fog killed. Floors + walls now read clearly against the
    // brighter base instead of disappearing into near-black.
    if (!_pipShowFpv){
        if(ambientLight) ambientLight.intensity = 2.20;
        if(dirLight)     dirLight.intensity     = 0.65;
        if(scene.fog)    scene.fog.density      = 0;
        scene.background = new THREE.Color(0x1c2230);
    }

    // Render into RT
    renderer.setRenderTarget(_pipRT);
    renderer.setClearColor(0x1c2230, 1);
    renderer.clear();
    renderer.render(scene, _pipCam);

    // Read pixels
    renderer.readRenderTargetPixels(_pipRT, 0, 0, PIP_RT_SIZE, PIP_RT_SIZE, _pipPixels);

    // Restore renderer state (only restore the light/fog boost if we set it)
    renderer.setRenderTarget(prevRT);
    if (!_pipShowFpv){
        if(scene.fog)    scene.fog.density      = prevFog;
        scene.background = prevBg;
        if(ambientLight) ambientLight.intensity = prevAmb;
        if(dirLight)     dirLight.intensity     = prevDir;
    }
    // Restore visibility on every object we hid for the PIP cull
    for (const o of _pipHidden) o.visible = true;

    // WebGL pixels are flipped vertically — flip into canvas
    const imgData = _pipCompCtx.createImageData(PIP_RT_SIZE, PIP_RT_SIZE);
    const src = _pipPixels, dst = imgData.data, W = PIP_RT_SIZE;
    for(let row = 0; row < W; row++){
        const srcRow = (W - 1 - row) * W * 4;
        const dstRow = row * W * 4;
        dst.set(src.subarray(srcRow, srcRow + W * 4), dstRow);
    }
    _pipCompCtx.putImageData(imgData, 0, 0);

    // Circular clip + compass overlay
    _pipCompCtx.save();
    // North marker
    _pipCompCtx.fillStyle = 'rgba(255,107,122,0.85)';
    _pipCompCtx.font = 'bold 11px Inter,sans-serif';
    _pipCompCtx.textAlign = 'center';
    _pipCompCtx.fillText('N', PIP_RT_SIZE/2, 14);
    // Player dot at center
    const cx = PIP_RT_SIZE/2, cz = PIP_RT_SIZE/2;
    const pg = _pipCompCtx.createRadialGradient(cx,cz,0, cx,cz,9);
    pg.addColorStop(0,'rgba(124,224,184,1)');
    pg.addColorStop(1,'rgba(124,224,184,0)');
    _pipCompCtx.fillStyle = pg;
    _pipCompCtx.beginPath(); _pipCompCtx.arc(cx,cz,9,0,Math.PI*2); _pipCompCtx.fill();
    _pipCompCtx.beginPath(); _pipCompCtx.arc(cx,cz,3.5,0,Math.PI*2);
    _pipCompCtx.fillStyle='#fff'; _pipCompCtx.fill();

    _pipCompCtx.restore();

    // Transfer to Panels via ImageBitmap (zero-copy where supported)
    try {
        createImageBitmap(_pipComposite).then(bmp=>{
            window.parent.postMessage({type:'PIP_FRAME', bitmap: bmp, isCam: true}, '*', [bmp]);
        });
    } catch(e){
        window.parent.postMessage({type:'PIP_FRAME', dataURL: _pipComposite.toDataURL('image/webp',0.75), isCam: true},'*');
    }
}

// Fog of war — record which cells the player has seen (revealed once seen)
const seen = new Uint8Array(MAP_W*MAP_H);
function markSeen(){
    const pgx=px/GRID, pgz=pz/GRID;
    const R=PIP_VIEW;
    for(let dx=-R;dx<=R;dx++) for(let dz=-R;dz<=R;dz++){
        const gx=Math.round(pgx+dx), gz=Math.round(pgz+dz);
        if(gx<0||gx>=MAP_W||gz<0||gz>=MAP_H) continue;
        if(dx*dx+dz*dz>R*R) continue;
        seen[gx*MAP_H+gz]=1;
    }
}

function drawPip(){
    const PW=pipCanvas.width, PH=pipCanvas.height;
    pipCtx.clearRect(0,0,PW,PH);
    pipCtx.save();
    pipCtx.beginPath(); pipCtx.arc(PW/2,PH/2,PW/2,0,Math.PI*2); pipCtx.clip();

    // Dark neumorphic backdrop with vignette
    const bg = pipCtx.createRadialGradient(PW/2,PH/2,PW*0.1, PW/2,PH/2,PW/2);
    bg.addColorStop(0,'#1f2228'); bg.addColorStop(0.7,'#15171c'); bg.addColorStop(1,'#0a0c10');
    pipCtx.fillStyle=bg; pipCtx.fillRect(0,0,PW,PH);

    const cellPx=PW/(PIP_VIEW*2), pgx=px/GRID, pgz=pz/GRID;

    // Floor cells (revealed)
    for(let dx=-PIP_VIEW;dx<=PIP_VIEW;dx++) for(let dz=-PIP_VIEW;dz<=PIP_VIEW;dz++){
        const gx=Math.round(pgx+dx), gz=Math.round(pgz+dz);
        if(gx<0||gx>=MAP_W||gz<0||gz>=MAP_H) continue;
        const cell=map[gx][gz]; if(cell.type==='wall') continue;
        const isSeen = seen[gx*MAP_H+gz];
        if(!isSeen) continue;
        const sx=(PW/2)+dx*cellPx, sz=(PH/2)+dz*cellPx;
        if(cell.type==='stairs_up'||cell.type==='stairs_up_r') pipCtx.fillStyle='rgba(240,192,96,0.85)';
        else if(cell.type==='stairs_down') pipCtx.fillStyle='rgba(255,107,80,0.85)';
        else if(cell.type==='shoji_door')  pipCtx.fillStyle='rgba(124,224,184,0.55)';
        else if(cell.type==='shoji')       pipCtx.fillStyle='rgba(180,160,120,0.35)';
        else                               pipCtx.fillStyle='rgba(80,90,108,0.55)';
        pipCtx.fillRect(sx,sz,cellPx+0.5,cellPx+0.5);
    }

    // Wall edges drawn as soft inset shadow lines
    pipCtx.strokeStyle='rgba(0,0,0,0.65)'; pipCtx.lineWidth=1;
    for(let dx=-PIP_VIEW;dx<=PIP_VIEW;dx++) for(let dz=-PIP_VIEW;dz<=PIP_VIEW;dz++){
        const gx=Math.round(pgx+dx), gz=Math.round(pgz+dz);
        if(gx<0||gx>=MAP_W||gz<0||gz>=MAP_H) continue;
        if(map[gx][gz].type!=='wall') continue;
        if(!seen[gx*MAP_H+gz]) continue;
        const sx=(PW/2)+dx*cellPx, sz=(PH/2)+dz*cellPx;
        pipCtx.fillStyle='rgba(40,44,52,0.6)';
        pipCtx.fillRect(sx,sz,cellPx+0.5,cellPx+0.5);
    }

    // Enemies
    worldGroup.children.forEach(c=>{
        if(c.userData?.type!=='enemy'||c.userData?.isDead) return;
        const ex=(c.position.x/GRID)-pgx, ez=(c.position.z/GRID)-pgz;
        if(Math.abs(ex)>PIP_VIEW||Math.abs(ez)>PIP_VIEW) return;
        const sx=PW/2+ex*cellPx, sz=PH/2+ez*cellPx;
        // Soft glow
        const eg=pipCtx.createRadialGradient(sx,sz,0, sx,sz,7);
        eg.addColorStop(0,'rgba(255,107,122,0.9)'); eg.addColorStop(1,'rgba(255,107,122,0)');
        pipCtx.fillStyle=eg; pipCtx.fillRect(sx-7,sz-7,14,14);
        pipCtx.beginPath(); pipCtx.arc(sx,sz,2.5,0,Math.PI*2);
        pipCtx.fillStyle='#ff6b7a'; pipCtx.fill();
    });

    // Player vision cone
    const cx=PW/2, cz=PH/2;
    pipCtx.save(); pipCtx.translate(cx,cz); pipCtx.rotate(rot);
    const cg=pipCtx.createRadialGradient(0,0,0, 0,0,cellPx*5);
    cg.addColorStop(0,'rgba(124,224,184,0.35)'); cg.addColorStop(1,'rgba(124,224,184,0)');
    pipCtx.fillStyle=cg;
    pipCtx.beginPath(); pipCtx.moveTo(0,0); pipCtx.arc(0,0,cellPx*5,-Math.PI/2-0.55,-Math.PI/2+0.55); pipCtx.closePath(); pipCtx.fill();
    pipCtx.restore();

    // Player dot with glow
    const pg=pipCtx.createRadialGradient(cx,cz,0, cx,cz,8);
    pg.addColorStop(0,'rgba(124,224,184,0.95)'); pg.addColorStop(1,'rgba(124,224,184,0)');
    pipCtx.fillStyle=pg; pipCtx.fillRect(cx-8,cz-8,16,16);
    pipCtx.beginPath(); pipCtx.arc(cx,cz,3,0,Math.PI*2); pipCtx.fillStyle='#fff'; pipCtx.fill();

    // North marker
    pipCtx.fillStyle='rgba(255,107,122,0.7)'; pipCtx.font='bold 10px Inter,sans-serif'; pipCtx.textAlign='center';
    pipCtx.fillText('N',PW/2,14);

    pipCtx.restore();

    // T0.24 — Green perimeter ring removed per user request
}

// ── Fullscreen Top-Down Map ───────────────────────────────────────────────────
const fsMapCanvas = document.getElementById('fs-map-canvas');
const fsMapCtx    = fsMapCanvas.getContext('2d');
const fsMapOverlay= document.getElementById('fs-map-overlay');
let fsMapOpen = false;

function drawFullMap(){
    const W = fsMapCanvas.width, H = fsMapCanvas.height;
    fsMapCtx.clearRect(0,0,W,H);
    // Neumorphic dark background
    const bg = fsMapCtx.createRadialGradient(W/2,H/2,W*0.1, W/2,H/2,W*0.7);
    bg.addColorStop(0,'#22262d'); bg.addColorStop(1,'#0e1014');
    fsMapCtx.fillStyle=bg; fsMapCtx.fillRect(0,0,W,H);

    const cell = Math.floor(Math.min(W,H) / Math.max(MAP_W,MAP_H));
    const ox = (W - cell*MAP_W)/2, oy = (H - cell*MAP_H)/2;

    // Floor cells with subtle inset depth per room
    for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
        const c = map[x][z]; if(!c) continue;
        const sx = ox + x*cell, sy = oy + z*cell;
        if(c.type==='wall'){
            fsMapCtx.fillStyle='#0a0c10';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='shoji'){
            fsMapCtx.fillStyle='rgba(200,180,140,0.55)';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='shoji_door'){
            fsMapCtx.fillStyle='rgba(124,224,184,0.7)';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='stairs_up'||c.type==='stairs_up_r'){
            fsMapCtx.fillStyle='#f0c060';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='stairs_down'){
            fsMapCtx.fillStyle='#ff6b50';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else {
            // Floor — slight neumorphic depth
            fsMapCtx.fillStyle='#2a2e36';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        }
    }

    // Room outlines + labels
    if(typeof rooms!=='undefined'){
        rooms.forEach((r, idx) => {
            const x0 = ox + r.x*cell, y0 = oy + r.y*cell;
            const w  = r.w*cell, h = r.h*cell;
            // Soft inset shadow per room
            fsMapCtx.strokeStyle='rgba(124,224,184,0.18)';
            fsMapCtx.lineWidth=1.2;
            fsMapCtx.strokeRect(x0+0.5,y0+0.5,w-1,h-1);
            // Label — room number only.
            fsMapCtx.fillStyle='rgba(168,176,187,0.85)';
            fsMapCtx.font='700 13px Inter,sans-serif';
            fsMapCtx.textAlign='center'; fsMapCtx.textBaseline='middle';
            const cx = x0+w/2, cy = y0+h/2;
            fsMapCtx.fillText(`#${(r.id ?? idx) + 1}`, cx, cy);
        });
    }

    // Enemies
    worldGroup.children.forEach(c=>{
        if(c.userData?.type!=='enemy'||c.userData?.isDead) return;
        const sx = ox + (c.position.x/GRID)*cell;
        const sy = oy + (c.position.z/GRID)*cell;
        const eg=fsMapCtx.createRadialGradient(sx,sy,0, sx,sy,cell*1.3);
        eg.addColorStop(0,'rgba(255,107,122,0.85)'); eg.addColorStop(1,'rgba(255,107,122,0)');
        fsMapCtx.fillStyle=eg; fsMapCtx.fillRect(sx-cell*1.3,sy-cell*1.3,cell*2.6,cell*2.6);
        fsMapCtx.beginPath(); fsMapCtx.arc(sx,sy,cell*0.4,0,Math.PI*2);
        fsMapCtx.fillStyle='#ff6b7a'; fsMapCtx.fill();
    });

    // Player — glowing dot + cone
    const psx = ox + (px/GRID)*cell, psy = oy + (pz/GRID)*cell;
    fsMapCtx.save();
    fsMapCtx.translate(psx,psy); fsMapCtx.rotate(rot);
    const cg=fsMapCtx.createRadialGradient(0,0,0, 0,0,cell*8);
    cg.addColorStop(0,'rgba(124,224,184,0.45)'); cg.addColorStop(1,'rgba(124,224,184,0)');
    fsMapCtx.fillStyle=cg;
    fsMapCtx.beginPath(); fsMapCtx.moveTo(0,0); fsMapCtx.arc(0,0,cell*8,-Math.PI/2-0.45,-Math.PI/2+0.45); fsMapCtx.closePath(); fsMapCtx.fill();
    fsMapCtx.restore();
    const pg=fsMapCtx.createRadialGradient(psx,psy,0, psx,psy,cell*1.5);
    pg.addColorStop(0,'rgba(124,224,184,1)'); pg.addColorStop(1,'rgba(124,224,184,0)');
    fsMapCtx.fillStyle=pg; fsMapCtx.fillRect(psx-cell*1.5,psy-cell*1.5,cell*3,cell*3);
    fsMapCtx.beginPath(); fsMapCtx.arc(psx,psy,cell*0.5,0,Math.PI*2);
    fsMapCtx.fillStyle='#fff'; fsMapCtx.fill();
}

function openFullMap(){ fsMapOpen=true; fsMapOverlay.classList.add('open'); drawFullMap(); }
function closeFullMap(){ fsMapOpen=false; fsMapOverlay.classList.remove('open'); }
// Click-to-zoom on the PIP frame REMOVED per user request. The fullscreen
// map is still available via the M key (see global keydown handler).
// Click on the map CANVAS → click-to-move (then close map). Clicks on the
// dimmed overlay outside the canvas just close the map.
fsMapCanvas.addEventListener('click', e => {
    const rect = fsMapCanvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (fsMapCanvas.width / rect.width);
    const cy = (e.clientY - rect.top)  * (fsMapCanvas.height / rect.height);
    const cell = Math.floor(Math.min(fsMapCanvas.width, fsMapCanvas.height) / Math.max(MAP_W, MAP_H));
    const ox = (fsMapCanvas.width  - cell*MAP_W) / 2;
    const oy = (fsMapCanvas.height - cell*MAP_H) / 2;
    const gx = Math.floor((cx - ox) / cell);
    const gz = Math.floor((cy - oy) / cell);
    if (gx >= 0 && gx < MAP_W && gz >= 0 && gz < MAP_H && canWalk(gx*GRID, gz*GRID)){
        _startClickToMove(gx, gz);
        closeFullMap();
        e.stopPropagation();
    }
});
fsMapOverlay.addEventListener('click', e=>{ if(e.target===fsMapOverlay) closeFullMap(); });
document.getElementById('fs-map-close').addEventListener('click', closeFullMap);

// ── Click-to-move on the FPV view ─────────────────────────────────────────
// Raycast from the camera through the screen-click point onto the floor
// plane (y=0). If the resulting tile is walkable, kick off click-to-move
// with the spectral footprint trail. Doing this on the main renderer.canvas
// means the player doesn't need to open the fullscreen map first.
{
    const _ctmRay   = new THREE.Raycaster();
    const _ctmMouse = new THREE.Vector2();
    // Horizontal plane at y=0 (the floor) for intersection.
    const _ctmFloor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const _ctmHit   = new THREE.Vector3();
    renderer.domElement.addEventListener('click', (e) => {
        // Ignore clicks while the fullscreen map is open or during a sidebar
        // session — those flows already have their own click semantics.
        if (typeof fsMapOpen !== 'undefined' && fsMapOpen) return;
        if (_sidebarOpen) return;
        // Convert pixel → normalized device coords.
        const rect = renderer.domElement.getBoundingClientRect();
        _ctmMouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
        _ctmMouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
        _ctmRay.setFromCamera(_ctmMouse, camera);
        // Only resolve clicks that hit IN FRONT of the player on the floor.
        if (!_ctmRay.ray.intersectPlane(_ctmFloor, _ctmHit)) return;
        const gx = Math.round(_ctmHit.x / GRID);
        const gz = Math.round(_ctmHit.z / GRID);
        if (gx < 0 || gx >= MAP_W || gz < 0 || gz >= MAP_H) return;
        if (!canWalk(gx * GRID, gz * GRID)) return;
        // Don't start a path to the tile we're already standing on.
        const pgx = Math.round(px / GRID), pgz = Math.round(pz / GRID);
        if (pgx === gx && pgz === gz) return;
        _startClickToMove(gx, gz);
    });
}
window.addEventListener('keydown', e=>{
    if(e.key==='Escape' && fsMapOpen){ closeFullMap(); e.preventDefault(); }
    else if((e.key==='m'||e.key==='M')){ fsMapOpen ? closeFullMap() : openFullMap(); e.preventDefault(); }
});
