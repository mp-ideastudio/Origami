            if (g === 'laugh' && ud._chatBobT0){
                const t = (now - ud._chatBobT0);
                // Quick shoulder-shake: small y oscillation on the wrapper
                w.position.y = (ud.baseY || 0) + Math.abs(Math.sin(t * 14)) * 0.08;
            } else if (g === 'nod' && ud._chatBobT0){
                const t = (now - ud._chatBobT0);
                // Head bob — tilt monBase pitch slightly
                monBase.rotation.x = Math.sin(t * 6.5) * 0.10;
            } else {
                // Reset transient transforms when not laughing/nodding
                if (w.position.y !== (ud.baseY || 0)) w.position.y = (ud.baseY || 0);
                if (Math.abs(monBase.rotation.x) > 0.001) monBase.rotation.x *= 0.85;
            }
            ud._chatTimer = (ud._chatTimer||0) - dt;
            if(ud._chatTimer <= 0){
                ud.aiState = 'idle';
                ud._bowPartnerPos = null;
                ud._chatGesture   = null;
                ud._chatGestureUntil = 0;
                // Clean transient transforms
                w.position.y = (ud.baseY || 0);
                monBase.rotation.x = 0;
                ud.aiNextTurn = now + 0.5 + Math.random();
            }
        } else if(ud.aiState === 'flee'){
            // ── REFACTORED flee ──
            //   1. Destination = a doorway into a PEER ROOM (so the goblin
            //      is racing to warn the next room). Falls back to the old
            //      10-tiles-along-flee-axis if no peer doorway exists.
            //   2. Smart A* path to that doorway (re-planned every 0.8s).
            //   3. STILL SWINGS at the player if the player is in melee
            //      range during the flight — the goblin is panicking but
            //      not defenceless. Melee on a long (~3.5s) cooldown so
            //      the flee remains primarily a movement state.
            //   4. Crossing into the destination room broadcasts the alert.
            const sgx = Math.round(monBase.position.x/GRID);
            const sgz = Math.round(monBase.position.z/GRID);

            // ── Melee-while-fleeing ──
            // If the player is within ~2.5 tiles, slap them on a 3.5s
            // cooldown without pausing flight. Face the player for one
            // frame to read as a swing, then snap back to flee facing
            // when we resume movement below.
            const _pdxF = px - monBase.position.x;
            const _pdzF = pz - monBase.position.z;
            const _pdF  = Math.sqrt(_pdxF*_pdxF + _pdzF*_pdzF);
            if (_pdF < 2.5 * GRID){
                ud._fleeMeleeCD = (ud._fleeMeleeCD || 0) - dt;
                if (ud._fleeMeleeCD <= 0){
                    ud._fleeMeleeCD = 3.5;
                    // Quick wild swing — half normal melee damage since the
                    // goblin is fleeing, not committed to combat.
                    const _swingDmg = 3 + Math.floor(Math.random() * 5); // 3-7
                    const wantAng = Math.atan2(_pdxF, _pdzF);
                    monBase.rotation.y = wantAng;
                    w.rotation.y = wantAng;
                    _monSetAnim(ud, 'attack');
                    _autoFaceOnAttack(monBase);
                    const _landed = _applyPlayerDamage(_swingDmg, (ud.name||'Goblin') + ' (fleeing)');
                    if (_landed && Math.random() < 0.5 && typeof _playMonsterSfx === 'function'){
                        _playMonsterSfx('LAUGH', w);
                    }
                    if (typeof _playMonsterSfx === 'function') _playMonsterSfx('ATTACK', w);
                }
            }

            // (Re)pick destination — PREFER A PEER-ROOM DOORWAY
            if (!ud._fleeDest || (now - (ud._fleeDestT || 0)) > 2.5){
                let dest = null;
                if (typeof _findReinforcementDoorway === 'function'){
                    const reinf = _findReinforcementDoorway(ud);
                    if (reinf){
                        dest = { x: reinf.doorX, z: reinf.doorZ };
                        ud._fleePeerRoomId = reinf.peerRoomId;
                    }
                }
                // Fallback — no peer doorway → run ~10 tiles along the flee
                // axis like the old behavior. Better than freezing in place.
                if (!dest){
                    const fdxT = sgx - Math.round(px/GRID);
                    const fdzT = sgz - Math.round(pz/GRID);
                    const flenT = Math.hypot(fdxT, fdzT) || 1;
                    const tgx = Math.round(sgx + (fdxT/flenT) * 10);
                    const tgz = Math.round(sgz + (fdzT/flenT) * 10);
                    for (let r = 0; r < 7 && !dest; r++){
                        for (let dx = -r; dx <= r && !dest; dx++){
                            for (let dz = -r; dz <= r; dz++){
                                if (Math.abs(dx) !== r && Math.abs(dz) !== r) continue;
                                const cx = tgx + dx, cz = tgz + dz;
                                if (cx < 0 || cx >= MAP_W || cz < 0 || cz >= MAP_H) continue;
                                const c = map[cx]?.[cz];
                                if (!c || c.type === 'wall' || c.type === 'shoji') continue;
                                dest = { x: cx, z: cz }; break;
                            }
                        }
                    }
                    ud._fleePeerRoomId = null;
                }
                ud._fleeDest  = dest;
                ud._fleeDestT = now;
                ud._fleePath  = null;
            }

            // (Re)plan A* path
            if ((!ud._fleePath || (now - (ud._fleePathT || 0)) > 0.8) && ud._fleeDest){
                ud._fleePath = _monAStar(sgx, sgz, ud._fleeDest.x, ud._fleeDest.z);
                ud._fleePathIdx = (ud._fleePath && ud._fleePath.length > 1) ? 1 : 0;
                ud._fleePathT = now;
            }

            // Decide move target: next path tile if we have one, else
            // direct-away from player.
            let tgtX, tgtZ, useDirect = false;
            if (ud._fleePath && ud._fleePathIdx < ud._fleePath.length){
                const [tx, tz] = ud._fleePath[ud._fleePathIdx];
                tgtX = tx * GRID; tgtZ = tz * GRID;
                // Advance index when close to current waypoint
                const adx = tgtX - monBase.position.x;
                const adz = tgtZ - monBase.position.z;
                if (adx*adx + adz*adz < 0.16){
                    ud._fleePathIdx++;
                    if (ud._fleePathIdx >= ud._fleePath.length){
                        ud._fleeDest = null;
                        ud._fleePath = null;
                    }
                }
            } else {
                // No path — fall back to running straight away.
                useDirect = true;
                tgtX = monBase.position.x + (monBase.position.x - px);
                tgtZ = monBase.position.z + (monBase.position.z - pz);
            }

            const fdx = tgtX - monBase.position.x;
            const fdz = tgtZ - monBase.position.z;
            const fdist = Math.sqrt(fdx*fdx + fdz*fdz);
            if(fdist > 0.01){
                // Face direction of travel
                const fleeAngle = Math.atan2(fdx, fdz);
                let fdiff = fleeAngle - (monBase.rotation.y||0);
                while(fdiff > Math.PI) fdiff -= Math.PI*2;
                while(fdiff < -Math.PI) fdiff += Math.PI*2;
                monBase.rotation.y += fdiff * Math.min(1, dt*5);
                w.rotation.y = monBase.rotation.y;

                const slowMul = (ud.slowUntil && ud.slowUntil > performance.now()) ? 0.5 : 1.0;
                const step = MON_WANDER_SPD * 2.0 * slowMul * dt; // flee faster than walk
                const nx = monBase.position.x + (fdx/fdist)*step;
                const nz = monBase.position.z + (fdz/fdist)*step;
                // canWalk lets monsters pass through 'shoji_door' tiles (the
                // door panel auto-lifts via _tickShojiDoors), so fleeing
                // monsters can already use doorways when the flee vector
                // crosses one. If the direct vector is wall-blocked, try
                // axis-aligned slides — this is what routes a fleer through
                // a doorway that's perpendicular to the player.
                let moved = false;
                if(_canMonsterStand(nx, nz, w)){
                    monBase.position.x = nx; monBase.position.z = nz;
                    w.position.x = nx; w.position.z = nz;
                    moved = true;
                } else {
                    const nxOnly = monBase.position.x + (fdx/fdist)*step;
                    if(_canMonsterStand(nxOnly, monBase.position.z, w)){
                        monBase.position.x = nxOnly; w.position.x = nxOnly;
                        moved = true;
                    } else {
                        const nzOnly = monBase.position.z + (fdz/fdist)*step;
                        if(_canMonsterStand(monBase.position.x, nzOnly, w)){
                            monBase.position.z = nzOnly; w.position.z = nzOnly;
                            moved = true;
                        }
                    }
                }
                if(moved){
                    ud._fleeBlockedT = 0;
                    _monSetAnim(ud, 'walk');
                    // ── Recruiting cascade ─────────────────────────────────
                    // If the flight just crossed into a new room, alert
                    // every monster in that room. Those peers go hostile
                    // and trigger their OWN fetch logic on their next AI
                    // tick — recruiting cascades naturally room-by-room.
                    const newGx = Math.round(monBase.position.x/GRID);
                    const newGz = Math.round(monBase.position.z/GRID);
                    const newRoom = map[newGx]?.[newGz]?.roomId;
                    if (newRoom !== undefined && newRoom !== -1 &&
                        newRoom !== ud._lastFleeRoomAlertId){
                        ud._lastFleeRoomAlertId = newRoom;
                        ud.aiRoomId = newRoom;
                        let alerted = 0;
                        for (const peer of monsterWrappers){
                            if (peer === w || peer.userData.isDead) continue;
                            if (peer.userData.aiState !== 'idle') continue;
                            if (peer.userData.aiRoomId === undefined){
                                const pgx = Math.round(peer.position.x/GRID);
                                const pgz = Math.round(peer.position.z/GRID);
                                peer.userData.aiRoomId = map[pgx]?.[pgz]?.roomId ?? -1;
                            }
                            if (peer.userData.aiRoomId === newRoom){
                                _setMonsterHostile(peer); // cascades via vicinity
                                alerted++;
                            }
                        }
                        if (alerted > 0){
                            const cName = ud.name || 'Goblin';
                            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                                text:`📣 <b>${cName}</b> bursts in screaming — ${alerted} more take up arms!`},'*');
                        }
                    }
                } else {
                    // ── Blocked. Two cases: peer monster in the way, or wall.
                    //
                    // Peer monster: per user spec — push the OTHER monster
                    // aside perpendicular to our flee vector, set a brief
                    // mutual nod-bow (_fleeBowUntil drives a tilt overlay),
                    // and resume fleeing on the next tick. No state change
                    // to 'bow' — flight is preserved.
                    //
                    // Wall: if a reinforcement doorway exists → FETCH. If no
                    // doorway exists, REPICK a random flee destination so we
                    // don't sit forever in a corner trap (previous behavior).
                    let _pushedPeer = null;
                    for (const peer of monsterWrappers){
                        if (peer === w || peer.userData.isDead) continue;
                        const _pdx = peer.position.x - nx;
                        const _pdz = peer.position.z - nz;
                        if (_pdx*_pdx + _pdz*_pdz < 0.81){    // within ~0.9wu
                            _pushedPeer = peer;
                            break;
                        }
                    }
                    if (_pushedPeer){
                        const _flrx = -fdz / fdist;            // perpendicular to flee dir
                        const _flrz =  fdx / fdist;
                        const _side = (Math.random() < 0.5) ? 1 : -1;
                        const _pX = _pushedPeer.position.x + _flrx * 0.55 * _side;
                        const _pZ = _pushedPeer.position.z + _flrz * 0.55 * _side;
                        if (_canMonsterStand(_pX, _pZ, _pushedPeer)){
                            _pushedPeer.position.x = _pX;
                            _pushedPeer.position.z = _pZ;
                            const _pmb = _pushedPeer.userData.monBase;
                            if (_pmb){ _pmb.position.x = _pX; _pmb.position.z = _pZ; }
                        }
                        // 500 ms mutual nod-bow. _fleeBowUntil is a tilt-only
                        // signal — read by the bow overlay in the AI tick
                        // header (added alongside the room-entry greet code)
                        // so flee state is preserved.
                        const _nowMs = performance.now();
                        ud._fleeBowUntil                   = _nowMs + 500;
                        _pushedPeer.userData._fleeBowUntil = _nowMs + 500;
                        ud._fleeBlockedT = 0;
                        _monSetAnim(ud, 'walk');
                        continue;
                    }
                    // Wall corner.
                    ud._fleeBlockedT = (ud._fleeBlockedT||0) + dt;
                    if (ud._fleeBlockedT > 0.4){
                        ud._fleeBlockedT = 0;
                        const reinf = (typeof _findReinforcementDoorway === 'function')
                            ? _findReinforcementDoorway(ud) : null;
                        if (reinf){
                            ud.aiState = 'fetch';
                            ud._fetchTileX = reinf.doorX;
                            ud._fetchTileZ = reinf.doorZ;
                            ud._fetchPeerRoom = reinf.peerRoomId;
                            ud._fetchPath = null;
                            ud._lastFetchAt = now;
                            const cName = ud.name || 'Goblin';
                            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                                text:`💨 <b>${cName}</b> bolts for the door — going to fetch help!`}, '*');
                        } else {
                            // No doorway → repick a flee destination in a new
                            // random direction. Was previously a "stand idle
                            // forever" failure mode in corner traps.
                            ud._fleeDest = null;
                            ud._fleePath = null;
                            for (let _try = 0; _try < 10; _try++){
                                const _ang = Math.random() * Math.PI * 2;
                                const _r   = (6 + Math.random() * 4) * GRID;
                                const _tx = monBase.position.x + Math.cos(_ang) * _r;
                                const _tz = monBase.position.z + Math.sin(_ang) * _r;
                                if (_canMonsterStand(_tx, _tz, w)){
                                    ud._fleeDest = { x: _tx, z: _tz };
                                    break;
                                }
                            }
                        }
                    }
                    _monSetAnim(ud, 'idle');
                }
            }
        } else if(ud.aiState === 'fetch'){
            // ── Fetch reinforcements: A* to a doorway, alert peer room ───────
            // Trigger lives in the 'hostile' branch above. On arrival in (or
            // adjacent to) the target doorway, any idle monster in the peer
            // room goes hostile; this monster reverts to 'hostile' and will
            // chase the player back from the new room.
            const fx = ud._fetchTileX, fz = ud._fetchTileZ;
            if(fx === undefined || fz === undefined){
                ud.aiState = 'hostile';
                continue;
            }
            const sgx = Math.round(monBase.position.x/GRID);
            const sgz = Math.round(monBase.position.z/GRID);
            const dgx = sgx - fx, dgz = sgz - fz;
            if(dgx*dgx + dgz*dgz <= 1){
                // Arrived — alert idle peers, revert to hostile, log the rally
                const peerRoom = ud._fetchPeerRoom;
                let alerted = 0;
                for(const peerW of monsterWrappers){
                    if(peerW === w || peerW.userData.isDead) continue;
                    if(peerW.userData.aiState !== 'idle') continue;
                    if(peerW.userData.aiRoomId === undefined){
                        const mgx = Math.round(peerW.position.x/GRID);
                        const mgz = Math.round(peerW.position.z/GRID);
                        peerW.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
                    }
                    if(peerW.userData.aiRoomId === peerRoom){
                        _setMonsterHostile(peerW);
                        alerted++;
                    }
                }
                ud.aiRoomId = peerRoom;
                ud._lastFetchAt = now;
                ud.aiState = 'hostile';
                ud._fetchTileX = ud._fetchTileZ = undefined;
                ud._fetchPath = null;
                ud.aiPath = null;
                const mName = ud.name || 'Goblin';
                if(alerted > 0){
                    // User-spec yell — "WE ARE BEING ATTACKED!" — fires the
                    // moment a fetcher reaches a peer-room doorway and rouses
                    // the room. This is the ONLY way adjacent rooms join
                    // the fight; passive cross-room alerts were removed.
                    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                        text:`📣 <b>${mName}</b>: "WE ARE BEING ATTACKED!" — ${alerted} answer the call.`}, '*');
                }
                continue;
            }
            // Path to the fetch tile — re-uses the chase A* helper
            const pathAge = now - (ud._fetchPathStamp || 0);
            if(!ud._fetchPath || pathAge > 0.6){
                ud._fetchPath = _monAStar(sgx, sgz, fx, fz);
                ud._fetchPathIdx = (ud._fetchPath && ud._fetchPath.length > 1) ? 1 : 0;
                ud._fetchPathStamp = now;
            }
            let tgtX = fx*GRID, tgtZ = fz*GRID;
            if(ud._fetchPath && ud._fetchPathIdx < ud._fetchPath.length){
                const [tgx, tgz] = ud._fetchPath[ud._fetchPathIdx];
                tgtX = tgx*GRID; tgtZ = tgz*GRID;
                const adx = tgtX - monBase.position.x, adz = tgtZ - monBase.position.z;
                if(adx*adx + adz*adz < 0.16){
                    ud._fetchPathIdx++;
                    if(ud._fetchPathIdx >= ud._fetchPath.length) ud._fetchPath = null;
                }
            }
            const fdx = tgtX - monBase.position.x;
            const fdz = tgtZ - monBase.position.z;
            const wantAngle = Math.atan2(fdx, fdz);
            let diff = wantAngle - (monBase.rotation.y||0);
            while(diff > Math.PI) diff -= Math.PI*2;
            while(diff < -Math.PI) diff += Math.PI*2;
            monBase.rotation.y += diff * Math.min(1, dt*5);
            w.rotation.y = monBase.rotation.y;
            const slowMul = (ud.slowUntil && ud.slowUntil > performance.now()) ? 0.5 : 1.0;
            const step = MON_WANDER_SPD * 2.0 * slowMul * dt; // sprint to fetch help
            const slen = Math.sqrt(fdx*fdx + fdz*fdz) || 1;
            const nx = monBase.position.x + (fdx/slen)*step;
            const nz = monBase.position.z + (fdz/slen)*step;
            if(_canMonsterStand(nx, nz, w)){
                monBase.position.x = nx; monBase.position.z = nz;
                w.position.x = nx; w.position.z = nz;
            } else {
                ud._fetchPath = null;
            }
            _monSetAnim(ud, 'walk');
        }
    }
}

// ── Combat System ─────────────────────────────────────────────────────────────
// MISSILE_TABLE, CARD_TYPES, EL_COLORS, _cardElement, _cardCategory,
// _getMissileTable, _isMissileCard, _isShuriken → js/v8/combat/CardExecutor.js
// DUNGEON_LEVEL is declared as `let` at the top of the generator — it mutates on descent.
const playerStats = { level:1, skill:5 }; // bumped by SYNC_STATS

// ── T0.26 — CENTRAL COMBAT BRAIN ─────────────────────────────────────────────
// All damage events in the game funnel through _oniBabaResolveCombat().
// `_combatBrain.params` mirrors oniBaba8.combat.params; she pushes updates via
// SYNC_COMBAT_PARAMS whenever mood/karma/hive shifts. Engine reads its local
// copy synchronously so resolution stays in-frame. Every resolved attack is
// reported back to her with COMBAT_RECORD for AI learning + history.
const _combatBrain = {
    params: {
        playerDmgMult:       1.0,
        monsterDmgMult:      1.0,
        critChance:          0.10,
        monsterHitChance:    1.0,
        monsterDodgeChance:  0.0,
    },
};
function _oniBabaResolveCombat(req){
    // req: { kind: 'player_to_monster' | 'monster_to_player',
    //        baseDmg, cardName, sourceName, targetId, element }
    const p = _combatBrain.params;
    let out;
    if (req.kind === 'player_to_monster'){
        if (Math.random() < p.monsterDodgeChance){
            out = { final: 0, dodged: true, isCrit: false };
        } else {
            let final = req.baseDmg * p.playerDmgMult;
            const isCrit = Math.random() < p.critChance;
            if (isCrit) final *= 2;
            out = { final: Math.round(final), dodged: false, isCrit };
        }
    } else {
        if (Math.random() > p.monsterHitChance){
            out = { final: 0, missed: true };
        } else {
            out = { final: Math.round(req.baseDmg * p.monsterDmgMult), missed: false };
        }
    }
    // Report to Oni-Baba for AI learning + history
    window.parent.postMessage({
        type: 'COMBAT_RECORD',
        kind: req.kind, cardName: req.cardName, baseDmg: req.baseDmg,
        final: out.final, isCrit: out.isCrit || false, dodged: out.dodged || false,
        missed: out.missed || false, sourceName: req.sourceName, targetId: req.targetId,
        element: req.element,
    }, '*');
    return out;
}
// Listen for Oni-Baba's param syncs
window.addEventListener('message', e => {
    if (e.data?.type === 'SYNC_COMBAT_PARAMS' && e.data.params){
        Object.assign(_combatBrain.params, e.data.params);
    }
});

// ── T0.27 — COMBAT ASSIST ────────────────────────────────────────────────────
// Light auto-help so slow / new players don't get crushed. Three behaviours:
//   1. PER-ATTACK auto-shield: incoming monster hit + player idle ≥ 0.5s →
//      auto-fire DEFEND so the shield's 75% absorb kicks in. 3s cooldown.
//   2. SWARM auto-shield: 2+ hostiles in melee range + player idle ≥ 0.5s →
//      auto-fire DEFEND preemptively. 4s cooldown. Threshold drops to 1
//      hostile when Oni-Baba is benevolent (her mercy).
//   3. AUTO-MELEE: hostile in melee range + player idle ≥ 2.5s → auto-fire
//      SLASH. 3s cooldown. Idle threshold drops to 2.0s when benevolent.
// Every auto-action is logged so the player learns the pattern. Disabled
// when the player is dead.
const _combatAssist = {
    enabled: true,
    lastPlayerActionT: 0,
    lastAutoShieldT:   0,
    lastAutoMeleeT:    0,
};
function _markPlayerAction(){ _combatAssist.lastPlayerActionT = performance.now(); }

function _tickCombatAssist(dt){
    if (!_combatAssist.enabled || playerDead) return;
    const now = performance.now();
    const idleTime = (now - _combatAssist.lastPlayerActionT) / 1000;
    // Skip until at least 0.4s idle — avoid triggering during normal input
    if (idleTime < 0.4) return;

    // Count nearby hostiles + nearest
    let nearestDist = Infinity, hostileInMelee = 0;
    for (const w of monsterWrappers){
        if (w.userData.isDead || w.userData.aiState !== 'hostile') continue;
        const dx = w.position.x - px, dz = w.position.z - pz;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (d < 2 * GRID) hostileInMelee++;
        if (d < nearestDist) nearestDist = d;
    }
    if (nearestDist === Infinity) return; // no threats

    // "Generous" assist when Oni-Baba is benevolent
    const generous = _combatBrain.params.playerDmgMult > 1.05;
    const swarmThreshold  = generous ? 2 : 3;          // need a real swarm
    const autoMeleeIdleT  = generous ? 2.5 : 3.5;
    const hpFrac          = playerHp / playerMaxHp;

    // SWARM auto-shield — only at low HP (real danger), high cooldown
    if (hostileInMelee >= swarmThreshold && !_shieldActive && hpFrac < 0.50
        && (now - _combatAssist.lastAutoShieldT) > 10000){
        _combatAssist.lastAutoShieldT = now;
        _executeMeleeCard('DEFEND');
        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
            text:`🛡️ Auto-shield: Oni-Baba steadies your hand against the swarm.`}, '*');
        return;
    }

    // AUTO-MELEE (only if a hostile is in melee range)
    if (nearestDist < 2 * GRID && idleTime > autoMeleeIdleT
        && (now - _combatAssist.lastAutoMeleeT) > 3000){
        _combatAssist.lastAutoMeleeT = now;
        _executeMeleeCard('SLASH');
        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
            text:`⚔ Auto-strike: your hand reacts before you do.`}, '*');
    }
}

// T0.25 — Player state authority. Engine owns HP, level, XP, gold.
// On every monster hit we decrement HP and broadcast SYNC_STATS so the
// sidebar fill bar stays in sync. HP <= 0 triggers _onPlayerDeath.
let playerHp = 100, playerMaxHp = 100;
let playerXp = 0,   playerMaxXp = 100;
let playerLevel = 1, playerGold = 50;
let playerDead = false;
let _killCount  = 0;  // total monsters slain this run — saved with high score

// Per-monster state to apply once each monster spawns (consumed during the
// async GLTF load → buildMonsterEntity path). Populated from a save payload.
let _savedMonsterStates = null;

// Descent restore: if the parent reloaded us with a saved descent payload,
// rehydrate HP / karma from sessionStorage. Karma is restored on Oni-Baba's
// side once she's available (see ENGINE8_READY hook below).
try {
    const _saved = JSON.parse(sessionStorage.getItem('origami.v8.descent') || 'null');
    if (_saved && _saved.floor === DUNGEON_LEVEL) {
        if (typeof _saved.maxHp === 'number') playerMaxHp = _saved.maxHp;
        if (typeof _saved.hp === 'number')    playerHp    = Math.max(1, Math.min(playerMaxHp, _saved.hp));
        // Push restored karma into Oni-Baba once she's bound
        if (typeof _saved.karma === 'number') {
            const applyKarma = () => {
                const ob = window.parent?.oniBaba8 || window.oniBaba8;
                if (ob) { ob.karma = _saved.karma; if (typeof ob._updateMood === 'function') ob._updateMood(); }
            };
            applyKarma();
            setTimeout(applyKarma, 200); // retry once after Oni-Baba is bound
        }
        // Clear so a manual reload doesn't keep snapping us back
        sessionStorage.removeItem('origami.v8.descent');
    }
} catch (_) {}

// ── Named save / load — full game state via localStorage ──────────────────
// Saves are user-named JSON blobs holding: floor, player vitals + position +
// karma, per-monster HP/dead snapshot, and the panels-side card inventory.
// On Load, the engine writes the payload into sessionStorage then asks the
// parent to reload this iframe with ?floor=N — boot then re-applies state.
const _SAVE_MANIFEST_KEY = 'origami.v8.saves.manifest';
const _SAVE_SLOT_PREFIX  = 'origami.v8.save.';
function _saveSlotKey(name){
    return _SAVE_SLOT_PREFIX + encodeURIComponent(String(name).slice(0, 64));
}
function _readSaveManifest(){
    try { return JSON.parse(localStorage.getItem(_SAVE_MANIFEST_KEY) || '{"saves":[]}'); }
    catch { return { saves: [] }; }
}
function _writeSaveManifest(m){
    try { localStorage.setItem(_SAVE_MANIFEST_KEY, JSON.stringify(m)); } catch {}
}
function _gatherSavePayload(name, inventory){
    const ob = window.parent?.oniBaba8 || window.oniBaba8;
    const monsters = [];
    for (const w of (typeof monsterWrappers !== 'undefined' ? monsterWrappers : [])){
        const ud = w.userData || {};
        monsters.push({
            id:   ud.id,
            hp:   ud.hp,
            dead: !!ud.isDead,
        });
    }
    return {
        version: 1,
        name,
        timestamp: Date.now(),
        floor: DUNGEON_LEVEL,
        moonPhase: window._currentMoonPhase || '',
        karma: ob?.karma ?? 0,
        player: {
            hp: playerHp, maxHp: playerMaxHp,
            level: playerLevel, xp: playerXp, maxXp: playerMaxXp,
            gold: playerGold,
            killCount: _killCount,
            px, pz, rot,
        },
        monsters,
        inventory: inventory || {},
    };
}
function _writeSaveSlot(name, inventory){
    try {
        const payload = _gatherSavePayload(name, inventory);
        localStorage.setItem(_saveSlotKey(name), JSON.stringify(payload));
        // Manifest summary — drives the panels save list.
        const manifest = _readSaveManifest();
        const summary = {
            name, timestamp: payload.timestamp,
            floor:  payload.floor,
            level:  payload.player.level,
            hp:     payload.player.hp,
            maxHp:  payload.player.maxHp,
            kills:  payload.player.killCount,
        };
        const idx = manifest.saves.findIndex(s => s.name === name);
        if (idx >= 0) manifest.saves[idx] = summary;
        else manifest.saves.push(summary);
        _writeSaveManifest(manifest);
        return true;
    } catch (e) {
        console.warn('[save] write failed', e);
        return false;
    }
}
function _readSaveSlot(name){
    try { return JSON.parse(localStorage.getItem(_saveSlotKey(name)) || 'null'); }
    catch { return null; }
}
function _deleteSaveSlot(name){
    try {
        localStorage.removeItem(_saveSlotKey(name));
        const manifest = _readSaveManifest();
        manifest.saves = manifest.saves.filter(s => s.name !== name);
        _writeSaveManifest(manifest);
        return true;
    } catch (e) { console.warn('[save] delete failed', e); return false; }
}
function _broadcastSaveList(){
    const manifest = _readSaveManifest();
    window.parent.postMessage({type:'SAVE_LIST', saves: manifest.saves}, '*');
}

// ── Restore from a Load payload (run during boot, before player vars are
// fully initialized below — but they're declared with `let` above so we can
// override them here). _savedMonsterStates is consumed when each monster is
// later spawned via buildMonsterEntity.
try {
    const _loadRaw = sessionStorage.getItem('origami.v8.loadSave');
    if (_loadRaw){
        sessionStorage.removeItem('origami.v8.loadSave');
        const payload = JSON.parse(_loadRaw);
        if (payload && payload.floor === DUNGEON_LEVEL && payload.player){
            const p = payload.player;
            if (typeof p.maxHp === 'number') playerMaxHp = p.maxHp;
            if (typeof p.hp === 'number')    playerHp    = Math.max(1, Math.min(playerMaxHp, p.hp));
            if (typeof p.level === 'number') playerLevel = p.level;
            if (typeof p.xp === 'number')    playerXp    = p.xp;
            if (typeof p.maxXp === 'number') playerMaxXp = p.maxXp;
            if (typeof p.gold === 'number')  playerGold  = p.gold;
            if (typeof p.killCount === 'number') _killCount = p.killCount;
            // Player position is restored later (px / pz / rot are re-declared
            // around line 2174 — we re-apply there via a deferred hook).
            window._pendingLoadPos = { px: p.px, pz: p.pz, rot: p.rot };
            // Monster state map keyed by id — applied as each monster spawns.
            _savedMonsterStates = {};
            for (const m of (payload.monsters || [])){
                if (m && m.id) _savedMonsterStates[m.id] = m;
            }
            // Karma → Oni-Baba (retry once she's bound)
            if (typeof payload.karma === 'number'){
                const apply = () => {
                    const ob = window.parent?.oniBaba8 || window.oniBaba8;
                    if (ob){ ob.karma = payload.karma; if (typeof ob._updateMood === 'function') ob._updateMood(); }
                };
                apply(); setTimeout(apply, 250);
            }
            // Inventory → push back to panels so its card UI re-syncs.
            if (payload.inventory){
                setTimeout(() => {
                    window.parent.postMessage({type:'INVENTORY_RESTORE', inventory: payload.inventory}, '*');
                }, 400);
            }
            console.log('[save] restored', payload.name || '(unnamed)', 'on floor', payload.floor);
        }
    }
} catch (e) { console.warn('[save] load-restore failed', e); }

function _syncPlayerStats(){
    window.parent.postMessage({
        type: 'SYNC_STATS',
        hp: playerHp, maxHp: playerMaxHp,
        playerLevel, xp: playerXp, maxXp: playerMaxXp,
        gold: playerGold,
    }, '*');
}
function _applyPlayerDamage(dmg, name){
    if (playerDead || dmg <= 0) return false;
    // Per-attack auto-shield is a DESPERATION safety net, not a default tank.
    // Conditions intentionally strict so normal monster hits land at full damage:
    //   • HP already below 40% (real danger)
    //   • Player idle ≥ 2s (truly not responding)
    //   • 12s cooldown so it can't tank a chain of hits
    if (_combatAssist.enabled && !_shieldActive){
        const now = performance.now();
        const idleTime = (now - _combatAssist.lastPlayerActionT) / 1000;
        const hpFrac   = playerHp / playerMaxHp;
        if (hpFrac < 0.40 && idleTime > 2.0 && (now - _combatAssist.lastAutoShieldT) > 12000){
            _combatAssist.lastAutoShieldT = now;
            _executeMeleeCard('DEFEND');
            window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                text:'🛡️ Auto-shield raises in time.'}, '*');
        }
    }
    // T0.26 — Route through Oni-Baba's combat brain for hit-chance + mood mods
    const resolved = _oniBabaResolveCombat({
        kind: 'monster_to_player',
        baseDmg: dmg,
        sourceName: name || 'Goblin',
        targetId: 'player',
    });
    if (resolved.missed){
        // Show MONSTER MISSED in the FPV as gray themed combat text.
        spawnMissText('MONSTER MISSED');
        window.parent.postMessage({type:'MONSTER_ATTACK', damage: 0, name: name || 'Goblin'}, '*');
        return false;
    }
    let actual = resolved.final;
    // Shield absorbs 75% AFTER mood scaling — softer hit
    if (_shieldActive){
        actual = Math.max(1, Math.floor(actual * 0.25));
    }
    playerHp = Math.max(0, playerHp - actual);
    // Remember the last hit so the death log + defeat screen can name
    // who killed you and for how much.
    _lastPlayerDmgSource = name || 'Unknown';
    _lastPlayerDmgAmount = actual;
    _syncPlayerStats();
    // Red light bloom around the player avatar — mirrors the monster hit cue.
    _spawnHitBloom(playerAvatar);
    // Floating red damage text — uses the ACTUAL applied damage (post mood
    // multiplier + shield absorb) so the number you see equals the HP drop.
    spawnDamageText(actual, _atkVec3.set(px, 1.2, pz), true);
    // Notify panels for the damage log + showBigCombatText
    window.parent.postMessage({type:'MONSTER_ATTACK', damage: actual, name: name || 'Goblin'}, '*');
    if (_shieldActive){
        _spawnMeleeVFX('THRUST');
        addCameraTrauma(0.12); triggerHitStop(30);
        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
            text:'🛡️ Shield blocks the blow! <b>75% absorbed.</b>'},'*');
    } else {
        _spawnMeleeVFX('SLASH');
        addCameraTrauma(0.5); triggerHitStop(60);
    }
    autoWalkInterrupt = true;
    if (playerHp <= 0) _onPlayerDeath();
    return true;
}

// Death cinematic state
let _deathPhase = null; // 'fall' | 'blink' | 'done'
let _deathT = 0;
let _deathCamStartY = 0, _deathCamStartRotX = 0;
// Last hit that landed on the player — captured each time _applyPlayerDamage
// resolves so the defeat screen + log can name the killer + damage taken.
let _lastPlayerDmgSource = 'Unknown';
let _lastPlayerDmgAmount = 0;
function _onPlayerDeath(){
    if (_deathPhase) return;
    _deathPhase = 'fall';
    _deathT = 0;
    _deathCamStartY = camera.position.y;
    _deathCamStartRotX = camera.rotation.x;
    // Wipe input keys
    Object.keys(keys).forEach(k => delete keys[k]);
    // Damage report so the player can SEE what just killed them.
    const _src = _lastPlayerDmgSource || 'Unknown';
    const _amt = _lastPlayerDmgAmount || 0;
    window.parent.postMessage({type:'LOG_EVENT', logType:'damage',
        text: `☠️ <b>You have been slain!</b> Killed by <b>${_src}</b> for <b>${_amt}</b> damage.`}, '*');
}
function _tickPlayerDeath(dt){
    if (!_deathPhase || _deathPhase === 'done') return;
    _deathT += dt;
    if (_deathPhase === 'fall'){
        // 1.5s: camera drops from eye height to ~0.2 (floor), rotates to look down
        const FALL_DUR = 1.5;
        const t = Math.min(1, _deathT / FALL_DUR);
        const easedT = t * t; // ease-in gravity
        camera.position.y = _deathCamStartY + (0.2 - _deathCamStartY) * easedT;
        camera.rotation.x = _deathCamStartRotX + (-Math.PI/2.4 - _deathCamStartRotX) * easedT;
        if (_deathT >= FALL_DUR){
            _deathPhase = 'blink';
            _deathT = 0;
            // Tell panels to start the blink + show modal
            window.parent.postMessage({
                type: 'DEFEAT_BLINK',
                dungeonLevel: DUNGEON_LEVEL,
                playerLevel,
                xp: playerXp,
                gold: playerGold,
                kills: _killCount,
                killerName: _lastPlayerDmgSource,
                killerDamage: _lastPlayerDmgAmount,
            }, '*');
        }
    } else if (_deathPhase === 'blink'){
        // Panels owns the blink anim + modal. Engine just freezes here.
        if (_deathT > 4.0) _deathPhase = 'done';
    }
}

// Wire-up: bind damage calc functions to live DUNGEON_LEVEL / playerStats refs
const { calcDamage, calcMissileDamage, calcSpellDamage } = createCombatCalc(
    () => DUNGEON_LEVEL,
    () => playerStats
);

// ── Active boulder list (for physics tick) ───────────────────────────────────
const activeBoulders = [];

function _boulderCrumble(b){
    // Spawn 8 small rock shards that scatter, then fade
    const shardMat = new THREE.MeshBasicMaterial({color:0x5a4428});
    for(let k=0; k<8; k++){
        const sg = new THREE.DodecahedronGeometry(0.08 + Math.random()*0.12, 0);
        const sm = new THREE.Mesh(sg, shardMat);
        sm.position.copy(b.mesh.position);
        scene.add(sm);
        const vel = new THREE.Vector3(
            (Math.random()-0.5)*5, Math.random()*3+1, (Math.random()-0.5)*5
        );
        let t=0;
        const animShard = ()=>{
            t+=0.016;
            vel.y -= 9.8*0.016;
            sm.position.addScaledVector(vel, 0.016);
            sm.rotation.x += 0.12; sm.rotation.z += 0.09;
            sm.material.opacity = Math.max(0, 1-t*1.5);
            if(!sm.material.transparent){ sm.material.transparent=true; }
            if(t < 0.8) requestAnimationFrame(animShard);
            else scene.remove(sm);
        };
        requestAnimationFrame(animShard);
    }
    // Dust burst light
    const dustL = new THREE.PointLight(0xcc8833, 8, 5);
    dustL.position.copy(b.mesh.position);
    scene.add(dustL);
    setTimeout(()=>scene.remove(dustL), 400);
    window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
        text:'💥 Boulder crumbles into dust!'},'*');
}

function tickBoulders(dt){
    for(let i = activeBoulders.length-1; i >= 0; i--){
        const b = activeBoulders[i];

        // ── 1. CONJURE: boulder is sealed in the spell-ball orb, hovering ──
        // in front of the player. Slowly rotates + scales up. After ~0.85s
        // the shell shatters and the boulder breaks free with downward +
        // forward impulse — that's the "break free of the circle bubble".
        if(b.state === 'conjure'){
            b.conjureT += dt;
            const t = Math.min(1, b.conjureT / 0.85);
            // Slow rotation while bound
            b.mesh.rotation.x += dt * 0.8;
            b.mesh.rotation.y += dt * 1.1;
            // Scale up boulder + shell smoothly to full size
            const s = 0.45 + (1 - 0.45) * t;
            b.mesh.scale.setScalar(s);
            if(b.shell){
                b.shell.position.copy(b.mesh.position);
                b.shell.scale.setScalar(1 + Math.sin(b.conjureT * 6) * 0.04);
                // Shell pulses brighter just before shattering
                b.shell.material.opacity = 0.32 + Math.sin(b.conjureT * 8) * 0.08;
            }
            b.light.position.copy(b.mesh.position);
            b.light.intensity = 3 + Math.sin(b.conjureT * 10) * 1.0;

            if(b.conjureT >= 0.85){
                // BREAK FREE: shatter the shell, give the boulder its launch impulse.
                b.state = 'lumber';
                b.timeAlive = 0;
                if(b.shell){
                    _spawnHitBurst(b.shell.position.clone(), 'EARTH');
                    scene.remove(b.shell);
                    b.shell = null;
                }
                // FAST pinball speed — was 4.5 (turtle), now 13-15 (terror).
                const spd = 13 + Math.random() * 2;
                b.vx = b.aimFwd.x * spd;
                b.vy = 0.0;             // no jump — stays grounded
                b.vz = b.aimFwd.z * spd;
                // Drop the boulder to floor level immediately.
                b.mesh.position.y = b.radius;
                addCameraTrauma(0.55);
                window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
                    text:`🪨 BOULDER LOOSE — pinballing for 5 seconds. FLATTENS anything it touches, including YOU.`},'*');
            }
            continue;
        }

        // ── 2. PINBALL: boulder screams along the floor at high speed,
        //     bouncing off walls until its 5-second life burns out. Same
        //     damage to monsters and player. Anything within 6 tiles of
        //     its path panics.
        b.timeAlive += dt;
        if (b.timeAlive >= b.maxLifetime){
            _boulderCrumble(b);
            scene.remove(b.mesh);
            scene.remove(b.light);
            activeBoulders.splice(i,1);
            continue;
        }

        // Heavy rotation matching the rolling direction. Angular velocity =
        // linear velocity / radius. Rotation axis is perpendicular to motion
        // in the ground plane: (-vz, 0, vx).
        const _speed = Math.sqrt(b.vx*b.vx + b.vz*b.vz) || 0.001;
        const _angVel = _speed / b.radius;
        const _axX = -b.vz / _speed, _axZ = b.vx / _speed;
        b.mesh.rotateOnWorldAxis(new THREE.Vector3(_axX, 0, _axZ), _angVel * dt);

        // Stay on the floor — no upward kick, no ceiling bounce.
        b.mesh.position.y = b.radius;
        b.vy = 0;

        // Wall bounce — high restitution so it really pinballs (0.92). After
        // the mirror, the velocity is rotated by a random ±35° kick so the
        // boulder rarely retraces its path straight back at the caster. A
        // separate ±25% magnitude jitter keeps successive bounces from
        // converging on the same speed.
        const nx2 = b.mesh.position.x + b.vx * dt;
        const nz2 = b.mesh.position.z + b.vz * dt;
        const bGx = Math.round(nx2/GRID), bGz = Math.round(nz2/GRID);
        const hitWallX = !!(map[bGx]?.[bGz]?.type === 'wall' || map[bGx]?.[bGz]?.type === 'shoji');
        const hitWallZ = !!(map[Math.round(b.mesh.position.x/GRID)]?.[Math.round(nz2/GRID)]?.type === 'wall');
        if(hitWallX) b.vx *= -0.92;
        if(hitWallZ) b.vz *= -0.92;
        if (hitWallX || hitWallZ){
            // Randomize the post-bounce heading. Strong rotation (up to ±35°)
            // breaks the back-and-forth pinball lane that always punished the
            // caster. Skip if velocity is near-zero (avoid amplifying noise).
            const sp = Math.hypot(b.vx, b.vz);
            if (sp > 0.05){
                const ang = (Math.random() - 0.5) * 1.22;       // ±35° in radians
                const mag = sp * (0.85 + Math.random() * 0.30); // 0.85–1.15× speed
                const c = Math.cos(ang), s = Math.sin(ang);
                const rx = b.vx * c - b.vz * s;
                const rz = b.vx * s + b.vz * c;
                const inv = mag / sp;
                b.vx = rx * inv;
                b.vz = rz * inv;
            }
        }
        if(!hitWallX) b.mesh.position.x = nx2;
        if(!hitWallZ) b.mesh.position.z = nz2;
        if (hitWallX || hitWallZ){
            addCameraTrauma(0.18);
            // Crack residue + dust puff at the impact point (boulder's last
            // valid position). Crack lingers 12s — leaves a chronological
            // map of where the boulder ricocheted.
            _spawnFloorDecal(b.mesh.position, 'crack', { rOuter: 0.65, rInner: 0.08, life: 12 });
            _spawnFloorDecal(b.mesh.position, 'dust',  { rOuter: 1.15, rInner: 0.25, life: 1.8 });
        }

        // No friction — boulder keeps barreling for its full 5 seconds.

        // ── Player collision: SAME damage as monsters take ──
        // Roll the same 4d20 + 38 (range 42-158) the monster branch uses,
        // so the player getting flattened by their own throw is just as
        // brutal as flattening a goblin. 0.9-second debounce so a single
        // fly-by counts as one hit, but a long re-roll can hit again.
        b.playerHitCooldown = Math.max(0, (b.playerHitCooldown || 0) - dt);
        const dxP = px - b.mesh.position.x;
        const dzP = pz - b.mesh.position.z;
        const playerDist = Math.sqrt(dxP*dxP + dzP*dzP);
        if (playerDist < (b.radius + 0.55) && b.playerHitCooldown <= 0){
            b.playerHitCooldown = 0.9;
            const d1 = 1 + Math.floor(Math.random()*20);
            const d2 = 1 + Math.floor(Math.random()*20);
            const d3 = 1 + Math.floor(Math.random()*20);
            const d4 = 1 + Math.floor(Math.random()*20);
            const dmg = d1 + d2 + d3 + d4 + 38;
            if (typeof _applyPlayerDamage === 'function'){
                _applyPlayerDamage(dmg, 'Boulder');
            }
            addCameraTrauma(0.75);
            triggerHitStop(95);
            window.parent.postMessage({type:'LOG_EVENT', logType:'damage',
                text:`💥 BOULDER FLATTENS YOU for <b>${dmg}</b>! Run next time.`}, '*');
            // Knock the boulder away so the player can dodge instead of
            // getting hit on every consecutive frame.
            if (playerDist > 0.001){
                const nxd = dxP / playerDist, nzd = dzP / playerDist;
                b.mesh.position.x -= nxd * 0.30;
                b.mesh.position.z -= nzd * 0.30;
                // Reflect the boulder a bit off the player so it changes
                // course instead of grinding through them.
                const vDotN = b.vx * (-nxd) + b.vz * (-nzd);
                b.vx -= 1.6 * vDotN * (-nxd);
                b.vz -= 1.6 * vDotN * (-nzd);
            }
        }

        // ── Path panic: any monster the boulder is rolling AT screams + flees
        // Cone test: monster must be within 6 tiles AND in the boulder's
        // forward 110° arc. Forces flee on first detection so the recruit
        // cascade kicks in for free.
        {
            const PANIC_R    = 6 * GRID;
            const PANIC_R2   = PANIC_R * PANIC_R;
            const speedSq    = b.vx*b.vx + b.vz*b.vz;
            if (speedSq > 0.05){
                const invSpd  = 1 / Math.sqrt(speedSq);
                const fdx     = b.vx * invSpd;
                const fdz     = b.vz * invSpd;
                const DOT_T   = -0.35; // ~110° forward arc
                if (!b._scaredSet) b._scaredSet = new Set();
                for (const w of monsterWrappers){
                    const ud = w.userData;
                    if (!ud || ud.isDead) continue;
                    if (b._scaredSet.has(w)) continue;
                    const mx = w.position.x - b.mesh.position.x;
                    const mz = w.position.z - b.mesh.position.z;
                    const d2 = mx*mx + mz*mz;
                    if (d2 > PANIC_R2) continue;
                    const md = Math.sqrt(d2) || 1;
                    const dot = (mx/md)*fdx + (mz/md)*fdz;
                    if (dot < DOT_T) continue; // boulder rolling away from them
                    b._scaredSet.add(w);
                    if (ud.aiState !== 'flee' && ud.aiState !== 'fetch'){
                        ud.aiState = 'flee';
                        ud._fleeCried = true;
                        // Try to upgrade flee → fetch immediately.
                        const reinf = (typeof _findReinforcementDoorway === 'function')
                            ? _findReinforcementDoorway(ud) : null;
                        if (reinf){
                            ud.aiState = 'fetch';
                            ud._fetchTileX = reinf.doorX;
                            ud._fetchTileZ = reinf.doorZ;
                            ud._fetchPeerRoom = reinf.peerRoomId;
                            ud._fetchPath = null;
                            ud._lastFetchAt = performance.now() / 1000;
                        }
                        const cName = ud.name || 'Goblin';
                        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                            text:`😱 <b>${cName}</b> spots the boulder and SCREAMS — get out of the way!`},'*');
                    }
                }
            }
        }

        // ── Door smash: bust intact shoji door + grant +2s of pinball life
        // Only fires once per boulder so the timer can't be refilled forever.
        if(!b._doorBoosted){
            const cellGx = Math.round(b.mesh.position.x/GRID);
            const cellGz = Math.round(b.mesh.position.z/GRID);
            if(map[cellGx]?.[cellGz]?.type === 'shoji_door'){
                const panel = shojiDoorPanels.find(p => p.cx === cellGx && p.cz === cellGz && !p.broken);
                if(panel){
                    _breakShojiPanel(panel);
                    _spawnHitBurst(b.mesh.position.clone(), 'EARTH');
                    addCameraTrauma(0.45);
                    b.maxLifetime += 2.0;             // +2s pinball reserve
                    b._doorBoosted = true;
                    if(b.bloomRing) b.bloomRing.material.opacity = 0.95;
                    window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
                        text:'🚪💥 Boulder BUSTS through the shoji door — pinballing onward!'},'*');
                }
            }
        }

        // Spin bloom ring + fade as the timer nears expiry.
        if(b.bloomRing) b.bloomRing.rotation.x += dt * 3;
        b.light.position.copy(b.mesh.position);
        if(b.bloomRing){
            b.bloomRing.material.opacity = 0.7 * (1 - b.timeAlive / b.maxLifetime);
        }

        // ── Per-monster hit resolution (4d20, dodge, flatten) ──────────────
        for(const w of monsterWrappers){
            const ud = w.userData;
            if(ud.isDead) continue;
            const dx = w.position.x - b.mesh.position.x;
            const dz = w.position.z - b.mesh.position.z;
            if(Math.sqrt(dx*dx+dz*dz) < 1.0 && !b.hitSet.has(w)){
                b.hitSet.add(w);
                // Roll 4d20 + 38 flat — matches calcSpellDamage's 4-dice formula
                // exactly (range 42–158) so the boulder's actual hit number
                // matches what the playing card claims.
                const d1 = 1 + Math.floor(Math.random()*20);
                const d2 = 1 + Math.floor(Math.random()*20);
                const d3 = 1 + Math.floor(Math.random()*20);
                const d4 = 1 + Math.floor(Math.random()*20);
                const roll = d1 + d2 + d3 + d4 + 38;
                const mName = ud.name || 'Goblin';

                // DODGE: low total → monster sidesteps. Push them backwards
                // along the boulder's direction for ~0.5s with the walk anim.
                // Threshold scaled with the new 42-158 range: rolls in the
                // bottom ~12% (≤ 60) count as a dodge.
                const DODGE_THRESHOLD = 60;
                if(roll < DODGE_THRESHOLD){
                    // Backstep impulse along boulder's heading
                    const len = Math.sqrt(b.vx*b.vx + b.vz*b.vz) || 1;
                    ud._knockImpulseX = (b.vx / len) * 1.4;
                    ud._knockImpulseZ = (b.vz / len) * 1.4;
                    ud._knockT = 0.5; // tickMonsterAI already eases knock impulses
                    if(typeof _monSetAnim === 'function') _monSetAnim(ud, 'walk');
                    spawnMissText('MONSTER DODGED', w.position.clone().setY(1.5));
                    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                        text:`${mName} sidesteps the boulder! (rolled ${roll})`},'*');
                    continue;
                }

                // HIT: apply damage. If the roll >50% of monster's maxHp it's
                // a flatten + stun (1 in-game turn ≈ 3s recovery).
                _applyMonsterDamage(w, roll, 'EARTH');
                _spawnHitBurst(w.position.clone().setY(1), 'EARTH');

                const maxHp = ud.maxHp ?? 50;
                const isFlatten = roll > maxHp * 0.5;
                if(isFlatten){
                    // Flatten — squash on Y, widen on X/Z, schedule recovery
                    ud._stunTimer = Math.max(ud._stunTimer || 0, 3.0); // 1 turn
                    ud._boulderStunned = true;
                    ud._stunStartTime = Date.now();
                    w.scale.y = 0.3;
                    w.scale.x = 1.4;
                    w.scale.z = 1.4;
                    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                        text:`💥 Boulder FLATTENS ${mName}! (rolled ${roll}, stunned 1 turn)`},'*');
                } else {
                    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                        text:`Boulder slams ${mName} for ${roll} (rolled ${d1}+${d2}+${d3}+${d4}).`},'*');
                }
            }
        }
    }
}

        emissive:0x88aaff, emissiveIntensity:0.4});

    const tipGlowGeo = new THREE.SphereGeometry(0.06, 8, 6);

        blending:THREE.AdditiveBlending, depthWrite:false});

    // Fletching — 3 fins at the tail
    const finMat = new THREE.MeshBasicMaterial({color:0xeeeeee, side:THREE.DoubleSide,
        transparent:true, opacity:0.85});
    for(let f=0; f<3; f++){
        const finShape = new THREE.Shape();
        finShape.moveTo(0, 0); finShape.lineTo(0.06, 0.18); finShape.lineTo(0, 0.14);
        finShape.closePath();
        const finGeo = new THREE.ShapeGeometry(finShape);
        const fin = new THREE.Mesh(finGeo, finMat);
        fin.rotation.z = (f/3)*Math.PI*2;
        fin.rotation.y = Math.PI/2;

// Build a realistic 3D shuriken model (world scale, spins in flight)
function _buildShurikenModel(){

// ── OniBaba auto-targeting ───────────────────────────────────────────────────
// Single entry point for all card/missile/spell launches. Routes through
// OniBaba8.getAutoTarget so she tracks attacks, applies hive-mind dodge,
// triggers monster retaliation, and manages karma.
function _obAutoTarget(cardName, dmg){
    // ── RULE: a monster can only be attacked if it has a TAB selector ──
    // The lock IS the selector. If one is already placed (TAB) and the
    // target is still alive, attack flows there. Otherwise we auto-place
    // the selector on whichever monster the auto-picker chooses so the
    // reticle is visibly on the monster the player is about to hit. If
    // no candidate exists, return null — caller treats that as "no
    // target" (spell fizzles forward, melee plays anim but lands nothing).
    if (_lockedTarget && !_lockedTarget.userData.isDead) return _lockedTarget;

    const ob = window.oniBaba8 || window.parent?.oniBaba8;
    // LOS predicate: engine owns the map, so we hand OniBaba a closure she
    // can call to skip monsters hidden behind walls / intact shoji panels.
    const losFn = (mx, mz) => _hasLineOfSight(px, pz, mx, mz);
    let picked = null;
    if(ob && typeof ob.getAutoTarget === 'function'){
        picked = ob.getAutoTarget(px, pz, monsterWrappers, cardName, dmg, losFn);
    } else {
        // Fallback: plain nearest-VISIBLE-monster search if OniBaba not loaded
        let bestD = Infinity;
        for(const w of monsterWrappers){
            if(w.userData?.isDead) continue;
            if(!losFn(w.position.x, w.position.z)) continue;
            const d=Math.hypot(w.position.x-px, w.position.z-pz);
            if(d<bestD){bestD=d; picked=w;}
        }
    }
    // Auto-place the TAB selector on the picked monster (the rule). Sticky:
    // sticks until the monster dies or the player TABs to a different one.
    if (picked && !picked.userData?.isDead){
        _lockedTarget = picked;
    }
    return picked;
}

// ── Around-corner auto-target ─────────────────────────────────────────────
// Same as _obAutoTarget but also considers monsters WITHOUT direct line of
// sight — they get tagged blocked + a via-waypoint near the corner so the
// missile can be routed around it. Caller can apply a hit-penalty to
// reflect the difficulty of the shot.
const _CORNER_AIM_MAX_TILES = 8;
function _findCornerViaPoint(targetX, targetZ){
    // Search walkable cells around the midpoint between player and target
    // for one that has LOS to BOTH. The shortest combined-distance one wins.
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    const tgx = Math.round(targetX/GRID), tgz = Math.round(targetZ/GRID);
    const midX = (pgx + tgx) >> 1, midZ = (pgz + tgz) >> 1;
    let best = null, bestScore = Infinity;
    for (let dx = -5; dx <= 5; dx++){
        for (let dz = -5; dz <= 5; dz++){
            const gx = midX + dx, gz = midZ + dz;
            if (gx < 0 || gx >= MAP_W || gz < 0 || gz >= MAP_H) continue;
            const t = map[gx]?.[gz]?.type;
            if (!t || t === 'wall' || t === 'shoji') continue;
            const cwx = gx * GRID, cwz = gz * GRID;
            if (!_hasLineOfSight(px, pz, cwx, cwz)) continue;
            if (!_hasLineOfSight(cwx, cwz, targetX, targetZ)) continue;
            const s = Math.hypot(cwx - px, cwz - pz) + Math.hypot(cwx - targetX, cwz - targetZ);
            if (s < bestScore){ bestScore = s; best = { x: cwx, z: cwz }; }
        }
    }
    return best;
}
function _obAutoTargetWithCorner(cardName, dmg){
    // First try the normal LOS-clear target.
    const visible = _obAutoTarget(cardName, dmg);
    if (visible) return { target: visible, blocked: false, viaPoint: null };

    // Otherwise look for a nearby blocked monster (≤ 8 tiles) and try to
    // route around the corner.
    let best = null, bestD = Infinity;
    const maxR = _CORNER_AIM_MAX_TILES * GRID;
    for (const w of monsterWrappers){
        if (w.userData?.isDead) continue;
        const dx = w.position.x - px, dz = w.position.z - pz;
        const d = Math.hypot(dx, dz);
        if (d > maxR) continue;
        if (_hasLineOfSight(px, pz, w.position.x, w.position.z)) continue;
        if (d < bestD){ bestD = d; best = w; }
    }
    if (!best) return { target: null, blocked: false, viaPoint: null };
    const via = _findCornerViaPoint(best.position.x, best.position.z);
    if (!via) return { target: null, blocked: false, viaPoint: null }; // no clean route
    return { target: best, blocked: true, viaPoint: via };
}

// ── Spent brass casing — ejected to the right of the barrel on every shot.
//    Small brass cylinder with tumble, gravity, floor-bounce, and a quiet
//    metallic clink SFX when it lands. Fades after ~1.4s. Self-cleaning.
function _spawnBrassCasing(){
    const casing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.020, 0.024, 0.078, 8, 1, true),
        new THREE.MeshStandardMaterial({
            color: 0xc99432, emissive: 0x5a3a10, emissiveIntensity: 0.5,
            metalness: 0.95, roughness: 0.20,
            transparent: true, opacity: 1.0,
        })
    );
    // Spawn at the ejection port — right + slightly behind + chest height
    const offset = new THREE.Vector3(0.35, -0.10, -0.20);
    offset.applyEuler(camera.rotation);
    casing.position.copy(camera.position).add(offset);
    // Eject vector: kicked right + slightly back + up. Convert from camera
    // local space → world.
    const ejectLocal = new THREE.Vector3(2.6 + Math.random() * 0.8,
                                         2.2 + Math.random() * 0.8,
                                         0.8 + Math.random() * 0.6);
    const ejectWorld = ejectLocal.clone().applyEuler(camera.rotation);
    casing.userData = {
        vel: ejectWorld,
        spin: new THREE.Vector3((Math.random()-0.5)*22, (Math.random()-0.5)*22, (Math.random()-0.5)*22),
        age: 0, life: 1.4, bounced: false,
    };
    scene.add(casing);
    _activeBrassCasings.push(casing);
}
const _activeBrassCasings = [];
function _tickBrassCasings(dt){
    for (let i = _activeBrassCasings.length - 1; i >= 0; i--){
        const c = _activeBrassCasings[i];
        const u = c.userData;
        u.age += dt;
        u.vel.y -= 12.5 * dt;                    // gravity
        c.position.addScaledVector(u.vel, dt);
        c.rotation.x += u.spin.x * dt;
        c.rotation.y += u.spin.y * dt;
        c.rotation.z += u.spin.z * dt;
        // Floor bounce (just one — second contact freezes)
        if (c.position.y <= 0.03){
            c.position.y = 0.03;
            if (!u.bounced && u.vel.y < -0.5){
                u.bounced = true;
                u.vel.y *= -0.32;                 // damped bounce
                u.vel.x *= 0.45;
                u.vel.z *= 0.45;
                u.spin.multiplyScalar(0.55);
                // Tiny metallic clink — short noise burst + ring oscillator
                if (typeof _getAudioCtx === 'function'){
                    const ctx = _getAudioCtx();
                    if (ctx && !_audioMuted){
                        const now = ctx.currentTime;
                        const o = ctx.createOscillator();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(2200 + Math.random()*400, now);
                        o.frequency.exponentialRampToValueAtTime(900, now + 0.08);
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.08, now);
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
                        o.connect(g); g.connect(ctx.destination);
                        o.start(now); o.stop(now + 0.11);
                    }
                }
            } else {
                u.vel.set(0, 0, 0);
                u.spin.multiplyScalar(0.6);
            }
        }
        // Fade in the last 0.4s
        if (u.age > u.life - 0.4){
            const f = (u.age - (u.life - 0.4)) / 0.4;
            c.material.opacity = Math.max(0, 1 - f);
        }
        if (u.age >= u.life){
            scene.remove(c);
            _activeBrassCasings.splice(i, 1);
        }
    }
}

// ── Bullet wall-impact spark — bright orange spark cluster + grey dust
//    puff that bursts off the wall along the bullet's reverse direction.
//    Independent from the persistent wall hole; this is the brief "impact
//    flash" that makes the hit read in the moment.
function _spawnBulletWallImpactSpark(pos, normalAwayFromWall){
    const back = normalAwayFromWall.clone().normalize();
    // Bright orange spark cluster — 8 small additive planes that arc away
    // from the wall + drop with gravity, fading over 0.18s.
    const sparkMat = new THREE.MeshBasicMaterial({
        color: 0xffd066, transparent: true, opacity: 1.0,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    });
    const sparkGeo = new THREE.PlaneGeometry(0.05, 0.05);
    const sparks = [];
    for (let i = 0; i < 8; i++){
        const s = new THREE.Mesh(sparkGeo, sparkMat.clone());
        s.position.copy(pos);
        const scatter = new THREE.Vector3(
            (Math.random()-0.5)*1.6,
            (Math.random()-0.5)*1.6,
            (Math.random()-0.5)*1.6
        );
        s.userData.vel = back.clone().multiplyScalar(2.2 + Math.random()*1.4).add(scatter);
        s.userData.vel.y += 0.6 + Math.random()*0.5; // bias up
        scene.add(s);
        sparks.push(s);
    }
    // Grey dust puff — single soft sphere that grows and fades
    const dust = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 6),
        new THREE.MeshBasicMaterial({
            color: 0xa9a395, transparent: true, opacity: 0.65,
            depthWrite: false,
        })
    );
    dust.position.copy(pos).add(back.clone().multiplyScalar(0.04));
    scene.add(dust);
    // Brief impact flash light
    const flashLight = new THREE.PointLight(0xffaa44, 4.0, 1.6, 1.6);
    flashLight.position.copy(pos);
    scene.add(flashLight);
    let age = 0; const life = 0.22;
    (function tick(){
        const dt2 = 0.016;
        age += dt2;
        const t = age / life;
        for (const s of sparks){
            s.userData.vel.y -= 8.0 * dt2;
            s.position.addScaledVector(s.userData.vel, dt2);
            s.material.opacity = 1.0 * Math.max(0, 1 - t);
        }
        dust.scale.setScalar(1 + t * 2.2);
        dust.material.opacity = 0.65 * Math.max(0, 1 - t);
        flashLight.intensity = 4.0 * Math.max(0, 1 - t * 1.5);
        if (age < life) requestAnimationFrame(tick);
        else {
            for (const s of sparks){ scene.remove(s); s.material.dispose(); }
            scene.remove(dust); dust.material.dispose();
            scene.remove(flashLight);
        }
    })();
}

// ── Tracer trail — thin glowing line that follows the bullet's flight path
//    for ~0.10s before fading. Spawned at fire time using the bullet's
//    initial direction; visual only (the bullet itself does the damage).
// ── Shared bullet-tracer assets (allocated ONCE) ───────────────────────────
// Previous code allocated a fresh CylinderGeometry + MeshBasicMaterial per
// shot — each shot triggered shader recompile checks and GC pressure. Now
// every tracer reuses one geometry + one material. The mesh itself is
// per-shot but cheap; the material `.opacity` write doesn't trigger recompile.
const _TRACER_LEN = 5.5;
const _TRACER_RAD = 0.025;
const _tracerGeo = (() => {
    const g = new THREE.CylinderGeometry(_TRACER_RAD, _TRACER_RAD, _TRACER_LEN, 6, 1, true);
    g.translate(0, _TRACER_LEN / 2, 0);
    return g;
})();
const _tracerMat = new THREE.MeshBasicMaterial({
    color: 0xfff2c8, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
});
const _TRACER_UP = new THREE.Vector3(0, 1, 0);
const _tracerTmpDir = new THREE.Vector3();
function _spawnBulletTracer(start, dir){
    const tracer = new THREE.Mesh(_tracerGeo, _tracerMat);
    tracer.position.copy(start);
    _tracerTmpDir.copy(dir).normalize();
    tracer.quaternion.setFromUnitVectors(_TRACER_UP, _tracerTmpDir);
    scene.add(tracer);
    let age = 0; const life = 0.08;
    (function tick(){
        age += 0.016;
        const t = age / life;
        tracer.scale.y = 1 + t * 0.6;
        if (age < life) requestAnimationFrame(tick);
        else { scene.remove(tracer); }   // geo + mat are shared; do NOT dispose
    })();
}

// ── Lens flare texture (lazy singleton) ─────────────────────────────────────
// Procedural muzzle-flare drawn into a single CanvasTexture and reused for
// every shot. Layered: bright white-hot core → warm spike rays → chromatic
// halo ring. Plays as a billboarded plane that always faces the camera.
let _lensFlareTexture = null;
function _getLensFlareTexture(){
    if (_lensFlareTexture) return _lensFlareTexture;
    const SIZE = 256;
    const cnv = document.createElement('canvas');
    cnv.width = SIZE; cnv.height = SIZE;
    const ctx = cnv.getContext('2d');
    const c   = SIZE / 2;
    // Bright white-hot core — sharp radial falloff.
    const core = ctx.createRadialGradient(c, c, 0, c, c, SIZE * 0.18);
    core.addColorStop(0.0, 'rgba(255,255,255,1)');
    core.addColorStop(0.4, 'rgba(255,240,180,0.85)');
    core.addColorStop(1.0, 'rgba(255,180,40,0)');
    ctx.fillStyle = core;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 6 radial spike rays — long thin bright lines that fade outward. This
    // is the signature "lens flare" look. Drawn additively via lighter blend.
    ctx.globalCompositeOperation = 'lighter';
    const SPIKE_LEN = SIZE * 0.50;
    for (let i = 0; i < 6; i++){
        const ang = (i / 6) * Math.PI * 2;
        const x2 = c + Math.cos(ang) * SPIKE_LEN;
        const y2 = c + Math.sin(ang) * SPIKE_LEN;
        const spk = ctx.createLinearGradient(c, c, x2, y2);
        spk.addColorStop(0.0, 'rgba(255,250,220,0.95)');
        spk.addColorStop(0.6, 'rgba(255,180,80,0.35)');
        spk.addColorStop(1.0, 'rgba(255,140,40,0)');
        ctx.strokeStyle = spk;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }
    // Subtle outer chromatic halo — faint cool ring just outside the warm
    // core suggests refraction through the lens glass.
    const halo = ctx.createRadialGradient(c, c, SIZE * 0.20, c, c, SIZE * 0.42);
    halo.addColorStop(0.0, 'rgba(255,140,60,0.12)');
    halo.addColorStop(0.5, 'rgba(120,160,255,0.10)');
    halo.addColorStop(1.0, 'rgba(60,80,160,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.globalCompositeOperation = 'source-over';
    const tex = new THREE.CanvasTexture(cnv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    _lensFlareTexture = tex;
    return tex;
}

// ── Unified muzzle flash ───────────────────────────────────────────────────
// Photo-real firearm explosion in four layers:
//   1. Lens-flare billboard — bright + spike rays, always camera-facing.
//      Quick burst (~70ms), scales up + fades. The signature flash.
//   2. White-hot core sphere — tiny, very bright. Reads as ignition point.
//   3. Forward flame cone — elongated cone in the firing direction.
//      Asymmetric so the flash doesn't read as a perfect bubble.
//   4. Warm PointLight (HDR-ish intensity, short range, 60ms decay) — casts
//      a real light pool on adjacent geometry. Monsters won't catch this
//      light because _applyUnlit() zeroes their reflectedLight contributions.
// ── Shared muzzle-flash assets ─────────────────────────────────────────────
// One geometry + one material per layer, reused across every shot. Per-shot
// scale/opacity/quaternion live on the Mesh instances (cheap). This dodges
// the 100-500ms shader-compile stalls that "new MeshBasicMaterial(...)"
// per shot was provoking when combined with active monster shaders in the
// recompile queue.
const _MZF_FLARE_GEO = new THREE.PlaneGeometry(1, 1);
const _MZF_CORE_GEO  = new THREE.SphereGeometry(1, 10, 8);
const _MZF_CONE_GEO  = (() => {
    const g = new THREE.ConeGeometry(1, 1, 10, 1, true);
    g.translate(0, 0.5, 0);  // pivot at base
    return g;
})();
const _MZF_UP        = new THREE.Vector3(0, 1, 0);
let _MZF_FLARE_MAT = null, _MZF_CORE_MAT = null, _MZF_CONE_MAT = null;
function _initMuzzleFlashMats(){
    if (_MZF_FLARE_MAT) return;
    _MZF_FLARE_MAT = new THREE.MeshBasicMaterial({
        map: _getLensFlareTexture(), color: 0xffffff, transparent: true, opacity: 1.0,
        blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
        fog: false, side: THREE.DoubleSide,
    });
    _MZF_CORE_MAT = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 1.0,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    });
    _MZF_CONE_MAT = new THREE.MeshBasicMaterial({
        color: 0xffb050, transparent: true, opacity: 0.95,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
        side: THREE.DoubleSide,
    });
}
// Pool of reusable PointLights for muzzle flashes — Three.js has a hard
// limit on simultaneously-active lights, but adding/removing lights from
// the scene tree forces a shader recompile (the lights uniforms array size
// changes). Pool 3 lights up-front; recycle on each shot.
const _MZF_LIGHT_POOL = [];
const _MZF_POOL_SIZE  = 3;
function _initMuzzleFlashLights(){
    if (_MZF_LIGHT_POOL.length) return;
    for (let i = 0; i < _MZF_POOL_SIZE; i++){
        const l = new THREE.PointLight(0xffb060, 0, 5.5, 1.8);
        l.visible = false;
        scene.add(l);
        _MZF_LIGHT_POOL.push({ light: l, busy: false });
    }
}
function _acquireMuzzleLight(){
    _initMuzzleFlashLights();
    for (const slot of _MZF_LIGHT_POOL){
        if (!slot.busy){ slot.busy = true; slot.light.visible = true; return slot; }
    }
    return null; // all 3 busy — silently drop the light for this shot
}
function _releaseMuzzleLight(slot){
    if (!slot) return;
    slot.busy = false;
    slot.light.visible = false;
    slot.light.intensity = 0;
}

function _spawnMuzzleFlash(pos, dir, opts){
    _initMuzzleFlashMats();
    opts = opts || {};
    const scale     = opts.scale    || 1.0;
    const lifeMs    = opts.lifeMs   || 90;
    const lightInt  = opts.lightInt || 22;
    const lightRng  = opts.lightRng || 5.5;
    const fwd = _tracerTmpDir.copy(dir).normalize();   // borrow shared tmp vec

    // 1. Lens-flare billboard — shared geo + mat. Per-mesh scale = flareSize.
    const flareSize = 1.4 * scale;
    const flare = new THREE.Mesh(_MZF_FLARE_GEO, _MZF_FLARE_MAT);
    flare.position.copy(pos).addScaledVector(fwd, 0.04);
    flare.scale.set(flareSize, flareSize, 1);
    flare.renderOrder = 50;
    scene.add(flare);

    // 2. White-hot core.
    const coreSize = 0.07 * scale;
    const core = new THREE.Mesh(_MZF_CORE_GEO, _MZF_CORE_MAT);
    core.position.copy(pos);
    core.scale.setScalar(coreSize);
    scene.add(core);

    // 3. Forward flame cone.
    const coneLen = 0.45 * scale;
    const coneRad = 0.12 * scale;
    const cone = new THREE.Mesh(_MZF_CONE_GEO, _MZF_CONE_MAT);
    cone.position.copy(pos);
    cone.scale.set(coneRad, coneLen, coneRad);
    cone.quaternion.setFromUnitVectors(_MZF_UP, fwd);
    scene.add(cone);

    // 4. Pooled PointLight.
    const lightSlot = _acquireMuzzleLight();
    if (lightSlot){
        lightSlot.light.position.copy(pos);
        lightSlot.light.color.setHex(0xffb060);
        lightSlot.light.distance  = lightRng;
        lightSlot.light.intensity = lightInt;
    }

    const startT = performance.now();
    const life = lifeMs / 1000;
    // NB: shared materials mean opacity-write affects every concurrent flash.
    // Concurrent flashes (player+imp) are rare enough that the cross-fade
    // glitch is invisible at 90ms lifetimes. Pool the light to dodge shader
    // recompiles from scene-light count churn.
    (function tick(){
        const age = (performance.now() - startT) / 1000;
        const t = Math.min(1, age / life);
        // Camera-facing flare with scale ramp + faint flicker.
        flare.lookAt(camera.position);
        const flareScale = flareSize * (1 + t * 0.9);
        flare.scale.set(flareScale, flareScale, 1);
        const flicker = 1 - (Math.random() * 0.25);
        _MZF_FLARE_MAT.opacity = (1 - t) * flicker;
        // Core ignition.
        _MZF_CORE_MAT.opacity = Math.max(0, 1 - t * 1.8);
        core.scale.setScalar(coreSize * (1 + t * 0.4));
        // Flame cone stretches forward + thins.
        cone.scale.set(coneRad * (1 - t * 0.3), coneLen * (1 + t * 0.5), coneRad * (1 - t * 0.3));
        _MZF_CONE_MAT.opacity = 0.95 * (1 - t * 1.2);
        // Pooled light decay.
        if (lightSlot) lightSlot.light.intensity = lightInt * Math.max(0, 1 - t * 1.4);

        if (age < life) requestAnimationFrame(tick);
        else {
            scene.remove(flare);
            scene.remove(core);
            scene.remove(cone);
            _releaseMuzzleLight(lightSlot);
            // Geometries + materials are SHARED — never disposed here.
        }
    })();
}

function _spawnPlayerMuzzleFlash(){
    // 9mm muzzle flash anchored to the player's hand offset (right of cam).
    // Delegates the visual stack (lens flare + hot core + flame cone + warm
    // point light) to _spawnMuzzleFlash. The unified helper is photo-real:
    // lens-flare canvas texture with 6 spike rays, asymmetric forward cone,
    // 90ms total lifetime so it never reads as a static sprite.
    const handOff = new THREE.Vector3(0.26, -0.14, -0.45);
    handOff.applyEuler(camera.rotation);
    const pos = camera.position.clone().add(handOff);
    const _fwd = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
    _spawnMuzzleFlash(pos, _fwd, { scale: 1.8, lifeMs: 140, lightInt: 40, lightRng: 8.0 });
    // Pistol-shot SFX — play the bundled pistol-shot.mp3. Falls back to the
    // procedural synth if the file is missing or fails to load.
    _playPistolShotSfx(0.9);
    addCameraTrauma(0.55);
    // Camera RECOIL — kick the pitch up + give the recoil velocity a hard
    // impulse so the spring-damp tick can settle it back to neutral. Stacks
    // across rapid taps (each shot adds to the current kick).
    _pistolRecoilPitch += _PISTOL_RECOIL_KICK;
    _pistolRecoilVel   += _PISTOL_RECOIL_KICK * 4;
    // Brass ejects to the right of the barrel; tracer streaks forward.
    _spawnBrassCasing();
    _spawnBulletTracer(pos, _fwd);
    // Barrel smoke wisp — quick gunsmoke puff just ahead of the muzzle that
    // rises and dissipates over ~0.6s. Two soft additive spheres for depth.
    _spawnBarrelSmoke(pos, _fwd);
}

// ── Barrel smoke — gunsmoke wisp that rises and fades after each shot ──
function _spawnBarrelSmoke(muzzlePos, fwd){
    const puffOff = fwd.clone().multiplyScalar(0.18);
    const baseP = muzzlePos.clone().add(puffOff);
    const puffs = [];
    for (let i = 0; i < 2; i++){
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.10 + i*0.04, 10, 7),
            new THREE.MeshBasicMaterial({
                color: 0x9a958c, transparent: true, opacity: 0.55,
                depthWrite: false,
            })
        );
        p.position.copy(baseP).add(new THREE.Vector3(
            (Math.random()-0.5)*0.06,
            (Math.random()-0.5)*0.04,
            (Math.random()-0.5)*0.06,
        ));
        p.userData = {
            vy: 0.55 + Math.random() * 0.35,
            life: 0.55 + i * 0.10,
            age: 0,
            baseOp: 0.55,
        };
        scene.add(p);
        puffs.push(p);
    }
