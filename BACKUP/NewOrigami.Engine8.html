  <!-- Procedural .45 pistol model. Replaces the broken USDZ load that was
       throwing 'texCoord2f primvars:st0' parse errors and pulling in a second
       Three.js (warning: Multiple instances of Three.js being imported).
       Hand-built from primitives so it has no file dependency and loads
       instantly. -->
  <script>
    (function buildProceduralPistol(){
      const R = window.THREE;
      if (!R) return; // r128 loaded above; should never miss
      const g = new R.Group();
      // Materials — gunmetal slide, darker frame, walnut grip
      const matGun  = new R.MeshStandardMaterial({ color: 0x2a2d33, metalness: 0.85, roughness: 0.32 });
      const matDark = new R.MeshStandardMaterial({ color: 0x141618, metalness: 0.55, roughness: 0.55 });
      const matGrip = new R.MeshStandardMaterial({ color: 0x4a2f1c, metalness: 0.10, roughness: 0.78 });
      const matBrass = new R.MeshStandardMaterial({ color: 0xc09040, metalness: 0.65, roughness: 0.40 });

      // Slide — long top block (gun points along -Z; +Y is up)
      const slide = new R.Mesh(new R.BoxGeometry(0.36, 0.42, 1.55), matGun);
      slide.position.set(0, 0.52, 0);
      g.add(slide);
      // Slide serrations cosmetic — a single notch ring near the rear
      const serr = new R.Mesh(new R.BoxGeometry(0.38, 0.06, 0.22), matDark);
      serr.position.set(0, 0.52, 0.55);
      g.add(serr);
      // Front sight
      const fs = new R.Mesh(new R.BoxGeometry(0.06, 0.10, 0.10), matDark);
      fs.position.set(0, 0.78, -0.60);
      g.add(fs);
      // Rear sight
      const rs = new R.Mesh(new R.BoxGeometry(0.30, 0.10, 0.10), matDark);
      rs.position.set(0, 0.78, 0.55);
      g.add(rs);
      // Barrel — small cylinder peeking out the front
      const barrel = new R.Mesh(new R.CylinderGeometry(0.10, 0.10, 0.18, 14), matDark);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0, 0.52, -0.86);
      g.add(barrel);
      // Frame — under the slide
      const frame = new R.Mesh(new R.BoxGeometry(0.32, 0.18, 1.05), matGun);
      frame.position.set(0, 0.22, 0.05);
      g.add(frame);
      // Trigger guard — torus segment under the frame
      const guard = new R.Mesh(new R.TorusGeometry(0.18, 0.04, 8, 16, Math.PI), matDark);
      guard.rotation.set(Math.PI / 2, 0, Math.PI);
      guard.position.set(0, 0.02, 0.18);
      g.add(guard);
      // Trigger — small box inside the guard
      const trig = new R.Mesh(new R.BoxGeometry(0.06, 0.16, 0.05), matBrass);
      trig.position.set(0, 0.06, 0.20);
      g.add(trig);
      // Grip — angled walnut box behind the trigger
      const grip = new R.Mesh(new R.BoxGeometry(0.34, 0.95, 0.46), matGrip);
      grip.position.set(0, -0.35, 0.45);
      grip.rotation.x = -0.20; // grip rake
      g.add(grip);
      // Mag well plate at base of grip
      const magBase = new R.Mesh(new R.BoxGeometry(0.36, 0.06, 0.48), matDark);
      magBase.position.set(0, -0.82, 0.55);
      magBase.rotation.x = -0.20;
      g.add(magBase);
      // Hammer — small spur at rear-top
      const hammer = new R.Mesh(new R.BoxGeometry(0.10, 0.16, 0.06), matDark);
      hammer.position.set(0, 0.78, 0.72);
      g.add(hammer);

      // Recenter group on its own centroid and normalize to ~2.2u silhouette
      const box = new R.Box3().setFromObject(g);
      const size = box.getSize(new R.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      g.scale.multiplyScalar(2.2 / maxDim);
      box.setFromObject(g);
      const c = box.getCenter(new R.Vector3());
      g.position.sub(c);

      window._pistol45Model = g;
      console.log('[Pistol-45] procedural model built (no USDZ load)');
    })();
  </script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family: sans-serif; }

    /* Loading Screen */
    #loading-screen {
      position:absolute; top:0; left:0; width:100%; height:100%;
      background:#0b0b0e; z-index:9999; display:flex; flex-direction:column;
      align-items:center; justify-content:center; transition:opacity 0.4s ease-out;
    }
    .loader-content { text-align:center; color:#00ffff; font-family:monospace; letter-spacing:0.2rem; }
    .loader-content h2 { font-weight:800; margin-bottom:2rem; font-size:1.5rem; text-transform:uppercase; }
    .progress-box { width:350px; height:6px; background:rgba(0,255,255,0.1); border:1px solid rgba(0,255,255,0.2); border-radius:3px; overflow:hidden; margin:0 auto; }
    #loading-bar-fill { width:0%; height:100%; background:linear-gradient(90deg,#0088ff,#00ffff); transition:width 0.1s ease-out; }
    #loading-text { margin-top:1rem; font-size:0.9rem; font-weight:600; font-family:monospace; }
    #loading-file { margin-top:0.5rem; font-size:0.65rem; color:rgba(0,255,255,0.6); font-family:monospace; }

    /* PIP cinematic frame — wraps the two canvases (2D map + WebGL FPV cam) */
    #pip-frame {
      position:fixed; top:0; left:0;
      width:160px; height:160px;
      z-index:98; border-radius:50%;
      cursor:pointer;
      transition:transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow:
        0 0 0 2px rgba(124,224,184,0.25),
        0 8px 28px rgba(0,0,0,0.7),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      overflow:hidden;
    }
    #pip-frame:hover {
      transform:scale(1.06);
      box-shadow:
        0 0 0 2px rgba(124,224,184,0.6),
        0 12px 36px rgba(0,0,0,0.8),
        0 0 28px rgba(124,224,184,0.45);
    }
    /* Both canvases stack and fill the frame; opacity-crossfaded by JS. */
    #pip-frame canvas {
      position:absolute; inset:0;
      width:100%; height:100%;
      border-radius:50%;
      transition:opacity 0.32s ease;
    }
    /* Cinematic overlays */
    .pip-overlay {
      position:absolute; inset:0; pointer-events:none;
      border-radius:50%; overflow:hidden;
    }
    /* Scanlines + soft lens vignette */
    .pip-overlay::before {
      content:''; position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%),
        repeating-linear-gradient(0deg,
          rgba(0,0,0,0)   0px,
          rgba(0,0,0,0)   2px,
          rgba(0,0,0,0.10) 3px);
      mix-blend-mode:multiply;
    }
    /* Glass shimmer highlight (top-left lens reflection) */
    .pip-overlay::after {
      content:''; position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(ellipse 38% 22% at 28% 22%,
        rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 70%);
    }
    /* REC dot (pulsing red) */
    .pip-rec {
      position:absolute; top:10%; right:14%;
      display:flex; align-items:center; gap:4px;
      font:700 8px/1 'SF Mono','Inter',monospace;
      color:rgba(255,82,82,0.95);
      letter-spacing:1.3px;
      text-shadow:0 0 6px rgba(255,82,82,0.65);
      pointer-events:none;
    }
    .pip-rec-dot {
      width:6px; height:6px; border-radius:50%;
      background:#ff5252;
      box-shadow:0 0 6px rgba(255,82,82,0.9), 0 0 12px rgba(255,82,82,0.5);
      animation:pipRecPulse 1.4s ease-in-out infinite;
    }
    @keyframes pipRecPulse {
      0%,100% { opacity:1;   transform:scale(1); }
      50%     { opacity:0.35; transform:scale(0.85); }
    }
    /* Cinematic top/bottom bars (only show in FPV-cam mode via .cam-mode) */
    .pip-cinebar {
      position:absolute; left:0; right:0; height:11%;
      background:linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.55));
      opacity:0; transition:opacity 0.4s ease;
      pointer-events:none;
    }
    .pip-cinebar.top    { top:0; }
    .pip-cinebar.bottom { bottom:0; transform:scaleY(-1); }
    #pip-frame.cam-mode .pip-cinebar { opacity:1; }
    /* Center reticle crosshair (faint) */
    .pip-reticle {
      position:absolute; top:50%; left:50%;
      width:18px; height:18px; transform:translate(-50%,-50%);
      pointer-events:none; opacity:0.55;
    }
    .pip-reticle::before, .pip-reticle::after {
      content:''; position:absolute; background:rgba(255,255,255,0.7);
      box-shadow:0 0 4px rgba(255,255,255,0.4);
    }
    .pip-reticle::before { left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%); }
    .pip-reticle::after  { top:50%; left:0; right:0; height:1px; transform:translateY(-50%); }
    /* Hide reticle in 2D-map mode (only show on cam) */
    #pip-frame:not(.cam-mode) .pip-reticle { opacity:0; }
    /* Frame-edge micro chromatic aberration */
    #pip-frame::after {
      content:''; position:absolute; inset:0; border-radius:50%;
      box-shadow:
        inset 0 0 0 1px rgba(124,224,184,0.18),
        inset 0 0 22px rgba(0,0,0,0.55);
      pointer-events:none;
    }

    /* Legacy id kept for compatibility but de-styled (real styling on #pip-frame now) */
    #pip-canvas {
      position:absolute;
      width:100%; height:100%;
      border-radius:50%;
      pointer-events:auto; cursor:pointer; overflow:hidden; display:none;
      transition:transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow:0 0 0 2px rgba(124,224,184,0.25), 0 8px 24px rgba(0,0,0,0.55);
    }

    /* Fullscreen Map Modal — opens on PIP click */
    #fs-map-overlay {
      position:fixed; inset:0; z-index:9999; display:none;
      background:radial-gradient(ellipse at center, rgba(20,18,14,0.95) 0%, rgba(8,6,4,0.98) 100%);
      backdrop-filter:blur(8px);
      align-items:center; justify-content:center;
      flex-direction:column; gap:18px;
    }
    #fs-map-overlay.open { display:flex; }
    #fs-map-canvas {
      width:min(86vmin,860px); height:min(86vmin,860px);
      border-radius:24px;
      background:#1a1d22;
      box-shadow:
        0 30px 90px rgba(0,0,0,0.85),
        0 0 0 1px rgba(124,224,184,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    #fs-map-title {
      font-family:'Inter','Segoe UI',sans-serif;
      letter-spacing:6px; font-weight:700; font-size:11px;
      color:#7ce0b8; text-transform:uppercase;
      text-shadow:0 0 14px rgba(124,224,184,0.5);
    }
    #fs-map-hint {
      font-family:'SF Mono',monospace; font-size:10px; color:#5c6470;
      letter-spacing:2px;
    }
    #fs-map-close {
      position:absolute; top:24px; right:28px;
      width:46px; height:46px; border-radius:50%;
      background:#1a1d22; border:none; cursor:pointer;
      color:#a8b0bb; font-size:20px; font-weight:700;
      box-shadow:6px 6px 14px rgba(0,0,0,0.6),-4px -4px 12px rgba(255,255,255,0.025);
      transition:transform 0.12s ease;
    }
    #fs-map-close:hover { transform:scale(1.08); color:#ff6b7a; }
    #fs-map-close:active { box-shadow:inset 3px 3px 6px rgba(0,0,0,0.6),inset -2px -2px 4px rgba(255,255,255,0.03); }

    /* Floating Combat Text */
    #fct-container {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:5000; overflow:hidden;
    }
    .combat-dmg-text {
      position:absolute;
      font-family:'Impact','Arial Black',sans-serif; font-weight:900;
      pointer-events:none;
      text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,3px 3px 5px rgba(0,0,0,0.8);
      animation:dmgFloat 1.2s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
      opacity:1;
      letter-spacing:0.04em;
    }
    @keyframes dmgFloat {
      0%   { transform:translate(-50%,-20%) scale(0.1) rotate(-10deg); opacity:0; }
      15%  { transform:translate(-50%,-80%) scale(1.4) rotate(5deg); opacity:1; }
      30%  { transform:translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; }
      70%  { transform:translate(-50%,-70%) scale(1.0); opacity:1; }
      100% { transform:translate(-50%,-120%) scale(1.2); opacity:0; }
    }
    /* ── WoW-style themed combat text ─────────────────────────────────── */
    /* HIT (green): player damages a monster — matches the SLASH / MELEE
       card palette. Numbers feel "good" — saturated lime green with a
       deeper green glow. Uses the standard dmgFloat keyframes. */
    .fct-hit {
      color:#7cff5a;
      font-size:clamp(38px,7.5vmin,72px);
      text-shadow:
        0 0 12px rgba(80,255,40,0.85),
        0 0 24px rgba(40,180,20,0.55),
        2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
    }
    .fct-hit.fct-crit {
      color:#ffe066;
      font-size:clamp(58px,11vmin,108px);
      text-shadow:
        0 0 16px rgba(255,210,40,0.95),
        0 0 32px rgba(255,140,0,0.7),
        2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
      animation-name:dmgFloatCrit;
    }
    @keyframes dmgFloatCrit {
      0%   { transform:translate(-50%,-20%) scale(0.1) rotate(-18deg); opacity:0; }
      18%  { transform:translate(-50%,-80%) scale(1.85) rotate(7deg); opacity:1; }
      32%  { transform:translate(-50%,-55%) scale(1.25) rotate(-3deg); opacity:1; }
      75%  { transform:translate(-50%,-75%) scale(1.30) rotate(0deg); opacity:1; }
      100% { transform:translate(-50%,-140%) scale(1.45); opacity:0; }
    }
    /* DAMAGE (red): a monster damages the player. Centred on screen, BIG. */
    .fct-damage {
      color:#ff2a2a;
      font-size:clamp(56px,11vmin,96px);
      text-shadow:
        0 0 18px rgba(255,30,30,0.95),
        0 0 36px rgba(180,0,0,0.7),
        3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
    }
    /* MISS / DODGE (gray): nobody got hurt. Cooler tone, slightly smaller,
       slower fade so the player reads "miss" clearly. */
    .fct-miss {
      color:#cfd5d8;
      font-size:clamp(34px,6.5vmin,60px);
      text-shadow:
        0 0 10px rgba(200,210,220,0.65),
        2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
      animation-name:dmgFloatMiss;
    }
    @keyframes dmgFloatMiss {
      0%   { transform:translate(-50%,-30%) scale(0.4); opacity:0; }
      20%  { transform:translate(-50%,-60%) scale(1.0); opacity:0.95; }
      75%  { transform:translate(-50%,-70%) scale(1.0); opacity:0.95; }
      100% { transform:translate(-50%,-110%) scale(0.9); opacity:0; }
    }
    /* Elemental flavours — use card-deck palette so colours feel consistent
       with the loot cards (FIRE orange, WATER blue, EARTH brown, WIND mint,
       VOID purple). Element prefix overrides .fct-hit's base color. */
    .fct-el-FIRE  { color:#ff8a3a; text-shadow:0 0 14px rgba(255,120,30,0.95),0 0 28px rgba(200,60,0,0.6),2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000; }
    .fct-el-WATER { color:#5ec4ff; text-shadow:0 0 14px rgba(80,180,255,0.95),0 0 28px rgba(20,80,200,0.6),2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000; }
    .fct-el-EARTH { color:#d9a164; text-shadow:0 0 14px rgba(220,160,90,0.95),0 0 28px rgba(120,70,20,0.6),2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000; }
    .fct-el-WIND  { color:#a8ffd6; text-shadow:0 0 14px rgba(160,255,200,0.95),0 0 28px rgba(40,180,140,0.6),2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000; }
    .fct-el-VOID  { color:#c587ff; text-shadow:0 0 14px rgba(190,120,255,0.95),0 0 28px rgba(80,20,150,0.6),2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000; }

    /* Goblin Slash Hit Overlay */
    #slash-overlay {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:4999; overflow:hidden;
    }
    /* ── Melee VFX overlays ────────────────────────────────────── */
    .slash-mark {
      position:absolute; top:50%; left:50%; width:5px; border-radius:2px;
      background:linear-gradient(180deg,#ffffff 0%,#ff2200 40%,rgba(180,0,0,0) 100%);
      box-shadow:0 0 14px 4px rgba(255,60,0,0.7),0 0 4px rgba(255,255,255,0.6);
      transform-origin:top center;
      animation:slashDrop 0.42s cubic-bezier(0.18,0.89,0.32,1.1) forwards;
    }
    @keyframes slashDrop {
      0%   { opacity:0; transform:translate(-50%,-50%) scaleY(0) rotate(var(--r)); }
      12%  { opacity:1; transform:translate(-50%,-50%) scaleY(1) rotate(var(--r)); }
      55%  { opacity:0.85; }
      100% { opacity:0; transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scaleY(1.15) rotate(var(--r)); }
    }
    /* Thrust needle — single fast forward spike */
    .thrust-mark {
      position:absolute; top:50%; left:50%; width:3px; border-radius:2px;
      background:linear-gradient(180deg,rgba(180,220,255,0) 0%,#88ccff 30%,#ffffff 55%,rgba(120,180,255,0) 100%);
      box-shadow:0 0 18px 6px rgba(100,180,255,0.8);
      transform-origin:center center;
      animation:thrustShot 0.3s ease-out forwards;
    }
    @keyframes thrustShot {
      0%   { opacity:0; height:20px; transform:translate(-50%,-50%) rotate(var(--r)) scaleY(0.2); }
      10%  { opacity:1; }
      70%  { opacity:0.9; height:var(--h); transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--r)) scaleY(1); }
      100% { opacity:0; }
    }
    /* Giant screen-wide slash — sweeps across the entire viewport so the
       player feels their swing land even in the middle of a swarm. */
    .slash-mark-screen {
      position:absolute; top:50%; left:-12vw;
      width: 130vw; height: 38px; border-radius: 19px;
      background:linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.35) 8%,
        #ffffff 18%,
        #fff2c0 30%,
        #ff8a30 50%,
        #ff2200 70%,
        rgba(120,0,0,0) 100%);
      box-shadow:0 0 38px 10px rgba(255,140,40,0.65),
                 0 0 14px 4px rgba(255,255,255,0.85);
      transform-origin:center center;
      animation:slashScreen 0.45s cubic-bezier(0.18,0.89,0.32,1.05) forwards;
      pointer-events:none;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }
    @keyframes slashScreen {
      0%   { opacity:0; transform:translate(-65%,-50%) rotate(var(--r,-22deg)) scaleY(0.25); }
      18%  { opacity:1; transform:translate(-50%,-50%) rotate(var(--r,-22deg)) scaleY(1.2); }
      55%  { opacity:0.95; transform:translate(-30%,-50%) rotate(var(--r,-22deg)) scaleY(1.0); }
      100% { opacity:0; transform:translate(60%,-50%) rotate(var(--r,-22deg)) scaleY(0.7); }
    }

    /* Heavy arc — thick sweeping blades */
    .heavy-mark {
      position:absolute; top:50%; left:50%; width:10px; border-radius:5px;
      background:linear-gradient(180deg,#fffde0 0%,#ffcc00 35%,#ff6600 70%,rgba(200,80,0,0) 100%);
      box-shadow:0 0 22px 8px rgba(255,180,0,0.75),0 0 6px rgba(255,255,200,0.8);
      transform-origin:top center;
      animation:heavyDrop 0.55s cubic-bezier(0.12,0.85,0.25,1.1) forwards;
    }
    @keyframes heavyDrop {
      0%   { opacity:0; transform:translate(-50%,-50%) scaleY(0) rotate(var(--r)); }
      10%  { opacity:1; transform:translate(-50%,-50%) scaleY(1) rotate(var(--r)); }
      100% { opacity:0; transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scaleY(1.2) rotate(var(--r)); }
    }
    /* Shield disc glow */
    .shield-overlay {
      position:absolute; top:50%; left:50%; width:340px; height:340px;
      border-radius:50%; pointer-events:none;
      transform:translate(-50%,-50%);
      background:radial-gradient(ellipse at center,rgba(80,140,255,0.22) 0%,rgba(40,80,220,0.12) 55%,transparent 75%);
      border:2px solid rgba(120,180,255,0.55);
      box-shadow:0 0 40px 12px rgba(80,140,255,0.35), inset 0 0 30px rgba(120,180,255,0.2);
      animation:shieldPulse 0.45s ease-out forwards;
      z-index:4990;
    }
    @keyframes shieldPulse {
      0%   { opacity:0; transform:translate(-50%,-50%) scale(0.5); }
      25%  { opacity:1; transform:translate(-50%,-50%) scale(1.05); }
      60%  { opacity:0.9; transform:translate(-50%,-50%) scale(1.0); }
      100% { opacity:0.7; }
    }
    .shield-overlay.fading { animation:shieldFade 0.3s ease-in forwards; }
    @keyframes shieldFade { to { opacity:0; transform:translate(-50%,-50%) scale(1.15); } }

    /* Blood vignette */
    #blood-vignette {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:4998; opacity:0; transition:opacity 0.08s ease-out;
      background:radial-gradient(ellipse at center,transparent 50%,rgba(200,0,0,0.55) 100%);
    }
    #blood-vignette.active { opacity:1; }

    /* Scene vignette — always-on darkening at the edges. +50% darker than the
       prior soft vignette (alpha lifted, falloff tightened) so the playable
       region feels lit-by-lantern and the periphery gets that cinematic dark. */
    #scene-vignette {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:4990;
      background:
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.85) 100%);
    }

    /* Interaction prompt */
    #interaction-prompt {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.8); color:white; padding:15px 30px; border-radius:8px;
      border:1px solid #ffd700; font-weight:bold; font-size:1.2rem;
      z-index:80; display:none; pointer-events:none;
    }

    /* Moon phase label — ethereal glow */
    #moonphase-label {
      position:absolute; top:46px; left:50%; transform:translateX(-50%);
      color:#e8f6ff; font-family:monospace; font-size:0.78rem; font-weight:700;
      letter-spacing:1.4px; z-index:90; pointer-events:none;
      text-shadow:
        0 0 4px  rgba(220,240,255,0.95),
        0 0 10px rgba(170,210,255,0.85),
        0 0 22px rgba(120,180,255,0.65),
        0 0 36px rgba(80,140,255,0.45);
      animation: moonpulse 4.2s ease-in-out infinite;
    }
    /* Kanji moonphase — magical green-cyan bloom */
    #moonphase-kanji {
      position:absolute; top:66px; left:50%; transform:translateX(-50%);
      color:#dffff0; font-family:'Noto Serif JP', 'Hiragino Mincho ProN', serif;
      font-size:1.15rem; font-weight:800;
      letter-spacing:3px; z-index:90; pointer-events:none;
      text-shadow:
        0 0 5px  rgba(210,255,235,0.95),
        0 0 14px rgba(120,255,200,0.85),
        0 0 26px rgba(80,230,180,0.6),
        0 0 44px rgba(60,200,160,0.4);
      animation: kanjipulse 5.6s ease-in-out infinite;
    }
    @keyframes moonpulse {
      0%,100% { text-shadow:
        0 0 4px  rgba(220,240,255,0.95),
        0 0 10px rgba(170,210,255,0.85),
        0 0 22px rgba(120,180,255,0.6),
        0 0 36px rgba(80,140,255,0.4); }
      50%     { text-shadow:
        0 0 6px  rgba(235,250,255,1.0),
        0 0 16px rgba(190,225,255,0.95),
        0 0 32px rgba(140,200,255,0.8),
        0 0 52px rgba(100,170,255,0.6); }
    }
    @keyframes kanjipulse {
      0%,100% { text-shadow:
        0 0 5px  rgba(210,255,235,0.9),
        0 0 14px rgba(120,255,200,0.8),
        0 0 26px rgba(80,230,180,0.55),
        0 0 44px rgba(60,200,160,0.35); }
      50%     { text-shadow:
        0 0 7px  rgba(225,255,245,1.0),
        0 0 20px rgba(150,255,215,0.95),
        0 0 38px rgba(110,245,195,0.75),
        0 0 60px rgba(80,220,175,0.55); }
    }

    /* Perf HUD — styled to match the .side-panel design in NewOrigami.Panels.html
       (same #232527 bg, layered neumorphic shadows, mint-green tactical accent bar,
       uppercase sp-title typography, sp-bar inner-shadow track). */
    #perf-hud {
      position:fixed; top:18px; right:18px; z-index:99; pointer-events:none;
      width:160px;
      background:#232527;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px 0 0 24px;
      padding:18px 12px 22px 14px;
      box-shadow:
        3px 3px 10px rgba(0,0,0,0.5),
        -1px -1px 4px rgba(255,255,255,0.03),
        inset 1px 1px 2px rgba(255,255,255,0.06),
        inset -1px -1px 3px rgba(0,0,0,0.4);
      font-family:'Nunito','Inter','SF Pro Display','Segoe UI',sans-serif;
      color:#ffffff;
      overflow:hidden;
    }
    /* Side-panel tactical accent strip — mint ethereal green, full height on the right */
    #perf-hud::before {
      content:'';
      position:absolute; right:0; top:0;
      width:5px; height:100%;
      background:#26c6da;
    }
    #perf-hud .hud-title {
      font-size:13px; letter-spacing:1.5px; font-weight:900;
      color:#ffffff; text-transform:uppercase;
      margin-bottom:4px; padding-bottom:0;
      text-align:center; line-height:1.1;
      text-shadow:0 1px 0 rgba(0,0,0,0.6);
      border:none; box-shadow:none;
    }
    #perf-hud .hud-sub {
      font-size:9px; font-weight:800;
      color:rgba(255,255,255,0.6);
      text-transform:uppercase;
      text-align:center; letter-spacing:1.5px;
      margin-bottom:12px;
    }
    #perf-hud .hud-row {
      display:flex; justify-content:space-between; align-items:baseline;
      margin-bottom:7px; padding:0;
      background:transparent;
      border-radius:0; box-shadow:none;
    }
    #perf-hud .hud-row:last-of-type { margin-bottom:10px; }
    #perf-hud .hud-label {
      font-size:9px; letter-spacing:1.5px; font-weight:900;
      color:rgba(255,255,255,0.6); text-transform:uppercase;
      text-shadow:none;
    }
    #perf-hud .hud-val {
      font-family:monospace;
      font-size:14px; font-weight:900;
      color:#00ffcc;
      line-height:1; letter-spacing:-0.5px;
      text-shadow:0 0 8px rgba(0,255,204,0.30);
      transition:color 0.25s ease,text-shadow 0.25s ease;
    }
    #perf-hud .hud-val.warn {
      color:#f0c060;
      text-shadow:0 0 8px rgba(240,192,96,0.4);
    }
    #perf-hud .hud-val.crit {
      color:#ff6b7a;
      text-shadow:0 0 10px rgba(255,107,122,0.5);
    }
    #perf-hud .hud-unit {
      font-size:9px; color:rgba(255,255,255,0.5);
      margin-left:3px; font-weight:700;
    }
    /* Bar track + fill — mirrors .sp-bar from the side panels */
    #perf-hud .bar-track {
      width:100%; height:8px;
      background:rgba(0,0,0,0.1);
      border:1px solid rgba(0,0,0,0.05);
      border-radius:4px; overflow:hidden;
      box-shadow:
        inset 2px 2px 4px rgba(0,0,0,0.55),
        inset -1px -1px 2px rgba(255,255,255,0.03);
    }
    #perf-hud .bar-fill {
      height:100%; border-radius:4px;
      background:linear-gradient(90deg,#26c6da,#7ce0b8);
      transition:width 0.3s ease,background 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-content">

    </div>
  </div>

  <!-- VFX Layers -->
  <div id="fct-container"></div>

  <div id="interaction-prompt">Press E to Interact</div>
  <div id="moonphase-label">NEW MOON</div>
  <div id="moonphase-kanji">新月</div>

  <!-- PIP cinematic cam frame: 2D map (FPV mode) + live FPV WebGL (topdown mode) -->
  <div id="pip-frame">

  <div id="fs-map-overlay">
    <div id="fs-map-title">CASTLE — TOP DOWN</div>

    <button id="fs-map-close" aria-label="Close map">×</button>
  </div>

  <!-- Perf HUD — styled to match .side-panel from NewOrigami.Panels.html -->
  <div id="perf-hud">
    <div class="hud-title">Engine v8</div>
    <div class="hud-sub">⬡ Performance</div>
    <div class="hud-row"><span class="hud-label">Realtime</span><span><span class="hud-val" id="hud-rt">--</span><span class="hud-unit">fps</span></span></div>
    <div class="hud-row"><span class="hud-label">Projected</span><span><span class="hud-val" id="hud-proj">--</span><span class="hud-unit">fps</span></span></div>
    <div class="hud-row"><span class="hud-label">Budget</span><span><span class="hud-val" id="hud-pct">--</span><span class="hud-unit">%</span></span></div>
    <div class="bar-track"><div class="bar-fill" id="hud-bar" style="width:0%"></div></div>
  </div>
<script type="module">
// ═══════════════════════════════════════════════════════════════════════════════
// NewOrigami Engine v8 — Full Legacy Port
// Ported from: js/engine/Core.js, WorldGen.js, Entities.js, Combat.js
//              NewOrigami.FPV.2.html
// ═══════════════════════════════════════════════════════════════════════════════

// ── T0.1 Module Imports ────────────────────────────────────────────────────────
// Three.js is loaded from CDN as a global script. Bind to module scope here so
// existing THREE.X references continue to work without any changes downstream.
const THREE = window.THREE;

import { createPathFinder } from './js/v8/entities/PathFinder.js';
import { generateDungeonMap } from './js/v8/map/MapGen.js';
import {
    createWashiPaperTexture, createDungeonFloorTexture, createDarkWoodRafterTexture,
    createSpiderwebVariantA, createSpiderwebVariantB, createSpiderwebVariantC,
    createSpiderwebVariantD, createSpiderwebVariantE, createSpiderwebVariantF,
    createDungeonTopTexture, createShojiTexture, createShojiDoorTexture, makePaperTexture
} from './js/v8/map/ProceduralTextures.js';
import {
    MISSILE_TABLE, CARD_TYPES, EL_COLORS,
    cardElement as _cardElement, cardCategory as _cardCategory,
    getMissileTable as _getMissileTable,
    isMissileCard as _isMissileCard, isShurikenCard as _isShuriken,
    createCombatCalc
} from './js/v8/combat/CardExecutor.js';
import {
    GLASS_BUBBLE_GEO as _sharedGlassBubbleGeo,
    GLASS_BUBBLE_MAT as _sharedGlassBubbleMat,
    getCardThemeColor, getCardEdgeColor,
    buildLegacyCardCanvas, buildLegacyLootIcon
} from './js/v8/entities/LootCardBuilder.js';

// ── Constants ─────────────────────────────────────────────────────────────────
const MAP_W = 128, MAP_H = 128, GRID = 2;
const WALL_H = GRID * 1.85;
// Realistic 6-foot tall samurai. Brisk walk ≈ 2.4 m/s (between casual and jog).
const EYE_HEIGHT = 1.83;            // 6 ft camera height
// +10% over the previous 2.4/2.7. Players reported the old pace dragged.
const MOVE_SPD   = 2.65;            // m/s — brisk walk
const AUTO_SPD   = 2.97;            // slightly faster while autowalking
const ROT_SPD    = 2.4;             // rad/s
// Subtler bob — gamers expect FPS-style head motion, not a deep heel drop.
// Vertical uses a proper continuous sine wave (not abs(sin)) so the head
// rises AND falls each step instead of slamming down on every heel strike.
const BOB_AMP    = 0.042;           // vertical head motion (was 0.075, ~44% softer)
const SWAY_AMP   = 0.026;           // hip sway side-to-side (slightly less)
const STEP_HZ    = 2.05;            // footsteps per second (faster cadence for the new walk speed)
const AUTO_WALK_HOLD_MS = 2000;     // 2s hold → engage auto-walk

// ── Procedural Dungeon Generator ─────────────────────────────────────────────
// Extracted to js/v8/map/MapGen.js (T0.1.B). Import at top of this module.
// DUNGEON_LEVEL seeds from ?floor=N in the iframe URL so the parent can
// descend the player by reloading with a new floor parameter. Clamped 1-7.
const _urlFloor = (() => {
    try {
        const f = parseInt(new URLSearchParams(window.location.search).get('floor') || '1', 10);
        return Math.max(1, Math.min(7, isFinite(f) ? f : 1));
    } catch (_) { return 1; }
})();
let DUNGEON_LEVEL = _urlFloor;

// Thin wrapper preserving the original call signature (no MAP_W/H args).
function generateCastleMap(){ return generateDungeonMap(DUNGEON_LEVEL, MAP_W, MAP_H); }

const {map,rooms,spawnX,spawnZ,mobSpawns} = generateCastleMap();

// ── T0.1: Wire up PathFinder module ──────────────────────────────────────────
// createPathFinder closes over map+dimensions and returns monAStar.
// Assigned to _monAStar so the tickMonsterAI call site (line ~4502) is unchanged.
const { monAStar: _monAStar } = createPathFinder(map, MAP_W, MAP_H);

// ── Room Descriptions — built from procedural room data ──────────────────────
// getRoomDesc(roomId) returns {name, kanji, desc} for the event log.
const _ROOM_FLAVOR = [
    'The flagstones are cold; your footsteps are swallowed by the dark.',
    'Water drips somewhere far off.',
    'Rotted pillars hold up the wall.',
    'The air is heavy and smells of old blood.',
    'A trace of torch-smoke lingers — something was here.',
    'Long claw-marks streak the floor.',
    'Something hangs from the ceiling. Better not to look.',
    'The silence presses on your ears.',
    'Something was written on the wall, but you can no longer read it.',
    'You see no exit. Not yet.',
];
function getRoomDesc(roomId) {
    const r = rooms.find(r => r.id === roomId);
    if(!r) return {name:'Unknown', kanji:'謎', desc:'You do not know where you are.'};
    if(r.isEntranceHall){
        // Game-start welcome card. Includes the current moon phase as a beware.
        const phaseRaw = (window._currentMoonPhase || 'FULL MOON PHASE');
        const phase = phaseRaw.replace(/\s*PHASE\s*$/i, '').toLowerCase()
                              .replace(/(^|\s)\S/g, c => c.toUpperCase());
        return {
            name: 'Entrance Hallway',
            kanji: r.roomName || '入口の廊下',
            desc: `Welcome to Origami Dungeon! &nbsp;<b style="color:#ffe066">${phase}</b> moon tonight — beware.`,
        };
    }
    if(r.isOniBaba) return {
        name:"Oni-Baba's Sanctum", kanji:'鬼婆の聖域',
        desc:'The air thickens. Red lanterns blaze unseen. A voice — ancient, amused — fills your bones: \"You came at last, child. I wondered how long it would take.\"'
    };
    const flavor = _ROOM_FLAVOR[roomId % _ROOM_FLAVOR.length];
    return { name: r.roomNameEn || r.roomName || 'Chamber', kanji: r.roomName || '', desc: flavor };
}
// Legacy compat: old code indexes ROOM_DESCRIPTIONS[id]
const ROOM_DESCRIPTIONS = new Proxy({}, { get(_,id){ return getRoomDesc(Number(id)); } });

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance', preserveDrawingBuffer:true});
renderer.setPixelRatio(1.0);
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
// PCFShadowMap (cheaper) instead of PCFSoftShadowMap — the soft variant runs
// a wider tap kernel that costs ~0.3ms/frame at 2048² for visually marginal
// gain. The dungeon is dim and shadows here read mostly as occlusion mood,
// not as a primary visual element.
renderer.shadowMap.type=THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

// ── Scene — Ghostly dungeon (from Core.js initWebGL) ─────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3f47);
scene.fog = new THREE.FogExp2(0x0a0b10, 0.0275); // +10% mist/haze — spookier without going pitch dark

// ── Cameras ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.20, 100);
camera.rotation.order='YXZ';
camera.rotation.x=-0.15;
camera.layers.enable(1);
camera.layers.enable(2);
camera.layers.enable(3);
camera.setViewOffset(window.innerWidth,window.innerHeight,0,150,window.innerWidth,window.innerHeight);

const topDownCamera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 1000);
topDownCamera.layers.set(0);
topDownCamera.layers.enable(1);
topDownCamera.layers.enable(3);

let cameraMode='fpv';
// Top-down orbital camera pitch (° from horizontal: 90=straight down, 0=horizontal)
// Yaw (° around player Y axis). Target values are eased toward each frame.
let topDownPitch=60,        topDownYaw=-45;
let targetTopDownPitch=60,  targetTopDownYaw=-45;
const TOPDOWN_PRESETS = {
    flat: { pitch:90, yaw:  0 },   // straight down — classic top-down map
    iso:  { pitch:60, yaw:-45 },   // isometric tactical view
    high: { pitch:72, yaw:-30 },   // high three-quarter
    low:  { pitch:35, yaw:-55 }    // dramatic low-orbit
};
let topDownPreset = 'iso';
try {
    const saved = localStorage.getItem('origami.topdownPreset');
    if(saved && TOPDOWN_PRESETS[saved]){
        topDownPreset = saved;
        const p = TOPDOWN_PRESETS[saved];
        topDownPitch = targetTopDownPitch = p.pitch;
        topDownYaw   = targetTopDownYaw   = p.yaw;
    }
} catch(e) {}
// Smooth FPV↔topdown transition driven by modeAlpha (0=FPV, 1=topdown).
let modeAlpha = 0, modeAlphaTarget = 0;
// Top-down orbit radius — sized so a click-swap into top-down mode shows
// ~10 tiles in every direction around the player. At the 'iso' preset
// (pitch 60°), R=45 gives camY ≈ 39 and camD ≈ 22; combined with the
// 50° topdown FOV target below (see line ~13500), the visible floor span
// works out to roughly 20wu = 10 tiles per side. The 'flat' preset
// (straight down, pitch 90°) gives a tighter footprint but the same R.
const TOPDOWN_ORBIT_R = 45;

// Default PIP zoom: 0.4 = wide top-down framing that shows ~5 tiles in every
// direction from the player avatar (camera ≈ 20 wu / 50 ft above floor, FOV
// widens to ~55°). The lower-bound clamp in _pipLoadState below matches this
// so the user can never zoom IN further than the new default by accident.
let _pipZoomScale=0.4, _pipPan={x:0,z:0}, _pipRot={theta:0.5,phi:0.96,radius:17};

// T0.9 — PIP state persistence + cinematic state
// PIP is its own camera (topDownCamera) — main `camera` is never touched by PIP_*
// messages. Persisting (zoom, pan, rot) to localStorage so the player's framing
// preference survives reload. Key bumped to v8.pip.2 so the new default
// "5-tile radius" framing takes effect for anyone who had a stored close-up
// zoom from the v8.pip schema.
const _PIP_SAVE_KEY = 'origami.v8.pip.2';
let _pipCinematicT = 0;            // 0 = default top-down, 1 = fully cinematic angled
let _pipCinematicTarget = null;    // {x, z} of nearest hostile when cinematic active
// ── Reverse-cut state — close-up from behind a monster who just took a spell ──
// When a monster is struck by a spell, the PIP cuts to a close-up behind the
// monster looking back at the player for _PIP_REVERSE_DUR seconds. The cut
// blends in/out via _pipReverseCutT (eased 0 → 1 → 0).
let _pipReverseCutT      = 0;       // 0..1 blend toward reverse-cut camera
let _pipReverseTarget    = null;    // monster wrapper being framed
let _pipReverseStartedAt = 0;       // performance.now() when the cut began
const _PIP_REVERSE_DUR   = 1.5;     // total cut length in seconds
// _pipLastInteractionTime is declared further below (line ~793) alongside _pipRect
function _pipSaveState() {
    try {
        localStorage.setItem(_PIP_SAVE_KEY, JSON.stringify({
            z: _pipZoomScale, px: _pipPan.x, pz: _pipPan.z,
            rt: _pipRot.theta, rp: _pipRot.phi
        }));
    } catch (_) {}
}
function _pipLoadState() {
    try {
        const raw = localStorage.getItem(_PIP_SAVE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (typeof s.z === 'number') _pipZoomScale = Math.max(0.4, Math.min(2.0, s.z));
        if (typeof s.px === 'number') _pipPan.x = s.px;
        if (typeof s.pz === 'number') _pipPan.z = s.pz;
        if (typeof s.rt === 'number') _pipRot.theta = s.rt;
        if (typeof s.rp === 'number') _pipRot.phi = Math.max(0.1, Math.min(Math.PI/2 - 0.05, s.rp));
    } catch (_) {}
}
_pipLoadState();
// Top-down PiP — pure bird's-eye view, no orbit angle.
// Default 8 wu ≈ 20 feet above the player (GRID=2 → 5 ft/tile → 4 tiles).
const PIP_CAM_RADIUS  = 8.0;
const PIP_CAM_PHI     = Math.PI/2; // 90° = straight down, walls never occlude
let _pipRect=null, _pipLastInteractionTime=0;
let _pipTurnCount=0; const PIP_ANGLE_TURNS=7; // kept for compat — no-op in top-down mode

window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.setViewOffset(window.innerWidth,window.innerHeight,0,150,window.innerWidth,window.innerHeight);
    topDownCamera.aspect=window.innerWidth/window.innerHeight;
    topDownCamera.updateProjectionMatrix();
    if(composer){composer.setSize(window.innerWidth,window.innerHeight);}
    if(outlinePass)    outlinePass.setSize(window.innerWidth,window.innerHeight);
    if(monOutlinePass) monOutlinePass.setSize(window.innerWidth,window.innerHeight);
    if(bokehPass && bokehPass.setSize) bokehPass.setSize(window.innerWidth,window.innerHeight);
});

// ── Lights (from Core.js initWebGL) ───────────────────────────────────────────
const hemisphereLight = new THREE.HemisphereLight(0x1a1040,0x0a0a0a,0.3);
scene.add(hemisphereLight);

const dirLight = new THREE.DirectionalLight(0x8899aa,0.12);

dirLight.shadow.camera.near=1; dirLight.shadow.camera.far=1000;
dirLight.shadow.bias=-0.002;

scene.add(dirLight); scene.add(dirLight.target);

const rimLight = new THREE.DirectionalLight(0xff8833,0.06);
rimLight.position.set(-20,40,-30);

const ambientLight = new THREE.AmbientLight(0x110a1a, _baseAmbientIntensity);

// Player headlamp (SpotLight on camera) — dim ambient by default;

headlamp.position.set(0,0,0); headlamp.target.position.set(0,0,-1);
const outerGlow = new THREE.SpotLight(0xffffff,0.0,GRID*20,Math.PI/8,0.2,0.8);
outerGlow.position.set(0,0,0); outerGlow.target.position.set(0,0,-1);

// Magic Lantern state — toggled true on pickup. Drives flashlight cone +
// flicker + dust motes. Tuned to NOT bloom out matte stone/wood walls so
// the scene stays cinematic and creepy.
let magicLanternOn   = false;
let lanternBaseInt   = 3.4;   // headlamp intensity when ON (warm amber)
let lanternOuterInt  = 0.85;  // outer fall-off cone
let lanternNearInt   = 1.6;   // close foreground glow
function activateMagicLantern(){
    if(magicLanternOn) return;
    magicLanternOn = true;
    // Cinematic warm-amber flashlight — tight cone, long throw
    headlamp.color.setHex(0xffd28a);
    headlamp.angle    = Math.PI/9;     // ~20° cone (tight)
    headlamp.penumbra = 0.55;
    headlamp.distance = GRID*16;
    headlamp.decay    = 1.4;            // softer falloff for long throw
    headlamp.intensity= lanternBaseInt;
    // Outer halo — wider, very soft, low intensity (no wall-bounce bloom)
    outerGlow.color.setHex(0xffc070);
    outerGlow.angle   = Math.PI/5.5;
    outerGlow.penumbra= 0.85;
    outerGlow.distance= GRID*22;
    outerGlow.decay   = 1.6;
    outerGlow.intensity = lanternOuterInt;
    // Near-field warm wash — only inches from lens, helps foreground objects
    nearFieldLight.color.setHex(0xffb060);
    nearFieldLight.intensity = lanternNearInt;
    nearFieldLight.distance  = GRID*2.2;
    // Slight tone-down: ambient stays low, walls stay matte (already metalness 0.05)
    // No emissive boost — we want creepy darkness everywhere outside the cone.
    window.parent.postMessage({type:'LOG_EVENT',logType:'system',
        text:'✨ The Magic Lantern flickers to life. Its cone reveals… things.'},'*');
}

// ── Origami Paper Lanterns (replaces torch boxes) ────────────────────────────
// createWashiPaperTexture() extracted to js/v8/map/ProceduralTextures.js (T0.1.C)
const lanternPaperTex = createWashiPaperTexture();
lanternPaperTex.generateMipmaps=false; lanternPaperTex.minFilter=THREE.LinearFilter;

const torchLights=[];
const lanterns=[]; // for sway animation

const lanternCapGeo  = new THREE.CylinderGeometry(0.10,0.16,0.06,12);

// Lanterns drape from the ceiling centre of the first 8 content rooms.
// The Entrance Hallway (Room 1) is deliberately skipped — it should read
// as a "you just walked in from the moonlit night" liminal space, lit by
// the gate beyond rather than any hanging lantern of its own.
rooms.filter((r,i)=>i<9 && !r.isEntranceHall).forEach(r=>{
    const cx=r.cx*GRID, cz=r.cz*GRID;
    // Pivot at ceiling so the whole lantern can sway like a pendulum

    pivot.position.set(cx,WALL_H-0.05,cz);

// ── Procedural Textures ─────────────────────────────────────────────────────────
// All 11 texture functions extracted to js/v8/map/ProceduralTextures.js (T0.1.C).
// createWashiPaperTexture, createDungeonFloorTexture, createDarkWoodRafterTexture,
// createSpiderwebVariant[A-F], createDungeonTopTexture, createShojiTexture,
// createShojiDoorTexture, makePaperTexture — all imported at module top.

// ── Build World Geometry ───────────────────────────────────────────────────────
const worldGroup = new THREE.Group();
const dummy = new THREE.Object3D();

// Textures
const floorTex  = createDungeonFloorTexture(); floorTex.repeat.set(1,1);
const ceilTex   = createDarkWoodRafterTexture(); ceilTex.repeat.set(MAP_W/2,MAP_H/2);
const wallTopTex= createDungeonTopTexture();
// SIX precompiled web textures — classic 3 + 3 fractal-geometry variants.
// Placement code ensures no two adjacent corners or same-wall corners share a variant.
const WEB_TEXTURES = [
    createSpiderwebVariantA(), createSpiderwebVariantB(), createSpiderwebVariantC(),
    createSpiderwebVariantD(), createSpiderwebVariantE(), createSpiderwebVariantF()
];
// Disable mipmaps on all canvas textures — prevents WebGL lazy-init stalls
[floorTex, ceilTex, wallTopTex, ...WEB_TEXTURES].forEach(t=>{
    t.generateMipmaps = false;
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;
});
// Shoji panel + sliding-door textures (precompiled once)
const shojiTex     = createShojiTexture();
const shojiDoorTex = createShojiDoorTexture();
const objTex       = makePaperTexture('#444444');
[shojiTex, shojiDoorTex, objTex].forEach(t=>{
    t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
});

// External wall texture (falls back to procedural top if missing)
const wallTexLoader = new THREE.TextureLoader();
const wallTex = wallTexLoader.load('./assets/textures/Wall.Panel.Basic.1.png',
    t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,1); t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; },
    undefined, ()=>{}
);
// Start door texture — the mossy iron-studded dungeon gate
const startDoorTex = wallTexLoader.load('./assets/textures/start_door.jpg',
    t=>{ t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; },
    undefined, ()=>{}
);

const mats = {
    floor: new THREE.MeshStandardMaterial({map:floorTex,roughness:0.9,metalness:0.1}),
    ceil:  new THREE.MeshStandardMaterial({map:ceilTex,color:0x1a1a1a,roughness:1.0,metalness:0.0}),
    // +5% background luminosity on walls so they read as actual surfaces
    // instead of voids. Slight emissive lift makes them catch ambient light.
    wallTop: new THREE.MeshStandardMaterial({map:wallTopTex,color:0x8a8a82,roughness:0.92,metalness:0.05,emissive:0x141312,emissiveIntensity:0.35}),
    wallSide: new THREE.MeshStandardMaterial({map:wallTex,color:0x989890,roughness:0.92,metalness:0.05,emissive:0x141312,emissiveIntensity:0.35}),
    pipWall: new THREE.MeshStandardMaterial({color:0x111111,transparent:true,opacity:0.15,depthWrite:false}),
    // 3 web materials, one per precompiled texture
    webs: WEB_TEXTURES.map(tex => new THREE.MeshBasicMaterial({
        map:tex, color:0xf0f0eb, transparent:true, opacity:0.85,
        depthWrite:false, side:THREE.DoubleSide
    })),
    // Shoji paper panel — warm cream paper, slight emissive so it appears
    // backlit (like a real lit shoji from inside the room).
    shoji: new THREE.MeshStandardMaterial({
        map: shojiTex, color: 0xfff0d0,
        emissive: 0xffd590, emissiveIntensity: 0.45, emissiveMap: shojiTex,
        roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide
    }),
    shojiDoor: new THREE.MeshStandardMaterial({
        map: shojiDoorTex, color: 0xfff0d0,
        emissive: 0xffd590, emissiveIntensity: 0.55, emissiveMap: shojiDoorTex,
        roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide
    }),
    // Fallback box-monster material — unlit so it doesn't react to torch flicker.
    // Make monsters 20% more transparent (less opaque) for see-through effect.
    monster: new THREE.MeshBasicMaterial({color:0x6df0c8,transparent:true,opacity:0.35,depthWrite:false,side:THREE.DoubleSide,fog:false}),
    stairUp: new THREE.MeshStandardMaterial({color:0x222222,roughness:0.9,metalness:0.1}),
    stairDown: new THREE.MeshStandardMaterial({color:0x3e2723,roughness:0.95,flatShading:true}),
};

// --- Instanced Stone Walls (outer perimeter only) ---
const wallGeo = new THREE.BoxGeometry(GRID,WALL_H,GRID);
const wallMultiMat = [mats.wallSide,mats.wallSide,mats.wallTop,mats.wallSide,mats.wallSide,mats.wallSide];
const pipWallMats  = [mats.pipWall,mats.pipWall,mats.wallTop,mats.pipWall,mats.pipWall,mats.pipWall];

const PADDING=8;
let wallCount=0, shojiCount=0, doorCount=0;
for(let x=-PADDING;x<MAP_W+PADDING;x++) for(let z=-PADDING;z<MAP_H+PADDING;z++){
    const inMap=x>=0&&x<MAP_W&&z>=0&&z<MAP_H;
    if(!inMap||map[x][z].type==='wall') wallCount++;
    else if(inMap && map[x][z].type==='shoji') shojiCount++;
    else if(inMap && map[x][z].type==='shoji_door') doorCount++;
}
const fpvWalls = new THREE.InstancedMesh(wallGeo,wallMultiMat,Math.max(1,wallCount));
fpvWalls.castShadow=false; fpvWalls.receiveShadow=true; fpvWalls.frustumCulled=false; fpvWalls.layers.set(1);
const pipWalls = new THREE.InstancedMesh(wallGeo,pipWallMats,Math.max(1,wallCount));
pipWalls.frustumCulled=false; pipWalls.layers.set(3);

let wi=0;
for(let x=-PADDING;x<MAP_W+PADDING;x++) for(let z=-PADDING;z<MAP_H+PADDING;z++){
    const inMap=x>=0&&x<MAP_W&&z>=0&&z<MAP_H;
    if(!inMap||map[x][z].type==='wall'){
        dummy.position.set(x*GRID,WALL_H/2,z*GRID); dummy.updateMatrix();
        fpvWalls.setMatrixAt(wi,dummy.matrix); pipWalls.setMatrixAt(wi,dummy.matrix); wi++;
    }
}
fpvWalls.count=wi; fpvWalls.instanceMatrix.needsUpdate=true;
pipWalls.count=wi; pipWalls.instanceMatrix.needsUpdate=true;
worldGroup.add(fpvWalls); worldGroup.add(pipWalls);

// --- Instanced Shoji Paper Panels (interior partitions) ---
// Slightly thinner than stone walls so they read as panels, full height
// for floor-to-ceiling authenticity. Oriented per cell so the lattice
// faces the room interior — we use a flat panel mesh, not a box.
const shojiPanelGeo = new THREE.BoxGeometry(GRID*0.95, WALL_H, 0.08);
if(shojiCount > 0){
    const shojiMesh = new THREE.InstancedMesh(shojiPanelGeo, mats.shoji, shojiCount * 2); // 2 orientations max
    shojiMesh.castShadow = false; shojiMesh.receiveShadow = true;
    shojiMesh.frustumCulled = false; shojiMesh.layers.set(1);

    let si = 0;
    for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
        if(map[x][z].type !== 'shoji') continue;
        // Determine orientation: do floors lie N–S (panel runs E–W) or E–W (panel runs N–S)?
        const fN = map[x]?.[z-1]?.type === 'floor';
        const fS = map[x]?.[z+1]?.type === 'floor';
        const fE = map[x+1]?.[z]?.type === 'floor';
        const fW = map[x-1]?.[z]?.type === 'floor';
        // Build up to two crossed panels if it's a corner junction; usually one
        if(fN && fS){
            // Panel runs E–W (faces N+S rooms)
            dummy.position.set(x*GRID, WALL_H/2, z*GRID);
            dummy.rotation.set(0, 0, 0);
            dummy.updateMatrix();
            shojiMesh.setMatrixAt(si++, dummy.matrix);
        }
        if(fE && fW){
            // Panel runs N–S (faces E+W rooms)
            dummy.position.set(x*GRID, WALL_H/2, z*GRID);
            dummy.rotation.set(0, Math.PI/2, 0);
            dummy.updateMatrix();
            shojiMesh.setMatrixAt(si++, dummy.matrix);
            dummy.rotation.set(0, 0, 0); // reset for safety
        }
    }
    shojiMesh.count = si;
    shojiMesh.instanceMatrix.needsUpdate = true;
    worldGroup.add(shojiMesh);
}

// ── Cobwebs (ceiling corners) + Spiderwebs (floor near walls) ──────────────
// Atmospheric decoration. Cobwebs sit at upper inside-corners where two
// walls meet the ceiling. Spiderwebs scatter on the floor near wall edges.
// Density scales with DUNGEON_LEVEL so deeper floors get more webs.
(function buildWebs(){
    if (typeof rooms === 'undefined' || !rooms.length) return;
    const level = (typeof DUNGEON_LEVEL === 'number') ? DUNGEON_LEVEL : 1;
    // Shared material — pale grey-white, semi-transparent, light additive.
    const webMat = new THREE.MeshBasicMaterial({
        color: 0xe6e1d4, transparent: true, opacity: 0.42,
        depthWrite: false, side: THREE.DoubleSide, fog: true,
    });
    const webGroup = new THREE.Group();
    webGroup.layers.set(0);
    webGroup.layers.enable(1);

    // Cobweb mesh: small triangular sheet that hangs from a wall-ceiling
    // corner. Three vertices: corner apex (ceiling), then two anchor points
    // on each adjacent wall about ~0.55u away from the corner + ~0.45u down.
    const _makeCobweb = (apexX, apexY, apexZ, dx, dz) => {
        const REACH = GRID * 0.50;   // how far each anchor sits along the wall
        const DROP  = 0.45;          // how far each anchor hangs below the ceiling
        const g = new THREE.BufferGeometry();
        const verts = new Float32Array([
            // tri 1
            0, 0, 0,
            -dx * REACH, -DROP, 0,
            0, -DROP, -dz * REACH,
            // tri 2 (double-sided handled by material; this gives a hint of depth)
            0, 0, 0,
            0, -DROP, -dz * REACH,
            -dx * REACH * 0.55, -DROP * 0.7, -dz * REACH * 0.55,
        ]);
        g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, webMat);
        m.position.set(apexX, apexY, apexZ);
        return m;
    };

    // Spiderweb mesh: flat ring + a few radial spokes on the floor.
    const spiderGeo = new THREE.RingGeometry(0.04, 0.32, 10);
    const _makeSpiderweb = () => {
        const ring = new THREE.Mesh(spiderGeo, webMat);
        ring.rotation.x = -Math.PI / 2;
        return ring;
    };

    for (const room of rooms){
        if (!room || room.isEntranceHall) continue;

        // ── Ceiling-corner cobwebs ──
        // Check each of the 4 inside corners. A "valid" corner has WALL tiles
        // on both adjacent sides AND the corner diagonal-out is also a wall.
        const corners = [
            { gx: room.x,                gz: room.y,                dx: -1, dz: -1 },
            { gx: room.x + room.w - 1,   gz: room.y,                dx: +1, dz: -1 },
            { gx: room.x,                gz: room.y + room.h - 1,   dx: -1, dz: +1 },
            { gx: room.x + room.w - 1,   gz: room.y + room.h - 1,   dx: +1, dz: +1 },
        ];
        for (const c of corners){
            const wA = map[c.gx + c.dx]?.[c.gz];
            const wB = map[c.gx]?.[c.gz + c.dz];
            if (!wA || wA.type !== 'wall') continue;
            if (!wB || wB.type !== 'wall') continue;
            // Skip occasionally so not every corner has one (cleaner look on low floors)
            if (Math.random() > 0.35 + level * 0.08) continue;
            // Apex of the cobweb = the actual ceiling corner just inside the room
            const apexX = c.gx * GRID + c.dx * (GRID * 0.48);
            const apexZ = c.gz * GRID + c.dz * (GRID * 0.48);
            const cobweb = _makeCobweb(apexX, WALL_H - 0.05, apexZ, c.dx, c.dz);
            webGroup.add(cobweb);
        }

        // ── Floor spiderwebs near walls ──
        // 0..3 per room scaled by level; placed on a random floor tile that
        // touches at least one wall on a cardinal side.
        const webCount = Math.min(3, Math.floor(level * 0.4 + Math.random() * 1.5));
        for (let i = 0; i < webCount; i++){
            for (let tries = 0; tries < 8; tries++){
                const tx = room.x + Math.floor(Math.random() * room.w);
                const tz = room.y + Math.floor(Math.random() * room.h);
                if (map[tx]?.[tz]?.type !== 'floor') continue;
                let touchesWall = false;
                for (const [adx, adz] of [[1,0],[-1,0],[0,1],[0,-1]]){
                    if (map[tx + adx]?.[tz + adz]?.type === 'wall'){ touchesWall = true; break; }
                }
                if (!touchesWall) continue;
                const web = _makeSpiderweb();
                web.position.set(
                    tx * GRID + (Math.random() - 0.5) * 0.55,
                    0.012,
                    tz * GRID + (Math.random() - 0.5) * 0.55,
                );
                web.rotation.z = Math.random() * Math.PI * 2;
                web.scale.setScalar(0.75 + Math.random() * 0.55);
                webGroup.add(web);
                break;
            }
        }
    }

    worldGroup.add(webGroup);
})();

// --- Wooden Doorway FRAMES — lintel + threshold only ---
// Per user request: NO vertical jamb "poles" in the doorway. The walls on
// either side of the cell already provide the visual side-edges; we only
// add a top beam (lintel) and a bottom step (threshold) so the opening
// still reads as a framed passage rather than a hole in nothing.
// Each doorway also spawns a fragile shoji-paper panel that shatters when
// the player walks through it — clear visual breadcrumb of which doors
// you've already pushed through.
const shojiDoorPanels = []; // { cx, cz, mesh, frags?, broken, breakT }
if(doorCount > 0){
    // Dark charcoal wood — same palette as the rafters so all timber reads
    // as one consistent frame system.
    const frameMat = new THREE.MeshStandardMaterial({
        color: 0x14110d, roughness: 0.96, metalness: 0.03,
        emissive: 0x050403, emissiveIntensity: 0.10
    });
    const beamH = 0.22, beamD = 0.20;
    const lintelGeo    = new THREE.BoxGeometry(GRID, beamH, beamD);
    const thresholdGeo = new THREE.BoxGeometry(GRID*0.85, 0.05, beamD*0.7);

    // Cream paper that just shatters when you walk into it.
    const paperMat = new THREE.MeshStandardMaterial({
        map: shojiTex, color: 0xffe8c0,
        emissive: 0xffc888, emissiveIntensity: 0.35, emissiveMap: shojiTex,
        roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide,
        transparent: true, opacity: 0.92,
    });
    const panelW = GRID * 0.78;
    const panelH = WALL_H * 0.86;
    const panelGeo = new THREE.BoxGeometry(panelW, panelH, 0.03);

    for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
        const cell = map[x][z];
        if(cell.type !== 'shoji_door') continue;
        const wallE = map[x+1]?.[z]?.type === 'wall';
        const wallW = map[x-1]?.[z]?.type === 'wall';
        const wx = x*GRID, wz = z*GRID;
        // Door runs N–S when adjacent walls are E/W of it; otherwise E–W.
        const runsNS = (wallE || wallW);

        const lt = new THREE.Mesh(lintelGeo, frameMat);
        if(!runsNS) lt.rotation.y = Math.PI/2;
        lt.position.set(wx, WALL_H - beamH*0.5 - 0.02, wz);
        worldGroup.add(lt);

        const th = new THREE.Mesh(thresholdGeo, frameMat);
        if(!runsNS) th.rotation.y = Math.PI/2;
        th.position.set(wx, 0.025, wz);
        worldGroup.add(th);

        // Panelless doors are pre-broken: open archway, no paper panel.
        // MapGen tags ~32% of doors with panelless:true for visual variety
        // and to vary the LOS/encounter rhythm room-to-room.
        if(cell.panelless){
            // Register as a "broken" panel so LOS + boulder-bust treat it as open
            shojiDoorPanels.push({ cx: x, cz: z, mesh: null, runsNS, broken: true, breakT: 0, frags: null, panelless: true });
            continue;
        }

        // Paper shoji panel filling the opening — gets shattered on first
        // crossing. Orientation matches the wall it's bridging.
        const panel = new THREE.Mesh(panelGeo, paperMat);
        if(!runsNS) panel.rotation.y = Math.PI/2;
        panel.position.set(wx, panelH*0.5 + 0.04, wz);
        panel.castShadow = false; panel.receiveShadow = true;
        panel.frustumCulled = false; panel.layers.set(1);
        worldGroup.add(panel);
        shojiDoorPanels.push({ cx: x, cz: z, mesh: panel, runsNS, broken: false, breakT: 0, frags: null });
    }
}

// ── Shoji door shatter system ─────────────────────────────────────────────
// When the player walks onto a door tile, the paper panel splits into 4
// rotating fragments that fall + fade over ~1.4s. Once broken, the panel
// is gone for good — visual breadcrumb of which doors you've taken.
// _cycloneShatterShoji — CYCLONE spell busts a shoji door open with 8 panel
// fragments that spiral outward in a circle, spin wildly, and fade over 1-3s.
// Unlike normal shattering (gravity-physics scatter), the pieces orbit the
// cyclone's hit point before fading — as if the wind itself pulls them around.
function _cycloneShatterShoji(p, cycloneHitPos){
    if (p.broken) return;
    p.broken = true;
    p.breakT = 0;
    worldGroup.remove(p.mesh);
    p.mesh = null;
    setTimeout(() => {
        if (typeof _reactToDoorBreak === 'function') _reactToDoorBreak(p.cx, p.cz);
    }, 0);

    const fragMat = new THREE.MeshStandardMaterial({
        map: shojiTex, color: 0xffe8c0,
        emissive: 0x88ddcc, emissiveIntensity: 0.7,
        roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide,
        transparent: true, opacity: 0.95,
    });
    const fW = (GRID * 0.78) * 0.4;
    const fH = (WALL_H * 0.86) * 0.4;
    const fragGeo = new THREE.PlaneGeometry(fW, fH);
    p.frags = [];
    const wx = p.cx * GRID, wz = p.cz * GRID;
    const NUM_FRAGS = 8;
    const life = 1.8 + Math.random() * 1.2;  // 1.8–3s
    for (let i = 0; i < NUM_FRAGS; i++){
        const m = new THREE.Mesh(fragGeo, fragMat.clone());
        // Spread frags around the panel
        const offX = (Math.random() - 0.5) * GRID * 0.8;
        const offY = 0.3 + Math.random() * (WALL_H * 0.9);
        const offZ = (Math.random() - 0.5) * GRID * 0.4;
        if (p.runsNS){
            m.position.set(wx + offX, offY, wz + offZ);
        } else {
            m.position.set(wx + offZ, offY, wz + offX);
            m.rotation.y = Math.PI / 2;
        }
        worldGroup.add(m);

        // Angular velocity around the cyclone vertical axis — each fragment
        // orbits at a different radius and angular speed giving a vortex look.
        const baseAng = (i / NUM_FRAGS) * Math.PI * 2;
        const orbR = 0.5 + Math.random() * 1.2;   // orbit radius
        const orbSpd = (Math.random() < 0.5 ? 1 : -1) * (3.5 + Math.random() * 4);
        p.frags.push({
            m,
            // Orbital centre (the hit position, flattened to XZ)
            cx: cycloneHitPos ? cycloneHitPos.x : wx,
            cz: cycloneHitPos ? cycloneHitPos.z : wz,
            orbR, orbSpd,
            ang: baseAng,
            vy: 1.2 + Math.random() * 2.2,      // initial upward kick
            rx: (Math.random() - 0.5) * 12,
            ry: (Math.random() - 0.5) * 12,
            rz: (Math.random() - 0.5) * 10,
            life,
            age: 0,
            cyclone: true,
        });
    }
    _playSpellSound('WIND', 0.7);
    window.parent.postMessage({type:'LOG_EVENT', logType:'system',
        text: (typeof window.tLog === 'function')
            ? window.tLog('cyclone.shatter')
            : '🌪 CYCLONE tears the shoji apart — panels spiral away!'}, '*');
}

function _breakShojiPanel(p){
    if(p.broken) return;
    p.broken = true;
    p.breakT = 0;
    worldGroup.remove(p.mesh);
    p.mesh = null;
    // ── Room-wide reaction ──
    // A bashed door is a loud event. Every monster in either adjacent
    // room turns to face it. If any of them has LOS to the player after
    // turning, the whole room is alerted hostile. Otherwise they all walk
    // toward the broken door to investigate. Deferred via setTimeout so the
    // panel + fragments finish constructing before AI hooks read state.
    setTimeout(() => {
        if (typeof _reactToDoorBreak === 'function') _reactToDoorBreak(p.cx, p.cz);
    }, 0);
    // Spawn 4 fragments (corners). Each has its own velocity + spin.
    const fragMat = new THREE.MeshStandardMaterial({
        map: shojiTex, color: 0xffe8c0,
        emissive: 0xffc888, emissiveIntensity: 0.45, emissiveMap: shojiTex,
        roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide,
        transparent: true, opacity: 0.95,
    });
    const fW = (GRID * 0.78) * 0.5;
    const fH = (WALL_H * 0.86) * 0.5;
    const fragGeo = new THREE.PlaneGeometry(fW, fH);
    p.frags = [];
    const wx = p.cx * GRID, wz = p.cz * GRID;
    for(let i = 0; i < 4; i++){
        const m = new THREE.Mesh(fragGeo, fragMat.clone());
        const offX = (i % 2 === 0) ? -fW*0.5 : fW*0.5;
        const offY = (i < 2) ? fH*0.5 + 0.5 : -fH*0.5 + (WALL_H * 0.86)*0.5;
        // Local then rotated for orientation
        if (p.runsNS) {
            m.position.set(wx + offX, offY + 0.04, wz);
        } else {
            m.position.set(wx, offY + 0.04, wz + offX);
            m.rotation.y = Math.PI/2;
        }
        m.castShadow = false; m.layers.set(1);
        worldGroup.add(m);
        // Outward velocity from centre + random spin
        const dirSign = (i < 2) ? -1 : 1;
        const sideSign = (i % 2 === 0) ? -1 : 1;
        p.frags.push({
            m,
            vx: sideSign * (0.4 + Math.random()*0.3),
            vy: dirSign * (0.6 + Math.random()*0.5) + 0.8,
            vz: (Math.random() - 0.5) * 0.8,
            rx: (Math.random() - 0.5) * 4,
            ry: (Math.random() - 0.5) * 4,
            rz: (Math.random() - 0.5) * 6,
        });
    }
    window.parent.postMessage({type:'LOG_EVENT', logType:'system',
        text:'🪟 Shoji panel shatters as you push through.'}, '*');
}

function _tickShojiDoors(dt){
    // Player tile — break any door we're standing on
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);

    // ── Simple proximity-based auto-open ──
    // Any live monster within DOOR_OPEN_RANGE (≈ 5 ft) latches the door
    // open and resets a 3-second hold timer. The door stays open while the
    // timer is running, then eases shut. Way more reliable than the old
    // facing-based approach detection.
    const nowMs = performance.now();
    const DOOR_OPEN_RANGE    = GRID * 2.5;     // ~5 ft (1 tile=5ft → 2.5 tiles)
    const DOOR_OPEN_RANGE_SQ = DOOR_OPEN_RANGE * DOOR_OPEN_RANGE;
    const DOOR_HOLD_MS       = 3000;           // stay open 3s after last touch

    for(const p of shojiDoorPanels){
        if(!p.broken && p.cx === pgx && p.cz === pgz){
            _breakShojiPanel(p);
        }
        if(p.broken && p.frags){
            p.breakT += dt;
            let anyAlive = false;
            for(const f of p.frags){
                if (f.cyclone){
                    // Cyclone orbital physics: orbit + drift up then gravity
                    f.age += dt;
                    const t = Math.min(1, f.age / f.life);
                    if (t >= 1){ worldGroup.remove(f.m); continue; }
                    anyAlive = true;
                    f.ang += f.orbSpd * dt;
                    // Radius grows then shrinks (spiral out then tighten)
                    const rFade = f.orbR * (1 - t * 0.6);
                    f.m.position.x = f.cx + Math.cos(f.ang) * rFade;
                    f.m.position.z = f.cz + Math.sin(f.ang) * rFade;
                    f.vy -= 3.5 * dt;
                    f.m.position.y += f.vy * dt;
                    f.m.rotation.x += f.rx * dt;
                    f.m.rotation.y += f.ry * dt;
                    f.m.rotation.z += f.rz * dt;
                    const fade = 1 - t * t;
                    f.m.material.opacity = 0.95 * fade;
                    f.m.material.emissiveIntensity = 0.7 * fade;
                } else {
                    // Normal gravity-physics break
                    anyAlive = true;
                    f.m.position.x += f.vx * dt;
                    f.m.position.y += f.vy * dt;
                    f.m.position.z += f.vz * dt;
                    f.vy -= 6.5 * dt;
                    f.m.rotation.x += f.rx * dt;
                    f.m.rotation.y += f.ry * dt;
                    f.m.rotation.z += f.rz * dt;
                    const fade = Math.max(0, 1 - p.breakT / 1.4);
                    f.m.material.opacity = 0.95 * fade;
                    f.m.material.emissiveIntensity = 0.45 * fade;
                }
            }
            // Cull spent normal frags after 1.4s; cyclone frags cull per-fragment above.
            if(!anyAlive || (!p.frags.some(f => !f.cyclone) && p.breakT > 1.4)){
                p.frags = p.frags.filter(f => {
                    if (!f.cyclone && p.breakT > 1.4){ worldGroup.remove(f.m); return false; }
                    return true;
                });
                if (!p.frags.length) p.frags = null;
            }
            continue;
        }

        // ── Monster pass-through: slide panel sideways like a real shoji ──
        // Skip broken (player smashed it) or panelless (no panel mesh).
        if(p.broken || p.panelless || !p.mesh) continue;

        // Cache resting pose (one-time setup).
        if(p.baseX === undefined){
            p.baseX = p.mesh.position.x;
            p.baseY = p.mesh.position.y;
            p.baseZ = p.mesh.position.z;
            // Default slideDir: toward the wall pocket. May be overridden
            // dynamically below when a monster's approach direction is known.
            if (p.runsNS){
                const wallE = map[p.cx + 1]?.[p.cz]?.type === 'wall';
                p.slideDir = wallE ? +1 : -1;
            } else {
                const wallS = map[p.cx]?.[p.cz + 1]?.type === 'wall';
                p.slideDir = wallS ? +1 : -1;
            }
        }
        // ── Proximity check ── any live monster within 5 ft latches the
        // door open and pushes a 3-second hold timer forward.
        const dwx = p.cx * GRID, dwz = p.cz * GRID;
        let nearMon = null;
        for (const w of monsterWrappers){
            if (w.userData.isDead) continue;
            const dx = w.position.x - dwx, dz = w.position.z - dwz;
            if (dx*dx + dz*dz < DOOR_OPEN_RANGE_SQ){
                nearMon = w; break;
            }
        }
        if (nearMon){
            p.openHoldUntil = nowMs + DOOR_HOLD_MS;
            // Slide AWAY from the approaching monster so the corridor clears
            // toward the side they're heading.
            if (p.runsNS){
                const awayDir = (nearMon.position.x < dwx) ? +1 : -1;
                const wallOnAway = map[p.cx + awayDir]?.[p.cz]?.type === 'wall';
                p.slideDir = wallOnAway ? awayDir : -awayDir;
            } else {
                const awayDir = (nearMon.position.z < dwz) ? +1 : -1;
                const wallOnAway = map[p.cx]?.[p.cz + awayDir]?.type === 'wall';
                p.slideDir = wallOnAway ? awayDir : -awayDir;
            }
        }
        const wantOpen = (p.openHoldUntil ?? 0) > nowMs;

        // Open fast (panel snaps aside well before monster arrives) but
        // close slowly (lingers open so the monster clears it cleanly).
        const openSpd  = wantOpen ? dt * 22 : dt * 4;
        const targetT  = wantOpen ? 1.0 : 0.0;
        p.openT = (p.openT ?? 0) + (targetT - (p.openT ?? 0)) * Math.min(1, openSpd);

        // easeOutBack on OPEN — snappy slide with a subtle overshoot bounce.
        // On CLOSE, use ease-in-out so it eases back gently.
        const t = Math.max(0, Math.min(1, p.openT));
        let eased;
        if (wantOpen || p.openT > 0.02){
            const c1 = 1.28, c3 = c1 + 1;
            eased = (t < 0.0001) ? 0
                  : 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        } else {
            // Gentle ease-in on close
            eased = t * t * (3 - 2 * t);
        }

        const slideDist = GRID * 0.88 * p.slideDir;
        if (p.runsNS){
            p.mesh.position.x = p.baseX + slideDist * eased;
            p.mesh.position.z = p.baseZ;
        } else {
            p.mesh.position.x = p.baseX;
            p.mesh.position.z = p.baseZ + slideDist * eased;
        }
        // Vertical bob on the open stroke (paper track character).
        p.mesh.position.y = p.baseY + Math.sin(t * Math.PI) * 0.055;
        // Tilt into the slide axis — more pronounced than before.
        if (p.runsNS) p.mesh.rotation.z =  0.09 * t * p.slideDir;
        else          p.mesh.rotation.x = -0.09 * t * p.slideDir;
    }
}
