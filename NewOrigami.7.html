<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewOrigami 7 - The Living Engine</title>
    
    <style>
      :root {
        --bg-body: #000000;
        --surface-color: #1a1a1d;
        --shadow-dark: rgba(0, 0, 0, 0.9);
        --shadow-light: rgba(255, 255, 255, 0.05);
        --edge: rgba(255, 255, 255, 0.15);
      }

      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--bg-body);
        font-family: "Inter", sans-serif;
        color: #ffffff;
      }

      /* Main Application Wrapper */
      #main-container {
        position: relative;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* FPV Background (Fullscreen) */
      #fpv-viewport {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: auto;
        transform: translateZ(0);
        will-change: transform;
      }
      #fpv-viewport iframe {
        width: 100%;
        height: 100%;
        border: none;
      }


      /* Bottom Control Panel - Full height so encounter-zone top:50% = true screen center */
      #adventure-panel {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 30;
        display: block;
        pointer-events: none;
        background: transparent !important;
        transform: translateZ(0);
        will-change: transform;
      }
      #adventure-panel iframe {
        pointer-events: auto;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent !important;
      }

      #ai-engine {
         display: none;
      }

      /* Death Modal Styling */
      #death-modal {
        display: none; position: absolute; inset: 0; 
        background: radial-gradient(circle, rgba(50,0,0,0.85) 0%, rgba(0,0,0,0.98) 100%); 
        z-index: 9999; flex-direction: column; align-items: center; justify-content: center; 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        transition: opacity 1.5s ease;
      }
      #death-modal.visible {
        display: flex;
        opacity: 1;
      }
      .death-title {
        color: #ff1a1a; font-size: 6rem; letter-spacing: 15px; margin-bottom: 40px; 
        text-shadow: 0 0 40px rgba(255,0,0,0.8); font-weight: 900;
        font-family: "Cinzel", serif;
      }
      .death-btn {
        padding: 15px 50px; font-size: 1.2rem; background: rgba(255,0,0,0.1); 
        color: white; border: 1px solid rgba(255,0,0,0.5); cursor: pointer; 
        text-transform: uppercase; letter-spacing: 4px; transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255,0,0,0.2);
      }
      .death-btn:hover {
        background: rgba(255,0,0,0.3); border-color: #ff3333; box-shadow: 0 0 25px rgba(255,0,0,0.6);
      }
    </style>
  </head>
  <body class="dark-mode">

    <div id="main-container">
      
      <!-- FPV Background (Fullscreen) -->
      <div id="fpv-viewport">
        <iframe id="fpv-iframe" title="FPV View Engine" src="NewOrigami.FPV.2.html?v=2" allow="autoplay; fullscreen"></iframe>
      </div>

      <div id="adventure-panel">
        <iframe id="panels-iframe" title="Action Panels" src="NewOrigami.Panels.html?mode=dock&v=2"></iframe>
      </div>

      <!-- AI Brain Engine -->
      <script src="NewOrigami.OniBaba.js"></script>

      <!-- Death Modal Overlay -->
      <div id="death-modal">
        <h1 class="death-title">YOU DIED</h1>
        <button class="death-btn" id="restart-btn">Restart</button>
      </div>

    </div>

    <script>
      (function() {
         document.addEventListener("DOMContentLoaded", () => {
            const engines = {
               fpv: document.getElementById('fpv-iframe'),
               panels: document.getElementById('panels-iframe'),
               ai: document.getElementById('ai-iframe')
            };
            let cachedInitEntities = null;

            document.getElementById('restart-btn').addEventListener('click', () => {
                window.location.reload();
            });

            function notifyEngine(engineKey, payload) {
               const frame = engines[engineKey];
               if (frame && frame.contentWindow) {
                  frame.contentWindow.postMessage(payload, '*');
               }
            }

            function broadcastKey(type, payload) {
               const msg = { type, ...payload };
               notifyEngine('fpv', msg);
            }

            document.addEventListener('keydown', (e) => {
               if (e.repeat) return;
               if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
               broadcastKey('KEY_DOWN', { key: e.key, code: e.code });
            });

            document.addEventListener('keyup', (e) => {
               if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
               broadcastKey('KEY_UP', { key: e.key, code: e.code });
            });

            window.addEventListener('message', (e) => {
               if (!e.data || !e.data.type) return;

               // --- DEATH INTERCEPT ---
               if (e.data.type === 'SYNC_STATS' && e.data.hp !== undefined && e.data.hp <= 0) {
                   const deathModal = document.getElementById('death-modal');
                   deathModal.classList.add('visible');
                   // Still forward to panels so UI updates
               }

               // --- MUTATION BUS INTERCEPT ---
               // The Dragon Princess watches all events passing through the Master Launcher.
               let evData = e.data;
               if (window.goddessAI && typeof window.goddessAI.mutateEvent === 'function') {
                   evData = window.goddessAI.mutateEvent(evData) || evData;
               }

               // Drop event if the mutation decided to cancel it entirely
               if (evData.type === 'EVENT_CANCELLED') return;

               switch (evData.type) {
                  case 'MAP_ENGINE_READY':
                     if (cachedInitEntities) notifyEngine('fpv', cachedInitEntities);
                     break;

                  case 'PLAYER_MOVE':
                     notifyEngine('ai', evData); // Forward movement to AI brain
                     break;

                  case 'PLAYER_ATTACK':
                     notifyEngine('ai', evData); // Forward attack triggers to AI brain
                     break;

                  case 'COMBAT_ATTACK':
                  case 'SYNC_ENTITIES': 
                     if (evData.type === 'COMBAT_ATTACK') {
                         notifyEngine('panels', evData);
                     }
                     break;

                  case 'PLAYER_MOVE_STATE':
                  case 'PLAYER_ROT_REALTIME':
                  case 'LCD_EVENT':
                  case 'LOG_EVENT':
                  case 'SYNC_STATS':
                  case 'UPDATE_LOOT_CARDS':
                  case 'ADD_CARD':
                     notifyEngine('panels', evData);
                     break;

                  case 'SHOW_COMBAT':
                     notifyEngine('panels', evData); // Unified UI
                     break;

                  case 'HIDE_COMBAT':
                  case 'HIDE_ALL':
                     notifyEngine('panels', evData); // Unified UI
                     break;

                  case 'INIT_ENTITIES':
                     cachedInitEntities = evData;
                     notifyEngine('fpv', evData);
                     notifyEngine('ai', evData); // Seed AI brain with dungeon map
                     break;

                  case 'AI_UPDATES':
                  case 'AI_DEATH':
                  case 'COMBAT_UPDATE':
                  case 'REALITY_SHIFT': // Pass global reality mutations down to FPV
                     notifyEngine('fpv', evData); 
                     break;

                  case 'KEY_DOWN':
                  case 'KEY_UP':
                     broadcastKey(evData.type, evData);
                     break;

                  case 'EXPLORE_ROOM':
                  case 'SEARCH_ADJACENT':
                  case 'AUTO_EXPLORE':
                  case 'APPROACH_MONSTER':
                  case 'TEXT_COMMAND':
                  case 'FPV_ACTION':
                  case 'EQUIP_CARD':
                  case 'CHAT_SUBMIT':
                  case 'WAGER':
                  case 'PARLEY':
                  case 'ATTACK':
                  case 'RETREAT':
                  case 'PIP_ZOOM':
                  case 'PIP_TOGGLE':
                  case 'PIP_ROTATE':
                  case 'PIP_PAN':
                  case 'PIP_CLICK':
                  case 'PIP_SYNC_RECT':
                  case 'TOGGLE_AUTOPICKUP':
                     notifyEngine('fpv', evData);
                     break;
               }
            });
         });
      })();
    </script>
  </body>
</html>
