<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Origami Engine v8</title>
  <!-- Three.js r128 — proven CDN, matches FPV.2 exactly -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Post-Processing Pipeline (ported from FPV.2) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/OutlinePass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family: sans-serif; }

    /* Loading Screen */
    #loading-screen {
      position:absolute; top:0; left:0; width:100%; height:100%;
      background:#0b0b0e; z-index:9999; display:flex; flex-direction:column;
      align-items:center; justify-content:center; transition:opacity 0.4s ease-out;
    }
    .loader-content { text-align:center; color:#00ffff; font-family:monospace; letter-spacing:0.2rem; }
    .loader-content h2 { font-weight:800; margin-bottom:2rem; font-size:1.5rem; text-transform:uppercase; }
    .progress-box { width:350px; height:6px; background:rgba(0,255,255,0.1); border:1px solid rgba(0,255,255,0.2); border-radius:3px; overflow:hidden; margin:0 auto; }
    #loading-bar-fill { width:0%; height:100%; background:linear-gradient(90deg,#0088ff,#00ffff); transition:width 0.1s ease-out; }
    #loading-text { margin-top:1rem; font-size:0.9rem; font-weight:600; font-family:monospace; }
    #loading-file { margin-top:0.5rem; font-size:0.65rem; color:rgba(0,255,255,0.6); font-family:monospace; }

    /* PIP cinematic frame — wraps the two canvases (2D map + WebGL FPV cam) */
    #pip-frame {
      position:fixed; top:0; left:0;
      width:160px; height:160px;
      z-index:98; border-radius:50%;
      cursor:pointer;
      transition:transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow:
        0 0 0 2px rgba(124,224,184,0.25),
        0 8px 28px rgba(0,0,0,0.7),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      overflow:hidden;
    }
    #pip-frame:hover {
      transform:scale(1.06);
      box-shadow:
        0 0 0 2px rgba(124,224,184,0.6),
        0 12px 36px rgba(0,0,0,0.8),
        0 0 28px rgba(124,224,184,0.45);
    }
    /* Both canvases stack and fill the frame; opacity-crossfaded by JS. */
    #pip-frame canvas {
      position:absolute; inset:0;
      width:100%; height:100%;
      border-radius:50%;
      transition:opacity 0.32s ease;
    }
    /* Cinematic overlays */
    .pip-overlay {
      position:absolute; inset:0; pointer-events:none;
      border-radius:50%; overflow:hidden;
    }
    /* Scanlines + soft lens vignette */
    .pip-overlay::before {
      content:''; position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%),
        repeating-linear-gradient(0deg,
          rgba(0,0,0,0)   0px,
          rgba(0,0,0,0)   2px,
          rgba(0,0,0,0.10) 3px);
      mix-blend-mode:multiply;
    }
    /* Glass shimmer highlight (top-left lens reflection) */
    .pip-overlay::after {
      content:''; position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(ellipse 38% 22% at 28% 22%,
        rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 70%);
    }
    /* REC dot (pulsing red) */
    .pip-rec {
      position:absolute; top:10%; right:14%;
      display:flex; align-items:center; gap:4px;
      font:700 8px/1 'SF Mono','Inter',monospace;
      color:rgba(255,82,82,0.95);
      letter-spacing:1.3px;
      text-shadow:0 0 6px rgba(255,82,82,0.65);
      pointer-events:none;
    }
    .pip-rec-dot {
      width:6px; height:6px; border-radius:50%;
      background:#ff5252;
      box-shadow:0 0 6px rgba(255,82,82,0.9), 0 0 12px rgba(255,82,82,0.5);
      animation:pipRecPulse 1.4s ease-in-out infinite;
    }
    @keyframes pipRecPulse {
      0%,100% { opacity:1;   transform:scale(1); }
      50%     { opacity:0.35; transform:scale(0.85); }
    }
    /* Cinematic top/bottom bars (only show in FPV-cam mode via .cam-mode) */
    .pip-cinebar {
      position:absolute; left:0; right:0; height:11%;
      background:linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.55));
      opacity:0; transition:opacity 0.4s ease;
      pointer-events:none;
    }
    .pip-cinebar.top    { top:0; }
    .pip-cinebar.bottom { bottom:0; transform:scaleY(-1); }
    #pip-frame.cam-mode .pip-cinebar { opacity:1; }
    /* Center reticle crosshair (faint) */
    .pip-reticle {
      position:absolute; top:50%; left:50%;
      width:18px; height:18px; transform:translate(-50%,-50%);
      pointer-events:none; opacity:0.55;
    }
    .pip-reticle::before, .pip-reticle::after {
      content:''; position:absolute; background:rgba(255,255,255,0.7);
      box-shadow:0 0 4px rgba(255,255,255,0.4);
    }
    .pip-reticle::before { left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%); }
    .pip-reticle::after  { top:50%; left:0; right:0; height:1px; transform:translateY(-50%); }
    /* Hide reticle in 2D-map mode (only show on cam) */
    #pip-frame:not(.cam-mode) .pip-reticle { opacity:0; }
    /* Frame-edge micro chromatic aberration */
    #pip-frame::after {
      content:''; position:absolute; inset:0; border-radius:50%;
      box-shadow:
        inset 0 0 0 1px rgba(124,224,184,0.18),
        inset 0 0 22px rgba(0,0,0,0.55);
      pointer-events:none;
    }

    /* Legacy id kept for compatibility but de-styled (real styling on #pip-frame now) */
    #pip-canvas {
      position:absolute;
      width:100%; height:100%;
      border-radius:50%;
      pointer-events:auto; cursor:pointer; overflow:hidden; display:none;
      transition:transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow:0 0 0 2px rgba(124,224,184,0.25), 0 8px 24px rgba(0,0,0,0.55);
    }

    /* Fullscreen Map Modal — opens on PIP click */
    #fs-map-overlay {
      position:fixed; inset:0; z-index:9999; display:none;
      background:radial-gradient(ellipse at center, rgba(20,18,14,0.95) 0%, rgba(8,6,4,0.98) 100%);
      backdrop-filter:blur(8px);
      align-items:center; justify-content:center;
      flex-direction:column; gap:18px;
    }
    #fs-map-overlay.open { display:flex; }
    #fs-map-canvas {
      width:min(86vmin,860px); height:min(86vmin,860px);
      border-radius:24px;
      background:#1a1d22;
      box-shadow:
        0 30px 90px rgba(0,0,0,0.85),
        0 0 0 1px rgba(124,224,184,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    #fs-map-title {
      font-family:'Inter','Segoe UI',sans-serif;
      letter-spacing:6px; font-weight:700; font-size:11px;
      color:#7ce0b8; text-transform:uppercase;
      text-shadow:0 0 14px rgba(124,224,184,0.5);
    }
    #fs-map-hint {
      font-family:'SF Mono',monospace; font-size:10px; color:#5c6470;
      letter-spacing:2px;
    }
    #fs-map-close {
      position:absolute; top:24px; right:28px;
      width:46px; height:46px; border-radius:50%;
      background:#1a1d22; border:none; cursor:pointer;
      color:#a8b0bb; font-size:20px; font-weight:700;
      box-shadow:6px 6px 14px rgba(0,0,0,0.6),-4px -4px 12px rgba(255,255,255,0.025);
      transition:transform 0.12s ease;
    }
    #fs-map-close:hover { transform:scale(1.08); color:#ff6b7a; }
    #fs-map-close:active { box-shadow:inset 3px 3px 6px rgba(0,0,0,0.6),inset -2px -2px 4px rgba(255,255,255,0.03); }

    /* Floating Combat Text */
    #fct-container {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:5000; overflow:hidden;
    }
    .combat-dmg-text {
      position:absolute;
      font-family:'Impact','Arial Black',sans-serif; font-weight:900;
      pointer-events:none;
      text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,3px 3px 5px rgba(0,0,0,0.8);
      animation:dmgFloat 1.2s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
      opacity:1;
    }
    @keyframes dmgFloat {
      0%   { transform:translate(-50%,-20%) scale(0.1) rotate(-10deg); opacity:0; }
      15%  { transform:translate(-50%,-80%) scale(1.4) rotate(5deg); opacity:1; }
      30%  { transform:translate(-50%,-50%) scale(1.0) rotate(0deg); opacity:1; }
      70%  { transform:translate(-50%,-70%) scale(1.0); opacity:1; }
      100% { transform:translate(-50%,-120%) scale(1.2); opacity:0; }
    }

    /* Goblin Slash Hit Overlay */
    #slash-overlay {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:4999; overflow:hidden;
    }
    /* ── Melee VFX overlays ────────────────────────────────────── */
    .slash-mark {
      position:absolute; top:50%; left:50%; width:5px; border-radius:2px;
      background:linear-gradient(180deg,#ffffff 0%,#ff2200 40%,rgba(180,0,0,0) 100%);
      box-shadow:0 0 14px 4px rgba(255,60,0,0.7),0 0 4px rgba(255,255,255,0.6);
      transform-origin:top center;
      animation:slashDrop 0.42s cubic-bezier(0.18,0.89,0.32,1.1) forwards;
    }
    @keyframes slashDrop {
      0%   { opacity:0; transform:translate(-50%,-50%) scaleY(0) rotate(var(--r)); }
      12%  { opacity:1; transform:translate(-50%,-50%) scaleY(1) rotate(var(--r)); }
      55%  { opacity:0.85; }
      100% { opacity:0; transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scaleY(1.15) rotate(var(--r)); }
    }
    /* Thrust needle — single fast forward spike */
    .thrust-mark {
      position:absolute; top:50%; left:50%; width:3px; border-radius:2px;
      background:linear-gradient(180deg,rgba(180,220,255,0) 0%,#88ccff 30%,#ffffff 55%,rgba(120,180,255,0) 100%);
      box-shadow:0 0 18px 6px rgba(100,180,255,0.8);
      transform-origin:center center;
      animation:thrustShot 0.3s ease-out forwards;
    }
    @keyframes thrustShot {
      0%   { opacity:0; height:20px; transform:translate(-50%,-50%) rotate(var(--r)) scaleY(0.2); }
      10%  { opacity:1; }
      70%  { opacity:0.9; height:var(--h); transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--r)) scaleY(1); }
      100% { opacity:0; }
    }
    /* Heavy arc — thick sweeping blades */
    .heavy-mark {
      position:absolute; top:50%; left:50%; width:10px; border-radius:5px;
      background:linear-gradient(180deg,#fffde0 0%,#ffcc00 35%,#ff6600 70%,rgba(200,80,0,0) 100%);
      box-shadow:0 0 22px 8px rgba(255,180,0,0.75),0 0 6px rgba(255,255,200,0.8);
      transform-origin:top center;
      animation:heavyDrop 0.55s cubic-bezier(0.12,0.85,0.25,1.1) forwards;
    }
    @keyframes heavyDrop {
      0%   { opacity:0; transform:translate(-50%,-50%) scaleY(0) rotate(var(--r)); }
      10%  { opacity:1; transform:translate(-50%,-50%) scaleY(1) rotate(var(--r)); }
      100% { opacity:0; transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scaleY(1.2) rotate(var(--r)); }
    }
    /* Shield disc glow */
    .shield-overlay {
      position:absolute; top:50%; left:50%; width:340px; height:340px;
      border-radius:50%; pointer-events:none;
      transform:translate(-50%,-50%);
      background:radial-gradient(ellipse at center,rgba(80,140,255,0.22) 0%,rgba(40,80,220,0.12) 55%,transparent 75%);
      border:2px solid rgba(120,180,255,0.55);
      box-shadow:0 0 40px 12px rgba(80,140,255,0.35), inset 0 0 30px rgba(120,180,255,0.2);
      animation:shieldPulse 0.45s ease-out forwards;
      z-index:4990;
    }
    @keyframes shieldPulse {
      0%   { opacity:0; transform:translate(-50%,-50%) scale(0.5); }
      25%  { opacity:1; transform:translate(-50%,-50%) scale(1.05); }
      60%  { opacity:0.9; transform:translate(-50%,-50%) scale(1.0); }
      100% { opacity:0.7; }
    }
    .shield-overlay.fading { animation:shieldFade 0.3s ease-in forwards; }
    @keyframes shieldFade { to { opacity:0; transform:translate(-50%,-50%) scale(1.15); } }

    /* Blood vignette */
    #blood-vignette {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:4998; opacity:0; transition:opacity 0.08s ease-out;
      background:radial-gradient(ellipse at center,transparent 50%,rgba(200,0,0,0.55) 100%);
    }
    #blood-vignette.active { opacity:1; }

    /* Interaction prompt */
    #interaction-prompt {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.8); color:white; padding:15px 30px; border-radius:8px;
      border:1px solid #ffd700; font-weight:bold; font-size:1.2rem;
      z-index:80; display:none; pointer-events:none;
    }

    /* Moon phase label — ethereal glow */
    #moonphase-label {
      position:absolute; top:46px; left:50%; transform:translateX(-50%);
      color:#e8f6ff; font-family:monospace; font-size:0.78rem; font-weight:700;
      letter-spacing:1.4px; z-index:90; pointer-events:none;
      text-shadow:
        0 0 4px  rgba(220,240,255,0.95),
        0 0 10px rgba(170,210,255,0.85),
        0 0 22px rgba(120,180,255,0.65),
        0 0 36px rgba(80,140,255,0.45);
      animation: moonpulse 4.2s ease-in-out infinite;
    }
    /* Kanji moonphase — magical green-cyan bloom */
    #moonphase-kanji {
      position:absolute; top:66px; left:50%; transform:translateX(-50%);
      color:#dffff0; font-family:'Noto Serif JP', 'Hiragino Mincho ProN', serif;
      font-size:1.15rem; font-weight:800;
      letter-spacing:3px; z-index:90; pointer-events:none;
      text-shadow:
        0 0 5px  rgba(210,255,235,0.95),
        0 0 14px rgba(120,255,200,0.85),
        0 0 26px rgba(80,230,180,0.6),
        0 0 44px rgba(60,200,160,0.4);
      animation: kanjipulse 5.6s ease-in-out infinite;
    }
    @keyframes moonpulse {
      0%,100% { text-shadow:
        0 0 4px  rgba(220,240,255,0.95),
        0 0 10px rgba(170,210,255,0.85),
        0 0 22px rgba(120,180,255,0.6),
        0 0 36px rgba(80,140,255,0.4); }
      50%     { text-shadow:
        0 0 6px  rgba(235,250,255,1.0),
        0 0 16px rgba(190,225,255,0.95),
        0 0 32px rgba(140,200,255,0.8),
        0 0 52px rgba(100,170,255,0.6); }
    }
    @keyframes kanjipulse {
      0%,100% { text-shadow:
        0 0 5px  rgba(210,255,235,0.9),
        0 0 14px rgba(120,255,200,0.8),
        0 0 26px rgba(80,230,180,0.55),
        0 0 44px rgba(60,200,160,0.35); }
      50%     { text-shadow:
        0 0 7px  rgba(225,255,245,1.0),
        0 0 20px rgba(150,255,215,0.95),
        0 0 38px rgba(110,245,195,0.75),
        0 0 60px rgba(80,220,175,0.55); }
    }

    /* Perf HUD — dark neumorphic */
    #perf-hud {
      position:fixed; top:14px; right:14px; z-index:99; pointer-events:none;
      width:200px;
      background:#1a1d22;
      border:none; border-radius:18px; padding:14px 16px 12px;
      box-shadow:
        9px 9px 22px rgba(0,0,0,0.65),
        -6px -6px 18px rgba(255,255,255,0.025),
        inset 1px 1px 1px rgba(255,255,255,0.04),
        inset -1px -1px 1px rgba(0,0,0,0.5);
      font-family:'Inter','SF Pro Display','Segoe UI',sans-serif;
      color:#a8b0bb;
    }
    #perf-hud .hud-title {
      font-size:9px; letter-spacing:3px; font-weight:700;
      color:#5c6470; text-transform:uppercase;
      margin-bottom:11px; padding-bottom:9px;
      text-align:center;
      text-shadow:0 1px 0 rgba(0,0,0,0.6);
      border-bottom:1px solid rgba(0,0,0,0.35);
      box-shadow:0 1px 0 rgba(255,255,255,0.025);
    }
    #perf-hud .hud-row {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:7px;
      padding:5px 9px;
      background:#1a1d22;
      border-radius:9px;
      box-shadow:
        inset 3px 3px 6px rgba(0,0,0,0.55),
        inset -2px -2px 5px rgba(255,255,255,0.025);
    }
    #perf-hud .hud-row:last-of-type { margin-bottom:9px; }
    #perf-hud .hud-label {
      font-size:8.5px; letter-spacing:1.5px; font-weight:600;
      color:#5c6470; text-transform:uppercase;
      text-shadow:0 1px 0 rgba(0,0,0,0.5);
    }
    #perf-hud .hud-val {
      font-family:'SF Mono','Menlo',monospace;
      font-size:15px; font-weight:700;
      color:#7ce0b8;
      line-height:1;
      text-shadow:0 0 10px rgba(124,224,184,0.35),0 1px 0 rgba(0,0,0,0.55);
      transition:color 0.25s ease,text-shadow 0.25s ease;
    }
    #perf-hud .hud-val.warn {
      color:#f0c060;
      text-shadow:0 0 10px rgba(240,192,96,0.4),0 1px 0 rgba(0,0,0,0.55);
    }
    #perf-hud .hud-val.crit {
      color:#ff6b7a;
      text-shadow:0 0 12px rgba(255,107,122,0.5),0 1px 0 rgba(0,0,0,0.55);
    }
    #perf-hud .hud-unit {
      font-size:8.5px; color:#4a5260;
      margin-left:3px; font-weight:600;
      text-shadow:0 1px 0 rgba(0,0,0,0.5);
    }
    #perf-hud .bar-track {
      width:100%; height:6px;
      background:#1a1d22;
      border-radius:6px; overflow:hidden;
      box-shadow:
        inset 2px 2px 4px rgba(0,0,0,0.7),
        inset -1px -1px 2px rgba(255,255,255,0.03);
    }
    #perf-hud .bar-fill {
      height:100%; border-radius:6px;
      background:linear-gradient(90deg,#7ce0b8,#5ab8e0);
      box-shadow:0 0 8px rgba(124,224,184,0.45);
      transition:width 0.3s ease,background 0.3s ease,box-shadow 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <h2>INITIALIZING WORLD ENGINE...</h2>
      <div class="progress-box"><div id="loading-bar-fill"></div></div>
      <div id="loading-text">0%</div>
      <div id="loading-file">Connecting to databanks...</div>
    </div>
  </div>

  <!-- VFX Layers -->
  <div id="fct-container"></div>
  <div id="slash-overlay"></div>
  <div id="blood-vignette"></div>
  <div id="interaction-prompt">Press E to Interact</div>
  <div id="moonphase-label">NEW MOON</div>
  <div id="moonphase-kanji">新月</div>

  <!-- PIP cinematic cam frame: 2D map (FPV mode) + live FPV WebGL (topdown mode) -->
  <div id="pip-frame">
    <canvas id="pip-canvas"     width="320" height="320"></canvas>
    <canvas id="pip-fpv-canvas" width="320" height="320" style="opacity:0"></canvas>
    <div class="pip-overlay">
      <div class="pip-cinebar top"></div>
      <div class="pip-cinebar bottom"></div>
      <div class="pip-reticle"></div>
      <div class="pip-rec"><span class="pip-rec-dot"></span>REC</div>
    </div>
  </div>

  <!-- Fullscreen Top-Down Map Modal -->
  <div id="fs-map-overlay">
    <div id="fs-map-title">CASTLE — TOP DOWN</div>
    <canvas id="fs-map-canvas" width="1024" height="1024"></canvas>
    <div id="fs-map-hint">CLICK MINIMAP OR PRESS M / ESC TO CLOSE</div>
    <button id="fs-map-close" aria-label="Close map">×</button>
  </div>

  <!-- Perf HUD -->
  <div id="perf-hud">
    <div class="hud-title">⬡ Engine v8 · Perf</div>
    <div class="hud-row"><span class="hud-label">Realtime</span><span><span class="hud-val" id="hud-rt">--</span><span class="hud-unit">fps</span></span></div>
    <div class="hud-row"><span class="hud-label">Projected</span><span><span class="hud-val" id="hud-proj">--</span><span class="hud-unit">fps</span></span></div>
    <div class="hud-row"><span class="hud-label">Budget</span><span><span class="hud-val" id="hud-pct">--</span><span class="hud-unit">%</span></span></div>
    <div class="bar-track"><div class="bar-fill" id="hud-bar" style="width:0%"></div></div>
  </div>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// NewOrigami Engine v8 — Full Legacy Port
// Ported from: js/engine/Core.js, WorldGen.js, Entities.js, Combat.js
//              NewOrigami.FPV.2.html
// ═══════════════════════════════════════════════════════════════════════════════

// ── Constants ─────────────────────────────────────────────────────────────────
const MAP_W = 128, MAP_H = 128, GRID = 2;
const WALL_H = GRID * 1.85;
// Realistic 6-foot tall samurai. Brisk walk ≈ 2.4 m/s (between casual and jog).
const EYE_HEIGHT = 1.83;            // 6 ft camera height
const MOVE_SPD   = 2.4;             // m/s — brisk walk
const AUTO_SPD   = 2.7;             // slightly faster while autowalking
const ROT_SPD    = 2.4;             // rad/s
const BOB_AMP    = 0.075;           // heel strike — felt in the camera
const SWAY_AMP   = 0.035;           // hip sway side-to-side
const STEP_HZ    = 1.85;            // footsteps per second
const AUTO_WALK_HOLD_MS = 2000;     // 2s hold → engage auto-walk

// ── Procedural Dungeon Generator ─────────────────────────────────────────────
// 7 dungeon levels × 12-18 rooms each. No doors — rooms connect via open
// 2-tile-wide corridor gaps. Level 7 has a large locked OniBaba sanctum.
let DUNGEON_LEVEL = 1; // mutable — changes on stair descent

function generateDungeonMap(level = 1) {
    level = Math.max(1, Math.min(7, level));
    const map = Array.from({length:MAP_W}, ()=>Array.from({length:MAP_H}, ()=>({type:'wall'})));
    const rooms = [];
    const BORDER = 3;  // keep rooms away from map edge
    const MIN_R = 5, MAX_R = 10; // room dimensions
    const ONIBABA_ROOM_SIZE = 18; // boss sanctum
    const targetRooms = 12 + Math.floor(Math.random() * 7); // 12-18

    // ── Carve a rectangular room and register it ──────────────────────────────
    const carveRoom = (id, x0, z0, w, h, opts={}) => {
        for(let x=x0; x<x0+w; x++) for(let z=z0; z<z0+h; z++)
            map[x][z] = {type:'floor', room:true, roomId:id, ...opts};
        const cx = Math.floor(x0+w/2), cz = Math.floor(z0+h/2);
        rooms.push({id, x:x0, y:z0, w, h, cx, cz, center:{x:cx, y:cz}, ...opts});
    };

    // ── Carve a 2-wide open corridor between two points (no doors) ───────────
    const carveCorridor = (ax, az, bx, bz, roomIdA, roomIdB) => {
        let x=ax, z=az;
        // L-shaped: horizontal first, then vertical — always reaches destination
        const hEnd = bx;
        const vEnd = bz;
        while(x !== hEnd){
            const step = x < hEnd ? 1 : -1;
            if(map[x]?.[z]?.type === 'wall')   map[x][z]   = {type:'floor', hall:true, roomId: roomIdA ?? -1};
            if(map[x]?.[z+1]?.type === 'wall') map[x][z+1] = {type:'floor', hall:true, roomId: roomIdA ?? -1};
            x += step;
        }
        while(z !== vEnd){
            const step = z < vEnd ? 1 : -1;
            if(map[x]?.[z]?.type === 'wall')   map[x][z]   = {type:'floor', hall:true, roomId: roomIdB ?? -1};
            if(map[x+1]?.[z]?.type === 'wall') map[x+1][z] = {type:'floor', hall:true, roomId: roomIdB ?? -1};
            z += step;
        }
    };

    // ── Overlap check with buffer ─────────────────────────────────────────────
    const overlaps = (x0, z0, w, h, buf=2) => {
        if(x0-buf < BORDER || z0-buf < BORDER) return true;
        if(x0+w+buf >= MAP_W-BORDER || z0+h+buf >= MAP_H-BORDER) return true;
        for(const r of rooms){
            if(x0-buf < r.x+r.w && x0+w+buf > r.x &&
               z0-buf < r.y+r.h && z0+h+buf > r.y) return true;
        }
        return false;
    };

    // ── Japanese room name pool per level ────────────────────────────────────
    const ROOM_POOLS = [
        /* L1 */ ['入口の間','武具蔵','板の間','土間','長屋','番所','厩','倉庫','水の間','火の間'],
        /* L2 */ ['地下廊下','石牢','水責め部屋','拷問部屋','隠し部屋','番兵詰所','武器庫','兵糧庫','火薬庫','地下道'],
        /* L3 */ ['呪いの間','骸骨の部屋','腐敗の廊下','古戦場','血の祭壇','暗黒の庭','亡者の館','闇の蔵','冥界の扉','怨霊の間'],
        /* L4 */ ['炎の間','溶岩の廊下','鬼の洞窟','業火の部屋','赤鬼の間','閻魔の庭','地獄谷','焦熱地獄','火の柱','灼熱の間'],
        /* L5 */ ['氷の廊下','雪女の間','吹雪の洞','霜の蔵','冰牢','雪の祭壇','凍てつく間','氷柱の廊','白銀の間','霧の間'],
        /* L6 */ ['雷の間','稲妻の廊下','嵐の洞','天雷の部屋','神鳴の間','龍神の庭','電光石火','疾風の間','暴風の蔵','雷神の祭壇'],
        /* L7 */ ['鬼婆の聖域','冥府の門','黒龍の間','業の間','六道の辻','恩讐の庭','鬼の玉座','幽冥の奥','彼岸の間','魂の祭壇'],
    ];
    const namePool = [...(ROOM_POOLS[level-1] || ROOM_POOLS[0])];
    const getNextName = () => {
        if(!namePool.length) return '謎の間';
        const i = Math.floor(Math.random()*namePool.length);
        return namePool.splice(i,1)[0];
    };

    // ── Scatter rooms ────────────────────────────────────────────────────────
    let id = 0;
    let attempts = 0;

    // Level 7: place large OniBaba sanctum first, in the far north
    if(level === 7){
        const ox = Math.floor(MAP_W/2) - Math.floor(ONIBABA_ROOM_SIZE/2);
        const oz = BORDER + 2;
        if(!overlaps(ox, oz, ONIBABA_ROOM_SIZE, ONIBABA_ROOM_SIZE, 1)){
            carveRoom(id++, ox, oz, ONIBABA_ROOM_SIZE, ONIBABA_ROOM_SIZE,
                {roomName:'鬼婆の聖域', roomType:'sanctum', isOniBaba:true});
        }
    }

    // Fill the rest of the map with scattered rooms
    while(rooms.length < targetRooms && attempts < 2000){
        attempts++;
        const w = MIN_R + Math.floor(Math.random()*(MAX_R-MIN_R+1));
        const h = MIN_R + Math.floor(Math.random()*(MAX_R-MIN_R+1));
        const x0 = BORDER + Math.floor(Math.random()*(MAP_W - w - BORDER*2));
        const z0 = BORDER + Math.floor(Math.random()*(MAP_H - h - BORDER*2));
        if(!overlaps(x0, z0, w, h)){
            const rName = getNextName();
            carveRoom(id++, x0, z0, w, h, {roomName:rName, roomType:'room'});
        }
    }

    // ── Connect rooms with open corridors (minimum spanning tree) ─────────────
    // Prim's algorithm: always connect nearest unconnected room
    if(rooms.length > 1){
        const connected = new Set([0]);
        while(connected.size < rooms.length){
            let bestDist = Infinity, bestA = -1, bestB = -1;
            for(const ai of connected){
                for(let bi=0; bi<rooms.length; bi++){
                    if(connected.has(bi)) continue;
                    const ra = rooms[ai], rb = rooms[bi];
                    const d = Math.abs(ra.cx-rb.cx)+Math.abs(ra.cz-rb.cz);
                    if(d < bestDist){ bestDist=d; bestA=ai; bestB=bi; }
                }
            }
            if(bestB < 0) break;
            carveCorridor(rooms[bestA].cx, rooms[bestA].cz, rooms[bestB].cx, rooms[bestB].cz, rooms[bestA].id, rooms[bestB].id);
            connected.add(bestB);
        }
        // Add a few extra random connections so it feels less linear
        const extras = 2 + Math.floor(Math.random()*3);
        for(let e=0; e<extras; e++){
            const a = rooms[Math.floor(Math.random()*rooms.length)];
            const b = rooms[Math.floor(Math.random()*rooms.length)];
            if(a !== b) carveCorridor(a.cx, a.cz, b.cx, b.cz, a.id, b.id);
        }
    }

    // ── Spawn point + start hallway ──────────────────────────────────────────
    // Pick the southernmost room as the entrance room
    const entranceRoom = rooms.reduce((best, r) => r.cz > best.cz ? r : best, rooms[0]);
    const spawnX = entranceRoom.cx;

    // Carve a 2-tile-wide, 7-tile-long start hallway south of the entrance room.
    // hallStart = first tile immediately south of the room's south wall.
    // stairsUpZ = south tip of the hallway (7 tiles down) = exit stairs.
    // Player spawns at hallStart (north end of hallway) facing north into the dungeon.
    const roomSouthEdge = entranceRoom.y + entranceRoom.h; // first tile SOUTH of room
    const hallStart     = roomSouthEdge;
    const stairsUpZ     = Math.min(MAP_H - 3, hallStart + 6); // 7 tiles: hallStart..hallStart+6
    for(let cz = hallStart; cz <= stairsUpZ; cz++){
        if(map[spawnX  ]?.[cz]) map[spawnX  ][cz] = {type:'floor', hall:true, roomId: entranceRoom.id};
        if(map[spawnX+1]?.[cz]) map[spawnX+1][cz] = {type:'floor', hall:true, roomId: entranceRoom.id};
    }
    // South tip = stairs_up (exit door). Right tile marked stairs_up_r so
    // geometry only renders one combined double-door spanning both tiles.
    if(map[spawnX  ]?.[stairsUpZ]) map[spawnX  ][stairsUpZ] = {type:'stairs_up',   roomId: entranceRoom.id};
    if(map[spawnX+1]?.[stairsUpZ]) map[spawnX+1][stairsUpZ] = {type:'stairs_up_r', roomId: entranceRoom.id};

    // Player spawns at bottom of the stairs, facing north into the dungeon
    const spawnZ = stairsUpZ - 1;

    // ── Stairs down: in the northernmost non-sanctum room ────────────────────
    const stairsRoom = rooms.filter(r=>!r.isOniBaba)
                           .reduce((best,r) => r.cz < best.cz ? r : best, rooms[0]);
    map[stairsRoom.cx][stairsRoom.cz] = {type:'stairs_down', roomId: stairsRoom.id};

    // ── Monster spawns: 1–3 per room ─────────────────────────────────────────
    const mobSpawns = [];
    let mobIdCtr = 0;
    const hpByLevel = [50, 65, 80, 100, 120, 145, 175];
    const monsterHp = hpByLevel[Math.min(level-1, 6)];

    rooms.forEach(r => {
        if(r.roomType === 'hallway') return;
        // OniBaba sanctum on L7: no random mobs — boss is spawned separately
        if(r.isOniBaba) return;

        const count = 1 + Math.floor(Math.random()*3); // 1, 2 or 3
        // Build candidate floor cells (not adjacent to walls)
        const candidates = [];
        for(let cx=r.x+1; cx<r.x+r.w-1; cx++){
            for(let cz=r.y+1; cz<r.y+r.h-1; cz++){
                if(map[cx]?.[cz]?.type !== 'floor') continue;
                candidates.push([cx, cz]);
            }
        }
        if(!candidates.length) return;
        const used = new Set();
        for(let i=0; i<count; i++){
            let pick = null;
            for(let tries=0; tries<20 && !pick; tries++){
                const [tx,tz] = candidates[Math.floor(Math.random()*candidates.length)];
                const key = `${tx},${tz}`;
                if(!used.has(key)){ used.add(key); pick=[tx,tz]; }
            }
            if(!pick) break;
            mobSpawns.push({
                id:`goblin-${r.id}-${mobIdCtr++}`,
                name:'Yakuza Goblin',
                type:'monster',
                x:pick[0], z:pick[1],
                hp:monsterHp, maxHp:monsterHp,
                isHostile:true
            });
        }
    });

    return {map, rooms, spawnX, spawnZ, mobSpawns};
}

// Alias so existing callers still work
function generateCastleMap(){ return generateDungeonMap(1); }

const {map,rooms,spawnX,spawnZ,mobSpawns} = generateCastleMap();

// ── Room Descriptions — built from procedural room data ──────────────────────
// getRoomDesc(roomId) returns {name, kanji, desc} for the event log.
const _ROOM_FLAVOR = [
    '石畳が冷たく、足音が闇に吸い込まれる。', '遠くで水が滴る音がする。',
    '腐った柱が壁を支えている。',            '空気が重く、古い血の匂いがする。',
    '松明の残り香が漂う。何かがここにいた。',  '床に引っ掻き傷が走っている。',
    '天井から何かがぶら下がっている。見ない方がいい。', '静寂が耳に痛い。',
    '壁に何かが書かれていたが、今は読めない。', '出口は見当たらない。まだ。',
];
function getRoomDesc(roomId) {
    const r = rooms.find(r => r.id === roomId);
    if(!r) return {name:'???', kanji:'謎', desc:'You do not know where you are.'};
    if(r.isOniBaba) return {
        name:'Oni Baba\'s Sanctum', kanji:'鬼婆の聖域',
        desc:'The air thickens. Red lanterns blaze unseen. A voice — ancient, amused — fills your bones: \"You came at last, child. I wondered how long it would take.\"'
    };
    const flavor = _ROOM_FLAVOR[roomId % _ROOM_FLAVOR.length];
    return { name: r.roomName || '???', kanji: r.roomName || '謎', desc: flavor };
}
// Legacy compat: old code indexes ROOM_DESCRIPTIONS[id]
const ROOM_DESCRIPTIONS = new Proxy({}, { get(_,id){ return getRoomDesc(Number(id)); } });

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance', preserveDrawingBuffer:true});
renderer.setPixelRatio(1.0);

let _pipZoomScale=1.0, _pipPan={x:0,z:0}, _pipRot={theta:0.5,phi:0.96,radius:17};

// T0.9 — PIP state persistence + cinematic state
// PIP is its own camera (topDownCamera) — main `camera` is never touched by PIP_*

const _PIP_SAVE_KEY = 'origami.v8.pip';
let _pipCinematicT = 0;            // 0 = default top-down, 1 = fully cinematic angled

}
function _pipLoadState() {

        if (!raw) return;

        if (typeof s.z === 'number') _pipZoomScale = Math.max(0.2, Math.min(2.0, s.z));

}

// Magic Lantern state — toggled true on pickup. Drives flashlight cone +
// flicker + dust motes. Tuned to NOT bloom out matte stone/wood walls so
// the scene stays cinematic and creepy.
let magicLanternOn   = false;
let lanternBaseInt   = 3.4;   // headlamp intensity when ON (warm amber)
let lanternOuterInt  = 0.85;  // outer fall-off cone
let lanternNearInt   = 1.6;   // close foreground glow
function activateMagicLantern(){
    if(magicLanternOn) return;
    magicLanternOn = true;
    // Cinematic warm-amber flashlight — tight cone, long throw
    headlamp.color.setHex(0xffd28a);
    headlamp.angle    = Math.PI/9;     // ~20° cone (tight)
    headlamp.penumbra = 0.55;
    headlamp.distance = GRID*16;
    headlamp.decay    = 1.4;            // softer falloff for long throw
    headlamp.intensity= lanternBaseInt;
    // Outer halo — wider, very soft, low intensity (no wall-bounce bloom)
    outerGlow.color.setHex(0xffc070);
    outerGlow.angle   = Math.PI/5.5;
    outerGlow.penumbra= 0.85;
    outerGlow.distance= GRID*22;
    outerGlow.decay   = 1.6;
    outerGlow.intensity = lanternOuterInt;
    // Near-field warm wash — only inches from lens, helps foreground objects
    nearFieldLight.color.setHex(0xffb060);

    nearFieldLight.distance  = GRID*2.2;
    // Slight tone-down: ambient stays low, walls stay matte (already metalness 0.05)
    // No emissive boost — we want creepy darkness everywhere outside the cone.
    window.parent.postMessage({type:'LOG_EVENT',logType:'system',
        text:'✨ The Magic Lantern flickers to life. Its cone reveals… things.'},'*');
}

// ── Origami Paper Lanterns (replaces torch boxes) ────────────────────────────
function createWashiPaperTexture(){
    const sz=256, c=document.createElement('canvas'); c.width=c.height=sz;
    const ctx=c.getContext('2d');
    // Warm cream washi base
    const grad=ctx.createLinearGradient(0,0,0,sz);
    grad.addColorStop(0,'#fff2c8'); grad.addColorStop(0.5,'#ffd985'); grad.addColorStop(1,'#ffb060');
    ctx.fillStyle=grad; ctx.fillRect(0,0,sz,sz);
    // Paper fiber noise
    for(let i=0;i<800;i++){
        ctx.fillStyle=`rgba(120,70,30,${Math.random()*0.08})`;
        ctx.fillRect(Math.random()*sz,Math.random()*sz,1+Math.random()*2,1);
    }
    // Horizontal bamboo strut shadows (rings around lantern)
    ctx.strokeStyle='rgba(60,30,10,0.45)'; ctx.lineWidth=2;
    for(let y=20;y<sz;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(sz,y);ctx.stroke();}
    // Faint kanji "灯" (light) center
    ctx.fillStyle='rgba(120,30,10,0.6)';
    ctx.font='900 110px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('灯',sz/2,sz/2);
    // Top/bottom dark caps
    ctx.fillStyle='#1a0e05'; ctx.fillRect(0,0,sz,8); ctx.fillRect(0,sz-8,sz,8);

// ── Procedural Textures (ported from WorldGen.js) ─────────────────────────────
function createDungeonFloorTexture(){
    // Charcoal gray-brown weathered planks — matched to the wall wood tone.
    const sz=512,c=document.createElement('canvas'); c.width=c.height=sz;
    const ctx=c.getContext('2d');
    // Base: charcoal gray-brown (cool, dusty, ancient)
    ctx.fillStyle='#22201d'; ctx.fillRect(0,0,sz,sz);
    // Cool gray noise wash
    const id=ctx.getImageData(0,0,sz,sz),d=id.data;
    for(let i=0;i<d.length;i+=4){
        const n=(Math.random()-0.5)*10;
        d[i]  =Math.max(0,Math.min(255,d[i]  +n+1));
        d[i+1]=Math.max(0,Math.min(255,d[i+1]+n+1));
        d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
    }
    ctx.putImageData(id,0,0);
    // Long horizontal planks (4 × wide-grain) for floor look
    const nPlanks=4, pH=sz/nPlanks;
    for(let p=0;p<nPlanks;p++){
        const y=p*pH;

        ctx.fillStyle = `rgb(${tone},${tone-2},${tone-4})`;
        ctx.fillRect(0, y+2, sz, pH-4);

        for(let g=0;g<14;g++){

            for(let x=0;x<=sz;x+=64) ctx.lineTo(x,gy+(Math.random()-0.5)*3);

        }
        // Knots — dark concentric rings
        for(let k=0;k<2;k++){
            const kx=20+Math.random()*(sz-40), ky=y+8+Math.random()*(pH-16);

            ctx.beginPath(); ctx.moveTo(cx,cyy);
            ctx.lineTo(cx+30+Math.random()*60, cyy+(Math.random()-0.5)*3);

function createDarkWoodRafterTexture(){
    // Charcoal gray-brown rafter ceiling matching the floor + wall tone.
    // Rafters are randomly thick/thin, knot-laced, cracked old timber.
    const sz=512,c=document.createElement('canvas'); c.width=c.height=sz;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#15130f'; ctx.fillRect(0,0,sz,sz);
    // Cool charcoal wash
    const id=ctx.getImageData(0,0,sz,sz),d=id.data;
    for(let i=0;i<d.length;i+=4){const r=(Math.random()-0.5)*12;d[i]+=r+1;d[i+1]+=r+1;d[i+2]+=r;}
    ctx.putImageData(id,0,0);

    // Random major rafter beams — varied spacing & thickness for that
    // hand-hewn old-castle feel.
    let y = 0;
    while(y < sz){
        const beamH = 36 + Math.random()*32;       // varied thickness
        const gap   = 12 + Math.random()*22;       // varied gap
        // Tonal variation per beam
        const tA = 26 + Math.floor(Math.random()*14);
        const tB = 38 + Math.floor(Math.random()*14);
        const grad = ctx.createLinearGradient(0,y,0,y+beamH);
        grad.addColorStop(0,   `rgb(${tA-6},${tA-8},${tA-10})`);
        grad.addColorStop(0.5, `rgb(${tB},${tB-4},${tB-8})`);
        grad.addColorStop(1,   `rgb(${tA-10},${tA-12},${tA-14})`);
        ctx.fillStyle=grad; ctx.fillRect(0,y,sz,beamH);

        // Long grain striations along this beam
        ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=1;
        for(let i=0;i<14;i++){
            const gy = y + 2 + Math.random()*(beamH-4);
            ctx.beginPath(); ctx.moveTo(0,gy);
            for(let xx=0;xx<=sz;xx+=80) ctx.lineTo(xx, gy+(Math.random()-0.5)*2);
            ctx.stroke();
        }
        // Random knots along the beam
        const knots = 2 + Math.floor(Math.random()*3);
        for(let k=0;k<knots;k++){
            const kx = 30 + Math.random()*(sz-60);
            const ky = y + 6 + Math.random()*(beamH-12);
            const kr = 5 + Math.random()*7;
            const kg = ctx.createRadialGradient(kx,ky,0, kx,ky,kr);
            kg.addColorStop(0,'rgba(0,0,0,0.92)');
            kg.addColorStop(0.55,'rgba(15,10,6,0.55)');
            kg.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=kg; ctx.fillRect(kx-kr,ky-kr,kr*2,kr*2);
        }
        // Hairline cracks running along grain
        ctx.strokeStyle='rgba(0,0,0,0.75)'; ctx.lineWidth=0.8;
        for(let cr=0;cr<2;cr++){
            const cy = y + 4 + Math.random()*(beamH-8);
            const cx = Math.random()*sz, cl = 60+Math.random()*120;
            ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+cl, cy+(Math.random()-0.5)*2); ctx.stroke();
        }
        // Beam edge shadow seam (top & bottom)
        ctx.fillStyle='rgba(0,0,0,0.95)'; ctx.fillRect(0,y,sz,1);
        ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,y+beamH-2,sz,2);
        // Gap (dark void between beams)
        ctx.fillStyle='#080604'; ctx.fillRect(0, y+beamH, sz, gap);
        y += beamH + gap;
    }
    // Sparse iron-bracket cross-supports
    for(let x=0;x<sz;x+=160 + Math.random()*60){
        ctx.fillStyle='rgba(15,10,6,0.7)'; ctx.fillRect(x|0, 0, 18, sz);
        // bolt heads
        ctx.fillStyle='rgba(50,40,30,0.6)';
        for(let by=20; by<sz; by+=80+Math.random()*30){
            ctx.beginPath(); ctx.arc((x|0)+9, by, 2.2, 0, Math.PI*2); ctx.fill();
        }
    }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}

function createSpiderwebVariantA(){

    const sz=512,c=document.createElement('canvas'); c.width=c.height=sz;

    for(let i=0;i<=90;i+=10){
        const r=i*Math.PI/180; ctx.beginPath();
        ctx.moveTo(0,0); ctx.lineTo(Math.cos(r)*sz,Math.sin(r)*sz); ctx.stroke();
    }
    ctx.strokeStyle='rgba(220,220,225,0.45)'; ctx.lineWidth=1.2;
    for(let r=40;r<=sz-30;r+=32){
        ctx.beginPath();

// ---- 3 FRACTAL web variants (recursive geometry, no two ever look alike) ----
function createSpiderwebVariantD(){
    // Recursive branching tree-web (L-system style)
    const sz=512,c=document.createElement('canvas'); c.width=c.height=sz;
    const ctx=c.getContext('2d');
    ctx.translate(0,0);
    // Recursive branch grown from corner outward
    function branch(x, y, ang, len, depth, alpha){
        if(depth<=0 || len<3) return;
        const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
        ctx.strokeStyle = `rgba(230,230,225,${alpha})`;
        ctx.lineWidth = Math.max(0.5, depth*0.35);
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
        // Two child branches with golden-ratio-ish split + jitter
        const split = 0.42 + Math.random()*0.28;
        const jitter = (Math.random()-0.5)*0.35;
        branch(x2, y2, ang - split + jitter, len*(0.62+Math.random()*0.12), depth-1, alpha*0.92);
        branch(x2, y2, ang + split + jitter, len*(0.58+Math.random()*0.14), depth-1, alpha*0.88);
        // Occasional third sub-strand
        if(Math.random()<0.35){
            branch(x2, y2, ang + (Math.random()-0.5)*0.8, len*0.45, depth-2, alpha*0.7);
        }
    }
    // Several primary branches sweeping the corner quadrant
    for(let i=0;i<7;i++){
        const ang = (Math.PI/2) * (i/6) + (Math.random()-0.5)*0.06;
        branch(0, 0, ang, sz*0.95, 7, 0.65);
    }
    // Faint connective spiral (ties the fractal together)
    ctx.strokeStyle='rgba(220,220,215,0.22)'; ctx.lineWidth=0.6;
    for(let r=40;r<sz-30;r+=22+Math.random()*10){
        ctx.beginPath();
        for(let i=0;i<=90;i+=12){
            const rad=i*Math.PI/180, sr=r+(Math.random()*14-7);
            const px=Math.cos(rad)*sr, py=Math.sin(rad)*sr;
            if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.stroke();
    }
    return new THREE.CanvasTexture(c);
}
function createSpiderwebVariantE(){
    // Sierpinski-style splintered shard web — jagged, alien geometry
    const sz=512,c=document.createElement('canvas'); c.width=c.height=sz;
    const ctx=c.getContext('2d');
    function splinter(p1, p2, p3, depth){
        if(depth<=0){
            ctx.strokeStyle = `rgba(240,240,232,${0.18 + depth*0.06})`;
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]);
            ctx.lineTo(p3[0],p3[1]); ctx.closePath(); ctx.stroke();
            return;
        }
        const m12 = [(p1[0]+p2[0])/2 + (Math.random()-0.5)*8, (p1[1]+p2[1])/2 + (Math.random()-0.5)*8];
        const m23 = [(p2[0]+p3[0])/2 + (Math.random()-0.5)*8, (p2[1]+p3[1])/2 + (Math.random()-0.5)*8];
        const m31 = [(p3[0]+p1[0])/2 + (Math.random()-0.5)*8, (p3[1]+p1[1])/2 + (Math.random()-0.5)*8];
        // Outer shard
        ctx.strokeStyle = `rgba(245,245,240,${0.42 - depth*0.05})`;
        ctx.lineWidth = Math.max(0.6, depth*0.5);
        ctx.beginPath();
        ctx.moveTo(p1[0],p1[1]); ctx.lineTo(m12[0],m12[1]);
        ctx.lineTo(m31[0],m31[1]); ctx.closePath(); ctx.stroke();
        // Recurse into 3 corner shards (skip central inverted triangle for fractal hole)
        splinter(p1, m12, m31, depth-1);
        splinter(m12, p2, m23, depth-1);
        splinter(m31, m23, p3, depth-1);
    }
    splinter([0,0], [sz, 4], [4, sz], 5);
    // Faint anchoring strands from corner
    ctx.strokeStyle='rgba(230,230,225,0.45)'; ctx.lineWidth=0.9;
    for(let i=0;i<5;i++){
        const ang = (Math.PI/2)*(i/4) + (Math.random()-0.5)*0.08;
        ctx.beginPath(); ctx.moveTo(0,0);
        // Jaggy zigzag anchor
        let x=0,y=0;
        for(let s=0; s<8; s++){
            const seg = sz*0.12;
            x += Math.cos(ang)*seg + (Math.random()-0.5)*8;
            y += Math.sin(ang)*seg + (Math.random()-0.5)*8;
            ctx.lineTo(x,y);
        }
        ctx.stroke();
    }
    return new THREE.CanvasTexture(c);
}
function createSpiderwebVariantF(){
    // Recursive sagging filament — long catenary chains that branch
    const sz=512,c=document.createElement('canvas'); c.width=c.height=sz;
    const ctx=c.getContext('2d');
    function sag(x1,y1, x2,y2, depth, alpha){
        if(depth<=0) return;
        // Catenary midpoint pulled downward
        const mx = (x1+x2)/2 + (Math.random()-0.5)*6;
        const my = (y1+y2)/2 + 8 + Math.random()*14;
        ctx.strokeStyle = `rgba(225,225,220,${alpha})`;
        ctx.lineWidth = Math.max(0.5, depth*0.32);
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.quadraticCurveTo(mx,my, x2,y2);
        ctx.stroke();
        // Recurse — children branch off mid-strand
        if(Math.random()<0.7) sag(x1,y1, mx,my, depth-1, alpha*0.8);
        if(Math.random()<0.7) sag(mx,my, x2,y2, depth-1, alpha*0.8);
        // Occasional droplet/anchor strand hanging from midpoint
        if(depth>1 && Math.random()<0.4){
            const dx = mx + (Math.random()-0.5)*40;
            const dy = my + 30 + Math.random()*60;
            sag(mx,my, dx,dy, depth-2, alpha*0.7);
        }
    }
    // Several anchor points along corner edges
    const anchors = [];
    for(let i=0;i<6;i++){
        anchors.push([0, 30 + i*(sz/6) + Math.random()*20]);
        anchors.push([30 + i*(sz/6) + Math.random()*20, 0]);
    }
    // Connect random pairs with sagging filaments
    for(let i=0;i<14;i++){
        const a = anchors[Math.floor(Math.random()*anchors.length)];
        const b = anchors[Math.floor(Math.random()*anchors.length)];
        if(a===b) continue;
        sag(a[0],a[1], b[0],b[1], 4, 0.5);
    }
    // Sparse radials from origin for cohesion
    ctx.strokeStyle='rgba(220,220,215,0.32)'; ctx.lineWidth=0.7;
    for(let i=0;i<=4;i++){
        const r = (Math.PI/2)*(i/4);
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(r)*sz*0.95, Math.sin(r)*sz*0.95);
        ctx.stroke();
    }
    return new THREE.CanvasTexture(c);
}

    ctx.strokeStyle='rgba(140,100,60,0.10)'; ctx.lineWidth=0.6;
    for(let i=0;i<40;i++){
        const y=Math.random()*sz; ctx.beginPath();
        ctx.moveTo(0,y); ctx.lineTo(sz,y+Math.random()*4-2); ctx.stroke();
    }
    // Dark wooden lattice (kumiko grid) — the iconic shoji look
    const woodMat = ctx.createLinearGradient(0,0,8,0);
    woodMat.addColorStop(0,'#1a0e05'); woodMat.addColorStop(0.5,'#2a1a0d'); woodMat.addColorStop(1,'#1a0e05');
    ctx.fillStyle=woodMat;
    // Outer wooden frame
    ctx.fillRect(0,0,sz,14); ctx.fillRect(0,sz-14,sz,14);
    ctx.fillRect(0,0,14,sz); ctx.fillRect(sz-14,0,14,sz);
    // Vertical kumiko bars (6 evenly spaced)
    for(let i=1;i<=5;i++){
        const x = (sz/6)*i - 3;
        ctx.fillStyle='#1f1208'; ctx.fillRect(x,14,6,sz-28);
    }
    // Horizontal kumiko bars (4 evenly spaced)
    for(let i=1;i<=4;i++){
        const y = (sz/5)*i - 3;
        ctx.fillStyle='#1f1208'; ctx.fillRect(14,y,sz-28,6);
    }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t;
}

// ── Shoji Door Texture (vertical center seam — sliding panel split) ──────────
function createShojiDoorTexture(){
    const sz=512, c=document.createElement('canvas'); c.width=c.height=sz;
    const ctx=c.getContext('2d');
    // Same warm paper base
    const grad=ctx.createLinearGradient(0,0,0,sz);
    grad.addColorStop(0,'#f8eccd'); grad.addColorStop(0.5,'#e8d5a8'); grad.addColorStop(1,'#d4bf85');
    ctx.fillStyle=grad; ctx.fillRect(0,0,sz,sz);
    for(let i=0;i<1200;i++){
        ctx.fillStyle=`rgba(120,80,40,${Math.random()*0.07})`;
        ctx.fillRect(Math.random()*sz,Math.random()*sz,1+Math.random()*2,1);
    }
    // Outer + center frame (door split)
    ctx.fillStyle='#1a0e05';
    ctx.fillRect(0,0,sz,14); ctx.fillRect(0,sz-14,sz,14);
    ctx.fillRect(0,0,14,sz); ctx.fillRect(sz-14,0,14,sz);
    // Center seam — two-panel sliding door
    ctx.fillRect(sz/2-5,14,10,sz-28);
    // Lattice on each panel half
    const half = sz/2;
    for(let panel=0; panel<2; panel++){
        const x0 = panel*half;
        // 3 vertical bars per panel
        for(let i=1;i<=2;i++){
            const x = x0 + (half/3)*i - 3;
            ctx.fillStyle='#1f1208'; ctx.fillRect(x,14,6,sz-28);
        }
        // 4 horizontal bars
        for(let i=1;i<=4;i++){
            const y = (sz/5)*i - 3;
            ctx.fillStyle='#1f1208'; ctx.fillRect(x0+14,y,half-28,6);
        }
    }
    // Small brass pull-handle indicator on each side of seam
    ctx.fillStyle='#8b7340';
    ctx.fillRect(sz/2-22,sz/2-12,12,24);
    ctx.fillRect(sz/2+10,sz/2-12,12,24);
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t;
}

function makePaperTexture(baseColor){
    const c=document.createElement('canvas'); c.width=c.height=256;
    const ctx=c.getContext('2d');
    ctx.fillStyle=baseColor; ctx.fillRect(0,0,256,256);
    for(let i=0;i<400;i++){const x=Math.random()*256,y=Math.random()*256,w=Math.random()*24+6,a=Math.random()*0.05+0.02;ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(x,y,w,1);}
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
    for(let x=0;x<256;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,256);ctx.stroke();}
    for(let y=0;y<256;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(256,y);ctx.stroke();}
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(8,8); return t;
}

// ── Build World Geometry ───────────────────────────────────────────────────────
const worldGroup = new THREE.Group();
const dummy = new THREE.Object3D();

// Textures
const floorTex  = createDungeonFloorTexture(); floorTex.repeat.set(1,1);
const ceilTex   = createDarkWoodRafterTexture(); ceilTex.repeat.set(MAP_W/2,MAP_H/2);
const wallTopTex= createDungeonTopTexture();
// SIX precompiled web textures — classic 3 + 3 fractal-geometry variants.
// Placement code ensures no two adjacent corners or same-wall corners share a variant.
const WEB_TEXTURES = [
    createSpiderwebVariantA(), createSpiderwebVariantB(), createSpiderwebVariantC(),
    createSpiderwebVariantD(), createSpiderwebVariantE(), createSpiderwebVariantF()
];
// Disable mipmaps on all canvas textures — prevents WebGL lazy-init stalls
[floorTex, ceilTex, wallTopTex, ...WEB_TEXTURES].forEach(t=>{
    t.generateMipmaps = false;
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;
});
// Shoji panel + sliding-door textures (precompiled once)
const shojiTex     = createShojiTexture();
const shojiDoorTex = createShojiDoorTexture();
const objTex       = makePaperTexture('#444444');
[shojiTex, shojiDoorTex, objTex].forEach(t=>{
    t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
});

// External wall texture (falls back to procedural top if missing)
const wallTexLoader = new THREE.TextureLoader();
const wallTex = wallTexLoader.load('./assets/textures/Wall.Panel.Basic.1.png',
    t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,1); t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; },
    undefined, ()=>{}
);
// Start door texture — the mossy iron-studded dungeon gate
const startDoorTex = wallTexLoader.load('./assets/textures/start_door.jpg',
    t=>{ t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; },
    undefined, ()=>{}
);

const mats = {
    floor: new THREE.MeshStandardMaterial({map:floorTex,roughness:0.9,metalness:0.1}),
    ceil:  new THREE.MeshStandardMaterial({map:ceilTex,color:0x1a1a1a,roughness:1.0,metalness:0.0}),
    // +5% background luminosity on walls so they read as actual surfaces
    // instead of voids. Slight emissive lift makes them catch ambient light.
    wallTop: new THREE.MeshStandardMaterial({map:wallTopTex,color:0x8a8a82,roughness:0.92,metalness:0.05,emissive:0x141312,emissiveIntensity:0.35}),
    wallSide: new THREE.MeshStandardMaterial({map:wallTex,color:0x989890,roughness:0.92,metalness:0.05,emissive:0x141312,emissiveIntensity:0.35}),
    pipWall: new THREE.MeshStandardMaterial({color:0x111111,transparent:true,opacity:0.15,depthWrite:false}),
    // 3 web materials, one per precompiled texture
    webs: WEB_TEXTURES.map(tex => new THREE.MeshBasicMaterial({
        map:tex, color:0xf0f0eb, transparent:true, opacity:0.85,
        depthWrite:false, side:THREE.DoubleSide
    })),
    // Shoji paper panel — warm cream paper, slight emissive so it appears
    // backlit (like a real lit shoji from inside the room).
    shoji: new THREE.MeshStandardMaterial({
        map: shojiTex, color: 0xfff0d0,
        emissive: 0xffd590, emissiveIntensity: 0.45, emissiveMap: shojiTex,
        roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide
    }),
    shojiDoor: new THREE.MeshStandardMaterial({
        map: shojiDoorTex, color: 0xfff0d0,
        emissive: 0xffd590, emissiveIntensity: 0.55, emissiveMap: shojiDoorTex,
        roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide
    }),
    monster: new THREE.MeshPhysicalMaterial({color:'#2a4a3a',emissive:'#113322',emissiveIntensity:0.3,map:objTex,roughness:0.85,metalness:0.0,transparent:true,opacity:0.75,depthWrite:false,side:THREE.DoubleSide}),
    stairUp: new THREE.MeshStandardMaterial({color:0x222222,roughness:0.9,metalness:0.1}),
    stairDown: new THREE.MeshStandardMaterial({color:0x3e2723,roughness:0.95,flatShading:true}),
};

// --- Instanced Stone Walls (outer perimeter only) ---
const wallGeo = new THREE.BoxGeometry(GRID,WALL_H,GRID);
const wallMultiMat = [mats.wallSide,mats.wallSide,mats.wallTop,mats.wallSide,mats.wallSide,mats.wallSide];
const pipWallMats  = [mats.pipWall,mats.pipWall,mats.wallTop,mats.pipWall,mats.pipWall,mats.pipWall];

const PADDING=8;
let wallCount=0, shojiCount=0, doorCount=0;
for(let x=-PADDING;x<MAP_W+PADDING;x++) for(let z=-PADDING;z<MAP_H+PADDING;z++){
    const inMap=x>=0&&x<MAP_W&&z>=0&&z<MAP_H;
    if(!inMap||map[x][z].type==='wall') wallCount++;
    else if(inMap && map[x][z].type==='shoji') shojiCount++;
    else if(inMap && map[x][z].type==='shoji_door') doorCount++;
}
const fpvWalls = new THREE.InstancedMesh(wallGeo,wallMultiMat,Math.max(1,wallCount));
fpvWalls.castShadow=false; fpvWalls.receiveShadow=true; fpvWalls.frustumCulled=false; fpvWalls.layers.set(1);
const pipWalls = new THREE.InstancedMesh(wallGeo,pipWallMats,Math.max(1,wallCount));
pipWalls.frustumCulled=false; pipWalls.layers.set(3);

let wi=0;
for(let x=-PADDING;x<MAP_W+PADDING;x++) for(let z=-PADDING;z<MAP_H+PADDING;z++){
    const inMap=x>=0&&x<MAP_W&&z>=0&&z<MAP_H;
    if(!inMap||map[x][z].type==='wall'){
        dummy.position.set(x*GRID,WALL_H/2,z*GRID); dummy.updateMatrix();
        fpvWalls.setMatrixAt(wi,dummy.matrix); pipWalls.setMatrixAt(wi,dummy.matrix); wi++;
    }
}
fpvWalls.count=wi; fpvWalls.instanceMatrix.needsUpdate=true;
pipWalls.count=wi; pipWalls.instanceMatrix.needsUpdate=true;
worldGroup.add(fpvWalls); worldGroup.add(pipWalls);

// --- Instanced Shoji Paper Panels (interior partitions) ---
// Slightly thinner than stone walls so they read as panels, full height
// for floor-to-ceiling authenticity. Oriented per cell so the lattice
// faces the room interior — we use a flat panel mesh, not a box.
const shojiPanelGeo = new THREE.BoxGeometry(GRID*0.95, WALL_H, 0.08);
if(shojiCount > 0){
    const shojiMesh = new THREE.InstancedMesh(shojiPanelGeo, mats.shoji, shojiCount * 2); // 2 orientations max
    shojiMesh.castShadow = false; shojiMesh.receiveShadow = true;
    shojiMesh.frustumCulled = false; shojiMesh.layers.set(1);

    let si = 0;
    for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
        if(map[x][z].type !== 'shoji') continue;
        // Determine orientation: do floors lie N–S (panel runs E–W) or E–W (panel runs N–S)?
        const fN = map[x]?.[z-1]?.type === 'floor';
        const fS = map[x]?.[z+1]?.type === 'floor';
        const fE = map[x+1]?.[z]?.type === 'floor';
        const fW = map[x-1]?.[z]?.type === 'floor';
        // Build up to two crossed panels if it's a corner junction; usually one
        if(fN && fS){
            // Panel runs E–W (faces N+S rooms)
            dummy.position.set(x*GRID, WALL_H/2, z*GRID);
            dummy.rotation.set(0, 0, 0);
            dummy.updateMatrix();
            shojiMesh.setMatrixAt(si++, dummy.matrix);
        }
        if(fE && fW){
            // Panel runs N–S (faces E+W rooms)
            dummy.position.set(x*GRID, WALL_H/2, z*GRID);
            dummy.rotation.set(0, Math.PI/2, 0);
            dummy.updateMatrix();
            shojiMesh.setMatrixAt(si++, dummy.matrix);
            dummy.rotation.set(0, 0, 0); // reset for safety
        }
    }
    shojiMesh.count = si;
    shojiMesh.instanceMatrix.needsUpdate = true;
    worldGroup.add(shojiMesh);
}

// --- Sliding Shoji Doors (passable) + wooden door FRAMES (jambs + lintel) ---
// The frame anchors each door visually to the surrounding walls so it never
// reads as an orphan panel floating in space.
if(doorCount > 0){
    // OPEN sliding-shoji style: render TWO half-panels slid to either side,
    // leaving a clear center archway the player walks through. The panels are
    // recessed into the wall thickness so they don't block the opening.
    // Each half-panel is ~38% of the cell wide; center gap is ~24% (tall, narrow).
    const halfPanelGeo = new THREE.BoxGeometry(GRID*0.38, WALL_H*0.92, 0.05);
    // 2 half-panels per door cell → doorCount * 2 instances
    const doorMesh = new THREE.InstancedMesh(halfPanelGeo, mats.shojiDoor, doorCount * 2);
    doorMesh.castShadow = false; doorMesh.receiveShadow = true;
    doorMesh.frustumCulled = false; doorMesh.layers.set(1);

    // Dark-stained wood frame material (jambs + lintels + threshold)
    const frameMat = new THREE.MeshStandardMaterial({
        color: 0x2a1a0e, roughness: 0.85, metalness: 0.05,
        emissive: 0x1a0c04, emissiveIntensity: 0.2
    });
    const jambW = 0.14, jambD = 0.20;
    const jambGeo      = new THREE.BoxGeometry(jambW, WALL_H, jambD);
    const lintelGeo    = new THREE.BoxGeometry(GRID, jambW*1.6, jambD);
    const thresholdGeo = new THREE.BoxGeometry(GRID*0.85, 0.05, jambD*0.7);

    let di = 0;
    const placeHalfPanel = (cx, cy, cz, rotY) => {
        dummy.position.set(cx, cy, cz);
        dummy.rotation.set(0, rotY, 0);
        dummy.updateMatrix();
        doorMesh.setMatrixAt(di++, dummy.matrix);
    };

    for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
        if(map[x][z].type !== 'shoji_door') continue;
        const wallE = map[x+1]?.[z]?.type === 'wall' || map[x+1]?.[z]?.type === 'shoji';
        const wallW = map[x-1]?.[z]?.type === 'wall' || map[x-1]?.[z]?.type === 'shoji';
        const wx = x*GRID, wz = z*GRID;
        const yMid = WALL_H*0.46 + 0.05;   // panel vertical center (above threshold)
        const slide = GRID*0.31;            // how far each panel is slid to the side

        if(wallE || wallW){
            // Door runs N–S → panels slide along Z (north/south sides)
            placeHalfPanel(wx, yMid, wz - slide, Math.PI/2);
            placeHalfPanel(wx, yMid, wz + slide, Math.PI/2);
            // Jambs on E/W
            const jL = new THREE.Mesh(jambGeo, frameMat);
            jL.position.set(wx + GRID/2 - jambW/2, WALL_H/2, wz); worldGroup.add(jL);
            const jR = new THREE.Mesh(jambGeo, frameMat);
            jR.position.set(wx - GRID/2 + jambW/2, WALL_H/2, wz); worldGroup.add(jR);
            // Lintel + threshold
            const lt = new THREE.Mesh(lintelGeo, frameMat);
            lt.position.set(wx, WALL_H - jambW*0.8, wz); worldGroup.add(lt);
            const th = new THREE.Mesh(thresholdGeo, frameMat);
            th.position.set(wx, 0.025, wz); worldGroup.add(th);
        } else {
            // Door runs E–W → panels slide along X
            placeHalfPanel(wx - slide, yMid, wz, 0);
            placeHalfPanel(wx + slide, yMid, wz, 0);
            // Jambs on N/S
            const jN = new THREE.Mesh(jambGeo, frameMat);
            jN.position.set(wx, WALL_H/2, wz - GRID/2 + jambW/2); worldGroup.add(jN);
            const jS = new THREE.Mesh(jambGeo, frameMat);
            jS.position.set(wx, WALL_H/2, wz + GRID/2 - jambW/2); worldGroup.add(jS);
            // Lintel + threshold (rotated 90°)
            const lt = new THREE.Mesh(lintelGeo, frameMat);
            lt.rotation.y = Math.PI/2;
            lt.position.set(wx, WALL_H - jambW*0.8, wz); worldGroup.add(lt);
            const th = new THREE.Mesh(thresholdGeo, frameMat);
            th.rotation.y = Math.PI/2;
            th.position.set(wx, 0.025, wz); worldGroup.add(th);
        }
    }
    doorMesh.count = di;
    doorMesh.instanceMatrix.needsUpdate = true;
    worldGroup.add(doorMesh);
}

// --- Ceiling (Layer 2 — FPV only, hidden from map view) ---
const ceilGeo=new THREE.PlaneGeometry(MAP_W*GRID,MAP_H*GRID);
const ceiling=new THREE.Mesh(ceilGeo,mats.ceil);
ceiling.rotation.x=Math.PI/2;
ceiling.position.set((MAP_W*GRID)/2-GRID/2,WALL_H,(MAP_H*GRID)/2-GRID/2);
ceiling.layers.set(2); worldGroup.add(ceiling);

// --- Instanced Floor ---
const floorBoxGeo=new THREE.BoxGeometry(GRID*1.0,0.001,GRID*1.0);
let floorCount=0;
for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++) if(map[x][z]?.type!=='wall') floorCount++;
const instancedFloor=new THREE.InstancedMesh(floorBoxGeo,mats.floor,Math.max(1,floorCount));
instancedFloor.receiveShadow=true;
let fi=0;
for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
    if(map[x][z]?.type!=='wall'){dummy.position.set(x*GRID,-0.0005,z*GRID);dummy.updateMatrix();instancedFloor.setMatrixAt(fi++,dummy.matrix);}
}
instancedFloor.instanceMatrix.needsUpdate=true; worldGroup.add(instancedFloor);

// --- Stairways ---
for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
    const cell=map[x][z];
    if(!cell) continue;
    if(cell.type==='stairs_down'){
        const stairGroup=new THREE.Group();
        const pitDepth=1.8, numSteps=8;
        const stepH=pitDepth/numSteps, stepD=GRID/numSteps;
        for(let s=0;s<numSteps;s++){
            const step=new THREE.Mesh(new THREE.BoxGeometry(GRID*0.95,stepH,stepD*1.2),mats.stairDown);
            step.position.set(x*GRID,-(s+0.5)*stepH,z*GRID+((s-(numSteps/2))*stepD));
            worldGroup.add(step);
        }
    }
    if(cell.type==='stairs_up'){
        // ── Double-wide stone stairway — the entrance gate to the dungeon ────
        // Detect if the tile to the right (+x) is stairs_up_r; if so span 2 tiles.
        const isDouble = map[x+1]?.[z]?.type === 'stairs_up_r';
        const stairSpan = isDouble ? GRID * 2 : GRID;     // physical width
        const stairCx   = isDouble ? x*GRID + GRID*0.5 : x*GRID; // centre X of span

        const stairGroup = new THREE.Group();
        const numSteps = 8, riserH = 0.22, treadD = GRID/numSteps;
        const stoneMat = new THREE.MeshStandardMaterial({
            map: wallTopTex, color: 0x686056, roughness: 0.95, metalness: 0.05
        });
        for(let s=0; s<numSteps; s++){
            const step = new THREE.Mesh(
                new THREE.BoxGeometry(stairSpan * 0.97, riserH*(s+1), treadD*1.15),
                stoneMat
            );
            step.position.set(
                stairCx,
                (riserH*(s+1))/2,
                z*GRID + ((s - (numSteps-1)/2)*treadD)
            );
            step.receiveShadow = true; step.castShadow = true;
            stairGroup.add(step);
        }
        // Side stone walls flanking the stairway (outer edges only)
        const sideWallMat = new THREE.MeshStandardMaterial({
            map: wallTex, color: 0x4a4540, roughness: 0.96, metalness: 0.0
        });
        for(const sx of [-1, 1]){
            const sw = new THREE.Mesh(
                new THREE.BoxGeometry(GRID*0.06, WALL_H*0.95, GRID*1.05),
                sideWallMat
            );
            sw.position.set(stairCx + sx*(stairSpan*0.5), WALL_H*0.475, z*GRID);
            stairGroup.add(sw);
        }
        // ── start_door.jpg — double iron-studded gate spanning full 2-tile width
        const doorMat = new THREE.MeshStandardMaterial({
            map: startDoorTex,
            roughness: 0.88, metalness: 0.0,
            emissive: 0x0a0804, emissiveIntensity: 0.12
        });
        const doorH = WALL_H * 0.92, doorW = stairSpan * 0.97;
        const door = new THREE.Mesh(
            new THREE.BoxGeometry(doorW, doorH, 0.10),
            doorMat
        );
        door.position.set(
            stairCx,
            riserH * numSteps + doorH / 2,
            z * GRID + (numSteps / 2) * treadD + 0.06
        );
        door.userData.isExitDoor = true;
        stairGroup.add(door);

        // Stone arch frame
        const archMat = new THREE.MeshStandardMaterial({
            map: wallTex, color: 0x4a4540, roughness: 0.97, metalness: 0.0
        });
        const lintel = new THREE.Mesh(
            new THREE.BoxGeometry(doorW + GRID*0.14, WALL_H*0.10, GRID*0.14),
            archMat
        );
        lintel.position.set(stairCx, riserH*numSteps + doorH + WALL_H*0.05,
            z*GRID + (numSteps/2)*treadD + 0.06);
        stairGroup.add(lintel);
        for(const sx of [-1, 1]){
            const jamb = new THREE.Mesh(
                new THREE.BoxGeometry(GRID*0.10, doorH + WALL_H*0.10, GRID*0.14),
                archMat
            );
            jamb.position.set(
                stairCx + sx*(doorW/2 + GRID*0.05),
                riserH*numSteps + doorH/2,
                z*GRID + (numSteps/2)*treadD + 0.06
            );
            stairGroup.add(jamb);
        }

        // Warm greenish-gold glow leaking around the door (mossy magic)
        const exitLight = new THREE.PointLight(0xb8d4a0, 1.1, GRID * 5, 1.8);
        exitLight.position.set(stairCx, riserH*numSteps + doorH*0.55,
            z*GRID + (numSteps/2)*treadD + 0.6);
        stairGroup.add(exitLight);

        stairGroup.userData.stairsUpGx = x;
        stairGroup.userData.stairsUpGz = z;
        worldGroup.add(stairGroup);
        window._stairsUpGx = x;
        window._stairsUpGz = z;
    }
    if(cell.type==='stairs_up_r'){
        // Right half of a double-wide stair — geometry handled by left tile, skip
    }
}

// --- Top-Corner Spider Webs (ONLY where ceiling meets two walls) ────────────
// For each floor tile, check if it has wall neighbors on two adjacent sides.
// If yes, that's a corner — drape a web in the upper corner using a random
// variant from the 3 precompiled textures. NO floor cobwebs anywhere.
const webPlaneGeo = new THREE.PlaneGeometry(1.6, 1.6);
// Helper: any kind of wall (stone OR shoji panel) blocks corner web placement test
const isWallish = (x,z) => {
    const t = map[x]?.[z]?.type;
    return t === 'wall' || t === 'shoji';
};
// Track which variant was placed at each (x,z, cornerKey) so we can
// exclude that variant when placing in any neighboring corner. This
// guarantees no two adjacent corners or same-wall webs share a pattern.
const placedWebVariant = new Map(); // key: `${x},${z},${cIdx}` -> variantIndex
const webKey = (x,z,c) => `${x},${z},${c}`;

// Batched web placement — collect per-material, merge into single meshes
{
const _webGeos = new Map(); // material → [BufferGeometry]
const corridorWebGeo = new THREE.PlaneGeometry(GRID*0.95, GRID*0.7);
let lastCorridorVariant = -1;
const _tmpObj = new THREE.Object3D();

for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
    const cell=map[x][z];
    if(!cell || cell.type==='wall' || cell.type==='shoji') continue;
    const wN = isWallish(x, z-1), wS = isWallish(x, z+1);
    const wW = isWallish(x-1, z), wE = isWallish(x+1, z);
    // Corner webs
    const corners = [
        {n:wN, w:wW, dx:-0.55, dz:-0.55, ry: Math.PI*0.25 + Math.PI},
        {n:wN, w:wE, dx: 0.55, dz:-0.55, ry:-Math.PI*0.25 + Math.PI},
        {n:wS, w:wW, dx:-0.55, dz: 0.55, ry: Math.PI*0.75 + Math.PI},
        {n:wS, w:wE, dx: 0.55, dz: 0.55, ry:-Math.PI*0.75 + Math.PI},
    ];
    corners.forEach((c, cIdx)=>{
        if(!(c.n && c.w)) return;
        if(Math.random()>0.55) return;
        const banned = new Set();
        for(let k=0;k<4;k++){ if(k===cIdx) continue; const v=placedWebVariant.get(webKey(x,z,k)); if(v!==undefined) banned.add(v); }
        for(const [nx,nz] of [[x-1,z],[x+1,z],[x,z-1],[x,z+1]]) for(let k=0;k<4;k++){ const v=placedWebVariant.get(webKey(nx,nz,k)); if(v!==undefined) banned.add(v); }
        const candidates=[]; for(let i=0;i<mats.webs.length;i++) if(!banned.has(i)) candidates.push(i);
        const pickList = candidates.length ? candidates : mats.webs.map((_,i)=>i);
        const variantIdx = pickList[Math.floor(Math.random()*pickList.length)];
        placedWebVariant.set(webKey(x,z,cIdx), variantIdx);

        _tmpObj.position.set(x*GRID + c.dx, WALL_H - 0.95, z*GRID + c.dz);
        _tmpObj.rotation.order='YXZ';
        _tmpObj.rotation.set(-Math.PI/3.6, c.ry, (Math.random()-0.5)*0.25);
        const s = 0.62 + Math.random()*0.32;
        _tmpObj.scale.set(s, s, 1);
        _tmpObj.updateMatrix();
        const geo = webPlaneGeo.clone().applyMatrix4(_tmpObj.matrix);
        const mat = mats.webs[variantIdx];
        if(!_webGeos.has(mat)) _webGeos.set(mat, []);
        _webGeos.get(mat).push(geo);
    });
    // Corridor webs
    const ewCorridor = wW && wE && !wN && !wS;
    const nsCorridor = wN && wS && !wW && !wE;
    if((ewCorridor || nsCorridor) && Math.random() <= 0.45){
        let vIdx; do { vIdx = Math.floor(Math.random()*mats.webs.length); } while(vIdx === lastCorridorVariant && mats.webs.length>1);
        lastCorridorVariant = vIdx;
        _tmpObj.position.set(x*GRID, WALL_H - 0.78, z*GRID);
        _tmpObj.rotation.set((Math.random()-0.5)*0.10, ewCorridor?0:Math.PI/2, (Math.random()-0.5)*0.10);
        const s = 0.85 + Math.random()*0.20;
        _tmpObj.scale.set(s, s, 1);
        _tmpObj.updateMatrix();
        const geo = corridorWebGeo.clone().applyMatrix4(_tmpObj.matrix);
        const mat = mats.webs[vIdx];
        if(!_webGeos.has(mat)) _webGeos.set(mat, []);
        _webGeos.get(mat).push(geo);
    }
}
// Merge all webs per material into single draw-call meshes
for(const [mat, geos] of _webGeos){
    if(!geos.length) continue;
    // T0.12 — normalize index presence so merge never fails on attribute mismatch
    const normalized = geos.map(g => g.index ? g.toNonIndexed() : g);
    const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(normalized, false);
    if(!merged) continue;
    const mesh = new THREE.Mesh(merged, mat);
    mesh.castShadow=false; mesh.receiveShadow=false;
    mesh.layers.set(1); mesh.frustumCulled=false;
    worldGroup.add(mesh);
    geos.forEach(g=>g.dispose());
}
_webGeos.clear();
}

// ── Batched furniture/rubble: merge ALL decor into a few draw calls ──────────
// Collect geometries per material, bake world transforms, merge once.
{
const _decorGeos = new Map(); // material → [BufferGeometry]
const _dm = new THREE.Matrix4(); // reusable

for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
    const cell = map[x][z];
    if(!cell || cell.type !== 'floor') continue;
    const isRoom = !!cell.room;
    const isHall = !!cell.hall;
    if(!isRoom && !isHall) continue;
    if(cell.roomType === 'temple' || cell.roomType === 'vault') {
        if(Math.random() > 0.06) continue;
    }
    const wN = isWallish(x, z-1), wS = isWallish(x, z+1);
    const wW = isWallish(x-1, z), wE = isWallish(x+1, z);
    if(!(wN||wS||wW||wE)) continue;
    const density = isHall ? 0.12 : 0.15;
    if(Math.random() > density) continue;

    const makers = isHall ? clutterMakers : allDecorMakers;
    const make = makers[Math.floor(Math.random()*makers.length)];
    const piece = make();
    let ox = 0, oz = 0;
    if(wN) oz -= GRID*0.32;
    if(wS) oz += GRID*0.32;
    if(wW) ox -= GRID*0.32;
    if(wE) ox += GRID*0.32;
    if(!ox && !oz){ ox = (Math.random()-0.5)*0.3; oz = (Math.random()-0.5)*0.3; }
    piece.position.set(x*GRID + ox, 0, z*GRID + oz);
    piece.rotation.y = Math.random()*Math.PI*2;
    piece.updateMatrixWorld(true);
    // Extract each child mesh geometry with baked world transform, group by material
    piece.traverse(o=>{
        if(!o.isMesh) return;
        const geo = o.geometry.clone();
        geo.applyMatrix4(o.matrixWorld);
        const mat = o.material;
        if(!_decorGeos.has(mat)) _decorGeos.set(mat, []);
        _decorGeos.get(mat).push(geo);
    });
}
// Merge per-material and add as single meshes
for(const [mat, geos] of _decorGeos){
    if(!geos.length) continue;
    // T0.12 — normalize index presence so merge never fails on attribute mismatch
    const normalized = geos.map(g => g.index ? g.toNonIndexed() : g);
    const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(normalized, false);
    if(!merged) continue;
    const mesh = new THREE.Mesh(merged, mat);
    mesh.castShadow = false; mesh.receiveShadow = true;
    mesh.layers.set(1);
    mesh.frustumCulled = false; // static — always in scene
    mesh.userData = {isDecor:true};
    worldGroup.add(mesh);
    // Free source geometries
    geos.forEach(g=>g.dispose());
}
_decorGeos.clear();
}

// ── Room Floor Decals — unified bloom-glow style ────────────────────────────
rooms.forEach(room=>{
    const dc=document.createElement('canvas'); dc.width=512; dc.height=512;
    const dctx=dc.getContext('2d');
    dctx.textAlign='center'; dctx.textBaseline='middle';

    // Hallway: just the BEWARE kanji centered. Other rooms: kanji + room id below.
    const isHall = (room.roomType === 'hallway');
    const mainGlyph = room.kanji || String(room.id);
    const mainY = isHall ? 256 : 220;
    const mainSize = isHall ? 360 : 300;

    // Helper: draw glowing kanji with multi-layer bloom
    const drawBloomGlyph = (glyph, cx, cy, size) => {
        // Outer halo
        dctx.shadowColor = 'rgba(120,255,210,0.85)';
        dctx.shadowBlur = 60;
        dctx.fillStyle = 'rgba(140,255,220,0.55)';
        dctx.font = `900 ${size}px serif`;
        dctx.fillText(glyph, cx, cy);
        // Mid bloom
        dctx.shadowBlur = 28;
        dctx.fillStyle = 'rgba(180,255,230,0.80)';
        dctx.fillText(glyph, cx, cy);
        // Sharp inner outline
        dctx.shadowBlur = 0;
        dctx.lineWidth = 5;
        dctx.strokeStyle = 'rgba(220,255,240,0.95)';
        dctx.strokeText(glyph, cx, cy);
    };
    drawBloomGlyph(mainGlyph, 256, mainY, mainSize);

    if(isHall){
        // English label below BEWARE kanji — small italic, same bloom
        dctx.save();
        dctx.shadowColor = 'rgba(120,255,210,0.7)';
        dctx.shadowBlur = 18;
        dctx.fillStyle = 'rgba(190,255,235,0.72)';
        dctx.font = 'italic 500 62px serif';
        dctx.fillText('Beware', 256, 356);
        dctx.shadowBlur = 0;
        dctx.strokeStyle = 'rgba(220,255,240,0.55)';
        dctx.lineWidth = 2;
        dctx.strokeText('Beware', 256, 356);
        dctx.restore();
    } else {
        // Room ID number below kanji — same magical bloom palette
        drawBloomGlyph(`#${room.id}`, 256, 410, 96);
    }

    const dtex=new THREE.CanvasTexture(dc);
    dtex.generateMipmaps=false; dtex.minFilter=THREE.LinearFilter;
    const decalMat = new THREE.MeshBasicMaterial({
        map:dtex, transparent:true, depthWrite:false,
        blending: THREE.AdditiveBlending  // additive so all decals glow against floor
    });
    // Hallway sigil shrunk 40% (now 0.768×GRID) — small, centered, doesn't

    const decalSize = isHall ? GRID*0.768 : GRID*1.6;
    const dm=new THREE.Mesh(
        new THREE.PlaneGeometry(decalSize, decalSize),
        decalMat
    );
    dm.rotation.x=-Math.PI/2;
    dm.position.set(room.center.x*GRID, 0.05, room.center.y*GRID);
    worldGroup.add(dm);
});

        for(let i=0;i<4;i++){
            const plank=new THREE.Mesh(new THREE.BoxGeometry(0.15+Math.random()*0.4,0.06,0.6+Math.random()*0.5),mat);
            plank.position.set((Math.random()-0.5)*0.5, 0.05+i*0.05, (Math.random()-0.5)*0.4);
            plank.rotation.y=Math.random()*Math.PI*2;
            plank.rotation.x=(Math.random()-0.5)*0.3;
            g.add(plank);
        }
        return g;
    }
    function buildIronBrazier(){
        const g=new THREE.Group();
        const bowl=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.20,0.15,10),ironMat);
        bowl.position.y=0.5; bowl.rotation.x=Math.random()>0.5?0.4:-0.4;
        g.add(bowl);
        const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.06,0.5,8),ironMat);
        stem.position.y=0.25; g.add(stem);
        const baseR=new THREE.Mesh(new THREE.TorusGeometry(0.18,0.04,6,12),ironMat);
        baseR.rotation.x=Math.PI/2; baseR.position.y=0.04;
        g.add(baseR);
        return g;
    }

    const builders = [buildBrokenChair, buildBrokenTable, buildBrokenVase, buildDebrisPile, buildIronBrazier];

    for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
        const cell=map[x][z];
        if(!cell||(cell.type!=='floor'&&!cell.hallway)) continue;
        // Must be directly adjacent (cardinal) to a wall (stone or shoji panel)
        const tN=map[x]?.[z-1]?.type, tS=map[x]?.[z+1]?.type;
        const tW=map[x-1]?.[z]?.type, tE=map[x+1]?.[z]?.type;
        const wN=tN==='wall'||tN==='shoji', wS=tS==='wall'||tS==='shoji';
        const wW=tW==='wall'||tW==='shoji', wE=tE==='wall'||tE==='shoji';
        if(!(wN||wS||wW||wE)) continue;
        const prob = cell.room ? 0.18 : 0.10;
        if(Math.random()>prob) continue;

        const builder = builders[Math.floor(Math.random()*builders.length)];
        const mat = fMats[Math.floor(Math.random()*fMats.length)];
        const grp = builder(mat);
        grp.userData={isDecor:true};

        // Push toward whichever wall is adjacent
        let ox=0, oz=0;
        if(wN) oz=-0.55; else if(wS) oz=0.55;
        if(wW) ox=-0.55; else if(wE) ox=0.55;
        ox += (Math.random()-0.5)*0.2;
        oz += (Math.random()-0.5)*0.2;
        grp.position.set(x*GRID+ox, 0, z*GRID+oz);
        grp.rotation.y = Math.random()*Math.PI*2;
        grp.traverse(c=>{if(c.isMesh){c.castShadow=false; c.receiveShadow=true; c.layers.set(1);}});
        worldGroup.add(grp);
    }
}
