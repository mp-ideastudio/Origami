// Ghostbuster ethereal shader — OPAQUE bluegreen spirit body with Fresnel
// rim glow. Face/body stays solid; rim edges glow cyan-mint.
function applyHoloLayer(mat){
    mat.transparent = true;         // 80% translucent spectral body
    mat.opacity = 0.20;
    mat.depthWrite = false;
    mat.side = THREE.DoubleSide;
    if(mat.color)    mat.color.set('#bce8de');         // pale icy bluegreen base
    if(mat.roughness!==undefined) mat.roughness = 1.0;  // fully matte — no specular reflection
    if(mat.metalness!==undefined) mat.metalness = 0.0;  // no metallic reflection
    if(mat.emissive!==undefined){
        mat.emissive.set('#3df0c8');                   // bluegreen ethereal glow
        mat.emissiveIntensity = 1.2;                  // brighter so it reads at 80% transp.
    }
    // Inject Fresnel rim-light: edges glow brighter (Ghostbuster halo).
    mat.onBeforeCompile = (shader) => {
        shader.uniforms.uRimColor = { value: new THREE.Color('#7df5d8') };
        shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>', '#include <common>\nuniform vec3 uRimColor;')
            .replace('#include <emissivemap_fragment>',
                ['#ifdef USE_EMISSIVEMAP',
                 '    vec4 emissiveMapColor = texture2D( emissiveMap, vUv );',
                 '    totalEmissiveRadiance *= emissiveMapColor.rgb;',
                 '#endif',
                 // Fresnel rim: brighter where view direction is grazing the surface.
                 'vec3 viewDirN = normalize(vViewPosition);',
                 'float fres = pow(1.0 - max(dot(normalize(normal), viewDirN), 0.0), 2.4);',
                 'totalEmissiveRadiance += uRimColor * fres * 1.6;',
                 // Slight tonal shift toward bluegreen everywhere
                 'diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.74,0.91,0.87), 0.35);'
                ].join('\n'));
    };
}

function scaleToHeight(obj,targetH){

// Kill mipmaps on every texture inside a GLTF scene — prevents Firefox
// "lazy initialization" warnings on model textures
function _killGltfMipmaps(root){
    root.traverse(child=>{
        if(!child.isMesh) return;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m=>{
            if(!m) return;
            ['map','normalMap','roughnessMap','metalnessMap','emissiveMap','aoMap','bumpMap','alphaMap'].forEach(k=>{
                const t = m[k];
                if(t && t.generateMipmaps !== false){
                    t.generateMipmaps = false;
                    t.minFilter = THREE.LinearFilter;
                    t.needsUpdate = true;
                }
            });
        });
    });
}

function buildMonsterEntity(sp, goblin, animations){
    const wrapper=new THREE.Group();
    wrapper.add(goblin);

    if(animations && animations.length>0){
        const mixer=new THREE.AnimationMixer(goblin);
        mixers.push(mixer);
        wrapper.userData.mixer=mixer;
        // Log available clips so we can see naming in browser console
        console.log('[Monster anims]', animations.map((a,i)=>i+':'+a.name+'('+a.duration?.toFixed(2)+'s)'));
        const _f=(rx)=>animations.find(a=>rx.test(a.name.toLowerCase()));
        // Try semantic names first; fall back to duration heuristic for NlaTrack-named exports.
        // Duration rules: shortest loop ≈ walk, ~3-5s ≈ idle, longest ≈ death, rest ≈ attack.
        const _byDuration = ()=>{
            const sorted = [...animations].sort((a,b)=>a.duration-b.duration);
            return {
                walk:  sorted[0],                                          // shortest = walk cycle
                idle:  sorted.find(c=>c.duration>=2.5&&c.duration<=6) || sorted[1] || sorted[0],
                slash: sorted.find(c=>c.duration>=0.5&&c.duration<2.5&&c!==sorted[0]) || sorted[2] || sorted[0],
                death: sorted[sorted.length-1]                             // longest = death/fall
            };
        };
        const _dur = animations.length > 0 ? _byDuration() : {};
        const idleClip =_f(/idle/)                                      || _dur.idle  || animations[1] || animations[0];
        const walkClip =_f(/walk|run|move/)                              || _dur.walk  || animations[2] || animations[0];
        const slashClip=_f(/slash|attack|strike|swing/)                  || _dur.slash || animations[3] || animations[2] || animations[0];
        // Death: try broad name patterns first, then duration heuristic (longest clip)
        const deathClip=_f(/death|die|dying|fall|fallen|ko|defeat|hit_react|stagger|knocked/)
                       || _dur.death
                       || animations[animations.length-1]
                       || animations[4] || animations[0];
        wrapper.userData.idleAction  = mixer.clipAction(idleClip);
        wrapper.userData.walkAction  = mixer.clipAction(walkClip);
        wrapper.userData.attackAction= mixer.clipAction(slashClip);
        wrapper.userData.slashAction = wrapper.userData.attackAction;
        wrapper.userData.bowAction   = mixer.clipAction(deathClip);
        wrapper.userData.deathClipDur= deathClip.duration; // expose duration for lie timer
        wrapper.userData._animKey=null;
        const ia=wrapper.userData.idleAction;
        if(ia){ia.reset();ia.setLoop(THREE.LoopRepeat);ia.play();}
        wrapper.userData._animKey='idle';
    }

    goblin.traverse(child=>{
        if(!child.isMesh) return;
        const mat=child.material, mn=(mat.name||'').toLowerCase(), cn=(child.name||'').toLowerCase();
        const isEye=['eye','pupil','sclera','cornea','lens','iris'].some(k=>mn.includes(k)||cn.includes(k));
        const isFace=['face','head','skin','mouth'].some(k=>mn.includes(k)||cn.includes(k));
        if(isEye){
            // Bright lit eyes — pure white emissive, no transparency
            child.material = makeGhostbusterEyeMat();
            // Add a subtle additive bloom halo behind the eye geometry
            try {
                const halo = new THREE.Mesh(
                    child.geometry.clone(),
                    new THREE.MeshBasicMaterial({
                        color: 0xddffff, transparent: true, opacity: 0.55,
                        blending: THREE.AdditiveBlending, depthWrite: false,
                        skinning: true
                    })
                );
                halo.scale.setScalar(1.35);
                halo.renderOrder = 11;
                child.add(halo);
            } catch(e){}
        } else {
            // Body / robe / face / hands — OPAQUE ghostbuster bluegreen
            if(Array.isArray(mat)) mat.forEach(applyHoloLayer); else applyHoloLayer(mat);
            // Face especially must stay opaque
            if(isFace){
                if(child.material) child.material.transparent = false;
            }
        }
        child.castShadow=false; child.receiveShadow=true;
        child.renderOrder = isEye ? 11 : 10;
    });

    scaleToHeight(goblin,1.53);
    goblin.updateMatrixWorld(true);
    const bbox=new THREE.Box3().setFromObject(goblin);
    if(bbox.min.y!==0) goblin.position.y-=bbox.min.y;
    goblin.rotation.y=-Math.PI/2;

    // Floor marker base — flat platform token, shared geo+mat for perf
    const monBase=new THREE.Group();
    const baseCore  = new THREE.Mesh(_pedCoreGeo,   _pedCoreMat);
    const discCap   = new THREE.Mesh(_pedCapGeo,    _pedCapMat);
    const borderMat = new THREE.MeshBasicMaterial({color:0xffffff}); // per-instance for aggro recolor
    const borderMesh= new THREE.Mesh(_pedBorderGeo, borderMat);
    const arrowMesh = new THREE.Mesh(_pedArrowGeo,  _pedArrowMat);
    discCap.position.y  = PED_H*0.5;
    baseCore.position.y = PED_H/2 + 0.005;
    borderMesh.rotation.x = -Math.PI/2;
    borderMesh.position.y = PED_H;
    arrowMesh.rotation.x  = -Math.PI/2;
    arrowMesh.position.set(0, PED_H + 0.012, 0);
    monBase.add(baseCore, discCap, borderMesh, arrowMesh);
    [baseCore, discCap, borderMesh, arrowMesh].forEach(m=>{
        m.layers.enable(0); m.layers.enable(1); m.layers.enable(3);
    });
    wrapper.userData.pedestalBorder = borderMesh; // expose for aggro recolor

    wrapper.userData={
        id:sp.id, name:sp.name||'Yakuza Goblin', type:'enemy', hp:sp.hp||50, maxHp:sp.maxHp||50,
        isHostile:sp.isHostile!==false, cx:sp.x, cz:sp.z,
        ...(wrapper.userData)
    };

    monBase.position.set(sp.x*GRID,0,sp.z*GRID);
    worldGroup.add(monBase); wrapper.userData.monBase=monBase;

    wrapper.position.set(sp.x*GRID,0,sp.z*GRID);
    worldGroup.add(wrapper);
    monsterWrappers.push(wrapper);
}

function _wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words = String(text).split(' '); let line = '';
    for(let n=0;n<words.length;n++){
        const testLine = line + words[n] + ' ';
        if(ctx.measureText(testLine).width > maxWidth && n>0){
            ctx.fillText(line, x, y); line = words[n] + ' '; y += lineHeight;
        } else line = testLine;
    }
    ctx.fillText(line, x, y);
}

// ── Build the BLACK playing-card canvas face (1:1 legacy) ────────────────────
function buildLegacyCardCanvas({title, displayKanji, displayDesc, displayAttr,
                                 displayTypePill, catId, themeColor,
                                 isShopItem=false, price=50}){
    const W = 256, H = 384;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // Base dark background (matching dark-mode CSS)
    ctx.fillStyle = '#232527';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(0, 0, W, H, 24); else ctx.rect(0,0,W,H);
    ctx.fill();

    // Thin theme-colored outer border (inset 1px to avoid corner tearing)
    ctx.strokeStyle = themeColor; ctx.lineWidth = 2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(1, 1, W-2, H-2, 23); else ctx.rect(1,1,W-2,H-2);
    ctx.stroke();
    // Subtle inner highlight ring
    ctx.strokeStyle = 'rgba(255,255,255,0.02)'; ctx.lineWidth = 2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(2, 2, W-4, H-4, 22); else ctx.rect(2,2,W-4,H-4);
    ctx.stroke();

    // Kanji (theme-colored, top-left)
    ctx.font = '900 32px sans-serif';
    ctx.fillStyle = themeColor;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(displayKanji, 20, 20);

    // Type pill (theme-colored bg, top-center)
    ctx.fillStyle = themeColor;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(W/2 - 45, 20, 90, 30, 8); else ctx.rect(W/2-45,20,90,30);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = '800 16px sans-serif';
    ctx.fillStyle = (catId === 'GOLD_COIN') ? '#000000' : '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(catId === 'GOLD_COIN' ? 'GOLD' : displayTypePill, W/2, 35);

    // Title (auto-scaling to prevent overflow)
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let titleSize = 32;
    ctx.font = `900 ${titleSize}px sans-serif`;
    while(ctx.measureText(title).width > W*0.85 && titleSize > 12){
        titleSize -= 1;
        ctx.font = `900 ${titleSize}px sans-serif`;
    }
    ctx.fillText(title, W/2, 90);

    // Desc (gray, centered, wrapped)
    ctx.font = '500 18px sans-serif'; ctx.fillStyle = '#999999';
    _wrapText(ctx, displayDesc, W/2, 130, W*0.8, 22);

    // Cache clean URL before punching the porthole
    const cleanCardURL = canvas.toDataURL();

    // Deep icon-cavity (porthole) hole cutout
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(W/2, H*0.58, 60, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Inner shadow gradient around the hole — gives the porthole depth
    const holeGrad = ctx.createRadialGradient(W/2, H*0.58, 45, W/2, H*0.58, 60);
    holeGrad.addColorStop(0, 'rgba(0,0,0,0)');
    holeGrad.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = holeGrad;
    ctx.beginPath(); ctx.arc(W/2, H*0.58, 60, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 3; ctx.stroke();

    // Solid black bottom block for attribute (no separator line)
    ctx.fillStyle = 'rgba(10, 10, 12, 0.8)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(1, H-50, W-2, 49, [0, 0, 23, 23]);
    else ctx.rect(1, H-50, W-2, 49);
    ctx.fill();

    // Attribute text inside the black block
    ctx.font = '800 18px sans-serif'; ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    _wrapText(ctx, displayAttr, W/2, H-25, W*0.9, 22);

    if(isShopItem){
        ctx.font = '900 24px sans-serif';
        ctx.fillStyle = '#FFD700';
        ctx.fillText(price + ' Gold', W/2, H-15);
    }

    return {canvas, cleanCardURL};
}

// ── Build a 3D loot icon (1:1 legacy port — every kind) ───────────────────────
function buildLegacyLootIcon({catId, elId, originalTitle}){
    const iconMesh = new THREE.Group();
    let customUpdate = null;

    // ── MAGIC LANTERN — flashlight w/ emissive lens ──────────────────────────
    if(originalTitle === 'MAGIC LANTERN'){
        const flashlight = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 0.6, 16),
            new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.8, roughness: 0.2})
        );
        flashlight.position.y = -0.1;
        const head = new THREE.Mesh(
            new THREE.CylinderGeometry(0.18, 0.1, 0.25, 16),
            new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.9, roughness: 0.1})
        );
        head.position.y = 0.42;
        flashlight.add(head);
        const lens = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.16, 0.05, 16),
            new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xffffee, emissiveIntensity: 2.0})
        );
        lens.position.y = 0.13;
        head.add(lens);
        iconMesh.add(flashlight);
        const lanternLight = new THREE.PointLight(0xfff5e0, 2.0, 10);
        lanternLight.position.set(0, 1, 1.5);
        iconMesh.add(lanternLight);
        customUpdate = (t, m) => {
            m.rotation.x = Math.sin(t * 1.5) * 0.1;
            m.rotation.y = t * 1.0;
            m.rotation.z = Math.PI / 4; // slanted
        };
    }
    // ── EARTH — bouncing dodecahedron ─────────────────────────────────────────
    else if(elId === 'EARTH'){
        const rock = new THREE.Mesh(
            new THREE.DodecahedronGeometry(1.6, 2),
            new THREE.MeshStandardMaterial({color: 0x5C4033, roughness: 0.8, flatShading: true})
        );
        iconMesh.add(rock);
        customUpdate = (t) => {
            rock.rotation.x = t * 1.8;
            rock.position.y = Math.abs(Math.sin(t * 3)) * 1.2;
        };
    }
    // ── FIRE — icosahedron core + 60 swirling flame tetrahedra ────────────────
    else if(elId === 'FIRE'){
        const core = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.85, 1),
            new THREE.MeshStandardMaterial({color: 0xb71c1c, emissive: 0x4a0000,
                emissiveIntensity: 3, flatShading: true})
        );
        iconMesh.add(core);
        const flames = [];
        for(let i=0; i<60; i++){
            const flameColor = i%3===0 ? 0xffea00 : (i%2===0 ? 0xff4500 : 0xb71c1c);
            const emColor    = i%3===0 ? 0xffea00 : 0xff4500;
            const s = new THREE.Mesh(
                new THREE.TetrahedronGeometry(0.28, 0),
                new THREE.MeshStandardMaterial({
                    color: flameColor, emissive: emColor, emissiveIntensity: 2.5,
                    transparent: true, opacity: 0.9, depthWrite: false,
                    blending: THREE.AdditiveBlending, flatShading: true
                })
            );
            const ang = (i/60) * Math.PI*2, rad = 0.2 + Math.random()*0.45;
            s.position.set(Math.cos(ang)*rad, 0.3, Math.sin(ang)*rad);
            iconMesh.add(s);
            flames.push({m:s, s:3+Math.random()*6, o:Math.random()*Math.PI, rs:(Math.random()-0.5)*2});
        }
        customUpdate = (t) => {
            core.rotation.y = t * 0.25;
            core.scale.setScalar(1 + Math.sin(t*3)*0.08);
            flames.forEach(f => {
                f.m.rotation.x += f.rs * 0.005;
                f.m.rotation.y += f.rs * 0.005;
                f.m.position.y = 0.3 + ((Math.sin(t*(f.s*0.5)+f.o)+1)*0.8);
                const sc = Math.max(0.1, 1 - (f.m.position.y/1.5));
                f.m.scale.set(sc*1.5, sc*2.5, sc*1.5);
            });
        };
    }
    // ── WIND — twin-spiral tornado made of tube geometry ──────────────────────
    else if(elId === 'WIND'){
        const tornado = new THREE.Group();
        const mat = new THREE.MeshBasicMaterial({color: 0xcccccc, transparent: true,
            opacity: 0.8, side: THREE.DoubleSide});
        for(let i=0; i<2; i++){
            const pts = [];
            const phase = (i/2) * Math.PI*2;
            for(let j=0; j<=40; j++){
                const h = j/40;
                const r = Math.pow(h, 2.0)*1.5 + 0.2;
                const y = (h - 0.5) * 2.5;
                const angle = h * Math.PI*12 + phase;
                pts.push(new THREE.Vector3(Math.cos(angle)*r, y, Math.sin(angle)*r));
            }
            const curve = new THREE.CatmullRomCurve3(pts);
            const geo = new THREE.TubeGeometry(curve, 40, 0.075, 6, false);
            tornado.add(new THREE.Mesh(geo, mat));
        }
        tornado.position.y = -0.2;
        iconMesh.add(tornado);
        customUpdate = (t) => {
            tornado.rotation.y = t * -3.0;
            tornado.rotation.x = Math.sin(t*3.5) * 0.15;
        };
    }
    // ── WATER — animated fluid sphere with vertex-color waves ─────────────────
    else if(elId === 'WATER'){
        const geo = new THREE.SphereGeometry(1.75, 64, 64);
        geo.computeVertexNormals();
        const mat = new THREE.MeshStandardMaterial({
            color: 0xffffff, roughness: 0.1, metalness: 0.1,
            vertexColors: true, emissive: 0x0d6efd, emissiveIntensity: 0.3
        });
        const pos = geo.attributes.position;
        const originalYs = new Float32Array(pos.count);
        for(let i=0;i<pos.count;i++) originalYs[i] = pos.getY(i);
        geo.setAttribute('originalY', new THREE.BufferAttribute(originalYs, 1));
        geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pos.count*3), 3));
        const fluid = new THREE.Mesh(geo, mat);
        iconMesh.add(fluid);
        const _white = new THREE.Color(0xffffff);
        const _blue  = new THREE.Color(0x0d6efd);
        const _deep  = new THREE.Color(0x0a58ca);
        customUpdate = (t) => {
            const p = geo.attributes.position;
            const oy = geo.attributes.originalY;
            const c  = geo.attributes.color;
            for(let i=0;i<p.count;i++){
                const x = p.getX(i), z = p.getZ(i), y0 = oy.getX(i);
                const w = Math.sin(x*3.0 + t*4)*0.15 + Math.cos(z*2.5 + t*3.5)*0.1
                          + Math.sin((x+z)*5.0 + t*5.0)*0.05;
                const waterLevel = -0.2;
                if(y0 > waterLevel){
                    const dist2D = Math.sqrt(x*x + z*z);
                    const maxR = Math.sqrt(1.75*1.75 - waterLevel*waterLevel);
                    if(dist2D < maxR){
                        p.setY(i, waterLevel + w);
                        const mix = (w + 0.25) / 0.5;
                        const vc = _deep.clone().lerp(_white, mix);
                        c.setXYZ(i, vc.r, vc.g, vc.b);
                    } else { p.setY(i, y0); c.setXYZ(i, _blue.r, _blue.g, _blue.b); }
                } else { p.setY(i, y0); c.setXYZ(i, _blue.r, _blue.g, _blue.b); }
            }
            p.needsUpdate = true; c.needsUpdate = true;
            geo.computeVertexNormals();
        };
    }
    // ── KATANA / SLASH — sword with additive glow ─────────────────────────────
    else if(catId === 'KATANA' || originalTitle === 'SLASH'){
        const addGlow = (mesh) => {
            const glow = new THREE.Mesh(mesh.geometry.clone(),
                new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true,
                    opacity: 0.15, depthWrite: false, blending: THREE.AdditiveBlending}));
            glow.scale.setScalar(1.2); mesh.add(glow);
        };
        const bs = new THREE.Shape();
        bs.moveTo(0,0); bs.quadraticCurveTo(-0.1,1.0,-0.05,2.0);
        bs.lineTo(0.15,1.85); bs.quadraticCurveTo(0.2,1.0,0.2,0); bs.lineTo(0,0);
        const bladeGeo = new THREE.ExtrudeGeometry(bs, {depth:0.1, bevelEnabled:true,
            bevelThickness:0.03, bevelSize:0.03, bevelSegments:2});
        bladeGeo.center();
        const blade = new THREE.Mesh(bladeGeo,
            new THREE.MeshBasicMaterial({color: 0xffffff, side: THREE.DoubleSide}));
        blade.position.y = 1.0; addGlow(blade);
        const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.8,12),
            new THREE.MeshBasicMaterial({color: 0x8b0000, side: THREE.DoubleSide}));
        hilt.position.y = -0.4; addGlow(hilt);
        const guard = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.05,16),
            new THREE.MeshBasicMaterial({color: 0xffd700, side: THREE.DoubleSide}));
        addGlow(guard);
        const sword = new THREE.Group();
        sword.add(hilt, blade, guard);
        sword.position.set(0, -0.3, 0);
        sword.scale.set(0.8, 0.8, 0.1);
        iconMesh.add(sword);
        customUpdate = (t) => {
            sword.rotation.y = t * 1.5;
            sword.position.y = -0.3 + Math.sin(t*2)*0.1;
        };
    }
    // ── MISSILE / SHURIKEN — 8-point star ─────────────────────────────────────
    else if(catId === 'MISSILE' || originalTitle === 'SHURIKEN'){
        const addGlow = (mesh) => {
            const glow = new THREE.Mesh(mesh.geometry.clone(),
                new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true,
                    opacity: 0.15, depthWrite: false, blending: THREE.AdditiveBlending}));
            glow.scale.set(1.15, 1.15, 1.5); mesh.add(glow);
        };
        const star = new THREE.Shape();
        const oR = 1.8, iR = 0.45;
        for(let i=0;i<8;i++){
            const a = (i*Math.PI)/4, r = i%2===0 ? oR : iR;
            if(i===0) star.moveTo(Math.cos(a)*r, Math.sin(a)*r);
            else star.lineTo(Math.cos(a)*r, Math.sin(a)*r);
        }
        const geo = new THREE.ExtrudeGeometry(star, {depth:0.1, bevelEnabled:true,
            bevelThickness:0.03, bevelSize:0.03, bevelSegments:2});
        geo.center();
        const starMesh = new THREE.Mesh(geo,
            new THREE.MeshStandardMaterial({color: 0xdddddd, metalness:0.5,
                roughness:0.2, emissive:0x666666, side:THREE.DoubleSide}));
        addGlow(starMesh);
        const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.4,16),
            new THREE.MeshBasicMaterial({color: 0x000000, side: THREE.DoubleSide}));
        hole.rotation.x = Math.PI/2;
        const sg = new THREE.Group();
        sg.add(starMesh, hole);
        sg.scale.set(0.8, 0.8, 0.1);
        const star1 = sg, star2 = sg.clone();
        star2.rotation.y = Math.PI;
        iconMesh.add(star1, star2);
        customUpdate = (t) => {
            star1.rotation.z = -t*0.5;
            star2.rotation.z = -t*0.5;
        };
    }
    // ── SAMURAI HELMET (Kabuto) — dome + face guard + crescent horns ──────────
    else if(originalTitle === 'SAMURAI HELMET'){
        const addOutline = (mesh) => {
            const edges = new THREE.EdgesGeometry(mesh.geometry);
            mesh.add(new THREE.LineSegments(edges,
                new THREE.LineBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.8})));
        };
        const helmetMat = new THREE.MeshStandardMaterial({color: 0xffffff,
            roughness:0.2, metalness:0.3, side:THREE.DoubleSide});
        const goldMat = new THREE.MeshStandardMaterial({color: 0xffaa00,
            metalness:0.8, roughness:0.2, side:THREE.DoubleSide});
        const dome = new THREE.Mesh(
            new THREE.SphereGeometry(1.0, 16, 16, 0, Math.PI*2, 0, Math.PI/2),
            helmetMat);
        dome.position.y = -0.2; addOutline(dome);
        const guard = new THREE.Mesh(
            new THREE.CylinderGeometry(1.1, 1.2, 0.4, 16, 1, false, Math.PI*0.75, Math.PI*1.5),
            helmetMat);
        guard.position.y = -0.4; addOutline(guard);
        const hornShape = new THREE.Shape();
        hornShape.moveTo(0,0);
        hornShape.quadraticCurveTo(0.8, 0.8, 1.2, 1.8);
        hornShape.quadraticCurveTo(0.8, 0.4, 0.2, 0.2);
        hornShape.lineTo(0,0);
        const hornGeo = new THREE.ExtrudeGeometry(hornShape, {depth:0.1, bevelEnabled:true,
            bevelThickness:0.03, bevelSize:0.03, bevelSegments:2});
        const horn1 = new THREE.Mesh(hornGeo, goldMat);
        horn1.position.set(0, 0.3, 0.9); horn1.rotation.z = -0.3; horn1.rotation.y = 0.2;
        addOutline(horn1);
        const horn2 = new THREE.Mesh(hornGeo, goldMat);
        horn2.position.set(0, 0.3, 0.9); horn2.rotation.y = Math.PI - 0.2; horn2.rotation.z = -0.3;
        addOutline(horn2);
        const boss = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), goldMat);
        boss.position.set(0, 0.4, 1.0); addOutline(boss);
        iconMesh.add(dome, guard, horn1, horn2, boss);
        iconMesh.scale.set(1.0, 1.0, 0.1);
        customUpdate = (t, m) => { m.rotation.y = t * 1.5; };
    }
    // ── SHIELD / ARMOR — extruded shield shape ────────────────────────────────
    else if(originalTitle === 'SHIELD' || catId === 'SHIELD' || catId === 'ARMOR'){
        const addOutline = (mesh) => {
            const edges = new THREE.EdgesGeometry(mesh.geometry);
            mesh.add(new THREE.LineSegments(edges,
                new THREE.LineBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.8})));
        };
        const ss = new THREE.Shape();
        ss.moveTo(0, -1.2);
        ss.quadraticCurveTo(1.2, -0.2, 1.0, 1.0);
        ss.lineTo(-1.0, 1.0);
        ss.quadraticCurveTo(-1.2, -0.2, 0, -1.2);
        const sg = new THREE.ExtrudeGeometry(ss, {depth:0.1, bevelEnabled:true,
            bevelThickness:0.03, bevelSize:0.03, bevelSegments:2});
        sg.center();
        const shield = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({color: 0xffffff,
            metalness:0.5, roughness:0.3, emissive:0x444444, side:THREE.DoubleSide}));
        shield.scale.set(1.4, 1.4, 0.14); addOutline(shield);
        const innerGeo = new THREE.ExtrudeGeometry(ss, {depth:0.1, bevelEnabled:false});
        innerGeo.center();
        const inner = new THREE.Mesh(innerGeo, new THREE.MeshStandardMaterial({
            color:0xffffff, metalness:0.1, roughness:0.2, side:THREE.DoubleSide}));
        inner.scale.set(0.5, 0.5, 1.0);
        addOutline(inner);
        shield.add(inner);
        iconMesh.add(shield);
        customUpdate = (t) => { shield.rotation.y = t * 1.5; };
    }
    // ── POTION / SCROLL — glass flask with sloshing liquid ────────────────────
    else if(originalTitle === 'POTION' || catId === 'SCROLL'){
        const potion = new THREE.Group();
        const glass = new THREE.MeshStandardMaterial({color: 0x888888, roughness: 0.1,
            metalness: 0.4, transparent: true, opacity: 0.4, depthWrite: false});
        const cork  = new THREE.MeshStandardMaterial({color: 0x8b5a2b, roughness: 0.9, metalness: 0.1});
        const liq   = new THREE.MeshBasicMaterial({color: 0x00ff44, transparent: true,
            opacity: 0.9, blending: THREE.AdditiveBlending});
        const base = new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 16), glass);
        const liquid = new THREE.Mesh(
            new THREE.SphereGeometry(0.85, 16, 16, 0, Math.PI*2, Math.PI/2, Math.PI/2), liq);
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 0.8, 16), glass);
        neck.position.y = 1.0;
        const lip = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.1, 8, 16), glass);
        lip.position.y = 1.4; lip.rotation.x = Math.PI/2;
        const corkMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.4, 12), cork);
        corkMesh.position.y = 1.55;
        potion.add(base, liquid, neck, lip, corkMesh);
        potion.position.y = -0.4;
        iconMesh.add(potion);
        customUpdate = (t) => {
            potion.rotation.y = t * 1.5;
            potion.rotation.z = Math.sin(t*2) * 0.1;
            liquid.rotation.x = Math.sin(t*5) * 0.2;
            liquid.rotation.z = Math.cos(t*4) * 0.2;
        };
    }
    // ── GOLD COIN — yen-style extruded gold w/ square hole, gradient texture ──
    else if(catId === 'GOLD_COIN'){
        const coinShape = new THREE.Shape();
        coinShape.arc(0, 0, 1.68, 0, Math.PI*2, false);
        const hole = new THREE.Path();
        hole.moveTo(-0.48, 0.48); hole.lineTo(0.48, 0.48);
        hole.lineTo(0.48, -0.48); hole.lineTo(-0.48, -0.48); hole.lineTo(-0.48, 0.48);
        coinShape.holes.push(hole);
        const coinGeo = new THREE.ExtrudeGeometry(coinShape, {depth: 0.8, bevelEnabled: true,
            bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 2});
        coinGeo.center();
        // Faux-metal gradient
        const tCanvas = document.createElement('canvas');
        tCanvas.width = 128; tCanvas.height = 128;
        const tCtx = tCanvas.getContext('2d');
        const grd = tCtx.createLinearGradient(0, 0, 128, 128);
        grd.addColorStop(0, '#d4af37'); grd.addColorStop(0.3, '#b8860b');
        grd.addColorStop(0.5, '#d4af37'); grd.addColorStop(0.7, '#6b4f00');
        grd.addColorStop(1, '#b8860b');
        tCtx.fillStyle = grd; tCtx.fillRect(0, 0, 128, 128);
        const coin = new THREE.Mesh(coinGeo,
            (()=>{ const _t=new THREE.CanvasTexture(tCanvas); _t.generateMipmaps=false; _t.minFilter=THREE.LinearFilter; return new THREE.MeshBasicMaterial({map:_t, side:THREE.DoubleSide}); })());
        iconMesh.add(coin);
        customUpdate = () => {}; // legacy: coin is static
    }
    // ── DICE fallback ─────────────────────────────────────────────────────────
    else {
        const die = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 1.6, 1.6),
            new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.2, metalness: 0.1})
        );
        iconMesh.add(die);
        customUpdate = (t, m) => {
            m.rotation.y = t * 1.5;
            m.rotation.x = Math.sin(t*2) * 0.5;
        };
    }

    return {iconMesh, customUpdate};
}

// ── spawnLootCard — full legacy signature ────────────────────────────────────
// (gx, gz, catId, title, desc, kanji, attr, isShopItem?, price?)
function spawnLootCard(gx, gz, catId, inTitle, desc, kanji, attr, isShopItem=false, price=50){
    const originalTitle = inTitle;
    let elId = catId;
    let displayTypePill = catId.toUpperCase();
    let displayKanji = kanji, displayDesc = desc, displayAttr = attr;
    let title = inTitle;

    // SHURIKEN gets a random qty x3-x8
    let qty = 1;
    if(title === 'SHURIKEN'){
        qty = Math.floor(Math.random()*6) + 3;
        title = `SHURIKEN x${qty}`;
    }

    const themeColor = getCardThemeColor(catId, elId);

    // Build canvas card face
    const {canvas, cleanCardURL} = buildLegacyCardCanvas({
        title, displayKanji, displayDesc, displayAttr,
        displayTypePill, catId, themeColor, isShopItem, price
    });
    const tex = new THREE.CanvasTexture(canvas);
    tex.generateMipmaps=false; tex.minFilter=THREE.LinearFilter;

    const cardMat = new THREE.MeshPhysicalMaterial({
        map: tex, transparent: true, alphaTest: 0.5,
        roughness: 0.9, metalness: 0.05,
        clearcoat: 0.0, clearcoatRoughness: 1.0, ior: 1.1
    });

    const cardGroup = new THREE.Group();

    const edgeColor = getCardEdgeColor(elId, catId);
    const edgeMat = new THREE.MeshStandardMaterial({
        color: edgeColor,
        roughness: catId === 'GOLD_COIN' ? 0.2 : 0.5,
        metalness: catId === 'GOLD_COIN' ? 1.0 : 0.0
    });

    // Rounded card shape with circular hole punched (the porthole)
    const shape = new THREE.Shape();
    const r = 0.075, w = 0.8, h = 1.2, sx = -w/2, sy = -h/2;
    shape.moveTo(sx, sy + r);
    shape.lineTo(sx, sy + h - r);
    shape.quadraticCurveTo(sx, sy + h, sx + r, sy + h);
    shape.lineTo(sx + w - r, sy + h);
    shape.quadraticCurveTo(sx + w, sy + h, sx + w, sy + h - r);
    shape.lineTo(sx + w, sy + r);
    shape.quadraticCurveTo(sx + w, sy, sx + w - r, sy);
    shape.lineTo(sx + r, sy);
    shape.quadraticCurveTo(sx, sy, sx, sy + r);
    const holePath = new THREE.Path();
    holePath.absarc(0, -0.096, 0.1875, 0, Math.PI*2, true);
    shape.holes.push(holePath);

    const edgeGeo = new THREE.ExtrudeGeometry(shape, {depth: 0.02, bevelEnabled: false});
    edgeGeo.translate(0, 0, -0.01);
    cardGroup.add(new THREE.Mesh(edgeGeo, edgeMat));

    const front = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.2), cardMat);
    front.position.z = 0.011;
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.2), cardMat);
    back.rotation.y = Math.PI; back.position.z = -0.011;
    cardGroup.add(front, back);

    // Build the 3D icon and embed it in a glass dome
    const iconModel = buildLegacyLootIcon({catId, elId, originalTitle});
    const iconWrapper = new THREE.Group();

    // Legacy scale: 0.07 default, 0.35 for MAGIC LANTERN (flashlight body is bigger)
    let EXACT_SCALE = 0.07;
    if(originalTitle === 'MAGIC LANTERN') EXACT_SCALE = 0.35;

    const frontIcon = iconModel.iconMesh;
    frontIcon.scale.setScalar(EXACT_SCALE);
    frontIcon.position.set(0, -0.096, 0); // dead center in hole
    frontIcon.traverse(child => {
        if(child.isMesh){
            if(child.material && !Array.isArray(child.material)){
                child.material.transparent = true;
                child.material.side = THREE.DoubleSide;
                child.material.needsUpdate = true;
            }
            child.renderOrder = 20;
        }
    });
    iconWrapper.add(frontIcon);

    const glassBubble = new THREE.Mesh(_sharedGlassBubbleGeo, _sharedGlassBubbleMat);
    glassBubble.position.set(0, -0.096, 0);
    glassBubble.scale.set(1, 1, 0.75);
    glassBubble.renderOrder = 10;
    iconWrapper.add(glassBubble);

    cardGroup.add(iconWrapper);

    cardGroup.position.set(gx*GRID, 1.2, gz*GRID);
    cardGroup.userData = {
        type: 'loot_cards',
        floatTimer: Math.random() * Math.PI * 2,
        basePos: 1.2,
        gridX: gx, gridZ: gz,
        cardDataURL: canvas.toDataURL(),
        cleanCardURL,
        iconMesh: iconWrapper,
        customUpdate: (t) => { if(iconModel.customUpdate) iconModel.customUpdate(t, frontIcon); },
        cardData: {el: catId, name: inTitle, desc, kanji, attr, themeClr: themeColor, qty},
        cardName: title,
        isShopItem, price
    };
    worldGroup.add(cardGroup);
    lootItems.push(cardGroup);
    return cardGroup;
}

function updateLootCards(dt){
    for(let i = lootItems.length-1; i>=0; i--){
        const c = lootItems[i];
        c.userData.floatTimer += dt * 2.0;
        const t = c.userData.floatTimer;
        c.position.y = c.userData.basePos + Math.sin(t)*0.18;
        c.rotation.y += dt * (c.userData.cardData.el === 'GOLD_COIN' ? 1.4 : 0.85);
        if(c.userData.customUpdate) c.userData.customUpdate(t);

        // Pickup proximity
        const dist = Math.hypot(c.position.x - px, c.position.z - pz);
        if(dist < 1.0){
            const name = c.userData.cardName;
            window.parent.postMessage({type:'ADD_CARD', card: name}, '*');
            window.parent.postMessage({type:'LOG_EVENT', logType:'system', text:`Picked up ${name}!`}, '*');
            autoWalkInterrupt = true;
            // MAGIC LANTERN — activate hyper-cinematic flashlight cone
            if(name === 'MAGIC LANTERN') activateMagicLantern();
            c.traverse(o => {
                if(o.geometry) o.geometry.dispose();
                if(o.material){
                    if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
                    else if(o.material !== _sharedGlassBubbleMat) o.material.dispose();
                }
            });
            worldGroup.remove(c);
            lootItems.splice(i, 1);
        }
    }
}

// ── Monster push-back impulse (collision response on hit) ───────────────────
function _pushMonster(wrapper, strength){
    if(!wrapper) return;
    const dx = wrapper.position.x - camera.position.x;
    const dz = wrapper.position.z - camera.position.z;
    const len = Math.sqrt(dx*dx+dz*dz) || 1;
    // Give the monster's userData an impulse vector; tickMonsterAI drains it
    wrapper.userData._knockImpulseX = (dx/len) * strength;
    wrapper.userData._knockImpulseZ = (dz/len) * strength;
    wrapper.userData._knockT = 0.22; // seconds of knockback
}

// ── 3D WebGL melee VFX — streaking arc planes spawned in world space ─────────
function _spawnMeleeArc(opts){
    // opts: { count, widthFn, heightFn, colorFn, rotFn, ttl, blend, offsetFwdFn }
    const fwd = new THREE.Vector3(Math.sin(rot), 0, -Math.cos(rot));
    const right = new THREE.Vector3(Math.cos(rot), 0, Math.sin(rot));
    const origin = camera.position.clone().addScaledVector(fwd, 0.55);
    origin.y = EYE_HEIGHT * 0.72;
    for(let i=0; i<opts.count; i++){
        const t = opts.count===1 ? 0.5 : i/(opts.count-1);
        const w = opts.widthFn(t), h = opts.heightFn(t);
        const col = opts.colorFn(t);
        const arc = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({
                color:col, transparent:true, opacity:0.88,
                blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
            })
        );
        const sideOffset = opts.sideOffset ? opts.sideOffset(t) : 0;
        arc.position.copy(origin).addScaledVector(right, sideOffset);
        arc.position.addScaledVector(fwd, opts.fwdOffset ? opts.fwdOffset(t) : 0);
        arc.rotation.y = rot + (opts.rotFn ? opts.rotFn(t) : 0);
        arc.rotation.z = opts.tiltFn ? opts.tiltFn(t) : 0;
        scene.add(arc);
        const ttl = opts.ttl || 0.22;
        const delay = (opts.stagger||0)*i;
        let elapsed = -delay;
        const tick = ()=>{
            elapsed += 0.016;
            if(elapsed < 0){ requestAnimationFrame(tick); return; }
            const p = Math.min(1, elapsed/ttl);
            arc.material.opacity = 0.88*(1-p*p);
            arc.position.addScaledVector(fwd, 0.04);
            if(p < 1) requestAnimationFrame(tick);
            else scene.remove(arc);
        };
        requestAnimationFrame(tick);
    }
}

// ── Line-of-sight DDA: returns true if no wall blocks the path a→b ──────────
function _hasLineOfSight(ax, az, bx, bz){
    let gx = ax/GRID, gz = az/GRID;
    const dx = bx/GRID - gx, dz = bz/GRID - gz;
    const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dz)) * 2);
    if(steps === 0) return true;
    const sx = dx/steps, sz = dz/steps;
    for(let i=1; i<steps; i++){
        gx += sx; gz += sz;
        const t = map[Math.round(gx)]?.[Math.round(gz)]?.type;
        if(t === 'wall' || t === 'shoji') return false;
    }
    return true;
}

// ── Melee card executor ───────────────────────────────────────────────────────
function _executeMeleeCard(cardName){
    const n = cardName.toUpperCase();
    const isHeavy  = /HEAVY/.test(n);
    const isThrust = /THRUST/.test(n);
    const isDefend = /DEFEND/.test(n);
    const vfxType  = isHeavy ? 'HEAVY' : isThrust ? 'THRUST' : isDefend ? 'DEFEND' : 'SLASH';

    if(isDefend){
        _spawnMeleeVFX('DEFEND');
        addCameraTrauma(0.05);
        window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
            text:'🛡️ Guard raised! Damage reduced by <b>75%</b> for 2 seconds.'},'*');
        return;
    }

    // Track last-used melee action (DEFEND doesn't replace it)
    _lastMeleeAction = cardName;

    const MELEE_RANGE = isHeavy ? 3.0 : isThrust ? 3.8 : 2.8;
    let best=null, bestD=Infinity;
    for(const w of monsterWrappers){
        if(w.userData.isDead) continue;
        const d = camera.position.distanceTo(w.position);
        if(d < MELEE_RANGE && d < bestD){ bestD=d; best=w; }
    }

    _spawnMeleeVFX(vfxType);

    if(isHeavy){
        addCameraTrauma(0.55); triggerHitStop(90);
        for(const w of monsterWrappers){
            if(w.userData.isDead) continue;
            if(camera.position.distanceTo(w.position) < MELEE_RANGE){
                _applyMonsterDamage(w, calcDamage('HEAVY ATTACK'), 'DEFAULT');
                _pushMonster(w, 4.5);
                _spawnHitBurst(w.position.clone().setY(1.2), 'DEFAULT');
            }
        }
    } else if(best){
        _applyMonsterDamage(best, calcDamage(cardName), 'DEFAULT');
        _pushMonster(best, isThrust ? 5.5 : 3.0);
        _spawnHitBurst(best.position.clone().setY(1.2), 'DEFAULT');
        addCameraTrauma(isThrust ? 0.28 : 0.22);
        triggerHitStop(isThrust ? 65 : 52);
    } else {
        addCameraTrauma(0.08);
    }

    window.parent.postMessage({type:'COMBAT_ATTACK', action:cardName},'*');
}

function addCameraTrauma(amt){ cameraTrauma=Math.min(cameraTrauma+amt,1.0); }
function triggerHitStop(ms){ hitStopUntil=performance.now()+ms; }

// ── Message Contract ───────────────────────────────────────────────────────────
window.addEventListener('message',e=>{
    if(!e.data) return;
    const d=e.data;
    if(d.type==='KEY_DOWN'){keys[d.key]=true;keys[(d.key||'').toLowerCase()]=true;if(d.code)keys[d.code]=true;}
    if(d.type==='KEY_UP'){keys[d.key]=false;keys[(d.key||'').toLowerCase()]=false;if(d.code)keys[d.code]=false;}
    if(d.type==='PIP_SYNC_RECT'){
        _pipRect={width:d.width,height:d.height,left:d.left,top:d.top,bottom:d.bottom};
        // Position the WRAPPER so both canvases + cinematic overlays follow.
        const pf=document.getElementById('pip-frame');
        if(pf){
            pf.style.display='block';
            pf.style.left=d.left+'px'; pf.style.top=d.top+'px';
            pf.style.width=d.width+'px'; pf.style.height=d.height+'px';
        }
    }
    if(d.type==='PIP_TOGGLE' || (d.type==='FPV_ACTION' && d.action==='MAP')){
        cameraMode = (cameraMode==='fpv') ? 'topdown' : 'fpv';
        modeAlphaTarget = (cameraMode==='topdown') ? 1 : 0;
        window.parent.postMessage({type:'LOG_EVENT',logType:'system',
            text:`🗺 ${cameraMode==='fpv'?'First Person View':'Top-Down View • '+topDownPreset.toUpperCase()}`}, '*');
        _pipPan={x:0,z:0};
    }
    if(d.type==='PIP_ZOOM'){_pipLastInteractionTime=Date.now();_pipZoomScale=Math.max(0.2,Math.min(2.0,_pipZoomScale+(d.delta||0)*0.1));_pipSaveState();}
    if(d.type==='PIP_ROTATE'){_pipLastInteractionTime=Date.now();_pipRot.theta-=(d.dx||0)*0.01;_pipRot.phi=Math.max(0.1,Math.min(Math.PI/2-0.05,_pipRot.phi-(d.dy||0)*0.01));_pipSaveState();}
    if(d.type==='PIP_PAN'){_pipLastInteractionTime=Date.now();const sp=0.05/(_pipZoomScale||1);_pipPan.x+=-(d.dx||0)*sp*Math.cos(_pipRot.theta)+(d.dy||0)*sp*Math.sin(_pipRot.theta);_pipPan.z+=(d.dx||0)*sp*Math.sin(_pipRot.theta)+(d.dy||0)*sp*Math.cos(_pipRot.theta);_pipSaveState();}
    if(d.type==='PIP_PERSPECTIVE'){
        const p = TOPDOWN_PRESETS[d.preset];
        if(p){
            targetTopDownPitch = p.pitch;
            targetTopDownYaw   = p.yaw;
            topDownPreset = d.preset;
            try { localStorage.setItem('origami.topdownPreset', d.preset); } catch(e){}
            // Picking a preset implicitly switches into top-down view
            if(cameraMode !== 'topdown'){
                cameraMode = 'topdown';
                modeAlphaTarget = 1;
            }
            window.parent.postMessage({type:'LOG_EVENT',logType:'system',
                text:`🔭 Camera: ${d.preset.toUpperCase()} angle`}, '*');
        }
    }
    if(d.type==='MOON_PHASE'){
        const ml=document.getElementById('moonphase-label');
        if(ml) ml.textContent=d.phase;
        const mk=document.getElementById('moonphase-kanji');
        if(mk){
            const kanjiByPhase={
                'NEW MOON PHASE':'新月',
                'WAXING CRESCENT MOON PHASE':'三日月',
                'FIRST QUARTER MOON PHASE':'上弦の月',
                'WAXING GIBBOUS MOON PHASE':'十三夜月',
                'FULL MOON PHASE':'満月',
                'WANING GIBBOUS MOON PHASE':'居待月',
                'LAST QUARTER MOON PHASE':'下弦の月',
                'WANING CRESCENT MOON PHASE':'有明月'
            };
            mk.textContent = kanjiByPhase[d.phase] || '月';
        }
    }
    if(d.type==='MONSTER_ATTACK'&&d.damage>0){
        // Shield absorbs 75% — show parry flash instead of blood
        if(_shieldActive){
            _spawnMeleeVFX('THRUST'); // parry spark effect
            addCameraTrauma(0.12); triggerHitStop(30);
            window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
                text:'🛡️ Shield blocks the blow! <b>75% absorbed.</b>'},'*');
        } else {
            _spawnMeleeVFX('SLASH'); addCameraTrauma(0.5); triggerHitStop(60);
        }
        autoWalkInterrupt = true;
    }
    if(d.type==='SHOW_COMBAT'){
        autoWalkInterrupt = true; // side panels up = stop auto-walk immediately
    }
    // Any panel-side action (card cast, gamble, retreat) breaks auto-walk
    if(d.type==='FPV_ACTION') autoWalkInterrupt = true;
    // Gambling win: tame nearest monster in room → clears auto-walk block
    if(d.type==='WAGER_RESOLVE'){
        autoWalkInterrupt = true; // always stop on wager result
        if(d.win){
            _tamedInRoom(); // tame nearest hostile in current room
        }
    }
});

// ── PiP 3D Top-Down Camera Render ────────────────────────────────────────────
// The PiP is now a real Three.js top-down camera render, not a 2D tile map.
// We render the scene into a WebGLRenderTarget, read the pixels, paint them
// into an offscreen canvas, then postMessage the ImageBitmap to Panels.
// T0.12 — readRenderTargetPixels GPU stall was tanking FPS 120→40. Reducing
// PIP RT size from 320 → 192 cuts readback bytes by 64% (~3.6× faster sync).
// Full fix (replace readback with OffscreenCanvas/dedicated renderer) deferred
// to T3.6. With this mitigation + reduced poll rate (see _pipSendTimer below),
// we get back into 80+ fps territory.
const PIP_RT_SIZE = 192;
const _pipRT = new THREE.WebGLRenderTarget(PIP_RT_SIZE, PIP_RT_SIZE, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    depthBuffer: true,
    stencilBuffer: false,
});
const _pipPixels   = new Uint8Array(PIP_RT_SIZE * PIP_RT_SIZE * 4);
const _pipComposite = document.createElement('canvas');
_pipComposite.width = PIP_RT_SIZE; _pipComposite.height = PIP_RT_SIZE;
const _pipCompCtx   = _pipComposite.getContext('2d');
let   _pipSendTimer = 0;

// Keep pip-canvas for the fullscreen M-key overview only
const pipCanvas = document.getElementById('pip-canvas');
const pipCtx    = pipCanvas ? pipCanvas.getContext('2d') : null;
const PIP_VIEW  = 14; // still used by markSeen fog-of-war

function renderPipFpv(){ /* no-op */ }
function updatePipCrossfade(){ /* no-op */ }

// ── Smart PiP Cinematic Angle System ─────────────────────────────────────────
// Every PIP_ANGLE_TURNS player steps, evaluate 8 evenly-spaced azimuth angles.
// For each candidate, cast 6 sample rays between the camera and the midpoint
// between player and nearest monster — pick the angle with the clearest view.
// The camera switches smoothly (lerp) over ~1.5s so there's no jarring cut.

const _pipRaycaster = new THREE.Raycaster();
let _pipWallCache = null; // cached wall mesh list — rebuilt lazily

function _pipGetSceneWalls(){ return []; } // no-op — top-down needs no wall check
function _pipInvalidateWallCache(){}
function _pipPickBestAngle(){} // no-op — top-down has no angle to pick

// Call this from the move system each step
function _pipOnPlayerStep(){
    _pipTurnCount++;
    if(_pipTurnCount % PIP_ANGLE_TURNS === 0){
        _pipPickBestAngle();
    }
}

// T0.9 — Find nearest hostile monster (returns {x, z, dist} or null).
// Used by the PIP cinematic system to auto-frame combat moments.
function _pipNearestHostile() {
    let best = null;
    for (const w of monsterWrappers) {
        if (w.userData.isDead) continue;
        if (w.userData.aiState !== 'hostile') continue;
        const dx = w.position.x - px, dz = w.position.z - pz;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (!best || d < best.dist) best = { x: w.position.x, z: w.position.z, dist: d };
    }
    return best;
}

// T0.9 — Tick the cinematic state: when a hostile monster is within ~2 tiles
// AND the user hasn't manually adjusted the PIP recently, blend toward an
// angled cinematic view that frames both player + monster. Smooth easing.
function _pipUpdateCinematic(dt) {
    const sinceInteract = (Date.now() - _pipLastInteractionTime) / 1000;
    const allowAuto = sinceInteract > 4.0; // 4s lockout after manual PIP input
    const near = allowAuto ? _pipNearestHostile() : null;
    const trigger = near && near.dist < 2.0 * GRID;
    if (trigger) _pipCinematicTarget = near;
    const target = trigger ? 1 : 0;
    // Lerp progress with ~0.6s settle time
    _pipCinematicT += (target - _pipCinematicT) * Math.min(1, dt * 2.5);
    if (_pipCinematicT < 0.01) _pipCinematicTarget = null;
}

// Position topDownCamera for the PiP — called every sendPipFrame tick.
function _positionPipCamera(dt){
    _pipUpdateCinematic(dt);

    // Base top-down position centered on player + user pan
    let cx = px + _pipPan.x;
    let cz = pz + _pipPan.z;

    // T0.9 — Cinematic blend: shift the look-at toward the midpoint of player +
    // nearest hostile so both tiles fit the frame. Camera tilts slightly off
    // straight-down (still mostly bird's-eye) so the action reads like a movie.
    const tgt = _pipCinematicTarget;
    if (tgt && _pipCinematicT > 0.001) {
        const midX = (px + tgt.x) * 0.5;
        const midZ = (pz + tgt.z) * 0.5;
        cx = cx + (midX - cx) * _pipCinematicT;
        cz = cz + (midZ - cz) * _pipCinematicT;
    }

    // Radius: base PIP_CAM_RADIUS, tighter when cinematic-zoomed, plus user zoom
    const cinematicR = 8.0; // tight enough to frame two adjacent tiles
    const baseR = PIP_CAM_RADIUS / Math.max(0.4, _pipZoomScale);
    const R = baseR + (cinematicR - baseR) * _pipCinematicT;

    // Slight cinematic tilt: ~12° off straight-down at full cinematic blend.
    // This gives the "movie shot" feel while still letting the player see down.
    const tiltOffset = 1.2 * _pipCinematicT;
    topDownCamera.position.set(cx + tiltOffset, R, cz + tiltOffset);
    topDownCamera.lookAt(cx, 0, cz);
    topDownCamera.up.set(0, 0, -1);
    const baseFov = 22 / Math.max(0.4, _pipZoomScale);
    const cinematicFov = 38;
    topDownCamera.fov = baseFov + (cinematicFov - baseFov) * _pipCinematicT;
    topDownCamera.aspect = 1.0;
    topDownCamera.near = 0.3;
    topDownCamera.far  = R + 4;
    topDownCamera.updateProjectionMatrix();
    topDownCamera.layers.disable(2); // no ceiling layer
}

function sendPipFrame(dt){
    _pipSendTimer -= dt;
    if(_pipSendTimer > 0) return;
    _pipSendTimer = 0.10; // T0.12 — drop to 10Hz (was 20Hz). Each PIP frame is a
                          // GPU→CPU readback stall; halving the rate halves the
                          // budget cost. Full readback removal is T3.6.

    _positionPipCamera(dt);

    // Save renderer state
    const prevRT  = renderer.getRenderTarget();
    const prevFog = scene.fog ? scene.fog.density : 0;
    const prevBg  = scene.background;
    const prevAmb = ambientLight ? ambientLight.intensity : 1;
    const prevDir = dirLight ? dirLight.intensity : 0;

    // Boost lights for readable top-down view
    if(ambientLight) ambientLight.intensity = 1.8;
    if(dirLight)     dirLight.intensity     = 0.5;
    if(scene.fog)    scene.fog.density      = 0;
    scene.background = new THREE.Color(0x0d0f14);

    // Render into RT
    renderer.setRenderTarget(_pipRT);
    renderer.setClearColor(0x0d0f14, 1);
    renderer.clear();
    renderer.render(scene, topDownCamera);

    // Read pixels
    renderer.readRenderTargetPixels(_pipRT, 0, 0, PIP_RT_SIZE, PIP_RT_SIZE, _pipPixels);

    // Restore renderer state
    renderer.setRenderTarget(prevRT);
    if(scene.fog)    scene.fog.density      = prevFog;
    scene.background = prevBg;
    if(ambientLight) ambientLight.intensity = prevAmb;
    if(dirLight)     dirLight.intensity     = prevDir;

    // WebGL pixels are flipped vertically — flip into canvas
    const imgData = _pipCompCtx.createImageData(PIP_RT_SIZE, PIP_RT_SIZE);
    const src = _pipPixels, dst = imgData.data, W = PIP_RT_SIZE;
    for(let row = 0; row < W; row++){
        const srcRow = (W - 1 - row) * W * 4;
        const dstRow = row * W * 4;
        dst.set(src.subarray(srcRow, srcRow + W * 4), dstRow);
    }
    _pipCompCtx.putImageData(imgData, 0, 0);

    // Circular clip + compass overlay
    _pipCompCtx.save();
    // North marker
    _pipCompCtx.fillStyle = 'rgba(255,107,122,0.85)';
    _pipCompCtx.font = 'bold 11px Inter,sans-serif';
    _pipCompCtx.textAlign = 'center';
    _pipCompCtx.fillText('N', PIP_RT_SIZE/2, 14);
    // Player dot at center
    const cx = PIP_RT_SIZE/2, cz = PIP_RT_SIZE/2;
    const pg = _pipCompCtx.createRadialGradient(cx,cz,0, cx,cz,9);
    pg.addColorStop(0,'rgba(124,224,184,1)');
    pg.addColorStop(1,'rgba(124,224,184,0)');
    _pipCompCtx.fillStyle = pg;
    _pipCompCtx.beginPath(); _pipCompCtx.arc(cx,cz,9,0,Math.PI*2); _pipCompCtx.fill();
    _pipCompCtx.beginPath(); _pipCompCtx.arc(cx,cz,3.5,0,Math.PI*2);
    _pipCompCtx.fillStyle='#fff'; _pipCompCtx.fill();
    // Outer ring
    _pipCompCtx.beginPath(); _pipCompCtx.arc(cx,cz,PIP_RT_SIZE/2-2,0,Math.PI*2);
    _pipCompCtx.strokeStyle='rgba(124,224,184,0.45)'; _pipCompCtx.lineWidth=2.5; _pipCompCtx.stroke();
    _pipCompCtx.restore();

    // Transfer to Panels via ImageBitmap (zero-copy where supported)
    try {
        createImageBitmap(_pipComposite).then(bmp=>{
            window.parent.postMessage({type:'PIP_FRAME', bitmap: bmp, isCam: true}, '*', [bmp]);
        });
    } catch(e){
        window.parent.postMessage({type:'PIP_FRAME', dataURL: _pipComposite.toDataURL('image/webp',0.75), isCam: true},'*');
    }
}

// Fog of war — record which cells the player has seen (revealed once seen)
const seen = new Uint8Array(MAP_W*MAP_H);
function markSeen(){
    const pgx=px/GRID, pgz=pz/GRID;
    const R=PIP_VIEW;
    for(let dx=-R;dx<=R;dx++) for(let dz=-R;dz<=R;dz++){
        const gx=Math.round(pgx+dx), gz=Math.round(pgz+dz);
        if(gx<0||gx>=MAP_W||gz<0||gz>=MAP_H) continue;
        if(dx*dx+dz*dz>R*R) continue;
        seen[gx*MAP_H+gz]=1;
    }
}

function drawPip(){
    const PW=pipCanvas.width, PH=pipCanvas.height;
    pipCtx.clearRect(0,0,PW,PH);
    pipCtx.save();
    pipCtx.beginPath(); pipCtx.arc(PW/2,PH/2,PW/2,0,Math.PI*2); pipCtx.clip();

    // Dark neumorphic backdrop with vignette
    const bg = pipCtx.createRadialGradient(PW/2,PH/2,PW*0.1, PW/2,PH/2,PW/2);
    bg.addColorStop(0,'#1f2228'); bg.addColorStop(0.7,'#15171c'); bg.addColorStop(1,'#0a0c10');
    pipCtx.fillStyle=bg; pipCtx.fillRect(0,0,PW,PH);

    const cellPx=PW/(PIP_VIEW*2), pgx=px/GRID, pgz=pz/GRID;

    // Floor cells (revealed)
    for(let dx=-PIP_VIEW;dx<=PIP_VIEW;dx++) for(let dz=-PIP_VIEW;dz<=PIP_VIEW;dz++){
        const gx=Math.round(pgx+dx), gz=Math.round(pgz+dz);
        if(gx<0||gx>=MAP_W||gz<0||gz>=MAP_H) continue;
        const cell=map[gx][gz]; if(cell.type==='wall') continue;
        const isSeen = seen[gx*MAP_H+gz];
        if(!isSeen) continue;
        const sx=(PW/2)+dx*cellPx, sz=(PH/2)+dz*cellPx;
        if(cell.type==='stairs_up'||cell.type==='stairs_up_r') pipCtx.fillStyle='rgba(240,192,96,0.85)';
        else if(cell.type==='stairs_down') pipCtx.fillStyle='rgba(255,107,80,0.85)';
        else if(cell.type==='shoji_door')  pipCtx.fillStyle='rgba(124,224,184,0.55)';
        else if(cell.type==='shoji')       pipCtx.fillStyle='rgba(180,160,120,0.35)';
        else                               pipCtx.fillStyle='rgba(80,90,108,0.55)';
        pipCtx.fillRect(sx,sz,cellPx+0.5,cellPx+0.5);
    }

    // Wall edges drawn as soft inset shadow lines
    pipCtx.strokeStyle='rgba(0,0,0,0.65)'; pipCtx.lineWidth=1;
    for(let dx=-PIP_VIEW;dx<=PIP_VIEW;dx++) for(let dz=-PIP_VIEW;dz<=PIP_VIEW;dz++){
        const gx=Math.round(pgx+dx), gz=Math.round(pgz+dz);
        if(gx<0||gx>=MAP_W||gz<0||gz>=MAP_H) continue;
        if(map[gx][gz].type!=='wall') continue;
        if(!seen[gx*MAP_H+gz]) continue;
        const sx=(PW/2)+dx*cellPx, sz=(PH/2)+dz*cellPx;
        pipCtx.fillStyle='rgba(40,44,52,0.6)';
        pipCtx.fillRect(sx,sz,cellPx+0.5,cellPx+0.5);
    }

    // Enemies
    worldGroup.children.forEach(c=>{
        if(c.userData?.type!=='enemy'||c.userData?.isDead) return;
        const ex=(c.position.x/GRID)-pgx, ez=(c.position.z/GRID)-pgz;
        if(Math.abs(ex)>PIP_VIEW||Math.abs(ez)>PIP_VIEW) return;
        const sx=PW/2+ex*cellPx, sz=PH/2+ez*cellPx;
        // Soft glow
        const eg=pipCtx.createRadialGradient(sx,sz,0, sx,sz,7);
        eg.addColorStop(0,'rgba(255,107,122,0.9)'); eg.addColorStop(1,'rgba(255,107,122,0)');
        pipCtx.fillStyle=eg; pipCtx.fillRect(sx-7,sz-7,14,14);
        pipCtx.beginPath(); pipCtx.arc(sx,sz,2.5,0,Math.PI*2);
        pipCtx.fillStyle='#ff6b7a'; pipCtx.fill();
    });

    // Player vision cone
    const cx=PW/2, cz=PH/2;
    pipCtx.save(); pipCtx.translate(cx,cz); pipCtx.rotate(rot);
    const cg=pipCtx.createRadialGradient(0,0,0, 0,0,cellPx*5);
    cg.addColorStop(0,'rgba(124,224,184,0.35)'); cg.addColorStop(1,'rgba(124,224,184,0)');
    pipCtx.fillStyle=cg;
    pipCtx.beginPath(); pipCtx.moveTo(0,0); pipCtx.arc(0,0,cellPx*5,-Math.PI/2-0.55,-Math.PI/2+0.55); pipCtx.closePath(); pipCtx.fill();
    pipCtx.restore();

    // Player dot with glow
    const pg=pipCtx.createRadialGradient(cx,cz,0, cx,cz,8);
    pg.addColorStop(0,'rgba(124,224,184,0.95)'); pg.addColorStop(1,'rgba(124,224,184,0)');
    pipCtx.fillStyle=pg; pipCtx.fillRect(cx-8,cz-8,16,16);
    pipCtx.beginPath(); pipCtx.arc(cx,cz,3,0,Math.PI*2); pipCtx.fillStyle='#fff'; pipCtx.fill();

    // North marker
    pipCtx.fillStyle='rgba(255,107,122,0.7)'; pipCtx.font='bold 10px Inter,sans-serif'; pipCtx.textAlign='center';
    pipCtx.fillText('N',PW/2,14);

    pipCtx.restore();

    // Outer ring
    pipCtx.beginPath(); pipCtx.arc(PW/2,PH/2,PW/2-1.5,0,Math.PI*2);
    pipCtx.strokeStyle='rgba(124,224,184,0.4)'; pipCtx.lineWidth=2; pipCtx.stroke();
}

// ── Fullscreen Top-Down Map ───────────────────────────────────────────────────
const fsMapCanvas = document.getElementById('fs-map-canvas');
const fsMapCtx    = fsMapCanvas.getContext('2d');
const fsMapOverlay= document.getElementById('fs-map-overlay');
let fsMapOpen = false;

function drawFullMap(){
    const W = fsMapCanvas.width, H = fsMapCanvas.height;
    fsMapCtx.clearRect(0,0,W,H);
    // Neumorphic dark background
    const bg = fsMapCtx.createRadialGradient(W/2,H/2,W*0.1, W/2,H/2,W*0.7);
    bg.addColorStop(0,'#22262d'); bg.addColorStop(1,'#0e1014');
    fsMapCtx.fillStyle=bg; fsMapCtx.fillRect(0,0,W,H);

    const cell = Math.floor(Math.min(W,H) / Math.max(MAP_W,MAP_H));
    const ox = (W - cell*MAP_W)/2, oy = (H - cell*MAP_H)/2;

    // Floor cells with subtle inset depth per room
    for(let x=0;x<MAP_W;x++) for(let z=0;z<MAP_H;z++){
        const c = map[x][z]; if(!c) continue;
        const sx = ox + x*cell, sy = oy + z*cell;
        if(c.type==='wall'){
            fsMapCtx.fillStyle='#0a0c10';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='shoji'){
            fsMapCtx.fillStyle='rgba(200,180,140,0.55)';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='shoji_door'){
            fsMapCtx.fillStyle='rgba(124,224,184,0.7)';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='stairs_up'||c.type==='stairs_up_r'){
            fsMapCtx.fillStyle='#f0c060';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else if(c.type==='stairs_down'){
            fsMapCtx.fillStyle='#ff6b50';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        } else {
            // Floor — slight neumorphic depth
            fsMapCtx.fillStyle='#2a2e36';
            fsMapCtx.fillRect(sx,sy,cell,cell);
        }
    }

    // Room outlines + labels
    if(typeof rooms!=='undefined'){
        rooms.forEach(r=>{
            const x0 = ox + r.x*cell, y0 = oy + r.y*cell;
            const w  = r.w*cell, h = r.h*cell;
            // Soft inset shadow per room
            fsMapCtx.strokeStyle='rgba(124,224,184,0.18)';
            fsMapCtx.lineWidth=1.2;
            fsMapCtx.strokeRect(x0+0.5,y0+0.5,w-1,h-1);
            // Label
            fsMapCtx.fillStyle='rgba(168,176,187,0.75)';
            fsMapCtx.font='600 11px Inter,sans-serif';
            fsMapCtx.textAlign='center'; fsMapCtx.textBaseline='middle';
            const cx = x0+w/2, cy = y0+h/2;
            fsMapCtx.fillText((r.name||'').toUpperCase(), cx, cy-7);
            if(r.kanji){
                fsMapCtx.fillStyle='rgba(124,224,184,0.55)';
                fsMapCtx.font='600 13px "Noto Sans JP",sans-serif';
                fsMapCtx.fillText(r.kanji, cx, cy+8);
            }
        });
    }

    // Enemies
    worldGroup.children.forEach(c=>{
        if(c.userData?.type!=='enemy'||c.userData?.isDead) return;
        const sx = ox + (c.position.x/GRID)*cell;
        const sy = oy + (c.position.z/GRID)*cell;
        const eg=fsMapCtx.createRadialGradient(sx,sy,0, sx,sy,cell*1.3);
        eg.addColorStop(0,'rgba(255,107,122,0.85)'); eg.addColorStop(1,'rgba(255,107,122,0)');
        fsMapCtx.fillStyle=eg; fsMapCtx.fillRect(sx-cell*1.3,sy-cell*1.3,cell*2.6,cell*2.6);
        fsMapCtx.beginPath(); fsMapCtx.arc(sx,sy,cell*0.4,0,Math.PI*2);
        fsMapCtx.fillStyle='#ff6b7a'; fsMapCtx.fill();
    });

    // Player — glowing dot + cone
    const psx = ox + (px/GRID)*cell, psy = oy + (pz/GRID)*cell;
    fsMapCtx.save();
    fsMapCtx.translate(psx,psy); fsMapCtx.rotate(rot);
    const cg=fsMapCtx.createRadialGradient(0,0,0, 0,0,cell*8);
    cg.addColorStop(0,'rgba(124,224,184,0.45)'); cg.addColorStop(1,'rgba(124,224,184,0)');
    fsMapCtx.fillStyle=cg;
    fsMapCtx.beginPath(); fsMapCtx.moveTo(0,0); fsMapCtx.arc(0,0,cell*8,-Math.PI/2-0.45,-Math.PI/2+0.45); fsMapCtx.closePath(); fsMapCtx.fill();
    fsMapCtx.restore();
    const pg=fsMapCtx.createRadialGradient(psx,psy,0, psx,psy,cell*1.5);
    pg.addColorStop(0,'rgba(124,224,184,1)'); pg.addColorStop(1,'rgba(124,224,184,0)');
    fsMapCtx.fillStyle=pg; fsMapCtx.fillRect(psx-cell*1.5,psy-cell*1.5,cell*3,cell*3);
    fsMapCtx.beginPath(); fsMapCtx.arc(psx,psy,cell*0.5,0,Math.PI*2);
    fsMapCtx.fillStyle='#fff'; fsMapCtx.fill();
}

function openFullMap(){ fsMapOpen=true; fsMapOverlay.classList.add('open'); drawFullMap(); }
function closeFullMap(){ fsMapOpen=false; fsMapOverlay.classList.remove('open'); }
// Click anywhere on the PIP frame opens the fullscreen map
document.getElementById('pip-frame').addEventListener('click', openFullMap);
fsMapOverlay.addEventListener('click', e=>{ if(e.target===fsMapOverlay||e.target.id==='fs-map-canvas') closeFullMap(); });
document.getElementById('fs-map-close').addEventListener('click', closeFullMap);
window.addEventListener('keydown', e=>{
    if(e.key==='Escape' && fsMapOpen){ closeFullMap(); e.preventDefault(); }
    else if((e.key==='m'||e.key==='M')){ fsMapOpen ? closeFullMap() : openFullMap(); e.preventDefault(); }
});
