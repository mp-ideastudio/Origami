const activeSpells = [];

// ── Fire DOT system ──────────────────────────────────────────────────────────
const activeDots = [];

function _applyFireDot(target, totalDmg){
    // 4 ticks over 4 seconds, 25% of totalDmg each tick, 8-15 dmg floor
    const tickDmg = Math.max(8, Math.round(totalDmg * 0.25));
    const TICKS = 4, INTERVAL = 1.0;
    // Pulse orange emissive outline on the monster body
    const pulseInterval = setInterval(()=>{
        target.traverse(c=>{
            if(!c.isMesh || !c.material) return;
            if(c.material.emissive){
                c.material.emissive.set(0xff3300);
                c.material.emissiveIntensity = 1.8;
            }
        });
        setTimeout(()=>{
            target.traverse(c=>{
                if(!c.isMesh || !c.material || !c.material.emissive) return;
                c.material.emissive.set('#3df0c8'); // back to ghost color
                c.material.emissiveIntensity = 1.2;
            });
        }, 300);
    }, INTERVAL * 1000);
    activeDots.push({
        target, tickDmg, ticks: TICKS, timer: INTERVAL, interval: INTERVAL,
        _clearFx: pulseInterval
    });
}

function tickDots(dt){
    for(let i = activeDots.length-1; i >= 0; i--){
        const d = activeDots[i];
        if(d.target.userData.isDead){ clearInterval(d._clearFx); activeDots.splice(i,1); continue; }
        d.timer -= dt;
        if(d.timer <= 0){
            d.timer = d.interval;
            _applyMonsterDamage(d.target, d.tickDmg, 'FIRE');
            spawnDamageText(`🔥${d.tickDmg}`, d.target.position.clone(), false);
            d.ticks--;
            if(d.ticks <= 0){ clearInterval(d._clearFx); activeDots.splice(i,1); }
        }
    }
}

function _buildFireballMesh(){
    // Matches the FIRE card icon: icosahedron core + swirling flame tetrahedra
    const group = new THREE.Group();
    const core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.22, 1),
        new THREE.MeshBasicMaterial({color: 0xff4400})
    );
    group.add(core);
    const flames = [];
    for(let i=0; i<20; i++){
        const flameColor = i%3===0 ? 0xffea00 : (i%2===0 ? 0xff4500 : 0xb71c1c);
        const s = new THREE.Mesh(
            new THREE.TetrahedronGeometry(0.09, 0),
            new THREE.MeshBasicMaterial({
                color: flameColor, transparent:true, opacity:0.88,
                blending:THREE.AdditiveBlending, depthWrite:false
            })
        );
        const ang = (i/20)*Math.PI*2, rad = 0.06 + Math.random()*0.14;
        s.position.set(Math.cos(ang)*rad, 0.08, Math.sin(ang)*rad);
        group.add(s);
        flames.push({m:s, spd:3+Math.random()*6, off:Math.random()*Math.PI, rs:(Math.random()-0.5)*2});
    }
    group.userData.flames = flames;
    group.userData.core = core;
    return group;
}

function launchCard(cardName){
    const el = _cardElement(cardName);
    if(el === 'EARTH' && /BOULDER/.test(cardName.toUpperCase())) {
        launchBoulder(cardName); return;
    }
    const elCol = EL_COLORS[el] || EL_COLORS.DEFAULT;
    const dmg = calcDamage(cardName);
    const isFire = (el === 'FIRE');

    // 1. Conjure group — ALL materials are MeshBasicMaterial (unlit, no light reflection)
    const conjureGroup = new THREE.Group();

    let ring, sigil;
    if(isFire){
        // Fireball: use card-icon icosahedron+flames mesh
        const fb = _buildFireballMesh();
        conjureGroup.add(fb);
        // Store flame refs for tick animation
        conjureGroup.userData.flames = fb.userData.flames;
        conjureGroup.userData.fbCore = fb.userData.core;
        sigil = fb; ring = fb; // unified handles
    } else {
        // Generic circle spell — unlit outer ring
        const ringGeo = new THREE.TorusGeometry(0.32, 0.04, 10, 48);
        ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: elCol.spark}));
        // Unlit inner sigil disc
        const sigilGeo = new THREE.CircleGeometry(0.26, 32);
        sigil = new THREE.Mesh(sigilGeo, new THREE.MeshBasicMaterial({
            color: elCol.beam, transparent:true, opacity:0.85,
            blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
        }));
        conjureGroup.add(ring, sigil);
    }

    // Position: 1m in front of camera
    const fwd = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
    conjureGroup.position.copy(camera.position).addScaledVector(fwd, 1.0);
    conjureGroup.lookAt(camera.position);
    scene.add(conjureGroup);

    // Element-colored bloom outline PointLight (replaces flat torus halo)
    const conjureLight = new THREE.PointLight(elCol.beam, 6, 4);
    conjureLight.position.copy(conjureGroup.position);
    scene.add(conjureLight);

    // Additive bloom torus outline — unlit, sized by element
    const outlineRingGeo = new THREE.TorusGeometry(isFire ? 0.28 : 0.36, 0.03, 8, 32);
    const outlineRing = new THREE.Mesh(outlineRingGeo, new THREE.MeshBasicMaterial({
        color: elCol.spark, transparent:true, opacity:0.8,
        blending:THREE.AdditiveBlending, depthWrite:false
    }));
    conjureGroup.add(outlineRing);

    const MAX_DIST = 22;
    const target = _obAutoTarget(cardName, dmg);
    const dir = target
        ? target.position.clone().sub(camera.position).normalize()
        : fwd.clone();

    const spellObj = {
        group: conjureGroup, ring, sigil, conjureLight, outlineRing,
        dir, dmg, el, elCol, cardName, isFire,
        spinRate: 2, travelled: 0, target,
        state: 'conjure', conjureT: 0, streakT: 0
    };
    activeSpells.push(spellObj);

    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    aggroRoom(map[pgx]?.[pgz]?.roomId);
}

function launchBoulder(cardName){
    // Fixed 60-120 damage range regardless of level scaling
    const dmg = 60 + Math.floor(Math.random() * 61); // 60-120
    const elCol = EL_COLORS.EARTH;
    const TILE_LIMIT = 12; // 12 tiles × GRID=2 = 24 world units

    // Boulder mesh: rough dodecahedron for craggy look
    const bGeo = new THREE.DodecahedronGeometry(0.45, 1);
    const bMat = new THREE.MeshBasicMaterial({ color: 0x6b5533 }); // unlit — no reflections
    const bMesh = new THREE.Mesh(bGeo, bMat);

    // Element-colored bloom ring around boulder
    const ringGeo = new THREE.TorusGeometry(0.6, 0.06, 8, 32);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0xccaa55, transparent:true, opacity:0.7,
        blending:THREE.AdditiveBlending, depthWrite:false
    });
    const bloomRing = new THREE.Mesh(ringGeo, ringMat);
    bMesh.add(bloomRing);

    const fwd = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
    fwd.y = 0.12;
    bMesh.position.copy(camera.position).addScaledVector(fwd, 1.5);
    bMesh.position.y = 1.0;
    scene.add(bMesh);

    const bl = new THREE.PointLight(0xcc8833, 3, 4);
    bl.position.copy(bMesh.position); scene.add(bl);

    const spd = 8 + Math.random()*2;
    activeBoulders.push({
        mesh: bMesh, light: bl, bloomRing,
        vx: fwd.x * spd, vy: 3.5, vz: fwd.z * spd,
        damage: dmg,
        distTravelled: 0,       // world-unit distance counter
        maxDist: TILE_LIMIT * GRID, // 24 world units
        hitSet: new Set()
    });

    window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
        text:`🪨 Boulder launches! <b>${dmg} dmg</b> — bounces for ${TILE_LIMIT} tiles then crumbles!`},'*');
    addCameraTrauma(0.3);

    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    aggroRoom(map[pgx]?.[pgz]?.roomId);
}

const _SPELL_MAX_DIST = 22; // world units

function tickSpells(dt){
    for(let i = activeSpells.length-1; i >= 0; i--){
        const s = activeSpells[i];
        s.conjureT += dt;

        if(s.state === 'conjure'){
            s.spinRate = Math.min(30, s.spinRate + dt * 25);
            // Fireball rotates the whole group; circles spin ring+sigil separately
            if(s.isFire){
                s.group.rotation.y += s.spinRate * dt * 0.5;
                s.group.rotation.z += s.spinRate * dt * 0.3;
                // Animate flame particles during conjure
                if(s.group.userData.flames){
                    s.group.userData.flames.forEach(f=>{
                        f.m.rotation.x += f.rs*0.08; f.m.rotation.y += f.rs*0.08;
                        f.m.position.y = 0.08 + ((Math.sin(s.conjureT*f.spd+f.off)+1)*0.1);
                    });
                }
            } else {
                s.sigil.rotation.z += s.spinRate * dt;
                s.ring.rotation.z  += s.spinRate * 0.4 * dt;
            }
            const scl = Math.min(1, s.conjureT * 4);
            s.group.scale.setScalar(scl);
            s.conjureLight.intensity = 4 + Math.sin(s.conjureT * 3) * 1.2;
            if(s.conjureT >= 0.55){ s.state = 'streak'; s.streakT = 0; }

        } else if(s.state === 'streak'){
            s.streakT += dt;
            const spd = 12 + s.streakT * 20;
            const step = spd * dt;
            s.group.position.addScaledVector(s.dir, step);
            s.travelled += step;

            if(s.isFire){
                // Fireball rotates uniformly in flight, flames animate
                s.group.rotation.y += 18 * dt;
                s.group.rotation.z -= 10 * dt;
                s.group.scale.setScalar(1 + s.streakT * 0.3); // slight grow
                if(s.group.userData.flames){
                    s.group.userData.flames.forEach(f=>{
                        f.m.rotation.x += f.rs*0.1; f.m.rotation.y += f.rs*0.1;
                        f.m.position.y = 0.08 + ((Math.sin(s.conjureT*f.spd+f.off)+1)*0.12);
                    });
                }
                // Outline ring spins opposite
                if(s.outlineRing) s.outlineRing.rotation.z -= 20 * dt;
            } else {
                // Generic circle: wag for trail
                s.sigil.rotation.z += 18 * dt;
                s.ring.rotation.z  -= 12 * dt;
                s.group.scale.set(1 + s.streakT * 0.5, 1 + s.streakT * 0.5, 1 + s.streakT * 3);
                if(s.outlineRing) s.outlineRing.rotation.z += 15 * dt;
            }

            s.conjureLight.position.copy(s.group.position);
            s.conjureLight.intensity = 8;

            // Hit detection
            let hit = false;
            if(s.target && !s.target.userData.isDead){
                if(s.group.position.distanceTo(s.target.position) < 1.2) hit = true;
            } else if(s.travelled > _SPELL_MAX_DIST){
                hit = true; s.target = null;
            }

            if(hit){
                scene.remove(s.group);
                scene.remove(s.conjureLight);
                if(s.target){
                    _applyMonsterDamage(s.target, s.dmg, s.el);
                    // FIRE: apply DOT on top of instant hit
                    if(s.isFire) _applyFireDot(s.target, s.dmg);
                }
                _spawnHitBurst(s.group.position.clone(), s.el);
                activeSpells.splice(i, 1);
            }
        }
    }
}

function _applyMonsterDamage(w, dmg, el){
    const ud = w.userData;
    const hpBefore = ud.hp ?? 50;
    ud.hp = Math.max(0, hpBefore - dmg);
    const maxHp = ud.maxHp ?? 50;
    spawnDamageText(dmg, w.position.clone(), false);
    _applyElementalBodyFX(w, el);
    window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
        text:`${el} hits ${ud.name||'Goblin'} for <b>${dmg}</b> damage!`},'*');

    if(ud.hp <= 0){
        ud.isDead = true;
        const wasFleeing = ud.aiState === 'flee';
        const cName = ud.name || 'Goblin';
        const karmaHit = wasFleeing ? 2 : 1;
        const karmaMsg = wasFleeing
            ? `💀 <b>${cName}</b> is slain while fleeing. <span style="color:#ff6b7a">−2 Karma</span>`
            : `⚔ <b>${cName}</b> is defeated. <span style="color:#ff9966">−1 Karma</span>`;
        window.parent.postMessage({type:'LOG_EVENT', logType:'loot', text: karmaMsg},'*');
        window.parent.postMessage({type:'SYNC_UI', event:'MONSTER_DEATH', id:ud.id},'*');
        // Notify OniBaba — standard -1; extra -1 for killing a fleeing monster
        window.parent.postMessage({type:'MONSTER_DEATH', id:ud.id},'*');
        if(wasFleeing) window.parent.postMessage({type:'MONSTER_DEATH', id:ud.id, extra:true},'*');
        // T0.10 — Cinematic death: bow (0.8s) → fall (0.6s) → sink-fade (1.4s)
        // Play the death animation throughout; we layer a wrapper-rotation tilt on top
        // for explicit bow + face-plant motion regardless of what the GLB clips look like.
        _monSetAnim(ud, 'death');
        const circle = ud.pedestalCircle || (ud.monBase && ud.monBase.children.find(c=>c.isMesh && c.geometry?.type==='PlaneGeometry'));
        _dyingMonsters.push({
            w, ud, circle,
            phase: 'bow',
            timer: 0.8,
            bowDur: 0.8,
            fallDur: 0.6,
            sinkDur: 1.4,
            startRotX: w.rotation.x || 0,
        });
    } else {
        // At <50% HP: transition to flee, cry for help (once), alert 5-tile peers
        const halfHp = maxHp * 0.5;
        if(ud.hp < halfHp && ud.aiState !== 'flee' && !ud._fleeCried){
            ud.aiState = 'flee';
            ud._fleeCried = true;
            const cName = ud.name || 'Goblin';
            const cries = [
                `🏃 <b>${cName}</b> flees in terror — "Help me, guys!"`,
                `💨 <b>${cName}</b> runs! "He's too strong, fall back!"`,
                `😱 <b>${cName}</b> scatters — "Everyone run! Save yourselves!"`,
            ];
            const cry = cries[Math.floor(Math.random()*cries.length)];
            window.parent.postMessage({type:'LOG_EVENT', logType:'combat', text: cry},'*');
            // Alert all monsters within 5 tiles of this fleeing monster
            _alertNearby(w);
            // Also alert those peers they should flee if already below 50% HP
            for(const peer of monsterWrappers){
                if(peer === w || peer.userData.isDead) continue;
                const pdx = peer.position.x - w.position.x;
                const pdz = peer.position.z - w.position.z;
                if(Math.sqrt(pdx*pdx+pdz*pdz)/GRID <= ALERT_TILES){
                    const pud = peer.userData;
                    const pHalf = (pud.maxHp ?? 50) * 0.5;
                    if((pud.hp ?? 50) < pHalf && pud.aiState !== 'flee' && !pud._fleeCried){
                        pud.aiState = 'flee';
                        pud._fleeCried = true;
                    }
                }
            }
        }
    }
    // Damage: alert ALL monsters in same room (room-wide aggro)
    if(!ud.isDead) _alertRoom(w);
}

// ── Dying-monster sink/fade list ─────────────────────────────────────────────
const _dyingMonsters = [];

function _tickDyingMonsters(dt){
    for(let i = _dyingMonsters.length - 1; i >= 0; i--){
        const d = _dyingMonsters[i];
        d.timer -= dt;

        // T0.10 — Three-phase death: bow → fall → sink.
        if(d.phase === 'bow'){
            // Bow: lean forward 30° over 0.8s. No fade, no sink. Pedestal disc dims slightly.
            const t = 1 - Math.max(0, d.timer / d.bowDur); // 0 → 1
            d.w.rotation.x = d.startRotX + (-0.5 * t); // 0 → -0.5 rad (~28°)
            if(d.circle && d.circle.material){
                d.circle.material.opacity = 0.45 * (1 - t * 0.4); // 0.45 → 0.27
            }
            if(d.timer <= 0){
                d.phase = 'fall';
                d.timer = d.fallDur;
            }
        } else if(d.phase === 'fall'){
            // Fall: rotate from -0.5 → -π/2 (face-plant) over 0.6s. Still no sink.
            const t = 1 - Math.max(0, d.timer / d.fallDur); // 0 → 1
            // Ease-in (quadratic) so the fall accelerates like gravity
            const easedT = t * t;
            d.w.rotation.x = -0.5 + ((-Math.PI / 2) - (-0.5)) * easedT;
            if(d.circle && d.circle.material){
                d.circle.material.opacity = 0.27 * (1 - t); // 0.27 → 0
            }
            if(d.timer <= 0){
                d.phase = 'sink';
                d.timer = d.sinkDur;
                d.w.rotation.x = -Math.PI / 2;
                // Remove the pedestal disc completely (body is face-down now)
                if(d.circle){
                    if(d.circle.parent) d.circle.parent.remove(d.circle);
                    d.circle = null;
                }
                // Make all body meshes transparent for the fade phase
                d.w.traverse(c=>{
                    if(c.isMesh && c.material){
                        c.material = c.material.clone();
                        c.material.transparent = true;
                        c.material.depthWrite = false;
                    }
                });
            }
        } else if(d.phase === 'sink'){
            // Sink-fade: body translates from y=0 → y=-1.5 over 1.4s while fading 1 → 0.
            const t = d.timer / d.sinkDur; // 1 → 0
            const fade = t;
            const sink = (1.0 - t) * -1.5;
            if(d.ud.monBase) d.ud.monBase.position.y = sink;
            d.w.position.y = sink;
            d.w.traverse(c=>{
                if(c.isMesh && c.material) c.material.opacity = Math.max(0, fade);
            });
            if(d.timer <= 0){
                scene.remove(d.w);
                if(d.ud.monBase) scene.remove(d.ud.monBase);
                _pipInvalidateWallCache();
                _dyingMonsters.splice(i, 1);
            }
        }
    }
}

function _applyElementalBodyFX(w, el){
    const dur = 1200;
    w.traverse(c=>{
        if(!c.isMesh || !c.material) return;
        const origEmissive = c.material.emissive ? c.material.emissive.clone() : new THREE.Color(0);
        const origInt = c.material.emissiveIntensity || 0;
        const col = el === 'FIRE'  ? 0xff3300
                  : el === 'WATER' ? 0x0099ff
                  : el === 'EARTH' ? 0x886622
                  : el === 'WIND'  ? 0x44ffaa
                  : 0xaa44ff;
        if(c.material.emissive) c.material.emissive.set(col);
        c.material.emissiveIntensity = 2.2;
        setTimeout(()=>{
            if(c.material.emissive) c.material.emissive.copy(origEmissive);
            c.material.emissiveIntensity = origInt;
        }, dur);
    });
}

function _spawnHitBurst(pos, el){
    const elCol = EL_COLORS[el] || EL_COLORS.DEFAULT;
    // Burst light
    const bLight = new THREE.PointLight(elCol.hit, 20, 6);
    bLight.position.copy(pos).setY(1.2);
    scene.add(bLight);
    addCameraTrauma(0.35);
    triggerHitStop(80);

    // Particle sparks (cheap instanced planes)
    const SPARKS = 16;
    const spkMat = new THREE.MeshBasicMaterial({
        color: elCol.spark, transparent:true, opacity:0.9,
        blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
    });
    const spkGeo = new THREE.PlaneGeometry(0.12, 0.12);
    const sparks = [];
    for(let k=0; k<SPARKS; k++){
        const m = new THREE.Mesh(spkGeo, spkMat);
        m.position.copy(pos).setY(1.2);
        const theta = Math.random()*Math.PI*2;
        const phi   = Math.random()*Math.PI;
        const spd   = 1.5 + Math.random()*3;
        m._vel = new THREE.Vector3(
            Math.sin(phi)*Math.cos(theta)*spd,
            Math.cos(phi)*spd + 1,
            Math.sin(phi)*Math.sin(theta)*spd
        );
        scene.add(m);
        sparks.push(m);
    }

    // Animate sparks + fade light
    let elapsed = 0;
    const TOTAL = 0.9;
    function animBurst(){
        elapsed += 0.016;
        const t = elapsed / TOTAL;
        bLight.intensity = 20 * (1 - t);
        sparks.forEach(m=>{
            m._vel.y -= 4.5 * 0.016;
            m.position.addScaledVector(m._vel, 0.016);
            m.material.opacity = 0.9 * (1 - t);
        });
        if(elapsed < TOTAL) requestAnimationFrame(animBurst);
        else {
            scene.remove(bLight);
            sparks.forEach(m=>{ scene.remove(m); });
        }
    }
    requestAnimationFrame(animBurst);

    // Water-specific: ripple rings
    if(el === 'WATER'){
        for(let r=0; r<3; r++){
            const rGeo = new THREE.TorusGeometry(0.01, 0.04, 6, 24);
            const rMat = new THREE.MeshBasicMaterial({color:0x00aaff,transparent:true,opacity:0.8,
                blending:THREE.AdditiveBlending,depthWrite:false});
            const rMesh = new THREE.Mesh(rGeo, rMat);
            rMesh.position.copy(pos).setY(0.05);
            rMesh.rotation.x = -Math.PI/2;
            scene.add(rMesh);
            let re = 0;
            const delay = r * 0.12;
            setTimeout(()=>{
                function ripple(){ re+=0.016; const rs=1+re*6; rMesh.scale.setScalar(rs);
                    rMat.opacity=0.8*(1-re/0.6);
                    if(re<0.6) requestAnimationFrame(ripple); else scene.remove(rMesh); }
                requestAnimationFrame(ripple);
            }, delay*1000);
        }
    }

    // Fire-specific: upward flame streaks
    if(el === 'FIRE'){
        for(let f=0; f<6; f++){
            const fGeo = new THREE.PlaneGeometry(0.1, 0.5);
            const fMat = new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:0.8,
                blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
            const fMesh = new THREE.Mesh(fGeo, fMat);
            fMesh.position.copy(pos).setY(0.8);
            fMesh.rotation.y = Math.random()*Math.PI*2;
            scene.add(fMesh);
            let fe=0;
            function flame(){ fe+=0.016; fMesh.position.y+=0.08; fMesh.scale.x*=0.96;
                fMat.opacity=0.8*(1-fe/0.5);
                if(fe<0.5) requestAnimationFrame(flame); else scene.remove(fMesh); }
            setTimeout(()=>requestAnimationFrame(flame), f*30);
        }
    }
}

// ── FPV_ACTION handler: card cast → combat pipeline ──────────────────────
window.addEventListener('message', e=>{
    if(!e.data) return;
    const d = e.data;

    // Aggro room on any attack-type message or combat card
    if(d.type==='PLAYER_ATTACK' || d.type==='COMBAT_ATTACK' ||
       (d.type==='FPV_ACTION' && d.action && !['MAP','BAG','REST','HEAL','VIEW','LOG','WAGER','PARLEY','HIDE','RETREAT','OBSERVE','BET_EVEN','BET_ODD'].includes(d.action))){
        const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
        aggroRoom(map[pgx]?.[pgz]?.roomId);
    }

    // Card names fired as FPV_ACTION → trigger launch pipeline
    if(d.type==='FPV_ACTION' && d.action){
        const action = d.action;
        // Skip non-combat UI actions
        const UI_ONLY = new Set(['MAP','BAG','REST','HEAL','VIEW','LOG','WAGER','PARLEY',
                                  'HIDE','RETREAT','OBSERVE','ATTACK','BET_EVEN','BET_ODD']);
        // Melee cards route to _executeMeleeCard, never to launchCard (which fires projectiles)
        const MELEE_CARDS = new Set(['SLASH','THRUST','HEAVY ATTACK','DEFEND']);
        if(!UI_ONLY.has(action)){
            if(MELEE_CARDS.has(action)){
                _executeMeleeCard(action);
            } else if(_isMissileCard(action)){
                // Recovery callback: tell panels to restore +1 ammo on the card
                const recoveryCb = (name) => {
                    window.parent.postMessage({type:'MISSILE_RECOVERED', cardName: name}, '*');
                };
                launchMissile(action, recoveryCb);
            } else {
                launchCard(action);
            }
        }
        // ATTACK button = repeat the last melee card the player used
        if(action === 'ATTACK'){
            _executeMeleeCard(_lastMeleeAction);
        }
    }
});

// ── Game Loop ─────────────────────────────────────────────────────────────────
let lastT=performance.now(), frameCount=0, fpsTimer=0, rollingFt=16.67;
let lastRoomId=-1, lastRoomGx=-1, lastRoomGz=-1;

// Returns true if any live, non-ally monster is in the player's current room.
function _roomHasHostileMonster(){
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    const playerRoom = map[pgx]?.[pgz]?.roomId;
    if(playerRoom === undefined || playerRoom === -1) return false;
    for(const w of monsterWrappers){
        const ud = w.userData;
        if(ud.isDead || ud.isAlly) continue;
        const mgx = Math.round((ud.monBase?.position.x ?? w.position.x)/GRID);
        const mgz = Math.round((ud.monBase?.position.z ?? w.position.z)/GRID);
        const monRoom = ud.aiRoomId ?? map[mgx]?.[mgz]?.roomId;
        if(monRoom === playerRoom) return true;
    }
    return false;
}

// Tame the nearest non-dead, non-ally monster in the player's current room.
function _tamedInRoom(){
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    const playerRoom = map[pgx]?.[pgz]?.roomId;
    if(playerRoom === undefined || playerRoom === -1) return;
    let nearest=null, nearestD=Infinity;
    for(const w of monsterWrappers){
        const ud = w.userData;
        if(ud.isDead || ud.isAlly) continue;
        const monRoom = ud.aiRoomId ?? -1;
        if(monRoom !== playerRoom) continue;
        const d = Math.hypot((ud.monBase?.position.x??w.position.x)-px, (ud.monBase?.position.z??w.position.z)-pz);
        if(d < nearestD){ nearestD=d; nearest=w; }
    }
    if(!nearest) return;
    const ud = nearest.userData;
    ud.isAlly = true;
    ud.isHostile = false;
    ud.aiState = 'idle';
    _monSetAnim(ud, 'idle');
    // Recolour pedestal border blue = ally
    if(ud.pedestalBorder) ud.pedestalBorder.material.color.setHex(0x44aaff);
    window.parent.postMessage({type:'LOG_EVENT',logType:'system',
        text:`🎴 <b>${ud.name||'Monster'}</b> is won over — now your ally!`},'*');
}
let torchPhase=0;
const _tdFwd = new THREE.Vector3(); // reused every frame — avoids allocation
const _tdFwdLookAt = new THREE.Vector3();
const _tdLookAt = new THREE.Vector3();
let _combatCheckTimer = 0;
let _exitShown=false; // tracks whether SHOW_EXIT has been sent
let autoMeleeTimer=0; // throttle for bump-attack auto-melee
let _autoMeleeToggle=false; // alternates SLASH ↔ THRUST
let _lastMeleeAction='SLASH'; // tracks last player-fired melee card for ATTACK button
let _lastSentRot=null, _lastSentMoving=null, _rotMsgTimer=0; // postMessage throttle

function loop(){
    requestAnimationFrame(loop);
    const now=performance.now();
    if(now<hitStopUntil) return; // Hit-stop pause
    const raw=Math.min((now-lastT)/1000,0.05);
    const dt=raw; lastT=now;

    // Rotation — natural compass bearing: Left turns CCW, Right turns CW.
    const rotL = keys['ArrowLeft'] ||keys['a']||keys['Numpad4']||keys['4'];
    const rotR = keys['ArrowRight']||keys['d']||keys['Numpad6']||keys['6'];
    if(rotL) rot-=ROT_SPD*dt;
    if(rotR) rot+=ROT_SPD*dt;

    // Movement input
    const fwd  = keys['ArrowUp']||keys['w']||keys['Numpad8']||keys['8'];
    const back = keys['ArrowDown']||keys['s']||keys['Numpad2']||keys['2'];

    // ── Auto-Walk State Machine ──────────────────────────────────────────────
    // Hold forward >2s → engage auto-walk. Releases or reverse cancels it.
    // BLOCKED entirely while a hostile monster shares the player's room.
    const _monsterBlocking = _roomHasHostileMonster();
    if(_monsterBlocking && autoWalk){
        autoWalk = false;
        window.parent.postMessage({type:'LOG_EVENT',logType:'system',
            text:'⚔️ Auto-walk halted — hostile monster in room!'},'*');
    }
    if(fwd && !_monsterBlocking){
        if(fwdHoldStart === 0) fwdHoldStart = now;
        if(!autoWalk && (now - fwdHoldStart) >= AUTO_WALK_HOLD_MS){
            autoWalk = true;
            window.parent.postMessage({type:'LOG_EVENT',logType:'system',
                text:'⮕ Auto-walk engaged. Tap S/Down or any action to stop.'},'*');
        }
    } else {
        if(_monsterBlocking) fwdHoldStart = 0; // prevent timer accumulating while blocked
        else if(!fwd) fwdHoldStart = 0;
    }
    if(back || autoWalkInterrupt){
        if(autoWalk){
            autoWalk = false;
            window.parent.postMessage({type:'LOG_EVENT',logType:'system',text:'⏹ Auto-walk stopped.'},'*');
        }
        autoWalkInterrupt = false;
    }

    // Step magnitude: faster when auto-walking, normal otherwise
    const moveActive = fwd || back || autoWalk;
    const speed = (autoWalk && !back) ? AUTO_SPD : MOVE_SPD;
    const step  = speed * dt;
    isMoving = false;

    // ── Smart Collision-Avoiding Move ─────────────────────────────────────────
    // For auto-walk (and ordinary forward), if direct path is blocked, probe
    // small yaw offsets (±18°, ±36°) to slide along walls and gracefully
    // round corners — like a person feeling the wall with their shoulder.
    const tryMove = (sign) => {
        // sign = +1 forward, -1 backward
        const probes = (autoWalk && sign>0)
            ? [0, 0.31, -0.31, 0.63, -0.63]   // straight, ±18°, ±36°
            : [0];                              // manual: only direct path
        for(const off of probes){
            const yaw = rot + off;
            // Compass bearing: forward at rot=0 should be -Z (north).
            const dx =  Math.sin(yaw) * step * sign;
            const dz = -Math.cos(yaw) * step * sign;
            const nx = px + dx, nz = pz + dz;
            // Try diagonal first; fall back to axis-only slide
            if(canWalk(nx, nz)){ px = nx; pz = nz; isMoving = true; _pipOnPlayerStep(); return true; }
            if(off === 0){ // axis-slide on direct path only
                if(canWalk(nx, pz)){ px = nx; isMoving = true; }
                if(canWalk(px, nz)){ pz = nz; isMoving = true; }
                if(isMoving){ _pipOnPlayerStep(); return true; }
            }
        }
        return false;
    };

    if(fwd || autoWalk){
        const moved = tryMove(+1);
        // Auto-walk gives up if it's been blocked for >0.6s straight
        if(autoWalk){
            if(!moved){
                autoWalkBlockedT += dt;
                if(autoWalkBlockedT > 0.6){
                    autoWalk = false;
                    autoWalkBlockedT = 0;
                    window.parent.postMessage({type:'LOG_EVENT',logType:'system',
                        text:'⏹ Auto-walk halted — path blocked.'},'*');
                }
            } else {
                autoWalkBlockedT = 0;
            }
        }
    }
    if(back) tryMove(-1);

    // ── Realistic walking cadence (2 footsteps per gait cycle) ────────────────
    // bobT advances at 2π·STEP_HZ rad/s — one full sin period = 2 footsteps
    if(moveActive && isMoving){
        bobT += dt * (2 * Math.PI * STEP_HZ) * (autoWalk ? 1.05 : 1.0);
    } else {
        bobT *= 0.86; // gracefully decay back to zero
    }
    // Vertical heel-strike (full speed sin) + lateral hip sway (half-speed cos)
    bobH    = Math.abs(Math.sin(bobT)) * BOB_AMP;          // always positive — head dips down each step
    bobSway = Math.cos(bobT * 0.5)     * SWAY_AMP;         // hip sway alternates with each foot
    // Tiny forward pitch jolt on heel impact (negative spike)
    const heelPitch = Math.max(0, -Math.cos(bobT)) * 0.018;

    // Camera trauma shake
    let shakeX=0, shakeY=0;
    if(cameraTrauma>0){
        const s=cameraTrauma*cameraTrauma;
        shakeX=(Math.random()-0.5)*s*0.08; shakeY=(Math.random()-0.5)*s*0.06;
        cameraTrauma=Math.max(0,cameraTrauma-dt*3.0);
    }

    // Camera position — then push back from walls so the near-plane never clips
    let cpx = px + bobSway, cpz = pz;
    const WALL_PUSH = 0.38; // min distance from wall centre in world units
    const cgxC = Math.round(cpx/GRID), cgzC = Math.round(cpz/GRID);
    if(map[cgxC+1]?.[cgzC]?.type === 'wall') cpx = Math.min(cpx, (cgxC+1)*GRID - WALL_PUSH);
    if(map[cgxC-1]?.[cgzC]?.type === 'wall') cpx = Math.max(cpx, (cgxC-1)*GRID + WALL_PUSH);
    if(map[cgxC]?.[cgzC+1]?.type === 'wall') cpz = Math.min(cpz, (cgzC+1)*GRID - WALL_PUSH);
    if(map[cgxC]?.[cgzC-1]?.type === 'wall') cpz = Math.max(cpz, (cgzC-1)*GRID + WALL_PUSH);
    camera.position.set(cpx, EYE_HEIGHT - bobH, cpz);
    // Three.js camera default looks down -Z (== NORTH). Compass-bearing rot
    // increases clockwise; three.js Y rotation is CCW. Negate so camera
    // facing matches compass bearing: rot=0→-Z, rot=π/2→+X (east).
    camera.rotation.y = -rot + shakeX;
    camera.rotation.x = -0.04 - heelPitch + shakeY; // slight downward lean on each step

    // Torch flicker — only animate lights within culling distance of camera
    const LANTERN_CULL_DIST = GRID * 9; // ~9 tiles — beyond this, light intensity = 0
    torchPhase += dt * 1.8;
    torchLights.forEach((tl, i) => {
        const lp = tl.parent; // pivot group
        if(lp && lp.position.distanceTo(camera.position) > LANTERN_CULL_DIST){
            if(tl.visible) tl.visible = false; // fully remove from render — saves shader passes
            return;
        }
        if(!tl.visible) tl.visible = true;
        tl.intensity = 2.5
            + Math.sin(torchPhase + i*1.3)   * 0.10
            + Math.sin(torchPhase*1.6 + i)   * 0.05;
    });
    // Magic Lantern — smooth cinematic breathe, no hard random cuts
    if(magicLanternOn){
        const f1 = Math.sin(torchPhase * 0.9)       * 0.04; // very slow swell
        const f2 = Math.sin(torchPhase * 1.7 + 1.1) * 0.02; // tiny second layer
        // Rare ghostly dip: smooth sin trough instead of random cut
        const dipWave = Math.sin(torchPhase * 0.23 + 2.5); // period ~27s
        const dip = dipWave < -0.92 ? (dipWave + 0.92) * 0.18 : 0; // gentle brief dim
        const flick = 1 + f1 + f2 + dip;
        headlamp.intensity       = lanternBaseInt  * flick;
        outerGlow.intensity      = lanternOuterInt * (0.95 + (flick-1)*0.4);
        nearFieldLight.intensity = lanternNearInt  * (0.97 + (flick-1)*0.3);
    }
    // Lantern sway — gentle pendulum from ceiling pivot
    lanterns.forEach(p=>{
        const t=now*0.001*p.userData.swaySpeed + p.userData.swayPhase;
        p.rotation.z=Math.sin(t)*0.08;
        p.rotation.x=Math.cos(t*0.7)*0.05;
    });
    // Loot card float + spin + pickup proximity
    updateLootCards(dt);

    // OniBaba8 integration
    const ob=window.oniBaba8||window.parent?.oniBaba8;
    if(ob){
        if(ob.getFogDensity) scene.fog.density=ob.getFogDensity();
        if(ob.getTorchFlicker){ const f=ob.getTorchFlicker(); if(f!==1){ torchLights.forEach(tl=>{ if(tl.visible && tl.intensity>0) tl.intensity*=f; }); } }
        if(ob.updatePlayerState) ob.updatePlayerState(MAP_W/2,MAP_H/2,px/GRID,pz/GRID,isMoving);
    }

    // Distance-cull monsters beyond 14 tiles — GPU skips their draw calls
    const MONSTER_CULL_DIST = GRID * 14;
    for(const w of monsterWrappers){
        const shouldShow = !w.userData.isDead &&
            Math.hypot(w.position.x - px, w.position.z - pz) < MONSTER_CULL_DIST;
        if(w.visible !== shouldShow) w.visible = shouldShow;
    }

    // Room enter detection
    const cgx=Math.round(px/GRID),cgz=Math.round(pz/GRID);
    if(cgx!==lastRoomGx||cgz!==lastRoomGz){
        lastRoomGx=cgx; lastRoomGz=cgz;
        const cell=map[cgx]?.[cgz];
        if(cell?.roomId!==undefined&&cell.roomId!==lastRoomId){
            lastRoomId=cell.roomId;
            if(ob?.onRoomEnter) ob.onRoomEnter(cell.roomId);
            // Stop auto-walk on room transitions — player should survey new rooms
            if(autoWalk){ autoWalk=false;
                window.parent.postMessage({type:'LOG_EVENT',logType:'system',text:'⏹ Auto-walk paused — new room.'},'*');
            }
            // Log the room description (from in-game JSON data) to event log
            const rd = ROOM_DESCRIPTIONS[cell.roomId];
            if(rd){
                window.parent.postMessage({type:'LOG_EVENT',logType:'room',
                    text:`<b>▸ ${rd.name} ・ ${rd.kanji}</b><br>${rd.desc}`}, '*');
            }
        }
    }

    // ── Exit stairway — show modal only when player is ON the stairs tile ───────
    if(window._stairsUpGx !== undefined){
        const playerTile = map[cgx]?.[cgz]?.type;
        const onStairs = playerTile === 'stairs_up' || playerTile === 'stairs_up_r';
        if(onStairs && !_exitShown){
            _exitShown = true;
            window.parent.postMessage({type:'SHOW_EXIT'},'*');
            window.parent.postMessage({type:'LOG_EVENT', logType:'system',
                text:'🚪 The way out looms before you — iron-bound oak, mossy stone. <b>Exit the dungeon?</b>'},'*');
        } else if(!onStairs && _exitShown){
            _exitShown = false;
            window.parent.postMessage({type:'HIDE_EXIT'},'*');
        }
    }

    // Player avatar update (Layer 3)
    // NOTE: playerMixer is in the global `mixers` array and is updated by the
    // forEach loop below — do NOT update it here or the animation runs at 2×.
    playerAvatar.position.set(px,0,pz); playerAvatar.rotation.y=rot;
    // ── Smooth walk/idle blending (best-practice crossfade) ──────────────
    // Sync walk timeScale to actual ground speed so feet match (no skating).
    if(playerIdleAction && playerWalkAction){
        const FADE = 0.22; // seconds — smooth transition
        // Cycle length tuned for ~1.85 steps/sec at MOVE_SPD; scale linearly
        const refSpeed = MOVE_SPD;
        const curSpeed = isMoving ? (autoWalk ? AUTO_SPD : MOVE_SPD) : 0;
        const targetTS = isMoving ? Math.max(0.6, curSpeed / refSpeed) : 1.0;
        // Smooth timeScale toward target (avoids speed jumps on state change)
        playerWalkAction.timeScale += (targetTS - playerWalkAction.timeScale) * Math.min(1, dt*8);

        const wantWalk = isMoving;
        if(wantWalk && playerMixer._current !== 'walk'){
            playerWalkAction.enabled = true;
            playerWalkAction.setLoop(THREE.LoopRepeat, Infinity);
            playerWalkAction.reset();
            playerWalkAction.play();
            playerIdleAction.crossFadeTo(playerWalkAction, FADE, true);
            playerMixer._current = 'walk';
        } else if(!wantWalk && playerMixer._current !== 'idle'){
            playerIdleAction.enabled = true;
            playerIdleAction.setLoop(THREE.LoopRepeat, Infinity);
            playerIdleAction.reset();
            playerIdleAction.play();
            playerWalkAction.crossFadeTo(playerIdleAction, FADE, true);
            playerMixer._current = 'idle';
        }
    }

    // Mixers update
    const mixDt=clock.getDelta();
    mixers.forEach(m=>m.update(mixDt));

    // ── Monster AI + Combat ticks ────────────────────────────────────────────
    tickMonsterAI(dt);
    tickSpells(dt);
    tickBoulders(dt);
    tickMissiles(dt);
    tickDots(dt);
    _tickDyingMonsters(dt);

    // Proximity outline targeting + auto-melee bump collision
    let closestEnemy=null, closestDist=5.0;
    for(const mw of monsterWrappers){
        if(mw.userData.isDead || !mw.visible) continue;
        const ex=mw.position.x/GRID, ez=mw.position.z/GRID;
        const dist=Math.hypot(px/GRID-ex,pz/GRID-ez);
        if(dist<closestDist){closestDist=dist;closestEnemy=mw;}
    }
    if(closestEnemy!==activeTarget){
        activeTarget=closestEnemy;
        outlinePass.selectedObjects=closestEnemy?[closestEnemy]:[];
        outlinePass.enabled = !!closestEnemy; // disable pass entirely when nothing targeted
    }
    // Ethereal silhouette: rebuild list only when visible monster set changes
    {
        let _moChanged = false;
        const _moList = monOutlinePass.selectedObjects;
        let idx = 0;
        for(const mw of monsterWrappers){
            if(mw.userData.isDead || !mw.visible) continue;
            if(_moList[idx] !== mw){ _moChanged=true; }
            idx++;
        }
        if(idx !== _moList.length) _moChanged=true;
        if(_moChanged){
            const fresh=[];
            for(const mw of monsterWrappers) if(!mw.userData.isDead && mw.visible) fresh.push(mw);
            monOutlinePass.selectedObjects=fresh;
            monOutlinePass.enabled = fresh.length > 0; // skip full depth pass when no monsters visible
        }
    }
    // Stop auto-walk if any live monster is within 6 world units
    if(autoWalk && closestEnemy && closestDist * GRID < 6){
        autoWalk=false;
        window.parent.postMessage({type:'LOG_EVENT',logType:'system',text:'⏹ Auto-walk stopped — enemy nearby!'},'*');
    }
    // Auto-melee: bump into a monster → alternating SLASH / THRUST (throttled 1.2s)
    autoMeleeTimer-=dt;
    if(closestEnemy && closestDist < 1.5/GRID && isMoving && autoMeleeTimer<=0){
        autoMeleeTimer = 1.2;
        const w = monsterWrappers.find(mw=>mw===closestEnemy||mw.userData.monBase===closestEnemy);
        const target = w || closestEnemy;
        if(!target.userData?.isDead){
            _autoMeleeToggle = !_autoMeleeToggle;
            const meleeAction = _autoMeleeToggle ? 'THRUST' : 'SLASH';
            const dmg = calcDamage(meleeAction);
            _applyMonsterDamage(target, dmg, 'DEFAULT');
            _spawnMeleeVFX(meleeAction);
            _pushMonster(target, meleeAction === 'THRUST' ? 5.5 : 3.0);
            _spawnHitBurst(target.position.clone().setY(1.2), 'DEFAULT');
            addCameraTrauma(meleeAction === 'THRUST' ? 0.28 : 0.22);
            triggerHitStop(meleeAction === 'THRUST' ? 65 : 55);
            window.parent.postMessage({type:'COMBAT_ATTACK', action:meleeAction, autoMelee:true},'*');
        }
    }

    // ── Visibility check: monster in front of player + clear line-of-sight ──
    // Throttled to ~10fps — LOS raycasting is expensive, doesn't need 60fps.
    _combatCheckTimer = (_combatCheckTimer||0) - dt;
    if(_combatCheckTimer <= 0){
    _combatCheckTimer = 0.10; // recheck every 100ms
    {
        const fwdX = Math.sin(rot), fwdZ = -Math.cos(rot);
        let combatVisible = false;
        let nearestVisible = null;
        let nearestDist = Infinity;
        for(const w of monsterWrappers){
            if(w.userData.isDead || !w.visible) continue;
            const ex = w.position.x - px, ez = w.position.z - pz;
            const dist = Math.sqrt(ex*ex + ez*ez);
            if(dist < 0.01) continue;
            const dot = (ex/dist)*fwdX + (ez/dist)*fwdZ;
            if(dot > 0.707){ // cos(45°) — within 90° forward cone
                if(!_hasLineOfSight(px, pz, w.position.x, w.position.z)) continue;
                combatVisible = true;
                if(dist < nearestDist){ nearestDist=dist; nearestVisible=w; }
            }
        }
        if(combatVisible !== _lastCombatVisible){
            _lastCombatVisible = combatVisible;
            if(combatVisible && nearestVisible){
                const ud = nearestVisible.userData;
                window.parent.postMessage({
                    type:'SHOW_COMBAT',
                    health: ud.hp ?? 50,
                    maxHp:  ud.maxHp ?? 50,
                    name:   ud.name ?? 'Yakuza Goblin'
                }, '*');
            } else {
                window.parent.postMessage({type:'HIDE_COMBAT'}, '*');
            }
        }
    }
    } // end throttled combat check

    // Communicate to panels — only when state actually changes (saves ~60-120 postMessage/sec)
    _rotMsgTimer -= dt;
    if(_rotMsgTimer <= 0 && Math.abs(rot - _lastSentRot) > 0.002){
        _rotMsgTimer = 0.033; // cap at ~30fps for compass smoothness
        _lastSentRot = rot;
        window.parent.postMessage({type:'PLAYER_ROT_REALTIME', rot}, '*');
    }
    if(isMoving !== _lastSentMoving){
        _lastSentMoving = isMoving;
        window.parent.postMessage({type:'PLAYER_MOVE_STATE', isMoving}, '*');
    }

    // ── Top-Down camera animation ───────────────────────────────────────
    // Smoothly ease pitch/yaw toward selected preset, and blend modeAlpha for
    // the FPV↔topdown crossfade. The visible render camera blends position
    // and lookAt from FPV pose to orbital pose using modeAlpha.
    {
        const easeP = Math.min(1, dt * 4.5);
        topDownPitch     += (targetTopDownPitch - topDownPitch) * easeP;
        topDownYaw       += (targetTopDownYaw   - topDownYaw)   * easeP;
        modeAlpha        += (modeAlphaTarget - modeAlpha) * Math.min(1, dt * 3.0);
    }

    // Render — use composer only when outline passes are active (saves 2× extra scene renders)
    if(modeAlpha < 0.015){
        if(outlinePass.enabled || monOutlinePass.enabled){
            composer.render(dt);
        } else {
            renderer.render(scene, camera);
        }
    } else {
        // Blended top-down view — lerp pose from FPV cam to orbital pose.
        const t = modeAlpha;
        // Orbital target pose
        const pitchRad = topDownPitch * Math.PI/180;
        const yawRad   = topDownYaw   * Math.PI/180;
        const camY  = TOPDOWN_ORBIT_R * Math.sin(pitchRad);
        const camD  = TOPDOWN_ORBIT_R * Math.cos(pitchRad);
        const tdPosX = px + camD * Math.cos(yawRad);
        const tdPosZ = pz + camD * Math.sin(yawRad);
        // FPV pose
        const fpvPos = camera.position;
        // Blended camera position (smoothstep for nicer ease)
        const ts = t*t*(3-2*t);
        topDownCamera.position.set(
            fpvPos.x + (tdPosX - fpvPos.x) * ts,
            fpvPos.y + (camY   - fpvPos.y) * ts,
            fpvPos.z + (tdPosZ - fpvPos.z) * ts
        );
        // FPV look-at point (1m forward of camera)
        _tdFwd.set(0,0,-1).applyEuler(camera.rotation);
        const fpvLookAt = _tdFwdLookAt.copy(fpvPos).add(_tdFwd);
        _tdLookAt.set(px, 0, pz);
        const lookAt = fpvLookAt.lerp(_tdLookAt, ts);
        topDownCamera.lookAt(lookAt);
        // FOV blend: FPV is wider (75) than top-down (35). Lerp for buttery feel.
        topDownCamera.fov = 75 + (35 - 75) * ts;
        topDownCamera.updateProjectionMatrix();
        // Hide ceiling once we're meaningfully top-down so rooms read clearly.
        if(t > 0.45) topDownCamera.layers.disable(2);
        else         topDownCamera.layers.enable(2);
        renderer.render(scene, topDownCamera);
    }

    markSeen();
    sendPipFrame(dt); // render topDownCamera → RT → ImageBitmap → Panels
    if(fsMapOpen) drawFullMap();

    // Perf HUD
    frameCount++; fpsTimer+=dt;
    const ft=dt*1000; rollingFt=rollingFt*0.9+ft*0.1;
    if(fpsTimer>=0.5){
        const rt=Math.round(frameCount/fpsTimer), proj=Math.min(999,Math.round(1000/rollingFt));
        const budget=120, pct=Math.min(999,Math.round((rt/budget)*100));
        const rtEl=document.getElementById('hud-rt'),prEl=document.getElementById('hud-proj'),pcEl=document.getElementById('hud-pct'),barEl=document.getElementById('hud-bar');
        if(rtEl) rtEl.textContent=rt; if(prEl) prEl.textContent=proj; if(pcEl) pcEl.textContent=pct;
        const cls=pct>=95?'crit':pct>=75?'warn':'';
        [rtEl,prEl,pcEl].forEach(el=>{if(el)el.className='hud-val '+cls;});
        if(barEl){barEl.style.width=Math.min(100,pct)+'%';barEl.style.background=pct>=95?'linear-gradient(90deg,#ff4455,#ff0022)':pct>=75?'linear-gradient(90deg,#ffcc00,#ff8800)':'linear-gradient(90deg,#00ffc8,#00aaff)';}
        frameCount=0; fpsTimer=0;
        if(ob?.updateRenderStress) ob.updateRenderStress(pct);
        window.parent.postMessage({type:'ENGINE8_FRAME',budgetPct:pct},'*');
    }
}
