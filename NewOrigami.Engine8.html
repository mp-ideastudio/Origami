// ── Monster AI ────────────────────────────────────────────────────────────────
let _lastCombatVisible = false;

// ── Monster Alert System ──────────────────────────────────────────────────────
// Alert radius: all live monsters within ALERT_TILES grid-tiles of the HIT monster.
const ALERT_TILES = 5;

// T0.11 — Shared hostile-state materials (one allocation per scene, not per monster)
// Materials are MeshBasicMaterial so we use color only — older code tried to set
// .emissive on them which is undefined for Basic materials, silently failing.
const _PED_CORE_MAT_HOSTILE   = new THREE.MeshBasicMaterial({ color: 0x8a0000 }); // dark red base
const _PED_CAP_MAT_HOSTILE    = new THREE.MeshBasicMaterial({ color: 0xff2222 }); // bright red disc
const _PED_BORDER_MAT_HOSTILE = new THREE.MeshBasicMaterial({ color: 0xff5555 }); // glow-red ring
const _PED_ARROW_MAT_HOSTILE  = new THREE.MeshBasicMaterial({ color: 0xffe0e0, side: THREE.DoubleSide });

function _setMonsterHostile(w){
    if(w.userData.isDead || w.userData.aiState === 'hostile') return;
    w.userData.aiState = 'hostile';
    w.userData.isHostile = true;
    // Cancel any in-progress bow greeting
    w.userData._bowTimer = 0;
    w.userData._bowPartnerPos = null;
    // T0.11 — Swap disc materials to shared hostile set. Bright red rings instantly
    // read as "this monster is now a threat". Reuses cached materials (no allocs).
    if(w.userData.monBase){
        w.userData.monBase.traverse(c=>{
            if(!c.isMesh) return;
            const geo = c.geometry?.type;
            if(geo === 'TorusGeometry')                                                  c.material = _PED_BORDER_MAT_HOSTILE;
            else if(geo === 'CylinderGeometry' && c.material.color?.getHex() === 0x09070f) c.material = _PED_CORE_MAT_HOSTILE;
            else if(geo === 'CylinderGeometry' && c.material.color?.getHex() === 0x1a0d2e) c.material = _PED_CAP_MAT_HOSTILE;
            else if(geo === 'ShapeGeometry')                                              c.material = _PED_ARROW_MAT_HOSTILE;
        });
    }
}

// _alertRoom: when any monster is hit, ALL monsters in the same room go hostile.
// Falls back to 5-tile radius for hallway monsters (roomId === -1).
function _alertRoom(hitW){
    if(!hitW) return;
    // Ensure aiRoomId is resolved on the hit monster
    if(hitW.userData.aiRoomId === undefined){
        const mgx = Math.round(hitW.position.x/GRID);
        const mgz = Math.round(hitW.position.z/GRID);
        hitW.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
    }
    const roomId = hitW.userData.aiRoomId;
    const hx = hitW.position.x, hz = hitW.position.z;
    for(const w of monsterWrappers){
        if(w.userData.isDead) continue;
        // Ensure peer roomId is resolved
        if(w.userData.aiRoomId === undefined){
            const mgx = Math.round(w.position.x/GRID);
            const mgz = Math.round(w.position.z/GRID);
            w.userData.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
        }
        const sameRoom = roomId !== -1 && w.userData.aiRoomId === roomId;
        const dx = w.position.x - hx, dz = w.position.z - hz;
        const nearbyHall = Math.sqrt(dx*dx + dz*dz) / GRID <= ALERT_TILES;
        if(sameRoom || nearbyHall) _setMonsterHostile(w);
    }
}

// Backward-compat alias so any remaining callers don't break
function _alertNearby(hitW){ _alertRoom(hitW); }
// aggroRoom: alert all monsters in a room by player position.
// Finds the closest live monster as the "hit" anchor; falls back to
// a synthetic wrapper at the player's position so the radius check works.
function aggroRoom(roomId){
    // Find closest live monster to alert from
    let anchor = null, bestDist = Infinity;
    for(const w of monsterWrappers){
        if(w.userData.isDead) continue;
        const dx = w.position.x - px, dz = w.position.z - pz;
        const d = dx*dx + dz*dz;
        if(d < bestDist){ bestDist=d; anchor=w; }
    }
    if(anchor){
        // Override aiRoomId so same-room logic uses the player's current room
        if(roomId !== undefined && roomId !== null && roomId !== -1)
            anchor.userData.aiRoomId = roomId;
        _alertRoom(anchor);
    }
}

const MON_WANDER_SPD = 1.4; // world-units/sec while wandering idle

function _monSetAnim(ud, key){
    if(ud._animKey === key) return;
    ud._animKey = key;
    const ia = ud.idleAction, wa = ud.walkAction, ba = ud.bowAction;
    if(key === 'death'){
        // Stop everything hard, crossfade into death clip
        const aa = ud.attackAction || ud.slashAction;
        if(ia) ia.fadeOut(0.15);
        if(wa) wa.fadeOut(0.15);
        if(aa && aa !== ba) aa.fadeOut(0.15);
        if(ba){
            ba.reset();
            ba.setLoop(THREE.LoopOnce, 1);
            ba.clampWhenFinished = true;
            ba.fadeIn(0.15);
            ba.play();
        }
        return;
    }
    if(!ia || !wa) return;
    const aa = ud.attackAction || ud.slashAction;
    if(key === 'bow'){
        const ba2 = ud.bowAction;
        if(ba2){
            ia.fadeOut(0.15); wa.fadeOut(0.15);
            ba2.reset();
            ba2.setLoop(THREE.LoopOnce, 1);
            ba2.clampWhenFinished = true;
            ba2.fadeIn(0.15);
            ba2.play();
            // Return to idle once the clip finishes
            const dur = (ba2.getClip?.()?.duration ?? 1.0) * 1000;
            setTimeout(()=>{ if(ud._animKey==='bow'){ ud._animKey=null; _monSetAnim(ud,'idle'); } }, dur);
        } else {
            // No bow clip — just idle
            ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity); ia.play();
        }
        return;
    }
    if(key === 'attack' && aa){
        ia.stop(); wa.stop();
        aa.reset();
        aa.setLoop(THREE.LoopOnce, 1);
        aa.clampWhenFinished = false;
        aa.play();
        // Return to idle after the clip finishes (~0.7s)
        const dur = (aa.getClip?.()?.duration ?? 0.7) * 1000 * 0.85;
        setTimeout(()=>{ if(ud._animKey==='attack'){ ud._animKey=null; _monSetAnim(ud,'idle'); } }, dur);
        return;
    }
    if(ia === wa){
        // Only one clip — speed it up for walk, normal for idle
        ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity);
        ia.timeScale = (key === 'walk') ? 1.8 : 1.0;
        ia.play();
    } else if(key === 'walk'){
        // Ensure idle is running so crossFadeTo has something to fade FROM
        if(!ia.isRunning()){ ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity); ia.play(); }
        wa.reset(); wa.setLoop(THREE.LoopRepeat, Infinity); wa.timeScale = 1.0;
        ia.crossFadeTo(wa, 0.2, true);
        wa.play();
    } else {
        // Idle: fade walk back to idle
        if(!wa.isRunning()){ wa.reset(); wa.setLoop(THREE.LoopRepeat, Infinity); wa.play(); }
        ia.reset(); ia.setLoop(THREE.LoopRepeat, Infinity); ia.timeScale = 1.0;
        wa.crossFadeTo(ia, 0.2, true);
        ia.play();
    }
}

function _pickWanderTarget(monBase, roomId){
    const cx = monBase.position.x/GRID, cz = monBase.position.z/GRID;
    for(let t=0; t<14; t++){
        const dx = (Math.random()-0.5)*6, dz = (Math.random()-0.5)*6;
        const tx = cx+dx, tz = cz+dz;
        const itx = Math.round(tx), itz = Math.round(tz);
        if(itx<0||itx>=MAP_W||itz<0||itz>=MAP_H) continue;
        const cell = map[itx]?.[itz];
        if(!cell || cell.type !== 'floor') continue;
        if(cell.roomId !== roomId) continue;
        if(!canWalk(tx*GRID, tz*GRID)) continue;
        return {x: tx*GRID, z: tz*GRID};
    }
    return null;
}

// ── A* chase pathfinding ─────────────────────────────────────────────────────
// Grid-based, 4-directional, Manhattan heuristic, capped at MAX_NODES
// expansions. Cached per-monster in ud.aiPath; recomputed when stale or
// blocked. Returns array of [gx,gz] tuples from start to goal, or null.
const _MON_A_STAR_MAX = 200;
function _monAStar(sx, sz, gx, gz){
    if(sx === gx && sz === gz) return [[sx,sz]];
    // Bail fast if goal is in a wall
    const goalCell = map[gx]?.[gz];
    if(!goalCell || goalCell.type === 'wall') return null;

    const open = [{gx:sx, gz:sz, f: Math.abs(sx-gx)+Math.abs(sz-gz)}];
    const gScore = new Map();
    const cameFrom = new Map();
    const sk = sx + ',' + sz;
    gScore.set(sk, 0);
    const closed = new Set();
    let expanded = 0;

    while(open.length && expanded < _MON_A_STAR_MAX){
        // O(n) min — n stays small for short chase paths
        let bestIdx = 0;
        for(let i=1; i<open.length; i++) if(open[i].f < open[bestIdx].f) bestIdx = i;
        const cur = open.splice(bestIdx, 1)[0];
        const ck = cur.gx + ',' + cur.gz;
        if(cur.gx === gx && cur.gz === gz){
            // reconstruct
            const path = [[cur.gx, cur.gz]];
            let k = ck;
            while(cameFrom.has(k)){
                k = cameFrom.get(k);
                const [px2,pz2] = k.split(',').map(Number);
                path.unshift([px2, pz2]);
            }
            return path;
        }
        closed.add(ck);
        expanded++;
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for(let d=0; d<4; d++){
            const nx = cur.gx + dirs[d][0];
            const nz = cur.gz + dirs[d][1];
            if(nx<0||nx>=MAP_W||nz<0||nz>=MAP_H) continue;
            const cell = map[nx]?.[nz];
            if(!cell || cell.type === 'wall') continue;
            const nk = nx + ',' + nz;
            if(closed.has(nk)) continue;
            const tg = (gScore.get(ck) ?? Infinity) + 1;
            if(tg < (gScore.get(nk) ?? Infinity)){
                cameFrom.set(nk, ck);
                gScore.set(nk, tg);
                const f = tg + Math.abs(nx-gx) + Math.abs(nz-gz);
                // Replace or push
                let foundOpen = false;
                for(let i=0; i<open.length; i++){
                    if(open[i].gx===nx && open[i].gz===nz){ open[i].f = f; foundOpen = true; break; }
                }
                if(!foundOpen) open.push({gx:nx, gz:nz, f});
            }
        }
    }
    return null;
}

const _atkVec3 = new THREE.Vector3(); // reused in hostile attack — no per-frame alloc
function tickMonsterAI(dt){
    const now = performance.now()*0.001;
    for(const w of monsterWrappers){
        if(w.userData.isDead) continue;
        const ud = w.userData;
        if(!ud.aiState) ud.aiState = 'idle';
        if(!ud.aiNextTurn) ud.aiNextTurn = now + 0.5 + Math.random()*2;
        const monBase = ud.monBase;
        if(!monBase) continue;

        // ── Knockback impulse (from melee hit) ───────────────────────────────
        if(ud._knockT > 0){
            ud._knockT -= dt;
            const decay = Math.max(0, ud._knockT / 0.22);
            const kx = monBase.position.x + ud._knockImpulseX * dt * (1 + decay*3);
            const kz = monBase.position.z + ud._knockImpulseZ * dt * (1 + decay*3);
            const gkx = Math.round(kx/GRID), gkz = Math.round(kz/GRID);
            if(map[gkx]?.[gkz]?.type !== 'wall'){
                monBase.position.x = kx; monBase.position.z = kz;
            }
            if(ud._knockT <= 0){ ud._knockImpulseX=0; ud._knockImpulseZ=0; }
        }

        if(ud.aiRoomId === undefined){
            const mgx = Math.round(monBase.position.x/GRID);
            const mgz = Math.round(monBase.position.z/GRID);
            ud.aiRoomId = map[mgx]?.[mgz]?.roomId ?? -1;
        }

        if(ud.aiState === 'idle'){
            // ── Bow greeting: two idle monsters within 1 tile face + bow at each other ──
            if(!ud._bowCooldown || now > ud._bowCooldown){
                const BOW_RANGE = GRID * 1.1;
                for(const peer of monsterWrappers){
                    if(peer === w || peer.userData.isDead) continue;
                    if(peer.userData.aiState !== 'idle') continue;
                    if(peer.userData._bowCooldown && now < peer.userData._bowCooldown) continue;
                    const pdx = peer.userData.monBase.position.x - monBase.position.x;
                    const pdz = peer.userData.monBase.position.z - monBase.position.z;
                    if(Math.sqrt(pdx*pdx + pdz*pdz) < BOW_RANGE){
                        const BOW_COOLDOWN = 12; // seconds before they'll bow again
                        const BOW_DUR = (ud.bowAction?.getClip?.()?.duration ?? 1.2) + 0.3;
                        // Snap both to face each other
                        const angleToward  = Math.atan2(pdx, pdz);
                        const angleAway    = Math.atan2(-pdx, -pdz);
                        monBase.rotation.y = angleToward;  w.rotation.y = angleToward;
                        peer.userData.monBase.rotation.y = angleAway; peer.rotation.y = angleAway;
                        // Enter bow state for both
                        ud.aiState = 'bow';
                        ud._bowTimer = BOW_DUR;
                        ud._bowPartnerPos = {x: peer.userData.monBase.position.x, z: peer.userData.monBase.position.z};
                        ud._bowCooldown = now + BOW_COOLDOWN;
                        ud.aiWalkTarget = null;
                        peer.userData.aiState = 'bow';
                        peer.userData._bowTimer = BOW_DUR;
                        peer.userData._bowPartnerPos = {x: monBase.position.x, z: monBase.position.z};
                        peer.userData._bowCooldown = now + BOW_COOLDOWN;
                        peer.userData.aiWalkTarget = null;
                        _monSetAnim(ud, 'bow');
                        _monSetAnim(peer.userData, 'bow');
                        break;
                    }
                }
            }
            if(ud.aiState !== 'idle') continue; // bow state set above — skip rest of idle

            if(now >= ud.aiNextTurn || ud.aiWalkTarget === undefined){
                ud.aiNextTurn = now + 2 + Math.random()*3;
                // Pick a random live peer without allocating a filter array
                let target = null;
                if(Math.random() < 0.60){
                    let peerCount = 0;
                    for(const p of monsterWrappers) if(p!==w && !p.userData.isDead) peerCount++;
                    if(peerCount > 0){
                        let pick = Math.floor(Math.random()*peerCount), pi = 0;
                        for(const p of monsterWrappers){
                            if(p===w || p.userData.isDead) continue;
                            if(pi++ === pick){ const pm=p.userData.monBase; if(pm) target={x:pm.position.x,z:pm.position.z}; break; }
                        }
                    }
                }
                if(!target) target = _pickWanderTarget(monBase, ud.aiRoomId);
                ud.aiWalkTarget = target;
            }
            if(ud.aiWalkTarget){
                const dx = ud.aiWalkTarget.x - monBase.position.x;
                const dz = ud.aiWalkTarget.z - monBase.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if(dist < 0.25){
                    ud.aiWalkTarget = null;
                    _monSetAnim(ud, 'idle');
                } else {
                    const step = MON_WANDER_SPD * dt;
                    const nx = monBase.position.x + (dx/dist)*step;
                    const nz = monBase.position.z + (dz/dist)*step;
                    if(canWalk(nx, nz)){
                        monBase.position.x = nx; monBase.position.z = nz;
                        w.position.x = nx; w.position.z = nz;
                    } else {
                        ud.aiWalkTarget = null;
                    }
                    const wantAngle = Math.atan2(dx, dz); // face direction of travel
                    let diff = wantAngle - (monBase.rotation.y||0);
                    while(diff > Math.PI) diff -= Math.PI*2;
                    while(diff < -Math.PI) diff += Math.PI*2;
                    monBase.rotation.y += diff * Math.min(1, dt*5);
                    w.rotation.y = monBase.rotation.y;
                    _monSetAnim(ud, 'walk');
                }
            } else {
                _monSetAnim(ud, 'idle');
            }
        } else if(ud.aiState === 'hostile'){
            const dxRaw = px - monBase.position.x;
            const dzRaw = pz - monBase.position.z;
            const dist = Math.sqrt(dxRaw*dxRaw + dzRaw*dzRaw);

            // ── A* chase: compute a tile path and follow it around walls ──
            //
            // Recompute when: no path, path stale (>0.6s), player's tile
            // changed by ≥2 from when path was computed, or the next step
            // is blocked.
            const sgx = Math.round(monBase.position.x/GRID);
            const sgz = Math.round(monBase.position.z/GRID);
            const pgx = Math.round(px/GRID);
            const pgz = Math.round(pz/GRID);
            const pathAge = now - (ud.aiPathStamp || 0);
            const goalDrift = ud.aiPathGoalX===undefined ? 99 :
                              (Math.abs(pgx-ud.aiPathGoalX) + Math.abs(pgz-ud.aiPathGoalZ));
            let needPath = !ud.aiPath || pathAge > 0.6 || goalDrift >= 2;
            if(needPath){
                ud.aiPath = _monAStar(sgx, sgz, pgx, pgz);
                ud.aiPathIdx = 0;
                ud.aiPathStamp = now;
                ud.aiPathGoalX = pgx;
                ud.aiPathGoalZ = pgz;
                // Skip the first node — it's the current tile
                if(ud.aiPath && ud.aiPath.length > 1) ud.aiPathIdx = 1;
            }

            // Resolve current path target (or fall back to direct)
            let tgtX = px, tgtZ = pz;
            if(ud.aiPath && ud.aiPathIdx < ud.aiPath.length){
                const [tgx, tgz] = ud.aiPath[ud.aiPathIdx];
                tgtX = tgx * GRID;
                tgtZ = tgz * GRID;
                // Advance index if we've reached this tile
                const adx = tgtX - monBase.position.x;
                const adz = tgtZ - monBase.position.z;
                if(adx*adx + adz*adz < 0.16){ // ~0.4 unit radius
                    ud.aiPathIdx++;
                    if(ud.aiPathIdx >= ud.aiPath.length){
                        // path exhausted — fall through to direct toward player next frame
                        ud.aiPath = null;
                    }
                }
            }

            // Face the immediate target (not the final goal — feels more natural around corners)
            const fdx = tgtX - monBase.position.x;
            const fdz = tgtZ - monBase.position.z;
            const wantAngle = Math.atan2(fdx, fdz);
            let diff = wantAngle - (monBase.rotation.y||0);
            while(diff > Math.PI) diff -= Math.PI*2;
            while(diff < -Math.PI) diff += Math.PI*2;
            monBase.rotation.y += diff * Math.min(1, dt*4);
            w.rotation.y = monBase.rotation.y;

            if(dist > 2.5){
                const step = MON_WANDER_SPD * 1.6 * dt;
                const sdx = tgtX - monBase.position.x;
                const sdz = tgtZ - monBase.position.z;
                const slen = Math.sqrt(sdx*sdx + sdz*sdz) || 1;
                const nx = monBase.position.x + (sdx/slen)*step;
                const nz = monBase.position.z + (sdz/slen)*step;
                if(canWalk(nx, nz)){
                    monBase.position.x = nx; monBase.position.z = nz;
                    w.position.x = nx; w.position.z = nz;
                } else {
                    // Wall-slide: try axis-aligned components separately
                    const nxOnly = monBase.position.x + (sdx/slen)*step;
                    if(canWalk(nxOnly, monBase.position.z)){
                        monBase.position.x = nxOnly; w.position.x = nxOnly;
                    } else {
                        const nzOnly = monBase.position.z + (sdz/slen)*step;
                        if(canWalk(monBase.position.x, nzOnly)){
                            monBase.position.z = nzOnly; w.position.z = nzOnly;
                        } else {
                            // Truly blocked — invalidate path so next frame recomputes
                            ud.aiPath = null;
                        }
                    }
                }
                _monSetAnim(ud, 'walk');
                ud._atkCooldown = (ud._atkCooldown || 0) > 0 ? ud._atkCooldown - dt : 0;
            } else {
                // Melee range — attack player on cooldown
                ud._atkCooldown = (ud._atkCooldown || 0) - dt;
                if(ud._atkCooldown <= 0){
                    ud._atkCooldown = 1.2 + Math.random() * 0.8; // 1.2–2s between hits
                    const atkDmg = 5 + Math.floor(Math.random() * 8); // 5–12 raw damage
                    _monSetAnim(ud, 'attack');
                    window.parent.postMessage({type:'MONSTER_ATTACK', damage: atkDmg,
                        name: ud.name||'Goblin'},'*');
                    addCameraTrauma(0.35);
                    triggerHitStop(80);
                    spawnDamageText(atkDmg, _atkVec3.set(px, 1.2, pz), true);
                } else {
                    _monSetAnim(ud, 'idle');
                }
            }
        } else if(ud.aiState === 'bow'){
            // Hold facing toward bow partner; tick down timer then return to idle
            if(ud._bowPartnerPos){
                const bdx = ud._bowPartnerPos.x - monBase.position.x;
                const bdz = ud._bowPartnerPos.z - monBase.position.z;
                const bAngle = Math.atan2(bdx, bdz);
                let bdiff = bAngle - (monBase.rotation.y||0);
                while(bdiff > Math.PI) bdiff -= Math.PI*2;
                while(bdiff < -Math.PI) bdiff += Math.PI*2;
                monBase.rotation.y += bdiff * Math.min(1, dt*8);
                w.rotation.y = monBase.rotation.y;
            }
            ud._bowTimer = (ud._bowTimer||0) - dt;
            if(ud._bowTimer <= 0){
                ud.aiState = 'idle';
                ud._bowPartnerPos = null;
                ud.aiWalkTarget = null;
                ud.aiNextTurn = now + 0.5 + Math.random();
                _monSetAnim(ud, 'idle');
            }
        } else if(ud.aiState === 'flee'){
            // Run directly away from player
            const fdx = monBase.position.x - px;
            const fdz = monBase.position.z - pz;
            const fdist = Math.sqrt(fdx*fdx + fdz*fdz);
            if(fdist > 0.01){
                // Face away from player (flee direction)
                const fleeAngle = Math.atan2(fdx, fdz);
                let fdiff = fleeAngle - (monBase.rotation.y||0);
                while(fdiff > Math.PI) fdiff -= Math.PI*2;
                while(fdiff < -Math.PI) fdiff += Math.PI*2;
                monBase.rotation.y += fdiff * Math.min(1, dt*5);
                w.rotation.y = monBase.rotation.y;

                const step = MON_WANDER_SPD * 2.0 * dt; // flee faster than walk
                const nx = monBase.position.x + (fdx/fdist)*step;
                const nz = monBase.position.z + (fdz/fdist)*step;
                if(canWalk(nx, nz)){
                    monBase.position.x = nx; monBase.position.z = nz;
                    w.position.x = nx; w.position.z = nz;
                    ud._fleeBlockedT = 0;
                    _monSetAnim(ud, 'walk');
                } else {
                    // Cornered — turn and fight!
                    ud._fleeBlockedT = (ud._fleeBlockedT||0) + dt;
                    if(ud._fleeBlockedT > 0.6){
                        ud.aiState = 'hostile';
                        ud.isHostile = true;
                        ud._fleeBlockedT = 0;
                        const cName = ud.name || 'Goblin';
                        window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                            text:`😤 <b>${cName}</b> is cornered and turns to fight!`}, '*');
                    } else {
                        _monSetAnim(ud, 'idle');
                    }
                }
            }
        }
    }
}

function _cardElement(name){
    const n = (name||'').toUpperCase();
    if(/FIRE|FLAME|INFERNO|PYRO/.test(n)) return 'FIRE';
    if(/WATER|WAVE|AQUA|TIDE|FLOOD/.test(n)) return 'WATER';
    if(/EARTH|ROCK|STONE|BOULDER|QUAKE/.test(n)) return 'EARTH';
    if(/WIND|AIR|STORM|GALE|CYCLONE/.test(n)) return 'WIND';
    if(/VOID|SHADOW|DARK|DEATH/.test(n)) return 'VOID';
    return 'DEFAULT';
}

function _cardCategory(name){
    const n = (name||'').toUpperCase();
    if(/FIREBALL|LIGHTNING|SPELL|ARCANE|BOLT|BLAST|NOVA/.test(n)) return 'SPELL';
    if(/SLASH|STRIKE|THRUST|HEAVY|SWORD|KATANA|BLADE/.test(n)) return 'COMBAT';
    if(/POTION|SCROLL|LANTERN|ITEM|RING/.test(n)) return 'ITEM';
    if(/BOW|SHURIKEN|DAGGER|ARROW|CROSSBOW|MISSILE/.test(n)) return 'MISSILE';
    return 'DEFAULT';
}

function _getMissileTable(cardName){
    const n = (cardName||'').toUpperCase();
    if(/SHURIKEN|THROWING STAR/.test(n)) return { ...MISSILE_TABLE.SHURIKEN, isCrit: false };
    if(/LONG BOW|LONGBOW/.test(n))        return { ...MISSILE_TABLE.LONG_BOW,  isCrit: false };
    if(/SHORT BOW|SHORTBOW/.test(n))      return { ...MISSILE_TABLE.SHORT_BOW, isCrit: false };
    if(/CROSS ?BOW/.test(n))              return { ...MISSILE_TABLE.SHORT_BOW, isCrit: false };
    return { ...MISSILE_TABLE.DEFAULT, isCrit: false };
}

function calcMissileDamage(cardName){
    const tbl = _getMissileTable(cardName);
    // dungeon level scales the max range up by 10% per level, keeps level 1 easy
    const dungScale = 1 + (DUNGEON_LEVEL - 1) * 0.10;
    const lo = tbl.min;
    const hi = Math.round(tbl.max * dungScale);
    let dmg = lo + Math.floor(Math.random() * (hi - lo + 1));
    const isCrit = Math.random() < tbl.crit;
    if(isCrit) dmg = Math.round(dmg * tbl.critMult);
    return { dmg, isCrit };
}

function calcSpellDamage(cardName){
    // Base × level × floor, then roll a random 2×–6× power multiplier per cast.
    // Level 1 goblins (50hp): expect 20–120 per spell — spells feel magical & dangerous.
    const base = 10 * playerStats.level * DUNGEON_LEVEL;
    const roll = 0.75 + Math.random() * 0.5;
    const powerMult = 2 + Math.random() * 4; // 2× to 6× variance — wild spell power
    return Math.round(base * roll * powerMult);
}

function calcDamage(cardName){
    // Missiles are handled separately via calcMissileDamage
    if(_isMissileCard(cardName)) return calcMissileDamage(cardName).dmg;
    const cat = _cardCategory(cardName);
    if(cat === 'SPELL') return calcSpellDamage(cardName);
    const { baseDmg, scaling } = CARD_TYPES[cat] || CARD_TYPES.DEFAULT;
    const lvlBonus  = 1 + (playerStats.level - 1) * 0.12;
    const dungMult  = 1 + (DUNGEON_LEVEL - 1) * 0.10;
    const raw = baseDmg * scaling * lvlBonus * dungMult;
    const roll = 0.80 + Math.random() * 0.40;
    return Math.round(raw * roll);
}

// ── Active boulder list (for physics tick) ───────────────────────────────────
const activeBoulders = [];

function _boulderCrumble(b){
    // Spawn 8 small rock shards that scatter, then fade
    const shardMat = new THREE.MeshBasicMaterial({color:0x5a4428});
    for(let k=0; k<8; k++){
        const sg = new THREE.DodecahedronGeometry(0.08 + Math.random()*0.12, 0);
        const sm = new THREE.Mesh(sg, shardMat);
        sm.position.copy(b.mesh.position);
        scene.add(sm);
        const vel = new THREE.Vector3(
            (Math.random()-0.5)*5, Math.random()*3+1, (Math.random()-0.5)*5
        );
        let t=0;
        const animShard = ()=>{
            t+=0.016;
            vel.y -= 9.8*0.016;
            sm.position.addScaledVector(vel, 0.016);
            sm.rotation.x += 0.12; sm.rotation.z += 0.09;
            sm.material.opacity = Math.max(0, 1-t*1.5);
            if(!sm.material.transparent){ sm.material.transparent=true; }
            if(t < 0.8) requestAnimationFrame(animShard);
            else scene.remove(sm);
        };
        requestAnimationFrame(animShard);
    }
    // Dust burst light
    const dustL = new THREE.PointLight(0xcc8833, 8, 5);
    dustL.position.copy(b.mesh.position);
    scene.add(dustL);
    setTimeout(()=>scene.remove(dustL), 400);
    window.parent.postMessage({type:'LOG_EVENT',logType:'combat',
        text:'💥 Boulder crumbles into dust!'},'*');
}

function tickBoulders(dt){
    for(let i = activeBoulders.length-1; i >= 0; i--){
        const b = activeBoulders[i];
        // Crumble when distance limit reached
        if(b.distTravelled >= b.maxDist){
            _boulderCrumble(b);
            scene.remove(b.mesh);
            scene.remove(b.light);
            activeBoulders.splice(i,1);
            continue;
        }

        // Spin
        b.mesh.rotation.x += b.vx * dt * 1.5;
        b.mesh.rotation.z += b.vz * dt * 1.5;

        // Gravity + ceiling bounce
        b.vy -= 9.8 * dt;
        const ny = b.mesh.position.y + b.vy * dt;
        if(ny <= 0.45){ b.vy = Math.abs(b.vy)*0.55; b.mesh.position.y = 0.45; }
        else if(ny >= WALL_H - 0.55){ b.vy = -Math.abs(b.vy)*0.55; b.mesh.position.y = WALL_H - 0.55; }
        else b.mesh.position.y = ny;

        // Wall bounce (pinball)
        const nx2 = b.mesh.position.x + b.vx * dt;
        const nz2 = b.mesh.position.z + b.vz * dt;
        const bGx = Math.round(nx2/GRID), bGz = Math.round(nz2/GRID);
        const hitWallX = !!(map[bGx]?.[bGz]?.type === 'wall' || map[bGx]?.[bGz]?.type === 'shoji');
        const hitWallZ = !!(map[Math.round(b.mesh.position.x/GRID)]?.[Math.round(nz2/GRID)]?.type === 'wall');
        if(hitWallX) b.vx *= -0.75;
        if(hitWallZ) b.vz *= -0.75;
        if(!hitWallX) b.mesh.position.x = nx2;
        if(!hitWallZ) b.mesh.position.z = nz2;

        // Track distance and spin bloom ring
        const stepDist = Math.sqrt(b.vx*b.vx + b.vz*b.vz) * dt;
        b.distTravelled += stepDist;
        if(b.bloomRing) b.bloomRing.rotation.x += dt * 3;
        b.light.position.copy(b.mesh.position);
        // Fade bloom ring as boulder nears crumble
        if(b.bloomRing){
            b.bloomRing.material.opacity = 0.7 * (1 - b.distTravelled / b.maxDist);
        }

        // Monster hit check
        for(const w of monsterWrappers){
            if(w.userData.isDead) continue;
            const dx = w.position.x - b.mesh.position.x;
            const dz = w.position.z - b.mesh.position.z;
            if(Math.sqrt(dx*dx+dz*dz) < 1.0 && !b.hitSet.has(w)){
                b.hitSet.add(w);
                const dmg = Math.round(b.damage * (0.7 + Math.random()*0.6));
                _applyMonsterDamage(w, dmg, 'EARTH');
                _spawnHitBurst(w.position.clone().setY(1), 'EARTH');
                // Stun for 1 turn
                w.userData._stunTimer = (w.userData._stunTimer||0) + 2.5;
                window.parent.postMessage({type:'LOG_EVENT', logType:'combat',
                    text:`Boulder crushes ${w.userData.name||'Goblin'}! (STUNNED) -${dmg}`},'*');
            }
        }
    }
}

// ── Missile launch system (arrows, shuriken, crossbow bolts) ─────────────────
const activeMissiles = [];

// Build a realistic 3D arrow model (world scale, tip along -Z)
function _buildArrowModel(){
    const g = new THREE.Group();

    // Shaft — long thin cylinder
    const shaftGeo = new THREE.CylinderGeometry(0.018, 0.024, 1.1, 8);
    shaftGeo.rotateX(Math.PI/2); // point along -Z
    const shaftMat = new THREE.MeshStandardMaterial({color:0x8b6914, roughness:0.9, metalness:0.05});
    const shaft = new THREE.Mesh(shaftGeo, shaftMat);
    g.add(shaft);

    // Steel arrowhead — narrow cone
    const headGeo = new THREE.ConeGeometry(0.038, 0.18, 6);
    headGeo.rotateX(-Math.PI/2); // tip forward (-Z)
    const headMat = new THREE.MeshStandardMaterial({color:0xcccccc, metalness:0.9, roughness:0.18,
        emissive:0x88aaff, emissiveIntensity:0.4});
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.z = -0.64; // at the tip end
    g.add(head);

    // Tip glow — additive halo on arrowhead
    const tipGlowGeo = new THREE.SphereGeometry(0.06, 8, 6);
    const tipGlowMat = new THREE.MeshBasicMaterial({color:0xaaddff, transparent:true, opacity:0.75,
        blending:THREE.AdditiveBlending, depthWrite:false});
    const tipGlow = new THREE.Mesh(tipGlowGeo, tipGlowMat);
    tipGlow.position.z = -0.68;
    g.add(tipGlow);
    g.userData.tipGlow = tipGlow;

    // Fletching — 3 fins at the tail
    const finMat = new THREE.MeshBasicMaterial({color:0xeeeeee, side:THREE.DoubleSide,
        transparent:true, opacity:0.85});
    for(let f=0; f<3; f++){
        const finShape = new THREE.Shape();
        finShape.moveTo(0, 0); finShape.lineTo(0.06, 0.18); finShape.lineTo(0, 0.14);
        finShape.closePath();
        const finGeo = new THREE.ShapeGeometry(finShape);
        const fin = new THREE.Mesh(finGeo, finMat);
        fin.rotation.z = (f/3)*Math.PI*2;
        fin.rotation.y = Math.PI/2;
        fin.position.z = 0.48; // at the nock end
        g.add(fin);
    }

    // Trail light (attached, moves with arrow)
    const trailLight = new THREE.PointLight(0x88bbff, 3, 1.8);
    trailLight.position.z = -0.5;
    g.add(trailLight);
    g.userData.trailLight = trailLight;

    return g;
}

// Build a realistic 3D shuriken model (world scale, spins in flight)
function _buildShurikenModel(){
    const g = new THREE.Group();

    // 4-blade star from extruded shape
    const blade = new THREE.Shape();
    blade.moveTo(0, 0.06);
    blade.lineTo(0.04, 0.04);
    blade.lineTo(0.44, 0.018);
    blade.lineTo(0.04, -0.04);
    blade.lineTo(0, -0.06);
    blade.lineTo(-0.04, -0.04);
    blade.lineTo(-0.44, -0.018);
    blade.lineTo(-0.04, 0.04);
    blade.closePath();
    const starGeo = new THREE.ExtrudeGeometry(blade, {depth:0.022, bevelEnabled:true,
        bevelThickness:0.005, bevelSize:0.005, bevelSegments:2});
    starGeo.center();
    const starMat = new THREE.MeshStandardMaterial({color:0xbbbbbb, metalness:0.85,
        roughness:0.15, emissive:0x334455, emissiveIntensity:0.3, side:THREE.DoubleSide});
    const star1 = new THREE.Mesh(starGeo, starMat);
    const star2 = star1.clone();
    star2.rotation.z = Math.PI/4;
    g.add(star1, star2);

    // Glow ring
    const gRingGeo = new THREE.TorusGeometry(0.28, 0.018, 6, 24);
    const gRingMat = new THREE.MeshBasicMaterial({color:0xaaddff, transparent:true, opacity:0.5,
        blending:THREE.AdditiveBlending, depthWrite:false});
    g.add(new THREE.Mesh(gRingGeo, gRingMat));

    const trailLight = new THREE.PointLight(0x88ccff, 2.5, 1.5);
    g.add(trailLight);
    g.userData.trailLight = trailLight;

    return g;
}

// ── OniBaba auto-targeting ───────────────────────────────────────────────────
// Single entry point for all card/missile/spell launches. Routes through
// OniBaba8.getAutoTarget so she tracks attacks, applies hive-mind dodge,
// triggers monster retaliation, and manages karma.
function _obAutoTarget(cardName, dmg){
    const ob = window.oniBaba8 || window.parent?.oniBaba8;
    if(ob && typeof ob.getAutoTarget === 'function'){
        return ob.getAutoTarget(px, pz, monsterWrappers, cardName, dmg);
    }
    // Fallback: plain nearest-monster search if OniBaba not loaded
    let best=null, bestD=Infinity;
    for(const w of monsterWrappers){
        if(w.userData?.isDead) continue;
        const d=Math.hypot(w.position.x-px, w.position.z-pz);
        if(d<bestD){bestD=d;best=w;}
    }
    return best;
}

function _isMissileCard(name){
    const n = (name||'').toUpperCase();
    return /LONG BOW|LONGBOW|SHORT BOW|SHORTBOW|BOW|SHURIKEN|CROSSBOW|BOLT|DAGGER|THROWING/.test(n);
}

function _isShuriken(name){
    return /SHURIKEN|THROWING STAR|STAR/.test((name||'').toUpperCase());
}

function launchMissile(cardName, recoveryCallback){
    const isShuriken = _isShuriken(cardName);
    const { dmg, isCrit } = calcMissileDamage(cardName);

    // Build the right model
    const missileGroup = isShuriken ? _buildShurikenModel() : _buildArrowModel();

    // Spawn at camera position, slightly offset right (hand position)
    const spawnOffset = new THREE.Vector3(0.22, -0.12, -0.35);
    spawnOffset.applyEuler(camera.rotation);
    missileGroup.position.copy(camera.position).add(spawnOffset);
    scene.add(missileGroup);

    // Auto-aim via OniBaba — she picks target, logs to hive-mind, triggers retaliate
    const target = _obAutoTarget(cardName, dmg);

    // Compute initial velocity with gravity arc
    // Direction: toward target mid-body, or straight camera forward
    const fwd = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
    let aimDir;
    if(target){
        const aimPt = target.position.clone().setY(target.position.y + 1.3); // chest height
        aimDir = aimPt.sub(missileGroup.position).normalize();
    } else {
        aimDir = fwd.clone();
    }

    const SPEED = isShuriken ? 14 : 18; // shuriken slower, arrow faster
    const vel = aimDir.clone().multiplyScalar(SPEED);
    // Upward arc kick so arrow crests over mid-range, hits torso not feet
    if(!isShuriken) vel.y += 2.2;

    // Orient missile along velocity direction
    missileGroup.lookAt(missileGroup.position.clone().add(vel));
    if(!isShuriken){
        // Arrow model points -Z, lookAt gives +Z → flip
        missileGroup.rotateY(Math.PI);
    }

    activeMissiles.push({
        mesh: missileGroup,
        vel,
        gravity: isShuriken ? 2.0 : 3.8,
        dmg, isCrit,
        cardName,
        isShuriken,
        target,
        life: 3.5,
        lodged: false,
        spinZ: 0,
        recoveryCallback
    });

    // Camera kick
    addCameraTrauma(0.12);

    // Aggro
    const pgx = Math.round(px/GRID), pgz = Math.round(pz/GRID);
    aggroRoom(map[pgx]?.[pgz]?.roomId);
}

function tickMissiles(dt){
    for(let i = activeMissiles.length-1; i >= 0; i--){
        const m = activeMissiles[i];
        if(m.lodged){
            m.lodgeTimer -= dt;
            const tf = Math.max(0, m.lodgeTimer / 2.8);
            // Persistent bloom: pulse light + update position to follow monster
            if(m.lodgeLight){
                // Light is parented to monster — just fade intensity, no position update needed
                m.lodgeLight.intensity = (4 + Math.sin(performance.now()*0.006)*2) * tf;
            }
            if(m.bloomRing){
                m.bloomRing.rotation.z += dt * 1.2;
                m.bloomRing.material.opacity = 0.55 * tf;
            }
            if(m.lodgeTimer <= 0){
                // Remove from monster parent (not scene)
                const par = m.lodgeParent || scene;
                par.remove(m.mesh);
                if(m.lodgeLight){ par.remove(m.lodgeLight); m.lodgeLight = null; }
                if(m.bloomRing){ par.remove(m.bloomRing); m.bloomRing = null; }
                if(m.bloomRing2){ par.remove(m.bloomRing2); m.bloomRing2 = null; }
                activeMissiles.splice(i, 1);
            }
            continue;
        }

        m.life -= dt;
        if(m.life <= 0){ scene.remove(m.mesh); activeMissiles.splice(i, 1); continue; }

        // Apply gravity
        m.vel.y -= m.gravity * dt;

        // Soft homing correction — steer 8% toward target chest per tick
        // Damage is pre-rolled so this is purely cosmetic trajectory assistance
        if(m.target && !m.target.userData.isDead){
            const chestPt = m.target.position.clone().setY(m.target.position.y + 1.3); // chest height
            const toChest = chestPt.sub(m.mesh.position);
            const distToTarget = toChest.length();
            if(distToTarget > 0.5){
                toChest.normalize().multiplyScalar(m.vel.length());
                m.vel.lerp(toChest, Math.min(0.08, dt * 3));
            }
        }

        // Step position
        m.mesh.position.addScaledVector(m.vel, dt);

        // Orient along velocity direction each frame (realistic flight rotation)
        if(m.vel.lengthSq() > 0.01){
            const lookTarget = m.mesh.position.clone().add(m.vel);
            m.mesh.lookAt(lookTarget);
            if(!m.isShuriken) m.mesh.rotateY(Math.PI); // arrow -Z tip correction
        }

        // Shuriken spins in flight
        if(m.isShuriken){
            m.spinZ += dt * 22;
            m.mesh.rotateZ(dt * 22);
        }

        // Tip glow flicker
        const tg = m.mesh.userData.tipGlow;
        if(tg) tg.material.opacity = 0.6 + Math.sin(performance.now()*0.004)*0.12;
        const tl = m.mesh.userData.trailLight;
        if(tl) tl.intensity = 2.5 + Math.sin(performance.now()*0.008)*0.3;

        // Wall hit — stop
        const gx = Math.round(m.mesh.position.x/GRID);
        const gz = Math.round(m.mesh.position.z/GRID);
        const cell = map[gx]?.[gz];
        if(cell && (cell.type==='wall'||cell.type==='shoji')){
            scene.remove(m.mesh); activeMissiles.splice(i,1); continue;
        }
        if(m.mesh.position.y < 0 || m.mesh.position.y > WALL_H + 0.5){
            scene.remove(m.mesh); activeMissiles.splice(i,1); continue;
        }

        // Monster hit detection
        let hit = false;
        for(const w of monsterWrappers){
            if(w.userData.isDead) continue;
            const dx = w.position.x - m.mesh.position.x;
            const dy = (w.position.y+0.9) - m.mesh.position.y;
            const dz = w.position.z - m.mesh.position.z;
            if(Math.sqrt(dx*dx+dy*dy+dz*dz) < 0.85){
                hit = true;
                _onMissileHit(m, w, i);
                break;
            }
        }
    }
}

function _onMissileHit(m, targetWrapper, idx){
    const ud = targetWrapper.userData;

    // Apply damage — show CRIT! text if critical
    _applyMonsterDamage(targetWrapper, m.dmg, 'DEFAULT');
    if(m.isCrit){
        const critPos = targetWrapper.position.clone(); critPos.y += 1.6;
        spawnDamageText('CRIT!', critPos, false);
    }

    // Camera shake + hitstop
    addCameraTrauma(m.isCrit ? 0.35 : 0.18);
    triggerHitStop(m.isCrit ? 90 : 55);

    // Lodge — arrow sticks out of monster, parented so it moves with them
    m.lodged = true;
    m.lodgeTimer = 2.8;
    m.lodgeTarget = targetWrapper;

    // Detach from scene and re-parent to the monster wrapper
    scene.remove(m.mesh);
    targetWrapper.add(m.mesh);
    m.mesh.scale.setScalar(0.85); // full-size lodged arrow visible as protrusion

    // Position at chest in local monster space (y+1.2 = center mass)
    const chestLocal = new THREE.Vector3(0, 1.2, 0);
    // Random slight offset so multiple arrows spread across torso
    chestLocal.x += (Math.random()-0.5)*0.35;
    chestLocal.z += (Math.random()-0.5)*0.25;
    m.mesh.position.copy(chestLocal);

    // Orient the shaft so the tip faces INTO the body and shaft protrudes OUT
    // Arrow model points -Z at tip; we want tip pointing roughly toward monster center
    // Get the incoming flight direction world-space
    const impactDir = m.vel.clone().normalize();
    // Convert to local monster space
    const monWorldQuat = new THREE.Quaternion();
    targetWrapper.getWorldQuaternion(monWorldQuat);
    impactDir.applyQuaternion(monWorldQuat.invert());
    // Point the arrow group so its -Z aligns with impactDir (tip into body)
    const arrowFwd = impactDir.clone().negate(); // shaft faces opposite = protrudes out
    if(arrowFwd.lengthSq() > 0.001){
        const up = Math.abs(arrowFwd.y) > 0.95 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
        const rotMat = new THREE.Matrix4().lookAt(new THREE.Vector3(), arrowFwd, up);
        m.mesh.quaternion.setFromRotationMatrix(rotMat);
        m.mesh.rotateY(Math.PI); // arrow -Z tip correction
    }

    // Bright white impact flash (very brief)
    const flash = new THREE.PointLight(0xffffff, 24, 3.5);
    flash.position.set(0, 1.2, 0);
    targetWrapper.add(flash);
    setTimeout(()=>targetWrapper.remove(flash), 130);

    // ── Persistent bloom light — parented to monster, follows movement ──
    const bloomColor = m.isShuriken ? 0x88ffdd : 0x88bbff;
    const lodgeGlow = new THREE.PointLight(bloomColor, 5, 2.8);
    lodgeGlow.position.set(0, 1.2, 0);
    targetWrapper.add(lodgeGlow);
    m.lodgeLight = lodgeGlow;
    m.lodgeParent = targetWrapper; // track so we can remove from correct parent

    // Spinning bloom ring halo (parented to monster)
    const bRingGeo = new THREE.TorusGeometry(0.55, 0.055, 8, 32);
    const bRingMat = new THREE.MeshBasicMaterial({
        color: bloomColor, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
    const bloomRing = new THREE.Mesh(bRingGeo, bRingMat);
    bloomRing.position.set(0, 1.2, 0);
    bloomRing.rotation.x = Math.PI / 2;
    targetWrapper.add(bloomRing);
    m.bloomRing = bloomRing;

    // Crit gets a second larger ring
    if(m.isCrit){
        const bRingGeo2 = new THREE.TorusGeometry(0.9, 0.04, 8, 32);
        const bRing2 = new THREE.Mesh(bRingGeo2, bRingMat.clone());
        bRing2.position.set(0, 1.2, 0);
        bRing2.rotation.x = -Math.PI / 3;
        targetWrapper.add(bRing2);
        m.bloomRing2 = bRing2;
    }

    // 50% chance: missile survives — notify panels to restore ammo
    const survives = Math.random() < 0.5;
    if(survives && m.recoveryCallback){
        m.recoveryCallback(m.cardName);
        window.parent.postMessage({type:'LOG_EVENT', logType:'loot',
            text:`${m.isShuriken?'Shuriken':'Arrow'} recovered! (+1 ammo)`},'*');
    }

    // Lean missile into the body
    m.mesh.rotation.x += (Math.random()-0.5)*0.3;
    m.mesh.rotation.z += (Math.random()-0.5)*0.3;
}
